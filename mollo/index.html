<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Mollo !</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="mollo.css">
</head>
<body>
<div id="stage"></div>

<div id="hud" hidden>
  <div class="labels" id="labels"></div>
  <div class="score" id="score"></div>
  <div class="round" id="round"></div>
  <div class="gust" id="gust" hidden></div>
  <div class="feed" id="feed"></div>
  <div class="banner" id="banner" hidden></div>
  <div class="prompt" id="prompt" hidden></div>
  <div class="toast" id="toast" hidden></div>
  <div class="stick" id="stick" hidden><i></i></div>
  <div class="tr"><button class="icon" id="btnSet" title="Réglages" aria-label="Réglages"></button><button class="icon" id="btnMenu" title="Menu (Échap)" aria-label="Menu">☰</button></div>
  <div class="tbtns" id="tbtns"><div class="col"><button data-a="grab" aria-label="Saisir">✋<small>Saisir</small></button><button data-a="jump" aria-label="Sauter">⬆️<small>Sauter</small></button></div><button data-a="punch" class="big" aria-label="Frapper">👊<small>Frapper</small></button></div>
</div>

<div id="screen" class="screen"></div>

<script src="../shared/bridge.js"></script>
<script src="../shared/volume.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
