cvs.addEventListener('wheel', (e) => {
  e.preventDefault();
  cam.z = clamp(cam.z * (e.deltaY < 0 ? 1.1 : 0.9), 0.44, 1.35);
}, { passive: false });

function findEntityAt(wx, wy) {
  if (!state) return null;
  for (const u of state.units) {
    if (u.hp > 0 && dist2(wx, wy, u.x, u.y) <= (u.radius + 10) ** 2) return { type: 'unit', ent: u };
  }
  for (const b of state.buildings) {
    if (b.hp > 0 && dist2(wx, wy, b.x, b.y) <= (b.radius + 8) ** 2) return { type: 'bld', ent: b };
  }
  for (const m of MINERAL_NODES) {
    if (dist2(wx, wy, m.x, m.y) <= 28 * 28) return { type: 'min', ent: m };
  }
  for (const g of GAS_GEYSERS) {
    if (dist2(wx, wy, g.x, g.y) <= 32 * 32) return { type: 'gas', ent: g };
  }
  return null;
}

function issueSmartRightClick(wx, wy) {
  if (!state) return;
  cleanSelection();
  const hit = findEntityAt(wx, wy);
  const me = state.players.find((p) => p.id === myId);

  // Si on a sélectionné des bâtiments de production (et pas d'unités), le clic droit place le Point de Ralliement
  if (selectedUnits.size === 0 && selectedBlds.size > 0) {
    sendCommand({ op: 'UNIT_ORDER', mode: 'rally', x: wx, y: wy, bldIds: [...selectedBlds] });
    orderMarkers.push({ x: wx, y: wy, color: '#ffc531', life: 0.45, maxLife: 0.45 });
    return;
  }

  // Par défaut, si aucune unité n'est sélectionnée, on commande toute l'armée de combat
  let unitIds = [...selectedUnits];
  if (!unitIds.length) {
    unitIds = state.units.filter((u) => u.owner === myId && u.kind !== 'scv' && u.hp > 0).map((u) => u.id);
  }
  if (!unitIds.length) return;

  const onlyScvs = unitIds.every((id) => state.units.find((u) => u.id === id)?.kind === 'scv');

  if (hit) {
    // Clic droit sur un ennemi -> Focus Fire !
    if ((hit.type === 'unit' || hit.type === 'bld') && me && hit.ent.team !== me.team) {
      sendCommand({ op: 'UNIT_ORDER', mode: 'focus', targetId: hit.ent.id, x: hit.ent.x, y: hit.ent.y, unitIds });
      orderMarkers.push({ x: hit.ent.x, y: hit.ent.y, color: '#ff4b2b', life: 0.45, maxLife: 0.45 });
      return;
    }
    // Clic droit d'un Ouvrier sur un Minéral -> Récolter Minéraux
    if (hit.type === 'min' && onlyScvs) {
      sendCommand({ op: 'UNIT_ORDER', mode: 'harvest_min', resId: hit.ent.id, x: hit.ent.x, y: hit.ent.y, unitIds });
      orderMarkers.push({ x: hit.ent.x, y: hit.ent.y, color: '#1fc7c1', life: 0.45, maxLife: 0.45 });
      return;
    }
    // Clic droit d'un Ouvrier sur une Raffinerie alliée -> Récolter Gaz
    if (hit.type === 'bld' && hit.ent.owner === myId && hit.ent.kind === 'extractor' && !hit.ent.constructing && onlyScvs) {
      sendCommand({ op: 'UNIT_ORDER', mode: 'harvest_gas', resId: hit.ent.id, x: hit.ent.x, y: hit.ent.y, unitIds });
      orderMarkers.push({ x: hit.ent.x, y: hit.ent.y, color: '#2fbf71', life: 0.45, maxLife: 0.45 });
      return;
    }
    // Clic droit d'un Ouvrier sur un Chantier ou bâtiment allié endommagé -> Construire / Réparer
    if (hit.type === 'bld' && hit.ent.owner === myId && (hit.ent.constructing || hit.ent.hp < hit.ent.maxHp) && onlyScvs) {
      sendCommand({ op: 'UNIT_ORDER', mode: 'build', targetId: hit.ent.id, x: hit.ent.x, y: hit.ent.y, unitIds });
      orderMarkers.push({ x: hit.ent.x, y: hit.ent.y, color: '#ffc531', life: 0.45, maxLife: 0.45 });
      return;
    }
  }

  // Sinon : Déplacement standard (Move)
  sendCommand({ op: 'UNIT_ORDER', mode: 'move', x: wx, y: wy, unitIds });
  orderMarkers.push({ x: wx, y: wy, color: '#2fbf71', life: 0.42, maxLife: 0.42 });
}

cvs.addEventListener('pointerdown', (e) => {
  const rect = cvs.getBoundingClientRect();
  mouse.x = e.clientX - rect.left;
  mouse.y = e.clientY - rect.top;
  const w = screenToWorld(mouse.x, mouse.y);
  mouse.wx = w.x; mouse.wy = w.y;

  if (e.button === 1 || (e.button === 0 && e.altKey)) {
    mouse.panning = true;
    mouse.panStart = { x: e.clientX, y: e.clientY, cx: cam.x, cy: cam.y };
    return;
  }

  // CLIC DROIT : Annuler mode en cours ou Ordre contextuel StarCraft
  if (e.button === 2) {
    if (buildMode || orderCursor) {
      buildMode = null; orderCursor = null; updateCursorClass(); renderConsoleUI(true);
      return;
    }
    issueSmartRightClick(w.x, w.y);
    return;
  }

  // CLIC GAUCHE : Scan Radar, A-Move, Pose de bâtiment ou Sélection Box
  if (e.button === 0) {
    if (orderCursor === 'scan') {
      sendCommand({ op: 'SCAN', x: w.x, y: w.y });
      orderCursor = null; updateCursorClass();
      return;
    }
    if (orderCursor === 'amove') {
      let unitIds = [...selectedUnits];
      if (!unitIds.length && state) {
        unitIds = state.units.filter((u) => u.owner === myId && u.kind !== 'scv' && u.hp > 0).map((u) => u.id);
      }
      sendCommand({ op: 'UNIT_ORDER', mode: 'amove', x: w.x, y: w.y, unitIds });
      orderMarkers.push({ x: w.x, y: w.y, color: '#ff4b2b', life: 0.45, maxLife: 0.45 });
      orderCursor = null; updateCursorClass();
      return;
    }
    if (buildMode) {
      sendCommand({ op: 'BUILD', kind: buildMode, x: w.x, y: w.y, unitIds: [...selectedUnits] });
      if (buildMode !== 'wall' && !e.shiftKey) {
        buildMode = null;
        cmdTab = 'auto';
        updateCursorClass();
        renderConsoleUI(true);
      }
      return;
    }
    mouse.down = true;
    mouse.dragStart = { sx: mouse.x, sy: mouse.y, wx: w.x, wy: w.y, shift: e.shiftKey, ctrl: e.ctrlKey };
  }
});

window.addEventListener('pointermove', (e) => {
  const rect = cvs.getBoundingClientRect();
  mouse.x = e.clientX - rect.left;
  mouse.y = e.clientY - rect.top;
  const w = screenToWorld(mouse.x, mouse.y);
  mouse.wx = w.x; mouse.wy = w.y;

  if (mouse.panning && mouse.panStart) {
    cam.x = clamp(mouse.panStart.cx - (e.clientX - mouse.panStart.x) / cam.z, 0, WORLD_SIZE);
    cam.y = clamp(mouse.panStart.cy - (e.clientY - mouse.panStart.y) / cam.z, 0, WORLD_SIZE);
  }
});

window.addEventListener('pointerup', () => {
  if (mouse.panning) { mouse.panning = false; mouse.panStart = null; return; }
  if (!mouse.down) return;
  mouse.down = false;
  if (!state || !mouse.dragStart) return;

  const dx = Math.abs(mouse.x - mouse.dragStart.sx);
  const dy = Math.abs(mouse.y - mouse.dragStart.sy);
  if (!mouse.dragStart.shift) {
    selectedUnits.clear();
    selectedBlds.clear();
  }

  if (dx > 12 || dy > 12) {
    // Rectangle de sélection (Box Select) : priorise les unités de combat si présentes, sinon les Ouvriers
    const x1 = Math.min(mouse.dragStart.wx, mouse.wx), x2 = Math.max(mouse.dragStart.wx, mouse.wx);
    const y1 = Math.min(mouse.dragStart.wy, mouse.wy), y2 = Math.max(mouse.dragStart.wy, mouse.wy);
    const boxed = state.units.filter((u) => u.owner === myId && u.hp > 0 && u.x >= x1 && u.x <= x2 && u.y >= y1 && u.y <= y2);
    const combat = boxed.filter((u) => u.kind !== 'scv');
    const finalUnits = combat.length > 0 ? combat : boxed;
    for (const u of finalUnits) selectedUnits.add(u.id);
    if (selectedUnits.size === 0) {
      for (const b of state.buildings) {
        if (b.owner === myId && b.hp > 0 && b.x >= x1 && b.x <= x2 && b.y >= y1 && b.y <= y2) {
          selectedBlds.add(b.id);
        }
      }
    }
  } else {
    // Clic simple ou Double-Clic (sélectionne toutes les unités du même type à l'écran !)
    const hitU = state.units.find((u) => u.owner === myId && u.hp > 0 && dist2(u.x, u.y, mouse.wx, mouse.wy) <= (u.radius + 12) ** 2);
    if (hitU) {
      const now = performance.now();
      if (mouse.dragStart.ctrl || (lastClickUnit.id === hitU.id && now - lastClickUnit.t < 360)) {
        for (const u of state.units) {
          if (u.owner === myId && u.kind === hitU.kind && u.hp > 0 && hypot(u.x, u.y, cam.x, cam.y) < 900) {
            selectedUnits.add(u.id);
          }
        }
      } else {
        selectedUnits.add(hitU.id);
      }
      lastClickUnit = { id: hitU.id, kind: hitU.kind, t: now };
    } else {
      const hitB = state.buildings.find((b) => b.owner === myId && b.hp > 0 && dist2(b.x, b.y, mouse.wx, mouse.wy) <= (b.radius + 10) ** 2);
      if (hitB) {
        selectedBlds.add(hitB.id);
        cmdTab = 'auto';
      }
    }
  }
  mouse.dragStart = null;
  renderConsoleUI(true);
});

/* ============================================================================
   MISE À JOUR DE LA CONSOLE RTS INFÉRIEURE (PORTRAIT, FILE & COMMAND CARD)
   ============================================================================ */
let lastCmdSig = '';

function renderConsoleUI(force = false) {
  if (!state) return;
  cleanSelection();
  const me = state.players.find((p) => p.id === myId);
  if (!me) return;

  $('#tabAuto').classList.toggle('active', cmdTab === 'auto');
  $('#tabBuild').classList.toggle('active', cmdTab === 'build');

  const myUnits = state.units.filter((u) => u.owner === myId && u.hp > 0);
  const idleScvs = myUnits.filter((u) => u.kind === 'scv' && u.mode === 'idle').length;
  const armyCnt = myUnits.filter((u) => u.kind !== 'scv').length;
  $('#uiIdleCnt').textContent = idleScvs;
  $('#uiArmyCnt').textContent = armyCnt;

  // Groupes de contrôle actifs
  const cgHtml = [];
  for (let g = 1; g <= 5; g++) {
    const grp = controlGroups[g];
    const cnt = (grp?.units?.length || 0) + (grp?.blds?.length || 0);
    if (cnt > 0) {
      cgHtml.push(`<button class="cg-pill" data-cg="${g}"><b>${g}</b><span>(${cnt})</span></button>`);
    }
  }
  const cgBar = $('#uiCgBar');
  if (cgBar.innerHTML !== cgHtml.join('')) {
    cgBar.innerHTML = cgHtml.join('');
    for (const btn of cgBar.querySelectorAll('[data-cg]')) {
      btn.onclick = () => {
        const g = Number(btn.dataset.cg);
        const grp = controlGroups[g];
        selectedUnits = new Set(grp.units || []);
        selectedBlds = new Set(grp.blds || []);
        cleanSelection();
        renderConsoleUI(true);
      };
    }
  }

  // PANNEAU CENTRAL : SÉLECTION
  const selBody = $('#uiSelBody');
  const selU = state.units.filter((u) => selectedUnits.has(u.id));
  const selB = state.buildings.filter((b) => selectedBlds.has(b.id));

  if (selB.length >= 1 && selU.length === 0) {

        <span class="num">${idx + 1}</span>
        ${uDef ? `<span>${uDef.short.slice(0, 3)}</span>` : ''}
      </div>`;
    }).join('');
    const qProg = b.qTotal > 0 ? Math.round((1 - b.qTimer / b.qTotal) * 100) : 0;

    selBody.innerHTML = `
      <div class="portrait-box">
        <canvas width="80" height="68" id="portCvs"></canvas>
        <div class="portrait-hp"><i style="width:${pct}%;background:${pct > 45 ? '#2fbf71' : '#ff4b2b'}"></i></div>
      </div>
      <div class="sel-info">
        <div class="sel-title">${def.name}</div>
        <div class="sel-sub">PV : ${Math.ceil(b.hp)} / ${b.maxHp} ${b.constructing ? `· Construction ${Math.round((b.buildProg || 0) * 100)}%` : ''}</div>
        <div class="sel-stats">
          ${def.dmg ? `<span class="st-chip">⚔️ Dégâts : ${def.dmg}</span>` : ''}
          ${def.supply ? `<span class="st-chip">📦 Ravitaillement : +${def.supply}</span>` : ''}
          <span class="st-chip">${def.desc}</span>
        </div>
      </div>
      ${(def.trains && def.trains.length && !b.constructing) ? `

    drawThumbIcon($('#portCvs'), b.kind, me.color);

  } else if (selU.length === 1) {
    const u = selU[0];

    $('#uiSelHeader').textContent = def.name;
    $('#uiSelSubHint').textContent = 'A + Clic = Attaque-Déplacement · Clic Droit = Ordre';
    const pct = Math.round((u.hp / u.maxHp) * 100);
    selBody.innerHTML = `
      <div class="portrait-box">
        <canvas width="80" height="68" id="portCvs"></canvas>
        <div class="portrait-hp"><i style="width:${pct}%;background:${pct > 45 ? '#2fbf71' : '#ff4b2b'}"></i></div>
      </div>
      <div class="sel-info">
        <div class="sel-title">${def.name} ${u.sieged ? '· [MODE SIÈGE]' : ''} ${u.stimT > 0 ? '· [STIMPACK ⚡]' : ''}</div>
        <div class="sel-sub">PV : ${Math.ceil(u.hp)} / ${u.maxHp} · Coût : ${def.min}💎 ${def.gas ? `${def.gas}🧪` : ''} (${def.supply} 📦)</div>
        <div class="sel-stats">
          <span class="st-chip">⚔️ Dégâts : ${u.sieged ? def.siegeDmg : def.dmg}</span>
          <span class="st-chip">🎯 Portée : ${u.sieged ? def.siegeRange : def.range}</span>
          <span class="st-chip">💨 Vitesse : ${u.sieged ? 0 : def.speed}</span>
        </div>
      </div>
    `;
    drawThumbIcon($('#portCvs'), u.kind, me.color);
  } else if (selU.length > 1) {
    $('#uiSelHeader').textContent = `Escouade sélectionnée (${selU.length} unités)`;
    $('#uiSelSubHint').textContent = 'Clic = Isoler · A + Clic = Attaque-Déplacement · T = Stimpack · E = Siège';
    selBody.innerHTML = `<div class="multi-grid">${selU.slice(0, 24).map((u) => {
      const def = UNITS[u.kind];
      const pct = Math.round((u.hp / u.maxHp) * 100);
      return `<div class="u-card ${u.stimT > 0 ? 'stim' : ''} ${u.sieged ? 'siege' : ''}" data-pick-u="${u.id}">
        <span class="u-nm">${def.short}</span>
        <span class="u-badge">${u.sieged ? '💥' : u.stimT > 0 ? '⚡' : '⚔️'}</span>
        <div class="u-hp"><i style="width:${pct}%;background:${pct > 45 ? '#2fbf71' : '#ff4b2b'}"></i></div>
      </div>`;
    }).join('')}</div>`;
    for (const card of selBody.querySelectorAll('[data-pick-u]')) {
      card.onclick = (ev) => {
        const id = Number(card.dataset.pickU);
        const targetU = state.units.find((x) => x.id === id);
        if (ev.ctrlKey && targetU) {
          selectedUnits = new Set(selU.filter((x) => x.kind === targetU.kind).map((x) => x.id));
        } else {
          selectedUnits = new Set([id]);
        }
        renderConsoleUI(true);
      };
    }
  } else {
    $('#uiSelHeader').textContent = 'Commandement Tactique';
    $('#uiSelSubHint').textContent = 'Sélectionne tes unités ou bâtiments (ou utilise F1-F4)';
    selBody.innerHTML = `
      <div class="sel-info">
        <div class="sel-title">Aucune sélection active</div>
        <div class="sel-sub">Astuces StarCraft :</div>
        <div class="sel-stats">
          <span class="st-chip">🖱️ Glisser : Sélectionner tes unités</span>
          <span class="st-chip">⌨️ A + Clic : Attaque-Déplacement (A-Move)</span>

  const firstB = selB[0] || null;
  let modeKey = cmdTab === 'build' ? 'BUILD' : firstB ? `BLD_${firstB.kind}` : hasScv && selU.length === selectedUnits.size ? 'SCV' : selU.length > 0 ? 'ARMY' : 'GLOBAL';
  const sig = `${modeKey}|${buildMode}|${orderCursor}|${Math.floor(me.minerals / 5)}|${Math.floor(me.gas / 5)}|${me.color}`;
  if (!force && sig === lastCmdSig) return;
  lastCmdSig = sig;

  const grid = $('#uiCmdGrid');
  const cards = [];

  if (modeKey === 'BUILD' || modeKey === 'SCV') {
    $('#uiCmdTitle').textContent = 'Construction (VCS)';

      ['pylon', '1'], ['extractor', '2'], ['barracks', '3'], ['factory', '4'],
      ['turret', '5'], ['tesla', '6'], ['wall', '7'], ['hq', '8'],
    ];
    for (const [k, key] of bList) {
      const def = BUILDINGS[k];

        <span class="cost-tag">${def.min}💎${def.gas ? ` ${def.gas}🧪` : ''}</span>
        <canvas class="thumb" width="64" height="44" data-thumb="${k}"></canvas>
        <span class="lbl-b">${def.short}</span>
      </button>`);
    }
    cards.push(`<button class="cbtn ${orderCursor === 'amove' ? 'sel' : ''}" data-cmd-act="amove" title="Attaque-Déplacement (A)">
      <span class="key">A</span><span class="ico-txt">🎯</span><span class="lbl-b">Attaquer</span>
    </button>`);
    cards.push(`<button class="cbtn" data-cmd-act="harvest" title="Envoyer récolter les minéraux les plus proches">
      <span class="key">R</span><span class="ico-txt">💎</span><span class="lbl-b">Récolter</span>
    </button>`);
    cards.push(`<button class="cbtn" data-cmd-act="stop" title="Stopper (S)">
      <span class="key">S</span><span class="ico-txt">✋</span><span class="lbl-b">Stop</span>
    </button>`);
    cards.push(`<button class="cbtn ${orderCursor === 'scan' ? 'sel' : ''}" data-cmd-act="scan" title="Scan Radar Comsat (50💎) : révèle le brouillard de guerre">
      <span class="key">X</span><span class="cost-tag">50💎</span><span class="ico-txt">📡</span><span class="lbl-b">Scan Radar</span>
    </button>`);

  } else if (modeKey.startsWith('BLD_')) {
    const bDef = BUILDINGS[firstB.kind];
    $('#uiCmdTitle').textContent = `Production · ${bDef.short}`;
    const keysMap = ['Q', 'W', 'E', 'R'];
    (bDef.trains || []).forEach((uKind, idx) => {
      const uDef = UNITS[uKind];
      const cant = me.minerals < uDef.min || me.gas < uDef.gas;
      cards.push(`<button class="cbtn ${cant ? 'cant' : ''}" data-cmd-train="${uKind}" title="Entraîner ${uDef.name} — ${uDef.desc}">
        <span class="key">${keysMap[idx]}</span>
        <span class="cost-tag">${uDef.min}💎${uDef.gas ? ` ${uDef.gas}🧪` : ''}</span>
        <canvas class="thumb" width="64" height="44" data-thumb="${uKind}"></canvas>
        <span class="lbl-b">${uDef.short}</span>
      </button>`);
    });
    cards.push(`<button class="cbtn ${orderCursor === 'scan' ? 'sel' : ''}" data-cmd-act="scan" title="Scan Radar Comsat (50💎)">
      <span class="key">X</span><span class="cost-tag">50💎</span><span class="ico-txt">📡</span><span class="lbl-b">Scan Radar</span>
    </button>`);
    cards.push(`<button class="cbtn" data-cmd-act="open_build" title="Ouvrir le menu de construction (B)">
      <span class="key">B</span><span class="ico-txt">🏗️</span><span class="lbl-b">Construire</span>
    </button>`);

  } else if (modeKey === 'ARMY') {
    $('#uiCmdTitle').textContent = 'Ordres Tactiques';
    cards.push(`<button class="cbtn ${orderCursor === 'amove' ? 'sel' : ''}" data-cmd-act="amove" title="Attaque-Déplacement (A + Clic gauche)">
      <span class="key">A</span><span class="ico-txt">⚔️</span><span class="lbl-b">A-Move</span>
    </button>`);
    cards.push(`<button class="cbtn" data-cmd-act="stop" title="Stopper les unités (S)">
      <span class="key">S</span><span class="ico-txt">✋</span><span class="lbl-b">Stop</span>
    </button>`);
    cards.push(`<button class="cbtn" data-cmd-act="hold" title="Tenir Position (H)">
      <span class="key">H</span><span class="ico-txt">🛡️</span><span class="lbl-b">Tenir Pos.</span>
    </button>`);
    cards.push(`<button class="cbtn" data-cmd-act="stim" title="Stimpack (T) : +50% vitesse d'attaque et de déplacement pendant 8s (-18 PV)">
      <span class="key">T</span><span class="ico-txt">💉</span><span class="lbl-b">Stimpack</span>
    </button>`);
    cards.push(`<button class="cbtn" data-cmd-act="siege" title="Mode Siège / Mode Char (E) pour les Chars de Siège">
      <span class="key">E</span><span class="ico-txt">💥</span><span class="lbl-b">Mode Siège</span>
    </button>`);
    cards.push(`<button class="cbtn ${orderCursor === 'scan' ? 'sel' : ''}" data-cmd-act="scan" title="Scan Radar Comsat (50💎)">
      <span class="key">X</span><span class="cost-tag">50💎</span><span class="ico-txt">📡</span><span class="lbl-b">Scan Radar</span>
    </button>`);
    cards.push(`<button class="cbtn" data-cmd-act="open_build" title="Construire un bâtiment (B)">
      <span class="key">B</span><span class="ico-txt">🏗️</span><span class="lbl-b">Construire</span>
    </button>`);

  } else {
    // Mode Global (aucune sélection) : Raccourcis directs de production & construction
    $('#uiCmdTitle').textContent = 'Macro-Commandes Rapides';
    const quickTrain = [['scv', 'C'], ['marine', 'Q'], ['rocket', 'W'], ['sapper', 'E'], ['tank', 'R'], ['siege', 'T'], ['titan', 'Y']];
    for (const [uKind, key] of quickTrain) {
      const uDef = UNITS[uKind];
      const cant = me.minerals < uDef.min || me.gas < uDef.gas;
      cards.push(`<button class="cbtn ${cant ? 'cant' : ''}" data-cmd-train="${uKind}" title="Produire ${uDef.name} (${uDef.min}💎 ${uDef.gas ? `${uDef.gas}🧪` : ''})">
        <span class="key">${key}</span>
        <span class="cost-tag">${uDef.min}💎${uDef.gas ? ` ${uDef.gas}🧪` : ''}</span>
        <canvas class="thumb" width="64" height="44" data-thumb="${uKind}"></canvas>
        <span class="lbl-b">${uDef.short}</span>
      </button>`);
    }
    cards.push(`<button class="cbtn" data-cmd-act="open_build" title="Ouvrir le menu de construction (B)">
      <span class="key">B</span><span class="ico-txt">🏗️</span><span class="lbl-b">Construire</span>
    </button>`);
    cards.push(`<button class="cbtn ${orderCursor === 'amove' ? 'sel' : ''}" data-cmd-act="amove" title="Attaque-Déplacement avec toute l'armée (A)">
      <span class="key">A</span><span class="ico-txt">⚔️</span><span class="lbl-b">A-Move</span>
    </button>`);
    cards.push(`<button class="cbtn ${orderCursor === 'scan' ? 'sel' : ''}" data-cmd-act="scan" title="Scan Radar Comsat (50💎)">
      <span class="key">X</span><span class="cost-tag">50💎</span><span class="ico-txt">📡</span><span class="lbl-b">Scan Radar</span>
    </button>`);
  }

  grid.innerHTML = cards.join('');
  for (const c of grid.querySelectorAll('canvas[data-thumb]')) {
    drawThumbIcon(c, c.dataset.thumb, me.color);
  }
  for (const b of grid.querySelectorAll('[data-cmd-build]')) {
    b.onclick = () => {
      const k = b.dataset.cmdBuild;
      orderCursor = null;
      buildMode = buildMode === k ? null : k;
      updateCursorClass();
      renderConsoleUI(true);
    };
  }
  for (const b of grid.querySelectorAll('[data-cmd-train]')) {
    b.onclick = () => {
      const uKind = b.dataset.cmdTrain;
      if (selectedBlds.size > 0) {
        for (const bId of selectedBlds) sendCommand({ op: 'TRAIN', unit: uKind, bldId: bId });
      } else {
        sendCommand({ op: 'TRAIN', unit: uKind });
      }
    };
  }
  for (const b of grid.querySelectorAll('[data-cmd-act]')) {
    b.onclick = () => {
      const act = b.dataset.cmdAct;
      if (act === 'open_build') { cmdTab = 'build'; renderConsoleUI(true); }
      else if (act === 'amove') { buildMode = null; orderCursor = orderCursor === 'amove' ? null : 'amove'; updateCursorClass(); renderConsoleUI(true); }
      else if (act === 'scan') { buildMode = null; orderCursor = orderCursor === 'scan' ? null : 'scan'; updateCursorClass(); renderConsoleUI(true); }
      else if (act === 'stop') sendCommand({ op: 'UNIT_ORDER', mode: 'stop', unitIds: [...selectedUnits] });
      else if (act === 'hold') sendCommand({ op: 'UNIT_ORDER', mode: 'hold', unitIds: [...selectedUnits] });
      else if (act === 'harvest') sendCommand({ op: 'UNIT_ORDER', mode: 'harvest_min', x: cam.x, y: cam.y, unitIds: [...selectedUnits] });
      else if (act === 'stim') sendCommand({ op: 'STIM', unitIds: [...selectedUnits] });
      else if (act === 'siege') sendCommand({ op: 'SIEGE', unitIds: [...selectedUnits] });
    };
  }
}

function updateHudUI() {
  if (!state) return;
  const me = state.players.find((p) => p.id === myId);
  if (me) {
    $('#uiMin').textContent = Math.floor(me.minerals);
    $('#uiGas').textContent = Math.floor(me.gas);
    const scvCnt = state.units.filter((u) => u.owner === myId && u.kind === 'scv' && u.hp > 0).length;
    const refCnt = state.buildings.filter((b) => b.owner === myId && b.kind === 'extractor' && b.hp > 0 && !b.constructing).length;
    $('#uiWorkers').textContent = `${scvCnt} VCS`;
    $('#uiRefineries').textContent = `${refCnt} Raff.`;
    const sup = computeSupply(state, myId);
    const supEl = $('#uiSupply');
    supEl.textContent = `${sup.used}/${sup.max}`;
    supEl.classList.toggle('blocked', sup.used >= sup.max);
  }

  const sec = Math.floor(state.time);
  const mm = String(Math.floor(sec / 60)).padStart(2, '0');
  const ss = String(sec % 60).padStart(2, '0');
  $('#uiClock').textContent = `${mm}:${ss}`;
  const phaseNames = {
    1: 'Phase 1 · Expansion & Scouting',
    2: 'Phase 2 · Escarmouches Tactiques',
    3: 'Phase 3 · Guerre Mécanisée (+20% Dégâts)',
    4: 'MORT SUBITE · Tempête & Dégâts ×1.85',
  };
  $('#uiPhaseName').textContent = phaseNames[state.phase] || '';
  $('#uiPhase').classList.toggle('sd', state.phase === 4);

  $('#uiRoster').innerHTML = state.players.map((p) => `<div class="p-chip ${p.dead ? 'dead' : ''}">
    <span class="dot" style="background:${p.color}"></span>
    <span>${p.name}</span>
  </div>`).join('');

  renderConsoleUI(false);

  const modal = $('#endModal');
  if (state.over && modal.hidden) {
    modal.hidden = false;
    const won = me && !me.dead && me.team === state.winnerTeam;
    $('#endTitle').textContent = won ? '🏆 Victoire !' : '💥 Défaite';
    $('#endSub').textContent = won
      ? 'Tes forces ont conquis le secteur !'
      : 'Tous tes Centres de Commandement ont été détruits.';
    const ordered = state.ranking.map((id) => state.players.find((p) => p.id === id)).filter(Boolean);
    $('#endRanks').innerHTML = ordered.map((p, idx) => `<li>
      <span class="rk">${idx < 3 ? ['🥇', '🥈', '🥉'][idx] : idx + 1}</span>
      <span class="dot" style="background:${p.color}"></span>
      <span>${p.name}${p.bot ? ' 🤖' : ''}</span>
      <span class="sc">${p.score} pts</span>
    </li>`).join('');

    if (!reportedResult && (role === 'host' || role === 'solo') && window.HubBridge && HubBridge.embedded) {
      reportedResult = true;
      HubBridge.report({
        id: `bastion-${Date.now()}`,
        mode: state.mode === '2v2' ? '2v2' : 'RTS',
        players: ordered.map((p, idx) => ({
          id: p.bot ? null : p.id,
          name: p.name,
          color: p.color,
          bot: !!p.bot,
          rank: idx + 1,
          score: p.score,
        })),
      });
    }
  } else if (!state.over && !modal.hidden) {
    modal.hidden = true;
  }
}

/* ============================================================================
   RENDU PRINCIPAL DU MONDE 2.5D & MINIMAP (60 FPS)
   ============================================================================ */
function renderWorld(dt, now) {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = '#142818';
  ctx.fillRect(0, 0, W, H);
  if (!state) return;

  // Déplacement caméra au clavier (Flèches ou ZQSD uniquement avec flèches pour laisser Q/W/E/S aux ordres RTS, ou bord d'écran)
  const panSpd = 680 / cam.z;
  if (keys['arrowup']) cam.y -= panSpd * dt;
  if (keys['arrowdown']) cam.y += panSpd * dt;
  if (keys['arrowleft']) cam.x -= panSpd * dt;
  if (keys['arrowright']) cam.x += panSpd * dt;
  cam.x = clamp(cam.x, 0, WORLD_SIZE);
  cam.y = clamp(cam.y, 0, WORLD_SIZE);

  let shX = 0, shY = 0;
  if (cam.shake > 0.2) {
    shX = (Math.random() - 0.5) * cam.shake * 2;
    shY = (Math.random() - 0.5) * cam.shake * 2;
    cam.shake *= Math.pow(0.04, dt);
  } else cam.shake = 0;

  updateFogCanvas();

  ctx.save();
  ctx.translate(W / 2 + shX, H / 2 + shY);
  ctx.scale(cam.z, cam.z);
  ctx.translate(-cam.x, -cam.y);

  if (terrainCanvas) ctx.drawImage(terrainCanvas, 0, 0);

  for (const c of craters) {
    ctx.fillStyle = 'rgba(18, 20, 26, 0.34)';
    ctx.beginPath(); ctx.arc(c.x, c.y, c.r, 0, TAU); ctx.fill();
  }

  // Gisements de Minéraux 2.5D (Bleus & Dorés)
  for (const m of MINERAL_NODES) {
    const r = m.rich ? 21 : 17;
    const { ox, oy } = roofOffset(m.x, m.y, 24);
    ctx.save();
    ctx.translate(m.x, m.y);
    ctx.fillStyle = m.rich ? 'rgba(255, 197, 49, 0.2)' : 'rgba(31, 199, 193, 0.2)';
    ctx.beginPath(); ctx.arc(0, 0, r * 1.4, 0, TAU); ctx.fill();
    ctx.fillStyle = m.rich ? '#d99b16' : '#128c88';
    ctx.strokeStyle = '#16181d';
    ctx.lineWidth = 3;
    ctx.beginPath();
    for (let i = 0; i < 6; i++) {
      const a = (i / 6) * TAU - Math.PI / 2;
      const px = Math.cos(a) * r, py = Math.sin(a) * r;
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = m.rich ? '#ffc531' : '#1fc7c1';
    ctx.beginPath();
    for (let i = 0; i < 6; i++) {
      const a = (i / 6) * TAU - Math.PI / 2;
      const px = ox * 0.55 + Math.cos(a) * r * 0.65, py = oy * 0.55 + Math.sin(a) * r * 0.65;
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.restore();
  }

  // Geysers de Gaz Plasma (Cratères fumants verts)
  for (const gey of GAS_GEYSERS) {
    ctx.save();
    ctx.translate(gey.x, gey.y);
    ctx.fillStyle = '#38463d';
    ctx.strokeStyle = '#16181d';
    ctx.lineWidth = 3.5;
    ctx.beginPath(); ctx.arc(0, 0, 26, 0, TAU); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#193322';
    ctx.beginPath(); ctx.arc(0, 0, 15, 0, TAU); ctx.fill();
    const pulse = 10 + Math.sin(now * 0.006 + gey.x) * 3;
    ctx.fillStyle = 'rgba(47, 191, 113, 0.55)';
    ctx.beginPath(); ctx.arc(0, 0, pulse, 0, TAU); ctx.fill();
    ctx.restore();
  }

  // Rochers 2.5D
  for (const rk of ROCKS) {
    const { ox, oy } = roofOffset(rk.x, rk.y, 26);
    ctx.save();
    ctx.translate(rk.x, rk.y);
    drawCylinder25D(ctx, rk.r, ox * 0.55, oy * 0.55, '#59544b', '#7d776b');
    ctx.restore();
  }

  // Connexions des Murs
  const walls = state.buildings.filter((b) => b.kind === 'wall' && b.hp > 0 && isVisibleToMe(b.x, b.y));
  ctx.strokeStyle = '#16181d'; ctx.lineWidth = 22;
  for (let i = 0; i < walls.length; i++) {
    for (let j = i + 1; j < walls.length; j++) {
      if (walls[i].team === walls[j].team && dist2(walls[i].x, walls[i].y, walls[j].x, walls[j].y) <= 58 * 58) {
        ctx.beginPath(); ctx.moveTo(walls[i].x, walls[i].y); ctx.lineTo(walls[j].x, walls[j].y); ctx.stroke();
      }
    }
  }
  ctx.strokeStyle = '#c8ba9b'; ctx.lineWidth = 14;
  for (let i = 0; i < walls.length; i++) {
    for (let j = i + 1; j < walls.length; j++) {
      if (walls[i].team === walls[j].team && dist2(walls[i].x, walls[i].y, walls[j].x, walls[j].y) <= 58 * 58) {
        ctx.beginPath(); ctx.moveTo(walls[i].x, walls[i].y); ctx.lineTo(walls[j].x, walls[j].y); ctx.stroke();
      }
    }
  }

  // Points de Ralliement des bâtiments sélectionnés
  for (const b of state.buildings) {
    if (selectedBlds.has(b.id) && b.rallyX != null && b.rallyY != null && (BUILDINGS[b.kind]?.trains || []).length > 0) {
      ctx.save();
      ctx.strokeStyle = '#ffc531';
      ctx.lineWidth = 2.5;
      ctx.setLineDash([8, 6]);
      ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(b.rallyX, b.rallyY); ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = '#ffc531';
      ctx.strokeStyle = '#16181d';
      ctx.beginPath(); ctx.arc(b.rallyX, b.rallyY, 7, 0, TAU); ctx.fill(); ctx.stroke();
      ctx.restore();
    }
  }

  // Unités (visibles uniquement hors brouillard de guerre)
  const sortedUnits = [...state.units].sort((a, b) => a.y - b.y);
  for (const u of sortedUnits) {
    if (u.hp <= 0) continue;
    if (u.owner !== myId && !isVisibleToMe(u.x, u.y)) continue;
    const owner = state.players.find((p) => p.id === u.owner);
    drawUnit(ctx, u, owner ? owner.color : '#888', selectedUnits.has(u.id), now, false);
  }

  // Bâtiments 2.5D
  const sortedBlds = [...state.buildings].sort((a, b) => a.y - b.y);
  for (const b of sortedBlds) {
    if (b.hp <= 0) continue;
    if (b.owner !== myId && !isVisibleToMe(b.x, b.y)) continue;
    const owner = state.players.find((p) => p.id === b.owner);
    drawBuilding(ctx, b, owner ? owner.color : '#888', selectedBlds.has(b.id), now, false);
  }

  // Projectiles, Ondes de choc & Éclairs
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (let i = projectiles.length - 1; i >= 0; i--) {
    const pr = projectiles[i];
    pr.prog += pr.speed * dt;
    if (pr.prog >= 1) { projectiles.splice(i, 1); continue; }
    const px = lerp(pr.x, pr.tx, pr.prog), py = lerp(pr.y, pr.ty, pr.prog);
    const bx = lerp(pr.x, pr.tx, Math.max(0, pr.prog - 0.18)), by = lerp(pr.y, pr.ty, Math.max(0, pr.prog - 0.18));
    ctx.strokeStyle = pr.color; ctx.lineWidth = pr.r * 1.6; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(px, py); ctx.stroke();
    ctx.fillStyle = '#fff8ea';
    ctx.beginPath(); ctx.arc(px, py, pr.r * 0.7, 0, TAU); ctx.fill();
  }
  for (let i = shockwaves.length - 1; i >= 0; i--) {
    const sw = shockwaves[i];
    sw.life -= dt;
    if (sw.life <= 0) { shockwaves.splice(i, 1); continue; }
    const u = 1 - sw.life / sw.maxLife;
    ctx.globalAlpha = 1 - u;
    ctx.strokeStyle = sw.color; ctx.lineWidth = 4 * (1 - u) + 1;
    ctx.beginPath(); ctx.arc(sw.x, sw.y, lerp(sw.r, sw.maxR, u), 0, TAU); ctx.stroke();
  }
  for (let i = beams.length - 1; i >= 0; i--) {
    const bm = beams[i];
    bm.life -= dt;
    if (bm.life <= 0) { beams.splice(i, 1); continue; }
    ctx.globalAlpha = clamp(bm.life / bm.maxLife, 0, 1);
    ctx.strokeStyle = bm.color; ctx.lineWidth = bm.w; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(bm.x1, bm.y1);
    if (bm.tesla) {
      for (let s = 1; s <= 3; s++) {
        const f = s / 4;
        ctx.lineTo(lerp(bm.x1, bm.x2, f) + (Math.random() - 0.5) * 32, lerp(bm.y1, bm.y2, f) + (Math.random() - 0.5) * 32);
      }
    }
    ctx.lineTo(bm.x2, bm.y2); ctx.stroke();
  }
  ctx.restore();

  // Marqueurs d'ordres au sol façon StarCraft (anneau + 4 flèches convergentes)
  for (let i = orderMarkers.length - 1; i >= 0; i--) {
    const om = orderMarkers[i];
    om.life -= dt;
    if (om.life <= 0) { orderMarkers.splice(i, 1); continue; }
    const f = clamp(om.life / om.maxLife, 0, 1);
    const r = 5 + f * 20;
    ctx.save();
    ctx.translate(om.x, om.y);
    ctx.strokeStyle = om.color;
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.stroke();
    for (let k = 0; k < 4; k++) {
      ctx.rotate(Math.PI / 2);
      ctx.beginPath();
      ctx.moveTo(r + 8, -4);
      ctx.lineTo(r + 2, 0);
      ctx.lineTo(r + 8, 4);
      ctx.stroke();
    }
    ctx.restore();
  }

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= dt;
    if (p.life <= 0) { particles.splice(i, 1); continue; }
    p.x += p.vx * dt; p.y += p.vy * dt;
    ctx.fillStyle = p.color; ctx.strokeStyle = '#16181d'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, TAU); ctx.fill(); ctx.stroke();
  }

  // Brouillard de Guerre (Fog of War) dessiné par-dessus le champ de bataille
  ctx.drawImage(fogCanvas, 0, 0, WORLD_SIZE, WORLD_SIZE);

  // Anneau de Scan Radar Comsat actif
  for (const sc of state.scans) {
    ctx.save();
    ctx.strokeStyle = '#1fc7c1';
    ctx.lineWidth = 3;
    ctx.setLineDash([12, 8]);
    ctx.beginPath(); ctx.arc(sc.x, sc.y, sc.r, 0, TAU); ctx.stroke();
    ctx.restore();
  }

  if (state.phase === 4) {
    ctx.save();
    ctx.strokeStyle = '#ff4b2b'; ctx.lineWidth = 10; ctx.setLineDash([24, 14]);
    ctx.beginPath(); ctx.arc(HALF_W, HALF_W, state.stormRadius, 0, TAU); ctx.stroke();
    ctx.restore();
  }

  // Aperçu fantôme 2.5D du bâtiment à poser
  if (buildMode) {
    const def = BUILDINGS[buildMode];
    const check = canPlaceBuilding(state, myId, buildMode, mouse.wx, mouse.wy);
    const me = state.players.find((p) => p.id === myId);
    const gx = check.snapX ?? mouse.wx, gy = check.snapY ?? mouse.wy;
    ctx.save();
    if (def.range) {
      ctx.strokeStyle = check.ok ? '#2fbf71' : '#ff4b2b';
      ctx.lineWidth = 2.5; ctx.setLineDash([8, 6]);
      ctx.beginPath(); ctx.arc(gx, gy, def.range, 0, TAU); ctx.stroke();
      ctx.setLineDash([]);
    }
    ctx.globalAlpha = 0.72;
    drawBuilding(ctx, { kind: buildMode, x: gx, y: gy, radius: def.radius, hp: def.hp, maxHp: def.hp, aimA: 0 }, check.ok ? (me ? me.color : '#2fbf71') : '#ff4b2b', false, now, true);
    ctx.globalAlpha = 1;
    ctx.strokeStyle = check.ok ? '#2fbf71' : '#ff4b2b';
    ctx.lineWidth = 3.5;
    ctx.beginPath(); ctx.arc(gx, gy, def.radius + 4, 0, TAU); ctx.stroke();
    ctx.restore();
  } else if (orderCursor === 'scan') {
    ctx.save();
    ctx.strokeStyle = '#1fc7c1'; ctx.fillStyle = 'rgba(31, 199, 193, 0.15)'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(mouse.wx, mouse.wy, 380, 0, TAU); ctx.fill(); ctx.stroke();
    ctx.restore();
  }

  // Rectangle de sélection vert style StarCraft
  if (mouse.down && mouse.dragStart) {
    ctx.save();
    ctx.strokeStyle = '#2fbf71';
    ctx.fillStyle = 'rgba(47, 191, 113, 0.16)';
    ctx.lineWidth = 2 / cam.z;
    const rx = Math.min(mouse.dragStart.wx, mouse.wx);
    const ry = Math.min(mouse.dragStart.wy, mouse.wy);
    const rw = Math.abs(mouse.wx - mouse.dragStart.wx);
    const rh = Math.abs(mouse.wy - mouse.dragStart.wy);
    ctx.fillRect(rx, ry, rw, rh);
    ctx.strokeRect(rx, ry, rw, rh);
    ctx.restore();
  }

  ctx.restore();
  renderMinimap();
}

function renderMinimap() {
  if (!state) return;
  const mw = miniCvs.width, mh = miniCvs.height;
  const sx = mw / WORLD_SIZE, sy = mh / WORLD_SIZE;
  if (terrainCanvas) miniCtx.drawImage(terrainCanvas, 0, 0, mw, mh);

  for (const m of MINERAL_NODES) {
    miniCtx.fillStyle = m.rich ? '#ffc531' : '#1fc7c1';
    miniCtx.fillRect(m.x * sx - 1.5, m.y * sy - 1.5, 3, 3);
  }
  for (const b of state.buildings) {
    if (b.hp <= 0) continue;
    if (b.owner !== myId && !isVisibleToMe(b.x, b.y)) continue;
    const owner = state.players.find((p) => p.id === b.owner);
    miniCtx.fillStyle = owner ? owner.color : '#fff';
    const sz = b.kind === 'hq' ? 6 : 4;
    miniCtx.fillRect(b.x * sx - sz / 2, b.y * sy - sz / 2, sz, sz);
  }
  for (const u of state.units) {
    if (u.hp <= 0) continue;
    if (u.owner !== myId && !isVisibleToMe(u.x, u.y)) continue;
    const owner = state.players.find((p) => p.id === u.owner);
    miniCtx.fillStyle = owner ? owner.color : '#fff';
    miniCtx.fillRect(u.x * sx - 1.5, u.y * sy - 1.5, 2.5, 2.5);
  }
  miniCtx.drawImage(fogCanvas, 0, 0, mw, mh);

  const vw = (W / cam.z) * sx, vh = (H / cam.z) * sy;
  miniCtx.strokeStyle = '#fff8ea';
  miniCtx.lineWidth = 1.6;
  miniCtx.strokeRect(cam.x * sx - vw / 2, cam.y * sy - vh / 2, vw, vh);
}

/* ============================================================================
   DÉMARRAGE DE PARTIE & SYNCHRONISATION RÉSEAU (HUB BRIDGE)
   ============================================================================ */
let lastBootInfo = null;
let tickInterval = null;
let botInterval = null;

buildTerrainCanvas();

function startMatch(info) {
  lastBootInfo = info;
  reportedResult = false;
  selectedUnits.clear();
  selectedBlds.clear();
  buildMode = null;
  orderCursor = null;
  cmdTab = 'auto';
  exploredGrid.fill(0);
  craters = [];
  particles = [];
  shockwaves = [];
  projectiles = [];
  beams = [];
  orderMarkers = [];

  clearInterval(tickInterval);
  clearInterval(botInterval);

  const H = window.HubBridge;
  role = H && H.embedded ? info.role : 'solo';
  myId = H && H.embedded ? info.myId : 0;

  if (role === 'guest') {
    H.send('host', { t: 'sync' });
    return;
  }

  const settings = (info && info.settings) || { mode: 'ffa', pace: 'standard', bots: 1, level: 'normal' };
  const humans = H && H.embedded && Array.isArray(H.players) && H.players.length
    ? H.players.map((p) => ({ id: p.id, name: p.name, color: p.color, bot: false }))
    : [{ id: 0, name: 'Commandant', color: PALETTE[0], bot: false }];

  const roster = [...humans];
  const wantBots = role === 'solo'
    ? Math.max(1, Math.min(3, Number(settings.bots ?? 1)))
    : Math.max(0, Math.min(Number(settings.bots ?? 1), 4 - roster.length));
  const finalBots = roster.length + wantBots < 2 ? 2 - roster.length : wantBots;
  const usedColors = new Set(roster.map((p) => p.color));

  for (let k = 0; k < finalBots && roster.length < 4; k++) {
    const col = PALETTE.find((c) => !usedColors.has(c)) || PALETTE[roster.length % PALETTE.length];
    usedColors.add(col);
    roster.push({ id: 100 + k, name: BOT_NAMES[k], color: col, bot: true });
  }

  state = createInitialState(roster, settings);
  centerOnMyHq();
  renderConsoleUI(true);
  updateHudUI();

  if (role === 'host' && H && H.embedded) {
    H.send('all', { t: 'st', s: state, fx: [] });
  }

  tickInterval = setInterval(() => {
    if (!state || state.over) return;
    const fx = [];
    stepWorld(state, TICK_DT, fx);
    handleFxEvents(fx);
    if (role === 'host' && H && H.embedded) {
      H.send('all', { t: 'st', s: state, fx });
    }
  }, 1000 / TICK_RATE);

  const botEvery = settings.level === 'expert' ? 850 : settings.level === 'facile' ? 2000 : 1250;
  botInterval = setInterval(() => {
    if (!state || state.over) return;
    const fx = [];
    runBots(state, fx);
    handleFxEvents(fx);
  }, botEvery);
}

if (window.HubBridge && HubBridge.embedded) {
  let centeredOnce = false;
  HubBridge.on('init', (info) => {
    startMatch(info);
    HubBridge.signalReady();
  });
  HubBridge.on('msg', (from, m) => {
    if (!m || typeof m !== 'object') return;
    if (role === 'host') {
      if (m.t === 'sync' && state) {
        HubBridge.send(from, { t: 'st', s: state, fx: [] });
      } else if (m.t === 'cmd' && m.cmd) {
        const fx = [];
        executeCommand(state, from, m.cmd, fx);
        handleFxEvents(fx);
      }
    } else if (role === 'guest' && from === HubBridge.info.hostId) {
      if (m.t === 'st' && m.s) {
        state = m.s;
        if (!centeredOnce) {
          centeredOnce = true;
          centerOnMyHq();
          renderConsoleUI(true);
        }
        if (m.fx) handleFxEvents(m.fx);
      }
    }
  });
} else {
  startMatch({ role: 'solo', myId: 0, settings: { mode: 'ffa', pace: 'standard', bots: 1, level: 'normal' } });
}

let lastFrame = performance.now();
function loop(now) {
  const dt = Math.min(0.05, Math.max(0.001, (now - lastFrame) / 1000));
  lastFrame = now;
  renderWorld(dt, now);
  updateHudUI();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
