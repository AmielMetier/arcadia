<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Bastion Clash — RTS 3D Top-Down (Édition StarCraft)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Chakra+Petch:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
/* ============================================================================
   HUD TACTIQUE — panneaux sombres translucides, une seule console de commandement
   ============================================================================ */
:root{
  --bg0:#070a0e; --bg1:#0d131a; --bg2:#141c25; --bg3:#1c2733; --bg4:#25333f;
  --line:rgba(160,200,230,.14); --line2:rgba(160,200,230,.26);
  --txt:#e8eef4; --txt2:#9fb0c0; --txt3:#6c7d8d;
  --cyan:#3fe0d8; --gold:#ffc531; --green:#3ddc84; --red:#ff5a45; --purple:#b98cff; --blue:#4ea8ff;
  --team:#3fe0d8;
  --ink:#0d131a; --paper:#e8eef4; --cream:#1c2733; --muted:#9fb0c0;
  --yellow:#ffc531;
}
*{box-sizing:border-box;user-select:none;-webkit-user-select:none}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;background:#05080b;color:var(--txt);
  font-family:'Chakra Petch',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
canvas#webgl3d{position:fixed;inset:0;width:100%;height:100%;display:block;pointer-events:none;z-index:1}
canvas#world{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:default;z-index:2;background:transparent}
canvas#world.cur-attack{cursor:crosshair}
canvas#world.cur-build{cursor:cell}
.num{font-variant-numeric:tabular-nums}
.glass{background:linear-gradient(180deg,rgba(22,31,41,.94),rgba(10,15,21,.96));border:1px solid var(--line);
  box-shadow:0 10px 30px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.05);backdrop-filter:blur(6px)}

/* ---------- BARRE SUPÉRIEURE ---------- */
.hud-top{position:fixed;top:0;left:0;right:0;height:48px;z-index:25;display:flex;align-items:center;gap:10px;padding:0 12px;
  background:linear-gradient(180deg,rgba(6,9,13,.96),rgba(6,9,13,.78) 70%,rgba(6,9,13,0));pointer-events:none}
.hud-top > *{pointer-events:auto}
.res-bar{display:flex;align-items:stretch;height:36px;border-radius:9px;overflow:hidden}
.res{display:flex;align-items:center;gap:7px;padding:0 13px;border-right:1px solid var(--line);position:relative;cursor:help}
.res:last-child{border-right:none}
.res-ico{width:20px;height:20px;display:inline-flex;align-items:center;justify-content:center}
.res-ico svg{width:20px;height:20px}
.res-val{font-weight:700;font-size:17px;letter-spacing:.3px;min-width:38px;font-variant-numeric:tabular-nums}
.res-val.blocked{color:var(--red);animation:blink .55s infinite alternate}
.res-sub{font-size:11px;color:var(--txt2);font-weight:600;white-space:nowrap}
.res-sub.cap b{color:var(--txt);font-weight:700}
.res-sub.cap.full,.res-sub.cap.full b{color:var(--gold)}
.res.gain::after{content:'';position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--cyan);animation:gainFlash .6s ease-out forwards}
@keyframes gainFlash{from{opacity:1}to{opacity:0}}
@keyframes blink{to{opacity:.45}}

.clock-box{margin:0 auto;display:flex;align-items:center;gap:10px;height:36px;padding:0 14px;border-radius:9px}
.clock-box .clk{font-family:Bungee,Impact,sans-serif;font-size:16px;color:var(--gold);letter-spacing:1px;font-variant-numeric:tabular-nums}
.clock-box .ph{font-size:12px;font-weight:700;color:var(--txt2);letter-spacing:.3px;white-space:nowrap}
.clock-box .ph-dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green)}
.clock-box.sd{border-color:rgba(255,90,69,.6);background:linear-gradient(180deg,rgba(80,16,12,.95),rgba(40,8,6,.95))}
.clock-box.sd .ph{color:#ffb3a8}
.clock-box.sd .ph-dot{background:var(--red);box-shadow:0 0 10px var(--red);animation:blink .5s infinite alternate}
.map-chip{display:flex;align-items:center;gap:6px;height:36px;padding:0 12px;border-radius:9px;font-size:12px;font-weight:700;color:var(--txt2);cursor:help;white-space:nowrap}

.ibtn{height:36px;min-width:36px;padding:0 11px;border-radius:9px;border:1px solid var(--line);background:linear-gradient(180deg,#1b2530,#111820);
  color:var(--txt);font:inherit;font-size:12.5px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:background .12s,border-color .12s,transform .06s}
.ibtn:hover{border-color:var(--line2);background:linear-gradient(180deg,#223040,#16202a)}
.ibtn:active{transform:translateY(1px)}
.ibtn.off{color:var(--txt3)}
.ibtn.danger{background:linear-gradient(180deg,#5a1d17,#3c120e);border-color:rgba(255,90,69,.45);color:#ffd9d3}
.ibtn.danger:hover{background:linear-gradient(180deg,#702319,#4a1611)}
.audio-grp{display:flex}
.audio-grp .ibtn:first-child{border-radius:9px 0 0 9px;border-right:none;min-width:40px;justify-content:center;font-size:15px}
.audio-grp .ibtn.caret{border-radius:0 9px 9px 0;min-width:24px;padding:0 6px;color:var(--txt2);font-size:11px}
.ibtn.off{background:linear-gradient(180deg,#3a1712,#25100c);border-color:rgba(255,90,69,.45)}
.ibtn kbd{font-family:inherit;font-size:10px;color:var(--txt3);border:1px solid var(--line);border-radius:4px;padding:0 4px}

/* Bouton générique (fin de partie) */
.btn{font-family:Bungee,Impact,sans-serif;font-size:13px;letter-spacing:.5px;background:var(--red);color:#fff;
  border:1px solid rgba(255,255,255,.18);border-radius:10px;padding:10px 16px;cursor:pointer;transition:filter .1s,transform .06s;white-space:nowrap}
.btn:hover{filter:brightness(1.12)}
.btn:active{transform:translateY(1px)}
.btn.yellow{background:var(--gold);color:#111}
.btn.ghost{background:var(--bg3);color:var(--txt)}

/* Panneau audio */
.audio-pop{position:fixed;top:54px;right:12px;z-index:45;width:272px;border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.audio-pop h4{margin:0;font-family:Bungee,sans-serif;font-size:11px;letter-spacing:1px;color:var(--txt2)}
.a-row{display:grid;grid-template-columns:104px 1fr 38px;align-items:center;gap:8px;font-size:12.5px;font-weight:700}
.a-row input[type=range]{width:100%;accent-color:var(--cyan)}
.a-row .tg{height:24px;border-radius:6px;border:1px solid var(--line);background:var(--bg3);color:var(--txt);font:inherit;font-size:11px;cursor:pointer}
.a-row .tg.on{background:rgba(63,224,216,.18);border-color:rgba(63,224,216,.55);color:var(--cyan)}
.a-hint{font-size:11px;color:var(--txt3)}

/* Joueurs (coin supérieur droit) */
.roster-top{position:fixed;top:54px;right:12px;z-index:24;display:flex;flex-direction:column;gap:4px;align-items:flex-end;pointer-events:none}
.p-chip{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:700;padding:4px 9px 4px 7px;border-radius:8px;
  background:rgba(10,15,21,.82);border:1px solid var(--line);pointer-events:auto}
.p-chip.me{border-color:var(--line2)}
.p-chip.dead{opacity:.4;text-decoration:line-through}
.p-chip .dot{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none;box-shadow:0 0 6px currentColor}
.p-chip .ping-tag{font-size:10.5px;font-weight:700;color:var(--green);font-variant-numeric:tabular-nums}
.p-chip .ping-tag.warn{color:var(--gold)}
.p-chip .ping-tag.bad{color:var(--red)}
.p-chip .ping-tag.bot{color:var(--txt3)}
.p-chip .team-tag{font-family:Bungee,sans-serif;font-size:9.5px;padding:1px 6px;border-radius:4px;color:#fff;border:none}
.p-chip .team-tag.t0{background:#1f6feb}
.p-chip .team-tag.t1{background:#da3633}

/* Fil d'alertes (gauche) */
.alerts{position:fixed;top:56px;left:12px;z-index:24;display:flex;flex-direction:column;gap:5px;pointer-events:none;max-width:380px}
.alert{display:flex;align-items:center;gap:8px;padding:6px 11px;border-radius:8px;font-size:12.5px;font-weight:700;
  background:rgba(10,15,21,.88);border:1px solid var(--line);border-left:3px solid var(--cyan);animation:alertIn .25s ease-out;transition:opacity .4s}
.alert.warn{border-left-color:var(--red);color:#ffd2cb}
.alert.good{border-left-color:var(--green)}
.alert.info{border-left-color:var(--gold)}
.alert.fade{opacity:0}
@keyframes alertIn{from{transform:translateX(-14px);opacity:0}to{transform:none;opacity:1}}

/* ---------- BARRE D'ACCÈS RAPIDE ---------- */
.quick-bar{position:fixed;bottom:238px;left:12px;z-index:22;display:flex;gap:6px;align-items:center;pointer-events:none;flex-wrap:wrap}
.quick-bar > *{pointer-events:auto}
.qbtn{height:28px;border-radius:7px;border:1px solid var(--line);background:rgba(10,15,21,.9);color:var(--txt);
  padding:0 9px;font:inherit;font-size:11.5px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:6px;transition:border-color .12s,background .12s}
.qbtn:hover{border-color:var(--line2);background:rgba(28,39,51,.95)}
.qbtn kbd{font-family:inherit;font-size:10px;color:var(--gold);font-weight:700}
.qbtn .cnt{color:var(--cyan);font-variant-numeric:tabular-nums}
.qbtn.idle-warn .cnt{color:var(--gold)}
.cg-bar{display:flex;gap:4px;margin-left:4px}
.cg-pill{height:28px;border-radius:7px;border:1px solid var(--line);background:rgba(10,15,21,.9);color:var(--txt);
  padding:0 8px;font:inherit;font-size:11px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:4px}
.cg-pill b{color:var(--gold)}
.cg-pill.active{border-color:var(--gold)}

/* ---------- CONSOLE DE COMMANDEMENT ---------- */
.rts-console{position:fixed;bottom:8px;left:50%;transform:translateX(-50%);width:min(1340px,calc(100vw - 16px));height:224px;z-index:24;display:grid;
  grid-template-columns:218px minmax(300px,1fr) 400px;gap:0;border-radius:14px;overflow:hidden}
.panel-box{display:flex;flex-direction:column;overflow:hidden;position:relative;padding:8px 12px 10px;border-right:1px solid var(--line);min-width:0}
.panel-box:last-child{border-right:none}
.panel-hd{display:flex;justify-content:space-between;align-items:center;gap:8px;font-family:Bungee,Impact,sans-serif;font-size:10.5px;letter-spacing:.8px;color:var(--txt2);margin-bottom:6px;flex:none;min-width:0}
.panel-hd span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.panel-hd .sub{font-family:'Chakra Petch',sans-serif;font-weight:700;font-size:10.5px;letter-spacing:.2px;color:var(--txt3)}

/* Minimap */
.minimap-panel{padding:8px}
.minimap-wrap{position:relative;flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
canvas#minimap{width:202px;height:202px;display:block;border-radius:6px;background:#0a0f0c;cursor:crosshair;
  box-shadow:0 0 0 1px var(--line2),0 0 0 3px rgba(0,0,0,.6)}
.mm-legend{position:absolute;left:4px;right:4px;bottom:-1px;display:flex;justify-content:space-between;font-size:9.5px;font-weight:700;color:var(--txt3);pointer-events:none}

/* Sélection */
.sel-body{display:flex;gap:14px;align-items:stretch;flex:1;min-height:0}
.portrait-box{width:116px;border-radius:10px;flex:none;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:6px 6px 7px;position:relative;
  background:radial-gradient(circle at 50% 40%,#25333f,#121a22 75%);border:1px solid var(--line2)}
.portrait-name{width:100%;color:var(--txt);font-family:Bungee,sans-serif;font-size:10px;text-align:center;letter-spacing:.4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.portrait-box canvas{width:98px;height:86px;display:block;margin:2px auto}
.portrait-hp{width:100%;height:7px;background:#0a0f14;border-radius:4px;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
.portrait-hp i{display:block;height:100%;background:var(--green);transition:width .15s}
.sel-info{flex:1;display:flex;flex-direction:column;justify-content:flex-start;gap:6px;min-width:0;overflow:hidden}
.sel-title{font-family:Bungee,Impact,sans-serif;font-size:16px;line-height:1.15;color:var(--txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.3px}
.sel-sub{font-size:12px;font-weight:600;color:var(--txt2);line-height:1.3}
.sel-stats{display:flex;gap:6px;flex-wrap:wrap}
.st-chip{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:6px;padding:3px 8px;font-size:11px;font-weight:700;color:var(--txt);white-space:nowrap}
.st-chip.wide{white-space:normal;font-weight:600;color:var(--txt2)}
.st-chip b{color:var(--gold)}
.tips{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;font-size:12px;color:var(--txt2);font-weight:600}
.tips div{display:flex;gap:7px;align-items:center}
.tips kbd{font-family:inherit;font-size:10.5px;font-weight:700;color:var(--gold);border:1px solid var(--line2);border-radius:4px;padding:1px 5px;background:rgba(0,0,0,.3);white-space:nowrap}

.prod-queue{display:flex;flex-direction:column;gap:5px;margin-top:auto}
.prod-hd{display:flex;justify-content:space-between;font-size:11px;font-weight:700;color:var(--txt2)}
.prod-hd span:last-child{color:var(--gold)}
.q-bar-wrap{width:100%;height:5px;background:#0a0f14;border-radius:3px;overflow:hidden}
.q-bar-wrap i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#ffe08a);transition:width .1s}
.q-slots{display:flex;gap:6px}
.q-slot{width:52px;height:38px;border-radius:7px;border:1px solid var(--line);background:rgba(255,255,255,.03);display:flex;flex-direction:column;align-items:center;justify-content:center;
  position:relative;cursor:pointer;overflow:hidden;padding-top:6px}
.q-slot.filled{background:rgba(255,197,49,.08);border-color:rgba(255,197,49,.35)}
.q-slot.filled:first-child{border-color:var(--gold)}
.q-slot.filled:hover::after{content:'✕';position:absolute;inset:0;background:rgba(255,90,69,.85);color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700}
.q-slot .num{position:absolute;top:2px;left:5px;font-size:8.5px;color:var(--txt3);font-weight:700}
.q-slot .q-nm{font-weight:700;font-size:10px;color:var(--txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:48px}

.multi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(66px,1fr));gap:6px;width:100%;max-height:164px;overflow-y:auto;padding:1px}
.u-card{height:58px;border-radius:8px;border:1px solid var(--line);background:rgba(255,255,255,.03);display:flex;flex-direction:column;align-items:center;justify-content:space-between;
  padding:3px 4px 4px;cursor:pointer;position:relative}
.u-card:hover{border-color:var(--line2);background:rgba(255,255,255,.07)}
.u-card.stim{border-color:rgba(255,90,69,.6)}
.u-card.siege{border-color:rgba(185,140,255,.6)}
.u-card canvas.u-thumb{width:54px;height:30px;display:block;margin:0 auto}
.u-card .u-nm{font-size:9.5px;font-weight:700;color:var(--txt2);line-height:1.1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%}
.u-card .u-hp{width:100%;height:4px;background:#0a0f14;border-radius:2px;overflow:hidden}
.u-card .u-hp i{display:block;height:100%;background:var(--green)}

/* Grille de commandes 4×3 */
.cmd-grid{display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(3,1fr);gap:6px;flex:1;min-height:0}
.cmd-empty{grid-column:1/-1;grid-row:1/-1;border:1px dashed var(--line2);border-radius:10px;background:rgba(255,255,255,.02);
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px;text-align:center;color:var(--txt2);font-size:12px;font-weight:600;gap:6px}
.cmd-empty b{font-family:Bungee,sans-serif;color:var(--txt);font-size:12px;letter-spacing:.4px}
.cmd-empty kbd{font-family:inherit;font-size:10.5px;font-weight:700;color:var(--gold);border:1px solid var(--line2);border-radius:4px;padding:0 4px}
.cbtn{border-radius:9px;border:1px solid var(--line);background:linear-gradient(180deg,#1d2834 0%,#141c25 60%,#10171e 100%);padding:4px 3px 3px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:1px;position:relative;font:inherit;color:var(--txt);overflow:hidden;
  transition:border-color .1s,background .1s,transform .06s,box-shadow .1s;min-width:0;min-height:0;box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.cbtn:hover:not(.locked){border-color:rgba(63,224,216,.65);background:linear-gradient(180deg,#25343f,#17212b);box-shadow:0 0 14px rgba(63,224,216,.2),inset 0 1px 0 rgba(255,255,255,.07)}
.cbtn:active:not(.locked){transform:translateY(1px)}
.cbtn.sel{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold),0 0 16px rgba(255,197,49,.35);background:linear-gradient(180deg,#3a3016,#1c1a12)}
.cbtn .key{position:absolute;top:3px;left:4px;min-width:15px;height:15px;padding:0 3px;border-radius:4px;background:rgba(0,0,0,.45);border:1px solid rgba(255,197,49,.35);
  font-size:9.5px;font-weight:700;color:var(--gold);line-height:13px;text-align:center}
.cbtn canvas.thumb{width:72px;height:36px;display:block;flex:1 1 auto;min-height:0;max-height:40px;object-fit:contain;margin-top:15px}
.cbtn .ico-txt{flex:1 1 auto;display:flex;align-items:center;margin-top:13px;font-size:20px;line-height:1;filter:drop-shadow(0 2px 3px rgba(0,0,0,.5))}
.cbtn .lbl-b{width:100%;color:var(--txt);font-weight:700;font-size:10.5px;line-height:1.15;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:none}
.cbtn .cost{position:absolute;top:4px;right:5px}
.cbtn .cost,.tip .cost{display:flex;gap:6px;justify-content:center;font-size:9.5px;font-weight:700;line-height:1.2;font-variant-numeric:tabular-nums;flex:none}
.cost i,.tip .cost span{font-style:normal;display:inline-flex;align-items:center;gap:3px;color:var(--txt2)}
.cost .m::before,.tip .cost .m::before{content:'';width:7px;height:7px;background:var(--cyan);transform:rotate(45deg);border-radius:1px;box-shadow:0 0 4px rgba(63,224,216,.6)}
.cost .g::before,.tip .cost .g::before{content:'';width:7px;height:7px;background:var(--green);border-radius:50%;box-shadow:0 0 4px rgba(61,220,132,.6)}
.cost .s::before,.tip .cost .s::before{content:'';width:7px;height:7px;background:var(--gold);border-radius:2px}
.cost .hp{color:#ff9d8f}
.cbtn.cant .cost i{color:var(--red)}
.cbtn.cant canvas.thumb,.cbtn.cant .ico-txt{opacity:.6}
/* Bâtiment pas encore débloqué : grisé + cadenas + prérequis */
.cbtn.locked{cursor:not-allowed;background:repeating-linear-gradient(135deg,#0e1318 0 6px,#11171d 6px 12px);border-color:rgba(255,255,255,.05);box-shadow:none}
.cbtn.locked canvas.thumb{filter:grayscale(1) brightness(.45);opacity:.65}
.cbtn.locked .lbl-b{color:var(--txt3)}
.cbtn.locked .key{color:var(--txt3);border-color:rgba(255,255,255,.08)}
.cbtn .req{position:absolute;top:4px;right:5px;font-size:9px;font-weight:700;color:#ff9d8f;line-height:1.2;white-space:nowrap}
.cbtn .req.ok{color:var(--green)}
.cbtn .req.q{color:var(--gold)}
.cbtn.done{border-color:rgba(61,220,132,.5);background:linear-gradient(180deg,#14301f,#0e1f15);cursor:default}
.cbtn.queued{border-color:rgba(255,197,49,.45)}

/* Infobulle de commande */
.tip{position:fixed;z-index:60;max-width:280px;padding:10px 12px;border-radius:10px;font-size:12px;font-weight:600;color:var(--txt2);pointer-events:none;line-height:1.4}
.tip b{display:flex;align-items:center;justify-content:space-between;gap:8px;color:var(--txt);font-size:13px;margin-bottom:4px}
.tip kbd{font-family:inherit;font-size:10.5px;color:var(--gold);border:1px solid rgba(255,197,49,.4);border-radius:4px;padding:0 5px}
.tip .cost{justify-content:flex-start;gap:12px;margin-top:7px;font-size:11.5px}
.tip .cost span{color:var(--txt)}
.tip .cost .t{color:var(--txt3)}
.tip .lockmsg{margin-top:6px;color:#ff9d8f;font-weight:700}

/* TOAST & MODAL */
.toast{position:fixed;top:58px;left:50%;transform:translateX(-50%);z-index:40;color:var(--txt);white-space:pre-line;text-align:center;
  font-weight:700;font-size:13.5px;border-radius:10px;padding:8px 16px;pointer-events:none;border-left:3px solid var(--gold)}

function shade(hex, f) {
  let c = String(hex || '#888888').replace('#', '');
  if (c.length === 3) c = c[0] + c[0] + c[1] + c[1] + c[2] + c[2];
  const n = parseInt(c, 16) || 0;
  let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  if (f < 0) { const k = 1 + f; r = Math.round(r * k); g = Math.round(g * k); b = Math.round(b * k); }
  else { r = Math.round(r + (255 - r) * f); g = Math.round(g + (255 - g) * f); b = Math.round(b + (255 - b) * f); }
  return '#' + [r, g, b].map((v) => clamp(v, 0, 255).toString(16).padStart(2, '0')).join('');
}

function mulberry(a) {
  return function () {
    let t = (a += 0x6d2b79f5);
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

let activeLayout = 'ffa';
const MINERAL_NODES = [];
const GAS_GEYSERS = [];
const ROCKS = [];
const TREES_3D = [];
let MAP_FEATURES = null;           // géométrie du relief (plateaux, montagnes, eau, routes)

const HIGH_GROUND = 42;            // hauteur des plateaux
const CLIFF_W = 26;                // épaisseur de la falaise
const RAMP_LEN = 116;              // longueur d'une rampe
const RAMP_HALF = 64;              // demi-largeur d'une rampe
const MAIN_R = 336;                // rayon du plateau d'une base principale
const CENTER_R = 330;              // rayon du plateau central

const T_LOW = 0, T_HIGH = 1, T_RAMP = 2, T_CLIFF = 3, T_LIQUID = 4, T_MOUNT = 5;
const TER_CELL = 12;
let TER_N = 1;
let terType = new Uint8Array(1);
let terH = new Float32Array(1);
let terrainActive = true;

const LIQUID_LABEL = { vallee: 'la rivière', magma: 'la lave', glace: 'la crevasse' };

// ---- Pathfinding par champs de flux (Dijkstra) mis en cache par cellule-objectif ----
// La grille connaît le relief ET les bâtiments : sans eux, les unités fonçaient dans leurs propres
// bâtiments et restaient coincées dans leur base.
const PATH_CELL = 20;
let PATH_N = 1;
let pathTerrain = new Uint8Array(1);   // relief infranchissable
let pathBld = new Uint8Array(1);       // emprise des bâtiments
let pathBlocked = new Uint8Array(1);   // relief + bâtiments (ce que suit le Dijkstra)
let pathBldSig = 0;
const flowCache = new Map();
const FLOW_CACHE_MAX = 64;
const FLOW_BUILDS_PER_TICK = 4;        // champs neufs calculés au plus par pas de simulation
let flowBuildsLeft = FLOW_BUILDS_PER_TICK;
const WAYPOINT_TTL = 0.3;              // une unité garde son point de passage 0,3 s avant de le recalculer
const NB8 = [[1, 0, 10], [-1, 0, 10], [0, 1, 10], [0, -1, 10], [1, 1, 14], [1, -1, 14], [-1, 1, 14], [-1, -1, 14]];

function setWorldSize(size) {
  WORLD_SIZE = size;
  HALF_W = size / 2;
  TER_N = Math.ceil(size / TER_CELL);
  terType = new Uint8Array(TER_N * TER_N);
  terH = new Float32Array(TER_N * TER_N);
  PATH_N = Math.ceil(size / PATH_CELL);
  pathTerrain = new Uint8Array(PATH_N * PATH_N);
  pathBld = new Uint8Array(PATH_N * PATH_N);
  pathBlocked = new Uint8Array(PATH_N * PATH_N);
  pathBldSig = 0;
  flowCache.clear();
}

function terTypeAt(x, y) {
  const gx = Math.floor(x / TER_CELL), gy = Math.floor(y / TER_CELL);
  if (gx < 0 || gy < 0 || gx >= TER_N || gy >= TER_N) return T_LOW;
  return terType[gy * TER_N + gx];
}
function heightAt(x, y) {
  const fx = x / TER_CELL - 0.5, fy = y / TER_CELL - 0.5;
  let gx = Math.floor(fx), gy = Math.floor(fy);
  const tx = fx - gx, ty = fy - gy;
  const N = TER_N;
  const g = (ix, iy) => terH[clamp(iy, 0, N - 1) * N + clamp(ix, 0, N - 1)];
  const a = g(gx, gy), b = g(gx + 1, gy), c = g(gx, gy + 1), d = g(gx + 1, gy + 1);
  return (a * (1 - tx) + b * tx) * (1 - ty) + (c * (1 - tx) + d * tx) * ty;
}
function isHighAt(x, y) { return terTypeAt(x, y) === T_HIGH; }
function isBlockedAt(x, y) { return terTypeAt(x, y) >= T_CLIFF; }
function isAreaBlocked(x, y, r) {
  if (isBlockedAt(x, y)) return true;
  for (let k = 0; k < 16; k++) {
    const a = (k / 16) * TAU;
    if (isBlockedAt(x + Math.cos(a) * r, y + Math.sin(a) * r)) return true;
    if (isBlockedAt(x + Math.cos(a) * r * 0.55, y + Math.sin(a) * r * 0.55)) return true;
  }
  return false;
}
function areaTypes(x, y, r) {
  const set = new Set([terTypeAt(x, y)]);
  for (let k = 0; k < 16; k++) {
    const a = (k / 16) * TAU;
    set.add(terTypeAt(x + Math.cos(a) * r, y + Math.sin(a) * r));
    set.add(terTypeAt(x + Math.cos(a) * r * 0.55, y + Math.sin(a) * r * 0.55));
  }
  return set;
}
function segmentClear(x1, y1, x2, y2) {
  const d = Math.hypot(x2 - x1, y2 - y1);
  const n = Math.ceil(d / 7);
  for (let i = 1; i <= n; i++) {
    const t = i / n;
    if (isBlockedAt(x1 + (x2 - x1) * t, y1 + (y2 - y1) * t)) return false;
  }
  return true;
}
function nearestLand(x, y) {
  if (!isBlockedAt(x, y)) return { x, y };
  for (let r = 10; r <= 520; r += 10) {
    for (let k = 0; k < 28; k++) {
      const a = (k / 28) * TAU;
      const px = clamp(x + Math.cos(a) * r, 26, WORLD_SIZE - 26), py = clamp(y + Math.sin(a) * r, 26, WORLD_SIZE - 26);
      if (!isBlockedAt(px, py)) return { x: px, y: py };
    }
  }
  return { x, y };
}

function bezierPt(c, t) {
  const u = 1 - t;
  return [
    u * u * u * c[0] + 3 * u * u * t * c[2] + 3 * u * t * t * c[4] + t * t * t * c[6],
    u * u * u * c[1] + 3 * u * u * t * c[3] + 3 * u * t * t * c[5] + t * t * t * c[7],
  ];
}
function segDist(px, py, x1, y1, x2, y2) {
  const vx = x2 - x1, vy = y2 - y1;
  const l2 = vx * vx + vy * vy || 1;
  const t = Math.max(0, Math.min(1, ((px - x1) * vx + (py - y1) * vy) / l2));
  return Math.hypot(px - (x1 + vx * t), py - (y1 + vy * t));
}
function smooth01(t) { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); }
function hash2(x, y) {
  const s = Math.sin(x * 12.9898 + y * 78.233) * 43758.5453;
  return s - Math.floor(s);
}
function vnoise(x, y) {
  const ix = Math.floor(x), iy = Math.floor(y), fx = x - ix, fy = y - iy;
  const a = hash2(ix, iy), b = hash2(ix + 1, iy), c = hash2(ix, iy + 1), d = hash2(ix + 1, iy + 1);
  const ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy);
  return (a * (1 - ux) + b * ux) * (1 - uy) + (c * (1 - ux) + d * ux) * uy;
}

/* ---------- Disposition des cartes ---------- */
function buildLayout(mapId, layout) {
  const W = WORLD_SIZE, C = HALF_W, k = W / BASE_WORLD;
  const F = {
    mapId, layout, plateaus: [], mountains: [], liquids: [], pools: [], crossings: [], roads: [],
    mains: [], expos: [], center: { x: C, y: C, r: CENTER_R, ramps: [] }, liquidHalf: 44,
  };
  const rampFoot = (p, a) => ({ x: p.x + Math.cos(a) * (p.r + RAMP_LEN + 34), y: p.y + Math.sin(a) * (p.r + RAMP_LEN + 34) });
  const addRidge = (pts, w) => F.mountains.push({ pts, w });
  const mirror4 = (pts, w) => {
    addRidge(pts, w);
    addRidge(pts.map(([x, y]) => [W - x, y]), w);
    addRidge(pts.map(([x, y]) => [x, W - y]), w);
    addRidge(pts.map(([x, y]) => [W - x, W - y]), w);
  };

  SPAWN_CORNERS.length = 0;
  TEAM_SPAWNS = null;

  if (layout === '2v2') {
    // ---- 2 CONTRE 2 : alliés côte à côte sur le même flanc ----
    const ax = 560, dy = 720;
    const A1 = { x: ax, y: C - dy }, A2 = { x: ax, y: C + dy };
    const B1 = { x: W - ax, y: C - dy }, B2 = { x: W - ax, y: C + dy };
    TEAM_SPAWNS = [[A1, A2], [B1, B2]];
    SPAWN_CORNERS.push(A1, B1, A2, B2);
    // Chaque plateau a 2 rampes : vers sa base avancée (côté bord) et vers l'allié (base partagée)
    F.mains.push({ ...A1, r: MAIN_R, away: Math.PI, ramps: [-Math.PI / 2, Math.PI / 2] });
    F.mains.push({ ...A2, r: MAIN_R, away: Math.PI, ramps: [Math.PI / 2, -Math.PI / 2] });
    F.mains.push({ ...B1, r: MAIN_R, away: 0, ramps: [-Math.PI / 2, Math.PI / 2] });
    F.mains.push({ ...B2, r: MAIN_R, away: 0, ramps: [Math.PI / 2, -Math.PI / 2] });
    F.center.ramps = [0, Math.PI / 2, Math.PI, -Math.PI / 2];

    const nats = [
      { x: 780, y: 830, a: -2.45 }, { x: 780, y: W - 830, a: 2.45 },
      { x: W - 780, y: 830, a: -0.69 }, { x: W - 780, y: W - 830, a: 0.69 },
    ];
    const shared = [{ x: 470, y: C, a: Math.PI }, { x: W - 470, y: C, a: 0 }];
    const mids = [
      { x: C - 900, y: 760, a: -Math.PI / 2 }, { x: C - 900, y: W - 760, a: Math.PI / 2 },
      { x: C + 900, y: 760, a: -Math.PI / 2 }, { x: C + 900, y: W - 760, a: Math.PI / 2 },
      { x: C, y: 470, a: -Math.PI / 2 }, { x: C, y: W - 470, a: Math.PI / 2 },
    ];
    F.expos.push(...nats, ...shared, ...mids);

    F.crossings.push({ x: C, y: 470, r: 240 }, { x: C, y: W - 470, r: 240 });
    F.liquidHalf = mapId === 'magma' ? 50 : mapId === 'glace' ? 46 : 48;
    F.liquids.push([C + 210, 0, C - 300, W * 0.33, C + 300, W * 0.66, C - 210, W]);
    if (mapId !== 'vallee') {
      F.pools.push({ x: 1650, y: 1250, r: 130 }, { x: W - 1650, y: W - 1250, r: 130 },
        { x: 1650, y: W - 1250, r: 130 }, { x: W - 1650, y: 1250, r: 130 });
    }
    // Montagnes : couloir entre la base partagée et le centre + massifs latéraux
    const ridges = [
      [[[1330, C - 330], [1560, C - 360], [1780, C - 430]], 80],
      [[[1330, C + 330], [1560, C + 360], [1780, C + 430]], 80],
      [[[1240, 1360], [1380, 1520], [1500, 1700]], 82],
      [[[1240, W - 1360], [1380, W - 1520], [1500, W - 1700]], 82],
      [[[240, 1360], [330, 1180]], 70],
      [[[240, W - 1360], [330, W - 1180]], 70],
    ];
    for (const [pts, w] of ridges) {
      addRidge(pts, w);
      addRidge(pts.map(([x, y]) => [W - x, y]), w);
    }
    // Routes (purement décoratives + franchissement de l'eau)
    for (const m of F.mains) for (const a of m.ramps) {
      const f = rampFoot(m, a);
      const towardAlly = Math.sign(Math.sin(a)) === Math.sign(C - m.y);
      const tgt = towardAlly ? (m.x < C ? shared[0] : shared[1]) : nats.reduce((b, n) => (hypot(n.x, n.y, f.x, f.y) < hypot(b.x, b.y, f.x, f.y) ? n : b));
      F.roads.push([f.x, f.y, tgt.x + (m.x < C ? 160 : -160), tgt.y, 40]);
    }
    for (const s of shared) {
      const cf = rampFoot(F.center, s.x < C ? Math.PI : 0);
      F.roads.push([s.x + (s.x < C ? 160 : -160), s.y, cf.x, cf.y, 46]);
    }
    for (const n of nats) {
      const mid = mids.reduce((b, m) => (Math.abs(m.x - C) > 10 && hypot(m.x, m.y, n.x, n.y) < hypot(b.x, b.y, n.x, n.y) ? m : b), mids[0]);
      F.roads.push([n.x + (n.x < C ? 160 : -160), n.y, mid.x, mid.y + (mid.y < C ? 140 : -140), 38]);
      const ford = mid.y < C ? mids[4] : mids[5];
      F.roads.push([mid.x, mid.y + (mid.y < C ? 140 : -140), ford.x, ford.y + (ford.y < C ? 140 : -140), 38]);
    }
    for (const a of F.center.ramps) {
      if (Math.abs(Math.cos(a)) > 0.5) continue;
      const cf = rampFoot(F.center, a);
      const ford = a > 0 ? mids[5] : mids[4];
      F.roads.push([cf.x, cf.y, ford.x, ford.y + (ford.y < C ? 140 : -140), 40]);
    }
  } else {
    // ---- CHACUN POUR SOI : 4 coins ----
    const I = 500;
    const sp = [{ x: I, y: I }, { x: W - I, y: W - I }, { x: W - I, y: I }, { x: I, y: W - I }];
    SPAWN_CORNERS.push(...sp);
    const nats = sp.map((s) => ({ x: s.x < C ? 1120 : W - 1120, y: s.y < C ? 470 : W - 470, a: s.x < C ? 0 : Math.PI }));
    sp.forEach((s, i) => {
      const n = nats[i];
      const ra = Math.atan2(n.y + Math.sign(C - s.y) * 270 - s.y, n.x - s.x);
      F.mains.push({ ...s, r: MAIN_R, away: Math.atan2(s.y - C, s.x - C), ramps: [ra] });
    });
    const laterals = [
      { x: C, y: 380, a: -Math.PI / 2 }, { x: C, y: W - 380, a: Math.PI / 2 },
      { x: 380, y: C, a: Math.PI }, { x: W - 380, y: C, a: 0 },
    ];
    F.expos.push(...nats, ...laterals);
    F.center.ramps = [Math.PI / 4, (3 * Math.PI) / 4, (-3 * Math.PI) / 4, -Math.PI / 4];
    for (const l of laterals) F.crossings.push({ x: l.x, y: l.y, r: 225 });
    if (mapId === 'magma') {
      F.liquidHalf = 46;
      F.liquids.push([0, C - 240, W * 0.35, C + 220, W * 0.65, C - 260, W, C + 220]);
      F.liquids.push([C - 260, 0, C + 240, W * 0.35, C - 250, W * 0.65, C + 240, W]);
    } else if (mapId === 'glace') {
      F.liquidHalf = 42;
      F.liquids.push([0, C - 210, W * 0.33, C + 240, W * 0.66, C - 250, W, C + 210]);
      F.liquids.push([C + 210, 0, C - 240, W * 0.33, C + 220, W * 0.66, C - 210, W]);
    } else {
      F.liquidHalf = 44;
      F.liquids.push([0, C - 220, W * 0.33, C + 280, W * 0.66, C - 280, W, C + 220]);
    }
    mirror4([[1240, 690], [1400, 810], [1530, 965]], 78);
    mirror4([[690, 1240], [810, 1400], [965, 1530]], 78);
    // Routes
    F.mains.forEach((m, i) => {
      const f = rampFoot(m, m.ramps[0]);
      const n = nats[i];
      F.roads.push([f.x, f.y, n.x, n.y + Math.sign(C - n.y) * 120, 40]);
      const ca = F.center.ramps.reduce((b, a) => {
        const p = rampFoot(F.center, a), q = rampFoot(F.center, b);
        return hypot(p.x, p.y, f.x, f.y) < hypot(q.x, q.y, f.x, f.y) ? a : b;
      });
      const cf = rampFoot(F.center, ca);
      F.roads.push([f.x, f.y, cf.x, cf.y, 46]);
      const lat = laterals[n.y < C ? 0 : 1];
      F.roads.push([n.x, n.y + Math.sign(C - n.y) * 120, lat.x, lat.y + Math.sign(C - lat.y) * 150, 36]);
      const side = laterals[m.x < C ? 2 : 3];
      F.roads.push([f.x, f.y, side.x + Math.sign(C - side.x) * 150, side.y, 36]);
    });
  }
  for (const m of F.mains) F.plateaus.push({ x: m.x, y: m.y, r: m.r, ramps: m.ramps, main: true });
  F.plateaus.push({ x: C, y: C, r: F.center.r, ramps: F.center.ramps, main: false });
  return F;
}

function placeResources(mapId, F) {
  MINERAL_NODES.length = 0;
  GAS_GEYSERS.length = 0;
  ROCKS.length = 0;
  let mId = 1, gId = 1;
  const C = HALF_W;
  const mainCount = mapId === 'magma' ? 5 : 6;
  F.mains.forEach((m, idx) => {
    const half = (mainCount - 1) / 2;
    for (let i = -half; i <= half; i += 1) {
      const a = m.away + i * 0.25;
      MINERAL_NODES.push({ id: 'm' + (mId++), x: Math.round(m.x + Math.cos(a) * 142), y: Math.round(m.y + Math.sin(a) * 142), rich: mapId !== 'vallee' && Math.abs(i) === half });
    }
    const gasAngles = mapId === 'magma' ? [0.95, -0.95] : [idx % 2 === 0 ? 0.95 : -0.95];
    for (const ga of gasAngles) {
      GAS_GEYSERS.push({ id: 'g' + (gId++), x: Math.round(m.x + Math.cos(m.away + ga) * 150), y: Math.round(m.y + Math.sin(m.away + ga) * 150) });
    }
  });
  for (const n of F.expos) {
    for (let i = -1.5; i <= 1.5; i += 1) {
      const a = n.a + i * 0.28;
      MINERAL_NODES.push({ id: 'm' + (mId++), x: Math.round(n.x + Math.cos(a) * 105), y: Math.round(n.y + Math.sin(a) * 105), rich: false });
    }
    GAS_GEYSERS.push({ id: 'g' + (gId++), x: Math.round(n.x + Math.cos(n.a + 0.85) * 118), y: Math.round(n.y + Math.sin(n.a + 0.85) * 118) });
  }
  // Filon d'or du plateau central
  for (let i = 0; i < 8; i++) {
    const a = (i / 8) * TAU + Math.PI / 8;
    MINERAL_NODES.push({ id: 'm' + (mId++), x: Math.round(C + Math.cos(a) * 168), y: Math.round(C + Math.sin(a) * 168), rich: true });
  }
  const geyA = F.layout === '2v2'
    ? [Math.PI / 4, (-3 * Math.PI) / 4]
    : mapId === 'magma' ? [0, Math.PI / 2, Math.PI, -Math.PI / 2] : [0, Math.PI];
  for (const a of geyA) GAS_GEYSERS.push({ id: 'g' + (gId++), x: Math.round(C + Math.cos(a) * 258), y: Math.round(C + Math.sin(a) * 258) });
}

/* ---------- Rasterisation du relief (types + hauteurs) ---------- */
function rasterizeTerrain(mapId, F) {
  const N = TER_N, cs = TER_CELL;
  const liq = new Float32Array(N * N).fill(1e9);   // distance à l'eau/lave
  const mtn = new Float32Array(N * N).fill(1e9);   // distance relative (d / largeur) aux montagnes
  const land = new Uint8Array(N * N);              // gués, ponts, routes
  const plat = new Int8Array(N * N).fill(-1);      // type imposé par un plateau
  const platH = new Float32Array(N * N);
  const stampSeg = (x1, y1, x2, y2, margin, fn) => {
    const gx0 = Math.max(0, Math.floor((Math.min(x1, x2) - margin) / cs)), gx1 = Math.min(N - 1, Math.floor((Math.max(x1, x2) + margin) / cs));
    const gy0 = Math.max(0, Math.floor((Math.min(y1, y2) - margin) / cs)), gy1 = Math.min(N - 1, Math.floor((Math.max(y1, y2) + margin) / cs));
    for (let gy = gy0; gy <= gy1; gy++) for (let gx = gx0; gx <= gx1; gx++) {
      const cx = (gx + 0.5) * cs, cy = (gy + 0.5) * cs;
      fn(gy * N + gx, segDist(cx, cy, x1, y1, x2, y2), cx, cy);
    }
  };
  const half = F.liquidHalf;
  F.liquidPolys = F.liquids.map((c) => { const pts = []; for (let i = 0; i <= 120; i++) pts.push(bezierPt(c, i / 120)); return pts; });
  for (const pts of F.liquidPolys) for (let i = 0; i < pts.length - 1; i++) {
    stampSeg(pts[i][0], pts[i][1], pts[i + 1][0], pts[i + 1][1], half + 30, (idx, d) => { if (d < liq[idx]) liq[idx] = d; });
  }
  for (const p of F.pools) {
    stampSeg(p.x, p.y, p.x, p.y, p.r + 40, (idx, d, cx, cy) => {
      const wob = 1 + 0.12 * Math.sin(Math.atan2(cy - p.y, cx - p.x) * 5 + p.x);
      const e = d - (p.r * wob - half);
      if (e < liq[idx]) liq[idx] = e;
    });
  }
  for (const m of F.mountains) for (let i = 0; i < m.pts.length - 1; i++) {
    const [x1, y1] = m.pts[i], [x2, y2] = m.pts[i + 1];
    stampSeg(x1, y1, x2, y2, m.w * 1.7, (idx, d, cx, cy) => {
      const wob = 1 + 0.18 * (vnoise(cx * 0.012, cy * 0.012) - 0.5) * 2;
      const r = d / (m.w * wob);
      if (r < mtn[idx]) mtn[idx] = r;
    });
  }
  for (const c of F.crossings) stampSeg(c.x, c.y, c.x, c.y, c.r, (idx, d) => { if (d < c.r) land[idx] = 1; });
  for (const r of F.roads) stampSeg(r[0], r[1], r[2], r[3], r[4] + 6, (idx, d) => { if (d < r[4]) land[idx] = 2; });
  // Ressources et zones de base toujours praticables
  for (const m of MINERAL_NODES) stampSeg(m.x, m.y, m.x, m.y, 60, (idx, d) => { if (d < 60) land[idx] = Math.max(land[idx], 1); });
  for (const g of GAS_GEYSERS) stampSeg(g.x, g.y, g.x, g.y, 70, (idx, d) => { if (d < 70) land[idx] = Math.max(land[idx], 1); });
  for (const e of F.expos) stampSeg(e.x, e.y, e.x, e.y, 170, (idx, d) => { if (d < 170) land[idx] = Math.max(land[idx], 1); });

  // Plateaux + rampes + falaises
  for (const P of F.plateaus) {
    const ext = P.r + CLIFF_W + RAMP_LEN + 24;
    stampSeg(P.x, P.y, P.x, P.y, ext, (idx, dc, cx, cy) => {
      if (dc > ext) return;
      const dx = cx - P.x, dy = cy - P.y;
      let rampLat = 1e9, rampAlong = 0;
      for (const a of P.ramps) {
        const ca = Math.cos(a), sa = Math.sin(a);
        const along = dx * ca + dy * sa, lat = Math.abs(-dx * sa + dy * ca);
        if (along > P.r - 50 && along < P.r + RAMP_LEN && lat < rampLat) { rampLat = lat; rampAlong = along; }
      }
      const t = clamp((rampAlong - P.r) / RAMP_LEN, 0, 1);
      if (dc <= P.r) {
        plat[idx] = T_HIGH; platH[idx] = HIGH_GROUND;
      } else if (rampLat < RAMP_HALF) {
        plat[idx] = T_RAMP; platH[idx] = HIGH_GROUND * (1 - smooth01(t));
      } else if (rampLat < RAMP_HALF + 16 && t < 0.86) {
        plat[idx] = T_CLIFF; platH[idx] = HIGH_GROUND * (1 - smooth01(t)) + 6;
      } else if (dc < P.r + CLIFF_W) {
        plat[idx] = T_CLIFF; platH[idx] = HIGH_GROUND * (1 - smooth01((dc - P.r) / CLIFF_W));
      }
    });
  }

  const seed = mapId === 'magma' ? 3.1 : mapId === 'glace' ? 7.7 : 1.3;
  for (let gy = 0; gy < N; gy++) for (let gx = 0; gx < N; gx++) {
    const i = gy * N + gx;
    const cx = (gx + 0.5) * cs, cy = (gy + 0.5) * cs;
    const und = 2.2 * vnoise(cx * 0.004 + seed, cy * 0.004) + 1.2 * vnoise(cx * 0.013, cy * 0.013 + seed);
    if (plat[i] >= 0) {
      terType[i] = plat[i];
      terH[i] = platH[i] + (plat[i] === T_HIGH ? und * 0.6 : 0);
      continue;
    }
    let type = T_LOW, h = und;
    if (land[i]) {
      if (liq[i] < half + 8) h = 1.5;              // gué / pont
    } else if (liq[i] < half) {
      type = T_LIQUID;
      h = -16 + 4 * smooth01(liq[i] / half - 0.6);
    } else if (mtn[i] < 1) {
      type = T_MOUNT;
      const core = 1 - mtn[i] * mtn[i];
      h = 34 + 92 * core + 34 * (vnoise(cx * 0.02 + seed, cy * 0.02) - 0.3) * core;
    }
    if (type === T_LOW) {
      if (mtn[i] < 1.55 && land[i] !== 2) h += 30 * smooth01((1.55 - mtn[i]) / 0.55);           // contreforts
      if (liq[i] < half + 26 && !land[i]) h = lerp(-7, h, smooth01((liq[i] - half) / 26));         // berges
    }
    terType[i] = type;
    terH[i] = h;
  }
  // Bords de carte : légère falaise décorative
  terrainActive = true;
}

function buildPathGrid() {
  flowCache.clear();
  for (let gy = 0; gy < PATH_N; gy++) {
    for (let gx = 0; gx < PATH_N; gx++) {
      const cx = (gx + 0.5) * PATH_CELL, cy = (gy + 0.5) * PATH_CELL;
      let n = 0;
      if (isBlockedAt(cx - 6, cy - 6)) n++;
      if (isBlockedAt(cx + 6, cy - 6)) n++;
      if (isBlockedAt(cx - 6, cy + 6)) n++;
      if (isBlockedAt(cx + 6, cy + 6)) n++;
      pathTerrain[gy * PATH_N + gx] = (isBlockedAt(cx, cy) || n >= 2) ? 1 : 0;
    }
  }
  pathBld.fill(0);
  pathBlocked.set(pathTerrain);
  pathBldSig = 0;
}
// Recopie l'emprise des bâtiments dans la grille quand ils changent (pose, destruction, déplacement)
function syncPathBuildings(st) {
  let sig = st.buildings.length;
  for (const b of st.buildings) {
    if (b.hp <= 0) continue;
    sig = (Math.imul(sig, 31) + b.id * 7 + (b.x | 0) * 13 + (b.y | 0)) | 0;
  }
  if (sig === pathBldSig) return;
  pathBldSig = sig;
  pathBld.fill(0);
  for (const b of st.buildings) {
    if (b.hp <= 0) continue;
    const r = b.radius + 4;
    const gx0 = Math.max(0, Math.floor((b.x - r) / PATH_CELL)), gx1 = Math.min(PATH_N - 1, Math.floor((b.x + r) / PATH_CELL));
    const gy0 = Math.max(0, Math.floor((b.y - r) / PATH_CELL)), gy1 = Math.min(PATH_N - 1, Math.floor((b.y + r) / PATH_CELL));
    for (let gy = gy0; gy <= gy1; gy++) {
      for (let gx = gx0; gx <= gx1; gx++) {
        if (hypot((gx + 0.5) * PATH_CELL, (gy + 0.5) * PATH_CELL, b.x, b.y) <= r) pathBld[gy * PATH_N + gx] = 1;
      }
    }
  }
  for (let i = 0; i < pathBlocked.length; i++) pathBlocked[i] = pathTerrain[i] | pathBld[i];
  flowCache.clear();
}
function pathCellOf(x, y) {
  const gx = clamp(Math.floor(x / PATH_CELL), 0, PATH_N - 1), gy = clamp(Math.floor(y / PATH_CELL), 0, PATH_N - 1);
  return gy * PATH_N + gx;
}
// Cellule libre la plus proche (anneaux successifs autour de la cellule de départ)
function nearestFreeCell(idx) {
  if (!pathBlocked[idx]) return idx;
  const cx = idx % PATH_N, cy = (idx / PATH_N) | 0;
  for (let r = 1; r <= 24; r++) {
    let best = -1, bestD = Infinity;
    for (let oy = -r; oy <= r; oy++) {
      for (let ox = -r; ox <= r; ox++) {
        if (Math.max(Math.abs(ox), Math.abs(oy)) !== r) continue;
        const nx = cx + ox, ny = cy + oy;
        if (nx < 0 || ny < 0 || nx >= PATH_N || ny >= PATH_N) continue;
        const ni = ny * PATH_N + nx;
        const d = ox * ox + oy * oy;
        if (!pathBlocked[ni] && d < bestD) { bestD = d; best = ni; }
      }
    }
    if (best >= 0) return best;
  }
  return idx;
}
// Ligne droite praticable : relief franchissable et aucun bâtiment en travers
// (on tolère les bâtiments au départ et à l'arrivée : unité collée à un mur, cible qui est un bâtiment)
function pathSegmentClear(x1, y1, x2, y2, endTol = 70) {
  if (!segmentClear(x1, y1, x2, y2)) return false;
  const d = Math.hypot(x2 - x1, y2 - y1);
  const n = Math.ceil(d / 10);
  for (let i = 1; i < n; i++) {
    const t = i / n;
    if (d * t < 24 || d * (1 - t) < endTol) continue;
    if (pathBld[pathCellOf(x1 + (x2 - x1) * t, y1 + (y2 - y1) * t)]) return false;
  }
  return true;
}
// Tas binaire réutilisé d'un calcul à l'autre (pas d'allocation par cellule)
let heapIdx = new Int32Array(1), heapCost = new Float32Array(1);
function getFlowField(goalIdx) {
  let f = flowCache.get(goalIdx);
  if (f) { flowCache.delete(goalIdx); flowCache.set(goalIdx, f); return f; }
  // Budget par pas : au-delà, l'unité garde son ancien point de passage et réessaie au pas suivant
  if (flowBuildsLeft <= 0) return null;
  flowBuildsLeft--;
  const N2 = PATH_N * PATH_N;
  if (heapIdx.length < N2 * 8 + 8) { heapIdx = new Int32Array(N2 * 8 + 8); heapCost = new Float32Array(N2 * 8 + 8); }
  f = new Float32Array(N2).fill(Infinity);
  let size = 0;
  const push = (i, c) => {
    let k = size++;
    while (k > 0) {
      const p = (k - 1) >> 1;
      if (heapCost[p] <= c) break;
      heapIdx[k] = heapIdx[p]; heapCost[k] = heapCost[p];
      k = p;
    }
    heapIdx[k] = i; heapCost[k] = c;
  };
  f[goalIdx] = 0;
  push(goalIdx, 0);
  while (size > 0) {
    const ci = heapIdx[0], cc = heapCost[0];
    // Retire la racine : le dernier élément redescend à sa place
    const li = heapIdx[--size], lc = heapCost[size];
    let k = 0;
    for (;;) {
      const l = 2 * k + 1;
      if (l >= size) break;
      const m = l + 1 < size && heapCost[l + 1] < heapCost[l] ? l + 1 : l;
      if (heapCost[m] >= lc) break;
      heapIdx[k] = heapIdx[m]; heapCost[k] = heapCost[m];
      k = m;
    }
    heapIdx[k] = li; heapCost[k] = lc;
    if (cc > f[ci]) continue;
    const cx = ci % PATH_N, cy = (ci / PATH_N) | 0;
    for (const [ox, oy, cost] of NB8) {
      const nx = cx + ox, ny = cy + oy;
      if (nx < 0 || ny < 0 || nx >= PATH_N || ny >= PATH_N) continue;
      const ni = ny * PATH_N + nx;
      if (pathBlocked[ni]) continue;
      if (ox && oy && (pathBlocked[cy * PATH_N + nx] || pathBlocked[ny * PATH_N + cx])) continue;
      const nc = cc + cost;
      if (nc < f[ni]) { f[ni] = nc; push(ni, nc); }
    }
  }
  flowCache.set(goalIdx, f);
  if (flowCache.size > FLOW_CACHE_MAX) flowCache.delete(flowCache.keys().next().value);
  return f;
}

// Renvoie un point de passage intermédiaire si la ligne droite vers l'objectif est bloquée (relief ou bâtiments).
// (fx, fy) : objectif commun de l'ordre (le point cliqué), qui sert de cible au champ de flux ; ainsi toutes
// les unités d'un même ordre partagent un seul calcul au lieu d'un par place de formation.
function routeWaypoint(u, gx, gy, fx = gx, fy = gy, now = 0) {
  if (!terrainActive || pathSegmentClear(u.x, u.y, gx, gy)) { u.wp = null; return null; }
  const goalIdx = nearestFreeCell(pathCellOf(fx, fy));
  // Point de passage encore frais et toujours visible : inutile de recalculer
  if (u.wp && u.wpGoal === goalIdx && now - u.wpT < WAYPOINT_TTL && now >= u.wpT) return u.wp;
  const f = getFlowField(goalIdx);
  if (!f) return u.wp && u.wpGoal === goalIdx ? u.wp : null;
  let cur = pathCellOf(u.x, u.y);
  // Unité sur une cellule bloquée (collée à un bâtiment, au bord d'une falaise) : on part de la cellule libre la plus proche
  if (!Number.isFinite(f[cur])) cur = nearestFreeCell(cur);
  let best = null, last = null;
  for (let step = 0; step < 14; step++) {
    const cx = cur % PATH_N, cy = (cur / PATH_N) | 0;
    let nb = -1, nv = f[cur];
    for (const [ox, oy] of NB8) {
      const nx = cx + ox, ny = cy + oy;
      if (nx < 0 || ny < 0 || nx >= PATH_N || ny >= PATH_N) continue;
      const ni = ny * PATH_N + nx;
      if (f[ni] < nv) { nv = f[ni]; nb = ni; }
    }
    if (nb < 0) break;
    cur = nb;
    const px = ((cur % PATH_N) + 0.5) * PATH_CELL, py = (((cur / PATH_N) | 0) + 0.5) * PATH_CELL;
    last = { x: px, y: py };
    if (pathSegmentClear(u.x, u.y, px, py, 0)) best = last;
    else if (best) break;
  }
  u.wp = best || last;
  u.wpGoal = goalIdx;
  u.wpT = now;
  return u.wp;
}

/* ---------- Décor : arbres / cheminées / cristaux ---------- */
function scatterDecor(mapId, F) {
  TREES_3D.length = 0;
  const rnd = mulberry(mapId === 'magma' ? 20261021 : mapId === 'glace' ? 20261022 : 20261019);
  const W = WORLD_SIZE;
  const count = Math.round((mapId === 'vallee' ? 230 : 170) * (W / BASE_WORLD) ** 2);
  const roadNear = (x, y) => F.roads.some((r) => segDist(x, y, r[0], r[1], r[2], r[3]) < r[4] + 34);
  const resNear = (x, y) => MINERAL_NODES.some((m) => hypot(x, y, m.x, m.y) < 95) || GAS_GEYSERS.some((g) => hypot(x, y, g.x, g.y) < 110);
  const expoNear = (x, y) => F.expos.some((e) => hypot(x, y, e.x, e.y) < 190);
  let tries = 0;
  while (TREES_3D.length < count && tries < count * 12) {
    tries++;
    const tx = 50 + rnd() * (W - 100), ty = 50 + rnd() * (W - 100);
    const t = terTypeAt(tx, ty);
    if (t !== T_LOW) continue;
    if (isAreaBlocked(tx, ty, 30)) continue;
    if (F.plateaus.some((p) => hypot(tx, ty, p.x, p.y) < p.r + CLIFF_W + RAMP_LEN + 40)) continue;
    if (roadNear(tx, ty) || resNear(tx, ty) || expoNear(tx, ty)) continue;
    // Les arbres poussent surtout au pied des montagnes et le long de l'eau
    const hNear = heightAt(tx, ty);
    if (hNear < 6 && rnd() < 0.55) continue;
    const type = mapId === 'magma' ? 'volcano' : mapId === 'glace' ? 'crystal' : 'tree';
    const pal = type === 'volcano' ? ['#2a1e20', '#362426', '#1e1618', '#422b28']
      : type === 'crystal' ? ['#1fc7c1', '#5cd5eb', '#89e5f5', '#38bdf8', '#a5f3fc']
        : ['#2d6632', '#39783c', '#245429', '#468a44', '#2f5f2a'];
    TREES_3D.push({ x: tx, y: ty, r: 15 + rnd() * 12, col: pal[(rnd() * pal.length) | 0], h: 32 + rnd() * 26, type });
  }
}

/* ---------- Texture du sol (canvas) ---------- */
let terrainCanvas = null;
let terrainTexScale = 1;
const THEMES = {
  vallee: { ground: '#3d7440', blotA: 'rgba(38,84,44,0.38)', blotB: 'rgba(96,150,80,0.26)', speckA: 'rgba(22,50,28,0.22)', speckB: 'rgba(150,200,115,0.2)',
    plateau: '#55804a', plateauB: '#6b9258', rock: [118, 108, 94], rock2: [84, 76, 66], snow: true, cliff: [70, 64, 56],
    road: ['#16181d', '#cbbf9f', '#4a4d55'], roadDash: 'rgba(255,248,234,0.45)', pad: '#5a5e69', padRing: '#ffc531' },
  magma: { ground: '#1b1115', blotA: 'rgba(28,18,24,0.45)', blotB: 'rgba(52,26,30,0.34)', speckA: 'rgba(22,10,14,0.3)', speckB: 'rgba(255,69,0,0.12)',
    plateau: '#2e2128', plateauB: '#3b2a32', rock: [58, 42, 46], rock2: [34, 24, 28], snow: false, cliff: [30, 20, 24],
    road: ['#0e0a0c', '#ff7b00', '#2d2732'], roadDash: 'rgba(255,140,0,0.6)', pad: '#2d252c', padRing: '#ff4500' },
  glace: { ground: '#1a3446', blotA: 'rgba(24,60,86,0.42)', blotB: 'rgba(120,180,210,0.18)', speckA: 'rgba(8,28,44,0.24)', speckB: 'rgba(200,245,255,0.22)',
    plateau: '#3d6580', plateauB: '#4c7896', rock: [150, 186, 206], rock2: [74, 108, 130], snow: true, cliff: [52, 84, 104],
    road: ['#0a1d2c', '#9be7ff', '#2b506b'], roadDash: 'rgba(255,255,255,0.7)', pad: '#344e60', padRing: '#00f0ff' },
};

function buildTerrainCanvas(mapId = activeMapId) {
  if (!MAP_DEFS[mapId]) mapId = 'vallee';
  const F = MAP_FEATURES;
  const T = THEMES[mapId] || THEMES.vallee;
  const W = WORLD_SIZE;
  const texSize = Math.min(W, 3600);
  terrainTexScale = texSize / W;
  const c = document.createElement('canvas');
  c.width = texSize;
  c.height = texSize;
  const g = c.getContext('2d');
  g.scale(terrainTexScale, terrainTexScale);
  const rnd = mulberry(mapId === 'magma' ? 9021 : mapId === 'glace' ? 9022 : 9019);
  const area = (W / BASE_WORLD) ** 2;

  g.fillStyle = T.ground;
  g.fillRect(0, 0, W, W);
  for (let k = 0; k < 70 * area; k++) {
    const bx = rnd() * W, by = rnd() * W, br = 90 + rnd() * 210;
    g.fillStyle = rnd() < 0.5 ? T.blotA : T.blotB;
    g.beginPath(); g.arc(bx, by, br, 0, TAU); g.fill();
  }
  for (let k = 0; k < 11000 * area; k++) {
    g.fillStyle = rnd() < 0.55 ? T.speckA : T.speckB;
    g.fillRect(rnd() * W, rnd() * W, 2 + rnd() * 3.5, 2 + rnd() * 3.5);
  }
  if (mapId === 'magma') {
    for (let k = 0; k < 30 * area; k++) {
      const fx = rnd() * W, fy = rnd() * W;
      g.strokeStyle = 'rgba(255, 80, 0, 0.2)';
      g.lineWidth = 3 + rnd() * 6;
      g.beginPath(); g.moveTo(fx, fy); g.lineTo(fx + (rnd() - 0.5) * 260, fy + (rnd() - 0.5) * 260); g.stroke();
    }
  }

  // Eau / lave / crevasses
  const half = F.liquidHalf;
  const liqStyles = mapId === 'magma'
    ? [['#2b0704', half * 2 + 38], ['#7c1305', half * 2 + 18], ['#d62c00', half * 2 - 6], ['#ff6200', half * 2 - 32], ['#ffea66', half * 2 - 64]]
    : mapId === 'glace'
      ? [['#051018', half * 2 + 36], ['#0a3d54', half * 2 + 16], ['#00c7db', half * 2 - 12], ['#5eead4', half * 2 - 36], ['#e0faff', half * 2 - 62]]
      : [['#2e3a2c', half * 2 + 38], ['#c8ba9b', half * 2 + 22], ['#1d5f88', half * 2], ['#2b7fb5', half * 2 - 24], ['#4aa3d6', half * 2 - 56]];
  g.lineCap = 'round';
  g.lineJoin = 'round';
  for (const [col, w] of liqStyles) {
    g.strokeStyle = col; g.lineWidth = Math.max(4, w);
    for (const c4 of F.liquids) {
      g.beginPath(); g.moveTo(c4[0], c4[1]); g.bezierCurveTo(c4[2], c4[3], c4[4], c4[5], c4[6], c4[7]); g.stroke();
    }
    g.fillStyle = col;
    for (const p of F.pools) {
      const r = p.r + (w - half * 2) / 2;
      if (r <= 4) continue;
      g.beginPath();
      for (let s = 0; s <= 40; s++) {
        const a = (s / 40) * TAU;
        const rr = r * (1 + 0.12 * Math.sin(a * 5 + p.x));
        const px = p.x + Math.cos(a) * rr, py = p.y + Math.sin(a) * rr;
        if (s === 0) g.moveTo(px, py); else g.lineTo(px, py);
      }
      g.fill();
    }
  }

  // Routes et ponts
  for (const [col, extra] of [[T.road[0], 16], [T.road[1], 8], [T.road[2], -4]]) {
    g.strokeStyle = col;
    for (const r of F.roads) {
      g.lineWidth = r[4] * 2 + extra;
      g.beginPath(); g.moveTo(r[0], r[1]); g.lineTo(r[2], r[3]); g.stroke();
    }
  }
  g.save();
  g.strokeStyle = T.roadDash; g.lineWidth = 3; g.setLineDash([20, 20]); g.lineCap = 'butt';
  for (const r of F.roads) { g.beginPath(); g.moveTo(r[0], r[1]); g.lineTo(r[2], r[3]); g.stroke(); }
  g.restore();

  // Plateaux, rampes
  for (const P of F.plateaus) {
    g.save();
    g.fillStyle = 'rgba(0,0,0,0.35)';
    g.beginPath(); g.arc(P.x + 10, P.y + 14, P.r + CLIFF_W + 6, 0, TAU); g.fill();
    const grad = g.createRadialGradient(P.x, P.y, P.r * 0.2, P.x, P.y, P.r);
    grad.addColorStop(0, T.plateauB); grad.addColorStop(1, T.plateau);
    g.fillStyle = grad;
    g.beginPath(); g.arc(P.x, P.y, P.r + 2, 0, TAU); g.fill();
    for (let k = 0; k < 900 * (P.r / 330) ** 2; k++) {
      const a = rnd() * TAU, rr = Math.sqrt(rnd()) * P.r;
      g.fillStyle = rnd() < 0.5 ? T.speckA : T.speckB;
      g.fillRect(P.x + Math.cos(a) * rr, P.y + Math.sin(a) * rr, 2 + rnd() * 3, 2 + rnd() * 3);
    }
    for (const a of P.ramps) {
      g.save();
      g.translate(P.x, P.y); g.rotate(a);
      const rg = g.createLinearGradient(P.r - 10, 0, P.r + RAMP_LEN, 0);
      rg.addColorStop(0, T.plateau); rg.addColorStop(1, T.road[2]);
      g.fillStyle = rg;
      g.fillRect(P.r - 30, -RAMP_HALF, RAMP_LEN + 34, RAMP_HALF * 2);
      g.strokeStyle = 'rgba(0,0,0,0.28)'; g.lineWidth = 3;
      for (let s = 0; s < 7; s++) {
        const x = P.r + 8 + s * (RAMP_LEN / 7);
        g.beginPath(); g.moveTo(x, -RAMP_HALF + 8); g.lineTo(x, RAMP_HALF - 8); g.stroke();
      }
      g.fillStyle = T.padRing;
      for (const sgn of [-1, 1]) g.fillRect(P.r - 4, sgn * (RAMP_HALF - 4) - 3, RAMP_LEN * 0.85, 6);
      g.restore();
    }
    // Dalle de base (QG) ou anneau central
    g.setLineDash([18, 14]);
    g.strokeStyle = T.padRing; g.lineWidth = 4;
    if (P.main) {
      g.fillStyle = T.pad;
      g.beginPath(); g.arc(P.x, P.y, 96, 0, TAU); g.fill();
      g.beginPath(); g.arc(P.x, P.y, 106, 0, TAU); g.stroke();
    } else {
      g.beginPath(); g.arc(P.x, P.y, 112, 0, TAU); g.stroke();
      g.beginPath(); g.arc(P.x, P.y, P.r - 26, 0, TAU); g.stroke();
    }
    g.restore();
  }

  // Ombrage du relief + roche des montagnes et falaises (calculé depuis la grille de hauteur)
  const N = TER_N;
  const sh = document.createElement('canvas');
  sh.width = N; sh.height = N;
  const sg = sh.getContext('2d');
  const img = sg.createImageData(N, N);
  const d = img.data;
  const H = (x, y) => terH[clamp(y, 0, N - 1) * N + clamp(x, 0, N - 1)];
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    const i = y * N + x, o = i * 4;
    const nx = (H(x - 1, y) - H(x + 1, y)) / (2 * TER_CELL), ny = (H(x, y - 1) - H(x, y + 1)) / (2 * TER_CELL);
    const len = Math.hypot(nx, ny, 1);
    const light = (nx * -0.55 + ny * -0.62 + 0.56) / len;     // lumière venant du nord-ouest
    const t = terType[i];
    if (t === T_MOUNT || t === T_CLIFF) {
      const hgt = terH[i];
      const base = t === T_CLIFF ? T.cliff : (hgt > 82 ? T.rock : T.rock2);
      let [r, gg, b] = base;
      const k2 = clamp(0.55 + light * 0.75, 0.25, 1.35);
      r *= k2; gg *= k2; b *= k2;
      if (T.snow && t === T_MOUNT && hgt > 104) { const s = smooth01((hgt - 104) / 22); r = lerp(r, 236, s); gg = lerp(gg, 242, s); b = lerp(b, 248, s); }
      if (mapId === 'magma' && t === T_MOUNT && hgt > 110) { const s = smooth01((hgt - 110) / 18); r = lerp(r, 255, s * 0.8); gg = lerp(gg, 90, s * 0.8); b = lerp(b, 10, s * 0.8); }
      d[o] = r; d[o + 1] = gg; d[o + 2] = b; d[o + 3] = 255;
    } else {
      const shade = clamp(0.62 - light, -0.4, 0.6);
      if (shade > 0) { d[o] = 0; d[o + 1] = 0; d[o + 2] = 0; d[o + 3] = Math.round(shade * 230); }
      else { d[o] = 255; d[o + 1] = 248; d[o + 2] = 220; d[o + 3] = Math.round(-shade * 70); }
    }
  }
  sg.putImageData(img, 0, 0);
  g.imageSmoothingEnabled = true;
  g.drawImage(sh, 0, 0, N * TER_CELL, N * TER_CELL);

  g.strokeStyle = '#0b0e12';
  g.lineWidth = 18;
  g.strokeRect(9, 9, W - 18, W - 18);
  terrainCanvas = c;
}

}

/* ============================================================================
   AUDIO SYNTHÉTISÉ + BANDE-SON ORCHESTRALE RTS ÉPIQUE (WebAudio)
   ============================================================================ */
const Sfx = (() => {
  // Bus audio : musique et effets ont chacun leur volume, et un gain maître coupe TOUT (bouton / touche M)
  const SAVE_KEY = 'bastion_audio_v2';
  const cfg = { musicOn: true, sfxOn: true, musicVol: 0.55, sfxVol: 0.8, allMuted: false };
  try { Object.assign(cfg, JSON.parse(localStorage.getItem(SAVE_KEY) || '{}')); } catch (e) { /* stockage indisponible */ }
  const save = () => { try { localStorage.setItem(SAVE_KEY, JSON.stringify(cfg)); } catch (e) { /* ignoré */ } };

  let ctx = null, musicTimer = null;
  let stepIdx = 0, nextNoteTime = 0, noiseBuf = null, masterComp = null;
  let masterGain = null, musicBus = null, sfxBus = null;
  let lastMineSound = 0, lastShotSound = 0, lastBoomSound = 0;
  let combatUntil = 0, musicMode = 'calm', pendingMode = 'calm';

  function applyGains() {
    if (!ctx || !masterGain) return;
    const t = ctx.currentTime;
    masterGain.gain.setTargetAtTime(cfg.allMuted ? 0 : 1, t, 0.03);
    musicBus.gain.setTargetAtTime(cfg.musicOn ? cfg.musicVol * 0.9 : 0, t, 0.05);
    sfxBus.gain.setTargetAtTime(cfg.sfxOn ? cfg.sfxVol : 0, t, 0.03);
  }

  function ensureContext() {
    if (!ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) ctx = new AC();
    }
    if (ctx && ctx.state === 'suspended') ctx.resume().catch(() => {});
    if (ctx && !masterComp) {
      masterComp = ctx.createDynamicsCompressor();
      masterComp.threshold.setValueAtTime(-14, ctx.currentTime);
      masterComp.knee.setValueAtTime(12, ctx.currentTime);
      masterComp.ratio.setValueAtTime(5, ctx.currentTime);
      masterComp.attack.setValueAtTime(0.003, ctx.currentTime);
      masterComp.release.setValueAtTime(0.16, ctx.currentTime);
      masterGain = ctx.createGain();
      musicBus = ctx.createGain();
      sfxBus = ctx.createGain();
      musicBus.connect(masterComp);
      sfxBus.connect(masterComp);
      masterComp.connect(masterGain);
      masterGain.connect(ctx.destination);
      applyGains();
    }
    if (ctx && !noiseBuf) {
      const len = ctx.sampleRate * 1.0;
      noiseBuf = ctx.createBuffer(1, len, ctx.sampleRate);
      const data = noiseBuf.getChannelData(0);
      let lastOut = 0.0;
      for (let i = 0; i < len; i++) {
        const white = Math.random() * 2 - 1;
        lastOut = (lastOut * 0.45) + (white * 0.55);
        data[i] = lastOut;
      }
    }
    return ctx;
  }

  function dest() { return sfxBus || (ctx ? ctx.destination : null); }
  function mdest() { return musicBus || (ctx ? ctx.destination : null); }

  function ensure() {
    if (cfg.allMuted || !cfg.sfxOn) return null;
    return ensureContext();
  }

  function tone(freq, dur, type = 'triangle', vol = 0.11, slide = 0) {
    const c = ensure(); if (!c) return;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type;
    const t = c.currentTime;
    o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(dest());
    o.start(t); o.stop(t + dur);
  }

  // --- INSTRUMENTS DE LA MUSIQUE ÉPIQUE RTS (Ré mineur / 132 BPM) ---
  function mtof(midi) {
    return 440 * Math.pow(2, (midi - 69) / 12);
  }

  function playKick(c, t, accent = false) {
    const o = c.createOscillator(), g = c.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(accent ? 145 : 120, t);
    o.frequency.exponentialRampToValueAtTime(34, t + 0.19);
    g.gain.setValueAtTime(accent ? 0.22 : 0.16, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.22);
    o.connect(g); g.connect(mdest());
    o.start(t); o.stop(t + 0.23);
  }

  function playSnare(c, t, vol = 0.09) {
    if (noiseBuf) {
      const src = c.createBufferSource();
      src.buffer = noiseBuf;
      const flt = c.createBiquadFilter();
      flt.type = 'bandpass';
      flt.frequency.setValueAtTime(1650, t);
      const g = c.createGain();
      g.gain.setValueAtTime(vol, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.14);
      src.connect(flt); flt.connect(g); g.connect(mdest());
      src.start(t); src.stop(t + 0.15);
    }
    const o = c.createOscillator(), og = c.createGain();
    o.type = 'triangle';
    o.frequency.setValueAtTime(195, t);
    o.frequency.exponentialRampToValueAtTime(92, t + 0.09);
    og.gain.setValueAtTime(vol * 0.7, t);
    og.gain.exponentialRampToValueAtTime(0.001, t + 0.1);
    o.connect(og); og.connect(mdest());
    o.start(t); o.stop(t + 0.11);
  }

  function playHat(c, t, open = false) {
    if (!noiseBuf) return;
    const src = c.createBufferSource();
    src.buffer = noiseBuf;
    const flt = c.createBiquadFilter();
    flt.type = 'highpass';
    flt.frequency.setValueAtTime(6500, t);
    const g = c.createGain();
    const dur = open ? 0.14 : 0.045;
    g.gain.setValueAtTime(open ? 0.045 : 0.026, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    src.connect(flt); flt.connect(g); g.connect(mdest());
    src.start(t); src.stop(t + dur + 0.01);
  }

  function playBass(c, t, midi, dur) {
    const f = mtof(midi);
    const o1 = c.createOscillator(), o2 = c.createOscillator();
    const flt = c.createBiquadFilter(), g = c.createGain();
    o1.type = 'sawtooth'; o2.type = 'square';
    o1.frequency.setValueAtTime(f, t);
    o2.frequency.setValueAtTime(f * 0.5, t);
    flt.type = 'lowpass';
    flt.frequency.setValueAtTime(680, t);
    flt.frequency.exponentialRampToValueAtTime(190, t + dur);
    g.gain.setValueAtTime(0.085, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o1.connect(flt); o2.connect(flt); flt.connect(g); g.connect(mdest());
    o1.start(t); o2.start(t);
    o1.stop(t + dur + 0.01); o2.stop(t + dur + 0.01);
  }

  function playBrassChord(c, t, midis, dur) {
    const flt = c.createBiquadFilter(), g = c.createGain();
    flt.type = 'lowpass';
    flt.frequency.setValueAtTime(420, t);
    flt.frequency.linearRampToValueAtTime(1450, t + dur * 0.35);
    flt.frequency.exponentialRampToValueAtTime(520, t + dur);
    g.gain.setValueAtTime(0.002, t);
    g.gain.linearRampToValueAtTime(0.048, t + 0.08);
    g.gain.setValueAtTime(0.042, t + dur * 0.7);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    flt.connect(g); g.connect(mdest());

    for (const m of midis) {
      for (const det of [-4.5, 4.5]) {
        const o = c.createOscillator();
        o.type = 'sawtooth';
        o.frequency.setValueAtTime(mtof(m), t);
        o.detune.setValueAtTime(det, t);
        o.connect(flt);
        o.start(t); o.stop(t + dur + 0.02);
      }
    }
  }

  function playHeroLead(c, t, midi, dur) {
    const f = mtof(midi);
    const o1 = c.createOscillator(), o2 = c.createOscillator();
    const flt = c.createBiquadFilter(), g = c.createGain();
    o1.type = 'sawtooth'; o2.type = 'triangle';
    o1.frequency.setValueAtTime(f, t);
    o2.frequency.setValueAtTime(f, t);
    o1.detune.setValueAtTime(6, t);
    o2.detune.setValueAtTime(-6, t);
    flt.type = 'lowpass';
    flt.frequency.setValueAtTime(2400, t);
    g.gain.setValueAtTime(0.002, t);
    g.gain.linearRampToValueAtTime(0.068, t + 0.025);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o1.connect(flt); o2.connect(flt); flt.connect(g); g.connect(mdest());
    o1.start(t); o2.start(t);
    o1.stop(t + dur + 0.02); o2.stop(t + dur + 0.02);
  }

  // Partition épique sur 64 pas (4 mesures en 4/4 à 132 BPM : Dm -> Bb -> Gm -> A7 / Dm -> F -> C -> A7)
  const CHORDS_8BARS = [
    [50, 57, 62, 65], // Dm
    [46, 53, 58, 62], // Bb
    [43, 50, 55, 58], // Gm
    [45, 52, 57, 61], // A7
    [50, 57, 62, 65], // Dm
    [41, 48, 53, 57], // F
    [48, 55, 60, 64], // C
    [45, 52, 57, 61], // A7
  ];
  const BASS_ROOTS = [38, 34, 31, 33, 38, 41, 36, 33];

  // Mélodie héroïque style Terran / Command & Conquer (par pas de 1/16e sur 128 pas = 8 mesures)
  const LEAD_SEQ = {
    0: [62, 3], 3: [65, 3], 6: [69, 6], 12: [67, 2], 14: [65, 2],
    16: [64, 6], 22: [62, 4], 26: [58, 6],
    32: [62, 3], 35: [65, 3], 38: [67, 6], 44: [70, 4],
    48: [69, 10], 58: [64, 3], 61: [67, 3],
    64: [69, 4], 68: [74, 6], 74: [72, 3], 77: [69, 3],
    80: [65, 6], 86: [69, 4], 90: [72, 6],
    96: [70, 4], 100: [67, 4], 104: [64, 4], 108: [67, 4],
    112: [69, 12], 124: [61, 4],
  };

  // --- MUSIQUE CALME (exploration / économie) : nappes, arpège, basse ronde ---
  const CALM_CHORDS = [
    [50, 57, 60, 65, 69], // Dm9
    [46, 53, 57, 62, 65], // Bbmaj7
    [43, 50, 53, 58, 62], // Gm9
    [45, 52, 55, 61, 64], // A7sus
  ];
  function playPad(c, t, midis, dur) {
    const flt = c.createBiquadFilter(), g = c.createGain();
    flt.type = 'lowpass';
    flt.frequency.setValueAtTime(380, t);
    flt.frequency.linearRampToValueAtTime(900, t + dur * 0.5);
    flt.frequency.linearRampToValueAtTime(420, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(0.034, t + dur * 0.3);
    g.gain.setValueAtTime(0.03, t + dur * 0.75);
    g.gain.linearRampToValueAtTime(0.0001, t + dur + 0.4);
    flt.connect(g); g.connect(mdest());
    for (const m of midis) {
      for (const det of [-7, 7]) {
        const o = c.createOscillator();
        o.type = 'sawtooth';
        o.frequency.setValueAtTime(mtof(m), t);
        o.detune.setValueAtTime(det, t);
        o.connect(flt);
        o.start(t); o.stop(t + dur + 0.45);
      }
    }
  }
  function playPluck(c, t, midi, vol = 0.035) {
    const o = c.createOscillator(), flt = c.createBiquadFilter(), g = c.createGain();
    o.type = 'triangle';
    o.frequency.setValueAtTime(mtof(midi), t);
    flt.type = 'lowpass';
    flt.frequency.setValueAtTime(3200, t);
    flt.frequency.exponentialRampToValueAtTime(600, t + 0.5);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0008, t + 0.6);
    o.connect(flt); flt.connect(g); g.connect(mdest());
    o.start(t); o.stop(t + 0.62);
  }
  function playSub(c, t, midi, dur) {
    const o = c.createOscillator(), g = c.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(mtof(midi), t);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(0.07, t + 0.08);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(mdest());
    o.start(t); o.stop(t + dur + 0.02);
  }
  const ARP_SHAPE = [0, 2, 4, 3, 1, 3, 4, 2];

  function scheduleCalmStep(c, t, s, stepDur) {
    const bar = Math.floor(s / 16) % 8, inBar = s % 16;
    const chord = CALM_CHORDS[Math.floor(bar / 2) % 4];
    if (inBar === 0 && bar % 2 === 0) playPad(c, t, chord, stepDur * 32);
    if (inBar === 0) playSub(c, t, chord[0] - 12, stepDur * 15);
    if (inBar === 8 && bar % 2 === 1) playSub(c, t, chord[0] - 5, stepDur * 7);
    if (inBar % 2 === 0) {
      const idx = ARP_SHAPE[(inBar / 2 + bar) % 8];
      const note = chord[idx] + 12;
      playPluck(c, t, note, inBar === 0 ? 0.04 : 0.028);
      if (inBar % 4 === 0) playPluck(c, t + stepDur * 3, note + 12, 0.012);   // écho
    }
    if (inBar === 0) playKick(c, t, false);
    if (inBar === 8 && bar % 2 === 1) playKick(c, t, false);
    if (inBar % 4 === 2) playHat(c, t, false);
  }

  function scheduleBattleStep(c, t, s, stepDur) {
    const bar = Math.floor(s / 16) % 8, inBar = s % 16;
    if (inBar === 0) playBrassChord(c, t, CHORDS_8BARS[bar], stepDur * 15.5);
    const root = BASS_ROOTS[bar];
    if (inBar % 2 === 0 || inBar === 3 || inBar === 11 || inBar === 15) {
      const pitch = (inBar === 6 || inBar === 14) ? root + 12 : (inBar === 15 ? root + 7 : root);
      playBass(c, t, pitch, stepDur * 1.6);
    }
    if (inBar === 0 || inBar === 6 || inBar === 8 || inBar === 11) playKick(c, t, inBar === 0 || inBar === 8);
    if (inBar === 4 || inBar === 12) playSnare(c, t, 0.095);
    else if (bar % 2 === 1 && (inBar === 14 || inBar === 15)) playSnare(c, t, 0.065);
    if (inBar % 2 === 0) playHat(c, t, inBar === 10);
    const note = LEAD_SEQ[s % 128];
    if (note) playHeroLead(c, t, note[0], stepDur * note[1]);
  }

  function scheduleMusic() {
    if (!cfg.musicOn || cfg.allMuted) return;
    const c = ensureContext();
    if (!c || c.state !== 'running') return;
    const stepDur = 60 / 132 / 4;
    if (nextNoteTime < c.currentTime) nextNoteTime = c.currentTime + 0.04;
    pendingMode = performance.now() < combatUntil ? 'battle' : 'calm';
    while (nextNoteTime < c.currentTime + 0.25) {
      // Changement d'ambiance seulement en début de mesure (transition propre)
      if (stepIdx % 16 === 0 && pendingMode !== musicMode) {
        musicMode = pendingMode;
        stepIdx = 0;
        if (musicMode === 'battle') playSnare(c, nextNoteTime, 0.08);
      }
      if (musicMode === 'battle') scheduleBattleStep(c, nextNoteTime, stepIdx, stepDur);
      else scheduleCalmStep(c, nextNoteTime, stepIdx, stepDur);
      nextNoteTime += stepDur;
      stepIdx++;
    }
  }

  function startMusic() {
    const c = ensureContext();
    if (c && nextNoteTime < c.currentTime) nextNoteTime = c.currentTime + 0.05;
    if (!musicTimer) musicTimer = setInterval(scheduleMusic, 80);
  }

  function stopMusic() {
    if (musicTimer) {
      clearInterval(musicTimer);
      musicTimer = null;
    }
  }

  function chime(notes, type = 'triangle', vol = 0.07, gap = 0.07, len = 0.16, bus = dest) {
    const c = ensureContext(); if (!c || cfg.allMuted) return;
    const t = c.currentTime;
    notes.forEach((f, i) => {
      const o = c.createOscillator(), g = c.createGain(), flt = c.createBiquadFilter();
      o.type = type;
      o.frequency.setValueAtTime(f, t + i * gap);
      flt.type = 'lowpass'; flt.frequency.setValueAtTime(3600, t);
      g.gain.setValueAtTime(0.0001, t + i * gap);
      g.gain.linearRampToValueAtTime(vol, t + i * gap + 0.01);
      g.gain.exponentialRampToValueAtTime(0.001, t + i * gap + len);
      o.connect(flt); flt.connect(g); g.connect(bus());
      o.start(t + i * gap); o.stop(t + i * gap + len + 0.02);
    });
  }

  return {
    get muted() { return cfg.allMuted; },
    get settings() { return { ...cfg }; },
    get musicPlaying() { return cfg.musicOn && !cfg.allMuted; },
    toggleAll() { cfg.allMuted = !cfg.allMuted; ensureContext(); applyGains(); save(); return cfg.allMuted; },
    setMusicOn(v) { cfg.musicOn = !!v; ensureContext(); applyGains(); if (cfg.musicOn) startMusic(); save(); },
    setSfxOn(v) { cfg.sfxOn = !!v; ensureContext(); applyGains(); save(); },
    setMusicVol(v) { cfg.musicVol = clamp(v, 0, 1); ensureContext(); applyGains(); save(); },
    setSfxVol(v) { cfg.sfxVol = clamp(v, 0, 1); ensureContext(); applyGains(); save(); },
    // Appelé à chaque échange de tirs visible : la musique passe en mode bataille ~14 s
    combat() { combatUntil = performance.now() + 14000; },
    startMusic,
    stopMusic,
    wake() {
      ensureContext();
      applyGains();
      if (!musicTimer) startMusic();
    },
    victory() { stopMusic(); chime([587, 740, 880, 1175, 1480], 'sawtooth', 0.06, 0.13, 0.55, mdest); setTimeout(() => chime([294, 440, 587, 880], 'triangle', 0.07, 0.0, 1.6, mdest), 700); },
    defeat() { stopMusic(); chime([440, 415, 370, 294], 'sawtooth', 0.05, 0.22, 0.6, mdest); setTimeout(() => chime([147, 220, 294], 'triangle', 0.08, 0.0, 1.8, mdest), 900); },
    // Alerte « Base attaquée » : sirène à deux tons
    alert() {
      const c = ensure(); if (!c) return;
      const t = c.currentTime;
      for (let k = 0; k < 3; k++) {
        const o = c.createOscillator(), g = c.createGain(), flt = c.createBiquadFilter();
        o.type = 'sawtooth';
        o.frequency.setValueAtTime(k % 2 ? 620 : 880, t + k * 0.18);
        flt.type = 'lowpass'; flt.frequency.setValueAtTime(1800, t);
        g.gain.setValueAtTime(0.0001, t + k * 0.18);
        g.gain.linearRampToValueAtTime(0.07, t + k * 0.18 + 0.02);
        g.gain.exponentialRampToValueAtTime(0.001, t + k * 0.18 + 0.17);
        o.connect(flt); flt.connect(g); g.connect(dest());
        o.start(t + k * 0.18); o.stop(t + k * 0.18 + 0.19);
      }
    },
    // Tour de Détection : impulsion radar
    radar() {
      const c = ensure(); if (!c) return;
      const t = c.currentTime;
      for (const [d, v] of [[0, 0.09], [0.22, 0.04], [0.44, 0.018]]) {
        const o = c.createOscillator(), g = c.createGain();
        o.type = 'sine';
        o.frequency.setValueAtTime(1320, t + d);
        o.frequency.exponentialRampToValueAtTime(990, t + d + 0.16);
        g.gain.setValueAtTime(v, t + d);
        g.gain.exponentialRampToValueAtTime(0.001, t + d + 0.2);
        o.connect(g); g.connect(dest());
        o.start(t + d); o.stop(t + d + 0.22);
      }
    },
    ping() { chime([1568, 2093], 'sine', 0.05, 0.05, 0.12); },
    done() { chime([523, 659, 784, 1047], 'triangle', 0.07, 0.07, 0.22); },
    click() { chime([1800], 'square', 0.018, 0, 0.03); },
    ack(kind = 'marine') {
      // « Bien reçu » radio : petit motif différent selon le type d'unité
      const c = ensure(); if (!c) return;
      const t = c.currentTime;
      const base = kind === 'scv' ? 420 : (kind === 'tank' || kind === 'siege' || kind === 'titan') ? 230 : (kind === 'dropship' || kind === 'medivac') ? 560 : 330;
      [1, 1.25, 1.12].forEach((m, i) => {
        const o = c.createOscillator(), flt = c.createBiquadFilter(), g = c.createGain();
        o.type = 'square';
        o.frequency.setValueAtTime(base * m, t + i * 0.045);
        flt.type = 'bandpass'; flt.frequency.setValueAtTime(1400, t); flt.Q.setValueAtTime(2.5, t);
        g.gain.setValueAtTime(0.03, t + i * 0.045);
        g.gain.exponentialRampToValueAtTime(0.001, t + i * 0.045 + 0.05);
        o.connect(flt); flt.connect(g); g.connect(dest());
        o.start(t + i * 0.045); o.stop(t + i * 0.045 + 0.06);
      });
      if (noiseBuf) {
        const src = c.createBufferSource(), flt = c.createBiquadFilter(), g = c.createGain();
        src.buffer = noiseBuf;
        flt.type = 'highpass'; flt.frequency.setValueAtTime(2500, t);

        src.start(t + 0.14); src.stop(t + 0.21);
      }
    },
    canShoot() { const n = performance.now(); if (n - lastShotSound < 45) return false; lastShotSound = n; return true; },
    canBoom() { const n = performance.now(); if (n - lastBoomSound < 70) return false; lastBoomSound = n; return true; },

    shoot() {
