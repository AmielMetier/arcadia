   MOTEUR 3D VUE DU DESSUS (TOP-DOWN 3D PERSPECTIVE & EXTRUSION VOLUMÉTRIQUE)
   ============================================================================ */
const cvs = $('#world'), ctx = cvs.getContext('2d');
const miniCvs = $('#minimap'), miniCtx = miniCvs.getContext('2d');
let W = 0, H = 0, DPR = 1;

function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = window.innerWidth;
  H = window.innerHeight;
  cvs.width = Math.round(W * DPR);
  cvs.height = Math.round(H * DPR);
}
window.addEventListener('resize', resize);
resize();

const cam = { x: HALF_W, y: HALF_W, z: 0.88, shake: 0 };
const keys = {};
const mouse = { x: W / 2, y: H / 2, wx: HALF_W, wy: HALF_W, down: false, dragStart: null, panning: false, panStart: null };

let myId = 0;
let role = 'solo';
let state = null;
let buildMode = null;
let orderCursor = null; // 'amove' | 'scan' | null
let selectedUnits = new Set();
let selectedBlds = new Set();
const controlGroups = { 1: [], 2: [], 3: [], 4: [], 5: [], 6: [], 7: [], 8: [], 9: [] };
let lastGroupTap = { g: 0, t: 0 };
let lastClickUnit = { id: 0, kind: '', t: 0 };

let particles = [];
let shockwaves = [];
let projectiles = [];
let beams = [];
let craters = [];
let orderMarkers = [];
let reportedResult = false;

const FOG_RES = 200;
const fogCanvas = document.createElement('canvas');
fogCanvas.width = FOG_RES;
fogCanvas.height = FOG_RES;
const fogCtx = fogCanvas.getContext('2d');
const exploredGrid = new Uint8Array(FOG_RES * FOG_RES);

function isVisibleToMe(wx, wy) {
  if (!state) return true;
  const me = state.players.find((p) => p.id === myId);
  if (!me || me.dead) return true;
  for (const b of state.buildings) {
    if (b.team === me.team && b.hp > 0) {
      const s = BUILDINGS[b.kind]?.sight || 300;
      if (dist2(wx, wy, b.x, b.y) <= s * s) return true;
    }
  }
  for (const u of state.units) {
    if (u.team === me.team && u.hp > 0) {
      const s = UNITS[u.kind]?.sight || 260;
      if (dist2(wx, wy, u.x, u.y) <= s * s) return true;
    }
  }
  for (const sc of state.scans) {
    if (sc.team === me.team && dist2(wx, wy, sc.x, sc.y) <= sc.r * sc.r) return true;
  }
  return false;
}

function updateFogCanvas() {
  if (!state) return;
  const me = state.players.find((p) => p.id === myId);
  if (!me) return;
  const scale = FOG_RES / WORLD_SIZE;

  const markCircle = (wx, wy, r) => {
    const cx = Math.floor(wx * scale), cy = Math.floor(wy * scale);
    const cr = Math.ceil(r * scale);
    const cr2 = cr * cr;
    for (let y = Math.max(0, cy - cr); y <= Math.min(FOG_RES - 1, cy + cr); y++) {
      for (let x = Math.max(0, cx - cr); x <= Math.min(FOG_RES - 1, cx + cr); x++) {
        if ((x - cx) ** 2 + (y - cy) ** 2 <= cr2) exploredGrid[y * FOG_RES + x] = 1;
      }
    }
  };

  fogCtx.globalCompositeOperation = 'source-over';
  fogCtx.fillStyle = 'rgba(8, 12, 16, 0.56)';
  fogCtx.fillRect(0, 0, FOG_RES, FOG_RES);

  fogCtx.globalCompositeOperation = 'destination-out';
  for (const b of state.buildings) {
    if (b.team === me.team && b.hp > 0) {
      const s = BUILDINGS[b.kind]?.sight || 300;
      markCircle(b.x, b.y, s);
      fogCtx.beginPath();
      fogCtx.arc(b.x * scale, b.y * scale, s * scale, 0, TAU);
      fogCtx.fill();
    }
  }
  for (const u of state.units) {
    if (u.team === me.team && u.hp > 0) {
      const s = UNITS[u.kind]?.sight || 260;
      markCircle(u.x, u.y, s);
      fogCtx.beginPath();
      fogCtx.arc(u.x * scale, u.y * scale, s * scale, 0, TAU);
      fogCtx.fill();
    }
  }
  for (const sc of state.scans) {
    if (sc.team === me.team) {
      markCircle(sc.x, sc.y, sc.r);
      fogCtx.beginPath();
      fogCtx.arc(sc.x * scale, sc.y * scale, sc.r * scale, 0, TAU);
      fogCtx.fill();
    }
  }
}

/* ============================================================================
   PRIMITIVES DE PROJECTION 3D VUE DU DESSUS (PERSPECTIVE CAMÉRA + FACES OMBRÉES)
   ============================================================================ */
// Projette un point local (lx, ly, z) situé autour de l'ancre monde (wx, wy) en coordonnées 2D avec point de fuite caméra
function project3DOffset(wx, wy, z, isIcon = false) {
  if (isIcon) {
    return { ox: -z * 0.14, oy: -z * 0.48 };
  }
  // Point de fuite radial depuis le centre de la caméra + inclinaison tactique vue du dessus
  const perspX = clamp((wx - cam.x) * 0.00085, -0.34, 0.34) * z;
  const perspY = clamp((wy - cam.y) * 0.00085, -0.34, 0.34) * z - z * 0.46;
  return { ox: perspX - z * 0.08, oy: perspY };
}

// Génère un polygone régulier ou boîte biseautée
function makeRectPoly(hw, hh, bevel = 5) {
  const b = Math.min(bevel, hw * 0.4, hh * 0.4);
  if (b <= 0.5) {
    return [
      { x: -hw, y: -hh }, { x: hw, y: -hh },
      { x: hw, y: hh },   { x: -hw, y: hh },
    ];
  }
  return [
    { x: -hw + b, y: -hh }, { x: hw - b, y: -hh },
    { x: hw, y: -hh + b },  { x: hw, y: hh - b },
    { x: hw - b, y: hh },   { x: -hw + b, y: hh },
    { x: -hw, y: hh - b },  { x: -hw, y: -hh + b },
  ];
}

function makeNGon(r, n = 8, rot = Math.PI / 8) {
  const pts = [];
  for (let i = 0; i < n; i++) {
    const a = rot + (i / n) * TAU;
    pts.push({ x: Math.cos(a) * r, y: Math.sin(a) * r });
  }
  return pts;
}

// Extrude un prisme 3D entre la hauteur z0 et la hauteur z1 avec calcul d'illumination par face latérale
function drawPrism3D(g, wx, wy, pts, z0, z1, baseColor, topColor, isIcon = false, topScale = 1.0) {
  const o0 = project3DOffset(wx, wy, z0, isIcon);
  const o1 = project3DOffset(wx, wy, z1, isIcon);
  const p0 = pts.map((p) => ({ x: p.x + o0.ox, y: p.y + o0.oy }));
  const p1 = pts.map((p) => ({ x: p.x * topScale + o1.ox, y: p.y * topScale + o1.oy }));

  const n = pts.length;
  const faces = [];
  for (let i = 0; i < n; i++) {
    const j = (i + 1) % n;
    const a0 = p0[i], b0 = p0[j], b1 = p1[j], a1 = p1[i];
    // Produit vectoriel 2D (Back-face culling : ne dessine que les faces orientées vers la caméra)
    const cross = (b0.x - a0.x) * (a1.y - a0.y) - (b0.y - a0.y) * (a1.x - a0.x);
    if (cross < 0) {
      const edgeDx = pts[j].x - pts[i].x, edgeDy = pts[j].y - pts[i].y;
      const len = Math.hypot(edgeDx, edgeDy) || 1;
      const nx = edgeDy / len, ny = -edgeDx / len;
      // Soleil venant du haut-gauche (-0.6, -0.8) + rebond sur la face avant (sud)
      const light = clamp(nx * -0.35 + ny * 0.25, -0.45, 0.25);
      const depthY = (a0.y + b0.y + a1.y + b1.y) * 0.25;
      faces.push({ a0, b0, b1, a1, col: shade(baseColor, light - 0.12), depthY });
    }
  }

  faces.sort((a, b) => a.depthY - b.depthY);
  g.strokeStyle = '#16181d';
  g.lineWidth = 2.6;
  g.lineJoin = 'round';

  for (const f of faces) {
    g.fillStyle = f.col;
    g.beginPath();
    g.moveTo(f.a0.x, f.a0.y);
    g.lineTo(f.b0.x, f.b0.y);
    g.lineTo(f.b1.x, f.b1.y);
    g.lineTo(f.a1.x, f.a1.y);
    g.closePath();
    g.fill();
    g.stroke();
  }

  // Face supérieure (Toit 3D)
  g.fillStyle = topColor || shade(baseColor, 0.12);
  g.lineWidth = 3;
  g.beginPath();
  for (let i = 0; i < n; i++) {
    if (i === 0) g.moveTo(p1[i].x, p1[i].y);
    else g.lineTo(p1[i].x, p1[i].y);
  }
  g.closePath();
  g.fill();
  g.stroke();

  return o1;
}

// Dessine une Pyramide / Cristal 3D pointu avec facettes triangulaires ombrées
function drawPyramid3D(g, wx, wy, pts, zBase, zApex, baseColor, isIcon = false) {
  const o0 = project3DOffset(wx, wy, zBase, isIcon);
  const oTop = project3DOffset(wx, wy, zApex, isIcon);
  const p0 = pts.map((p) => ({ x: p.x + o0.ox, y: p.y + o0.oy }));
  const apex = { x: oTop.ox, y: oTop.oy };

  const n = pts.length;
  const faces = [];
  for (let i = 0; i < n; i++) {
    const j = (i + 1) % n;
    const a = p0[i], b = p0[j];
    const edgeDx = pts[j].x - pts[i].x, edgeDy = pts[j].y - pts[i].y;
    const len = Math.hypot(edgeDx, edgeDy) || 1;
    const nx = edgeDy / len, ny = -edgeDx / len;
    const light = clamp(nx * -0.45 + ny * -0.25, -0.38, 0.38);
    const depthY = (a.y + b.y + apex.y) / 3;
    faces.push({ a, b, col: shade(baseColor, light), depthY });
  }
  faces.sort((f1, f2) => f1.depthY - f2.depthY);

  g.strokeStyle = '#16181d';
  g.lineWidth = 2.4;
  g.lineJoin = 'round';
  for (const f of faces) {
    g.fillStyle = f.col;
    g.beginPath();
    g.moveTo(f.a.x, f.a.y);
    g.lineTo(f.b.x, f.b.y);
    g.lineTo(apex.x, apex.y);
    g.closePath();
    g.fill();
    g.stroke();
  }
}

/* ============================================================================
   RENDU 3D VOLUMÉTRIQUE DES BÂTIMENTS (MULTI-ÉTAGES & ÉCHAFAUDAGES 3D)
   ============================================================================ */
function drawBuilding(g, b, color, selected, now, isIcon = false) {
  const r = b.radius;
  const def = BUILDINGS[b.kind] || BUILDINGS.hq;
  const wx = b.x || 0, wy = b.y || 0;
  const waitingScv = !isIcon && b.constructing && !b.buildStarted && (b.buildProg || 0) <= 0.01;
  const prog = b.constructing && !isIcon ? clamp(b.buildProg || 0.08, 0.12, 1) : 1;
  const H3D = (def.height || 36) * prog;
  const darkCol = shade(color, -0.28);
  const lightCol = shade(color, 0.22);

  g.save();
  g.translate(wx, wy);

  if (selected) {
    g.strokeStyle = '#2fbf71';
    g.lineWidth = 3.5;
    g.beginPath(); g.arc(0, 0, r + 9, 0, TAU); g.stroke();
  }

  // Tant que le VCS n'est pas arrivé sur l'emplacement, on affiche le plan holographique au sol !
  if (waitingScv) {
    g.fillStyle = 'rgba(31, 199, 193, 0.16)';
    g.beginPath(); g.arc(0, 0, r, 0, TAU); g.fill();
    g.strokeStyle = '#ffc531';
    g.lineWidth = 2.8;
    g.setLineDash([7, 5]);
    g.beginPath(); g.arc(0, 0, r, 0, TAU); g.stroke();
    g.setLineDash([]);
    // Balise centrale "VCS en approche"
    const pulse = 5 + Math.sin(now * 0.01) * 2.5;
    g.fillStyle = '#ffc531';
    g.strokeStyle = '#16181d';
    g.lineWidth = 2;
    g.beginPath(); g.arc(0, 0, pulse, 0, TAU); g.fill(); g.stroke();
    g.restore();
    return;
  }

  // Ombre portée 3D au sol
  g.fillStyle = 'rgba(12, 16, 20, 0.42)';
  g.beginPath(); g.ellipse(9, 11, r * 1.08, r * 0.95, 0, 0, TAU); g.fill();

  if (b.kind === 'hq') {
    // 4 Tourelles de bastion d'angle en 3D
    const cOff = r * 0.68;
    for (const [sx, sy] of [[-1, -1], [1, -1], [1, 1], [-1, 1]]) {
      g.save();
      g.translate(sx * cOff, sy * cOff);
      drawPrism3D(g, wx + sx * cOff, wy + sy * cOff, makeNGon(r * 0.34, 6), 0, H3D * 0.62, '#3d414b', '#565b68', isIcon, 0.9);
      g.restore();
    }
    // Étage 1 : Forteresse blindée octogonale biseautée
    drawPrism3D(g, wx, wy, makeRectPoly(r * 0.88, r * 0.88, 12), 0, H3D * 0.56, darkCol, color, isIcon, 0.92);
    // Étage 2 : Pont de commandement en acier crème
    const top2 = drawPrism3D(g, wx, wy, makeRectPoly(r * 0.62, r * 0.62, 7), H3D * 0.56, H3D * 0.86, '#cfc4ad', '#fff8ea', isIcon, 0.92);
    // Étage 3 : Tourelle réacteur & double canon rotatif
    const top3 = drawPrism3D(g, wx, wy, makeNGon(r * 0.34, 8), H3D * 0.86, H3D * 1.04, '#2a2d35', '#484c58', isIcon, 0.9);

    g.save();
    g.translate(top3.ox, top3.oy);
    g.save();
    g.rotate(b.aimA || 0);
    g.fillStyle = '#383b44'; g.strokeStyle = '#16181d'; g.lineWidth = 2.4;
    g.fillRect(4, -8, r * 0.56, 5); g.strokeRect(4, -8, r * 0.56, 5);
    g.fillRect(4, 3, r * 0.56, 5);  g.strokeRect(4, 3, r * 0.56, 5);
    g.restore();
    g.fillStyle = '#ffc531'; g.strokeStyle = '#16181d'; g.lineWidth = 2.5;
    g.beginPath(); g.arc(0, 0, 9.5, 0, TAU); g.fill(); g.stroke();
    g.restore();

    // Antenne radar Comsat rotative sur le toit 2
    g.save();
    g.translate(top2.ox - r * 0.38, top2.oy - r * 0.38);
    g.rotate(now * 0.0038);
    g.strokeStyle = '#16181d'; g.lineWidth = 3;
    g.beginPath(); g.moveTo(-9, 0); g.lineTo(9, 0); g.stroke();
    g.fillStyle = '#1fc7c1';
    g.beginPath(); g.arc(0, 0, 4, 0, TAU); g.fill(); g.stroke();
    g.restore();

  } else if (b.kind === 'extractor') {
    // Raffinerie 3D avec cuves de Gaz Vespène
    drawPrism3D(g, wx, wy, makeNGon(r, 8), 0, H3D * 0.65, '#3b4a40', '#d5f2df', isIcon, 0.9);
    const top = drawPrism3D(g, wx, wy, makeNGon(r * 0.62, 8), H3D * 0.65, H3D, '#1f8a4f', '#2fbf71', isIcon, 0.88);
    g.save();
    g.translate(top.ox, top.oy);
    g.rotate(now * 0.005);
    g.fillStyle = '#ffc531'; g.strokeStyle = '#16181d'; g.lineWidth = 2;
    for (let k = 0; k < 3; k++) {
      g.rotate(TAU / 3);
      g.fillRect(-3, -r * 0.48, 6, r * 0.38);
      g.strokeRect(-3, -r * 0.48, 6, r * 0.38);
    }
    g.restore();

  } else if (b.kind === 'pylon') {
    // Socle 3D hexagonal + Cristal Pyramidal 3D en lévitation rotative !
    drawPrism3D(g, wx, wy, makeNGon(r * 0.92, 6, 0), 0, H3D * 0.42, darkCol, color, isIcon, 0.86);
    const rot = now * 0.0025;
    const crysPts = makeNGon(r * 0.56, 4, rot);
    const bobZ = Math.sin(now * 0.006) * 4;
    drawPrism3D(g, wx, wy, crysPts, H3D * 0.5 + bobZ, H3D * 0.78 + bobZ, '#129691', '#1fc7c1', isIcon, 1.0);
    drawPyramid3D(g, wx, wy, crysPts, H3D * 0.78 + bobZ, H3D * 1.15 + bobZ, '#64f5ef', isIcon);

  } else if (b.kind === 'barracks') {
    // Bunker Caserne 3D à 2 niveaux + rampe blindée 3D
    drawPrism3D(g, wx, wy, makeRectPoly(r * 0.95, r * 0.78, 8), 0, H3D * 0.68, '#665e52', '#f3e9d2', isIcon, 0.94);
    const top2 = drawPrism3D(g, wx, wy, makeRectPoly(r * 0.68, r * 0.48, 5), H3D * 0.68, H3D, darkCol, color, isIcon, 0.92);
    g.save();
    g.translate(top2.ox, top2.oy);
    g.fillStyle = '#ffc531'; g.strokeStyle = '#16181d'; g.lineWidth = 2.2;
    g.beginPath(); g.arc(0, 0, 6.5, 0, TAU); g.fill(); g.stroke();
    g.restore();

  } else if (b.kind === 'factory') {
    // Usine lourde 3D avec 2 cheminées cylindriques 3D hautes
    drawPrism3D(g, wx, wy, makeRectPoly(r * 0.96, r * 0.84, 9), 0, H3D * 0.65, '#353942', '#525766', isIcon, 0.94);
    drawPrism3D(g, wx, wy, makeRectPoly(r * 0.72, r * 0.54, 6), H3D * 0.65, H3D * 0.9, darkCol, color, isIcon, 0.92);
    for (const sx of [-r * 0.54, r * 0.54]) {
      g.save();
      g.translate(sx, r * 0.35);
      drawPrism3D(g, wx + sx, wy + r * 0.35, makeNGon(8.5, 6), H3D * 0.4, H3D * 1.22, '#22252b', '#ff4b2b', isIcon, 0.85);
      g.restore();
    }

  } else if (b.kind === 'turret') {
    // Socle Bunker octogonal 3D + Tourelle rotative 3D
    drawPrism3D(g, wx, wy, makeNGon(r, 8), 0, H3D * 0.58, '#6d675c', '#f3e9d2', isIcon, 0.88);
    const top2 = drawPrism3D(g, wx, wy, makeNGon(r * 0.62, 8), H3D * 0.58, H3D, darkCol, color, isIcon, 0.88);
    g.save();
    g.translate(top2.ox, top2.oy);
    g.rotate(b.aimA || 0);
    const rec = b.cd > 0.2 ? -4 : 0;
    g.fillStyle = '#16181d'; g.strokeStyle = '#16181d'; g.lineWidth = 2.4;
    g.fillRect(4 + rec, -7, r * 0.85, 5);
    g.fillRect(4 + rec, 2, r * 0.85, 5);
    g.fillStyle = lightCol;
    g.beginPath(); g.arc(0, 0, r * 0.28, 0, TAU); g.fill(); g.stroke();
    g.restore();

  } else if (b.kind === 'tesla') {
    // Bobine Tesla 3D : socle + pylône pyramidal + 2 anneaux 3D + sphère de plasma au sommet
    drawPrism3D(g, wx, wy, makeNGon(r, 8), 0, H3D * 0.38, '#2b303c', '#484e5e', isIcon, 0.88);
    drawPrism3D(g, wx, wy, makeNGon(r * 0.48, 6), H3D * 0.38, H3D * 0.92, '#1c6b68', '#1fc7c1', isIcon, 0.55);
    const topOrb = project3DOffset(wx, wy, H3D * 1.05, isIcon);
    g.save();
    g.translate(topOrb.ox, topOrb.oy);
    const pR = r * 0.42 + Math.sin(now * 0.012) * 2.5;
    g.fillStyle = '#1fc7c1'; g.strokeStyle = '#16181d'; g.lineWidth = 3;
    g.beginPath(); g.arc(0, 0, pR, 0, TAU); g.fill(); g.stroke();
    g.fillStyle = '#fff8ea';
    g.beginPath(); g.arc(-3, -3, pR * 0.4, 0, TAU); g.fill();
    g.restore();

  } else if (b.kind === 'wall') {
    drawPrism3D(g, wx, wy, makeRectPoly(r * 0.9, r * 0.9, 5), 0, H3D, '#756e61', '#d6c8aa', isIcon, 0.9);
    const topW = project3DOffset(wx, wy, H3D, isIcon);
    g.save();
    g.translate(topW.ox, topW.oy);
    g.fillStyle = color; g.strokeStyle = '#16181d'; g.lineWidth = 2;
    g.fillRect(-r * 0.55, -4, r * 1.1, 8);
    g.strokeRect(-r * 0.55, -4, r * 1.1, 8);
    g.restore();
  }

  // Cage d'échafaudage holographique 3D pendant la construction
  if (!isIcon && b.constructing) {
    const fullH = def.height || 36;
    const oTop = project3DOffset(wx, wy, fullH, false);
    g.strokeStyle = '#ffc531';
    g.lineWidth = 2;
    g.setLineDash([5, 5]);
    g.strokeRect(oTop.ox - r * 0.85, oTop.oy - r * 0.85, r * 1.7, r * 1.7);
    g.setLineDash([]);
    const bw = r * 1.9;
    g.fillStyle = '#16181d';
    g.fillRect(oTop.ox - bw / 2 - 1, oTop.oy - r - 20, bw + 2, 7);
    g.fillStyle = '#ffc531';
    g.fillRect(oTop.ox - bw / 2, oTop.oy - r - 19, bw * clamp(b.buildProg || 0, 0, 1), 5);
  }

  // Anneau de progression de la file d'attente de production
  const roofOff = project3DOffset(wx, wy, H3D, isIcon);
  if (!isIcon && !b.constructing && Array.isArray(b.queue) && b.queue.length > 0 && b.qTotal > 0) {
    const qProg = clamp(1 - b.qTimer / b.qTotal, 0, 1);
    g.strokeStyle = '#ffc531';
    g.lineWidth = 4;
    g.beginPath();
    g.arc(roofOff.ox, roofOff.oy, r + 5, -Math.PI / 2, -Math.PI / 2 + qProg * TAU);
    g.stroke();
  }

  // Barre de PV flottant au-dessus du toit 3D
  if (!isIcon && (b.hp < b.maxHp || b.kind === 'hq' || selected)) {
    const bw = r * 1.9, bh = 6;
    const pct = clamp(b.hp / b.maxHp, 0, 1);
    g.fillStyle = '#16181d';
    g.beginPath(); g.roundRect(roofOff.ox - bw / 2 - 1.5, roofOff.oy - r - 14, bw + 3, bh + 3, 3); g.fill();
    g.fillStyle = pct > 0.45 ? '#2fbf71' : '#ff4b2b';
    g.fillRect(roofOff.ox - bw / 2, roofOff.oy - r - 12.5, bw * pct, bh);
  }
  g.restore();
}

/* ============================================================================
   RENDU 3D VOLUMÉTRIQUE DES UNITÉS, ARBRES, ROCHERS & CRISTAUX
   ============================================================================ */
function drawTree3D(g, tr) {
  g.save();
  g.translate(tr.x, tr.y);
  // Ombre au sol
  g.fillStyle = 'rgba(12, 16, 20, 0.34)';
  g.beginPath(); g.ellipse(8, 10, tr.r * 1.05, tr.r * 0.9, 0, 0, TAU); g.fill();

  // Tronc 3D
  const oTrunk = project3DOffset(tr.x, tr.y, tr.h * 0.32, false);
  g.strokeStyle = '#16181d'; g.lineWidth = 9; g.lineCap = 'round';
  g.beginPath(); g.moveTo(0, 0); g.lineTo(oTrunk.ox, oTrunk.oy); g.stroke();
  g.strokeStyle = '#5c4028'; g.lineWidth = 5;
  g.beginPath(); g.moveTo(0, 0); g.lineTo(oTrunk.ox, oTrunk.oy); g.stroke();

  // 3 Étages de feuillage 3D superposés en élévation Z !
  const tiers = [
    { z: tr.h * 0.38, r: tr.r * 1.0, col: shade(tr.col, -0.16) },
    { z: tr.h * 0.68, r: tr.r * 0.82, col: tr.col },
    { z: tr.h * 0.98, r: tr.r * 0.56, col: shade(tr.col, 0.2) },
  ];
  g.strokeStyle = '#16181d';
  g.lineWidth = 2.8;
  for (const t of tiers) {
    const o = project3DOffset(tr.x, tr.y, t.z, false);
    g.fillStyle = t.col;
    g.beginPath(); g.arc(o.ox, o.oy, t.r, 0, TAU); g.fill(); g.stroke();
  }
  g.restore();
}

function drawUnit(g, u, color, selected, now, isIcon = false) {
  const r = u.radius;
  const wx = u.x || 0, wy = u.y || 0;
  const darkCol = shade(color, -0.35);
  const lightCol = shade(color, 0.25);

  g.save();
  g.translate(wx, wy);

  // Si c'est un VCS posé SUR un chantier en cours de construction, on l'élève sur la dalle 3D du chantier !
  let siteZ = 0;
  if (!isIcon && u.kind === 'scv' && u.onSite && u.buildTargetId && state) {
    const tb = state.buildings.find((b) => b.id === u.buildTargetId && b.constructing);
    if (tb) {
      const defB = BUILDINGS[tb.kind] || BUILDINGS.hq;
      siteZ = (defB.height || 36) * clamp(tb.buildProg || 0.12, 0.12, 1) * 0.72;
    }
  }
  const siteOff = siteZ > 0 ? project3DOffset(wx, wy, siteZ, false) : { ox: 0, oy: 0 };
  g.translate(siteOff.ox, siteOff.oy);

  if (!isIcon && u.stimT > 0) {
    g.strokeStyle = '#ff4b2b';
    g.lineWidth = 2.5;
    g.beginPath(); g.arc(0, 0, r + 4 + Math.sin(now * 0.03) * 2, 0, TAU); g.stroke();
  }

  if (selected) {
    g.strokeStyle = '#2fbf71';
    g.lineWidth = 2.8;
    g.beginPath(); g.arc(0, 0, r + 6, 0, TAU); g.stroke();
  }

  g.fillStyle = 'rgba(12, 16, 20, 0.38)';
  g.beginPath(); g.ellipse(4.5, 5.5, r * 1.08, r * 0.92, 0, 0, TAU); g.fill();

  // Décalage 3D du châssis et de la tourelle/tête selon l'élévation Z
  const bodyOff = project3DOffset(wx, wy, u.kind === 'titan' ? 22 : u.kind === 'tank' || u.kind === 'siege' ? 12 : 9, isIcon);
  const topOff = project3DOffset(wx, wy, u.kind === 'titan' ? 38 : u.kind === 'tank' || u.kind === 'siege' ? 22 : 16, isIcon);

  g.strokeStyle = '#16181d';
  g.lineWidth = 2.5;

  if (u.kind === 'scv') {
    // Base chenilles au sol
    g.save();
    g.rotate(u.a || 0);
    g.fillStyle = '#383b44';
    g.fillRect(-r * 0.9, -r * 0.85, r * 1.4, 5); g.strokeRect(-r * 0.9, -r * 0.85, r * 1.4, 5);
    g.fillRect(-r * 0.9, r * 0.85 - 5, r * 1.4, 5); g.strokeRect(-r * 0.9, r * 0.85 - 5, r * 1.4, 5);
    g.fillStyle = '#ffc531';
    g.fillRect(r * 0.3, -r * 0.68, 8, 4); g.strokeRect(r * 0.3, -r * 0.68, 8, 4);
    g.fillRect(r * 0.3, r * 0.68 - 4, 8, 4); g.strokeRect(r * 0.3, r * 0.68 - 4, 8, 4);
    if (!isIcon && u.carryAmt > 0) {
      g.fillStyle = u.carryType === 'gas' ? '#2fbf71' : u.carryType === 'gold' ? '#ffc531' : '#1fc7c1';
      g.beginPath(); g.arc(r + 3, 0, 5.5, 0, TAU); g.fill(); g.stroke();
    }
    // Arc de soudure plasma actif quand le VCS construit sur le chantier
    if (!isIcon && u.onSite && u.mode === 'build') {
      const fR = 4.5 + Math.sin(now * 0.045) * 2.5;
      g.strokeStyle = '#1fc7c1';
      g.lineWidth = 3;
      g.beginPath(); g.moveTo(r * 0.7, -3); g.lineTo(r + 12, 0); g.lineTo(r * 0.7, 3); g.stroke();
      g.fillStyle = '#fff8ea';
      g.beginPath(); g.arc(r + 12, 0, fR, 0, TAU); g.fill();
    }
    g.restore();
    // Cabine 3D surélevée
    g.save();
    g.translate(bodyOff.ox, bodyOff.oy);
    g.rotate(u.a || 0);
    g.fillStyle = color;
    g.beginPath(); g.roundRect(-r * 0.78, -r * 0.68, r * 1.45, r * 1.36, 4); g.fill(); g.stroke();
    g.fillStyle = '#a9d8ff';
    g.beginPath(); g.roundRect(0, -r * 0.42, r * 0.48, r * 0.84, 2); g.fill(); g.stroke();
    g.restore();

  } else if (u.kind === 'tank' || u.kind === 'siege') {
    const L = r * 1.25, Wd = r * 0.95;
    // Niveau 0 : Chenilles et vérins de siège au sol
    g.save();
    g.rotate(u.a || 0);
    if (u.sieged) {
      g.fillStyle = '#ffc531';
      for (const [sx, sy] of [[-L * 0.85, -Wd * 1.15], [L * 0.85, -Wd * 1.15], [-L * 0.85, Wd * 1.15], [L * 0.85, Wd * 1.15]]) {
        g.beginPath(); g.arc(sx, sy, 5.5, 0, TAU); g.fill(); g.stroke();
      }
    }
    g.fillStyle = '#26282e';
    for (const sy of [-Wd, Wd - 6]) {
      g.beginPath(); g.roundRect(-L, sy, L * 2, 6, 2); g.fill(); g.stroke();
    }
    g.fillStyle = darkCol;
    g.beginPath(); g.roundRect(-L * 0.9, -Wd * 0.78, L * 1.8, Wd * 1.56, 5); g.fill(); g.stroke();
    g.restore();

    // Niveau 1 (Z=12) : Châssis blindé 3D
    g.save();
    g.translate(bodyOff.ox, bodyOff.oy);
    g.rotate(u.a || 0);
    g.fillStyle = color;
    g.beginPath(); g.roundRect(-L * 0.78, -Wd * 0.68, L * 1.56, Wd * 1.36, 4); g.fill(); g.stroke();
    g.restore();

    // Niveau 2 (Z=22) : Tourelle 3D et canon
    g.save();
    g.translate(topOff.ox, topOff.oy);
    g.rotate(u.a || 0);
    g.fillStyle = '#16181d';
    if (u.kind === 'siege') {
      const ext = u.sieged ? 21 : 14;
      g.fillRect(0, -5, r + ext, 10);
      g.fillStyle = '#1fc7c1';
      g.fillRect(4, -2, r + ext - 5, 4);
    } else {
      g.fillRect(2, -3.5, r + 11, 7);
    }
    g.fillStyle = '#fff8ea';
    g.beginPath(); g.arc(-2, 0, r * 0.5, 0, TAU); g.fill(); g.stroke();
    g.fillStyle = color;
    g.beginPath(); g.arc(-2, 0, r * 0.25, 0, TAU); g.fill();
    g.restore();

  } else if (u.kind === 'titan') {
    const walk = isIcon ? 0 : Math.sin(now * 0.012 + (u.id || 0)) * 3;
    // Niveau 0 : Pieds mécaniques au sol
    g.save();
    g.rotate(u.a || 0);
    g.fillStyle = '#383b44';
    g.beginPath(); g.roundRect(-8 + walk, -r * 0.85, 14, 8, 3); g.fill(); g.stroke();
    g.beginPath(); g.roundRect(-8 - walk, r * 0.85 - 8, 14, 8, 3); g.fill(); g.stroke();
    g.restore();

    // Niveau 1 (Z=22) : Torse & Canons plasma aux bras
    g.save();
    g.translate(bodyOff.ox, bodyOff.oy);
    g.rotate(u.a || 0);
    g.fillStyle = '#16181d';
    g.fillRect(2, -r * 0.88, r * 0.98, 7);
    g.fillRect(2, r * 0.88 - 7, r * 0.98, 7);
    g.fillStyle = '#1fc7c1';
    g.fillRect(r * 0.65, -r * 0.82, 6, 4);
    g.fillRect(r * 0.65, r * 0.82 - 4, 6, 4);
    g.fillStyle = color;
    g.beginPath(); g.roundRect(-r * 0.78, -r * 0.78, r * 1.56, r * 1.56, 8); g.fill(); g.stroke();
    g.restore();

    // Niveau 2 (Z=38) : Épaulières lourdes & Tête réacteur 3D
    g.save();
    g.translate(topOff.ox, topOff.oy);
    g.rotate(u.a || 0);
    g.fillStyle = '#fff8ea';
    g.beginPath(); g.roundRect(-r * 0.48, -r * 0.72, r * 0.96, r * 1.44, 5); g.fill(); g.stroke();
    g.fillStyle = '#ffc531';
    g.beginPath(); g.arc(0, 0, r * 0.36, 0, TAU); g.fill(); g.stroke();
    g.restore();

  } else {
    // Infanterie 3D : corps à Z=9, casque et arme à Z=16
    g.save();
    g.translate(bodyOff.ox * 0.6, bodyOff.oy * 0.6);
    g.rotate(u.a || 0);
    g.fillStyle = u.kind === 'sapper' ? '#ffc531' : darkCol;
    g.beginPath(); g.roundRect(-r * 0.95, -r * 0.55, r * 0.7, r * 1.1, 3); g.fill(); g.stroke();
    g.fillStyle = darkCol;
    g.beginPath(); g.arc(0, 0, r * 0.9, 0, TAU); g.fill(); g.stroke();
    g.restore();

    g.save();
    g.translate(topOff.ox * 0.75, topOff.oy * 0.75);
    g.rotate(u.a || 0);
    if (u.kind === 'rocket') {
      g.fillStyle = '#383b44';
      g.fillRect(-4, 3, r + 9, 6); g.strokeRect(-4, 3, r + 9, 6);
      g.fillStyle = '#ff4b2b';
      g.fillRect(r + 3, 4, 4, 4);
    } else if (u.kind === 'sapper') {
      g.fillStyle = '#ff4b2b';
      g.beginPath(); g.arc(r * 0.75, 0, 5, 0, TAU); g.fill(); g.stroke();
    } else {
      g.fillStyle = '#16181d';
      g.fillRect(2, 2, r + 6, 4.5);
    }
    g.fillStyle = color;
    g.beginPath(); g.arc(0, 0, r * 0.82, 0, TAU); g.fill(); g.stroke();
    g.fillStyle = '#a9d8ff';
    g.beginPath(); g.roundRect(r * 0.12, -r * 0.45, r * 0.5, r * 0.9, 3); g.fill(); g.stroke();
    g.fillStyle = lightCol;
    g.beginPath(); g.arc(-r * 0.22, -r * 0.22, r * 0.25, 0, TAU); g.fill();
    g.restore();
  }

  if (!isIcon && (u.hp < u.maxHp || selected)) {
    const bw = r * 2.1, pct = clamp(u.hp / u.maxHp, 0, 1);
    g.fillStyle = '#16181d';
    g.fillRect(topOff.ox - bw / 2 - 1, topOff.oy - r - 10, bw + 2, 5);
    g.fillStyle = pct > 0.45 ? '#2fbf71' : '#ff4b2b';
    g.fillRect(topOff.ox - bw / 2, topOff.oy - r - 9, bw * pct, 3);
  }
  g.restore();
}

function drawThumbIcon(canvasEl, kind, playerColor) {
  if (!canvasEl) return;
  const g = canvasEl.getContext('2d');
  const w = canvasEl.width, h = canvasEl.height;
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.clearRect(0, 0, w, h);
  g.save();
  if (BUILDINGS[kind]) {
    const def = BUILDINGS[kind];
    const r = def.radius;
    const zMax = (def.height || 36) * 1.1;
    const spanY = 2.05 * r + zMax * 0.48;
    const spanX = 2.25 * r + zMax * 0.14;
    const sc = Math.min((w * 0.76) / spanX, (h * 0.76) / spanY);
    const midY = -zMax * 0.24;
    g.translate(w / 2 + zMax * 0.06 * sc, h / 2 - midY * sc);
    g.scale(sc, sc);
    drawBuilding(g, { kind, x: 0, y: 0, radius: r, hp: def.hp, maxHp: def.hp, aimA: -0.4 }, playerColor, false, 0, true);
  } else if (UNITS[kind]) {
    const def = UNITS[kind];
    const r = def.radius;
    const zMax = kind === 'titan' ? 40 : (kind === 'tank' || kind === 'siege') ? 24 : 18;
    const spanY = 2.2 * r + zMax * 0.48;
    const spanX = 2.5 * r + zMax * 0.14;
    const sc = Math.min((w * 0.74) / spanX, (h * 0.74) / spanY);
    const midY = -zMax * 0.24;
    g.translate(w / 2 + zMax * 0.06 * sc, h / 2 - midY * sc);
    g.scale(sc, sc);
    drawUnit(g, { kind, x: 0, y: 0, radius: r, a: -0.35, hp: def.hp, maxHp: def.hp }, playerColor, false, 0, true);
  }
  g.restore();
}

function screenToWorld(sx, sy) {
  return {
    x: cam.x + (sx - W / 2) / cam.z,
    y: cam.y + (sy - H / 2) / cam.z,
  };
}

function centerOnMyHq() {
  if (!state) return;
  const hq = state.buildings.find((b) => b.owner === myId && b.kind === 'hq');
  if (hq) { cam.x = hq.x; cam.y = hq.y; }
}

let toastTimer = 0;
function toast(msg, ms = 2400) {
  const el = $('#uiToast');
  el.textContent = msg;
  el.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.hidden = true; }, ms);
}

function handleFxEvents(list) {
  if (!Array.isArray(list)) return;
  for (const e of list) {
    if (e.k === 'SHOT' || e.k === 'ROCKET' || e.k === 'PLASMA') {
      const isPlasma = e.k === 'PLASMA', isRocket = e.k === 'ROCKET';
      projectiles.push({
        x: e.x1, y: e.y1, tx: e.x2, ty: e.y2,
        prog: 0, speed: isPlasma ? 4.8 : isRocket ? 5.5 : 9.0,
        color: isPlasma ? '#1fc7c1' : isRocket ? '#ff4b2b' : (e.color || '#ffc531'),
        r: isPlasma ? 6 : isRocket ? 5 : 3.2,
      });
      if (hypot(e.x1, e.y1, cam.x, cam.y) < 700) {
        if (isPlasma) Sfx.plasma(); else Sfx.shoot();
      }
    } else if (e.k === 'TESLA') {
      beams.push({ x1: e.x1, y1: e.y1, x2: e.x2, y2: e.y2, color: '#1fc7c1', w: 4.5, life: 0.22, maxLife: 0.22, tesla: true });
      shockwaves.push({ x: e.x2, y: e.y2, r: 8, maxR: 48, color: '#1fc7c1', life: 0.22, maxLife: 0.22 });
      if (hypot(e.x2, e.y2, cam.x, cam.y) < 750) Sfx.plasma();
    } else if (e.k === 'MINE' || e.k === 'SPARK') {
      const a = Math.random() * TAU;
      particles.push({
        x: e.x, y: e.y, vx: Math.cos(a) * 35, vy: Math.sin(a) * 35,
        r: 2.8, color: e.color || '#1fc7c1', life: 0.18,
      });
    } else if (e.k === 'STIM') {
      shockwaves.push({ x: e.x, y: e.y, r: 4, maxR: 26, color: '#ff4b2b', life: 0.22, maxLife: 0.22 });
    } else if (e.k === 'SIEGE') {
      shockwaves.push({ x: e.x, y: e.y, r: 6, maxR: 32, color: '#ffc531', life: 0.25, maxLife: 0.25 });
      if (hypot(e.x, e.y, cam.x, cam.y) < 800) Sfx.siege();
    } else if (e.k === 'SCAN') {
      shockwaves.push({ x: e.x, y: e.y, r: 20, maxR: 380, color: '#1fc7c1', life: 0.55, maxLife: 0.55 });
      Sfx.scan();
    } else if (e.k === 'BOOM' || e.k === 'BOOM_BIG') {
      const big = e.k === 'BOOM_BIG';
      const cnt = big ? 24 : 10;
      shockwaves.push({ x: e.x, y: e.y, r: 10, maxR: big ? 95 : 42, color: big ? '#ffc531' : '#ff4b2b', life: big ? 0.38 : 0.22, maxLife: big ? 0.38 : 0.22 });
      if (big) {
        craters.push({ x: e.x, y: e.y, r: e.r * 0.78 });
        if (craters.length > 45) craters.shift();
        if (hypot(e.x, e.y, cam.x, cam.y) < 900) { cam.shake = Math.max(cam.shake, 10); Sfx.boom(); }
      }
      for (let k = 0; k < cnt; k++) {
        const a = Math.random() * TAU, sp = (big ? 55 : 28) + Math.random() * (big ? 165 : 80);
        particles.push({
          x: e.x, y: e.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
          r: (big ? 6 : 3.5) + Math.random() * 4,
          color: k % 3 === 0 ? '#fff8ea' : k % 2 === 0 ? '#ff4b2b' : '#ffc531',
          life: (big ? 0.45 : 0.26) + Math.random() * 0.15,
        });
      }
    } else if (e.k === 'BUILD' || e.k === 'SPAWN' || e.k === 'COMPLETE') {
      shockwaves.push({ x: e.x, y: e.y, r: 10, maxR: 52, color: e.color || '#ffc531', life: 0.28, maxLife: 0.28 });
    } else if (e.k === 'ELIM') {
      toast(`💥 Le Centre de Commandement de ${e.name} a été détruit !`, 3500);
    } else if (e.k === 'PHASE') {
      const labels = {
        2: '💎 Phase 2 : Intensification des combats',
        3: '🤖 Phase 3 : Guerre Totale (Dégâts +20 %)',
        4: '🔥 MORT SUBITE : Tempête Magnétique & Dégâts ×1.85 !',
      };
      if (labels[e.phase]) toast(labels[e.phase], 3800);
    }
  }
}

function sendCommand(cmd) {
  if (!state || state.over) return;
  if (role === 'guest') {
    HubBridge.send('host', { t: 'cmd', cmd });
    return;
  }
  const fx = [];
  const res = executeCommand(state, myId, cmd, fx);
  if (!res.ok && res.reason) {
    toast(res.reason, 2000);
    Sfx.error();
  } else if (res.ok) {
    if (cmd.op === 'BUILD') Sfx.build();
    else if (cmd.op === 'TRAIN') Sfx.spawn();
    else if (cmd.op === 'STIM') Sfx.stim();
    else if (cmd.op === 'UNIT_ORDER') {
      if (cmd.mode === 'amove' || cmd.mode === 'focus') Sfx.attack();
      else Sfx.order();
    }
    handleFxEvents(fx);
  }
}

/* ============================================================================
   CONTRÔLES RTS STARCRAFT STRICTS (SÉLECTION OBLIGATOIRE POUR CONSTRUIRE/PRODUIRE)
   ============================================================================ */
function cleanSelection() {
  if (!state) return;
  const validU = new Set(state.units.filter((u) => u.owner === myId && u.hp > 0).map((u) => u.id));
  const validB = new Set(state.buildings.filter((b) => b.owner === myId && b.hp > 0).map((b) => b.id));
  for (const id of [...selectedUnits]) if (!validU.has(id)) selectedUnits.delete(id);
  for (const id of [...selectedBlds]) if (!validB.has(id)) selectedBlds.delete(id);

  // Si on était en train de poser un bâtiment mais qu'aucun VCS n'est sélectionné, on annule buildMode
  const hasScv = state.units.some((u) => selectedUnits.has(u.id) && u.kind === 'scv');
  if (buildMode && !hasScv) {
    buildMode = null;
    updateCursorClass();
  }
}

function selectIdleWorker() {
  if (!state) return;
  const idle = state.units.find((u) => u.owner === myId && u.kind === 'scv' && u.mode === 'idle')
    || state.units.find((u) => u.owner === myId && u.kind === 'scv');
  if (idle) {
    selectedUnits.clear(); selectedBlds.clear();
    selectedUnits.add(idle.id);
    cam.x = idle.x; cam.y = idle.y;
    Sfx.order();
    renderConsoleUI(true);
  }
}

function selectAllArmy() {
  if (!state) return;
  selectedUnits.clear(); selectedBlds.clear();
  buildMode = null; updateCursorClass();
  for (const u of state.units) {
    if (u.owner === myId && u.kind !== 'scv' && u.hp > 0) selectedUnits.add(u.id);
  }
  if (selectedUnits.size > 0) { Sfx.order(); renderConsoleUI(true); }
  else toast('Aucune unité de combat déployée.');
}

$('#btnIdleScv').onclick = selectIdleWorker;
$('#btnAllArmy').onclick = selectAllArmy;

window.addEventListener('keydown', (e) => {
  if (e.target && e.target.tagName === 'INPUT') return;
  const k = e.key.toLowerCase();
  keys[k] = true;

  if (e.key === 'F1') { e.preventDefault(); selectIdleWorker(); return; }
  if (e.key === 'F2') { e.preventDefault(); selectAllArmy(); return; }

  if (k === 'escape') {
    buildMode = null; orderCursor = null;
    updateCursorClass(); renderConsoleUI(true);
    return;
  }
  if (k === ' ') { e.preventDefault(); centerOnMyHq(); return; }

  cleanSelection();
  const selUList = state ? state.units.filter((u) => selectedUnits.has(u.id)) : [];
  const hasScvSelected = selUList.some((u) => u.kind === 'scv');

  // Si un Ouvrier VCS est sélectionné (sans Ctrl) : 1..8 choisit le bâtiment à construire !
  if (hasScvSelected && !e.ctrlKey && !e.metaKey && /^[1-8]$/.test(k)) {
    const bMap = { '1': 'pylon', '2': 'extractor', '3': 'barracks', '4': 'factory', '5': 'turret', '6': 'tesla', '7': 'wall', '8': 'hq' };
    orderCursor = null;
    buildMode = buildMode === bMap[k] ? null : bMap[k];
    updateCursorClass();
    renderConsoleUI(true);
    return;
  }

  // Groupes de contrôle 1..9 (Ctrl+Num pour assigner, Num pour sélectionner / double-tap centrer)
  if (/^[1-9]$/.test(k)) {
    const g = Number(k);
    if (e.ctrlKey || e.metaKey) {
      e.preventDefault();
      controlGroups[g] = { units: [...selectedUnits], blds: [...selectedBlds] };
      toast(`Groupe de contrôle #${g} assigné`);
      renderConsoleUI(true);
      return;
    }
    const grp = controlGroups[g];
    if (grp && ((grp.units && grp.units.length) || (grp.blds && grp.blds.length))) {
      selectedUnits = new Set(grp.units || []);
      selectedBlds = new Set(grp.blds || []);
      cleanSelection();
      const now = performance.now();
      if (lastGroupTap.g === g && now - lastGroupTap.t < 350) {
        const firstU = state.units.find((u) => selectedUnits.has(u.id));
        const firstB = state.buildings.find((b) => selectedBlds.has(b.id));
        const ent = firstU || firstB;
        if (ent) { cam.x = ent.x; cam.y = ent.y; }
      }
      lastGroupTap = { g, t: now };
      renderConsoleUI(true);
    }
    return;
  }

  // Raccourcis quand des UNITÉS sont sélectionnées : A = A-Move, S = Stop, H = Hold, R = Récolter (VCS), T = Stimpack, E = Siège
  if (selectedUnits.size > 0) {
    if (k === 'a') { buildMode = null; orderCursor = 'amove'; updateCursorClass(); renderConsoleUI(true); return; }
    if (k === 's') { sendCommand({ op: 'UNIT_ORDER', mode: 'stop', unitIds: [...selectedUnits] }); return; }
    if (k === 'h') { sendCommand({ op: 'UNIT_ORDER', mode: 'hold', unitIds: [...selectedUnits] }); return; }
    if (k === 'r' && hasScvSelected) { sendCommand({ op: 'UNIT_ORDER', mode: 'harvest_min', x: cam.x, y: cam.y, unitIds: [...selectedUnits] }); return; }
    if (k === 't') { sendCommand({ op: 'STIM', unitIds: [...selectedUnits] }); return; }
    if (k === 'e') { sendCommand({ op: 'SIEGE', unitIds: [...selectedUnits] }); return; }
  }

  // Raccourcis quand un BÂTIMENT est sélectionné : Q / W / E entraînent les troupes de ce bâtiment, X = Scan Radar (si QG)
  if (selectedBlds.size > 0) {
    const firstB = state?.buildings.find((b) => selectedBlds.has(b.id));
    if (firstB && !firstB.constructing) {
      if (firstB.kind === 'hq' && k === 'x') {
        buildMode = null; orderCursor = orderCursor === 'scan' ? null : 'scan';
        updateCursorClass(); renderConsoleUI(true);
        return;
      }
      const trains = BUILDINGS[firstB.kind]?.trains || [];
      const keyIdx = { q: 0, w: 1, e: 2 }[k];
      if (keyIdx !== undefined && trains[keyIdx]) {
        for (const bId of selectedBlds) {
          sendCommand({ op: 'TRAIN', unit: trains[keyIdx], bldId: bId });
        }
        return;
      }
    }
  }
});

function updateCursorClass() {
  cvs.classList.toggle('cur-attack', orderCursor === 'amove' || orderCursor === 'scan');
  cvs.classList.toggle('cur-build', !!buildMode);

cvs.addEventListener('wheel', (e) => {

  cam.z = clamp(cam.z * (e.deltaY < 0 ? 1.1 : 0.9), 0.44, 1.35);
}, { passive: false });

function findEntityAt(wx, wy) {
  if (!state) return null;
  for (const u of state.units) {
    if (u.hp > 0 && dist2(wx, wy, u.x, u.y) <= (u.radius + 10) ** 2) return { type: 'unit', ent: u };
  }
  for (const b of state.buildings) {
    if (b.hp > 0 && dist2(wx, wy, b.x, b.y) <= (b.radius + 8) ** 2) return { type: 'bld', ent: b };
  }
  for (const m of MINERAL_NODES) {
    if (dist2(wx, wy, m.x, m.y) <= 28 * 28) return { type: 'min', ent: m };
  }
  for (const g of GAS_GEYSERS) {
    if (dist2(wx, wy, g.x, g.y) <= 32 * 32) return { type: 'gas', ent: g };
  }
  return null;
}

function issueSmartRightClick(wx, wy) {
  if (!state) return;
  cleanSelection();
  const hit = findEntityAt(wx, wy);
  const me = state.players.find((p) => p.id === myId);

  // Si un bâtiment de production est sélectionné -> Clic droit définit son Point de Ralliement
  if (selectedUnits.size === 0 && selectedBlds.size > 0) {
    sendCommand({ op: 'UNIT_ORDER', mode: 'rally', x: wx, y: wy, bldIds: [...selectedBlds] });
    orderMarkers.push({ x: wx, y: wy, color: '#ffc531', life: 0.45, maxLife: 0.45 });
    return;
  }

  // Si aucune unité n'est sélectionnée, le clic droit ne fait rien (comme dans StarCraft !)
  const unitIds = [...selectedUnits];
  if (!unitIds.length) return;

  const hasScvs = unitIds.some((id) => state.units.find((u) => u.id === id)?.kind === 'scv');

  if (hit) {
    if ((hit.type === 'unit' || hit.type === 'bld') && me && hit.ent.team !== me.team) {
      sendCommand({ op: 'UNIT_ORDER', mode: 'focus', targetId: hit.ent.id, x: hit.ent.x, y: hit.ent.y, unitIds });
      orderMarkers.push({ x: hit.ent.x, y: hit.ent.y, color: '#ff4b2b', life: 0.45, maxLife: 0.45 });
      return;
    }
    if (hit.type === 'min' && hasScvs) {
      sendCommand({ op: 'UNIT_ORDER', mode: 'harvest_min', resId: hit.ent.id, x: hit.ent.x, y: hit.ent.y, unitIds });
      orderMarkers.push({ x: hit.ent.x, y: hit.ent.y, color: '#1fc7c1', life: 0.45, maxLife: 0.45 });
      return;
    }
    if (hit.type === 'bld' && hit.ent.owner === myId && hit.ent.kind === 'extractor' && !hit.ent.constructing && hasScvs) {
      sendCommand({ op: 'UNIT_ORDER', mode: 'harvest_gas', resId: hit.ent.id, x: hit.ent.x, y: hit.ent.y, unitIds });
      orderMarkers.push({ x: hit.ent.x, y: hit.ent.y, color: '#2fbf71', life: 0.45, maxLife: 0.45 });
      return;
    }
    if (hit.type === 'bld' && hit.ent.owner === myId && (hit.ent.constructing || hit.ent.hp < hit.ent.maxHp) && hasScvs) {
      sendCommand({ op: 'UNIT_ORDER', mode: 'build', targetId: hit.ent.id, x: hit.ent.x, y: hit.ent.y, unitIds });
      orderMarkers.push({ x: hit.ent.x, y: hit.ent.y, color: '#ffc531', life: 0.45, maxLife: 0.45 });
      return;
    }
  }

  sendCommand({ op: 'UNIT_ORDER', mode: 'move', x: wx, y: wy, unitIds });
  orderMarkers.push({ x: wx, y: wy, color: '#2fbf71', life: 0.42, maxLife: 0.42 });
}

cvs.addEventListener('pointerdown', (e) => {
  const rect = cvs.getBoundingClientRect();
  mouse.x = e.clientX - rect.left;
  mouse.y = e.clientY - rect.top;
  const w = screenToWorld(mouse.x, mouse.y);
  mouse.wx = w.x; mouse.wy = w.y;

  if (e.button === 1 || (e.button === 0 && e.altKey)) {
    mouse.panning = true;
    mouse.panStart = { x: e.clientX, y: e.clientY, cx: cam.x, cy: cam.y };
    return;
  }

  if (e.button === 2) {
    if (buildMode || orderCursor) {
      buildMode = null; orderCursor = null; updateCursorClass(); renderConsoleUI(true);
      return;
    }
    issueSmartRightClick(w.x, w.y);
    return;
  }

  if (e.button === 0) {
    if (orderCursor === 'scan') {
      sendCommand({ op: 'SCAN', x: w.x, y: w.y });
      orderCursor = null; updateCursorClass(); renderConsoleUI(true);
      return;
    }
    if (orderCursor === 'amove') {
      const unitIds = [...selectedUnits];
      if (unitIds.length) {
        sendCommand({ op: 'UNIT_ORDER', mode: 'amove', x: w.x, y: w.y, unitIds });
        orderMarkers.push({ x: w.x, y: w.y, color: '#ff4b2b', life: 0.45, maxLife: 0.45 });
      }
      orderCursor = null; updateCursorClass(); renderConsoleUI(true);
      return;
    }
    if (buildMode) {
      sendCommand({ op: 'BUILD', kind: buildMode, x: w.x, y: w.y, unitIds: [...selectedUnits] });
      if (buildMode !== 'wall' && !e.shiftKey) {
        buildMode = null;
        updateCursorClass();
        renderConsoleUI(true);
      }
      return;
    }
    mouse.down = true;
    mouse.dragStart = { sx: mouse.x, sy: mouse.y, wx: w.x, wy: w.y, shift: e.shiftKey, ctrl: e.ctrlKey };
  }
});

window.addEventListener('pointermove', (e) => {
  const rect = cvs.getBoundingClientRect();
  mouse.x = e.clientX - rect.left;
  mouse.y = e.clientY - rect.top;
  const w = screenToWorld(mouse.x, mouse.y);
  mouse.wx = w.x; mouse.wy = w.y;

  if (mouse.panning && mouse.panStart) {
    cam.x = clamp(mouse.panStart.cx - (e.clientX - mouse.panStart.x) / cam.z, 0, WORLD_SIZE);
    cam.y = clamp(mouse.panStart.cy - (e.clientY - mouse.panStart.y) / cam.z, 0, WORLD_SIZE);
  }
});

window.addEventListener('pointerup', () => {
  if (mouse.panning) { mouse.panning = false; mouse.panStart = null; return; }
  if (!mouse.down) return;
  mouse.down = false;
  if (!state || !mouse.dragStart) return;

  const dx = Math.abs(mouse.x - mouse.dragStart.sx);
  const dy = Math.abs(mouse.y - mouse.dragStart.sy);
  if (!mouse.dragStart.shift) {
    selectedUnits.clear();
    selectedBlds.clear();
  }

  if (dx > 12 || dy > 12) {
    const x1 = Math.min(mouse.dragStart.wx, mouse.wx), x2 = Math.max(mouse.dragStart.wx, mouse.wx);
    const y1 = Math.min(mouse.dragStart.wy, mouse.wy), y2 = Math.max(mouse.dragStart.wy, mouse.wy);
    const boxed = state.units.filter((u) => u.owner === myId && u.hp > 0 && u.x >= x1 && u.x <= x2 && u.y >= y1 && u.y <= y2);
    const combat = boxed.filter((u) => u.kind !== 'scv');
    const finalUnits = combat.length > 0 ? combat : boxed;
    for (const u of finalUnits) selectedUnits.add(u.id);
    if (selectedUnits.size === 0) {
      for (const b of state.buildings) {
        if (b.owner === myId && b.hp > 0 && b.x >= x1 && b.x <= x2 && b.y >= y1 && b.y <= y2) {
          selectedBlds.add(b.id);
        }
      }
    }
  } else {
    const hitU = state.units.find((u) => u.owner === myId && u.hp > 0 && dist2(u.x, u.y, mouse.wx, mouse.wy) <= (u.radius + 14) ** 2);
    if (hitU) {
      const now = performance.now();
      if (mouse.dragStart.ctrl || (lastClickUnit.id === hitU.id && now - lastClickUnit.t < 360)) {
        for (const u of state.units) {
          if (u.owner === myId && u.kind === hitU.kind && u.hp > 0 && hypot(u.x, u.y, cam.x, cam.y) < 900) {
            selectedUnits.add(u.id);
          }
        }
      } else {
        selectedUnits.add(hitU.id);
      }
      lastClickUnit = { id: hitU.id, kind: hitU.kind, t: now };
    } else {
      const hitB = state.buildings.find((b) => b.owner === myId && b.hp > 0 && dist2(b.x, b.y, mouse.wx, mouse.wy) <= (b.radius + 12) ** 2);
      if (hitB) {
        selectedBlds.add(hitB.id);
      }
    }
  }
  mouse.dragStart = null;
  cleanSelection();
  renderConsoleUI(true);
});
