<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Bastion Clash — RTS StarCraft Edition</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Chakra+Petch:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#16181d; --paper:#fff8ea; --cream:#f3e9d2; --muted:#6d675c; --line2:#d9cdb3;
  --red:#ff4b2b; --yellow:#ffc531; --green:#2fbf71; --blue:#2b8cff; --purple:#b45cff; --cyan:#1fc7c1;
}
*{box-sizing:border-box;user-select:none;-webkit-user-select:none}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;background:#142818;color:var(--ink);
  font-family:'Chakra Petch',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
canvas#world{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:default}
canvas#world.cur-attack{cursor:crosshair}
canvas#world.cur-build{cursor:cell}

/* HUD TOPBAR (RESSOURCES STARCRAFT : MINÉRAUX, GAZ PLASMA, RAVITAILLEMENT) */
.hud-top{position:fixed;top:10px;left:12px;right:12px;display:flex;align-items:center;gap:8px;pointer-events:none;z-index:25;flex-wrap:wrap}
.hud-top > *{pointer-events:auto}
.res-pill{background:var(--paper);border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);border-radius:12px;
  padding:5px 11px;display:flex;align-items:center;gap:8px;font-weight:700;font-size:13px}
.res-ico{width:24px;height:24px;border-radius:7px;border:2px solid var(--ink);display:inline-flex;align-items:center;justify-content:center;font-size:13px;box-shadow:2px 2px 0 var(--ink)}
.res-ico.min{background:var(--cyan);color:#fff}
.res-ico.gas{background:var(--green);color:#fff}
.res-ico.sup{background:var(--yellow);color:var(--ink)}
.res-val{font-family:Bungee,Impact,sans-serif;font-size:18px;color:var(--ink);min-width:44px}
.res-val.blocked{color:var(--red);animation:pulseSd .5s infinite alternate}
.res-sub{font-size:11px;color:var(--muted);background:var(--cream);border:1.5px solid var(--ink);border-radius:6px;padding:1px 5px;font-weight:700}

.phase-badge{background:var(--ink);color:var(--yellow);font-family:Bungee,Impact,sans-serif;font-size:12px;
  border:3px solid var(--paper);box-shadow:4px 4px 0 rgba(0,0,0,.55);border-radius:12px;padding:7px 12px;letter-spacing:.4px;display:flex;align-items:center;gap:7px}
.phase-badge.sd{background:var(--red);color:#fff;animation:pulseSd .7s infinite alternate}
@keyframes pulseSd{to{transform:scale(1.05)}}
.spacer{flex:1}

.roster-top{background:var(--paper);border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);border-radius:12px;padding:4px 9px;display:flex;gap:10px;align-items:center}
.p-chip{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:700}
.p-chip.dead{opacity:.38;text-decoration:line-through}
.p-chip .dot{width:11px;height:11px;border-radius:50%;border:2px solid var(--ink);display:inline-block}

.btn{font-family:Bungee,Impact,sans-serif;font-size:13px;letter-spacing:.4px;background:var(--red);color:#fff;
  border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);border-radius:10px;padding:7px 12px;cursor:pointer;
  transition:transform .06s,box-shadow .06s;white-space:nowrap}
.btn:hover{filter:brightness(1.06)}
.btn:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink)}
.btn:disabled{background:#c9c0ad;color:#7b7466;cursor:not-allowed;transform:none}
.btn.yellow{background:var(--yellow);color:var(--ink)}
.btn.green{background:var(--green);color:#fff}
.btn.ghost{background:var(--paper);color:var(--ink)}
.btn.small{font-size:11.5px;padding:5px 9px;box-shadow:3px 3px 0 var(--ink)}

/* BARRE D'ACCÈS RAPIDE (F1-F4 + GROUPES DE CONTRÔLE 1-5) */
.quick-bar{position:fixed;bottom:184px;left:50%;transform:translateX(-50%);z-index:22;display:flex;gap:6px;align-items:center;pointer-events:none;flex-wrap:wrap;justify-content:center}
.quick-bar > *{pointer-events:auto}
.qbtn{background:var(--ink);color:var(--paper);border:2.5px solid var(--paper);box-shadow:3px 3px 0 #000;border-radius:9px;
  padding:4px 9px;font:inherit;font-size:11.5px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:5px;transition:transform .06s}
.qbtn:hover{background:#282c36;transform:translateY(-2px)}
.qbtn kbd{background:var(--yellow);color:var(--ink);border-radius:4px;padding:0 4px;font-family:Bungee,sans-serif;font-size:10px}
.qbtn .cnt{background:var(--cyan);color:var(--ink);border-radius:5px;padding:0 5px;font-weight:700;font-size:11px}
.cg-bar{display:flex;gap:4px;margin-left:6px}
.cg-pill{background:var(--paper);color:var(--ink);border:2px solid var(--ink);box-shadow:2px 2px 0 var(--ink);border-radius:7px;
  padding:2px 7px;font-size:11px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:4px}
.cg-pill.active{background:var(--yellow)}
.cg-pill b{font-family:Bungee,sans-serif;font-size:11px}

/* CONSOLE RTS INFÉRIEURE STYLE STARCRAFT (MINIMAP | SÉLECTION & PRODUCTION | GRILLE DE COMMANDES) */
.rts-console{position:fixed;bottom:8px;left:10px;right:10px;height:168px;z-index:24;display:grid;
  grid-template-columns:196px minmax(280px,1fr) 392px;gap:10px;pointer-events:none;max-width:1280px;margin:0 auto}
.rts-console > *{pointer-events:auto}

.panel-box{background:var(--paper);border:3px solid var(--ink);box-shadow:6px 6px 0 var(--ink);border-radius:16px;padding:8px 10px;display:flex;flex-direction:column;overflow:hidden;position:relative}
.panel-hd{display:flex;justify-content:space-between;align-items:center;font-family:Bungee,Impact,sans-serif;font-size:10.5px;letter-spacing:.7px;color:var(--muted);margin-bottom:5px;border-bottom:2px dashed var(--line2);padding-bottom:3px}

/* 1. MINIMAP */
.minimap-wrap{display:flex;flex-direction:column;align-items:center;justify-content:space-between;height:100%}
canvas#minimap{width:170px;height:132px;display:block;border:2.5px solid var(--ink);border-radius:9px;background:#102014;cursor:crosshair}

/* 2. PANNEAU CENTRAL : PORTRAIT, STATS, FILE DE PRODUCTION OU GRILLE D'UNITÉS */
.sel-body{display:flex;gap:12px;align-items:center;flex:1;min-height:0}
.portrait-box{width:88px;height:88px;border:2.5px solid var(--ink);border-radius:12px;background:var(--cream);flex:none;
  display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;box-shadow:inset 0 0 12px rgba(0,0,0,.08)}
.portrait-box canvas{width:80px;height:68px;display:block}
.portrait-hp{width:76px;height:8px;background:#d9cdb3;border:1.5px solid var(--ink);border-radius:4px;overflow:hidden;margin-top:2px}
.portrait-hp i{display:block;height:100%;background:var(--green)}

.sel-info{flex:1;display:flex;flex-direction:column;justify-content:center;gap:4px;min-width:0}
.sel-title{font-family:Bungee,Impact,sans-serif;font-size:16px;line-height:1.1;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sel-sub{font-size:12px;font-weight:700;color:var(--muted)}
.sel-stats{display:flex;gap:8px;flex-wrap:wrap;margin-top:2px}
.st-chip{background:var(--cream);border:1.5px solid var(--ink);border-radius:6px;padding:2px 7px;font-size:11.5px;font-weight:700}

/* File d'attente de production (5 slots style StarCraft) */
.prod-queue{display:flex;flex-direction:column;gap:5px;min-width:195px}
.q-bar-wrap{width:100%;height:10px;background:#d9cdb3;border:2px solid var(--ink);border-radius:6px;overflow:hidden}
.q-bar-wrap i{display:block;height:100%;background:var(--yellow);transition:width .08s}
.q-slots{display:flex;gap:5px}
.q-slot{width:34px;height:34px;border:2px solid var(--ink);border-radius:7px;background:var(--cream);display:flex;align-items:center;justify-content:center;
  font-family:Bungee,sans-serif;font-size:10px;position:relative;cursor:pointer;overflow:hidden}
.q-slot.filled{background:#fff;box-shadow:2px 2px 0 var(--ink)}
.q-slot.filled:hover::after{content:'✕';position:absolute;inset:0;background:rgba(255,75,43,.85);color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px}
.q-slot .num{position:absolute;top:1px;left:3px;font-size:8.5px;color:var(--muted)}

/* Grille multi-unités sélectionnées */
.multi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:5px;width:100%;max-height:118px;overflow-y:auto;padding:2px}
.u-card{height:44px;border:2px solid var(--ink);border-radius:8px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:space-between;
  padding:2px 3px 3px;cursor:pointer;position:relative;box-shadow:1.5px 1.5px 0 var(--ink)}
.u-card:hover{background:var(--cream)}
.u-card.stim{border-color:var(--red);background:#fff0ed}
.u-card.siege{border-color:var(--purple);background:#f5ecff}
.u-card .u-nm{font-size:9px;font-weight:700;line-height:1;margin-top:2px}
.u-card .u-badge{font-family:Bungee,sans-serif;font-size:11px;color:var(--ink)}
.u-card .u-hp{width:100%;height:5px;background:#e2d6bc;border:1px solid var(--ink);border-radius:3px;overflow:hidden}
.u-card .u-hp i{display:block;height:100%;background:var(--green)}

/* 3. GRILLE DE COMMANDES 4x3 (COMMAND CARD STARCRAFT) */
.cmd-tabs{display:flex;gap:4px}
.tab-btn{border:1.5px solid var(--ink);border-radius:5px;background:var(--cream);font:inherit;font-size:10px;font-weight:700;padding:1px 6px;cursor:pointer}
.tab-btn.active{background:var(--yellow)}
.cmd-grid{display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(3,1fr);gap:5px;flex:1;min-height:0}
.cbtn{border:2px solid var(--ink);border-radius:9px;background:#fff;padding:2px 3px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:space-between;position:relative;
  transition:transform .06s,background .06s;font:inherit;color:var(--ink);box-shadow:2px 2px 0 var(--ink);overflow:hidden}
.cbtn:hover:not(:disabled){transform:translateY(-2px);background:var(--cream)}
.cbtn.sel{background:var(--yellow);box-shadow:0 0 0 2px var(--ink),2px 3px 0 var(--ink)}
.cbtn:disabled{opacity:.42;cursor:not-allowed;background:#e9e1cf;box-shadow:none}
.cbtn .key{position:absolute;top:2px;left:3px;font-size:9px;font-weight:700;background:var(--ink);color:var(--paper);
  border-radius:3px;padding:0 3.5px;line-height:1.35;z-index:2}
.cbtn .cost-tag{position:absolute;top:2px;right:3px;font-family:Bungee,sans-serif;font-size:8.5px;color:#0e6b68;background:#d8f8f6;
  border:1px solid var(--ink);border-radius:3px;padding:0 3px;line-height:1.3;z-index:2}
.cbtn .cost-tag.gas{color:#186b3a;background:#dcf7e6}
.cbtn.cant .cost-tag{color:#c4231a;background:#ffe3dc}
.cbtn canvas.thumb{width:42px;height:26px;display:block;margin-top:8px}
.cbtn .ico-txt{font-size:15px;margin-top:8px;line-height:1}
.cbtn .lbl-b{font-weight:700;font-size:9.5px;line-height:1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%}

/* TOAST & MODAL */
.toast{position:fixed;top:62px;left:50%;transform:translateX(-50%);z-index:40;background:var(--ink);color:var(--yellow);
  font-family:Bungee,Impact,sans-serif;font-size:14px;border:3px solid var(--paper);border-radius:12px;padding:7px 15px;
  box-shadow:5px 5px 0 #000;pointer-events:none}
.modal-ov{position:fixed;inset:0;z-index:50;background:rgba(10,12,16,.72);display:flex;align-items:center;justify-content:center;padding:16px}
.modal-card{background:var(--paper);border:3px solid var(--ink);box-shadow:8px 8px 0 var(--ink);border-radius:18px;padding:24px;width:min(540px,100%);text-align:center}
.modal-card h1{font-family:Bungee,Impact,sans-serif;font-size:34px;margin:0 0 6px;line-height:1}
.modal-card p{color:var(--muted);font-weight:600;margin:6px 0 16px}
.rank-list{list-style:none;padding:0;margin:0 0 18px;display:grid;gap:8px;text-align:left}
.rank-list li{display:flex;align-items:center;gap:10px;background:#fff;border:2.5px solid var(--ink);border-radius:11px;padding:8px 12px;font-weight:700}
.rank-list li .rk{font-family:Bungee,Impact,sans-serif;font-size:18px;width:28px}
.rank-list li .dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--ink)}
.rank-list li .sc{margin-left:auto;font-family:Bungee,Impact,sans-serif;font-size:14px;color:var(--muted)}

@media(max-width:980px){
  .rts-console{grid-template-columns:150px 1fr 310px;height:154px}
  canvas#minimap{width:130px;height:110px}
}
</style>
</head>
<body>

<canvas id="world"></canvas>

<!-- HUD TOP : MINÉRAUX, GAZ PLASMA, RAVITAILLEMENT, PHASE & JOUEURS -->
<div class="hud-top">
  <div class="res-pill" title="Minéraux récoltés par tes Ouvriers VCS sur les gisements de cristal">
    <span class="res-ico min">💎</span>
    <span class="res-val" id="uiMin">200</span>
    <span class="res-sub" id="uiWorkers">6 VCS</span>
  </div>
  <div class="res-pill" title="Gaz Plasma récolté dans tes Raffineries (construit une Raffinerie sur un geyser vert)">
    <span class="res-ico gas">🧪</span>
    <span class="res-val" id="uiGas">50</span>
    <span class="res-sub" id="uiRefineries">0 Raff.</span>
  </div>
  <div class="res-pill" title="Ravitaillement (Population) : construis des Dépôts Relais pour augmenter la limite">
    <span class="res-ico sup">📦</span>
    <span class="res-val" id="uiSupply">6/15</span>
  </div>
  <div class="phase-badge" id="uiPhase">
    <span id="uiClock">00:00</span> · <span id="uiPhaseName">Ouverture RTS</span>
  </div>
  <div class="spacer"></div>
  <div class="roster-top" id="uiRoster"></div>
  <button class="btn small ghost" id="btnCenter" title="Recentrer sur ton QG (Espace)">🎯 QG</button>
  <button class="btn small ghost" id="btnMute" title="Son">🔊</button>
  <button class="btn small" id="btnExit">Quitter</button>
</div>

<!-- BARRE D'ACCÈS RAPIDE STYLE STARCRAFT II (F1, F2, F3, F4 + GROUPES DE CONTRÔLE 1-5) -->
<div class="quick-bar">
  <button class="qbtn" id="btnIdleScv" title="Sélectionner un Ouvrier VCS inactif (F1)">
    <kbd>F1</kbd> VCS inactif <span class="cnt" id="uiIdleCnt">0</span>
  </button>
  <button class="qbtn" id="btnAllArmy" title="Sélectionner toute l'armée de combat (F2)">
    <kbd>F2</kbd> Toute l'armée <span class="cnt" id="uiArmyCnt">0</span>
  </button>
  <button class="qbtn" id="btnAllRax" title="Sélectionner toutes tes Casernes pour produire vite (F3)">
    <kbd>F3</kbd> Casernes
  </button>
  <button class="qbtn" id="btnAllFac" title="Sélectionner toutes tes Usines blindées (F4)">
    <kbd>F4</kbd> Usines
  </button>
  <div class="cg-bar" id="uiCgBar" title="Groupes de contrôle (Ctrl+1..5 pour assigner, 1..5 pour rappeler)"></div>
</div>

<!-- CONSOLE RTS INFÉRIEURE (3 VOLETS : RADAR | SÉLECTION & PRODUCTION | ORDRES) -->
<div class="rts-console">
  <!-- 1. Minimap Radar -->
  <div class="panel-box">
    <div class="panel-hd"><span>Radar Tactique</span><span>Clic Droit = Ordre</span></div>
    <div class="minimap-wrap">
      <canvas id="minimap" width="170" height="132"></canvas>
    </div>
  </div>

  <!-- 2. Panneau de Sélection & File de Production -->
  <div class="panel-box">
    <div class="panel-hd">
      <span id="uiSelHeader">Sélection tactique</span>
      <span id="uiSelSubHint">Glisser = Sélectionner · Clic Droit = Action</span>
    </div>
    <div class="sel-body" id="uiSelBody"></div>
  </div>

  <!-- 3. Grille d'Ordres & Construction (Command Card 4x3) -->
  <div class="panel-box">
    <div class="panel-hd">
      <span id="uiCmdTitle">Ordres & Production</span>
      <div class="cmd-tabs">
        <button class="tab-btn active" id="tabAuto">Contexte</button>
        <button class="tab-btn" id="tabBuild">Construire (B)</button>
      </div>
    </div>
    <div class="cmd-grid" id="uiCmdGrid"></div>
  </div>
</div>

<div class="toast" id="uiToast" hidden></div>

<!-- ENDGAME MODAL -->
<div class="modal-ov" id="endModal" hidden>
  <div class="modal-card">
    <h1 id="endTitle">Victoire !</h1>
    <p id="endSub">Tous les Centres de Commandement adverses ont été détruits.</p>
    <ul class="rank-list" id="endRanks"></ul>
    <div style="display:flex;gap:10px;justify-content:center">
      <button class="btn yellow" id="btnReplay">Rejouer</button>
      <button class="btn ghost" id="btnEndExit">Retour au salon</button>
    </div>
  </div>
</div>

<script src="../shared/bridge.js"></script>
<script>
'use strict';

/* ============================================================================
   BASTION CLASH — ÉDITION RTS STARCRAFT (2.5D HAUTE DÉFINITION)
   - Récolte physique par Ouvriers VCS (Minéraux 💎 & Gaz Plasma 🧪)
   - Chantiers de construction progressifs & Réparation mécanique
   - Files de production par bâtiment (5 slots) + Points de Ralliement
   - Ravitaillement (Supply Cap) via Dépôts Relais
   - Micro-gestion StarCraft : Box-Select, A-Move (Attaque-Déplacement),
     Focus Fire, Stimpack (T), Mode Siège déployable (E), Scan Radar (X),
     Groupes de contrôle (1-5) & Brouillard de Guerre dynamique.
   ============================================================================ */

const $ = (s) => document.querySelector(s);
const $$ = (s) => [...document.querySelectorAll(s)];
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const dist2 = (x1, y1, x2, y2) => (x1 - x2) ** 2 + (y1 - y2) ** 2;
const hypot = (x1, y1, x2, y2) => Math.hypot(x1 - x2, y1 - y2);
const TAU = Math.PI * 2;

const WORLD_SIZE = 2400;
const HALF_W = WORLD_SIZE / 2;
const TICK_RATE = 20;
const TICK_DT = 1 / TICK_RATE;
const MAX_SUPPLY = 100;

function shade(hex, f) {
  let c = String(hex || '#888888').replace('#', '');
  if (c.length === 3) c = c[0] + c[0] + c[1] + c[1] + c[2] + c[2];
  const n = parseInt(c, 16) || 0;
  let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  if (f < 0) { const k = 1 + f; r = Math.round(r * k); g = Math.round(g * k); b = Math.round(b * k); }
  else { r = Math.round(r + (255 - r) * f); g = Math.round(g + (255 - g) * f); b = Math.round(b + (255 - b) * f); }
  return '#' + [r, g, b].map((v) => clamp(v, 0, 255).toString(16).padStart(2, '0')).join('');
}

function mulberry(a) {
  return function () {
    let t = (a += 0x6d2b79f5);
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* ============================================================================
   DONNÉES D'ÉQUILIBRAGE RTS (BÂTIMENTS & UNITÉS STARCRAFT)
   ============================================================================ */
const BUILDINGS = {
  hq: {
    name: 'Centre de Commandement', short: 'QG', min: 350, gas: 0, buildTime: 18,
    hp: 3200, radius: 48, height: 42, supply: 15, sight: 420, range: 255, dmg: 24, rate: 0.85,
    trains: ['scv'], desc: 'Base principale : stocke les ressources récoltées, produit des VCS et lance des Scans Radar.',
  },
  pylon: {
    name: 'Dépôt Relais', short: 'Dépôt', min: 75, gas: 0, buildTime: 7,
    hp: 520, radius: 22, height: 34, supply: 10, sight: 280, range: 175, dmg: 0, rate: 0, heal: 8,
    trains: [], desc: '+10 Ravitaillement 📦 et régénère les unités alliées proches.',
  },
  extractor: {
    name: 'Raffinerie de Gaz', short: 'Raffinerie', min: 75, gas: 0, buildTime: 8,
    hp: 680, radius: 28, height: 26, supply: 0, sight: 240, range: 0, dmg: 0, rate: 0,
    trains: [], onGeyser: true, desc: 'Se construit sur un Geyser de Gaz Plasma 🧪 pour permettre aux VCS de le récolter.',
  },
  barracks: {
    name: 'Caserne Militaire', short: 'Caserne', min: 125, gas: 0, buildTime: 10,
    hp: 1000, radius: 36, height: 28, supply: 0, sight: 300, range: 0, dmg: 0, rate: 0,
    trains: ['marine', 'rocket', 'sapper'], desc: 'Entraîne l’infanterie : Marines, Maraudeurs et Faucheurs démolisseurs.',
  },
  factory: {
    name: 'Usine Blindée', short: 'Usine', min: 150, gas: 75, buildTime: 13,
    hp: 1350, radius: 41, height: 32, supply: 0, sight: 310, range: 0, dmg: 0, rate: 0,
    trains: ['tank', 'siege', 'titan'], req: 'barracks', desc: 'Produit les blindés : Chars Goliath, Chars de Siège et Mechas Thor.',
  },

// Génération des lignes de Minéraux (façon StarCraft) autour de chaque base, des expansions et du centre
const MINERAL_NODES = [];
const GAS_GEYSERS = [];

(function initMapResources() {
  let mId = 1, gId = 1;
  // 1. Ligne de 6 minéraux + 1 geyser dans chaque base principale
  SPAWN_CORNERS.forEach((sp, idx) => {
    const awayA = Math.atan2(sp.y - HALF_W, sp.x - HALF_W);
    for (let i = -2.5; i <= 2.5; i += 1) {
      const a = awayA + i * 0.25;
      MINERAL_NODES.push({
        id: 'm' + (mId++),
        x: Math.round(sp.x + Math.cos(a) * 142),
        y: Math.round(sp.y + Math.sin(a) * 142),
        rich: false,
      });
    }
    const ga = awayA + (idx % 2 === 0 ? 0.95 : -0.95);
    GAS_GEYSERS.push({
      id: 'g' + (gId++),
      x: Math.round(sp.x + Math.cos(ga) * 148),
      y: Math.round(sp.y + Math.sin(ga) * 148),
    });
  });

  // 2. Expansions naturelles (4 expansions latérales)
  const naturals = [
    { x: HALF_W, y: 260, a: -Math.PI / 2 },
    { x: HALF_W, y: WORLD_SIZE - 260, a: Math.PI / 2 },
    { x: 260, y: HALF_W, a: Math.PI },
    { x: WORLD_SIZE - 260, y: HALF_W, a: 0 },
  ];
  for (const nat of naturals) {
    for (let i = -1.5; i <= 1.5; i += 1) {
      const a = nat.a + i * 0.28;
      MINERAL_NODES.push({
        id: 'm' + (mId++),
        x: Math.round(nat.x + Math.cos(a) * 105),
        y: Math.round(nat.y + Math.sin(a) * 105),
        rich: false,
      });
    }
    GAS_GEYSERS.push({
      id: 'g' + (gId++),
      x: Math.round(nat.x + Math.cos(nat.a + 0.85) * 115),
      y: Math.round(nat.y + Math.sin(nat.a + 0.85) * 115),
    });
  }

  // 3. Base Dorée Centrale (High-Yield Gold Minerals + 2 Geysers)
  for (let i = 0; i < 6; i++) {
    const a = (i / 6) * TAU;
    MINERAL_NODES.push({
      id: 'm' + (mId++),
      x: Math.round(HALF_W + Math.cos(a) * 155),
      y: Math.round(HALF_W + Math.sin(a) * 155),
      rich: true,
    });
  }
  GAS_GEYSERS.push({ id: 'g' + (gId++), x: HALF_W - 265, y: HALF_W });
  GAS_GEYSERS.push({ id: 'g' + (gId++), x: HALF_W + 265, y: HALF_W });
})();

/* ============================================================================
