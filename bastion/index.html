<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Bastion Clash — RTS 3D Top-Down (Édition StarCraft)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Chakra+Petch:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#16181d; --paper:#fff8ea; --cream:#f3e9d2; --muted:#6d675c; --line2:#d9cdb3;
  --red:#ff4b2b; --yellow:#ffc531; --green:#2fbf71; --blue:#2b8cff; --purple:#b45cff; --cyan:#1fc7c1;
}
*{box-sizing:border-box;user-select:none;-webkit-user-select:none}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;background:#142818;color:var(--ink);
  font-family:'Chakra Petch',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
canvas#world{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:default}
canvas#world.cur-attack{cursor:crosshair}
canvas#world.cur-build{cursor:cell}

/* HUD TOPBAR (RESSOURCES STARCRAFT : MINÉRAUX, GAZ PLASMA, RAVITAILLEMENT) */
.hud-top{position:fixed;top:10px;left:12px;right:12px;display:flex;align-items:center;gap:8px;pointer-events:none;z-index:25;flex-wrap:wrap}
.hud-top > *{pointer-events:auto}
.res-pill{background:var(--paper);border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);border-radius:12px;
  padding:5px 11px;display:flex;align-items:center;gap:8px;font-weight:700;font-size:13px}
.res-ico{width:24px;height:24px;border-radius:7px;border:2px solid var(--ink);display:inline-flex;align-items:center;justify-content:center;font-size:13px;box-shadow:2px 2px 0 var(--ink)}
.res-ico.min{background:var(--cyan);color:#fff}
.res-ico.gas{background:var(--green);color:#fff}
.res-ico.sup{background:var(--yellow);color:var(--ink)}
.res-val{font-family:Bungee,Impact,sans-serif;font-size:18px;color:var(--ink);min-width:44px}
.res-val.blocked{color:var(--red);animation:pulseSd .5s infinite alternate}
.res-sub{font-size:11px;color:var(--muted);background:var(--cream);border:1.5px solid var(--ink);border-radius:6px;padding:1px 5px;font-weight:700}

.phase-badge{background:var(--ink);color:var(--yellow);font-family:Bungee,Impact,sans-serif;font-size:12px;
  border:3px solid var(--paper);box-shadow:4px 4px 0 rgba(0,0,0,.55);border-radius:12px;padding:7px 12px;letter-spacing:.4px;display:flex;align-items:center;gap:7px}
.phase-badge.sd{background:var(--red);color:#fff;animation:pulseSd .7s infinite alternate}
@keyframes pulseSd{to{transform:scale(1.05)}}
.spacer{flex:1}

.roster-top{background:var(--paper);border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);border-radius:12px;padding:4px 9px;display:flex;gap:10px;align-items:center}
.p-chip{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:700}
.p-chip.dead{opacity:.38;text-decoration:line-through}
.p-chip .dot{width:11px;height:11px;border-radius:50%;border:2px solid var(--ink);display:inline-block}

.btn{font-family:Bungee,Impact,sans-serif;font-size:13px;letter-spacing:.4px;background:var(--red);color:#fff;
  border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);border-radius:10px;padding:7px 12px;cursor:pointer;
  transition:transform .06s,box-shadow .06s;white-space:nowrap}
.btn:hover{filter:brightness(1.06)}
.btn:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink)}
.btn:disabled{background:#c9c0ad;color:#7b7466;cursor:not-allowed;transform:none}
.btn.yellow{background:var(--yellow);color:var(--ink)}
.btn.green{background:var(--green);color:#fff}
.btn.ghost{background:var(--paper);color:var(--ink)}
.btn.small{font-size:11.5px;padding:5px 9px;box-shadow:3px 3px 0 var(--ink)}

/* BARRE D'ACCÈS RAPIDE STARCRAFT II (F1 VCS INACTIF, F2 ARMÉE, GROUPES DE CONTRÔLE 1-5) */
.quick-bar{position:fixed;bottom:232px;left:14px;z-index:22;display:flex;gap:6px;align-items:center;pointer-events:none;flex-wrap:wrap}
.quick-bar > *{pointer-events:auto}
.qbtn{background:var(--ink);color:var(--paper);border:2.5px solid var(--paper);box-shadow:3px 3px 0 #000;border-radius:9px;
  padding:4px 9px;font:inherit;font-size:11.5px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:5px;transition:transform .06s}
.qbtn:hover{background:#282c36;transform:translateY(-2px)}
.qbtn kbd{background:var(--yellow);color:var(--ink);border-radius:4px;padding:0 4px;font-family:Bungee,sans-serif;font-size:10px}
.qbtn .cnt{background:var(--cyan);color:var(--ink);border-radius:5px;padding:0 5px;font-weight:700;font-size:11px}
.cg-bar{display:flex;gap:4px;margin-left:4px}
.cg-pill{background:var(--paper);color:var(--ink);border:2px solid var(--ink);box-shadow:2px 2px 0 var(--ink);border-radius:7px;
  padding:2px 7px;font-size:11px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:4px}
.cg-pill.active{background:var(--yellow)}
.cg-pill b{font-family:Bungee,sans-serif;font-size:11px}

/* CONSOLE RTS INFÉRIEURE STYLE STARCRAFT (MINIMAP | SÉLECTION & PRODUCTION | GRILLE DE COMMANDES) */
.rts-console{position:fixed;bottom:8px;left:10px;right:10px;height:216px;z-index:24;display:grid;
  grid-template-columns:196px minmax(310px,1fr) 488px;gap:12px;pointer-events:none;max-width:1360px;margin:0 auto}
.rts-console > *{pointer-events:auto}

.panel-box{background:var(--paper);border:3px solid var(--ink);box-shadow:6px 6px 0 var(--ink);border-radius:16px;padding:9px 12px;display:flex;flex-direction:column;overflow:hidden;position:relative}
.panel-hd{display:flex;justify-content:space-between;align-items:center;font-family:Bungee,Impact,sans-serif;font-size:11px;letter-spacing:.6px;color:var(--muted);margin-bottom:6px;border-bottom:2px dashed var(--line2);padding-bottom:4px;flex:none}

/* 1. MINIMAP */
.minimap-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;min-height:0}
canvas#minimap{width:170px;height:164px;display:block;border:2.5px solid var(--ink);border-radius:9px;background:#102014;cursor:crosshair}

/* 2. PANNEAU CENTRAL/GAUCHE : PORTRAIT ESPACÉ, NOM CLAIR, STATS, FILE DE PRODUCTION OU GRILLE D'UNITÉS */
.sel-body{display:flex;gap:14px;align-items:stretch;flex:1;min-height:0;padding:2px 0}
.portrait-box{width:118px;border:2.5px solid var(--ink);border-radius:12px;background:var(--cream);flex:none;
  display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:6px 6px 5px;position:relative;box-shadow:inset 0 0 12px rgba(0,0,0,.08)}
.portrait-name{width:100%;background:var(--ink);color:var(--paper);font-family:Bungee,sans-serif;font-size:10px;text-align:center;
  border-radius:5px;padding:2px 4px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.portrait-box canvas{width:98px;height:86px;display:block;margin:2px auto}
.portrait-hp{width:100%;height:9px;background:#d9cdb3;border:1.5px solid var(--ink);border-radius:5px;overflow:hidden}
.portrait-hp i{display:block;height:100%;background:var(--green)}

.sel-info{flex:1;display:flex;flex-direction:column;justify-content:flex-start;gap:5px;min-width:0;overflow:hidden}
.sel-title{font-family:Bungee,Impact,sans-serif;font-size:17px;line-height:1.15;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sel-sub{font-size:12px;font-weight:700;color:var(--muted);line-height:1.25}
.sel-stats{display:flex;gap:6px;flex-wrap:wrap;margin-top:1px}
.st-chip{background:var(--cream);border:1.5px solid var(--ink);border-radius:6px;padding:2px 7px;font-size:11px;font-weight:700}

/* File d'attente de production (5 slots style StarCraft bien espacés avec nom visible) */
.prod-queue{display:flex;flex-direction:column;gap:4px;margin-top:auto;padding-top:4px;border-top:1.5px dashed var(--line2)}
.q-bar-wrap{width:100%;height:8px;background:#d9cdb3;border:1.5px solid var(--ink);border-radius:5px;overflow:hidden}
.q-bar-wrap i{display:block;height:100%;background:var(--yellow);transition:width .08s}
.q-slots{display:flex;gap:6px}
.q-slot{width:54px;height:36px;border:2px solid var(--ink);border-radius:8px;background:var(--cream);display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-family:Bungee,sans-serif;font-size:9.5px;position:relative;cursor:pointer;overflow:hidden;padding-top:4px}
.q-slot.filled{background:#fff;box-shadow:2px 2px 0 var(--ink)}
.q-slot.filled:hover::after{content:'✕';position:absolute;inset:0;background:rgba(255,75,43,.85);color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px}
.q-slot .num{position:absolute;top:1px;left:4px;font-size:8px;color:var(--muted)}
.q-slot .q-nm{font-weight:700;font-size:9.5px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:48px}

/* Grille multi-unités sélectionnées (cartes aérées avec icône 3D + nom complet visible) */
.multi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px;width:100%;max-height:162px;overflow-y:auto;padding:3px}
.u-card{height:68px;border:2px solid var(--ink);border-radius:10px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:space-between;
  padding:3px 4px 4px;cursor:pointer;position:relative;box-shadow:2px 2px 0 var(--ink)}
.u-card:hover{background:var(--cream)}
.u-card.stim{border-color:var(--red);background:#fff0ed}
.u-card.siege{border-color:var(--purple);background:#f5ecff}
.u-card canvas.u-thumb{width:58px;height:34px;display:block;margin:0 auto}
.u-card .u-nm{font-family:Bungee,sans-serif;font-size:9.5px;color:var(--ink);line-height:1.1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%}
.u-card .u-hp{width:100%;height:5px;background:#e2d6bc;border:1px solid var(--ink);border-radius:3px;overflow:hidden}
.u-card .u-hp i{display:block;height:100%;background:var(--green)}

/* 3. GRILLE DE COMMANDES 4x3 AÉRÉE (COMMAND CARD AVEC IMAGE BIEN DÉGAGÉE ET NOM EN BANDEAU) */
.cmd-grid{display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(3,1fr);gap:7px;flex:1;min-height:0}
.cmd-empty{grid-column:1/-1;grid-row:1/-1;border:2px dashed var(--line2);border-radius:10px;background:var(--cream);
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px;text-align:center;color:var(--muted);font-size:12px;font-weight:700;gap:5px}
.cmd-empty b{font-family:Bungee,sans-serif;color:var(--ink);font-size:13px}
.cbtn{border:2px solid var(--ink);border-radius:10px;background:#fff;padding:0;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:space-between;position:relative;
  transition:transform .06s,background .06s;font:inherit;color:var(--ink);box-shadow:2px 2px 0 var(--ink);overflow:hidden}
.cbtn:hover:not(:disabled){transform:translateY(-2px);background:var(--cream)}
.cbtn.sel{background:var(--yellow);box-shadow:0 0 0 2px var(--ink),2px 3px 0 var(--ink)}
.cbtn:disabled{opacity:.42;cursor:not-allowed;background:#e9e1cf;box-shadow:none}
.cbtn-top{width:100%;display:flex;justify-content:space-between;align-items:center;padding:2px 4px 0;flex:none}
.cbtn .key{font-size:9px;font-weight:700;background:var(--ink);color:var(--paper);
  border-radius:3px;padding:0 4px;line-height:1.35}
.cbtn .cost-tag{font-family:Bungee,sans-serif;font-size:8.5px;color:#0e6b68;background:#d8f8f6;
  border:1px solid var(--ink);border-radius:3px;padding:0 3.5px;line-height:1.25}
.cbtn.cant .cost-tag{color:#c4231a;background:#ffe3dc}
.cbtn-mid{flex:1;width:100%;display:flex;align-items:center;justify-content:center;min-height:0;padding:1px 2px}
.cbtn canvas.thumb{width:68px;height:30px;display:block}
.cbtn .ico-txt{font-size:17px;line-height:1}
.cbtn .lbl-b{width:100%;background:var(--ink);color:var(--paper);font-weight:700;font-size:10.5px;line-height:1.25;
  padding:2px 3px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:none;letter-spacing:.2px}
.cbtn.sel .lbl-b{background:#16181d;color:var(--yellow)}

/* TOAST & MODAL */
.toast{position:fixed;top:62px;left:50%;transform:translateX(-50%);z-index:40;background:var(--ink);color:var(--yellow);
  font-family:Bungee,Impact,sans-serif;font-size:14px;border:3px solid var(--paper);border-radius:12px;padding:7px 15px;
  box-shadow:5px 5px 0 #000;pointer-events:none}
.modal-ov{position:fixed;inset:0;z-index:50;background:rgba(10,12,16,.72);display:flex;align-items:center;justify-content:center;padding:16px}
.modal-card{background:var(--paper);border:3px solid var(--ink);box-shadow:8px 8px 0 var(--ink);border-radius:18px;padding:24px;width:min(540px,100%);text-align:center}
.modal-card h1{font-family:Bungee,Impact,sans-serif;font-size:34px;margin:0 0 6px;line-height:1}
.modal-card p{color:var(--muted);font-weight:600;margin:6px 0 16px}
.rank-list{list-style:none;padding:0;margin:0 0 18px;display:grid;gap:8px;text-align:left}
.rank-list li{display:flex;align-items:center;gap:10px;background:#fff;border:2.5px solid var(--ink);border-radius:11px;padding:8px 12px;font-weight:700}
.rank-list li .rk{font-family:Bungee,Impact,sans-serif;font-size:18px;width:28px}
.rank-list li .dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--ink)}
.rank-list li .sc{margin-left:auto;font-family:Bungee,Impact,sans-serif;font-size:14px;color:var(--muted)}

@media(max-width:1040px){
  .rts-console{grid-template-columns:156px 1fr 380px;height:204px}
  canvas#minimap{width:136px;height:148px}
}
</style>
</head>
<body>

<canvas id="world"></canvas>

<!-- HUD TOP : MINÉRAUX, GAZ PLASMA, RAVITAILLEMENT, PHASE & JOUEURS -->
<div class="hud-top">
  <div class="res-pill" title="Minéraux récoltés par tes Ouvriers VCS sur les gisements de cristal">
    <span class="res-ico min">💎</span>
    <span class="res-val" id="uiMin">200</span>
    <span class="res-sub" id="uiWorkers">6 VCS</span>
  </div>
  <div class="res-pill" title="Gaz Plasma récolté dans tes Raffineries (clique sur un VCS pour construire une Raffinerie sur un geyser vert)">
    <span class="res-ico gas">🧪</span>
    <span class="res-val" id="uiGas">50</span>
    <span class="res-sub" id="uiRefineries">0 Raff.</span>
  </div>
  <div class="res-pill" title="Ravitaillement (Population) : sélectionne un VCS et construis des Dépôts Relais pour augmenter la limite">
    <span class="res-ico sup">📦</span>
    <span class="res-val" id="uiSupply">6/15</span>
  </div>
  <div class="phase-badge" id="uiPhase">
    <span id="uiClock">00:00</span> · <span id="uiPhaseName">Ouverture RTS</span>
  </div>
  <div class="spacer"></div>
  <div class="roster-top" id="uiRoster"></div>
  <button class="btn small ghost" id="btnCenter" title="Recentrer sur ton QG (Espace)">🎯 QG</button>
  <button class="btn small yellow" id="btnMusic" title="Activer / Couper la musique épique">🎵 Musique</button>
  <button class="btn small ghost" id="btnMute" title="Effets sonores">🔊</button>
  <button class="btn small" id="btnExit">Quitter</button>
</div>

<!-- BARRE D'UNITÉS STARCRAFT II (F1 VCS, F2 ARMÉE + GROUPES DE CONTRÔLE 1-5) -->
<div class="quick-bar">
  <button class="qbtn" id="btnIdleScv" title="Sélectionner un Ouvrier VCS pour construire (F1)">
    <kbd>F1</kbd> Sélectionner VCS <span class="cnt" id="uiIdleCnt">0</span>
  </button>
  <button class="qbtn" id="btnAllArmy" title="Sélectionner toute l'armée de combat (F2)">
    <kbd>F2</kbd> Toute l'armée <span class="cnt" id="uiArmyCnt">0</span>
  </button>
  <div class="cg-bar" id="uiCgBar" title="Groupes de contrôle (Ctrl+1..9 pour assigner un bâtiment ou une escouade, 1..9 pour rappeler)"></div>
</div>

<!-- CONSOLE RTS INFÉRIEURE (3 VOLETS : RADAR | SÉLECTION & PRODUCTION | ORDRES DE LA SÉLECTION) -->
<div class="rts-console">
  <!-- 1. Minimap Radar -->
  <div class="panel-box">
    <div class="panel-hd"><span>Radar Tactique</span><span>Clic Droit = Ordre</span></div>
    <div class="minimap-wrap">
      <canvas id="minimap" width="170" height="164"></canvas>
    </div>
  </div>

  <!-- 2. Panneau de Sélection & File de Production -->
  <div class="panel-box">
    <div class="panel-hd">
      <span id="uiSelHeader">Sélection tactique</span>
      <span id="uiSelSubHint">Clique sur un VCS ou un bâtiment</span>
    </div>
    <div class="sel-body" id="uiSelBody"></div>
  </div>

  <!-- 3. Grille d'Ordres liée strictement à l'unité ou au bâtiment sélectionné -->
  <div class="panel-box">
    <div class="panel-hd">
      <span id="uiCmdTitle">Aucune sélection</span>
      <span id="uiCmdHint" style="font-family:'Chakra Petch',sans-serif;font-weight:700;font-size:10px">—</span>
    </div>
    <div class="cmd-grid" id="uiCmdGrid"></div>
  </div>
</div>

<div class="toast" id="uiToast" hidden></div>

<!-- ENDGAME MODAL -->
<div class="modal-ov" id="endModal" hidden>
  <div class="modal-card">
    <h1 id="endTitle">Victoire !</h1>
    <p id="endSub">Tous les Centres de Commandement adverses ont été détruits.</p>
    <ul class="rank-list" id="endRanks"></ul>
    <div style="display:flex;gap:10px;justify-content:center">
      <button class="btn yellow" id="btnReplay">Rejouer</button>
      <button class="btn ghost" id="btnEndExit">Retour au salon</button>
    </div>
  </div>
</div>

<script src="../shared/bridge.js"></script>
<script>
'use strict';

/* ============================================================================
   BASTION CLASH — RTS 3D VUE DU DESSUS (ÉDITION STARCRAFT PURE)
   - Sélection stricte à la StarCraft :
     * Par défaut (rien sélectionné) : aucune construction ni production possible.
     * Pour construire un bâtiment : il faut cliquer sur un Ouvrier VCS.
     * Pour entraîner des Ouvriers VCS : il faut cliquer sur son QG.
     * Pour entraîner l'infanterie : il faut cliquer sur une Caserne.
     * Pour produire des blindés/mechas : il faut cliquer sur une Usine.
   - Moteur de projection 3D Vue du Dessus (Top-Down 3D Perspective) :
     * Extrusion volumétrique 3D réelle (prismes, cylindres, pyramides, octaèdres)
       avec calcul d'éclairage directionnel par face et point de fuite caméra.
   ============================================================================ */

const $ = (s) => document.querySelector(s);
const $$ = (s) => [...document.querySelectorAll(s)];
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const dist2 = (x1, y1, x2, y2) => (x1 - x2) ** 2 + (y1 - y2) ** 2;
const hypot = (x1, y1, x2, y2) => Math.hypot(x1 - x2, y1 - y2);
const TAU = Math.PI * 2;

const WORLD_SIZE = 2400;
const HALF_W = WORLD_SIZE / 2;
const TICK_RATE = 20;
const TICK_DT = 1 / TICK_RATE;
const MAX_SUPPLY = 100;

function shade(hex, f) {
  let c = String(hex || '#888888').replace('#', '');
  if (c.length === 3) c = c[0] + c[0] + c[1] + c[1] + c[2] + c[2];
  const n = parseInt(c, 16) || 0;
  let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  if (f < 0) { const k = 1 + f; r = Math.round(r * k); g = Math.round(g * k); b = Math.round(b * k); }
  else { r = Math.round(r + (255 - r) * f); g = Math.round(g + (255 - g) * f); b = Math.round(b + (255 - b) * f); }
  return '#' + [r, g, b].map((v) => clamp(v, 0, 255).toString(16).padStart(2, '0')).join('');
}

function mulberry(a) {
  return function () {
    let t = (a += 0x6d2b79f5);
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* ============================================================================
   DONNÉES D'ÉQUILIBRAGE RTS (BÂTIMENTS & UNITÉS STARCRAFT)
   ============================================================================ */
const BUILDINGS = {
  hq: {
    name: 'Centre de Commandement', short: 'QG', min: 350, gas: 0, buildTime: 18,
    hp: 3200, radius: 48, height: 54, supply: 15, sight: 420, range: 255, dmg: 24, rate: 0.85,
    trains: ['scv'], desc: 'Clique sur le QG pour entraîner des Ouvriers VCS [Q] ou lancer un Scan Radar [X].',
  },
  pylon: {
    name: 'Dépôt Relais', short: 'Dépôt', min: 75, gas: 0, buildTime: 7,

const SPAWN_CORNERS = [
  { x: 360, y: 360 },

const MINERAL_NODES = [];
const GAS_GEYSERS = [];
const TREES_3D = [];

(function initMapResources() {
  let mId = 1, gId = 1;
  SPAWN_CORNERS.forEach((sp, idx) => {
    const awayA = Math.atan2(sp.y - HALF_W, sp.x - HALF_W);
    for (let i = -2.5; i <= 2.5; i += 1) {
      const a = awayA + i * 0.25;
      MINERAL_NODES.push({
        id: 'm' + (mId++),
        x: Math.round(sp.x + Math.cos(a) * 142),
        y: Math.round(sp.y + Math.sin(a) * 142),
        rich: false,
      });
    }
    const ga = awayA + (idx % 2 === 0 ? 0.95 : -0.95);
    GAS_GEYSERS.push({
      id: 'g' + (gId++),
      x: Math.round(sp.x + Math.cos(ga) * 148),
      y: Math.round(sp.y + Math.sin(ga) * 148),
    });
  });

  const naturals = [
    { x: HALF_W, y: 260, a: -Math.PI / 2 },
    { x: HALF_W, y: WORLD_SIZE - 260, a: Math.PI / 2 },
    { x: 260, y: HALF_W, a: Math.PI },
    { x: WORLD_SIZE - 260, y: HALF_W, a: 0 },
  ];
  for (const nat of naturals) {
    for (let i = -1.5; i <= 1.5; i += 1) {
      const a = nat.a + i * 0.28;
      MINERAL_NODES.push({
        id: 'm' + (mId++),
        x: Math.round(nat.x + Math.cos(a) * 105),
        y: Math.round(nat.y + Math.sin(a) * 105),
        rich: false,
      });
    }
    GAS_GEYSERS.push({
      id: 'g' + (gId++),
      x: Math.round(nat.x + Math.cos(nat.a + 0.85) * 115),
      y: Math.round(nat.y + Math.sin(nat.a + 0.85) * 115),
    });
  }

  for (let i = 0; i < 6; i++) {
    const a = (i / 6) * TAU;
    MINERAL_NODES.push({
      id: 'm' + (mId++),
      x: Math.round(HALF_W + Math.cos(a) * 155),
      y: Math.round(HALF_W + Math.sin(a) * 155),
      rich: true,
    });
  }
  GAS_GEYSERS.push({ id: 'g' + (gId++), x: HALF_W - 265, y: HALF_W });
  GAS_GEYSERS.push({ id: 'g' + (gId++), x: HALF_W + 265, y: HALF_W });
})();

/* ============================================================================
   CARTE SOL PRÉ-RENDUE + LISTE DES ARBRES VOLUMÉTRIQUES 3D
   ============================================================================ */
let terrainCanvas = null;

function buildTerrainCanvas() {
  const c = document.createElement('canvas');
  c.width = WORLD_SIZE;
  c.height = WORLD_SIZE;
  const g = c.getContext('2d');
  const rnd = mulberry(20261019);

  g.fillStyle = '#386f3e';
  g.fillRect(0, 0, WORLD_SIZE, WORLD_SIZE);

  for (let k = 0; k < 65; k++) {
    const bx = rnd() * WORLD_SIZE, by = rnd() * WORLD_SIZE, br = 90 + rnd() * 190;
    g.fillStyle = rnd() < 0.5 ? 'rgba(38, 84, 44, 0.38)' : 'rgba(76, 138, 72, 0.26)';
    g.beginPath(); g.arc(bx, by, br, 0, TAU); g.fill();
  }
  for (let k = 0; k < 10000; k++) {
    g.fillStyle = rnd() < 0.5 ? 'rgba(22, 50, 28, 0.22)' : 'rgba(135, 190, 105, 0.18)';
    g.fillRect(rnd() * WORLD_SIZE, rnd() * WORLD_SIZE, 2 + rnd() * 3.5, 2 + rnd() * 3.5);
  }

  const riverPath = new Path2D();
  riverPath.moveTo(0, HALF_W - 180);
  riverPath.bezierCurveTo(WORLD_SIZE * 0.33, HALF_W + 220, WORLD_SIZE * 0.66, HALF_W - 220, WORLD_SIZE, HALF_W + 180);
  g.lineCap = 'round';
  g.strokeStyle = '#16181d'; g.lineWidth = 122; g.stroke(riverPath);
  g.strokeStyle = '#c8ba9b'; g.lineWidth = 110; g.stroke(riverPath);
  g.strokeStyle = '#246b96'; g.lineWidth = 84; g.stroke(riverPath);
  g.strokeStyle = '#328bc2'; g.lineWidth = 60; g.stroke(riverPath);

  const drawRoad = (x1, y1, x2, y2, width = 72) => {
    g.save();
    g.lineCap = 'round';
    g.strokeStyle = '#16181d'; g.lineWidth = width + 16;
    g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.stroke();
    g.strokeStyle = '#f3e9d2'; g.lineWidth = width + 8;
    g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.stroke();
    g.strokeStyle = '#484b54'; g.lineWidth = width - 4;
    g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.stroke();
    g.strokeStyle = 'rgba(255, 248, 234, 0.5)'; g.lineWidth = 3;
    g.setLineDash([20, 20]);
    g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.stroke();
    g.restore();
  };

  drawRoad(360, 360, WORLD_SIZE - 360, WORLD_SIZE - 360, 72);
  drawRoad(WORLD_SIZE - 360, 360, 360, WORLD_SIZE - 360, 72);
  drawRoad(360, 360, WORLD_SIZE - 360, 360, 50);
  drawRoad(360, WORLD_SIZE - 360, WORLD_SIZE - 360, WORLD_SIZE - 360, 50);
  drawRoad(360, 360, 360, WORLD_SIZE - 360, 50);
  drawRoad(WORLD_SIZE - 360, 360, WORLD_SIZE - 360, WORLD_SIZE - 360, 50);

  // Plateformes de bases principales avec biseau 3D au sol
  SPAWN_CORNERS.forEach((sp) => {
    g.save();
    g.translate(sp.x, sp.y);
    g.fillStyle = 'rgba(16, 18, 24, 0.35)';
    g.beginPath(); g.arc(8, 10, 218, 0, TAU); g.fill();
    g.fillStyle = '#535763';
    g.strokeStyle = '#16181d';
    g.lineWidth = 5;
    g.beginPath(); g.arc(0, 0, 215, 0, TAU); g.fill(); g.stroke();
    g.fillStyle = '#626775';
    g.beginPath(); g.arc(0, 0, 175, 0, TAU); g.fill(); g.stroke();
    g.strokeStyle = '#ffc531';
    g.lineWidth = 4.5;
    g.setLineDash([18, 14]);
    g.beginPath(); g.arc(0, 0, 195, 0, TAU); g.stroke();
    g.restore();
  });

  // Citadelle Centrale (Gold Base)
  g.save();
  g.translate(HALF_W, HALF_W);
  g.fillStyle = 'rgba(16, 18, 24, 0.35)';
  g.beginPath(); g.arc(8, 10, 344, 0, TAU); g.fill();
  g.fillStyle = '#585c69';
  g.strokeStyle = '#16181d';
  g.lineWidth = 6;
  g.beginPath(); g.arc(0, 0, 340, 0, TAU); g.fill(); g.stroke();
  g.fillStyle = '#454954';
  g.beginPath(); g.arc(0, 0, 275, 0, TAU); g.fill(); g.stroke();
  g.strokeStyle = '#ffc531';
  g.lineWidth = 4;
  g.setLineDash([22, 14]);
  g.beginPath(); g.arc(0, 0, 115, 0, TAU); g.stroke();
  g.restore();

  // Génération des arbres 3D (rendus dynamiquement avec parallaxe 3D)
  TREES_3D.length = 0;
  const treeColors = ['#2d6632', '#39783c', '#245429', '#468a44'];
  for (let k = 0; k < 155; k++) {
    const tx = 45 + rnd() * (WORLD_SIZE - 90);
    const ty = 45 + rnd() * (WORLD_SIZE - 90);
    const nearBase = SPAWN_CORNERS.some((s) => hypot(tx, ty, s.x, s.y) < 330);
    const nearCenter = hypot(tx, ty, HALF_W, HALF_W) < 410;
    const nearDiag1 = Math.abs(tx - ty) < 120;
    const nearDiag2 = Math.abs(tx + ty - WORLD_SIZE) < 120;
    const nearRes = MINERAL_NODES.some((m) => hypot(tx, ty, m.x, m.y) < 95) || GAS_GEYSERS.some((ge) => hypot(tx, ty, ge.x, ge.y) < 110);
    if (nearBase || nearCenter || nearDiag1 || nearDiag2 || nearRes) continue;
    const col = treeColors[(rnd() * treeColors.length) | 0];
    const r = 17 + rnd() * 12;
    TREES_3D.push({ x: tx, y: ty, r, col, h: 32 + rnd() * 22 });
  }

  g.strokeStyle = '#16181d';
  g.lineWidth = 18;
  g.strokeRect(9, 9, WORLD_SIZE - 18, WORLD_SIZE - 18);
  terrainCanvas = c;
}

/* ============================================================================
   AUDIO SYNTHÉTISÉ + BANDE-SON ORCHESTRALE RTS ÉPIQUE (WebAudio)
   ============================================================================ */
const Sfx = (() => {
  let ctx = null, muted = false, musicOn = true, musicTimer = null;
  let stepIdx = 0, nextNoteTime = 0, noiseBuf = null;

  function ensureContext() {
    if (!ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) ctx = new AC();
    }
    if (ctx && ctx.state === 'suspended') ctx.resume().catch(() => {});
    if (ctx && !noiseBuf) {
      noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 0.4, ctx.sampleRate);
      const data = noiseBuf.getChannelData(0);
      for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
    }
    return ctx;
  }

  function ensure() {
    if (muted) return null;
    return ensureContext();
  }

  function tone(freq, dur, type = 'triangle', vol = 0.11, slide = 0) {
    const c = ensure(); if (!c) return;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type;
    const t = c.currentTime;
    o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(c.destination);
    o.start(t); o.stop(t + dur);
  }

  // --- INSTRUMENTS DE LA MUSIQUE ÉPIQUE RTS (Ré mineur / 132 BPM) ---
  function mtof(midi) {
    return 440 * Math.pow(2, (midi - 69) / 12);
  }

  function playKick(c, t, accent = false) {
    const o = c.createOscillator(), g = c.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(accent ? 145 : 120, t);
    o.frequency.exponentialRampToValueAtTime(34, t + 0.19);
    g.gain.setValueAtTime(accent ? 0.22 : 0.16, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.22);
    o.connect(g); g.connect(c.destination);
    o.start(t); o.stop(t + 0.23);
  }

  function playSnare(c, t, vol = 0.09) {
    if (noiseBuf) {
      const src = c.createBufferSource();
      src.buffer = noiseBuf;
      const flt = c.createBiquadFilter();
      flt.type = 'bandpass';
      flt.frequency.setValueAtTime(1650, t);
      const g = c.createGain();
      g.gain.setValueAtTime(vol, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.14);
      src.connect(flt); flt.connect(g); g.connect(c.destination);
      src.start(t); src.stop(t + 0.15);
    }
    const o = c.createOscillator(), og = c.createGain();
    o.type = 'triangle';
    o.frequency.setValueAtTime(195, t);
    o.frequency.exponentialRampToValueAtTime(92, t + 0.09);
    og.gain.setValueAtTime(vol * 0.7, t);
    og.gain.exponentialRampToValueAtTime(0.001, t + 0.1);
    o.connect(og); og.connect(c.destination);
    o.start(t); o.stop(t + 0.11);
  }

  function playHat(c, t, open = false) {
    if (!noiseBuf) return;
    const src = c.createBufferSource();
    src.buffer = noiseBuf;
    const flt = c.createBiquadFilter();
    flt.type = 'highpass';
    flt.frequency.setValueAtTime(6500, t);
    const g = c.createGain();
    const dur = open ? 0.14 : 0.045;
    g.gain.setValueAtTime(open ? 0.045 : 0.026, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    src.connect(flt); flt.connect(g); g.connect(c.destination);
    src.start(t); src.stop(t + dur + 0.01);
  }

  function playBass(c, t, midi, dur) {
    const f = mtof(midi);
    const o1 = c.createOscillator(), o2 = c.createOscillator();
    const flt = c.createBiquadFilter(), g = c.createGain();
    o1.type = 'sawtooth'; o2.type = 'square';
    o1.frequency.setValueAtTime(f, t);
    o2.frequency.setValueAtTime(f * 0.5, t);
    flt.type = 'lowpass';
    flt.frequency.setValueAtTime(680, t);
    flt.frequency.exponentialRampToValueAtTime(190, t + dur);
    g.gain.setValueAtTime(0.085, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o1.connect(flt); o2.connect(flt); flt.connect(g); g.connect(c.destination);
    o1.start(t); o2.start(t);
    o1.stop(t + dur + 0.01); o2.stop(t + dur + 0.01);
  }

  function playBrassChord(c, t, midis, dur) {
    const flt = c.createBiquadFilter(), g = c.createGain();
    flt.type = 'lowpass';
    flt.frequency.setValueAtTime(420, t);
    flt.frequency.linearRampToValueAtTime(1450, t + dur * 0.35);
    flt.frequency.exponentialRampToValueAtTime(520, t + dur);
    g.gain.setValueAtTime(0.002, t);
    g.gain.linearRampToValueAtTime(0.048, t + 0.08);
    g.gain.setValueAtTime(0.042, t + dur * 0.7);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    flt.connect(g); g.connect(c.destination);

    for (const m of midis) {
      for (const det of [-4.5, 4.5]) {
        const o = c.createOscillator();
        o.type = 'sawtooth';
        o.frequency.setValueAtTime(mtof(m), t);
        o.detune.setValueAtTime(det, t);
        o.connect(flt);
        o.start(t); o.stop(t + dur + 0.02);
      }
    }
  }

  function playHeroLead(c, t, midi, dur) {
    const f = mtof(midi);
    const o1 = c.createOscillator(), o2 = c.createOscillator();
    const flt = c.createBiquadFilter(), g = c.createGain();
    o1.type = 'sawtooth'; o2.type = 'triangle';
    o1.frequency.setValueAtTime(f, t);
    o2.frequency.setValueAtTime(f, t);
    o1.detune.setValueAtTime(6, t);
    o2.detune.setValueAtTime(-6, t);
    flt.type = 'lowpass';
    flt.frequency.setValueAtTime(2400, t);
    g.gain.setValueAtTime(0.002, t);
    g.gain.linearRampToValueAtTime(0.068, t + 0.025);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o1.connect(flt); o2.connect(flt); flt.connect(g); g.connect(c.destination);
    o1.start(t); o2.start(t);
    o1.stop(t + dur + 0.02); o2.stop(t + dur + 0.02);
  }

  // Partition épique sur 64 pas (4 mesures en 4/4 à 132 BPM : Dm -> Bb -> Gm -> A7 / Dm -> F -> C -> A7)
  const CHORDS_8BARS = [
    [50, 57, 62, 65], // Dm
    [46, 53, 58, 62], // Bb
    [43, 50, 55, 58], // Gm
    [45, 52, 57, 61], // A7
    [50, 57, 62, 65], // Dm
    [41, 48, 53, 57], // F
    [48, 55, 60, 64], // C
    [45, 52, 57, 61], // A7
  ];
  const BASS_ROOTS = [38, 34, 31, 33, 38, 41, 36, 33];

  // Mélodie héroïque style Terran / Command & Conquer (par pas de 1/16e sur 128 pas = 8 mesures)
  const LEAD_SEQ = {
    0: [62, 3], 3: [65, 3], 6: [69, 6], 12: [67, 2], 14: [65, 2],
    16: [64, 6], 22: [62, 4], 26: [58, 6],
    32: [62, 3], 35: [65, 3], 38: [67, 6], 44: [70, 4],
    48: [69, 10], 58: [64, 3], 61: [67, 3],
    64: [69, 4], 68: [74, 6], 74: [72, 3], 77: [69, 3],
    80: [65, 6], 86: [69, 4], 90: [72, 6],
    96: [70, 4], 100: [67, 4], 104: [64, 4], 108: [67, 4],
    112: [69, 12], 124: [61, 4],
  };

  function scheduleMusic() {
    if (!musicOn) return;
    const c = ensureContext();
    if (!c || c.state !== 'running') return;

    const stepDur = 60 / 132 / 4; // ~0.1136s par double-croche
    if (nextNoteTime < c.currentTime) nextNoteTime = c.currentTime + 0.04;

    while (nextNoteTime < c.currentTime + 0.22) {
      const s = stepIdx % 128;
      const bar = Math.floor(s / 16);
      const inBar = s % 16;
      const t = nextNoteTime;

      // 1. Accords de cuivres orchestraux en début de mesure et relance au temps 3
      if (inBar === 0) {
        playBrassChord(c, t, CHORDS_8BARS[bar], stepDur * 15.5);
      }

      // 2. Basse ostinato galopante façon RTS
      const root = BASS_ROOTS[bar];
      if (inBar % 2 === 0 || inBar === 3 || inBar === 11 || inBar === 15) {
        const pitch = (inBar === 6 || inBar === 14) ? root + 12 : (inBar === 15 ? root + 7 : root);
        playBass(c, t, pitch, stepDur * 1.6);
      }

      // 3. Percussions de guerre (Taiko Kick + Caisse claire martiale + Charley)
      if (inBar === 0 || inBar === 6 || inBar === 8 || inBar === 11) {
        playKick(c, t, inBar === 0 || inBar === 8);
      }
      if (inBar === 4 || inBar === 12) {
        playSnare(c, t, 0.095);
      } else if (bar % 2 === 1 && (inBar === 14 || inBar === 15)) {
        playSnare(c, t, 0.065); // Roulement militaire de fin de phrase
      }
      if (inBar % 2 === 0) {
        playHat(c, t, inBar === 10);
      }

      // 4. Mélodie héroïque principale
      const note = LEAD_SEQ[s];
      if (note) {
        playHeroLead(c, t, note[0], stepDur * note[1]);
      }

      nextNoteTime += stepDur;
      stepIdx++;
    }
  }

  function startMusic() {
    musicOn = true;
    const c = ensureContext();
    if (c && nextNoteTime < c.currentTime) nextNoteTime = c.currentTime + 0.05;
    if (!musicTimer) {
      musicTimer = setInterval(scheduleMusic, 80);
    }
  }

  function stopMusic() {
    musicOn = false;
    if (musicTimer) {
      clearInterval(musicTimer);
      musicTimer = null;
    }
  }

  return {
    get muted() { return muted; },
    get musicPlaying() { return musicOn; },
    toggle() { muted = !muted; return muted; },
    toggleMusic() {
      if (musicOn) stopMusic();
      else startMusic();
      return musicOn;
    },
    startMusic,
    stopMusic,
    wake() {
      ensureContext();
      if (musicOn && !musicTimer) startMusic();
    },
    build()   { tone(320, 0.1, 'square', 0.09, 160); setTimeout(() => tone(520, 0.12, 'triangle', 0.1, 100), 55); },
    spawn()   { tone(280, 0.1, 'sawtooth', 0.08, 130); },
    order()   { tone(520, 0.07, 'sine', 0.09, 110); },
    attack()  { tone(380, 0.09, 'sawtooth', 0.1, -110); },
    stim()    { tone(440, 0.12, 'sawtooth', 0.12, 340); },
    siege()   { tone(180, 0.22, 'square', 0.12, -60); setTimeout(() => tone(290, 0.15, 'triangle', 0.1, 80), 120); },
    scan()    { tone(680, 0.25, 'sine', 0.11, 260); },
    shoot()   { tone(190 + Math.random() * 60, 0.05, 'sawtooth', 0.03, -85); },
    plasma()  { tone(620, 0.13, 'sine', 0.06, -400); },
    boom()    { tone(110, 0.3, 'sawtooth', 0.15, -75); },
    error()   { tone(155, 0.15, 'sawtooth', 0.11, -35); },
  };
})();

/* ============================================================================
   RÈGLES DE PLACEMENT & RAVITAILLEMENT STARCRAFT
   ============================================================================ */
function computeSupply(state, ownerId) {
  let used = 0, max = 0;
  for (const b of state.buildings) {
    if (b.owner === ownerId && b.hp > 0 && !b.constructing) {
      max += BUILDINGS[b.kind]?.supply || 0;
    }
  }
  for (const u of state.units) {
    if (u.owner === ownerId && u.hp > 0) {
      used += UNITS[u.kind]?.supply || 1;
    }
  }
  for (const b of state.buildings) {
    if (b.owner === ownerId && b.hp > 0 && Array.isArray(b.queue)) {
      for (const qKind of b.queue) used += UNITS[qKind]?.supply || 1;
    }
  }
  return { used, max: Math.min(MAX_SUPPLY, max) };
}

function findGeyserAt(x, y, maxDist = 56) {
  let best = null, bestD2 = maxDist * maxDist;
  for (const g of GAS_GEYSERS) {
    const d2 = dist2(x, y, g.x, g.y);
    if (d2 <= bestD2) { bestD2 = d2; best = g; }
  }
  return best;
}

function hasCompletedBuilding(state, ownerId, kind) {
  return state.buildings.some((b) => b.owner === ownerId && b.kind === kind && b.hp > 0 && !b.constructing);
}

function canPlaceBuilding(state, ownerId, kind, x, y) {
  const def = BUILDINGS[kind];
  if (!def) return { ok: false, reason: 'Bâtiment inconnu.' };
  const player = state.players.find((p) => p.id === ownerId);
  if (!player || player.dead) return { ok: false, reason: 'Joueur éliminé.' };
  if (def.req && !hasCompletedBuilding(state, ownerId, def.req)) {
    return { ok: false, reason: `Requiert d’abord : ${BUILDINGS[def.req].name}.` };
  }
  if (player.minerals < def.min) return { ok: false, reason: `Pas assez de Minéraux (${def.min}💎 requis).` };
  if (player.gas < def.gas) return { ok: false, reason: `Pas assez de Gaz Plasma (${def.gas}🧪 requis).` };

  if (def.onGeyser) {
    const gey = findGeyserAt(x, y, 64);
    if (!gey) return { ok: false, reason: 'La Raffinerie doit être placée sur un Geyser de Gaz Plasma 🧪.' };
    const taken = state.buildings.some((b) => b.hp > 0 && dist2(b.x, b.y, gey.x, gey.y) < 35 * 35);
    if (taken) return { ok: false, reason: 'Ce Geyser de Gaz est déjà exploité.' };
    return { ok: true, snapX: gey.x, snapY: gey.y, geyserId: gey.id };
  }

  const margin = def.radius + 32;
  if (x < margin || y < margin || x > WORLD_SIZE - margin || y > WORLD_SIZE - margin) {
    return { ok: false, reason: 'Trop près du bord de la carte.' };
  }

  const pad = kind === 'wall' ? 2 : 8;
  for (const b of state.buildings) {
    if (b.hp <= 0) continue;
    const minDist = def.radius + b.radius + pad;
    if (dist2(x, y, b.x, b.y) < minDist * minDist) {
      return { ok: false, reason: 'Emplacement occupé par un bâtiment.' };
    }
  }
  for (const rk of ROCKS) {
    if (dist2(x, y, rk.x, rk.y) < (def.radius + rk.r + 6) ** 2) {
      return { ok: false, reason: 'Obstacle rocheux.' };
    }
  }
  for (const m of MINERAL_NODES) {
    const minD = kind === 'hq' ? def.radius + 45 : def.radius + 22;
    if (dist2(x, y, m.x, m.y) < minD * minD) {
      return { ok: false, reason: 'Trop près des gisements de minéraux.' };
    }
  }
  for (const gey of GAS_GEYSERS) {
    if (dist2(x, y, gey.x, gey.y) < (def.radius + 28) ** 2) {
      return { ok: false, reason: 'Réservé aux Raffineries de Gaz.' };
    }
  }
  return { ok: true, snapX: Math.round(x), snapY: Math.round(y) };
}

function nearestMineral(x, y, maxDist = 2000) {
  let best = null, bestD2 = maxDist * maxDist;
  for (const m of MINERAL_NODES) {
    const d2 = dist2(x, y, m.x, m.y);
    if (d2 < bestD2) { bestD2 = d2; best = m; }
  }
  return best;
}

function nearestMyHq(state, ownerId, x, y) {
  let best = null, bestD2 = Infinity;
  for (const b of state.buildings) {
    if (b.owner === ownerId && b.kind === 'hq' && b.hp > 0 && !b.constructing) {
      const d2 = dist2(x, y, b.x, b.y);
      if (d2 < bestD2) { bestD2 = d2; best = b; }
    }
  }
  return best;
}

/* ============================================================================
   CRÉATION DE L'ÉTAT INITIAL RTS (QG + 6 OUVRIERS VCS EN RÉCOLTE)
   ============================================================================ */
function createInitialState(roster, settings) {
  const is2v2 = settings.mode === '2v2' && roster.length >= 2;
  const blitz = settings.pace === 'blitz';
  const players = roster.map((p, idx) => {
    const team = is2v2 ? (idx % 2) : p.id;
    return {
      id: p.id,
      name: p.name,
      color: p.color || PALETTE[idx % PALETTE.length],
      bot: !!p.bot,
      team,
      minerals: blitz ? 300 : 200,
      gas: blitz ? 100 : 50,
      dead: false,
      score: 0,
    };
  });

  let nextId = 1;
  const buildings = [];
  const units = [];

  players.forEach((p, idx) => {
    const sp = SPAWN_CORNERS[idx % 4];
    const dirX = Math.sign(HALF_W - sp.x), dirY = Math.sign(HALF_W - sp.y);
    const hq = {
      id: nextId++, kind: 'hq', owner: p.id, team: p.team,
      x: sp.x, y: sp.y, hp: BUILDINGS.hq.hp, maxHp: BUILDINGS.hq.hp,
      radius: BUILDINGS.hq.radius, cd: 0, aimA: Math.atan2(dirY, dirX),
      constructing: false, buildProg: 1, queue: [], qTimer: 0, qTotal: 0,
      rallyX: sp.x + dirX * 115, rallyY: sp.y + dirY * 115,
    };
    buildings.push(hq);

    const baseMinerals = MINERAL_NODES.filter((m) => hypot(m.x, m.y, sp.x, sp.y) < 220);
    for (let k = 0; k < 6; k++) {
      const mNode = baseMinerals[k % baseMinerals.length];
      const ang = Math.atan2((mNode ? mNode.y : sp.y) - sp.y, (mNode ? mNode.x : sp.x) - sp.x);
      units.push({
        id: nextId++, kind: 'scv', owner: p.id, team: p.team,
        x: Math.round(sp.x + Math.cos(ang) * 66 + (k - 2.5) * 14),
        y: Math.round(sp.y + Math.sin(ang) * 66 + (k - 2.5) * 14),
        vx: 0, vy: 0, a: ang,
        hp: UNITS.scv.hp, maxHp: UNITS.scv.hp, radius: UNITS.scv.radius,
        cd: 0, mode: 'harvest_min',
        harvestId: mNode ? mNode.id : null,
        gatherT: 0, carryType: null, carryAmt: 0,
        buildTargetId: null, orderX: null, orderY: null, targetEntId: null,
        stimT: 0, sieged: false,
      });
    }

    for (let k = 0; k < 2; k++) {
      units.push({
        id: nextId++, kind: 'marine', owner: p.id, team: p.team,
        x: sp.x + dirX * (95 + k * 22), y: sp.y + dirY * (75 - k * 20),
        vx: 0, vy: 0, a: Math.atan2(dirY, dirX),
        hp: UNITS.marine.hp, maxHp: UNITS.marine.hp, radius: UNITS.marine.radius,
        cd: 0, mode: 'idle', orderX: null, orderY: null, targetEntId: null,
        stimT: 0, sieged: false,
      });
    }
  });

  return {
    time: 0,
    blitz,
    mode: is2v2 ? '2v2' : 'ffa',
    level: settings.level || 'normal',
    phase: 1,
    stormRadius: HALF_W * 1.45,
    dmgMult: 1.0,
    nextId,
    players,
    buildings,
    units,
    scans: [],
    over: false,
    winnerTeam: null,
    ranking: [],
  };
}

/* ============================================================================
   EXÉCUTION DES COMMANDES RTS (SERVEUR AUTORITAIRE / HÔTE)
   ============================================================================ */
function spawnTrainedUnit(state, owner, bld, kind, fxEvents) {
  const def = UNITS[kind];
  if (!def) return;
  const rx = bld.rallyX ?? (bld.x + Math.sign(HALF_W - bld.x) * 110);
  const ry = bld.rallyY ?? (bld.y + Math.sign(HALF_W - bld.y) * 110);
  const angle = Math.atan2(ry - bld.y, rx - bld.x);
  const jitter = (Math.random() - 0.5) * 32;
  const ux = clamp(bld.x + Math.cos(angle) * (bld.radius + def.radius + 10) - Math.sin(angle) * jitter, 30, WORLD_SIZE - 30);
  const uy = clamp(bld.y + Math.sin(angle) * (bld.radius + def.radius + 10) + Math.cos(angle) * jitter, 30, WORLD_SIZE - 30);

  const u = {
    id: state.nextId++,
    kind,
    owner: owner.id,
    team: owner.team,
    x: ux,
    y: uy,
    vx: 0,
    vy: 0,
    a: angle,
    hp: def.hp,
    maxHp: def.hp,
    radius: def.radius,
    cd: 0,
    mode: 'amove',
    orderX: rx + (Math.random() - 0.5) * 28,
    orderY: ry + (Math.random() - 0.5) * 28,
    targetEntId: null,
    harvestId: null,
    gatherT: 0,
    carryType: null,
    carryAmt: 0,
    buildTargetId: null,
    stimT: 0,
    sieged: false,
  };

  if (kind === 'scv') {
    const m = nearestMineral(rx, ry, 260) || nearestMineral(bld.x, bld.y, 350);
    if (m) {
      u.mode = 'harvest_min';
      u.harvestId = m.id;
      u.orderX = null;
      u.orderY = null;
    }
  }
  state.units.push(u);
  fxEvents.push({ k: 'SPAWN', x: ux, y: uy, color: owner.color });
}

function executeCommand(state, playerId, cmd, fxEvents) {
  if (state.over || !cmd || typeof cmd !== 'object') return { ok: false };
  const p = state.players.find((q) => q.id === playerId);
  if (!p || p.dead) return { ok: false };

  // 1. POSER UN CHANTIER DE CONSTRUCTION (exige un Ouvrier VCS qui se déplace sur place !)
  if (cmd.op === 'BUILD') {
    const kind = String(cmd.kind || '');
    const check = canPlaceBuilding(state, p.id, kind, Number(cmd.x) || 0, Number(cmd.y) || 0);
    if (!check.ok) return check;

    const bx = check.snapX, by = check.snapY;
    let builder = null;
    if (Array.isArray(cmd.unitIds) && cmd.unitIds.length) {
      const candidates = state.units.filter((u) => u.owner === p.id && u.kind === 'scv' && u.hp > 0 && cmd.unitIds.includes(u.id));
      if (candidates.length) {
        // Choisit le VCS sélectionné le plus proche (en privilégiant ceux qui ne construisent pas déjà)
        candidates.sort((a, b) => {
          const pa = a.mode === 'build' ? 1e7 : 0;
          const pb = b.mode === 'build' ? 1e7 : 0;
          return (dist2(a.x, a.y, bx, by) + pa) - (dist2(b.x, b.y, bx, by) + pb);
        });
        builder = candidates[0];
      }
    }
    if (!builder && p.bot) {
      let bestD2 = Infinity;
      for (const u of state.units) {
        if (u.owner === p.id && u.kind === 'scv' && u.hp > 0 && u.mode !== 'build') {
          const d2 = dist2(u.x, u.y, bx, by);
          if (d2 < bestD2) { bestD2 = d2; builder = u; }
        }
      }
    }
    if (!builder) {
      return { ok: false, reason: 'Sélectionne d’abord un Ouvrier VCS pour construire !' };
    }

    const def = BUILDINGS[kind];
    p.minerals -= def.min;
    p.gas -= def.gas;
    const bld = {
      id: state.nextId++,
      kind,
      owner: p.id,
      team: p.team,
      x: bx,
      y: by,
      hp: Math.round(def.hp * 0.15),
      maxHp: def.hp,
      radius: def.radius,
      cd: 0,
      aimA: Math.atan2(HALF_W - by, HALF_W - bx),
      constructing: true,
      buildStarted: false,
      buildProg: 0,
      buildTime: state.blitz ? def.buildTime * 0.65 : def.buildTime,
      queue: [],
      qTimer: 0,
      qTotal: 0,
      rallyX: bx + Math.sign(HALF_W - bx) * 115,
      rallyY: by + Math.sign(HALF_W - by) * 115,
      geyserId: check.geyserId || null,
    };
    state.buildings.push(bld);
    p.score += Math.round((def.min + def.gas) * 0.35);

    builder.mode = 'build';
    builder.buildTargetId = bld.id;
    builder.onSite = false;
    builder.weldTimer = 0;
    builder.weldX = bx;
    builder.weldY = by;
    builder.orderX = bx;
    builder.orderY = by;
    fxEvents.push({ k: 'BUILD', x: bx, y: by, color: p.color, radius: def.radius });
    return { ok: true, bldId: bld.id };
  }

  // 2. ENTRAÎNER UNE UNITÉ DANS UN BÂTIMENT SÉLECTIONNÉ
  if (cmd.op === 'TRAIN') {
    const uKind = String(cmd.unit || '');
    const uDef = UNITS[uKind];
    if (!uDef) return { ok: false, reason: 'Unité inconnue.' };
    const sup = computeSupply(state, p.id);
    if (sup.used + uDef.supply > sup.max) {
      return { ok: false, reason: 'Ravitaillement insuffisant 📦 ! Clique sur un VCS et construis un Dépôt Relais.' };
    }
    if (p.minerals < uDef.min) return { ok: false, reason: `Minéraux insuffisants (${uDef.min}💎).` };
    if (p.gas < uDef.gas) return { ok: false, reason: `Gaz Plasma insuffisant (${uDef.gas}🧪).` };

    let producer = null;
    if (cmd.bldId) {
      const b = state.buildings.find((x) => x.id === cmd.bldId && x.owner === p.id && x.hp > 0 && !x.constructing);
      if (b && (BUILDINGS[b.kind]?.trains || []).includes(uKind) && b.queue.length < 5) {
        producer = b;
      }
    } else if (p.bot) {
      const candidates = state.buildings.filter((b) =>
        b.owner === p.id && b.hp > 0 && !b.constructing && (BUILDINGS[b.kind]?.trains || []).includes(uKind) && b.queue.length < 5
      );
      candidates.sort((a, b) => a.queue.length - b.queue.length);
      producer = candidates[0] || null;
    }

    if (!producer) {
      return { ok: false, reason: 'Clique sur le bâtiment de production correspondant (ou file pleine 5/5).' };
    }
    p.minerals -= uDef.min;
    p.gas -= uDef.gas;
    producer.queue.push(uKind);
    if (producer.queue.length === 1) {
      producer.qTotal = state.blitz ? uDef.trainTime * 0.65 : uDef.trainTime;
      producer.qTimer = producer.qTotal;
    }
    p.score += Math.round((uDef.min + uDef.gas) * 0.25);
    return { ok: true };
  }

  // 3. ANNULER UNE UNITÉ DE LA FILE DE PRODUCTION
  if (cmd.op === 'CANCEL_QUEUE') {
    const bld = state.buildings.find((b) => b.owner === p.id && b.id === cmd.bldId);
    if (!bld || !Array.isArray(bld.queue) || !bld.queue.length) return { ok: false };
    const idx = clamp(Number(cmd.slot) || 0, 0, bld.queue.length - 1);
    const uKind = bld.queue.splice(idx, 1)[0];
    const uDef = UNITS[uKind];
    if (uDef) {
      p.minerals += uDef.min;
      p.gas += uDef.gas;
    }
    if (idx === 0) {
      if (bld.queue.length > 0) {
        const nextDef = UNITS[bld.queue[0]];
        bld.qTotal = state.blitz ? nextDef.trainTime * 0.65 : nextDef.trainTime;
        bld.qTimer = bld.qTotal;
      } else {
        bld.qTimer = 0;
        bld.qTotal = 0;
      }
    }
    return { ok: true };
  }

  // 4. ORDRES D'UNITÉS : MOVE, AMOVE, STOP, HOLD, HARVEST, REPAIR, RALLY
  if (cmd.op === 'UNIT_ORDER') {
    const mode = String(cmd.mode || 'amove');
    const x = clamp(Math.round(Number(cmd.x) || HALF_W), 35, WORLD_SIZE - 35);
    const y = clamp(Math.round(Number(cmd.y) || HALF_W), 35, WORLD_SIZE - 35);
    const ids = Array.isArray(cmd.unitIds) ? new Set(cmd.unitIds) : new Set();

    if (Array.isArray(cmd.bldIds) && cmd.bldIds.length) {
      for (const b of state.buildings) {
        if (b.owner === p.id && cmd.bldIds.includes(b.id)) {
          b.rallyX = x;
          b.rallyY = y;
        }
      }
    }

    const mySelected = state.units.filter((u) => u.owner === p.id && ids.has(u.id));
    const count = mySelected.length;
    const cols = Math.max(1, Math.ceil(Math.sqrt(count)));

    mySelected.forEach((u, idx) => {
      if (mode === 'stop') {
        u.mode = 'idle'; u.orderX = null; u.orderY = null; u.targetEntId = null; u.buildTargetId = null; u.onSite = false;
        return;
      }
      if (mode === 'hold') {
        u.mode = 'hold'; u.orderX = null; u.orderY = null; u.targetEntId = null; u.buildTargetId = null; u.onSite = false;
        return;
      }
      if (mode === 'harvest_min' && u.kind === 'scv') {
        u.mode = 'harvest_min';
        u.harvestId = cmd.resId || (nearestMineral(x, y)?.id ?? null);
        u.buildTargetId = null;
        u.onSite = false;
        return;
      }
      if (mode === 'harvest_gas' && u.kind === 'scv') {
        u.mode = 'harvest_gas';
        u.harvestId = cmd.resId || null;
        u.buildTargetId = null;
        u.onSite = false;
        return;
      }
      if (mode === 'build' && u.kind === 'scv' && cmd.targetId) {
        u.mode = 'build';
        u.buildTargetId = cmd.targetId;
        u.onSite = false;
        u.weldTimer = 0;
        const tb = state.buildings.find((b) => b.id === cmd.targetId);
        if (tb) { u.orderX = tb.x; u.orderY = tb.y; u.weldX = tb.x; u.weldY = tb.y; }
        return;
      }

      const row = Math.floor(idx / cols), col = idx % cols;
      const spacing = u.radius * 2.5 + 6;
      const fx = clamp(x + (col - (cols - 1) / 2) * spacing, 30, WORLD_SIZE - 30);
      const fy = clamp(y + (row - (Math.ceil(count / cols) - 1) / 2) * spacing, 30, WORLD_SIZE - 30);

      u.buildTargetId = null;
      u.onSite = false;
      if (mode === 'focus' && cmd.targetId) {
        u.mode = 'focus'; u.targetEntId = cmd.targetId; u.orderX = x; u.orderY = y;
      } else if (mode === 'move') {
        u.mode = 'move'; u.targetEntId = null; u.orderX = fx; u.orderY = fy;
      } else {
        u.mode = 'amove'; u.targetEntId = null; u.orderX = fx; u.orderY = fy;
      }
    });
    return { ok: true };
  }

  // 5. CAPACITÉ MICRO : STIMPACK (T)
  if (cmd.op === 'STIM') {
    const ids = new Set(Array.isArray(cmd.unitIds) ? cmd.unitIds : []);
    let count = 0;
    for (const u of state.units) {
      if (u.owner === p.id && ids.has(u.id) && UNITS[u.kind]?.canStim && u.hp > 20) {
        u.hp = Math.max(10, u.hp - 18);
        u.stimT = 8.0;
        count++;
        fxEvents.push({ k: 'STIM', x: u.x, y: u.y, color: '#ff4b2b' });
      }
    }
    return count > 0 ? { ok: true } : { ok: false, reason: 'Aucun Marine ou Maraudeur en état d’utiliser Stimpack.' };
  }

  // 6. CAPACITÉ MICRO : MODE SIÈGE (E)
  if (cmd.op === 'SIEGE') {
    const ids = new Set(Array.isArray(cmd.unitIds) ? cmd.unitIds : []);
    let count = 0;
    for (const u of state.units) {
      if (u.owner === p.id && ids.has(u.id) && UNITS[u.kind]?.canSiege) {
        u.sieged = !u.sieged;
        u.cd = Math.max(u.cd, 1.0);
        count++;
        fxEvents.push({ k: 'SIEGE', x: u.x, y: u.y, sieged: u.sieged });
      }
    }
    return count > 0 ? { ok: true } : { ok: false, reason: 'Sélectionne un Char de Siège.' };
  }

  // 7. CAPACITÉ COMSAT DU QG : SCAN RADAR (X - 50 Minéraux)
  if (cmd.op === 'SCAN') {
    if (p.minerals < 50) return { ok: false, reason: '50💎 requis pour lancer un Scan Radar.' };
    p.minerals -= 50;
    const x = clamp(Math.round(Number(cmd.x) || HALF_W), 60, WORLD_SIZE - 60);
    const y = clamp(Math.round(Number(cmd.y) || HALF_W), 60, WORLD_SIZE - 60);
    state.scans.push({ x, y, team: p.team, r: 380, timer: 10.0 });
    fxEvents.push({ k: 'SCAN', x, y, color: '#1fc7c1' });
    return { ok: true };
  }

  return { ok: false };
}

/* ============================================================================
   SIMULATION DU MONDE TEMPS RÉEL (20 HZ)
   ============================================================================ */
function finishBuildingConstruction(state, b, owner, fxEvents) {
  b.constructing = false;
  b.buildStarted = true;
  b.buildProg = 1;
  b.hp = b.maxHp;
  fxEvents.push({ k: 'COMPLETE', x: b.x, y: b.y, color: owner ? owner.color : '#ffc531', kind: b.kind });
  for (const u of state.units) {
    if (u.kind === 'scv' && u.buildTargetId === b.id) {
      // Le VCS sort proprement du périmètre du bâtiment achevé
      const ang = Math.atan2(u.y - b.y, u.x - b.x) || 0.6;
      const outDist = b.radius + u.radius + 6;
      u.x = clamp(b.x + Math.cos(ang) * outDist, 26, WORLD_SIZE - 26);
      u.y = clamp(b.y + Math.sin(ang) * outDist, 26, WORLD_SIZE - 26);
      u.onSite = false;
      u.buildTargetId = null;
      if (b.kind === 'extractor') {
        u.mode = 'harvest_gas';
        u.harvestId = b.id;
      } else {
        u.mode = 'harvest_min';
        u.harvestId = nearestMineral(u.x, u.y, 500)?.id ?? null;
      }
    }
  }
}

function stepWorld(state, dt, fxEvents) {
  if (state.over) return;
  state.time += dt;

  const t = state.time;
  const p2At = state.blitz ? 120 : 210;
  const p3At = state.blitz ? 360 : 720;
  const sdAt = state.blitz ? 600 : 1350;
  const newPhase = t >= sdAt ? 4 : t >= p3At ? 3 : t >= p2At ? 2 : 1;
  if (newPhase !== state.phase) {
    state.phase = newPhase;
    fxEvents.push({ k: 'PHASE', phase: newPhase });
  }
  state.dmgMult = state.phase === 4 ? 1.85 : state.phase === 3 ? 1.2 : 1.0;

  if (state.phase === 4) {
    state.stormRadius = Math.max(380, state.stormRadius - (state.blitz ? 16 : 9) * dt);
  }

  for (let i = state.scans.length - 1; i >= 0; i--) {
    state.scans[i].timer -= dt;
    if (state.scans[i].timer <= 0) state.scans.splice(i, 1);
  }

  for (const p of state.players) {
    if (p.dead) continue;
    p.minerals = Math.min(9999, p.minerals + 2.5 * dt);
    const myRefs = state.buildings.filter((b) => b.owner === p.id && b.kind === 'extractor' && b.hp > 0 && !b.constructing).length;
    if (myRefs > 0) p.gas = Math.min(9999, p.gas + myRefs * 2.2 * dt);
  }

  for (const b of state.buildings) {
    if (b.hp <= 0) continue;
    const owner = state.players.find((p) => p.id === b.owner);
    if (!owner || owner.dead) { b.hp = 0; continue; }
    const def = BUILDINGS[b.kind];

    if (state.phase === 4 && hypot(b.x, b.y, HALF_W, HALF_W) > state.stormRadius) {
      b.hp -= 35 * dt;
    }

    // Important : Un chantier en construction NE PROGRESSE PAS tout seul !
    // Il exige qu'un Ouvrier VCS soit physiquement SUR l'emplacement de construction.
    if (b.constructing) {
      if (b.buildProg >= 1) {
        finishBuildingConstruction(state, b, owner, fxEvents);
      }
      continue;
    }

    if (def.heal) {
      const r2 = def.range * def.range;
      for (const u of state.units) {
        if (u.team === b.team && u.hp < u.maxHp && dist2(b.x, b.y, u.x, u.y) <= r2) {
          u.hp = Math.min(u.maxHp, u.hp + def.heal * dt);
        }
      }
    }

    if (Array.isArray(b.queue) && b.queue.length > 0) {
      b.qTimer -= dt;
      if (b.qTimer <= 0) {
        const uKind = b.queue.shift();
        spawnTrainedUnit(state, owner, b, uKind, fxEvents);
        if (b.queue.length > 0) {
          const nextDef = UNITS[b.queue[0]];
          b.qTotal = state.blitz ? nextDef.trainTime * 0.65 : nextDef.trainTime;
          b.qTimer = b.qTotal;
        } else {
          b.qTimer = 0;
          b.qTotal = 0;
        }
      }
    }

    if (def.range > 0 && def.dmg > 0) {
      b.cd = Math.max(0, (b.cd || 0) - dt);
      if (b.cd <= 0) {
        let target = null, bestD2 = def.range * def.range;
        for (const u of state.units) {
          if (u.team !== b.team && u.hp > 0) {
            const d2 = dist2(b.x, b.y, u.x, u.y);
            if (d2 <= bestD2) { bestD2 = d2; target = u; }
          }
        }
        if (target) {
          b.cd = def.rate;
          b.aimA = Math.atan2(target.y - b.y, target.x - b.x);
          const dmg = def.dmg * state.dmgMult;
          target.hp -= dmg;
          if (def.splash) {
            const s2 = def.splash * def.splash;
            for (const u2 of state.units) {
              if (u2 !== target && u2.team !== b.team && dist2(target.x, target.y, u2.x, u2.y) <= s2) {
                u2.hp -= dmg * 0.6;
              }
            }
          }
          fxEvents.push({
            k: b.kind === 'tesla' ? 'TESLA' : 'SHOT',
            x1: b.x, y1: b.y - 16, x2: target.x, y2: target.y, color: owner.color,
          });
        }
      }
    }
  }

  for (const u of state.units) {
    if (u.hp <= 0) continue;
    const def = UNITS[u.kind];
    const owner = state.players.find((p) => p.id === u.owner);
    if (!owner || owner.dead) { u.hp = 0; continue; }

    if (u.stimT > 0) u.stimT = Math.max(0, u.stimT - dt);
    const stimMult = u.stimT > 0 ? 1.48 : 1.0;
    u.cd = Math.max(0, u.cd - dt * stimMult);

    if (u.kind === 'scv') {
      if (u.mode === 'build' && u.buildTargetId) {
        const bld = state.buildings.find((b) => b.id === u.buildTargetId && b.hp > 0);
        if (!bld) {
          u.mode = 'harvest_min';
          u.buildTargetId = null;
          u.onSite = false;
          const m = nearestMineral(u.x, u.y, 400);
          u.harvestId = m ? m.id : null;
        } else if (bld.constructing) {
          // CONSTRUCTION FAÇON STARCRAFT : Le VCS doit être PHYSIQUEMENT SUR l'endroit de construction !
          const distCenter = hypot(u.x, u.y, bld.x, bld.y);
          const siteRadius = Math.max(16, bld.radius * 0.72);
          if (distCenter <= siteRadius || u.onSite) {
            u.onSite = true;
            bld.buildStarted = true;

            // Le VCS se déplace d'un point de soudure à l'autre SUR la dalle du chantier
            u.weldTimer = (u.weldTimer || 0) - dt;
            if (u.weldTimer <= 0 || u.weldX == null || u.weldY == null) {
              u.weldTimer = 1.0 + Math.random() * 0.75;
              const wAng = Math.random() * TAU;
              const wR = bld.radius * (0.16 + Math.random() * 0.36);
              u.weldX = bld.x + Math.cos(wAng) * wR;
              u.weldY = bld.y + Math.sin(wAng) * wR;
            }
            const wx = u.weldX - u.x, wy = u.weldY - u.y;
            const wd = Math.hypot(wx, wy);
            if (wd > 3) {
              const stepSpd = Math.min(wd, def.speed * 0.55 * dt);
              u.vx = (wx / wd) * (def.speed * 0.55);
              u.vy = (wy / wd) * (def.speed * 0.55);
              u.x += (wx / wd) * stepSpd;
              u.y += (wy / wd) * stepSpd;
            } else {
              u.vx = 0; u.vy = 0;
            }
            // Oriente le chalumeau du VCS vers le cœur de la structure sur le chantier
            u.a = Math.atan2(bld.y - u.y, bld.x - u.x);

            const step = (1.0 / (bld.buildTime || 8)) * dt;
            bld.buildProg += step;
            bld.hp = Math.min(bld.maxHp, bld.hp + bld.maxHp * 0.85 * step);
            if (Math.random() < 0.48) {
              fxEvents.push({ k: 'SPARK', x: u.x + Math.cos(u.a) * 14, y: u.y + Math.sin(u.a) * 14, color: '#ffc531' });
            }
            if (bld.buildProg >= 1) {
              finishBuildingConstruction(state, bld, owner, fxEvents);
            }
            continue;
          } else {
            // En route vers le centre du chantier de construction
            u.orderX = bld.x;
            u.orderY = bld.y;
          }
        } else {
          // Réparation d'un bâtiment déjà construit
          u.onSite = false;
          const d = hypot(u.x, u.y, bld.x, bld.y) - bld.radius - u.radius;
          if (d <= 18) {
            u.a = Math.atan2(bld.y - u.y, bld.x - u.x);
            u.vx = 0; u.vy = 0;
            if (bld.hp < bld.maxHp && owner.minerals >= 1) {
              bld.hp = Math.min(bld.maxHp, bld.hp + 45 * dt);
              owner.minerals = Math.max(0, owner.minerals - 3 * dt);
              if (Math.random() < 0.35) fxEvents.push({ k: 'SPARK', x: u.x + Math.cos(u.a) * 14, y: u.y + Math.sin(u.a) * 14, color: '#ffc531' });
            } else {
              u.mode = bld.kind === 'extractor' ? 'harvest_gas' : 'harvest_min';
              u.harvestId = bld.kind === 'extractor' ? bld.id : (nearestMineral(u.x, u.y, 500)?.id ?? null);
              u.buildTargetId = null;
            }
            continue;
          } else {
            u.orderX = bld.x;
            u.orderY = bld.y;
          }
        }
      }

      if (u.mode === 'harvest_min' || u.mode === 'harvest_gas') {
        u.onSite = false;
        const hq = nearestMyHq(state, u.owner, u.x, u.y);
        if (u.carryAmt > 0 && hq) {
          const dHq = hypot(u.x, u.y, hq.x, hq.y) - hq.radius - u.radius;
          if (dHq <= 18) {
            if (u.carryType === 'gas') owner.gas = Math.min(9999, owner.gas + u.carryAmt);
            else owner.minerals = Math.min(9999, owner.minerals + u.carryAmt);
            owner.score += 2;
            u.carryAmt = 0;
            u.carryType = null;
            continue;
          } else {
            u.orderX = hq.x;
            u.orderY = hq.y;
          }
        } else if (u.mode === 'harvest_min') {
          let mNode = MINERAL_NODES.find((m) => m.id === u.harvestId) || nearestMineral(u.x, u.y);
          if (mNode) {
            u.harvestId = mNode.id;
            const dM = hypot(u.x, u.y, mNode.x, mNode.y) - 22 - u.radius;
            if (dM <= 16) {
              u.a = Math.atan2(mNode.y - u.y, mNode.x - u.x);
              u.vx = 0; u.vy = 0;
              u.gatherT = (u.gatherT || 0) + dt;
              if (Math.random() < 0.25) fxEvents.push({ k: 'MINE', x: mNode.x, y: mNode.y, color: mNode.rich ? '#ffc531' : '#1fc7c1' });
              if (u.gatherT >= 1.55) {
                u.gatherT = 0;
                u.carryType = mNode.rich ? 'gold' : 'min';
                u.carryAmt = mNode.rich ? 12 : 8;
              }
              continue;
            } else {
              u.orderX = mNode.x;
              u.orderY = mNode.y;
            }
          }
        } else if (u.mode === 'harvest_gas') {
          const ref = state.buildings.find((b) => b.id === u.harvestId && b.owner === u.owner && b.kind === 'extractor' && b.hp > 0 && !b.constructing)
            || state.buildings.find((b) => b.owner === u.owner && b.kind === 'extractor' && b.hp > 0 && !b.constructing);
          if (ref) {
            u.harvestId = ref.id;
            const dR = hypot(u.x, u.y, ref.x, ref.y) - ref.radius - u.radius;
            if (dR <= 16) {
              u.a = Math.atan2(ref.y - u.y, ref.x - u.x);
              u.vx = 0; u.vy = 0;
              u.gatherT = (u.gatherT || 0) + dt;
              if (u.gatherT >= 1.7) {
                u.gatherT = 0;
                u.carryType = 'gas';
                u.carryAmt = 6;
              }
              continue;
            } else {
              u.orderX = ref.x;
              u.orderY = ref.y;
            }
          } else {
            u.mode = 'harvest_min';
          }
        }
      }
    }

    const effRange = u.sieged && def.siegeRange ? def.siegeRange : def.range;
    const effDmg = u.sieged && def.siegeDmg ? def.siegeDmg : def.dmg;
    const effRate = u.sieged && def.siegeRate ? def.siegeRate : def.rate;

    let bestTarget = null, bestScore = Infinity;
    if (u.mode !== 'move' && u.mode !== 'harvest_min' && u.mode !== 'harvest_gas' && u.mode !== 'build') {
      const aggroR = u.sieged || u.mode === 'hold' ? effRange : Math.max(255, effRange + 65);

      if (u.mode === 'focus' && u.targetEntId) {
        const fUnit = state.units.find((e) => e.id === u.targetEntId && e.hp > 0);
        const fBld = fUnit ? null : state.buildings.find((b) => b.id === u.targetEntId && b.hp > 0);
        const ent = fUnit || fBld;
        if (ent && ent.team !== u.team) {
          const d = hypot(u.x, u.y, ent.x, ent.y) - ent.radius;
          bestTarget = { ent, isBld: !!fBld, dist: d };
        } else {
          u.mode = 'amove';
          u.targetEntId = null;
        }
      }

      if (!bestTarget) {
        for (const e of state.units) {
          if (e.team === u.team || e.hp <= 0) continue;
          const d = hypot(u.x, u.y, e.x, e.y) - e.radius;
          if (d <= aggroR) {
            const prio = e.kind === 'scv' ? 35 : 0;
            if (d + prio < bestScore) { bestScore = d + prio; bestTarget = { ent: e, isBld: false, dist: d }; }
          }
        }
        for (const b of state.buildings) {
          if (b.team === u.team || b.hp <= 0) continue;
          const d = hypot(u.x, u.y, b.x, b.y) - b.radius;
          if (d <= aggroR + 30) {
            const prio = b.kind === 'wall' ? (u.kind === 'sapper' ? -20 : 60) : (u.kind === 'sapper' ? -45 : 20);
            if (d + prio < bestScore) { bestScore = d + prio; bestTarget = { ent: b, isBld: true, dist: d }; }
          }
        }
      }
    }

    if (bestTarget && bestTarget.dist <= effRange) {
      const tgt = bestTarget.ent;
      u.a = Math.atan2(tgt.y - u.y, tgt.x - u.x);
      u.vx *= 0.4;
      u.vy *= 0.4;
      if (u.cd <= 0) {
        u.cd = effRate;
        let dmg = effDmg * state.dmgMult;
        if (bestTarget.isBld) dmg *= def.bldMult || 1;
        else if (u.kind === 'rocket' && UNITS[tgt.kind]?.mech) dmg *= 1.5;
        tgt.hp -= dmg;
        if (def.splash || u.sieged) {
          const splashR = def.splash || 58;
          const s2 = splashR * splashR;
          for (const e2 of state.units) {
            if (e2 !== tgt && e2.team !== u.team && dist2(tgt.x, tgt.y, e2.x, e2.y) <= s2) e2.hp -= dmg * 0.55;
          }
        }
        owner.score += Math.round(dmg * 0.12);
        fxEvents.push({
          k: u.sieged || u.kind === 'siege' || u.kind === 'titan' ? 'PLASMA' : u.kind === 'rocket' ? 'ROCKET' : 'SHOT',
          x1: u.x, y1: u.y, x2: tgt.x, y2: tgt.y, color: owner.color,
        });
      }
      continue;
    }

    if (u.sieged || u.mode === 'hold') {
      u.vx = 0; u.vy = 0;
      continue;
    }

    let goalX = u.orderX, goalY = u.orderY;
    if (bestTarget && u.mode !== 'move') {
      goalX = bestTarget.ent.x;
      goalY = bestTarget.ent.y;
    }
    if (goalX == null || goalY == null) continue;
    if (u.mode !== 'build' && dist2(u.x, u.y, goalX, goalY) <= 18 * 18) {
      if (u.mode === 'move' || u.mode === 'amove') {
        u.orderX = null;
        u.orderY = null;
        u.mode = 'idle';
      }
      u.vx = 0; u.vy = 0;
      continue;
    }

    const dx = goalX - u.x, dy = goalY - u.y;
    const distGoal = Math.hypot(dx, dy) || 1;
    let steerX = dx / distGoal, steerY = dy / distGoal;

    const lookAhead = u.radius + 32;
    const sideSign = (u.id % 2 === 0) ? 1 : -1;
    for (const b of state.buildings) {
      if (b.hp <= 0 || b.id === u.buildTargetId || b.id === u.harvestId) continue;
      if (b.constructing && !b.buildStarted) continue;
      if (u.kind === 'scv' && u.carryAmt > 0 && b.owner === u.owner && b.kind === 'hq') continue;
      const ox = b.x - u.x, oy = b.y - u.y;
      const d = Math.hypot(ox, oy) || 1;
      const minClear = u.radius + b.radius + 10;
      if (d < minClear + lookAhead) {
        const dot = (ox / d) * steerX + (oy / d) * steerY;
        if (dot > -0.2) {
          const tx = -oy / d * sideSign, ty = ox / d * sideSign;
          const push = ((minClear + lookAhead - d) / lookAhead) * 1.8;
          steerX += (tx - ox / d * 0.5) * push;
          steerY += (ty - oy / d * 0.5) * push;
        }
      }
    }
    for (const rk of ROCKS) {
      const ox = rk.x - u.x, oy = rk.y - u.y;
      const d = Math.hypot(ox, oy) || 1;
      const minClear = u.radius + rk.r + 10;
      if (d < minClear + lookAhead) {
        const tx = -oy / d * sideSign, ty = ox / d * sideSign;
        const push = ((minClear + lookAhead - d) / lookAhead) * 1.9;
        steerX += (tx - ox / d * 0.5) * push;
        steerY += (ty - oy / d * 0.5) * push;
      }
    }
    for (const o of state.units) {
      if (o === u || o.hp <= 0) continue;
      if (u.kind === 'scv' && o.kind === 'scv') continue;
      const sx = u.x - o.x, sy = u.y - o.y;
      const minSep = u.radius + o.radius + 4;
      const d2 = sx * sx + sy * sy;
      if (d2 > 0 && d2 < minSep * minSep) {
        const d = Math.sqrt(d2);
        const f = (minSep - d) / minSep;
        steerX += (sx / d) * f * 1.35;
        steerY += (sy / d) * f * 1.35;
      }
    }

    const sLen = Math.hypot(steerX, steerY) || 1;
    const spd = def.speed * stimMult;
    u.vx = (steerX / sLen) * spd;
    u.vy = (steerY / sLen) * spd;
    u.x = clamp(u.x + u.vx * dt, 24, WORLD_SIZE - 24);
    u.y = clamp(u.y + u.vy * dt, 24, WORLD_SIZE - 24);
    u.a = Math.atan2(u.vy, u.vx);

    for (const b of state.buildings) {
      if (b.hp <= 0) continue;
      // Le VCS qui construit ce chantier a le droit d'entrer SUR l'emplacement de construction !
      if (b.constructing && u.kind === 'scv' && u.buildTargetId === b.id) continue;
      if (b.constructing && !b.buildStarted) continue;
      const cx = u.x - b.x, cy = u.y - b.y;
      const minD = u.radius + b.radius + 2;
      const d2 = cx * cx + cy * cy;
      if (d2 < minD * minD) {
        const d = Math.sqrt(d2) || 1;
        u.x = b.x + (cx / d) * minD;
        u.y = b.y + (cy / d) * minD;
      }
    }
  }

  for (let i = state.units.length - 1; i >= 0; i--) {
    const u = state.units[i];
    if (u.hp <= 0) {
      fxEvents.push({ k: 'BOOM', x: u.x, y: u.y, r: u.radius * 1.5 });
      state.units.splice(i, 1);
    }
  }
  for (let i = state.buildings.length - 1; i >= 0; i--) {
    const b = state.buildings[i];
    if (b.hp <= 0) {
      fxEvents.push({ k: 'BOOM_BIG', x: b.x, y: b.y, r: b.radius * 1.8 });
      const ownerId = b.owner;
      state.buildings.splice(i, 1);
      const hasAnyHq = state.buildings.some((ob) => ob.owner === ownerId && ob.kind === 'hq' && ob.hp > 0);
      if (!hasAnyHq) {
        const p = state.players.find((q) => q.id === ownerId);
        if (p && !p.dead) {
          p.dead = true;
          state.ranking.unshift(p.id);
          for (const ob of state.buildings) if (ob.owner === ownerId) ob.hp = 0;
          for (const ou of state.units) if (ou.owner === ownerId) ou.hp = 0;
          fxEvents.push({ k: 'ELIM', name: p.name, color: p.color });
        }
      }
    }
  }

  const aliveTeams = new Set(state.players.filter((p) => !p.dead).map((p) => p.team));
  if (aliveTeams.size <= 1) {
    state.over = true;
    state.winnerTeam = [...aliveTeams][0] ?? 0;
    const winners = state.players.filter((p) => !p.dead).sort((a, b) => b.score - a.score);
    for (const w of winners) {
      w.score += 500;
      if (!state.ranking.includes(w.id)) state.ranking.unshift(w.id);
    }
    for (const p of state.players) {
      if (!state.ranking.includes(p.id)) state.ranking.push(p.id);
    }
  }
}

/* ============================================================================
   INTELLIGENCE ARTIFICIELLE DES BOTS (MACRO & MICRO STARCRAFT)
   ============================================================================ */
function runBots(state, fxEvents) {
  if (state.over) return;
  for (const p of state.players) {
    if (!p.bot || p.dead) continue;
    const myBlds = state.buildings.filter((b) => b.owner === p.id && b.hp > 0);
    const hq = myBlds.find((b) => b.kind === 'hq');
    if (!hq) continue;

    const myUnits = state.units.filter((u) => u.owner === p.id && u.hp > 0);
    const scvs = myUnits.filter((u) => u.kind === 'scv');
    const army = myUnits.filter((u) => u.kind !== 'scv');
    const sup = computeSupply(state, p.id);

    const refs = myBlds.filter((b) => b.kind === 'extractor').length;
    const rax = myBlds.filter((b) => b.kind === 'barracks').length;
    const fac = myBlds.filter((b) => b.kind === 'factory').length;
    const tur = myBlds.filter((b) => b.kind === 'turret' || b.kind === 'tesla').length;

    const dirX = Math.sign(HALF_W - hq.x) || 1;
    const dirY = Math.sign(HALF_W - hq.y) || 1;

    const tryBuildNear = (kind, ax, ay, minR = 75, maxR = 230) => {
      for (let k = 0; k < 16; k++) {
        const ang = Math.random() * TAU;
        const r = minR + Math.random() * (maxR - minR);
        const x = ax + Math.cos(ang) * r, y = ay + Math.sin(ang) * r;
        if (canPlaceBuilding(state, p.id, kind, x, y).ok) {
          return executeCommand(state, p.id, { op: 'BUILD', kind, x, y }, fxEvents).ok;
        }
      }
      return false;
    };

    // Si un chantier du bot n'a plus de VCS attitré, y envoyer un VCS libre
    for (const cb of myBlds) {
      if (cb.constructing && !scvs.some((u) => u.mode === 'build' && u.buildTargetId === cb.id)) {
        const freeBuilder = scvs.find((u) => u.mode !== 'build');
        if (freeBuilder) {
          freeBuilder.mode = 'build';
          freeBuilder.buildTargetId = cb.id;
          freeBuilder.onSite = false;
          freeBuilder.orderX = cb.x;
          freeBuilder.orderY = cb.y;
        }
      }
    }

    if (sup.max - sup.used <= 3 && sup.max < MAX_SUPPLY && p.minerals >= 75) {
      if (tryBuildNear('pylon', hq.x + dirX * 90, hq.y + dirY * 90, 65, 195)) return;
    }
    if (scvs.length < 11 && hq.queue.length < 2 && p.minerals >= 50) {
      executeCommand(state, p.id, { op: 'TRAIN', unit: 'scv', bldId: hq.id }, fxEvents);
    }
    if (refs < 1 && scvs.length >= 7 && p.minerals >= 75) {
      const gey = findGeyserAt(hq.x, hq.y, 260);
      if (gey) executeCommand(state, p.id, { op: 'BUILD', kind: 'extractor', x: gey.x, y: gey.y }, fxEvents);
    }
    const readyRef = myBlds.find((b) => b.kind === 'extractor' && !b.constructing);
    if (readyRef) {
      const gasScvs = scvs.filter((u) => u.mode === 'harvest_gas');
      if (gasScvs.length < 2) {
        const freeScv = scvs.find((u) => u.mode === 'harvest_min');
        if (freeScv) { freeScv.mode = 'harvest_gas'; freeScv.harvestId = readyRef.id; }
      }
    }

    if (rax < 1 && p.minerals >= 125) {
      if (tryBuildNear('barracks', hq.x + dirX * 135, hq.y + dirY * 45, 50, 140)) return;
    }
    if (rax >= 1 && fac < 1 && p.minerals >= 150 && p.gas >= 75) {
      if (tryBuildNear('factory', hq.x + dirX * 60, hq.y + dirY * 140, 55, 150)) return;
    }
    if (tur < 2 && rax >= 1 && p.minerals >= 125) {
      const tKind = p.gas >= 50 && Math.random() < 0.5 ? 'tesla' : 'turret';
      if (tryBuildNear(tKind, hq.x + dirX * 165, hq.y + dirY * 165, 35, 110)) return;
    }
    if (rax < 2 && fac >= 1 && p.minerals >= 180) {
      if (tryBuildNear('barracks', hq.x + dirX * 140, hq.y - dirY * 50, 55, 160)) return;
    }

    if (fac >= 1 && p.minerals >= 250 && p.gas >= 150) {
      executeCommand(state, p.id, { op: 'TRAIN', unit: 'titan' }, fxEvents);
    } else if (fac >= 1 && p.minerals >= 150 && p.gas >= 100 && Math.random() < 0.55) {
      executeCommand(state, p.id, { op: 'TRAIN', unit: 'siege' }, fxEvents);
    } else if (fac >= 1 && p.minerals >= 125 && p.gas >= 50) {
      executeCommand(state, p.id, { op: 'TRAIN', unit: 'tank' }, fxEvents);
    }
    if (rax >= 1 && p.minerals >= 75 && p.gas >= 25 && Math.random() < 0.6) {
      executeCommand(state, p.id, { op: 'TRAIN', unit: Math.random() < 0.65 ? 'rocket' : 'sapper' }, fxEvents);
    } else if (rax >= 1 && p.minerals >= 50) {
      executeCommand(state, p.id, { op: 'TRAIN', unit: 'marine' }, fxEvents);
    }

    const waveSize = state.level === 'expert' ? 6 : state.level === 'facile' ? 10 : 8;
    const idleArmy = army.filter((u) => u.mode === 'idle' || hypot(u.x, u.y, hq.x, hq.y) < 260);
    if (idleArmy.length >= waveSize) {
      const enemyBld = state.buildings.find((b) => b.team !== p.team && b.kind === 'hq' && b.hp > 0)
        || state.buildings.find((b) => b.team !== p.team && b.hp > 0);
      if (enemyBld) {
        executeCommand(state, p.id, {
          op: 'UNIT_ORDER',
          mode: 'amove',
          x: enemyBld.x,
          y: enemyBld.y,
          unitIds: idleArmy.map((u) => u.id),
        }, fxEvents);
      }
    }
  }
}
