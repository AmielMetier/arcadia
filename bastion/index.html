      shockwaves.push({ x: e.x, y: e.y, r: 10, maxR: 52, color: e.color || '#ffc531', life: 0.28, maxLife: 0.28 });
      if (e.k === 'COMPLETE' && hypot(e.x, e.y, cam.x, cam.y) < 850) Sfx.spawn();
    } else if (e.k === 'ELIM') {
      toast(`💥 Le Centre de Commandement de ${e.name} a été détruit !`, 3500);
    } else if (e.k === 'TEAM_CHANGE') {
      toast(`🛡️ ${e.name} a rejoint l’Équipe ${e.team === 0 ? 'A' : 'B'} !`, 3000);
    } else if (e.k === 'PHASE') {
      const labels = {
        2: '💎 Phase 2 : Intensification des combats',
        3: '🤖 Phase 3 : Guerre Totale (Dégâts +20 %)',
        4: '🔥 MORT SUBITE : Tempête Magnétique & Dégâts ×1.85 !',
      };
      if (labels[e.phase]) toast(labels[e.phase], 3800);
    }
  }
}

let localCmdSeq = 0;
const pendingCmds = [];
const clientAckSeq = {};
const playerPings = {};

function getPlayerPing(p) {
  if (!p || p.bot) return 0;
  const fromLocal = playerPings[p.id];
  const fromHub = window.HubBridge && HubBridge.pings ? HubBridge.pings[p.id] : null;
  const val = fromLocal || fromHub || p.ping || (role === 'solo' ? 1 : 18);
  return Math.max(1, Math.round(val));
}

function sendCommand(cmd) {
  if (!state || state.over) return;
  const seq = ++localCmdSeq;
  if (cmd.op === 'BUILD' && !cmd.bldId) {
    cmd.bldId = (Number(myId) + 1) * 100000 + seq;
  }
  const fx = [];
  const res = executeCommand(state, myId, cmd, fx);
  if (!res.ok && res.reason) {
    toast(res.reason, 2000);
    Sfx.error();
    return;
  }
  if (res.ok) {
    if (cmd.op === 'BUILD') Sfx.build();
    else if (cmd.op === 'TRAIN') Sfx.spawn();
    else if (cmd.op === 'STIM') Sfx.stim();
    else if (cmd.op === 'SIEGE') Sfx.siege();
    else if (cmd.op === 'UNIT_ORDER') {
      if (cmd.mode === 'amove' || cmd.mode === 'focus') Sfx.attack();
      else Sfx.order();
    }
    handleFxEvents(fx);
    renderConsoleUI(true);

    if (window.HubBridge && HubBridge.embedded) {
      if (role === 'guest') {
        pendingCmds.push({ seq, cmd, ts: performance.now() });
        HubBridge.send('host', { t: 'cmd', cmd, seq });
      } else if (role === 'host') {
        HubBridge.send('all', { t: 'rcmd', p: myId, cmd });
      }
    }
  }
}

function cleanSelection() {
  if (!state) return;
  const validU = new Set(state.units.filter((u) => Number(u.owner) === Number(myId) && u.hp > 0 && !u.boardedIn).map((u) => u.id));
  const validB = new Set(state.buildings.filter((b) => Number(b.owner) === Number(myId) && b.hp > 0).map((b) => b.id));
  for (const id of [...selectedUnits]) if (!validU.has(id)) selectedUnits.delete(id);
  for (const id of [...selectedBlds]) if (!validB.has(id)) selectedBlds.delete(id);

  // Si on était en train de poser un bâtiment mais qu'aucun VCS n'est sélectionné, on annule buildMode
  const hasScv = state.units.some((u) => selectedUnits.has(u.id) && u.kind === 'scv');
  if (buildMode && !hasScv) {
    buildMode = null;
    updateCursorClass();
  }
}

function selectIdleWorker() {
  if (!state) return;
  const idle = state.units.find((u) => u.owner === myId && u.kind === 'scv' && u.mode === 'idle')
    || state.units.find((u) => u.owner === myId && u.kind === 'scv');
  if (idle) {
    selectedUnits.clear(); selectedBlds.clear();
    selectedUnits.add(idle.id);
    cam.x = idle.x; cam.y = idle.y;
    Sfx.order();
    renderConsoleUI(true);
  }
}

function selectAllArmy() {
  if (!state) return;
  selectedUnits.clear(); selectedBlds.clear();
  buildMode = null; updateCursorClass();
  for (const u of state.units) {
    if (u.owner === myId && u.kind !== 'scv' && u.hp > 0 && !u.boardedIn) selectedUnits.add(u.id);
  }
  if (selectedUnits.size > 0) { Sfx.order(); renderConsoleUI(true); }
  else toast('Aucune unité de combat déployée.');
}

window.addEventListener('keydown', (e) => {
  if (e.target && e.target.tagName === 'INPUT') return;
  const k = e.key.toLowerCase();
  keys[k] = true;

  if (e.key === 'F1') { e.preventDefault(); selectIdleWorker(); return; }
  if (e.key === 'F2') { e.preventDefault(); selectAllArmy(); return; }

  if (k === 'escape') {
    buildMode = null; orderCursor = null;
    updateCursorClass(); renderConsoleUI(true);
    return;
  }
  if (k === ' ') { e.preventDefault(); centerOnMyHq(); return; }

  // PROTECTION ABSOLUE DE LA CAMÉRA : ZQSD, WASD et flèches ne doivent JAMAIS déclencher d'ordre !
  const CAMERA_KEYS = new Set(['z', 'q', 's', 'd', 'w', 'a', 'arrowup', 'arrowdown', 'arrowleft', 'arrowright']);
  if (CAMERA_KEYS.has(k)) return;

  cleanSelection();
  const selUList = state ? state.units.filter((u) => selectedUnits.has(u.id)) : [];
  const hasScvSelected = selUList.some((u) => u.kind === 'scv');

  // Si un Ouvrier VCS est sélectionné (sans Ctrl) : 1..9 et 0 choisit le bâtiment à construire !
  if (hasScvSelected && !e.ctrlKey && !e.metaKey && /^[0-9]$/.test(k)) {
    const bMap = {
      '1': 'pylon', '2': 'extractor', '3': 'barracks', '4': 'factory', '5': 'starport',
      '6': 'armory', '7': 'turret', '8': 'tesla', '9': 'wall', '0': 'hq'
    };
    if (bMap[k]) {
      orderCursor = null;
      buildMode = buildMode === bMap[k] ? null : bMap[k];
      updateCursorClass();
      renderConsoleUI(true);
      return;
    }
  }

  // Groupes de contrôle 1..9 (Ctrl+Num pour assigner, Num pour sélectionner / double-tap centrer)
  if (/^[1-9]$/.test(k)) {
    const g = Number(k);
    if (e.ctrlKey || e.metaKey) {
      e.preventDefault();
      controlGroups[g] = { units: [...selectedUnits], blds: [...selectedBlds] };
      toast(`Groupe de contrôle #${g} assigné`);
      renderConsoleUI(true);
      return;
    }
    const grp = controlGroups[g];
    if (grp && ((grp.units && grp.units.length) || (grp.blds && grp.blds.length))) {
      selectedUnits = new Set(grp.units || []);
      selectedBlds = new Set(grp.blds || []);
      cleanSelection();
      const now = performance.now();
      if (lastGroupTap.g === g && now - lastGroupTap.t < 350) {
        const firstU = state.units.find((u) => selectedUnits.has(u.id));
        const firstB = state.buildings.find((b) => selectedBlds.has(b.id));
        const ent = firstU || firstB;
        if (ent) { cam.x = ent.x; cam.y = ent.y; }
      }
      lastGroupTap = { g, t: now };
      renderConsoleUI(true);
    }
    return;
  }

  // Raccourcis avec touche maintenue : ne pas répéter les ordres si e.repeat
  if (e.repeat) return;

  // Raccourcis quand des UNITÉS sont sélectionnées : F = A-Move, X = Stop, H = Hold, C = Récolter (VCS), T = Stimpack, G = Siège, V = Débarquer
  if (selectedUnits.size > 0) {
    if (k === 'f') { buildMode = null; orderCursor = orderCursor === 'amove' ? null : 'amove'; updateCursorClass(); renderConsoleUI(true); return; }
    if (k === 'x') { sendCommand({ op: 'UNIT_ORDER', mode: 'stop', unitIds: [...selectedUnits] }); return; }
    if (k === 'h') { sendCommand({ op: 'UNIT_ORDER', mode: 'hold', unitIds: [...selectedUnits] }); return; }
    if (k === 'c' && hasScvSelected) { sendCommand({ op: 'UNIT_ORDER', mode: 'harvest_min', x: cam.x, y: cam.y, unitIds: [...selectedUnits] }); return; }
    if (k === 't') { sendCommand({ op: 'STIM', unitIds: [...selectedUnits] }); return; }
    if (k === 'g') { sendCommand({ op: 'SIEGE', unitIds: [...selectedUnits] }); return; }
    if (k === 'v') {
      for (const uId of selectedUnits) {
        const u = state.units.find((x) => x.id === uId);
        if (u && u.kind === 'dropship') sendCommand({ op: 'UNLOAD', dropshipId: u.id });
      }
      return;
    }
  }

  // Raccourcis quand un BÂTIMENT est sélectionné : E / R / T / Y entraînent les troupes, C = Scan Radar (si QG)
  if (selectedBlds.size > 0) {
    const firstB = state?.buildings.find((b) => selectedBlds.has(b.id));
    if (firstB && !firstB.constructing) {
      if (firstB.kind === 'hq' && k === 'c') {
        buildMode = null; orderCursor = orderCursor === 'scan' ? null : 'scan';
        updateCursorClass(); renderConsoleUI(true);
        return;
      }
      if (firstB.kind === 'armory') {
        const upgKeys = ['e', 'r', 't', 'y', 'u'];
        const upgIds = Object.keys(UPGRADES);
        const upgIdx = upgKeys.indexOf(k);
        if (upgIdx >= 0 && upgIds[upgIdx]) {
          sendCommand({ op: 'RESEARCH', upgId: upgIds[upgIdx], bldId: firstB.id });
          return;
        }
      }
      const trains = BUILDINGS[firstB.kind]?.trains || [];
      const keyIdx = { e: 0, r: 1, t: 2, y: 3 }[k];
      if (keyIdx !== undefined && trains[keyIdx]) {
        for (const bId of selectedBlds) {
          sendCommand({ op: 'TRAIN', unit: trains[keyIdx], bldId: bId });
        }
        return;
      }
    }
  }
});

function updateCursorClass() {
  cvs.classList.toggle('cur-attack', orderCursor === 'amove' || orderCursor === 'scan');
  cvs.classList.toggle('cur-build', !!buildMode);
}

cvs.addEventListener('wheel', (e) => {
  e.preventDefault();
  if (e.shiftKey) {
    cam.pitch = clamp((cam.pitch || 70) + (e.deltaY < 0 ? 2.5 : -2.5), 25, 82);
  } else {
    cam.z = clamp(cam.z * (e.deltaY < 0 ? 1.1 : 0.9), 0.44, 1.35);
  }
}, { passive: false });

function findEntityAt(wx, wy, sx = mouse.x, sy = mouse.y) {
  if (!state) return null;
  // Unités (teste l'empreinte au sol et le volume 3D projeté)
  for (const u of state.units) {
    if (u.hp <= 0 || u.boardedIn) continue;
    if (dist2(wx, wy, u.x, u.y) <= (u.radius + 14) ** 2) return { type: 'unit', ent: u };
    if (threeReady) {
      const hElev = u.flying ? 42 : (u.kind === 'titan' ? 22 : 12);
      const pt = worldToScreen3D(u.x, u.y, hElev);
      if (hypot(pt.x - sx, pt.y - sy) <= Math.max(u.radius * cam.z + 14, 20)) return { type: 'unit', ent: u };
    }
  }
  // Bâtiments
  for (const b of state.buildings) {
    if (b.hp <= 0) continue;
    if (dist2(wx, wy, b.x, b.y) <= (b.radius + 10) ** 2) return { type: 'bld', ent: b };
    if (threeReady) {
      const def = BUILDINGS[b.kind] || BUILDINGS.hq;
      const pt = worldToScreen3D(b.x, b.y, (def.height || 36) * 0.45);
      if (hypot(pt.x - sx, pt.y - sy) <= Math.max(b.radius * cam.z + 12, 26)) return { type: 'bld', ent: b };
    }
  }
  // Gisements de cristaux
  for (const m of MINERAL_NODES) {
    if (dist2(wx, wy, m.x, m.y) <= 30 * 30) return { type: 'min', ent: m };
    if (threeReady) {
      const pt = worldToScreen3D(m.x, m.y, 10);
      if (hypot(pt.x - sx, pt.y - sy) <= Math.max(26 * cam.z, 22)) return { type: 'min', ent: m };
    }
  }
  // Geysers de gaz
  for (const g of GAS_GEYSERS) {
    if (dist2(wx, wy, g.x, g.y) <= 34 * 34) return { type: 'gas', ent: g };
    if (threeReady) {
      const pt = worldToScreen3D(g.x, g.y, 12);
      if (hypot(pt.x - sx, pt.y - sy) <= Math.max(30 * cam.z, 26)) return { type: 'gas', ent: g };
    }
  }
  return null;
}

function issueSmartRightClick(wx, wy) {
  if (!state) return;
  cleanSelection();
  const hit = findEntityAt(wx, wy);
  const me = state.players.find((p) => p.id === myId);

  // Si un bâtiment de production est sélectionné -> Clic droit définit son Point de Ralliement
  if (selectedUnits.size === 0 && selectedBlds.size > 0) {
    sendCommand({ op: 'UNIT_ORDER', mode: 'rally', x: wx, y: wy, bldIds: [...selectedBlds] });
    orderMarkers.push({ x: wx, y: wy, color: '#ffc531', life: 0.45, maxLife: 0.45 });
    return;
  }

  // Si aucune unité n'est sélectionnée, le clic droit ne fait rien (comme dans StarCraft !)
  const unitIds = [...selectedUnits];
  if (!unitIds.length) return;

  const hasScvs = unitIds.some((id) => state.units.find((u) => u.id === id)?.kind === 'scv');

  if (hit) {
    if ((hit.type === 'unit' || hit.type === 'bld') && me && hit.ent.team !== me.team) {
      sendCommand({ op: 'UNIT_ORDER', mode: 'focus', targetId: hit.ent.id, x: hit.ent.x, y: hit.ent.y, unitIds });
      orderMarkers.push({ x: hit.ent.x, y: hit.ent.y, color: '#ff4b2b', life: 0.45, maxLife: 0.45 });
      return;
    }
    // Embarquement dans une Navette de Transport alliée
    if (hit.type === 'unit' && hit.ent.owner === myId && hit.ent.kind === 'dropship') {
      const groundUnits = unitIds.filter((id) => {
        const u = state.units.find((x) => x.id === id);
        return u && !u.flying && !u.boardedIn;
      });
      if (groundUnits.length > 0) {
        sendCommand({ op: 'BOARD', targetId: hit.ent.id, unitIds: groundUnits });
        orderMarkers.push({ x: hit.ent.x, y: hit.ent.y, color: '#3ecbff', life: 0.45, maxLife: 0.45 });
        return;
      }
    }
    if (hit.type === 'min' && hasScvs) {
      sendCommand({ op: 'UNIT_ORDER', mode: 'harvest_min', resId: hit.ent.id, x: hit.ent.x, y: hit.ent.y, unitIds });
      orderMarkers.push({ x: hit.ent.x, y: hit.ent.y, color: '#1fc7c1', life: 0.45, maxLife: 0.45 });
      return;
    }
    if (hit.type === 'bld' && hit.ent.owner === myId && hit.ent.kind === 'extractor' && !hit.ent.constructing && hasScvs) {
      sendCommand({ op: 'UNIT_ORDER', mode: 'harvest_gas', resId: hit.ent.id, x: hit.ent.x, y: hit.ent.y, unitIds });
      orderMarkers.push({ x: hit.ent.x, y: hit.ent.y, color: '#2fbf71', life: 0.45, maxLife: 0.45 });
      return;
    }
    if (hit.type === 'bld' && hit.ent.owner === myId && (hit.ent.constructing || hit.ent.hp < hit.ent.maxHp) && hasScvs) {
      sendCommand({ op: 'UNIT_ORDER', mode: 'build', targetId: hit.ent.id, x: hit.ent.x, y: hit.ent.y, unitIds });
      orderMarkers.push({ x: hit.ent.x, y: hit.ent.y, color: '#ffc531', life: 0.45, maxLife: 0.45 });
      return;
    }
  }

  sendCommand({ op: 'UNIT_ORDER', mode: 'move', x: wx, y: wy, unitIds });
  orderMarkers.push({ x: wx, y: wy, color: '#2fbf71', life: 0.42, maxLife: 0.42 });
}

cvs.addEventListener('pointerdown', (e) => {
  const rect = cvs.getBoundingClientRect();
  mouse.x = e.clientX - rect.left;
  mouse.y = e.clientY - rect.top;
  const w = screenToWorld(mouse.x, mouse.y);
  mouse.wx = w.x; mouse.wy = w.y;

  if (e.button === 1 || (e.button === 0 && e.altKey)) {
    mouse.panning = true;
    mouse.panStart = { x: e.clientX, y: e.clientY, cx: cam.x, cy: cam.y };
    return;
  }

  if (e.button === 2) {
    if (buildMode || orderCursor) {
      buildMode = null; orderCursor = null; updateCursorClass(); renderConsoleUI(true);
      return;
    }
    issueSmartRightClick(w.x, w.y);
    return;
  }

  if (e.button === 0) {
    if (orderCursor === 'scan') {
      sendCommand({ op: 'SCAN', x: w.x, y: w.y });
      orderCursor = null; updateCursorClass(); renderConsoleUI(true);
      return;
    }
    if (orderCursor === 'amove') {
      const unitIds = [...selectedUnits];
      if (unitIds.length) {
        sendCommand({ op: 'UNIT_ORDER', mode: 'amove', x: w.x, y: w.y, unitIds });
        orderMarkers.push({ x: w.x, y: w.y, color: '#ff4b2b', life: 0.45, maxLife: 0.45 });
      }
      orderCursor = null; updateCursorClass(); renderConsoleUI(true);
      return;
    }
    if (buildMode) {
      sendCommand({ op: 'BUILD', kind: buildMode, x: w.x, y: w.y, unitIds: [...selectedUnits] });
      if (buildMode !== 'wall' && !e.shiftKey) {
        buildMode = null;
        updateCursorClass();
        renderConsoleUI(true);
      }
      return;
    }
    mouse.down = true;
    mouse.dragStart = { sx: mouse.x, sy: mouse.y, wx: w.x, wy: w.y, shift: e.shiftKey, ctrl: e.ctrlKey };
  }
});

window.addEventListener('pointerenter', () => { mouse.inside = true; });
window.addEventListener('pointerleave', () => { mouse.inside = false; mouse.clientX = -999; mouse.clientY = -999; });

window.addEventListener('pointermove', (e) => {
  mouse.clientX = e.clientX;
  mouse.clientY = e.clientY;
  mouse.inside = true;
  const rect = cvs.getBoundingClientRect();
  mouse.x = e.clientX - rect.left;
  mouse.y = e.clientY - rect.top;
  const w = screenToWorld(mouse.x, mouse.y);
  mouse.wx = w.x; mouse.wy = w.y;

  if (mouse.panning && mouse.panStart) {
    const isoSin = Math.sin(((cam.pitch || 70) * Math.PI) / 180);
    cam.x = clamp(mouse.panStart.cx - (e.clientX - mouse.panStart.x) / cam.z, 0, WORLD_SIZE);
    cam.y = clamp(mouse.panStart.cy - (e.clientY - mouse.panStart.y) / (cam.z * isoSin), 0, WORLD_SIZE);
  }
});

window.addEventListener('pointerup', () => {
  if (mouse.panning) { mouse.panning = false; mouse.panStart = null; return; }
  if (!mouse.down) return;
  mouse.down = false;
  if (!state || !mouse.dragStart) return;

  const dx = Math.abs(mouse.x - mouse.dragStart.sx);
  const dy = Math.abs(mouse.y - mouse.dragStart.sy);
  if (!mouse.dragStart.shift) {
    selectedUnits.clear();
    selectedBlds.clear();
  }

  if (dx > 12 || dy > 12) {
    const x1 = Math.min(mouse.dragStart.wx, mouse.wx), x2 = Math.max(mouse.dragStart.wx, mouse.wx);
    const y1 = Math.min(mouse.dragStart.wy, mouse.wy), y2 = Math.max(mouse.dragStart.wy, mouse.wy);
    const boxed = state.units.filter((u) => u.owner === myId && u.hp > 0 && !u.boardedIn && u.x >= x1 && u.x <= x2 && u.y >= y1 && u.y <= y2);
    const combat = boxed.filter((u) => u.kind !== 'scv');
    const finalUnits = combat.length > 0 ? combat : boxed;
    for (const u of finalUnits) selectedUnits.add(u.id);
    if (selectedUnits.size === 0) {
      for (const b of state.buildings) {
        if (b.owner === myId && b.hp > 0 && b.x >= x1 && b.x <= x2 && b.y >= y1 && b.y <= y2) {
          selectedBlds.add(b.id);
        }
      }
    }
  } else {
    const hitU = state.units.find((u) => {
      if (u.owner !== myId || u.hp <= 0 || u.boardedIn) return false;
      if (dist2(u.x, u.y, mouse.wx, mouse.wy) <= (u.radius + 14) ** 2) return true;
      if (threeReady) {
        const hElev = u.flying ? 42 : (u.kind === 'titan' ? 22 : 12);
        const pt = worldToScreen3D(u.x, u.y, hElev);
        return hypot(pt.x - mouse.x, pt.y - mouse.y) <= Math.max(u.radius * cam.z + 14, 20);
      }
      return false;
    });
    if (hitU) {
      const now = performance.now();
      if (mouse.dragStart.ctrl || (lastClickUnit.id === hitU.id && now - lastClickUnit.t < 360)) {
        for (const u of state.units) {
          if (u.owner === myId && u.kind === hitU.kind && u.hp > 0 && !u.boardedIn && hypot(u.x, u.y, cam.x, cam.y) < 900) {
            selectedUnits.add(u.id);
          }
        }
      } else {
        selectedUnits.add(hitU.id);
      }
      lastClickUnit = { id: hitU.id, kind: hitU.kind, t: now };
    } else {
      const hitB = state.buildings.find((b) => {
        if (b.owner !== myId || b.hp <= 0) return false;
        if (dist2(b.x, b.y, mouse.wx, mouse.wy) <= (b.radius + 12) ** 2) return true;
        if (threeReady) {
          const def = BUILDINGS[b.kind] || BUILDINGS.hq;
          const pt = worldToScreen3D(b.x, b.y, (def.height || 36) * 0.45);
          return hypot(pt.x - mouse.x, pt.y - mouse.y) <= Math.max(b.radius * cam.z + 14, 26);
        }
        return false;
      });
      if (hitB) {
        selectedBlds.add(hitB.id);
      }
    }
  }
  mouse.dragStart = null;
  cleanSelection();
  renderConsoleUI(true);
});

let lastCmdSig = '';
let lastSelSig = '';
let lastRosterSig = '';

function renderConsoleUI(force = false) {
  if (!state) return;
  cleanSelection();
  const me = state.players.find((p) => Number(p.id) === Number(myId));
  if (!me) return;

  const myUnits = state.units.filter((u) => Number(u.owner) === Number(myId) && u.hp > 0);
  const scvs = myUnits.filter((u) => u.kind === 'scv');
  const armyCnt = myUnits.filter((u) => u.kind !== 'scv').length;
  $('#uiIdleCnt').textContent = scvs.length;
  $('#uiArmyCnt').textContent = armyCnt;

  const cgHtml = [];
  for (let g = 1; g <= 5; g++) {
    const grp = controlGroups[g];
    const cnt = (grp?.units?.length || 0) + (grp?.blds?.length || 0);
    if (cnt > 0) {
      cgHtml.push(`<button class="cg-pill" data-cg="${g}"><b>${g}</b><span>(${cnt})</span></button>`);
    }
  }
  const cgBar = $('#uiCgBar');
  if (cgBar.innerHTML !== cgHtml.join('')) {
    cgBar.innerHTML = cgHtml.join('');
    for (const btn of cgBar.querySelectorAll('[data-cg]')) {
      btn.onpointerdown = (ev) => {
        if (ev.button !== 0) return;
        ev.preventDefault();
        const g = Number(btn.dataset.cg);
        const grp = controlGroups[g];
        selectedUnits = new Set(grp.units || []);
        selectedBlds = new Set(grp.blds || []);
        cleanSelection();
        renderConsoleUI(true);
      };
    }
  }

  const selBody = $('#uiSelBody');
  const selU = state.units.filter((u) => selectedUnits.has(u.id));
  const selB = state.buildings.filter((b) => selectedBlds.has(b.id));

  let selSig = 'NONE';
  if (selB.length >= 1 && selU.length === 0) {
    const b0 = selB[0];
    selSig = `B:${selB.map((b) => b.id).join(',')}:${b0.constructing ? 1 : 0}:${(b0.queue || []).join(',')}`;
  } else if (selU.length === 1) {
    const u0 = selU[0];
    selSig = `U1:${u0.id}:${u0.kind}:${u0.sieged ? 1 : 0}:${u0.stimT > 0 ? 1 : 0}`;
  } else if (selU.length > 1) {
    selSig = `UM:${selU.map((u) => `${u.id}:${u.sieged ? 1 : 0}:${u.stimT > 0 ? 1 : 0}`).join(',')}`;
  }

  // PANNEAU CENTRAL / GAUCHE : ne reconstruit le DOM que si la structure de sélection change !
  if (!force && selSig === lastSelSig) {
    if (selB.length >= 1 && selU.length === 0) {
      const b = selB[0];
      const pct = Math.round((b.hp / b.maxHp) * 100);
      const qProg = b.qTotal > 0 ? Math.round((1 - b.qTimer / b.qTotal) * 100) : 0;
      const hpBar = $('#selHpBar'), hpSub = $('#selHpSub'), qBar = $('#selQBar'), qTxt = $('#selQTxt');
      if (hpBar) { hpBar.style.width = `${pct}%`; hpBar.style.background = pct > 45 ? '#2fbf71' : '#ff4b2b'; }
      if (hpSub) hpSub.textContent = `PV : ${Math.ceil(b.hp)} / ${b.maxHp} ${b.constructing ? `· Construction ${Math.round((b.buildProg || 0) * 100)}%` : ''}`;
      if (qBar) qBar.style.width = `${qProg}%`;
      if (qTxt) {
        const qItem = b.queue[0];
        const qDef = qItem ? (UNITS[qItem] || UPGRADES[qItem]) : null;
        qTxt.textContent = qDef ? `En cours : ${qDef.name} (${qProg}%)` : (b.kind === 'armory' ? 'Prêt à rechercher' : 'Prêt à produire');
      }
    } else if (selU.length === 1) {
      const u = selU[0];
      const def = UNITS[u.kind];
      const pct = Math.round((u.hp / u.maxHp) * 100);
      const hpBar = $('#selHpBar'), hpSub = $('#selHpSub');
      if (hpBar) { hpBar.style.width = `${pct}%`; hpBar.style.background = pct > 45 ? '#2fbf71' : '#ff4b2b'; }
      if (hpSub) hpSub.textContent = `PV : ${Math.ceil(u.hp)} / ${u.maxHp} · ${def.desc}`;
    } else if (selU.length > 1) {
      for (const u of selU.slice(0, 24)) {
        const bar = selBody.querySelector(`[data-u-hp="${u.id}"]`);
        if (bar) {
          const pct = Math.round((u.hp / u.maxHp) * 100);
          bar.style.width = `${pct}%`;
          bar.style.background = pct > 45 ? '#2fbf71' : '#ff4b2b';
        }
      }
    }
  } else {
    lastSelSig = selSig;
    if (selB.length >= 1 && selU.length === 0) {
      const b = selB[0];
      const def = BUILDINGS[b.kind];
      $('#uiSelHeader').textContent = selB.length > 1 ? `${selB.length} × ${def.name}` : def.name;
      $('#uiSelSubHint').textContent = b.constructing ? 'Chantier 3D en construction...' : 'Clic Droit sur la carte = Point de Ralliement';
      const pct = Math.round((b.hp / b.maxHp) * 100);
      const qSlotsHtml = [0, 1, 2, 3, 4].map((idx) => {
        const qKind = b.queue?.[idx];
        const uDef = qKind ? (UNITS[qKind] || UPGRADES[qKind]) : null;
        return `<div class="q-slot ${uDef ? 'filled' : ''}" data-cancel-bld="${b.id}" data-cancel-slot="${idx}" title="${uDef ? `Annuler ${uDef.name}` : 'Slot libre'}">
          <span class="num">#${idx + 1}</span>
          ${uDef ? `<span class="q-nm">${uDef.short || uDef.name}</span>` : '<span style="color:#b7ac95">—</span>'}
        </div>`;
      }).join('');
      const qProg = b.qTotal > 0 ? Math.round((1 - b.qTimer / b.qTotal) * 100) : 0;
      const qItem0 = b.queue?.[0];
      const qDef0 = qItem0 ? (UNITS[qItem0] || UPGRADES[qItem0]) : null;

      selBody.innerHTML = `
        <div class="portrait-box">
          <div class="portrait-name">${def.short}</div>
          <canvas width="98" height="86" id="portCvs"></canvas>
          <div class="portrait-hp"><i id="selHpBar" style="width:${pct}%;background:${pct > 45 ? '#2fbf71' : '#ff4b2b'}"></i></div>
        </div>
        <div class="sel-info">
          <div class="sel-title">${def.name}</div>
          <div class="sel-sub" id="selHpSub">PV : ${Math.ceil(b.hp)} / ${b.maxHp} ${b.constructing ? `· Construction ${Math.round((b.buildProg || 0) * 100)}%` : ''}</div>
          <div class="sel-stats">
            ${def.dmg ? `<span class="st-chip">⚔️ Dégâts : ${def.dmg}</span>` : ''}
            ${def.supply ? `<span class="st-chip">📦 Ravitaillement : +${def.supply}</span>` : ''}
            <span class="st-chip">${def.desc}</span>
          </div>
          ${(((def.trains && def.trains.length) || b.kind === 'armory') && !b.constructing) ? `
            <div class="prod-queue">
              <div style="display:flex;justify-content:space-between;font-size:11px;font-weight:700">
                <span>File ${b.kind === 'armory' ? 'de recherche' : 'de production'} (${b.queue.length}/5)</span>
                <span id="selQTxt">${qDef0 ? `En cours : ${qDef0.name} (${qProg}%)` : (b.kind === 'armory' ? 'Prêt à rechercher' : 'Prêt à produire')}</span>
              </div>
              <div class="q-bar-wrap"><i id="selQBar" style="width:${qProg}%"></i></div>
              <div class="q-slots">${qSlotsHtml}</div>
            </div>
          ` : ''}
        </div>
      `;
      drawThumbIcon($('#portCvs'), b.kind, me.color);
      for (const sl of selBody.querySelectorAll('.q-slot.filled')) {
        sl.onpointerdown = (ev) => {
          if (ev.button !== 0) return;
          ev.preventDefault();
          sendCommand({ op: 'CANCEL_QUEUE', bldId: Number(sl.dataset.cancelBld), slot: Number(sl.dataset.cancelSlot) });
        };
      }
    } else if (selU.length === 1) {
      const u = selU[0];
      const def = UNITS[u.kind];
      $('#uiSelHeader').textContent = def.name;
      if (u.kind === 'scv') {
        $('#uiSelSubHint').textContent = 'Ouvrier VCS : choisis un bâtiment à droite [1-0] ou Clic Droit sur un cristal';
      } else if (u.kind === 'dropship') {
        $('#uiSelSubHint').textContent = 'Navette : Clic Droit sur troupes pour embarquer [max 4] · V = Débarquer';
      } else if (u.kind === 'medivac') {
        $('#uiSelSubHint').textContent = 'Navette Médicale : Soigne automatiquement les unités alliées blessées en continu';
      } else {
        $('#uiSelSubHint').textContent = 'F + Clic = Attaque-Déplacement · X = Stop · Clic Droit = Ordre';
      }
      const pct = Math.round((u.hp / u.maxHp) * 100);
      let statsHtml = '';
      if (u.kind === 'dropship') {
        statsHtml = `
          <span class="st-chip">📦 Passagers : ${u.cargo?.length || 0} / ${u.maxCargo || 4}</span>
          <span class="st-chip">💨 Vitesse : ${def.speed}</span>
          <span class="st-chip">🦅 Volant (franchit tout)</span>
        `;
      } else if (u.kind === 'medivac') {
        statsHtml = `
          <span class="st-chip">💚 Soins : ${def.healRate || 24}/s</span>
          <span class="st-chip">🎯 Portée : ${def.range}</span>
          <span class="st-chip">${u.healingTargetId ? '✨ Soins en cours' : '🟢 En veille'}</span>
        `;
      } else {
        statsHtml = `
          <span class="st-chip">⚔️ Dégâts : ${u.sieged ? def.siegeDmg : def.dmg}</span>
          <span class="st-chip">🎯 Portée : ${u.sieged ? def.siegeRange : def.range}</span>
          <span class="st-chip">💨 Vitesse : ${u.sieged ? 0 : def.speed}</span>
        `;
      }
      selBody.innerHTML = `
        <div class="portrait-box">
          <div class="portrait-name">${def.short}</div>
          <canvas width="98" height="86" id="portCvs"></canvas>
          <div class="portrait-hp"><i id="selHpBar" style="width:${pct}%;background:${pct > 45 ? '#2fbf71' : '#ff4b2b'}"></i></div>
        </div>
        <div class="sel-info">
          <div class="sel-title">${def.name} ${u.sieged ? '· [MODE SIÈGE]' : ''} ${u.stimT > 0 ? '· [STIMPACK ⚡]' : ''}</div>
          <div class="sel-sub" id="selHpSub">PV : ${Math.ceil(u.hp)} / ${u.maxHp} · ${def.desc}</div>
          <div class="sel-stats">${statsHtml}</div>
        </div>
      `;
      drawThumbIcon($('#portCvs'), u.kind, me.color);
    } else if (selU.length > 1) {
      $('#uiSelHeader').textContent = `Escouade sélectionnée (${selU.length} unités)`;
      $('#uiSelSubHint').textContent = 'Clic = Isoler · Ctrl+Clic = Même type · F = Attaque · X = Stop · T = Stimpack · G = Siège · V = Débarquer';
      selBody.innerHTML = `<div class="multi-grid">${selU.slice(0, 24).map((u) => {
        const def = UNITS[u.kind];
        const pct = Math.round((u.hp / u.maxHp) * 100);
        return `<div class="u-card ${u.stimT > 0 ? 'stim' : ''} ${u.sieged ? 'siege' : ''}" data-pick-u="${u.id}" title="${def.name} (${Math.ceil(u.hp)}/${u.maxHp} PV)">
          <canvas class="u-thumb" width="68" height="38" data-u-thumb="${u.kind}"></canvas>
          <span class="u-nm">${def.short}</span>
          <div class="u-hp"><i data-u-hp="${u.id}" style="width:${pct}%;background:${pct > 45 ? '#2fbf71' : '#ff4b2b'}"></i></div>
        </div>`;
      }).join('')}</div>`;
      for (const c of selBody.querySelectorAll('canvas[data-u-thumb]')) {
        drawThumbIcon(c, c.dataset.uThumb, me.color);
      }
      for (const card of selBody.querySelectorAll('[data-pick-u]')) {
        card.onpointerdown = (ev) => {
          if (ev.button !== 0) return;
          ev.preventDefault();
          const id = Number(card.dataset.pickU);
          const targetU = state.units.find((x) => x.id === id);
          if (ev.ctrlKey && targetU) {
            selectedUnits = new Set(selU.filter((x) => x.kind === targetU.kind).map((x) => x.id));
          } else {
            selectedUnits = new Set([id]);
          }
          renderConsoleUI(true);
        };
      }
    } else {
      $('#uiSelHeader').textContent = 'Aucune sélection';
      $('#uiSelSubHint').textContent = 'Clique sur un VCS ou un bâtiment sur la carte';
      selBody.innerHTML = `
        <div class="sel-info">
          <div class="sel-title">Sélectionne une unité ou un bâtiment</div>
          <div class="sel-sub">Fonctionnement StarCraft :</div>
          <div class="sel-stats">
            <span class="st-chip">👷 Clique sur un <b>Ouvrier VCS</b> pour construire un bâtiment</span>
            <span class="st-chip">🏰 Clique sur le <b>QG</b> pour créer un Ouvrier VCS</span>
            <span class="st-chip">🏭 Clique sur la <b>Caserne / Usine</b> pour créer des troupes</span>
          </div>
        </div>
      `;
    }
  }

  // PANNEAU DE DROITE : COMMAND CARD 4x3 STRICTE (sans re-création DOM sur variation de ressources !)
  const hasScv = selU.some((u) => u.kind === 'scv');
  const firstB = selB[0] || null;
  let modeKey = 'NONE';
  if (selU.length > 0) {
    modeKey = hasScv ? 'SCV' : 'ARMY';
  } else if (firstB) {
    modeKey = firstB.constructing ? 'BLD_CONSTRUCT' : `BLD_${firstB.kind}`;
  }

  const grid = $('#uiCmdGrid');
  const sig = `${modeKey}|${buildMode}|${orderCursor}|${me.color}`;
  if (!force && sig === lastCmdSig) {
    // Mise à jour légère des classes .cant sans détruire les boutons en plein clic !
    for (const b of grid.querySelectorAll('[data-cmd-build]')) {
      const def = BUILDINGS[b.dataset.cmdBuild];
      const cant = me.minerals < def.min || me.gas < def.gas || (def.req && !hasCompletedBuilding(state, myId, def.req));
      b.classList.toggle('cant', !!cant);
    }
    for (const b of grid.querySelectorAll('[data-cmd-train]')) {
      const uDef = UNITS[b.dataset.cmdTrain];
      const cant = me.minerals < uDef.min || me.gas < uDef.gas;
      b.classList.toggle('cant', !!cant);
    }
    for (const b of grid.querySelectorAll('[data-cmd-research]')) {
      const uDef = UPGRADES[b.dataset.cmdResearch];
      const isDone = !!(me.upgrades && me.upgrades[uDef?.id]);
      const isQueued = (firstB?.queue || []).includes(uDef?.id);
      const cant = isDone || isQueued || me.minerals < (uDef?.min || 0) || me.gas < (uDef?.gas || 0);
      b.classList.toggle('cant', !!cant);
      b.classList.toggle('done', !!isDone);
    }
    return;
  }
  lastCmdSig = sig;

  const cards = [];

  if (modeKey === 'SCV') {
    $('#uiCmdTitle').textContent = 'Ouvrier VCS · Construction';
    $('#uiCmdHint').textContent = 'Touches 1-0';
    const bList = [
      ['pylon', '1'], ['extractor', '2'], ['barracks', '3'], ['factory', '4'],
      ['starport', '5'], ['armory', '6'], ['turret', '7'], ['tesla', '8'],
      ['wall', '9'], ['hq', '0'],
    ];
    for (const [k, key] of bList) {
      const def = BUILDINGS[k];
      const cant = me.minerals < def.min || me.gas < def.gas || (def.req && !hasCompletedBuilding(state, myId, def.req));
      cards.push(`<button class="cbtn ${buildMode === k ? 'sel' : ''} ${cant ? 'cant' : ''}" data-cmd-build="${k}" title="${def.name} — ${def.desc}">
        <div class="cbtn-top">
          <span class="key">${key}</span>
          <span class="cost-tag">${def.min}💎${def.gas ? ` ${def.gas}🧪` : ''}</span>
        </div>
        <div class="cbtn-mid">
          <canvas class="thumb" width="76" height="40" data-thumb="${k}"></canvas>
        </div>
        <span class="lbl-b">${def.short}</span>
      </button>`);
    }
    cards.push(`<button class="cbtn" data-cmd-act="harvest" title="Envoyer récolter les minéraux les plus proches (C)">
      <div class="cbtn-top"><span class="key">C</span></div>
      <div class="cbtn-mid"><span class="ico-txt">💎</span></div>
      <span class="lbl-b">Récolter</span>
    </button>`);
    cards.push(`<button class="cbtn ${orderCursor === 'amove' ? 'sel' : ''}" data-cmd-act="amove" title="Attaquer (F)">
      <div class="cbtn-top"><span class="key">F</span></div>
      <div class="cbtn-mid"><span class="ico-txt">🎯</span></div>
      <span class="lbl-b">Attaquer</span>
    </button>`);
    cards.push(`<button class="cbtn" data-cmd-act="stop" title="Stopper (X)">
      <div class="cbtn-top"><span class="key">X</span></div>
      <div class="cbtn-mid"><span class="ico-txt">✋</span></div>
      <span class="lbl-b">Stop</span>
    </button>`);

  } else if (modeKey.startsWith('BLD_') && modeKey !== 'BLD_CONSTRUCT') {
    const bDef = BUILDINGS[firstB.kind];
    $('#uiCmdTitle').textContent = `${bDef.name}`;
    $('#uiCmdHint').textContent = firstB.kind === 'armory' ? 'Recherches E / R / T / Y / U' : bDef.trains.length ? 'Touches E / R / T' : 'Structure active';
    if (firstB.kind === 'armory') {
      const upgKeys = ['E', 'R', 'T', 'Y', 'U'];
      const upgList = Object.values(UPGRADES);
      me.upgrades = me.upgrades || {};
      upgList.forEach((uDef, idx) => {
        const isDone = !!me.upgrades[uDef.id];
        const isQueued = (firstB.queue || []).includes(uDef.id);
        const cant = isDone || isQueued || me.minerals < uDef.min || me.gas < uDef.gas;
        cards.push(`<button class="cbtn ${isDone ? 'done' : ''} ${cant ? 'cant' : ''}" data-cmd-research="${uDef.id}" title="${uDef.name} — ${uDef.desc}">
          <div class="cbtn-top">
            <span class="key">${upgKeys[idx] || ''}</span>
            <span class="cost-tag">${isDone ? '✔️ Validé' : isQueued ? '⏳ En cours' : `${uDef.min}💎${uDef.gas ? ` ${uDef.gas}🧪` : ''}`}</span>
          </div>
          <div class="cbtn-mid">
            <span class="ico-txt">${uDef.icon}</span>
          </div>
          <span class="lbl-b">${uDef.short}</span>
        </button>`);
      });
    } else {
      const keysMap = ['E', 'R', 'T', 'Y'];
      (bDef.trains || []).forEach((uKind, idx) => {
        const uDef = UNITS[uKind];
        const cant = me.minerals < uDef.min || me.gas < uDef.gas;
        cards.push(`<button class="cbtn ${cant ? 'cant' : ''}" data-cmd-train="${uKind}" title="Entraîner ${uDef.name} — ${uDef.desc}">
          <div class="cbtn-top">
            <span class="key">${keysMap[idx]}</span>
            <span class="cost-tag">${uDef.min}💎${uDef.gas ? ` ${uDef.gas}🧪` : ''}</span>
          </div>
          <div class="cbtn-mid">
            <canvas class="thumb" width="76" height="40" data-thumb="${uKind}"></canvas>
          </div>
          <span class="lbl-b">${uDef.short}</span>
        </button>`);
      });
      if (firstB.kind === 'hq') {
        cards.push(`<button class="cbtn ${orderCursor === 'scan' ? 'sel' : ''}" data-cmd-act="scan" title="Scan Radar Comsat (50💎) : révèle le brouillard de guerre (C)">
          <div class="cbtn-top"><span class="key">C</span><span class="cost-tag">50💎</span></div>
          <div class="cbtn-mid"><span class="ico-txt">📡</span></div>
          <span class="lbl-b">Scan Radar</span>
        </button>`);
      }
    }
    if (!cards.length) {
      grid.innerHTML = `<div class="cmd-empty"><b>${bDef.name}</b><span>Ce bâtiment fonctionne automatiquement (${bDef.desc})</span></div>`;
      return;
    }

  } else if (modeKey === 'BLD_CONSTRUCT') {
    $('#uiCmdTitle').textContent = 'Chantier en cours';
    $('#uiCmdHint').textContent = 'En construction';
    grid.innerHTML = `<div class="cmd-empty"><b>Chantier en cours de soudure</b><span>Ton Ouvrier VCS est sur l'emplacement en train de souder la structure.</span></div>`;
    return;

  } else if (modeKey === 'ARMY') {
    $('#uiCmdTitle').textContent = 'Ordres de Combat';
    $('#uiCmdHint').textContent = 'Micro-gestion';
    const canStim = selU.some((u) => UNITS[u.kind]?.canStim);
    const canSiege = selU.some((u) => UNITS[u.kind]?.canSiege);
    const hasDropship = selU.some((u) => u.kind === 'dropship');

    cards.push(`<button class="cbtn ${orderCursor === 'amove' ? 'sel' : ''}" data-cmd-act="amove" title="Attaque-Déplacement (F + Clic gauche)">
      <div class="cbtn-top"><span class="key">F</span></div>
      <div class="cbtn-mid"><span class="ico-txt">⚔️</span></div>
      <span class="lbl-b">A-Move</span>
    </button>`);
    cards.push(`<button class="cbtn" data-cmd-act="stop" title="Stopper les unités (X)">
      <div class="cbtn-top"><span class="key">X</span></div>
      <div class="cbtn-mid"><span class="ico-txt">✋</span></div>
      <span class="lbl-b">Stop</span>
    </button>`);
    cards.push(`<button class="cbtn" data-cmd-act="hold" title="Tenir Position (H)">
      <div class="cbtn-top"><span class="key">H</span></div>
      <div class="cbtn-mid"><span class="ico-txt">🛡️</span></div>
      <span class="lbl-b">Tenir Pos.</span>
    </button>`);
    if (canStim) {
      cards.push(`<button class="cbtn" data-cmd-act="stim" title="Stimpack (T) : +50% vitesse d'attaque et de déplacement pendant 8s (-18 PV)">
        <div class="cbtn-top"><span class="key">T</span></div>
        <div class="cbtn-mid"><span class="ico-txt">💉</span></div>
        <span class="lbl-b">Stimpack</span>
      </button>`);
    }
    if (canSiege) {
      cards.push(`<button class="cbtn" data-cmd-act="siege" title="Mode Siège / Mode Char (G) pour les Chars de Siège">
        <div class="cbtn-top"><span class="key">G</span></div>
        <div class="cbtn-mid"><span class="ico-txt">💥</span></div>
        <span class="lbl-b">Mode Siège</span>
      </button>`);
    }
    if (hasDropship) {
      cards.push(`<button class="cbtn" data-cmd-act="unload" title="Débarquer toutes les troupes transportées (V)">
        <div class="cbtn-top"><span class="key">V</span></div>
        <div class="cbtn-mid"><span class="ico-txt">🚀</span></div>
        <span class="lbl-b">Débarquer</span>
      </button>`);
    }

  } else {
    $('#uiCmdTitle').textContent = 'Aucune sélection';
    $('#uiCmdHint').textContent = 'Sélection requise';
    grid.innerHTML = `<div class="cmd-empty">
      <b>Aucune unité ou structure sélectionnée</b>
      <span>Clique sur un <b>Ouvrier VCS</b> (ou <kbd>F1</kbd>) pour construire, ou clique sur un <b>Bâtiment</b> (QG, Caserne, Usine, Spatioport) pour produire des troupes.</span>
    </div>`;
    return;
  }

  grid.innerHTML = cards.join('');
  for (const c of grid.querySelectorAll('canvas[data-thumb]')) {
    drawThumbIcon(c, c.dataset.thumb, me.color);
  }
  for (const b of grid.querySelectorAll('[data-cmd-build]')) {
    b.onpointerdown = (ev) => {
      if (ev.button !== 0) return;
      ev.preventDefault();
      const k = b.dataset.cmdBuild;
      orderCursor = null;
      buildMode = buildMode === k ? null : k;
      updateCursorClass();
      renderConsoleUI(true);
    };
  }
  for (const b of grid.querySelectorAll('[data-cmd-train]')) {
    b.onpointerdown = (ev) => {
      if (ev.button !== 0) return;
      ev.preventDefault();
      const uKind = b.dataset.cmdTrain;
      for (const bId of selectedBlds) {
        sendCommand({ op: 'TRAIN', unit: uKind, bldId: bId });
      }
    };
  }
  for (const b of grid.querySelectorAll('[data-cmd-research]')) {
    b.onpointerdown = (ev) => {
      if (ev.button !== 0) return;
      ev.preventDefault();
      const upgId = b.dataset.cmdResearch;
      if (firstB) {
        sendCommand({ op: 'RESEARCH', upgId, bldId: firstB.id });
      }
    };
  }
  for (const b of grid.querySelectorAll('[data-cmd-act]')) {
    b.onpointerdown = (ev) => {
      if (ev.button !== 0) return;
      ev.preventDefault();
      const act = b.dataset.cmdAct;
      if (act === 'amove') { buildMode = null; orderCursor = orderCursor === 'amove' ? null : 'amove'; updateCursorClass(); renderConsoleUI(true); }
      else if (act === 'scan') { buildMode = null; orderCursor = orderCursor === 'scan' ? null : 'scan'; updateCursorClass(); renderConsoleUI(true); }
      else if (act === 'stop') sendCommand({ op: 'UNIT_ORDER', mode: 'stop', unitIds: [...selectedUnits] });
      else if (act === 'hold') sendCommand({ op: 'UNIT_ORDER', mode: 'hold', unitIds: [...selectedUnits] });
      else if (act === 'harvest') sendCommand({ op: 'UNIT_ORDER', mode: 'harvest_min', x: cam.x, y: cam.y, unitIds: [...selectedUnits] });
      else if (act === 'stim') sendCommand({ op: 'STIM', unitIds: [...selectedUnits] });
      else if (act === 'siege') sendCommand({ op: 'SIEGE', unitIds: [...selectedUnits] });
      else if (act === 'unload') {
        for (const uId of selectedUnits) {
          const u = state.units.find((x) => x.id === uId);
          if (u && u.kind === 'dropship') sendCommand({ op: 'UNLOAD', dropshipId: u.id });
        }
      }
    };
  }
}

function updateHudUI() {
  if (!state) return;
  const me = state.players.find((p) => Number(p.id) === Number(myId));
  if (me) {
    $('#uiMin').textContent = Math.floor(me.minerals);
    $('#uiGas').textContent = Math.floor(me.gas);
    const scvCnt = state.units.filter((u) => Number(u.owner) === Number(myId) && u.kind === 'scv' && u.hp > 0).length;
    const refCnt = state.buildings.filter((b) => Number(b.owner) === Number(myId) && b.kind === 'extractor' && b.hp > 0 && !b.constructing).length;
    $('#uiWorkers').textContent = `${scvCnt} VCS`;
    $('#uiRefineries').textContent = `${refCnt} Raff.`;
    const sup = computeSupply(state, myId);
    const supEl = $('#uiSupply');
    supEl.textContent = `${sup.used}/${sup.max}`;
    supEl.classList.toggle('blocked', sup.used >= sup.max);
  }

  const sec = Math.floor(state.time);
  const mm = String(Math.floor(sec / 60)).padStart(2, '0');
  const ss = String(sec % 60).padStart(2, '0');
  $('#uiClock').textContent = `${mm}:${ss}`;
  const phaseNames = {
    1: 'Phase 1 · Expansion & Scouting',
    2: 'Phase 2 · Escarmouches Tactiques',
    3: 'Phase 3 · Guerre Mécanisée (+20% Dégâts)',
    4: 'MORT SUBITE · Tempête & Dégâts ×1.85',
  };
  $('#uiPhaseName').textContent = phaseNames[state.phase] || '';
  $('#uiPhase').classList.toggle('sd', state.phase === 4);

  const rosterSig = state.players.map((p) => `${p.id}:${p.name}:${p.team}:${p.dead ? 1 : 0}:${p.bot ? 'bot' : getPlayerPing(p)}`).join('|');
  if (rosterSig !== lastRosterSig) {
    lastRosterSig = rosterSig;
    $('#uiRoster').innerHTML = state.players.map((p) => {
      const isMe = Number(p.id) === Number(myId);
      let pingHtml = '';
      if (p.bot) {
        pingHtml = `<span class="ping-tag bot">🤖 IA</span>`;
      } else {
        const ms = getPlayerPing(p);
        const cls = ms > 150 ? 'bad' : ms > 80 ? 'warn' : '';
        pingHtml = `<span class="ping-tag ${cls}">📶 ${ms} ms</span>`;
      }
      let teamHtml = '';
      if (state.is2v2) {
        const tName = p.team === 0 ? 'Équipe A' : 'Équipe B';
        const canSwitch = (state.time < 45 && (!p.bot || isMe || role === 'host'));
        teamHtml = `<button class="team-tag t${p.team}" data-toggle-team="${p.id}" ${canSwitch ? 'title="Changer d’équipe"' : 'disabled'} style="border:none;cursor:${canSwitch ? 'pointer' : 'default'}">${tName}</button>`;
      }
      return `<div class="p-chip ${p.dead ? 'dead' : ''} ${isMe ? 'me' : ''}">
        <span class="dot" style="background:${p.color}"></span>
        <span>${p.name}${isMe ? ' <small>(Toi)</small>' : ''}</span>
        ${teamHtml}
        ${pingHtml}
      </div>`;
    }).join('');

    for (const btn of $('#uiRoster').querySelectorAll('[data-toggle-team]')) {
      btn.onclick = (e) => {
        e.stopPropagation();
        const targetPid = Number(btn.dataset.toggleTeam);
        sendCommand({ op: 'TOGGLE_TEAM', targetId: targetPid });
      };
    }
  }

  renderConsoleUI(false);

  const modal = $('#endModal');
  if (state.over && modal.hidden) {
    modal.hidden = false;
    const won = me && !me.dead && me.team === state.winnerTeam;
    $('#endTitle').textContent = won ? '🏆 Victoire !' : '💥 Défaite';
    $('#endSub').textContent = won
      ? 'Tes forces ont conquis le secteur !'
      : 'Tous tes Centres de Commandement ont été détruits.';
    const ordered = state.ranking.map((id) => state.players.find((p) => p.id === id)).filter(Boolean);
    $('#endRanks').innerHTML = ordered.map((p, idx) => `<li>
      <span class="rk">${idx < 3 ? ['🥇', '🥈', '🥉'][idx] : idx + 1}</span>
      <span class="dot" style="background:${p.color}"></span>
      <span>${p.name}${p.bot ? ' 🤖' : ''}</span>
      <span class="sc">${p.score} pts</span>
    </li>`).join('');

    if (!reportedResult && (role === 'host' || role === 'solo') && window.HubBridge && HubBridge.embedded) {
      reportedResult = true;
      HubBridge.report({
        id: `bastion-${Date.now()}`,
        mode: state.mode === '2v2' ? '2v2' : 'RTS',
        players: ordered.map((p, idx) => ({
          id: p.bot ? null : p.id,
          name: p.name,
          color: p.color,
          bot: !!p.bot,
          rank: idx + 1,
          score: p.score,
        })),
      });
    }
  } else if (!state.over && !modal.hidden) {
    modal.hidden = true;
  }
}

/* ============================================================================
   MOTEUR WEBGL 3D VRAIE 3D VUE DU DESSUS (THREE.JS + OMBRES TEMPS RÉEL)
   ============================================================================ */
const bldMeshes3D = new Map();
const unitMeshes3D = new Map();
let treeMeshes3D = [];
let rockMeshes3D = [];
let centerMonumentGroup3D = null;
let basePlatformsGroup3D = null;
let mineralMeshes3D = [];
let geyserMeshes3D = [];
let wallBeamsGroup3D = null;
let fxGroup3D = null;
let ghostGroup3D = null;
let ghostKind3D = null;
let hemiLight3D = null;
let rimLight3D = null;
let skirtMesh3D = null;
let groundMesh3D = null;
const matCache3D = new Map();
const geoCache3D = {};

function getMat3D(hexOrStr, rough = 0.45, metal = 0.25, emissiveHex = 0x000000, emissiveInt = 0, opacity = 1) {
  const key = `${hexOrStr}|${rough}|${metal}|${emissiveHex}|${emissiveInt}|${opacity}`;
  if (matCache3D.has(key)) return matCache3D.get(key);
  const m = new THREE.MeshStandardMaterial({
    color: new THREE.Color(hexOrStr),
    roughness: rough,
    metalness: metal,
    emissive: new THREE.Color(emissiveHex),
    emissiveIntensity: emissiveInt,
    transparent: opacity < 1,
    opacity,
  });
  matCache3D.set(key, m);
  return m;
}

function initThree3D() {
  if (threeReady || !window.THREE || !webglCvs) return false;
  try {
    threeRenderer = new THREE.WebGLRenderer({
      canvas: webglCvs,
      antialias: true,
      powerPreference: 'high-performance',
    });
    threeRenderer.setPixelRatio(Math.min(1.75, DPR));
    threeRenderer.setSize(W, H, false);
    threeRenderer.shadowMap.enabled = true;
    threeRenderer.shadowMap.type = THREE.PCFSoftShadowMap;

    const def = MAP_DEFS[activeMapId] || MAP_DEFS.vallee;
    const FOG_COLOR = def.fogColor;
    threeScene = new THREE.Scene();
    threeScene.background = new THREE.Color(FOG_COLOR);
    // Brouillard atmosphérique au loin : dissimule le bord du monde et plonge le lointain dans la brume sci-fi
    threeScene.fog = new THREE.Fog(FOG_COLOR, def.fogNear, def.fogFar);

    threeCam = new THREE.PerspectiveCamera(34, W / Math.max(1, H), 40, 9500);
    threeRaycaster = new THREE.Raycaster();
    threeGroundPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
    threeNdc = new THREE.Vector2();
    threeHitPt = new THREE.Vector3();
    threeProjVec = new THREE.Vector3();

    // Éclairage 3D directionnel + hémisphérique avec vraies ombres portées au sol
    hemiLight3D = new THREE.HemisphereLight(def.hemiSky, def.hemiGround, 0.78);
    threeScene.add(hemiLight3D);

    const sun = new THREE.DirectionalLight(def.sunColor, 0.98);
    sun.position.set(WORLD_SIZE * 0.26, 1750, WORLD_SIZE * 0.82);
    sun.target.position.set(HALF_W, 0, HALF_W);
    sun.castShadow = true;
    sun.shadow.mapSize.width = 2048;
    sun.shadow.mapSize.height = 2048;
    sun.shadow.camera.near = 250;
    sun.shadow.camera.far = 4800;
    const sc = 1450;
    sun.shadow.camera.left = -sc;
    sun.shadow.camera.right = sc;
    sun.shadow.camera.top = sc;
    sun.shadow.camera.bottom = -sc;
    sun.shadow.bias = -0.0005;
    threeScene.add(sun);
    threeScene.add(sun.target);
    sunLight3D = sun;

    rimLight3D = new THREE.DirectionalLight(def.rimColor, 0.32);
    rimLight3D.position.set(WORLD_SIZE * 0.85, 950, WORLD_SIZE * 0.14);
    rimLight3D.target.position.set(HALF_W, 0, HALF_W);
    threeScene.add(rimLight3D);
    threeScene.add(rimLight3D.target);

    // Sol étendu à l'horizon (empêche tout vide noir à angle bas prononcé et se fond dans le brouillard)
    const skirtGeo = new THREE.PlaneGeometry(WORLD_SIZE * 3.5, WORLD_SIZE * 3.5);
    const skirtMat = new THREE.MeshStandardMaterial({
      color: FOG_COLOR,
      roughness: 0.95,
      metalness: 0.08,
    });
    skirtMesh3D = new THREE.Mesh(skirtGeo, skirtMat);
    skirtMesh3D.rotation.x = -Math.PI / 2;
    skirtMesh3D.position.set(HALF_W, -1.2, HALF_W);
    skirtMesh3D.receiveShadow = true;
    threeScene.add(skirtMesh3D);

    // Sol 3D texturé à partir de terrainCanvas
    const groundTex = new THREE.CanvasTexture(terrainCanvas);
    groundTex.anisotropy = 4;
    const groundGeo = new THREE.PlaneGeometry(WORLD_SIZE, WORLD_SIZE);
    const groundMat = new THREE.MeshStandardMaterial({
      map: groundTex,
      roughness: 0.88,
      metalness: 0.06,
    });
    groundMesh3D = new THREE.Mesh(groundGeo, groundMat);
    groundMesh3D.rotation.x = -Math.PI / 2;
    groundMesh3D.position.set(HALF_W, 0, HALF_W);
    groundMesh3D.receiveShadow = true;
    threeScene.add(groundMesh3D);

    basePlatformsGroup3D = new THREE.Group();
    threeScene.add(basePlatformsGroup3D);

    centerMonumentGroup3D = new THREE.Group();
    threeScene.add(centerMonumentGroup3D);

    wallBeamsGroup3D = new THREE.Group();
    threeScene.add(wallBeamsGroup3D);

    fxGroup3D = new THREE.Group();
    threeScene.add(fxGroup3D);

    // Brouillard de Guerre 3D dynamique : recouvre arbres, rochers, monuments et terrain
    fogTexture3D = new THREE.CanvasTexture(fogCanvas);
    fogTexture3D.minFilter = THREE.LinearFilter;
    fogTexture3D.magFilter = THREE.LinearFilter;
    const fogGeo = new THREE.PlaneGeometry(WORLD_SIZE, WORLD_SIZE);
    const fogMat = new THREE.MeshBasicMaterial({
      map: fogTexture3D,
      transparent: true,
      depthWrite: false,
      depthTest: false,
      opacity: 0.98,
      fog: false,
    });
    const fogMesh = new THREE.Mesh(fogGeo, fogMat);
    fogMesh.rotation.x = -Math.PI / 2;
    fogMesh.position.set(HALF_W, 0.5, HALF_W);
    fogMesh.renderOrder = 999;
    threeScene.add(fogMesh);

    threeReady = true;
    setupThreeMapScenery(activeMapId);
    return true;
  } catch (err) {
    console.warn('Fallback 2D activé :', err);
    threeReady = false;
    return false;
  }
}

function setupThreeMapScenery(mapId = activeMapId) {
  if (!threeScene) return;
  const def = MAP_DEFS[mapId] || MAP_DEFS.vallee;

  // 1. Ambiance, Fog et Horizon
  threeScene.background = new THREE.Color(def.fogColor);
  if (threeScene.fog) {
    threeScene.fog.color = new THREE.Color(def.fogColor);
  }
  if (skirtMesh3D && skirtMesh3D.material) {
    skirtMesh3D.material.color = new THREE.Color(def.fogColor);
  }

  // 2. Éclairage
  if (sunLight3D) sunLight3D.color = new THREE.Color(def.sunColor);
  if (hemiLight3D) {
    hemiLight3D.color = new THREE.Color(def.hemiSky);
    hemiLight3D.groundColor = new THREE.Color(def.hemiGround);
  }
  if (rimLight3D) rimLight3D.color = new THREE.Color(def.rimColor);

  // 3. Texture du sol
  if (groundMesh3D && groundMesh3D.material && terrainCanvas) {
    if (groundMesh3D.material.map && groundMesh3D.material.map.dispose) {
      groundMesh3D.material.map.dispose();
    }
    const groundTex = new THREE.CanvasTexture(terrainCanvas);
    groundTex.anisotropy = 4;
    groundMesh3D.material.map = groundTex;
    groundMesh3D.material.needsUpdate = true;
  }

  // 4. Plateformes des bases
  if (basePlatformsGroup3D) {
    while (basePlatformsGroup3D.children.length > 0) {
      basePlatformsGroup3D.remove(basePlatformsGroup3D.children[0]);
    }
    const platMat1 = getMat3D(def.theme === 'volcanique' ? '#2d252c' : def.theme === 'cryo' ? '#344e60' : '#535763', 0.55, 0.35);
    const platMat2 = getMat3D(def.theme === 'volcanique' ? '#3a2e38' : def.theme === 'cryo' ? '#486880' : '#656a78', 0.48, 0.4);
    SPAWN_CORNERS.forEach((sp) => {
      const p1 = new THREE.Mesh(new THREE.CylinderGeometry(212, 222, 5, 32), platMat1);
      p1.position.set(sp.x, 2.5, sp.y);
      p1.receiveShadow = true; p1.castShadow = true;
      basePlatformsGroup3D.add(p1);
      const p2 = new THREE.Mesh(new THREE.CylinderGeometry(172, 178, 3, 32), platMat2);
      p2.position.set(sp.x, 6.0, sp.y);
      p2.receiveShadow = true;
      basePlatformsGroup3D.add(p2);
    });
  }

  // 5. Monument Central
  if (centerMonumentGroup3D) {
    while (centerMonumentGroup3D.children.length > 0) {
      centerMonumentGroup3D.remove(centerMonumentGroup3D.children[0]);
    }
    const platMat1 = getMat3D(def.theme === 'volcanique' ? '#261a22' : def.theme === 'cryo' ? '#27475d' : '#585c69', 0.55, 0.35);
    const platMat2 = getMat3D(def.theme === 'volcanique' ? '#3c242c' : def.theme === 'cryo' ? '#1e384b' : '#454954', 0.5, 0.4);
    const ringCol = def.theme === 'volcanique' ? '#ff5500' : def.theme === 'cryo' ? '#1fc7c1' : '#ffc531';
    const ringMat = getMat3D(ringCol, 0.35, 0.5, ringCol === '#ff5500' ? 0xff3b00 : ringCol === '#1fc7c1' ? 0x00f0ff : 0xffc531, 0.35);

    const c1 = new THREE.Mesh(new THREE.CylinderGeometry(336, 348, 6, 40), platMat1);
    c1.position.set(HALF_W, 3, HALF_W);
    c1.receiveShadow = true; c1.castShadow = true;
    centerMonumentGroup3D.add(c1);

    const c2 = new THREE.Mesh(new THREE.CylinderGeometry(272, 280, 4, 40), platMat2);
    c2.position.set(HALF_W, 7, HALF_W);
    c2.receiveShadow = true;
    centerMonumentGroup3D.add(c2);

    const cRing = new THREE.Mesh(new THREE.TorusGeometry(115, 2.8, 8, 40), ringMat);
    cRing.rotation.x = Math.PI / 2;
    cRing.position.set(HALF_W, 9.5, HALF_W);
    centerMonumentGroup3D.add(cRing);
  }

  // 6. Éléments de décor (Arbres / Cheminées / Spires de glace)
  if (treeMeshes3D) {
    for (const item of treeMeshes3D) {
      if (item.grp) threeScene.remove(item.grp);
    }
  }
  treeMeshes3D = [];

  const trunkGeo = new THREE.CylinderGeometry(2.4, 3.6, 12, 7);
  const cone1Geo = new THREE.ConeGeometry(1, 1, 8);
  const barkMat = getMat3D('#4b3624', 0.85, 0.05);

  const volcanoGeo = new THREE.CylinderGeometry(0.5, 1, 1, 10);
  const lavaCoreGeo = new THREE.SphereGeometry(1, 8, 8);
  const lavaMat = getMat3D('#ff4500', 0.2, 0.2, 0xff3300, 0.95);

  const spireGeo = new THREE.ConeGeometry(1, 1, 6);
  const crystalMat = getMat3D('#5cd5eb', 0.15, 0.45, 0x00e5ff, 0.55);

  for (const tr of TREES_3D) {
    const grp = new THREE.Group();
    grp.position.set(tr.x, 0, tr.y);

    if (tr.type === 'volcano') {
      const basaltMat = getMat3D(tr.col || '#2a1e20', 0.78, 0.15);
      const chim = new THREE.Mesh(volcanoGeo, basaltMat);
      chim.scale.set(tr.r * 0.9, tr.h, tr.r * 0.9);
      chim.position.y = tr.h * 0.5;
      chim.castShadow = true; chim.receiveShadow = true;
      grp.add(chim);

      const core = new THREE.Mesh(lavaCoreGeo, lavaMat);
      core.scale.set(tr.r * 0.35, tr.r * 0.25, tr.r * 0.35);
      core.position.y = tr.h;
      grp.add(core);

    } else if (tr.type === 'crystal') {
      const spire = new THREE.Mesh(spireGeo, crystalMat);
      spire.scale.set(tr.r * 0.7, tr.h * 1.15, tr.r * 0.7);
      spire.position.y = (tr.h * 1.15) * 0.5;
      spire.castShadow = true; spire.receiveShadow = true;
      grp.add(spire);

    } else {
      const trunk = new THREE.Mesh(trunkGeo, barkMat);
      trunk.position.y = 6;
      trunk.castShadow = true;
      grp.add(trunk);

      const leafMat = getMat3D(tr.col, 0.72, 0.05);
      const h = tr.h || 40;
      const r = tr.r || 20;
      for (let tier = 0; tier < 3; tier++) {
        const cone = new THREE.Mesh(cone1Geo, leafMat);
        const rad = r * (1.02 - tier * 0.24);
        const ch = h * (0.48 - tier * 0.07);
        cone.scale.set(rad, ch, rad);
        cone.position.y = 10 + tier * (h * 0.24) + ch * 0.45;
        cone.castShadow = true; cone.receiveShadow = true;
        grp.add(cone);
      }
    }

    threeScene.add(grp);
    treeMeshes3D.push({ grp, x: tr.x, y: tr.y });
  }

  // 7. Rochers 3D
  if (rockMeshes3D) {
    for (const item of rockMeshes3D) {
      if (item.mesh) threeScene.remove(item.mesh);
    }
  }
  rockMeshes3D = [];
  const rockGeo = new THREE.DodecahedronGeometry(1, 0);
  for (const rk of ROCKS) {
    const rockMat = getMat3D(rk.col || (def.theme === 'volcanique' ? '#251c20' : def.theme === 'cryo' ? '#2b506b' : '#6e685f'), 0.8, 0.1);
    const m = new THREE.Mesh(rockGeo, rockMat);
    m.position.set(rk.x, rk.r * 0.42, rk.y);
    m.scale.set(rk.r * 1.05, rk.r * 0.78, rk.r * 0.95);
    m.rotation.set(rk.seed * 0.7, rk.seed * 1.3, rk.seed * 0.4);
    m.castShadow = true; m.receiveShadow = true;
    threeScene.add(m);
    rockMeshes3D.push({ mesh: m, x: rk.x, y: rk.y });
  }

  // 8. Gisements de Minéraux 3D
  if (mineralMeshes3D) {
    for (const item of mineralMeshes3D) {
      if (item.grp) threeScene.remove(item.grp);
    }
  }
  mineralMeshes3D.length = 0;
  const crysGeo = new THREE.OctahedronGeometry(1, 0);
  for (const m of MINERAL_NODES) {
    const isBasePlat = SPAWN_CORNERS.some((sp) => hypot(m.x, m.y, sp.x, sp.y) < 220);
    const baseY = isBasePlat ? 7.2 : 3.5;
    const grp = new THREE.Group();
    grp.position.set(m.x, baseY, m.y);
    let col, em;
    if (def.theme === 'volcanique') {
      col = m.rich ? '#ffd700' : '#ff4b2b';
      em = m.rich ? 0xffa000 : 0xd42b00;
    } else if (def.theme === 'cryo') {
      col = m.rich ? '#c084fc' : '#38bdf8';
      em = m.rich ? 0x9333ea : 0x0284c7;
    } else {
      col = m.rich ? '#ffc531' : '#1fc7c1';
      em = m.rich ? 0xffa800 : 0x0ea5a0;
    }
    const mat = getMat3D(col, 0.2, 0.35, em, 0.55);
    const r = m.rich ? 14 : 11.5;
    const h = m.rich ? 34 : 28;
    const angles = [
      { ox: 0, oz: 0, sx: r * 0.72, sy: h, sz: r * 0.72, rx: 0.08, rz: -0.06 },
      { ox: -r * 0.55, oz: r * 0.3, sx: r * 0.52, sy: h * 0.74, sz: r * 0.52, rx: -0.22, rz: 0.28 },
      { ox: r * 0.55, oz: -r * 0.25, sx: r * 0.5, sy: h * 0.7, sz: r * 0.5, rx: 0.24, rz: -0.26 },
      { ox: r * 0.15, oz: r * 0.58, sx: r * 0.44, sy: h * 0.62, sz: r * 0.44, rx: 0.3, rz: 0.15 },
    ];
    for (const a of angles) {
      const c = new THREE.Mesh(crysGeo, mat);
      c.position.set(a.ox, a.sy * 0.36, a.oz);
      c.scale.set(a.sx, a.sy * 0.65, a.sz);
      c.rotation.set(a.rx, a.ox, a.rz);
      c.castShadow = true;
      grp.add(c);
    }
    threeScene.add(grp);
    mineralMeshes3D.push({ grp, seed: m.x * 0.02 + m.y * 0.01, x: m.x, y: m.y, baseY });
  }

  // 9. Geysers de Gaz Plasma 3D
  if (geyserMeshes3D) {
    for (const item of geyserMeshes3D) {
      if (item.grp) threeScene.remove(item.grp);
    }
  }
  geyserMeshes3D = [];
  const geyRimMat = getMat3D(def.theme === 'volcanique' ? '#332428' : def.theme === 'cryo' ? '#26485e' : '#435449', 0.68, 0.22);
  let geyCol = '#2fbf71', geyEm = 0x2fbf71;
  if (def.theme === 'volcanique') {
    geyCol = '#ff5500'; geyEm = 0xff4500;
  } else if (def.theme === 'cryo') {
    geyCol = '#00f0ff'; geyEm = 0x00f0ff;
  }
  const geyCoreMat = getMat3D(geyCol, 0.2, 0.1, geyEm, 0.85);

  for (const gey of GAS_GEYSERS) {
    const isBasePlat = SPAWN_CORNERS.some((sp) => hypot(gey.x, gey.y, sp.x, sp.y) < 220);
    const baseY = isBasePlat ? 7.2 : 3.5;
    const grp = new THREE.Group();
    grp.position.set(gey.x, baseY, gey.y);
    const base = new THREE.Mesh(new THREE.CylinderGeometry(22, 29, 14, 12), geyRimMat);
    base.position.y = 7;
    base.castShadow = true; base.receiveShadow = true;
    grp.add(base);
    const torus = new THREE.Mesh(new THREE.TorusGeometry(16, 4.5, 8, 16), geyRimMat);
    torus.rotation.x = Math.PI / 2;
    torus.position.y = 14;
    grp.add(torus);
    const core = new THREE.Mesh(new THREE.SphereGeometry(12, 14, 12), geyCoreMat);
    core.position.y = 13;
    grp.add(core);
    threeScene.add(grp);
    geyserMeshes3D.push({ grp, core, seed: gey.x * 0.01, x: gey.x, y: gey.y, baseY });
  }
}

    const scaffGeo = new THREE.BoxGeometry(r * 1.75, h * 1.05, r * 1.75);

      color: 0xffc531,
      wireframe: true,
      transparent: true,

    scaffold.position.y = (h * 1.05) / 2 + 2;

  }

  grp.userData.bodyGroup = bodyGroup;
  grp.userData.color = color;

  return grp;
}
