function updateDockUI() {
  if (!state) return;
  const me = state.players.find((p) => p.id === myId);
  if (!me) return;

  for (const btn of $$('[data-build]')) {
    const k = btn.dataset.build;
    const def = BUILDINGS[k];
    btn.classList.toggle('sel', buildMode === k);
    btn.disabled = me.tier < (def.tier || 1);
    btn.classList.toggle('cant', me.energy < def.cost);
  }
  for (const btn of $$('[data-squad]')) {
    const k = btn.dataset.squad;
    const sq = SQUADS[k];
    btn.disabled = me.tier < sq.tier;
    btn.classList.toggle('cant', me.energy < sq.cost);
  }
  const stBtn = $('#btnStrike');
  stBtn.classList.toggle('sel', strikeMode);
  stBtn.classList.toggle('cant', me.energy < STRIKE_COST || me.strikeCd > 0);
  const cdOv = $('#uiStrikeCd');
  if (me.strikeCd > 0) {
    cdOv.hidden = false;
    cdOv.textContent = Math.ceil(me.strikeCd) + 's';
  } else {
    cdOv.hidden = true;
  }
}

function updateHudUI() {
  if (!state) return;
  const me = state.players.find((p) => p.id === myId);
  if (me) {
    $('#uiEnergy').textContent = Math.floor(me.energy);
    $('#uiRate').textContent = `+${me.income}/s`;
    $('#uiTierLbl').textContent = `QG Niv. ${me.tier}`;
    const upBtn = $('#btnUpHq');
    if (me.tier >= 3) {
      upBtn.textContent = 'QG Niv. Max';
      upBtn.disabled = true;
    } else {
      const next = me.tier + 1, cost = UPGRADE_COSTS[next];
      upBtn.textContent = `Passer Niv. ${next} (${cost}⚡)`;
      upBtn.disabled = me.energy < cost;
    }
  }

  // Horloge & Phase
  const sec = Math.floor(state.time);
  const mm = String(Math.floor(sec / 60)).padStart(2, '0');
  const ss = String(sec % 60).padStart(2, '0');
  $('#uiClock').textContent = `${mm}:${ss}`;
  const phaseNames = {
    1: 'Phase 1 · Ouverture agressive',
    2: 'Phase 2 · Cristaux surchargés',
    3: 'Phase 3 · Assauts lourds',
    4: 'MORT SUBITE · Dégâts ×2',
  };
  $('#uiPhaseName').textContent = phaseNames[state.phase] || '';
  $('#uiPhase').classList.toggle('sd', state.phase === 4);

  // Cibles d'assaut
  if (me) {
    const box = $('#targetBtns');
    const enemies = state.players.filter((p) => p.team !== me.team && !p.dead);
    const items = [
      { id: -1, label: 'Auto', color: null },
      { id: -2, label: '💎 Centre', color: null },
      ...enemies.map((e) => ({ id: e.id, label: e.name, color: e.color })),
    ];
    const sig = items.map((i) => `${i.id}:${me.targetId === i.id}`).join('|');
    if (box.dataset.sig !== sig) {
      box.dataset.sig = sig;
      box.innerHTML = items.map((it) => `<button class="tbtn ${me.targetId === it.id ? 'sel' : ''}" data-t="${it.id}">
        ${it.color ? `<i class="dot" style="background:${it.color}"></i>` : ''}${it.label}</button>`).join('');
      for (const b of box.querySelectorAll('button')) {
        b.onclick = () => sendCommand({ op: 'TARGET', targetId: Number(b.dataset.t) });
      }
    }
  }

  // Liste des joueurs et PV des QG
  const rosterHtml = state.players.map((p) => {
    const hq = state.buildings.find((b) => b.owner === p.id && b.kind === 'hq');
    const pct = hq ? Math.max(0, Math.round((hq.hp / hq.maxHp) * 100)) : 0;
    return `<div class="p-row ${p.dead ? 'dead' : ''}">
      <span class="dot" style="background:${p.color}"></span>
      <span class="nm">${p.name}${p.id === myId ? ' (toi)' : ''}</span>
      <span class="hpbar"><i style="width:${pct}%;background:${pct > 45 ? '#2fbf71' : '#ff4b2b'}"></i></span>
    </div>`;
  }).join('');
  $('#uiRoster').innerHTML = rosterHtml;

  const myUnitsCount = state.units.filter((u) => u.owner === myId).length;
  $('#uiPop').textContent = `${myUnitsCount}/42 unités`;

  updateDockUI();

  // Fin de partie
  const modal = $('#endModal');
  if (state.over && modal.hidden) {
    modal.hidden = false;
    const won = me && !me.dead && me.team === state.winnerTeam;
    $('#endTitle').textContent = won ? '🏆 Victoire !' : '💥 Défaite';
    $('#endSub').textContent = won
      ? 'Ton bastion règne en maître sur l’arène !'
      : 'Ton QG a été détruit dans la bataille.';
    const ordered = state.ranking.map((id) => state.players.find((p) => p.id === id)).filter(Boolean);
    $('#endRanks').innerHTML = ordered.map((p, idx) => `<li>
      <span class="rk">${idx < 3 ? ['🥇', '🥈', '🥉'][idx] : idx + 1}</span>
      <span class="dot" style="background:${p.color}"></span>
      <span>${p.name}${p.bot ? ' 🤖' : ''}</span>
      <span class="sc">${p.score} pts</span>
    </li>`).join('');

    if (!reportedResult && (role === 'host' || role === 'solo') && window.HubBridge && HubBridge.embedded) {
      reportedResult = true;
      HubBridge.report({
        id: `bastion-${Date.now()}`,
        mode: state.mode === '2v2' ? '2v2' : 'Arène',
        players: ordered.map((p, idx) => ({
          id: p.bot ? null : p.id,
          name: p.name,
          color: p.color,
          bot: !!p.bot,
          rank: idx + 1,
          score: p.score,
        })),
      });
    }
  } else if (!state.over && !modal.hidden) {
    modal.hidden = true;
  }
}

/* ============================================================================
   RENDU GRAPHIQUE NÉO-BRUTALISTE (60 FPS)
   ============================================================================ */
function renderWorld(dt) {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = '#23442a';
  ctx.fillRect(0, 0, W, H);
  if (!state) return;

  // Déplacement caméra au clavier (ZQSD / WASD / Flèches)
  const panSpd = 640 / cam.z;
  if (keys['z'] || keys['w'] || keys['arrowup']) cam.y -= panSpd * dt;
  if (keys['s'] || keys['arrowdown']) cam.y += panSpd * dt;
  if (keys['q'] || keys['a'] || keys['arrowleft']) cam.x -= panSpd * dt;
  if (keys['d'] || keys['arrowright']) cam.x += panSpd * dt;
  cam.x = clamp(cam.x, 0, WORLD_SIZE);
  cam.y = clamp(cam.y, 0, WORLD_SIZE);

  // Secousse d'écran (Screen Shake)
  let shX = 0, shY = 0;
  if (cam.shake > 0.2) {
    shX = (Math.random() - 0.5) * cam.shake * 2;
    shY = (Math.random() - 0.5) * cam.shake * 2;
    cam.shake *= Math.pow(0.04, dt);
  } else cam.shake = 0;

  ctx.save();
  ctx.translate(W / 2 + shX, H / 2 + shY);
  ctx.scale(cam.z, cam.z);
  ctx.translate(-cam.x, -cam.y);

  // 1. Sol de l'arène & plateaux topographiques
  ctx.fillStyle = '#3a7440';
  ctx.strokeStyle = '#16181d';
  ctx.lineWidth = 8;
  ctx.fillRect(0, 0, WORLD_SIZE, WORLD_SIZE);
  ctx.strokeRect(0, 0, WORLD_SIZE, WORLD_SIZE);

  // Plateaux d'herbe plus sombre et plateau central
  ctx.fillStyle = '#316337';
  for (const sp of SPAWN_CORNERS) {
    ctx.beginPath();
    ctx.arc(sp.x, sp.y, 330, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.fillStyle = '#487f47';
  ctx.strokeStyle = '#28522d';
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.arc(HALF_W, HALF_W, 430, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();

  // Routes tactiques reliant les bases au centre
  ctx.strokeStyle = '#c8ba9b';
  ctx.lineWidth = 54;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(340, 340); ctx.lineTo(WORLD_SIZE - 340, WORLD_SIZE - 340);
  ctx.moveTo(WORLD_SIZE - 340, 340); ctx.lineTo(340, WORLD_SIZE - 340);
  ctx.stroke();
  ctx.strokeStyle = '#dfd3b8';
  ctx.lineWidth = 44;
  ctx.stroke();

  // Cratères d'explosion
  for (const c of craters) {
    ctx.fillStyle = 'rgba(22, 24, 29, 0.28)';
    ctx.beginPath();
    ctx.arc(c.x, c.y, c.r, 0, Math.PI * 2);
    ctx.fill();
  }

  // 2. Affichage des Zones d'Influence (toujours visible en léger, et mis en valeur en mode construction)
  for (const b of state.buildings) {
    if (b.hp <= 0) continue;
    const def = BUILDINGS[b.kind];
    if (!def || !def.influence) continue;
    const isMine = b.owner === myId;
    if (!isMine && !buildMode) continue;
    const owner = state.players.find((p) => p.id === b.owner);
    const col = owner ? owner.color : '#fff';
    ctx.save();
    ctx.strokeStyle = col;
    ctx.lineWidth = buildMode && isMine ? 3 : 1.5;
    ctx.globalAlpha = buildMode && isMine ? 0.55 : 0.16;
    ctx.setLineDash([12, 8]);
    ctx.lineDashOffset = -performance.now() * 0.02;
    ctx.beginPath();
    ctx.arc(b.x, b.y, def.influence, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }

  // 3. Gisements de Cristal d'Énergie & Faisceaux de récolte
  for (const b of state.buildings) {
    if (b.kind === 'extractor' && b.boost && b.crysId) {
      const cn = CRYSTAL_NODES.find((c) => c.id === b.crysId);
      if (cn) {
        ctx.strokeStyle = '#1fc7c1';
        ctx.lineWidth = 4;
        ctx.setLineDash([6, 6]);
        ctx.lineDashOffset = -performance.now() * 0.04;
        ctx.beginPath();
        ctx.moveTo(cn.x, cn.y);
        ctx.lineTo(b.x, b.y);
        ctx.stroke();
        ctx.setLineDash([]);
      }
    }
  }
  for (const cn of CRYSTAL_NODES) {
    const r = cn.rich ? 24 : 18;
    const pulse = 1 + Math.sin(performance.now() * 0.004 + cn.x) * 0.06;
    ctx.save();
    ctx.translate(cn.x, cn.y);
    ctx.scale(pulse, pulse);
    // Ombre
    ctx.fillStyle = 'rgba(22,24,29,0.35)';
    ctx.beginPath(); ctx.arc(4, 5, r, 0, Math.PI * 2); ctx.fill();
    // Cristal octogonal
    ctx.fillStyle = cn.rich ? '#ffc531' : '#1fc7c1';
    ctx.strokeStyle = '#16181d';
    ctx.lineWidth = 3.5;
    ctx.beginPath();
    for (let i = 0; i < 6; i++) {
      const a = (i / 6) * Math.PI * 2 - Math.PI / 2;
      const px = Math.cos(a) * r, py = Math.sin(a) * r;
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = '#fff8ea';
    ctx.beginPath();
    ctx.arc(-r * 0.25, -r * 0.25, r * 0.28, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  // 4. Rochers naturels
  for (const rk of ROCKS) {
    ctx.fillStyle = 'rgba(22,24,29,0.3)';
    ctx.beginPath(); ctx.arc(rk.x + 6, rk.y + 7, rk.r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#6d675c';
    ctx.strokeStyle = '#16181d';
    ctx.lineWidth = 3.5;
    ctx.beginPath(); ctx.arc(rk.x, rk.y, rk.r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#8b8477';
    ctx.beginPath(); ctx.arc(rk.x - rk.r * 0.22, rk.y - rk.r * 0.22, rk.r * 0.55, 0, Math.PI * 2); ctx.fill();
  }

  // 5. Bâtiments
  for (const b of state.buildings) {
    if (b.hp <= 0) continue;
    const owner = state.players.find((p) => p.id === b.owner);
    const col = owner ? owner.color : '#888';
    drawBuilding(ctx, b, col, owner ? owner.tier : 1);
  }

  // 6. Unités
  for (const u of state.units) {
    if (u.hp <= 0) continue;
    const owner = state.players.find((p) => p.id === u.owner);
    const col = owner ? owner.color : '#888';
    drawUnit(ctx, u, col, selectedUnits.has(u.id));
  }

  // 7. Faisceaux de tir & Éclairs Tesla
  for (let i = beams.length - 1; i >= 0; i--) {
    const bm = beams[i];
    bm.life -= dt;
    if (bm.life <= 0) { beams.splice(i, 1); continue; }
    ctx.save();
    ctx.globalAlpha = clamp(bm.life / bm.maxLife, 0, 1);
    ctx.strokeStyle = bm.color;
    ctx.lineWidth = bm.w;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(bm.x1, bm.y1);
    if (bm.tesla) {
      const mx = (bm.x1 + bm.x2) / 2 + (Math.random() - 0.5) * 28;
      const my = (bm.y1 + bm.y2) / 2 + (Math.random() - 0.5) * 28;
      ctx.lineTo(mx, my);
    }
    ctx.lineTo(bm.x2, bm.y2);
    ctx.stroke();
    ctx.restore();
  }

  // 8. Alertes de Frappes Orbitales
  for (const s of state.strikes) {
    ctx.save();
    ctx.strokeStyle = '#ff4b2b';
    ctx.fillStyle = 'rgba(255, 75, 43, 0.18)';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.arc(s.x, s.y, 165, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    const prog = clamp(1 - s.timer / 2.1, 0, 1);
    ctx.beginPath();
    ctx.arc(s.x, s.y, 165 * (1 - prog), 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }

  // 9. Particules
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= dt;
    if (p.life <= 0) { particles.splice(i, 1); continue; }
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    ctx.fillStyle = p.color;
    ctx.strokeStyle = '#16181d';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
  }

  // 10. Anneau de Tempête Magnétique (Mort Subite)
  if (state.phase === 4) {
    ctx.save();
    ctx.strokeStyle = '#ff4b2b';
    ctx.lineWidth = 10;
    ctx.setLineDash([24, 14]);
    ctx.beginPath();
    ctx.arc(HALF_W, HALF_W, state.stormRadius, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }

  // 11. Aperçu fantôme du bâtiment sous le curseur (Placement libre sans grille)
  if (buildMode) {
    const def = BUILDINGS[buildMode];
    const check = canPlaceBuilding(state, myId, buildMode, mouse.wx, mouse.wy);
    ctx.save();
    // Rayon de portée ou d'influence du futur bâtiment
    const showR = def.range || def.influence;
    if (showR) {
      ctx.strokeStyle = check.ok ? '#2fbf71' : '#ff4b2b';
      ctx.lineWidth = 2;
      ctx.setLineDash([8, 6]);
      ctx.beginPath();
      ctx.arc(mouse.wx, mouse.wy, showR, 0, Math.PI * 2);
      ctx.stroke();
      ctx.setLineDash([]);
    }
    // Lien avec un cristal si c'est un extracteur
    if (buildMode === 'extractor') {
      const cn = nearestCrystal(mouse.wx, mouse.wy);
      if (cn) {
        ctx.strokeStyle = '#ffc531';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(cn.x, cn.y);
        ctx.lineTo(mouse.wx, mouse.wy);
        ctx.stroke();
      }
    }
    ctx.fillStyle = check.ok ? 'rgba(47, 191, 113, 0.38)' : 'rgba(255, 75, 43, 0.42)';
    ctx.strokeStyle = check.ok ? '#2fbf71' : '#ff4b2b';
    ctx.lineWidth = 3.5;
    ctx.beginPath();
    ctx.arc(mouse.wx, mouse.wy, def.radius, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    ctx.restore();
  } else if (strikeMode) {
    ctx.save();
    ctx.strokeStyle = '#ff4b2b';
    ctx.fillStyle = 'rgba(255, 75, 43, 0.22)';
    ctx.lineWidth = 3.5;
    ctx.beginPath();
    ctx.arc(mouse.wx, mouse.wy, 165, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    ctx.restore();
  }

  // 12. Rectangle de sélection à la souris
  if (mouse.down && mouse.dragStart) {
    ctx.save();
    ctx.strokeStyle = '#ffc531';
    ctx.fillStyle = 'rgba(255, 197, 49, 0.15)';
    ctx.lineWidth = 2.5 / cam.z;
    const rx = Math.min(mouse.dragStart.wx, mouse.wx);
    const ry = Math.min(mouse.dragStart.wy, mouse.wy);
    const rw = Math.abs(mouse.wx - mouse.dragStart.wx);
    const rh = Math.abs(mouse.wy - mouse.dragStart.wy);
    ctx.fillRect(rx, ry, rw, rh);
    ctx.strokeRect(rx, ry, rw, rh);
    ctx.restore();
  }

  ctx.restore();
  renderMinimap();
}

function drawBuilding(g, b, color, tier) {
  const r = b.radius;
  g.save();
  g.translate(b.x, b.y);

  // Ombre portée nette style BD
  g.fillStyle = 'rgba(22,24,29,0.35)';
  g.beginPath();
  g.arc(5, 6, r, 0, Math.PI * 2);
  g.fill();

  g.strokeStyle = '#16181d';
  g.lineWidth = 3.5;

  if (b.kind === 'hq') {
    // Bastion octogonal/carré arrondi massif
    g.fillStyle = color;
    g.beginPath();
    g.roundRect(-r, -r, r * 2, r * 2, 12);
    g.fill();
    g.stroke();
    g.fillStyle = '#fff8ea';
    g.beginPath();
    g.roundRect(-r * 0.56, -r * 0.56, r * 1.12, r * 1.12, 6);
    g.fill();
    g.stroke();
    // Étoiles de niveau (Tier 1..3)
    g.fillStyle = '#ffc531';
    g.beginPath();
    g.arc(0, 0, 8 + tier * 2.5, 0, Math.PI * 2);
    g.fill();
    g.stroke();
  } else if (b.kind === 'extractor') {
    g.fillStyle = '#fff8ea';
    g.beginPath();
    g.arc(0, 0, r, 0, Math.PI * 2);
    g.fill();
    g.stroke();
    g.fillStyle = b.boost ? '#1fc7c1' : color;
    g.beginPath();
    g.arc(0, 0, r * 0.58, 0, Math.PI * 2);
    g.fill();
    g.stroke();
  } else if (b.kind === 'pylon') {
    g.fillStyle = color;
    g.beginPath();
    g.moveTo(0, -r); g.lineTo(r, r * 0.75); g.lineTo(-r, r * 0.75);
    g.closePath();
    g.fill();
    g.stroke();
    g.fillStyle = '#ffc531';
    g.beginPath();
    g.arc(0, 0, 6, 0, Math.PI * 2);
    g.fill();
    g.stroke();
  } else if (b.kind === 'barracks' || b.kind === 'factory') {
    g.fillStyle = b.kind === 'factory' ? '#16181d' : '#f3e9d2';
    g.beginPath();
    g.roundRect(-r, -r * 0.82, r * 2, r * 1.64, 8);
    g.fill();
    g.stroke();
    g.fillStyle = color;
    g.beginPath();
    g.roundRect(-r * 0.65, -r * 0.45, r * 1.3, r * 0.9, 4);
    g.fill();
    g.stroke();
  } else if (b.kind === 'turret' || b.kind === 'tesla') {
    g.fillStyle = '#f3e9d2';
    g.beginPath();
    g.arc(0, 0, r, 0, Math.PI * 2);
    g.fill();
    g.stroke();
    g.fillStyle = b.kind === 'tesla' ? '#1fc7c1' : color;
    g.beginPath();
    g.arc(0, 0, r * 0.52, 0, Math.PI * 2);
    g.fill();
    g.stroke();
  } else if (b.kind === 'wall') {
    g.fillStyle = '#c8ba9b';
    g.beginPath();
    g.roundRect(-r, -r, r * 2, r * 2, 6);
    g.fill();
    g.stroke();
    g.fillStyle = color;
    g.fillRect(-r * 0.5, -3, r, 6);
  }

  // Barre de vie si endommagé (ou toujours sur les QG)
  if (b.hp < b.maxHp || b.kind === 'hq') {
    const bw = r * 1.9, bh = 6;
    const pct = clamp(b.hp / b.maxHp, 0, 1);
    g.fillStyle = '#16181d';
    g.fillRect(-bw / 2 - 1, -r - 13, bw + 2, bh + 2);
    g.fillStyle = pct > 0.45 ? '#2fbf71' : '#ff4b2b';
    g.fillRect(-bw / 2, -r - 12, bw * pct, bh);
  }
  g.restore();
}

function drawUnit(g, u, color, selected) {
  const r = u.radius;
  g.save();
  g.translate(u.x, u.y);

  if (selected) {
    g.strokeStyle = '#ffc531';
    g.lineWidth = 2.5;
    g.beginPath();
    g.arc(0, 0, r + 6, 0, Math.PI * 2);
    g.stroke();
  }

  // Ombre
  g.fillStyle = 'rgba(22,24,29,0.3)';
  g.beginPath();
  g.arc(3, 4, r, 0, Math.PI * 2);
  g.fill();

  g.save();
  g.rotate(u.a);
  g.strokeStyle = '#16181d';
  g.lineWidth = 2.5;

  if (u.kind === 'tank' || u.kind === 'siege' || u.kind === 'titan') {
    g.fillStyle = color;
    g.beginPath();
    g.roundRect(-r, -r * 0.78, r * 2, r * 1.56, 5);
    g.fill();
    g.stroke();
    // Canon
    g.fillStyle = '#16181d';
    g.fillRect(0, -3.5, r + 8, 7);
    g.fillStyle = '#fff8ea';
    g.beginPath();
    g.arc(0, 0, r * 0.42, 0, Math.PI * 2);
    g.fill();
    g.stroke();
  } else {
    g.fillStyle = color;
    g.beginPath();
    g.arc(0, 0, r, 0, Math.PI * 2);
    g.fill();
    g.stroke();
    // Arme
    g.fillStyle = u.kind === 'sapper' ? '#ffc531' : '#16181d';
    g.fillRect(2, -2.5, r + 4, 5);
  }
  g.restore();

  if (u.hp < u.maxHp) {
    const bw = r * 2.1, pct = clamp(u.hp / u.maxHp, 0, 1);
    g.fillStyle = '#16181d';
    g.fillRect(-bw / 2 - 1, -r - 9, bw + 2, 5);
    g.fillStyle = '#2fbf71';
    g.fillRect(-bw / 2, -r - 8, bw * pct, 3);
  }
  g.restore();
}

function renderMinimap() {
  if (!state) return;
  const mw = miniCvs.width, mh = miniCvs.height;
  const sc = mw / WORLD_SIZE;
  miniCtx.fillStyle = '#23442a';
  miniCtx.fillRect(0, 0, mw, mh);

  // Cristaux
  miniCtx.fillStyle = '#1fc7c1';
  for (const cn of CRYSTAL_NODES) {
    miniCtx.fillRect(cn.x * sc - 2, cn.y * sc - 2, 4, 4);
  }
  // Bâtiments
  for (const b of state.buildings) {
    const owner = state.players.find((p) => p.id === b.owner);
    miniCtx.fillStyle = owner ? owner.color : '#fff';
    const sz = b.kind === 'hq' ? 6 : 3.5;
    miniCtx.fillRect(b.x * sc - sz / 2, b.y * sc - sz / 2, sz, sz);
  }
  // Unités
  for (const u of state.units) {
    const owner = state.players.find((p) => p.id === u.owner);
    miniCtx.fillStyle = owner ? owner.color : '#fff';
    miniCtx.fillRect(u.x * sc - 1.2, u.y * sc - 1.2, 2.4, 2.4);
  }
  // Cadre de la caméra
  const vw = (W / cam.z) * sc, vh = (H / cam.z) * sc;
  miniCtx.strokeStyle = '#fff8ea';
  miniCtx.lineWidth = 1.5;
  miniCtx.strokeRect(cam.x * sc - vw / 2, cam.y * sc - vh / 2, vw, vh);
}

/* ============================================================================
   DÉMARRAGE DE PARTIE & SYNCHRONISATION RÉSEAU (HUB BRIDGE)
   ============================================================================ */
let lastBootInfo = null;
let tickInterval = null;
let botInterval = null;

function startMatch(info) {
  lastBootInfo = info;
  reportedResult = false;
  selectedUnits.clear();
  buildMode = null;
  strikeMode = false;
  craters = [];
  particles = [];
  beams = [];

  clearInterval(tickInterval);
  clearInterval(botInterval);

  const H = window.HubBridge;
  role = H && H.embedded ? info.role : 'solo';
  myId = H && H.embedded ? info.myId : 0;

  if (role === 'guest') {
    // L'invité demande l'état initial à l'hôte
    H.send('host', { t: 'sync' });
    return;
  }

  // Construction de la liste des joueurs (humains du salon + bots pour compléter jusqu'à 4)
  const settings = (info && info.settings) || { mode: 'ffa', pace: 'standard', bots: 1, level: 'normal' };
  const humans = H && H.embedded && Array.isArray(H.players) && H.players.length
    ? H.players.map((p) => ({ id: p.id, name: p.name, color: p.color, bot: false }))
    : [{ id: 0, name: 'Commandant', color: PALETTE[0], bot: false }];

  const roster = [...humans];
  const wantBots = role === 'solo'
    ? Math.max(1, Math.min(3, Number(settings.bots ?? 1)))
    : Math.max(0, Math.min(Number(settings.bots ?? 1), 4 - roster.length));
  const finalBots = roster.length + wantBots < 2 ? 2 - roster.length : wantBots;
  const usedColors = new Set(roster.map((p) => p.color));

  for (let k = 0; k < finalBots && roster.length < 4; k++) {
    const col = PALETTE.find((c) => !usedColors.has(c)) || PALETTE[(roster.length) % PALETTE.length];
    usedColors.add(col);
    roster.push({ id: 100 + k, name: BOT_NAMES[k], color: col, bot: true });
  }

  state = createInitialState(roster, settings);
  centerOnMyHq();
  updateHudUI();

  if (role === 'host' && H && H.embedded) {
    H.send('all', { t: 'st', s: state, fx: [] });
  }

  // Boucle de simulation autoritaire à 20 Hz (50 ms)
  tickInterval = setInterval(() => {
    if (!state || state.over) return;
    const fx = [];
    stepWorld(state, TICK_DT, fx);
    handleFxEvents(fx);
    if (role === 'host' && H && H.embedded) {
      H.send('all', { t: 'st', s: state, fx });
    }
  }, 1000 / TICK_RATE);

  // Boucle de décision des bots (toutes les 1.4 s)
  const botEvery = settings.level === 'expert' ? 950 : settings.level === 'facile' ? 2200 : 1400;
  botInterval = setInterval(() => {
    if (!state || state.over) return;
    const fx = [];
    runBots(state, fx);
    handleFxEvents(fx);
  }, botEvery);
}

// Branchement sur HubBridge
if (window.HubBridge && HubBridge.embedded) {
  let centeredOnce = false;
  HubBridge.on('init', (info) => {
    startMatch(info);
    HubBridge.signalReady();
  });
  HubBridge.on('msg', (from, m) => {
    if (!m || typeof m !== 'object') return;
    if (role === 'host') {
      if (m.t === 'sync' && state) {
        HubBridge.send(from, { t: 'st', s: state, fx: [] });
      } else if (m.t === 'cmd' && m.cmd) {
        const fx = [];
        executeCommand(state, from, m.cmd, fx);
        handleFxEvents(fx);
      }
    } else if (role === 'guest' && from === HubBridge.info.hostId) {
      if (m.t === 'st' && m.s) {
        state = m.s;
        if (!centeredOnce) { centeredOnce = true; centerOnMyHq(); }
        if (m.fx) handleFxEvents(m.fx);
      }
    }
  });
} else {
  startMatch({ role: 'solo', myId: 0, settings: { mode: 'ffa', pace: 'standard', bots: 1, level: 'normal' } });
}

// Boucle de rendu 60 FPS
let lastFrame = performance.now();
function loop(now) {
  const dt = Math.min(0.05, Math.max(0.001, (now - lastFrame) / 1000));
  lastFrame = now;
  renderWorld(dt);
  updateHudUI();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
