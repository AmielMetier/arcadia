   ============================================================================ */
let terrainCanvas = null;

function drawTree(g, x, y, r, cols, rnd) {
  g.save();
  g.fillStyle = 'rgba(16, 20, 24, 0.32)';
  g.beginPath(); g.arc(x + 6, y + 7, r * 1.02, 0, TAU); g.fill();
  const c0 = cols[(rnd() * cols.length) | 0];
  g.fillStyle = c0;
  g.strokeStyle = '#16181d';
  g.lineWidth = 3;
  for (let k = 0; k < 5; k++) {
    const a = (k / 5) * TAU + rnd() * 0.3;
    const lx = x + Math.cos(a) * r * 0.38;
    const ly = y + Math.sin(a) * r * 0.38;
    g.beginPath(); g.arc(lx, ly, r * 0.68, 0, TAU); g.fill(); g.stroke();
  }
  g.beginPath(); g.arc(x, y, r * 0.78, 0, TAU); g.fill(); g.stroke();
  g.fillStyle = shade(c0, 0.22);
  g.beginPath(); g.arc(x - r * 0.22, y - r * 0.22, r * 0.42, 0, TAU); g.fill();
  g.restore();
}

function buildTerrainCanvas() {
  const c = document.createElement('canvas');
  c.width = WORLD_SIZE;
  c.height = WORLD_SIZE;
  const g = c.getContext('2d');
  const rnd = mulberry(20261019);

  g.fillStyle = '#386f3e';
  g.fillRect(0, 0, WORLD_SIZE, WORLD_SIZE);

  for (let k = 0; k < 65; k++) {
    const bx = rnd() * WORLD_SIZE, by = rnd() * WORLD_SIZE, br = 90 + rnd() * 190;
    g.fillStyle = rnd() < 0.5 ? 'rgba(38, 84, 44, 0.38)' : 'rgba(76, 138, 72, 0.26)';
    g.beginPath(); g.arc(bx, by, br, 0, TAU); g.fill();
  }
  for (let k = 0; k < 10000; k++) {
    g.fillStyle = rnd() < 0.5 ? 'rgba(22, 50, 28, 0.22)' : 'rgba(135, 190, 105, 0.18)';
    g.fillRect(rnd() * WORLD_SIZE, rnd() * WORLD_SIZE, 2 + rnd() * 3.5, 2 + rnd() * 3.5);
  }

  // Rivière sinueuse
  const riverPath = new Path2D();
  riverPath.moveTo(0, HALF_W - 180);
  riverPath.bezierCurveTo(WORLD_SIZE * 0.33, HALF_W + 220, WORLD_SIZE * 0.66, HALF_W - 220, WORLD_SIZE, HALF_W + 180);
  g.lineCap = 'round';
  g.strokeStyle = '#16181d'; g.lineWidth = 122; g.stroke(riverPath);
  g.strokeStyle = '#c8ba9b'; g.lineWidth = 110; g.stroke(riverPath);
  g.strokeStyle = '#246b96'; g.lineWidth = 84; g.stroke(riverPath);
  g.strokeStyle = '#328bc2'; g.lineWidth = 60; g.stroke(riverPath);

  // Routes tactiques asphaltées
  const drawRoad = (x1, y1, x2, y2, width = 72) => {
    g.save();
    g.lineCap = 'round';
    g.strokeStyle = '#16181d'; g.lineWidth = width + 16;
    g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.stroke();
    g.strokeStyle = '#f3e9d2'; g.lineWidth = width + 8;
    g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.stroke();
    g.strokeStyle = '#484b54'; g.lineWidth = width - 4;
    g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.stroke();
    g.strokeStyle = 'rgba(255, 248, 234, 0.5)'; g.lineWidth = 3;
    g.setLineDash([20, 20]);
    g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.stroke();
    g.restore();
  };

  drawRoad(360, 360, WORLD_SIZE - 360, WORLD_SIZE - 360, 72);
  drawRoad(WORLD_SIZE - 360, 360, 360, WORLD_SIZE - 360, 72);
  drawRoad(360, 360, WORLD_SIZE - 360, 360, 50);
  drawRoad(360, WORLD_SIZE - 360, WORLD_SIZE - 360, WORLD_SIZE - 360, 50);
  drawRoad(360, 360, 360, WORLD_SIZE - 360, 50);
  drawRoad(WORLD_SIZE - 360, 360, WORLD_SIZE - 360, WORLD_SIZE - 360, 50);

  // Plateformes de bases principales
  SPAWN_CORNERS.forEach((sp) => {
    g.save();
    g.translate(sp.x, sp.y);
    g.fillStyle = '#535763';
    g.strokeStyle = '#16181d';
    g.lineWidth = 5;
    g.beginPath(); g.arc(0, 0, 215, 0, TAU); g.fill(); g.stroke();
    g.fillStyle = '#626775';
    g.beginPath(); g.arc(0, 0, 175, 0, TAU); g.fill(); g.stroke();
    g.strokeStyle = '#ffc531';
    g.lineWidth = 4.5;
    g.setLineDash([18, 14]);
    g.beginPath(); g.arc(0, 0, 195, 0, TAU); g.stroke();
    g.restore();
  });

  // Citadelle Centrale (Gold Base)
  g.save();
  g.translate(HALF_W, HALF_W);
  g.fillStyle = '#585c69';
  g.strokeStyle = '#16181d';
  g.lineWidth = 6;
  g.beginPath(); g.arc(0, 0, 340, 0, TAU); g.fill(); g.stroke();
  g.fillStyle = '#454954';
  g.beginPath(); g.arc(0, 0, 275, 0, TAU); g.fill(); g.stroke();
  g.strokeStyle = '#ffc531';
  g.lineWidth = 4;
  g.setLineDash([22, 14]);
  g.beginPath(); g.arc(0, 0, 115, 0, TAU); g.stroke();
  g.restore();

  // Arbres décoratifs hors zones de jeu
  const treeColors = ['#2d6632', '#39783c', '#245429', '#468a44'];
  for (let k = 0; k < 180; k++) {
    const tx = 45 + rnd() * (WORLD_SIZE - 90);
    const ty = 45 + rnd() * (WORLD_SIZE - 90);
    const nearBase = SPAWN_CORNERS.some((s) => hypot(tx, ty, s.x, s.y) < 330);
    const nearCenter = hypot(tx, ty, HALF_W, HALF_W) < 410;
    const nearDiag1 = Math.abs(tx - ty) < 120;
    const nearDiag2 = Math.abs(tx + ty - WORLD_SIZE) < 120;
    const nearRes = MINERAL_NODES.some((m) => hypot(tx, ty, m.x, m.y) < 95) || GAS_GEYSERS.some((ge) => hypot(tx, ty, ge.x, ge.y) < 110);
    if (nearBase || nearCenter || nearDiag1 || nearDiag2 || nearRes) continue;
    drawTree(g, tx, ty, 17 + rnd() * 13, treeColors, rnd);
  }

  g.strokeStyle = '#16181d';
  g.lineWidth = 18;
  g.strokeRect(9, 9, WORLD_SIZE - 18, WORLD_SIZE - 18);
  terrainCanvas = c;
}

/* ============================================================================
   AUDIO SYNTHÉTISÉ (WebAudio)
   ============================================================================ */
const Sfx = (() => {
  let ctx = null, muted = false;
  function ensure() {
    if (muted) return null;
    if (!ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) ctx = new AC();
    }
    if (ctx && ctx.state === 'suspended') ctx.resume().catch(() => {});
    return ctx;
  }
  function tone(freq, dur, type = 'triangle', vol = 0.11, slide = 0) {
    const c = ensure(); if (!c) return;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type;
    const t = c.currentTime;
    o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(c.destination);
    o.start(t); o.stop(t + dur);
  }
  return {
    get muted() { return muted; },
    toggle() { muted = !muted; return muted; },
    build()   { tone(320, 0.1, 'square', 0.09, 160); setTimeout(() => tone(520, 0.12, 'triangle', 0.1, 100), 55); },
    spawn()   { tone(280, 0.1, 'sawtooth', 0.08, 130); },
    order()   { tone(520, 0.07, 'sine', 0.09, 110); },
    attack()  { tone(380, 0.09, 'sawtooth', 0.1, -110); },
    stim()    { tone(440, 0.12, 'sawtooth', 0.12, 340); },
    siege()   { tone(180, 0.22, 'square', 0.12, -60); setTimeout(() => tone(290, 0.15, 'triangle', 0.1, 80), 120); },
    scan()    { tone(680, 0.25, 'sine', 0.11, 260); },
    shoot()   { tone(190 + Math.random() * 60, 0.05, 'sawtooth', 0.03, -85); },
    plasma()  { tone(620, 0.13, 'sine', 0.06, -400); },
    boom()    { tone(110, 0.3, 'sawtooth', 0.15, -75); },
    error()   { tone(155, 0.15, 'sawtooth', 0.11, -35); },
  };
})();

/* ============================================================================
   RÈGLES DE PLACEMENT & RAVITAILLEMENT STARCRAFT
   ============================================================================ */
function computeSupply(state, ownerId) {
  let used = 0, max = 0;
  for (const b of state.buildings) {
    if (b.owner === ownerId && b.hp > 0 && !b.constructing) {
      max += BUILDINGS[b.kind]?.supply || 0;
    }
  }
  for (const u of state.units) {
    if (u.owner === ownerId && u.hp > 0) {
      used += UNITS[u.kind]?.supply || 1;
    }
  }
  for (const b of state.buildings) {
    if (b.owner === ownerId && b.hp > 0 && Array.isArray(b.queue)) {
      for (const qKind of b.queue) used += UNITS[qKind]?.supply || 1;
    }
  }
  return { used, max: Math.min(MAX_SUPPLY, max) };
}

function findGeyserAt(x, y, maxDist = 56) {
  let best = null, bestD2 = maxDist * maxDist;
  for (const g of GAS_GEYSERS) {
    const d2 = dist2(x, y, g.x, g.y);
    if (d2 <= bestD2) { bestD2 = d2; best = g; }
  }
  return best;
}

function hasCompletedBuilding(state, ownerId, kind) {
  return state.buildings.some((b) => b.owner === ownerId && b.kind === kind && b.hp > 0 && !b.constructing);
}

function canPlaceBuilding(state, ownerId, kind, x, y) {
  const def = BUILDINGS[kind];
  if (!def) return { ok: false, reason: 'Bâtiment inconnu.' };
  const player = state.players.find((p) => p.id === ownerId);
  if (!player || player.dead) return { ok: false, reason: 'Joueur éliminé.' };
  if (def.req && !hasCompletedBuilding(state, ownerId, def.req)) {
    return { ok: false, reason: `Requiert d’abord : ${BUILDINGS[def.req].name}.` };
  }
  if (player.minerals < def.min) return { ok: false, reason: `Pas assez de Minéraux (${def.min}💎 requis).` };
  if (player.gas < def.gas) return { ok: false, reason: `Pas assez de Gaz Plasma (${def.gas}🧪 requis).` };

  // Cas particulier : Raffinerie doit être posée sur un Geyser de Gaz libre
  if (def.onGeyser) {
    const gey = findGeyserAt(x, y, 64);
    if (!gey) return { ok: false, reason: 'La Raffinerie doit être placée sur un Geyser de Gaz Plasma 🧪.' };
    const taken = state.buildings.some((b) => b.hp > 0 && dist2(b.x, b.y, gey.x, gey.y) < 35 * 35);
    if (taken) return { ok: false, reason: 'Ce Geyser de Gaz est déjà exploité.' };
    return { ok: true, snapX: gey.x, snapY: gey.y, geyserId: gey.id };
  }

  const margin = def.radius + 32;
  if (x < margin || y < margin || x > WORLD_SIZE - margin || y > WORLD_SIZE - margin) {
    return { ok: false, reason: 'Trop près du bord de la carte.' };
  }

  const pad = kind === 'wall' ? 2 : 8;
  for (const b of state.buildings) {
    if (b.hp <= 0) continue;
    const minDist = def.radius + b.radius + pad;
    if (dist2(x, y, b.x, b.y) < minDist * minDist) {
      return { ok: false, reason: 'Emplacement occupé par un bâtiment.' };
    }
  }
  for (const rk of ROCKS) {
    if (dist2(x, y, rk.x, rk.y) < (def.radius + rk.r + 6) ** 2) {
      return { ok: false, reason: 'Obstacle rocheux.' };
    }
  }
  for (const m of MINERAL_NODES) {
    const minD = kind === 'hq' ? def.radius + 45 : def.radius + 22;
    if (dist2(x, y, m.x, m.y) < minD * minD) {
      return { ok: false, reason: 'Trop près des gisements de minéraux.' };
    }
  }
  for (const gey of GAS_GEYSERS) {
    if (dist2(x, y, gey.x, gey.y) < (def.radius + 28) ** 2) {
      return { ok: false, reason: 'Réservé aux Raffineries de Gaz.' };
    }
  }
  return { ok: true, snapX: Math.round(x), snapY: Math.round(y) };
}

function nearestMineral(x, y, maxDist = 2000) {
  let best = null, bestD2 = maxDist * maxDist;
  for (const m of MINERAL_NODES) {
    const d2 = dist2(x, y, m.x, m.y);
    if (d2 < bestD2) { bestD2 = d2; best = m; }
  }
  return best;
}

function nearestMyHq(state, ownerId, x, y) {
  let best = null, bestD2 = Infinity;
  for (const b of state.buildings) {
    if (b.owner === ownerId && b.kind === 'hq' && b.hp > 0 && !b.constructing) {
      const d2 = dist2(x, y, b.x, b.y);
      if (d2 < bestD2) { bestD2 = d2; best = b; }
    }
  }
  return best;
}

/* ============================================================================
   CRÉATION DE L'ÉTAT INITIAL RTS (QG + 6 OUVRIERS VCS EN RÉCOLTE)
   ============================================================================ */
function createInitialState(roster, settings) {
  const is2v2 = settings.mode === '2v2' && roster.length >= 2;
  const blitz = settings.pace === 'blitz';
  const players = roster.map((p, idx) => {
    const team = is2v2 ? (idx % 2) : p.id;
    return {
      id: p.id,
      name: p.name,
      color: p.color || PALETTE[idx % PALETTE.length],
      bot: !!p.bot,
      team,
      minerals: blitz ? 300 : 200,
      gas: blitz ? 100 : 50,
      dead: false,
      score: 0,
    };
  });

  let nextId = 1;
  const buildings = [];
  const units = [];

  players.forEach((p, idx) => {
    const sp = SPAWN_CORNERS[idx % 4];
    const dirX = Math.sign(HALF_W - sp.x), dirY = Math.sign(HALF_W - sp.y);
    // Centre de Commandement principal
    const hq = {
      id: nextId++, kind: 'hq', owner: p.id, team: p.team,
      x: sp.x, y: sp.y, hp: BUILDINGS.hq.hp, maxHp: BUILDINGS.hq.hp,
      radius: BUILDINGS.hq.radius, cd: 0, aimA: Math.atan2(dirY, dirX),
      constructing: false, buildProg: 1, queue: [], qTimer: 0, qTotal: 0,
      rallyX: sp.x + dirX * 115, rallyY: sp.y + dirY * 115,
    };
    buildings.push(hq);

    // 6 Ouvriers VCS assignés aux minéraux de départ
    const baseMinerals = MINERAL_NODES.filter((m) => hypot(m.x, m.y, sp.x, sp.y) < 220);
    for (let k = 0; k < 6; k++) {
      const mNode = baseMinerals[k % baseMinerals.length];
      const ang = Math.atan2((mNode ? mNode.y : sp.y) - sp.y, (mNode ? mNode.x : sp.x) - sp.x);
      units.push({
        id: nextId++, kind: 'scv', owner: p.id, team: p.team,
        x: Math.round(sp.x + Math.cos(ang) * 66 + (k - 2.5) * 14),
        y: Math.round(sp.y + Math.sin(ang) * 66 + (k - 2.5) * 14),
        vx: 0, vy: 0, a: ang,
        hp: UNITS.scv.hp, maxHp: UNITS.scv.hp, radius: UNITS.scv.radius,
        cd: 0, mode: 'harvest_min',
        harvestId: mNode ? mNode.id : null,
        gatherT: 0, carryType: null, carryAmt: 0,
        buildTargetId: null, orderX: null, orderY: null, targetEntId: null,
        stimT: 0, sieged: false,
      });
    }

    // 2 Marines d'escorte initiale
    for (let k = 0; k < 2; k++) {
      units.push({
        id: nextId++, kind: 'marine', owner: p.id, team: p.team,
        x: sp.x + dirX * (95 + k * 22), y: sp.y + dirY * (75 - k * 20),
        vx: 0, vy: 0, a: Math.atan2(dirY, dirX),
        hp: UNITS.marine.hp, maxHp: UNITS.marine.hp, radius: UNITS.marine.radius,
        cd: 0, mode: 'idle', orderX: null, orderY: null, targetEntId: null,
        stimT: 0, sieged: false,
      });
    }
  });

  return {
    time: 0,
    blitz,
    mode: is2v2 ? '2v2' : 'ffa',
    level: settings.level || 'normal',
    phase: 1,
    stormRadius: HALF_W * 1.45,
    dmgMult: 1.0,
    nextId,
    players,
    buildings,
    units,
    scans: [],
    over: false,
    winnerTeam: null,
    ranking: [],
  };
}

/* ============================================================================
   EXÉCUTION DES COMMANDES RTS (SERVEUR AUTORITAIRE / HÔTE)
   ============================================================================ */
function spawnTrainedUnit(state, owner, bld, kind, fxEvents) {
  const def = UNITS[kind];
  if (!def) return;
  const rx = bld.rallyX ?? (bld.x + Math.sign(HALF_W - bld.x) * 110);
  const ry = bld.rallyY ?? (bld.y + Math.sign(HALF_W - bld.y) * 110);
  const angle = Math.atan2(ry - bld.y, rx - bld.x);
  const jitter = (Math.random() - 0.5) * 32;
  const ux = clamp(bld.x + Math.cos(angle) * (bld.radius + def.radius + 10) - Math.sin(angle) * jitter, 30, WORLD_SIZE - 30);
  const uy = clamp(bld.y + Math.sin(angle) * (bld.radius + def.radius + 10) + Math.cos(angle) * jitter, 30, WORLD_SIZE - 30);

  const u = {
    id: state.nextId++,
    kind,
    owner: owner.id,
    team: owner.team,
    x: ux,
    y: uy,
    vx: 0,
    vy: 0,
    a: angle,
    hp: def.hp,
    maxHp: def.hp,
    radius: def.radius,
    cd: 0,
    mode: 'amove',
    orderX: rx + (Math.random() - 0.5) * 28,
    orderY: ry + (Math.random() - 0.5) * 28,
    targetEntId: null,
    harvestId: null,
    gatherT: 0,
    carryType: null,
    carryAmt: 0,
    buildTargetId: null,
    stimT: 0,
    sieged: false,
  };

  // Si c'est un Ouvrier VCS produit par un QG, il part automatiquement miner le cristal le plus proche du point de ralliement !
  if (kind === 'scv') {
    const m = nearestMineral(rx, ry, 260) || nearestMineral(bld.x, bld.y, 350);
    if (m) {
      u.mode = 'harvest_min';
      u.harvestId = m.id;
      u.orderX = null;
      u.orderY = null;
    }
  }
  state.units.push(u);
  fxEvents.push({ k: 'SPAWN', x: ux, y: uy, color: owner.color });
}

function executeCommand(state, playerId, cmd, fxEvents) {
  if (state.over || !cmd || typeof cmd !== 'object') return { ok: false };
  const p = state.players.find((q) => q.id === playerId);
  if (!p || p.dead) return { ok: false };

  // 1. POSER UN CHANTIER DE CONSTRUCTION (un VCS va le construire)
  if (cmd.op === 'BUILD') {
    const kind = String(cmd.kind || '');
    const check = canPlaceBuilding(state, p.id, kind, Number(cmd.x) || 0, Number(cmd.y) || 0);
    if (!check.ok) return check;
    const def = BUILDINGS[kind];
    p.minerals -= def.min;
    p.gas -= def.gas;
    const bx = check.snapX, by = check.snapY;
    const bld = {
      id: state.nextId++,
      kind,
      owner: p.id,
      team: p.team,
      x: bx,
      y: by,
      hp: Math.round(def.hp * 0.15),
      maxHp: def.hp,
      radius: def.radius,
      cd: 0,
      aimA: Math.atan2(HALF_W - by, HALF_W - bx),
      constructing: true,
      buildProg: 0,
      buildTime: state.blitz ? def.buildTime * 0.65 : def.buildTime,
      queue: [],
      qTimer: 0,
      qTotal: 0,
      rallyX: bx + Math.sign(HALF_W - bx) * 115,
      rallyY: by + Math.sign(HALF_W - by) * 115,
      geyserId: check.geyserId || null,
    };
    state.buildings.push(bld);
    p.score += Math.round((def.min + def.gas) * 0.35);

    // Envoyer un Ouvrier VCS sélectionné ou le VCS le plus proche construire ce chantier
    let builder = null;
    if (Array.isArray(cmd.unitIds) && cmd.unitIds.length) {
      builder = state.units.find((u) => u.owner === p.id && u.kind === 'scv' && cmd.unitIds.includes(u.id));
    }
    if (!builder) {
      let bestD2 = Infinity;
      for (const u of state.units) {
        if (u.owner === p.id && u.kind === 'scv' && u.mode !== 'build') {
          const d2 = dist2(u.x, u.y, bx, by);
          if (d2 < bestD2) { bestD2 = d2; builder = u; }
        }
      }
    }
    if (builder) {
      builder.mode = 'build';
      builder.buildTargetId = bld.id;
      builder.orderX = bx;
      builder.orderY = by;
    }
    fxEvents.push({ k: 'BUILD', x: bx, y: by, color: p.color, radius: def.radius });
    return { ok: true, bldId: bld.id };
  }

  // 2. ENTRAÎNER UNE UNITÉ DANS LA FILE D'ATTENTE D'UN BÂTIMENT
  if (cmd.op === 'TRAIN') {
    const uKind = String(cmd.unit || '');
    const uDef = UNITS[uKind];
    if (!uDef) return { ok: false, reason: 'Unité inconnue.' };
    const sup = computeSupply(state, p.id);
    if (sup.used + uDef.supply > sup.max) {
      return { ok: false, reason: 'Ravitaillement insuffisant 📦 ! Construis un Dépôt Relais.' };
    }
    if (p.minerals < uDef.min) return { ok: false, reason: `Minéraux insuffisants (${uDef.min}💎).` };
    if (p.gas < uDef.gas) return { ok: false, reason: `Gaz Plasma insuffisant (${uDef.gas}🧪).` };

    // Trouver le bâtiment producteur (spécifié ou le moins chargé du joueur)
    let candidates = state.buildings.filter((b) =>
      b.owner === p.id && b.hp > 0 && !b.constructing && (BUILDINGS[b.kind]?.trains || []).includes(uKind)
    );
    if (cmd.bldId) {
      const specific = candidates.find((b) => b.id === cmd.bldId);
      if (specific && specific.queue.length < 5) candidates = [specific];
    }
    candidates = candidates.filter((b) => b.queue.length < 5);
    if (!candidates.length) {
      return { ok: false, reason: 'Aucun bâtiment disponible ou file de production pleine (5/5).' };
    }
    candidates.sort((a, b) => a.queue.length - b.queue.length);
    const producer = candidates[0];
    p.minerals -= uDef.min;
    p.gas -= uDef.gas;
    producer.queue.push(uKind);
    if (producer.queue.length === 1) {
      producer.qTotal = state.blitz ? uDef.trainTime * 0.65 : uDef.trainTime;
      producer.qTimer = producer.qTotal;
    }
    p.score += Math.round((uDef.min + uDef.gas) * 0.25);
    return { ok: true };
  }

  // 3. ANNULER UNE UNITÉ DE LA FILE DE PRODUCTION (Remboursement 100%)
  if (cmd.op === 'CANCEL_QUEUE') {
    const bld = state.buildings.find((b) => b.owner === p.id && b.id === cmd.bldId);
    if (!bld || !Array.isArray(bld.queue) || !bld.queue.length) return { ok: false };
    const idx = clamp(Number(cmd.slot) || 0, 0, bld.queue.length - 1);
    const uKind = bld.queue.splice(idx, 1)[0];
    const uDef = UNITS[uKind];
    if (uDef) {
      p.minerals += uDef.min;
      p.gas += uDef.gas;
    }
    if (idx === 0) {
      if (bld.queue.length > 0) {
        const nextDef = UNITS[bld.queue[0]];
        bld.qTotal = state.blitz ? nextDef.trainTime * 0.65 : nextDef.trainTime;
        bld.qTimer = bld.qTotal;
      } else {
        bld.qTimer = 0;
        bld.qTotal = 0;
      }
    }
    return { ok: true };
  }

  // 4. ORDRES D'UNITÉS : MOVE, AMOVE, STOP, HOLD, HARVEST, REPAIR, RALLY
  if (cmd.op === 'UNIT_ORDER') {
    const mode = String(cmd.mode || 'amove');
    const x = clamp(Math.round(Number(cmd.x) || HALF_W), 35, WORLD_SIZE - 35);
    const y = clamp(Math.round(Number(cmd.y) || HALF_W), 35, WORLD_SIZE - 35);
    const ids = Array.isArray(cmd.unitIds) ? new Set(cmd.unitIds) : new Set();

    // Si des bâtiments sont sélectionnés : définir leur Point de Ralliement
    if (Array.isArray(cmd.bldIds) && cmd.bldIds.length) {
      for (const b of state.buildings) {
        if (b.owner === p.id && cmd.bldIds.includes(b.id)) {
          b.rallyX = x;
          b.rallyY = y;
        }
      }
    }

    const mySelected = state.units.filter((u) => u.owner === p.id && ids.has(u.id));
    const count = mySelected.length;
    const cols = Math.max(1, Math.ceil(Math.sqrt(count)));

    mySelected.forEach((u, idx) => {
      if (mode === 'stop') {
        u.mode = 'idle';
        u.orderX = null;
        u.orderY = null;
        u.targetEntId = null;
        return;
      }
      if (mode === 'hold') {
        u.mode = 'hold';
        u.orderX = null;
        u.orderY = null;
        u.targetEntId = null;
        return;
      }
      if (mode === 'harvest_min' && u.kind === 'scv') {
        u.mode = 'harvest_min';
        u.harvestId = cmd.resId || (nearestMineral(x, y)?.id ?? null);
        u.buildTargetId = null;
        return;
      }
      if (mode === 'harvest_gas' && u.kind === 'scv') {
        u.mode = 'harvest_gas';
        u.harvestId = cmd.resId || null;
        u.buildTargetId = null;
        return;
      }
      if (mode === 'build' && u.kind === 'scv' && cmd.targetId) {
        u.mode = 'build';
        u.buildTargetId = cmd.targetId;
        return;
      }

      // Formation en grille autour du point cible
      const row = Math.floor(idx / cols), col = idx % cols;
      const spacing = u.radius * 2.5 + 6;
      const fx = clamp(x + (col - (cols - 1) / 2) * spacing, 30, WORLD_SIZE - 30);
      const fy = clamp(y + (row - (Math.ceil(count / cols) - 1) / 2) * spacing, 30, WORLD_SIZE - 30);

      u.buildTargetId = null;
      if (mode === 'focus' && cmd.targetId) {
        u.mode = 'focus';
        u.targetEntId = cmd.targetId;
        u.orderX = x;
        u.orderY = y;
      } else if (mode === 'move') {
        u.mode = 'move';
        u.targetEntId = null;
        u.orderX = fx;
        u.orderY = fy;
      } else {
        u.mode = 'amove';
        u.targetEntId = null;
        u.orderX = fx;
        u.orderY = fy;
      }
    });
    return { ok: true };
  }

  // 5. CAPACITÉ MICRO : STIMPACK (T)
  if (cmd.op === 'STIM') {
    const ids = new Set(Array.isArray(cmd.unitIds) ? cmd.unitIds : []);
    let count = 0;
    for (const u of state.units) {
      if (u.owner === p.id && ids.has(u.id) && UNITS[u.kind]?.canStim && u.hp > 20) {
        u.hp = Math.max(10, u.hp - 18);
        u.stimT = 8.0;
        count++;
        fxEvents.push({ k: 'STIM', x: u.x, y: u.y, color: '#ff4b2b' });
      }
    }
    return count > 0 ? { ok: true } : { ok: false, reason: 'Aucun Marine ou Maraudeur en état d’utiliser Stimpack.' };
  }

  // 6. CAPACITÉ MICRO : MODE SIÈGE (E)
  if (cmd.op === 'SIEGE') {
    const ids = new Set(Array.isArray(cmd.unitIds) ? cmd.unitIds : []);
    let count = 0;
    for (const u of state.units) {
      if (u.owner === p.id && ids.has(u.id) && UNITS[u.kind]?.canSiege) {
        u.sieged = !u.sieged;
        u.cd = Math.max(u.cd, 1.0);
        count++;
        fxEvents.push({ k: 'SIEGE', x: u.x, y: u.y, sieged: u.sieged });
      }
    }
    return count > 0 ? { ok: true } : { ok: false, reason: 'Sélectionne un Char de Siège.' };
  }

  // 7. CAPACITÉ COMSAT : SCAN RADAR (X - 50 Minéraux)
  if (cmd.op === 'SCAN') {
    if (p.minerals < 50) return { ok: false, reason: '50💎 requis pour lancer un Scan Radar.' };
    p.minerals -= 50;
    const x = clamp(Math.round(Number(cmd.x) || HALF_W), 60, WORLD_SIZE - 60);
    const y = clamp(Math.round(Number(cmd.y) || HALF_W), 60, WORLD_SIZE - 60);
    state.scans.push({ x, y, team: p.team, r: 380, timer: 10.0 });
    fxEvents.push({ k: 'SCAN', x, y, color: '#1fc7c1' });
    return { ok: true };
  }

  return { ok: false };
}

/* ============================================================================
   SIMULATION DU MONDE TEMPS RÉEL (20 HZ)
   ============================================================================ */
function stepWorld(state, dt, fxEvents) {
  if (state.over) return;
  state.time += dt;

  // Phases du match
  const t = state.time;
  const p2At = state.blitz ? 120 : 210;
  const p3At = state.blitz ? 360 : 720;
  const sdAt = state.blitz ? 600 : 1350;
  const newPhase = t >= sdAt ? 4 : t >= p3At ? 3 : t >= p2At ? 2 : 1;
  if (newPhase !== state.phase) {
    state.phase = newPhase;
    fxEvents.push({ k: 'PHASE', phase: newPhase });
  }
  state.dmgMult = state.phase === 4 ? 1.85 : state.phase === 3 ? 1.2 : 1.0;

  if (state.phase === 4) {
    state.stormRadius = Math.max(380, state.stormRadius - (state.blitz ? 16 : 9) * dt);
  }

  // Scans radar actifs
  for (let i = state.scans.length - 1; i >= 0; i--) {
    state.scans[i].timer -= dt;
    if (state.scans[i].timer <= 0) state.scans.splice(i, 1);
  }

  // Revenu de base léger + Raffineries complétées
  for (const p of state.players) {
    if (p.dead) continue;
    p.minerals = Math.min(9999, p.minerals + 2.5 * dt);
    const myRefs = state.buildings.filter((b) => b.owner === p.id && b.kind === 'extractor' && b.hp > 0 && !b.constructing).length;
    if (myRefs > 0) p.gas = Math.min(9999, p.gas + myRefs * 2.2 * dt);
  }

  // Mise à jour des Bâtiments (Chantiers, Files de production, Soin, Tourelles)
  for (const b of state.buildings) {
    if (b.hp <= 0) continue;
    const owner = state.players.find((p) => p.id === b.owner);
    if (!owner || owner.dead) { b.hp = 0; continue; }
    const def = BUILDINGS[b.kind];

    if (state.phase === 4 && hypot(b.x, b.y, HALF_W, HALF_W) > state.stormRadius) {
      b.hp -= 35 * dt;
    }

    // Si en cours de construction : progression lente autonome + accélérée par un Ouvrier VCS sur place
    if (b.constructing) {
      const rate = 0.25 / (b.buildTime || 8);
      b.buildProg += rate * dt;
      b.hp = Math.min(b.maxHp, b.hp + b.maxHp * rate * dt);
      if (b.buildProg >= 1) {
        b.constructing = false;
        b.buildProg = 1;
        b.hp = b.maxHp;
        fxEvents.push({ k: 'COMPLETE', x: b.x, y: b.y, color: owner.color, kind: b.kind });
        // Si c'est une Raffinerie, assigner automatiquement le VCS qui la construisait à la récolte du gaz
        if (b.kind === 'extractor') {
          for (const u of state.units) {
            if (u.owner === owner.id && u.kind === 'scv' && u.buildTargetId === b.id) {
              u.mode = 'harvest_gas';
              u.harvestId = b.id;
              u.buildTargetId = null;
            }
          }
        }
      }
      continue;
    }

    // Soin des Dépôts Relais
    if (def.heal) {
      const r2 = def.range * def.range;
      for (const u of state.units) {
        if (u.team === b.team && u.hp < u.maxHp && dist2(b.x, b.y, u.x, u.y) <= r2) {
          u.hp = Math.min(u.maxHp, u.hp + def.heal * dt);
        }
      }
    }

    // File d'attente de production (5 slots)
    if (Array.isArray(b.queue) && b.queue.length > 0) {
      b.qTimer -= dt;
      if (b.qTimer <= 0) {
        const uKind = b.queue.shift();
        spawnTrainedUnit(state, owner, b, uKind, fxEvents);
        if (b.queue.length > 0) {
          const nextDef = UNITS[b.queue[0]];
          b.qTotal = state.blitz ? nextDef.trainTime * 0.65 : nextDef.trainTime;
          b.qTimer = b.qTotal;
        } else {
          b.qTimer = 0;
          b.qTotal = 0;
        }
      }
    }

    // Tir défensif (QG, Bunker, Tesla)
    if (def.range > 0 && def.dmg > 0) {
      b.cd = Math.max(0, (b.cd || 0) - dt);
      if (b.cd <= 0) {
        let target = null, bestD2 = def.range * def.range;
        for (const u of state.units) {
          if (u.team !== b.team && u.hp > 0) {
            const d2 = dist2(b.x, b.y, u.x, u.y);
            if (d2 <= bestD2) { bestD2 = d2; target = u; }
          }
        }
        if (target) {
          b.cd = def.rate;
          b.aimA = Math.atan2(target.y - b.y, target.x - b.x);
          const dmg = def.dmg * state.dmgMult;
          target.hp -= dmg;
          if (def.splash) {
            const s2 = def.splash * def.splash;
            for (const u2 of state.units) {
              if (u2 !== target && u2.team !== b.team && dist2(target.x, target.y, u2.x, u2.y) <= s2) {
                u2.hp -= dmg * 0.6;
              }
            }
          }
          fxEvents.push({
            k: b.kind === 'tesla' ? 'TESLA' : 'SHOT',
            x1: b.x, y1: b.y - 12, x2: target.x, y2: target.y, color: owner.color,
          });
        }
      }
    }
  }

  // Mise à jour des Unités (Ouvriers VCS + Unités de Combat)
  for (const u of state.units) {
    if (u.hp <= 0) continue;
    const def = UNITS[u.kind];
    const owner = state.players.find((p) => p.id === u.owner);
    if (!owner || owner.dead) { u.hp = 0; continue; }

    if (u.stimT > 0) u.stimT = Math.max(0, u.stimT - dt);
    const stimMult = u.stimT > 0 ? 1.48 : 1.0;
    u.cd = Math.max(0, u.cd - dt * stimMult);

    // LOGIQUE SPÉCIFIQUE OUVRIER VCS : Construire / Réparer ou Récolter Minéraux & Gaz
    if (u.kind === 'scv') {
      // A) Construire ou Réparer un bâtiment ciblé
      if (u.mode === 'build' && u.buildTargetId) {
        const bld = state.buildings.find((b) => b.id === u.buildTargetId && b.hp > 0);
        if (!bld) {
          u.mode = 'harvest_min';
          u.buildTargetId = null;
          const m = nearestMineral(u.x, u.y, 400);
          u.harvestId = m ? m.id : null;
        } else {
          const d = hypot(u.x, u.y, bld.x, bld.y) - bld.radius - u.radius;
          if (d <= 22) {
            u.a = Math.atan2(bld.y - u.y, bld.x - u.x);
            u.vx = 0; u.vy = 0;
            if (bld.constructing) {
              const step = (0.85 / (bld.buildTime || 8)) * dt;
              bld.buildProg += step;
              bld.hp = Math.min(bld.maxHp, bld.hp + bld.maxHp * step);
              if (Math.random() < 0.35) fxEvents.push({ k: 'SPARK', x: u.x + Math.cos(u.a) * 14, y: u.y + Math.sin(u.a) * 14, color: '#ffc531' });
            } else if (bld.hp < bld.maxHp && owner.minerals >= 1) {
              bld.hp = Math.min(bld.maxHp, bld.hp + 45 * dt);
              owner.minerals = Math.max(0, owner.minerals - 3 * dt);
              if (Math.random() < 0.35) fxEvents.push({ k: 'SPARK', x: u.x + Math.cos(u.a) * 14, y: u.y + Math.sin(u.a) * 14, color: '#ffc531' });
            } else {
              u.mode = bld.kind === 'extractor' ? 'harvest_gas' : 'harvest_min';
              u.harvestId = bld.kind === 'extractor' ? bld.id : (nearestMineral(u.x, u.y, 500)?.id ?? null);
              u.buildTargetId = null;
            }
            continue;
          } else {
            u.orderX = bld.x;
            u.orderY = bld.y;
          }
        }
      }

      // B) Récolte de Minéraux ou de Gaz Plasma (Aller-Retour vers le QG)
      if (u.mode === 'harvest_min' || u.mode === 'harvest_gas') {
        const hq = nearestMyHq(state, u.owner, u.x, u.y);
        if (u.carryAmt > 0 && hq) {
          // Rapporte les ressources au QG
          const dHq = hypot(u.x, u.y, hq.x, hq.y) - hq.radius - u.radius;
          if (dHq <= 18) {
            if (u.carryType === 'gas') owner.gas = Math.min(9999, owner.gas + u.carryAmt);
            else owner.minerals = Math.min(9999, owner.minerals + u.carryAmt);
            owner.score += 2;
            u.carryAmt = 0;
            u.carryType = null;
            continue;
          } else {
            u.orderX = hq.x;
            u.orderY = hq.y;
          }
        } else if (u.mode === 'harvest_min') {
          let mNode = MINERAL_NODES.find((m) => m.id === u.harvestId) || nearestMineral(u.x, u.y);
          if (mNode) {
            u.harvestId = mNode.id;
            const dM = hypot(u.x, u.y, mNode.x, mNode.y) - 22 - u.radius;
            if (dM <= 16) {
              u.a = Math.atan2(mNode.y - u.y, mNode.x - u.x);
              u.vx = 0; u.vy = 0;
              u.gatherT = (u.gatherT || 0) + dt;
              if (Math.random() < 0.25) fxEvents.push({ k: 'MINE', x: mNode.x, y: mNode.y, color: mNode.rich ? '#ffc531' : '#1fc7c1' });
              if (u.gatherT >= 1.55) {
                u.gatherT = 0;
                u.carryType = mNode.rich ? 'gold' : 'min';
                u.carryAmt = mNode.rich ? 12 : 8;
              }
              continue;
            } else {
              u.orderX = mNode.x;
              u.orderY = mNode.y;
            }
          }
        } else if (u.mode === 'harvest_gas') {
          const ref = state.buildings.find((b) => b.id === u.harvestId && b.owner === u.owner && b.kind === 'extractor' && b.hp > 0 && !b.constructing)
            || state.buildings.find((b) => b.owner === u.owner && b.kind === 'extractor' && b.hp > 0 && !b.constructing);
          if (ref) {
            u.harvestId = ref.id;
            const dR = hypot(u.x, u.y, ref.x, ref.y) - ref.radius - u.radius;
            if (dR <= 16) {
              u.a = Math.atan2(ref.y - u.y, ref.x - u.x);
              u.vx = 0; u.vy = 0;
              u.gatherT = (u.gatherT || 0) + dt;
              if (u.gatherT >= 1.7) {
                u.gatherT = 0;
                u.carryType = 'gas';
                u.carryAmt = 6;
              }
              continue;
            } else {
              u.orderX = ref.x;
              u.orderY = ref.y;
            }
          } else {
            u.mode = 'harvest_min';
          }
        }
      }
    }

    // RECHERCHE DE CIBLE POUR UNITÉS DE COMBAT (sauf si ordre 'move' pur)
    const effRange = u.sieged && def.siegeRange ? def.siegeRange : def.range;
    const effDmg = u.sieged && def.siegeDmg ? def.siegeDmg : def.dmg;
    const effRate = u.sieged && def.siegeRate ? def.siegeRate : def.rate;

    let bestTarget = null, bestScore = Infinity;
    if (u.mode !== 'move' && u.mode !== 'harvest_min' && u.mode !== 'harvest_gas' && u.mode !== 'build') {
      const aggroR = u.sieged || u.mode === 'hold' ? effRange : Math.max(255, effRange + 65);

      // Si focus fire explicite
      if (u.mode === 'focus' && u.targetEntId) {
        const fUnit = state.units.find((e) => e.id === u.targetEntId && e.hp > 0);
        const fBld = fUnit ? null : state.buildings.find((b) => b.id === u.targetEntId && b.hp > 0);
        const ent = fUnit || fBld;
        if (ent && ent.team !== u.team) {
          const d = hypot(u.x, u.y, ent.x, ent.y) - ent.radius;
          bestTarget = { ent, isBld: !!fBld, dist: d };
        } else {
          u.mode = 'amove';
          u.targetEntId = null;
        }
      }

      if (!bestTarget) {
        for (const e of state.units) {
          if (e.team === u.team || e.hp <= 0) continue;
          const d = hypot(u.x, u.y, e.x, e.y) - e.radius;
          if (d <= aggroR) {
            const prio = e.kind === 'scv' ? 35 : 0;
            if (d + prio < bestScore) { bestScore = d + prio; bestTarget = { ent: e, isBld: false, dist: d }; }
          }
        }
        for (const b of state.buildings) {
          if (b.team === u.team || b.hp <= 0) continue;
          const d = hypot(u.x, u.y, b.x, b.y) - b.radius;
          if (d <= aggroR + 30) {
            const prio = b.kind === 'wall' ? (u.kind === 'sapper' ? -20 : 60) : (u.kind === 'sapper' ? -45 : 20);
            if (d + prio < bestScore) { bestScore = d + prio; bestTarget = { ent: b, isBld: true, dist: d }; }
          }
        }
      }
    }

    // Tir si cible à portée
    if (bestTarget && bestTarget.dist <= effRange) {
      const tgt = bestTarget.ent;
      u.a = Math.atan2(tgt.y - u.y, tgt.x - u.x);
      u.vx *= 0.4;
      u.vy *= 0.4;
      if (u.cd <= 0) {
        u.cd = effRate;
        let dmg = effDmg * state.dmgMult;
        if (bestTarget.isBld) dmg *= def.bldMult || 1;
        else if (u.kind === 'rocket' && UNITS[tgt.kind]?.mech) dmg *= 1.5;
        tgt.hp -= dmg;
        if (def.splash || u.sieged) {
          const splashR = def.splash || 58;
          const s2 = splashR * splashR;
          for (const e2 of state.units) {
            if (e2 !== tgt && e2.team !== u.team && dist2(tgt.x, tgt.y, e2.x, e2.y) <= s2) e2.hp -= dmg * 0.55;
          }
        }
        owner.score += Math.round(dmg * 0.12);
        fxEvents.push({
          k: u.sieged || u.kind === 'siege' || u.kind === 'titan' ? 'PLASMA' : u.kind === 'rocket' ? 'ROCKET' : 'SHOT',
          x1: u.x, y1: u.y, x2: tgt.x, y2: tgt.y, color: owner.color,
        });
      }
      continue;
    }

    // Un char en Mode Siège ou une unité en Hold Position ne se déplace pas
    if (u.sieged || u.mode === 'hold') {
      u.vx = 0; u.vy = 0;
      continue;
    }

    // Détermination de la destination de déplacement
    let goalX = u.orderX, goalY = u.orderY;
    if (bestTarget && u.mode !== 'move') {
      goalX = bestTarget.ent.x;
      goalY = bestTarget.ent.y;
    }
    if (goalX == null || goalY == null) continue;
    if (dist2(u.x, u.y, goalX, goalY) <= 18 * 18) {
      if (u.mode === 'move' || u.mode === 'amove') {
        u.orderX = null;
        u.orderY = null;
        u.mode = 'idle';
      }
      u.vx = 0; u.vy = 0;
      continue;
    }

    const dx = goalX - u.x, dy = goalY - u.y;
    const distGoal = Math.hypot(dx, dy) || 1;
    let steerX = dx / distGoal, steerY = dy / distGoal;

    // Évitement continu des bâtiments et rochers
    const lookAhead = u.radius + 32;
    const sideSign = (u.id % 2 === 0) ? 1 : -1;
    for (const b of state.buildings) {
      if (b.hp <= 0 || b.id === u.buildTargetId || b.id === u.harvestId) continue;
      if (u.kind === 'scv' && u.carryAmt > 0 && b.owner === u.owner && b.kind === 'hq') continue;
      const ox = b.x - u.x, oy = b.y - u.y;
      const d = Math.hypot(ox, oy) || 1;
      const minClear = u.radius + b.radius + 10;
      if (d < minClear + lookAhead) {
        const dot = (ox / d) * steerX + (oy / d) * steerY;
        if (dot > -0.2) {
          const tx = -oy / d * sideSign, ty = ox / d * sideSign;
          const push = ((minClear + lookAhead - d) / lookAhead) * 1.8;
          steerX += (tx - ox / d * 0.5) * push;
          steerY += (ty - oy / d * 0.5) * push;
        }
      }
    }
    for (const rk of ROCKS) {
      const ox = rk.x - u.x, oy = rk.y - u.y;
      const d = Math.hypot(ox, oy) || 1;
      const minClear = u.radius + rk.r + 10;
      if (d < minClear + lookAhead) {
        const tx = -oy / d * sideSign, ty = ox / d * sideSign;
        const push = ((minClear + lookAhead - d) / lookAhead) * 1.9;
        steerX += (tx - ox / d * 0.5) * push;
        steerY += (ty - oy / d * 0.5) * push;
      }
    }
    for (const o of state.units) {
      if (o === u || o.hp <= 0) continue;
      if (u.kind === 'scv' && o.kind === 'scv') continue; // Les VCS se traversent pendant la récolte (comme dans StarCraft !)
      const sx = u.x - o.x, sy = u.y - o.y;
      const minSep = u.radius + o.radius + 4;
      const d2 = sx * sx + sy * sy;
      if (d2 > 0 && d2 < minSep * minSep) {
        const d = Math.sqrt(d2);
        const f = (minSep - d) / minSep;
        steerX += (sx / d) * f * 1.35;
        steerY += (sy / d) * f * 1.35;
      }
    }

    const sLen = Math.hypot(steerX, steerY) || 1;
    const spd = def.speed * stimMult;
    u.vx = (steerX / sLen) * spd;
    u.vy = (steerY / sLen) * spd;
    u.x = clamp(u.x + u.vx * dt, 24, WORLD_SIZE - 24);
    u.y = clamp(u.y + u.vy * dt, 24, WORLD_SIZE - 24);
    u.a = Math.atan2(u.vy, u.vx);

    for (const b of state.buildings) {
      if (b.hp <= 0) continue;
      const cx = u.x - b.x, cy = u.y - b.y;
      const minD = u.radius + b.radius + 2;
      const d2 = cx * cx + cy * cy;
      if (d2 < minD * minD) {
        const d = Math.sqrt(d2) || 1;
        u.x = b.x + (cx / d) * minD;
        u.y = b.y + (cy / d) * minD;
      }
    }
  }

  // Destruction des unités et bâtiments tombés à 0 PV
  for (let i = state.units.length - 1; i >= 0; i--) {
    const u = state.units[i];
    if (u.hp <= 0) {
      fxEvents.push({ k: 'BOOM', x: u.x, y: u.y, r: u.radius * 1.5 });
      state.units.splice(i, 1);
    }
  }
  for (let i = state.buildings.length - 1; i >= 0; i--) {
    const b = state.buildings[i];
    if (b.hp <= 0) {
      fxEvents.push({ k: 'BOOM_BIG', x: b.x, y: b.y, r: b.radius * 1.8 });
      const ownerId = b.owner;
      state.buildings.splice(i, 1);
      // Un joueur est éliminé s'il n'a plus aucun Centre de Commandement (QG)
      const hasAnyHq = state.buildings.some((ob) => ob.owner === ownerId && ob.kind === 'hq' && ob.hp > 0);
      if (!hasAnyHq) {
        const p = state.players.find((q) => q.id === ownerId);
        if (p && !p.dead) {
          p.dead = true;
          state.ranking.unshift(p.id);
          for (const ob of state.buildings) if (ob.owner === ownerId) ob.hp = 0;
          for (const ou of state.units) if (ou.owner === ownerId) ou.hp = 0;
          fxEvents.push({ k: 'ELIM', name: p.name, color: p.color });
        }
      }
    }
  }

  const aliveTeams = new Set(state.players.filter((p) => !p.dead).map((p) => p.team));
  if (aliveTeams.size <= 1) {
    state.over = true;
    state.winnerTeam = [...aliveTeams][0] ?? 0;
    const winners = state.players.filter((p) => !p.dead).sort((a, b) => b.score - a.score);
    for (const w of winners) {
      w.score += 500;
      if (!state.ranking.includes(w.id)) state.ranking.unshift(w.id);
    }
    for (const p of state.players) {
      if (!state.ranking.includes(p.id)) state.ranking.push(p.id);
    }
  }
}

/* ============================================================================
   INTELLIGENCE ARTIFICIELLE DES BOTS (MACRO & MICRO STARCRAFT)
   ============================================================================ */
function runBots(state, fxEvents) {
  if (state.over) return;
  for (const p of state.players) {
    if (!p.bot || p.dead) continue;
    const myBlds = state.buildings.filter((b) => b.owner === p.id && b.hp > 0);
    const hq = myBlds.find((b) => b.kind === 'hq');
    if (!hq) continue;

    const myUnits = state.units.filter((u) => u.owner === p.id && u.hp > 0);
    const scvs = myUnits.filter((u) => u.kind === 'scv');
    const army = myUnits.filter((u) => u.kind !== 'scv');
    const sup = computeSupply(state, p.id);

    const refs = myBlds.filter((b) => b.kind === 'extractor').length;
    const rax = myBlds.filter((b) => b.kind === 'barracks').length;
    const fac = myBlds.filter((b) => b.kind === 'factory').length;
    const tur = myBlds.filter((b) => b.kind === 'turret' || b.kind === 'tesla').length;

    const dirX = Math.sign(HALF_W - hq.x) || 1;
    const dirY = Math.sign(HALF_W - hq.y) || 1;

    const tryBuildNear = (kind, ax, ay, minR = 75, maxR = 230) => {
      for (let k = 0; k < 16; k++) {
        const ang = Math.random() * TAU;
        const r = minR + Math.random() * (maxR - minR);
        const x = ax + Math.cos(ang) * r, y = ay + Math.sin(ang) * r;
        if (canPlaceBuilding(state, p.id, kind, x, y).ok) {
          return executeCommand(state, p.id, { op: 'BUILD', kind, x, y }, fxEvents).ok;
        }
      }
      return false;
    };

    // 1. Construire un Dépôt Relais si proche de la limite de Ravitaillement
    if (sup.max - sup.used <= 3 && sup.max < MAX_SUPPLY && p.minerals >= 75) {
      if (tryBuildNear('pylon', hq.x + dirX * 90, hq.y + dirY * 90, 65, 195)) return;
    }

    // 2. Produire des Ouvriers VCS jusqu'à 11
    if (scvs.length < 11 && hq.queue.length < 2 && p.minerals >= 50) {
      executeCommand(state, p.id, { op: 'TRAIN', unit: 'scv', bldId: hq.id }, fxEvents);
    }

    // 3. Construire une Raffinerie sur le geyser de sa base
    if (refs < 1 && scvs.length >= 7 && p.minerals >= 75) {
      const gey = findGeyserAt(hq.x, hq.y, 260);
      if (gey) executeCommand(state, p.id, { op: 'BUILD', kind: 'extractor', x: gey.x, y: gey.y }, fxEvents);
    }
    // Affecter 2 VCS au gaz si raffinerie prête
    const readyRef = myBlds.find((b) => b.kind === 'extractor' && !b.constructing);
    if (readyRef) {
      const gasScvs = scvs.filter((u) => u.mode === 'harvest_gas');
      if (gasScvs.length < 2) {
        const freeScv = scvs.find((u) => u.mode === 'harvest_min');
        if (freeScv) { freeScv.mode = 'harvest_gas'; freeScv.harvestId = readyRef.id; }
      }
    }

    // 4. Ordre de construction (Build Order StarCraft : Caserne -> Bunker -> Usine -> 2e Caserne)
    if (rax < 1 && p.minerals >= 125) {
      if (tryBuildNear('barracks', hq.x + dirX * 135, hq.y + dirY * 45, 50, 140)) return;
    }
    if (rax >= 1 && fac < 1 && p.minerals >= 150 && p.gas >= 75) {
      if (tryBuildNear('factory', hq.x + dirX * 60, hq.y + dirY * 140, 55, 150)) return;
    }
    if (tur < 2 && rax >= 1 && p.minerals >= 125) {
      const tKind = p.gas >= 50 && Math.random() < 0.5 ? 'tesla' : 'turret';
      if (tryBuildNear(tKind, hq.x + dirX * 165, hq.y + dirY * 165, 35, 110)) return;
    }
    if (rax < 2 && fac >= 1 && p.minerals >= 180) {
      if (tryBuildNear('barracks', hq.x + dirX * 140, hq.y - dirY * 50, 55, 160)) return;
    }

    // 5. Production continue d'unités dans les Casernes et Usines
    if (fac >= 1 && p.minerals >= 250 && p.gas >= 150) {
      executeCommand(state, p.id, { op: 'TRAIN', unit: 'titan' }, fxEvents);
    } else if (fac >= 1 && p.minerals >= 150 && p.gas >= 100 && Math.random() < 0.55) {
      executeCommand(state, p.id, { op: 'TRAIN', unit: 'siege' }, fxEvents);
    } else if (fac >= 1 && p.minerals >= 125 && p.gas >= 50) {
      executeCommand(state, p.id, { op: 'TRAIN', unit: 'tank' }, fxEvents);
    }
    if (rax >= 1 && p.minerals >= 75 && p.gas >= 25 && Math.random() < 0.6) {
      executeCommand(state, p.id, { op: 'TRAIN', unit: Math.random() < 0.65 ? 'rocket' : 'sapper' }, fxEvents);
    } else if (rax >= 1 && p.minerals >= 50) {
      executeCommand(state, p.id, { op: 'TRAIN', unit: 'marine' }, fxEvents);
    }

    // 6. Vague d'assaut A-Move coordonnée dès que l'armée atteint 7+ unités
    const waveSize = state.level === 'expert' ? 6 : state.level === 'facile' ? 10 : 8;
    const idleArmy = army.filter((u) => u.mode === 'idle' || hypot(u.x, u.y, hq.x, hq.y) < 260);
    if (idleArmy.length >= waveSize) {
      const enemyBld = state.buildings.find((b) => b.team !== p.team && b.kind === 'hq' && b.hp > 0)
        || state.buildings.find((b) => b.team !== p.team && b.hp > 0);
      if (enemyBld) {
        executeCommand(state, p.id, {
          op: 'UNIT_ORDER',
          mode: 'amove',
          x: enemyBld.x,
          y: enemyBld.y,
          unitIds: idleArmy.map((u) => u.id),
        }, fxEvents);
      }
    }
  }
}

/* ============================================================================
   RENDU 2.5D HAUTE DÉFINITION + BROUILLARD DE GUERRE STARCRAFT
   ============================================================================ */
const cvs = $('#world'), ctx = cvs.getContext('2d');
const miniCvs = $('#minimap'), miniCtx = miniCvs.getContext('2d');
let W = 0, H = 0, DPR = 1;

function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = window.innerWidth;
  H = window.innerHeight;
  cvs.width = Math.round(W * DPR);
  cvs.height = Math.round(H * DPR);
}
window.addEventListener('resize', resize);
resize();

const cam = { x: HALF_W, y: HALF_W, z: 0.88, shake: 0 };
const keys = {};
const mouse = { x: W / 2, y: H / 2, wx: HALF_W, wy: HALF_W, down: false, dragStart: null, panning: false, panStart: null };

let myId = 0;
let role = 'solo';
let state = null;
let buildMode = null;
let orderCursor = null; // 'amove' | 'scan' | null
let cmdTab = 'auto'; // 'auto' | 'build'
let selectedUnits = new Set();
let selectedBlds = new Set();
const controlGroups = { 1: [], 2: [], 3: [], 4: [], 5: [], 6: [], 7: [], 8: [], 9: [] };
let lastGroupTap = { g: 0, t: 0 };
let lastClickUnit = { id: 0, kind: '', t: 0 };

let particles = [];
let shockwaves = [];
let projectiles = [];
let beams = [];
let craters = [];
let orderMarkers = [];
let reportedResult = false;

// Brouillard de guerre (grille explorée + canvas de masque)
const FOG_RES = 200;
const fogCanvas = document.createElement('canvas');
fogCanvas.width = FOG_RES;
fogCanvas.height = FOG_RES;
const fogCtx = fogCanvas.getContext('2d');
const exploredGrid = new Uint8Array(FOG_RES * FOG_RES);

function isVisibleToMe(wx, wy) {
  if (!state) return true;
  const me = state.players.find((p) => p.id === myId);
  if (!me || me.dead) return true;
  for (const b of state.buildings) {
    if (b.team === me.team && b.hp > 0) {
      const s = BUILDINGS[b.kind]?.sight || 300;
      if (dist2(wx, wy, b.x, b.y) <= s * s) return true;
    }
  }
  for (const u of state.units) {
    if (u.team === me.team && u.hp > 0) {
      const s = UNITS[u.kind]?.sight || 260;
      if (dist2(wx, wy, u.x, u.y) <= s * s) return true;
    }
  }
  for (const sc of state.scans) {
    if (sc.team === me.team && dist2(wx, wy, sc.x, sc.y) <= sc.r * sc.r) return true;
  }
  return false;
}

function updateFogCanvas() {
  if (!state) return;
  const me = state.players.find((p) => p.id === myId);
  if (!me) return;
  const scale = FOG_RES / WORLD_SIZE;

  // Marquer les cellules explorées
  const markCircle = (wx, wy, r) => {
    const cx = Math.floor(wx * scale), cy = Math.floor(wy * scale);
    const cr = Math.ceil(r * scale);
    const cr2 = cr * cr;
    for (let y = Math.max(0, cy - cr); y <= Math.min(FOG_RES - 1, cy + cr); y++) {
      for (let x = Math.max(0, cx - cr); x <= Math.min(FOG_RES - 1, cx + cr); x++) {
        if ((x - cx) ** 2 + (y - cy) ** 2 <= cr2) exploredGrid[y * FOG_RES + x] = 1;
      }
    }
  };

  fogCtx.globalCompositeOperation = 'source-over';
  fogCtx.fillStyle = 'rgba(8, 12, 16, 0.56)';
  fogCtx.fillRect(0, 0, FOG_RES, FOG_RES);

  fogCtx.globalCompositeOperation = 'destination-out';
  for (const b of state.buildings) {
    if (b.team === me.team && b.hp > 0) {
      const s = BUILDINGS[b.kind]?.sight || 300;
      markCircle(b.x, b.y, s);
      fogCtx.beginPath();
      fogCtx.arc(b.x * scale, b.y * scale, s * scale, 0, TAU);
      fogCtx.fill();
    }
  }
  for (const u of state.units) {
    if (u.team === me.team && u.hp > 0) {
      const s = UNITS[u.kind]?.sight || 260;
      markCircle(u.x, u.y, s);
      fogCtx.beginPath();
      fogCtx.arc(u.x * scale, u.y * scale, s * scale, 0, TAU);
      fogCtx.fill();
    }
  }
  for (const sc of state.scans) {
    if (sc.team === me.team) {
      markCircle(sc.x, sc.y, sc.r);
      fogCtx.beginPath();
      fogCtx.arc(sc.x * scale, sc.y * scale, sc.r * scale, 0, TAU);
      fogCtx.fill();
    }
  }
}

function roofOffset(wx, wy, height, isPreview = false) {
  if (isPreview) return { ox: -3, oy: -height * 0.32 };
  const dx = clamp((wx - cam.x) * 0.018, -14, 14);
  const dy = clamp((wy - cam.y) * 0.018 - height * 0.34, -height * 0.55, -height * 0.16);
  return { ox: dx, oy: dy };
}

function drawCylinder25D(g, r, ox, oy, sideCol, topCol) {
  g.fillStyle = sideCol;
  g.strokeStyle = '#16181d';
  g.lineWidth = 3.5;
  const ang = Math.atan2(oy, ox) + Math.PI / 2;
  const cx = Math.cos(ang) * r, cy = Math.sin(ang) * r;
  g.beginPath(); g.arc(0, 0, r, 0, TAU); g.fill(); g.stroke();
  g.beginPath();
  g.moveTo(cx, cy); g.lineTo(ox + cx, oy + cy); g.lineTo(ox - cx, oy - cy); g.lineTo(-cx, -cy);
  g.closePath(); g.fill(); g.stroke();
  g.fillStyle = topCol;
  g.beginPath(); g.arc(ox, oy, r, 0, TAU); g.fill(); g.stroke();
}

function drawBox25D(g, hw, hh, rad, ox, oy, sideCol, topCol) {
  g.fillStyle = sideCol;
  g.strokeStyle = '#16181d';
  g.lineWidth = 3.5;
  g.beginPath(); g.roundRect(-hw, -hh, hw * 2, hh * 2, rad); g.fill(); g.stroke();
  g.beginPath(); g.roundRect(ox * 0.45 - hw, oy * 0.45 - hh, hw * 2, hh * 2, rad); g.fill(); g.stroke();
  g.fillStyle = topCol;
  g.beginPath(); g.roundRect(ox - hw, oy - hh, hw * 2, hh * 2, rad); g.fill(); g.stroke();
}

function drawBuilding(g, b, color, selected, now, isIcon = false) {
  const r = b.radius;
  const def = BUILDINGS[b.kind] || BUILDINGS.hq;
  const hScale = b.constructing ? 0.35 + 0.65 * (b.buildProg || 0.2) : 1;
  const { ox, oy } = roofOffset(b.x || 0, b.y || 0, (def.height || 26) * hScale, isIcon);
  const darkCol = shade(color, -0.35);
  const lightCol = shade(color, 0.25);

  g.save();
  g.translate(b.x || 0, b.y || 0);

  if (selected) {
    g.strokeStyle = '#2fbf71';
    g.lineWidth = 3.5;
    g.beginPath(); g.arc(0, 0, r + 9, 0, TAU); g.stroke();
  }

  g.fillStyle = 'rgba(16, 18, 24, 0.38)';
  g.beginPath(); g.ellipse(7, 9, r * 1.05, r * 0.92, 0, 0, TAU); g.fill();

  if (b.constructing && !isIcon) {
    g.globalAlpha = 0.78;
  }

  if (b.kind === 'hq') {
    for (const [sx, sy] of [[-1, -1], [1, -1], [1, 1], [-1, 1]]) {
      g.fillStyle = '#383b44'; g.strokeStyle = '#16181d'; g.lineWidth = 3;
      g.beginPath(); g.arc(sx * r * 0.72, sy * r * 0.72, r * 0.36, 0, TAU); g.fill(); g.stroke();
    }
    drawBox25D(g, r * 0.88, r * 0.88, 13, ox, oy, darkCol, color);
    g.save();
    g.translate(ox, oy);
    g.fillStyle = '#fff8ea'; g.strokeStyle = '#16181d'; g.lineWidth = 3;
    g.beginPath(); g.roundRect(-r * 0.62, -r * 0.62, r * 1.24, r * 1.24, 8); g.fill(); g.stroke();
    g.strokeStyle = shade(color, -0.15); g.lineWidth = 3;
    g.beginPath(); g.moveTo(-r * 0.5, 0); g.lineTo(r * 0.5, 0); g.moveTo(0, -r * 0.5); g.lineTo(0, r * 0.5); g.stroke();
    g.fillStyle = '#16181d';
    g.beginPath(); g.arc(0, 0, r * 0.36, 0, TAU); g.fill();
    g.save();
    g.rotate(b.aimA || 0);
    g.fillStyle = '#484b54'; g.strokeStyle = '#16181d'; g.lineWidth = 2.5;
    g.fillRect(4, -8, r * 0.58, 5); g.strokeRect(4, -8, r * 0.58, 5);
    g.fillRect(4, 3, r * 0.58, 5);  g.strokeRect(4, 3, r * 0.58, 5);
    g.restore();
    g.fillStyle = '#ffc531'; g.strokeStyle = '#16181d'; g.lineWidth = 2.5;
    g.beginPath(); g.arc(0, 0, 11, 0, TAU); g.fill(); g.stroke();
    const ra = now * 0.0035;
    g.save();
    g.translate(-r * 0.42, -r * 0.42);
    g.rotate(ra);
    g.strokeStyle = '#16181d'; g.lineWidth = 3;
    g.beginPath(); g.moveTo(-8, 0); g.lineTo(8, 0); g.stroke();
    g.fillStyle = '#1fc7c1';
    g.beginPath(); g.arc(0, 0, 4, 0, TAU); g.fill(); g.stroke();
    g.restore();
    g.restore();
  } else if (b.kind === 'extractor') {
    drawCylinder25D(g, r, ox, oy, '#38463d', '#e5f7ec');
    g.save();
    g.translate(ox, oy);
    g.fillStyle = '#2fbf71'; g.strokeStyle = '#16181d'; g.lineWidth = 2.5;
    g.beginPath(); g.arc(0, 0, r * 0.64, 0, TAU); g.fill(); g.stroke();
    g.save();
    g.rotate(now * 0.005);
    g.fillStyle = '#ffc531';
    for (let k = 0; k < 3; k++) {
      g.rotate(TAU / 3);
      g.fillRect(-3, -r * 0.55, 6, r * 0.42);
      g.strokeRect(-3, -r * 0.55, 6, r * 0.42);
    }
    g.restore();
    g.fillStyle = '#fff8ea';
    g.beginPath(); g.arc(0, 0, 5.5, 0, TAU); g.fill(); g.stroke();
    g.restore();
  } else if (b.kind === 'pylon') {
    drawCylinder25D(g, r * 0.92, ox * 0.7, oy * 0.7, darkCol, color);
    g.save();
    g.translate(ox, oy);
    const pulse = 1 + Math.sin(now * 0.006) * 0.12;
    g.strokeStyle = '#ffc531'; g.lineWidth = 2.5;
    g.beginPath(); g.arc(0, 0, r * 0.75 * pulse, 0, TAU); g.stroke();
    g.fillStyle = '#1fc7c1'; g.strokeStyle = '#16181d'; g.lineWidth = 2.5;
    g.beginPath(); g.moveTo(0, -13); g.lineTo(10, 0); g.lineTo(0, 13); g.lineTo(-10, 0); g.closePath();
    g.fill(); g.stroke();
    g.restore();
  } else if (b.kind === 'barracks') {
    drawBox25D(g, r * 0.95, r * 0.78, 9, ox, oy, '#5c5549', '#f3e9d2');
    g.save();
    g.translate(ox, oy);
    g.fillStyle = color; g.strokeStyle = '#16181d'; g.lineWidth = 2.8;
    g.beginPath(); g.roundRect(-r * 0.7, -r * 0.5, r * 1.4, r * 0.72, 5); g.fill(); g.stroke();
    g.fillStyle = '#ffc531';
    g.beginPath(); g.arc(0, -r * 0.14, 7, 0, TAU); g.fill(); g.stroke();
    g.fillStyle = '#16181d';
    g.fillRect(-r * 0.45, r * 0.32, r * 0.9, 7);
    g.fillStyle = '#ffc531';
    for (let k = -2; k <= 2; k++) g.fillRect(k * 9 - 3, r * 0.32, 5, 7);
    g.restore();
  } else if (b.kind === 'factory') {
    drawBox25D(g, r * 0.96, r * 0.86, 10, ox, oy, '#2d3038', '#4a4e5a');
    g.save();
    g.translate(ox, oy);
    g.fillStyle = color; g.strokeStyle = '#16181d'; g.lineWidth = 2.8;
    g.beginPath(); g.roundRect(-r * 0.76, -r * 0.62, r * 1.52, r * 0.82, 6); g.fill(); g.stroke();
    g.fillStyle = '#ffc531';
    g.fillRect(-r * 0.55, -r * 0.38, r * 1.1, 8);
    g.strokeRect(-r * 0.55, -r * 0.38, r * 1.1, 8);
    for (const sx of [-r * 0.52, r * 0.52]) {
      g.fillStyle = '#16181d'; g.beginPath(); g.arc(sx, r * 0.42, 8, 0, TAU); g.fill();
      g.fillStyle = '#ff4b2b'; g.beginPath(); g.arc(sx, r * 0.42, 4, 0, TAU); g.fill();
    }
    g.restore();
  } else if (b.kind === 'turret') {
    drawCylinder25D(g, r, ox * 0.7, oy * 0.7, '#6d675c', '#f3e9d2');
    g.save();
    g.translate(ox * 0.85, oy * 0.85);
    g.rotate(b.aimA || 0);
    const rec = b.cd > 0.2 ? -4 : 0;
    g.fillStyle = '#16181d'; g.strokeStyle = '#16181d'; g.lineWidth = 2.5;
    g.fillRect(4 + rec, -7, r * 0.82, 5);
    g.fillRect(4 + rec, 2, r * 0.82, 5);
    g.fillStyle = color;
    g.beginPath(); g.arc(0, 0, r * 0.62, 0, TAU); g.fill(); g.stroke();
    g.fillStyle = lightCol;
    g.beginPath(); g.arc(-3, -3, r * 0.25, 0, TAU); g.fill();
    g.restore();
  } else if (b.kind === 'tesla') {
    drawCylinder25D(g, r, ox * 0.65, oy * 0.65, '#2b303c', '#484e5e');
    g.save();
    g.translate(ox, oy);
    g.strokeStyle = '#1fc7c1'; g.lineWidth = 3;
    g.beginPath(); g.arc(0, 0, r * 0.72, 0, TAU); g.stroke();
    const pR = r * 0.46 + Math.sin(now * 0.012) * 2.5;
    g.fillStyle = '#1fc7c1'; g.strokeStyle = '#16181d'; g.lineWidth = 3;
    g.beginPath(); g.arc(0, 0, pR, 0, TAU); g.fill(); g.stroke();
    g.fillStyle = '#fff8ea';
    g.beginPath(); g.arc(-3, -3, pR * 0.42, 0, TAU); g.fill();
    g.restore();
  } else if (b.kind === 'wall') {
    drawBox25D(g, r * 0.92, r * 0.92, 6, ox * 0.5, oy * 0.5, '#6d675c', '#c8ba9b');
    g.save();
    g.translate(ox * 0.5, oy * 0.5);
    g.fillStyle = color; g.strokeStyle = '#16181d'; g.lineWidth = 2;
    g.fillRect(-r * 0.58, -4, r * 1.16, 8);
    g.strokeRect(-r * 0.58, -4, r * 1.16, 8);
    g.restore();
  }

  g.globalAlpha = 1;

  // Grille d'échafaudage 2.5D si le bâtiment est en cours de construction
  if (!isIcon && b.constructing) {
    g.strokeStyle = '#ffc531';
    g.lineWidth = 2.5;
    g.setLineDash([6, 5]);
    g.strokeRect(-r * 0.85, -r * 0.85, r * 1.7, r * 1.7);
    g.setLineDash([]);
    const bw = r * 1.9;
    g.fillStyle = '#16181d';
    g.fillRect(-bw / 2 - 1, oy - r - 23, bw + 2, 7);
    g.fillStyle = '#ffc531';
    g.fillRect(-bw / 2, oy - r - 22, bw * clamp(b.buildProg || 0, 0, 1), 5);
  }

  // Anneau de progression de la file d'attente de production
  if (!isIcon && !b.constructing && Array.isArray(b.queue) && b.queue.length > 0 && b.qTotal > 0) {
    const prog = clamp(1 - b.qTimer / b.qTotal, 0, 1);
    g.strokeStyle = '#ffc531';
    g.lineWidth = 4;
    g.beginPath();
    g.arc(ox, oy, r + 6, -Math.PI / 2, -Math.PI / 2 + prog * TAU);
    g.stroke();
  }

  // Barre de PV
  if (!isIcon && (b.hp < b.maxHp || b.kind === 'hq' || selected)) {
    const bw = r * 1.9, bh = 6;
    const pct = clamp(b.hp / b.maxHp, 0, 1);
    g.fillStyle = '#16181d';
    g.beginPath(); g.roundRect(-bw / 2 - 1.5, oy - r - 14, bw + 3, bh + 3, 3); g.fill();
    g.fillStyle = pct > 0.45 ? '#2fbf71' : '#ff4b2b';
    g.fillRect(-bw / 2, oy - r - 12.5, bw * pct, bh);
  }
  g.restore();
}

function drawUnit(g, u, color, selected, now, isIcon = false) {
  const r = u.radius;
  const darkCol = shade(color, -0.35);
  const lightCol = shade(color, 0.25);

  g.save();
  g.translate(u.x || 0, u.y || 0);

  // Halo Stimpack actif
  if (!isIcon && u.stimT > 0) {
    g.strokeStyle = '#ff4b2b';
    g.lineWidth = 2.5;
    g.beginPath(); g.arc(0, 0, r + 4 + Math.sin(now * 0.03) * 2, 0, TAU); g.stroke();
  }

  // Cercle de sélection vert style StarCraft
  if (selected) {
    g.strokeStyle = '#2fbf71';
    g.lineWidth = 2.8;
    g.beginPath(); g.arc(0, 0, r + 6, 0, TAU); g.stroke();
  }

  g.fillStyle = 'rgba(16, 18, 24, 0.35)';
  g.beginPath(); g.ellipse(3.5, 4.5, r * 1.05, r * 0.9, 0, 0, TAU); g.fill();

  g.save();
  g.rotate(u.a || 0);
  g.strokeStyle = '#16181d';
  g.lineWidth = 2.5;

  if (u.kind === 'scv') {
    // OUVRIER VCS (Exosquelette de récolte avec pinces, phares et cristal transporté)
    g.fillStyle = '#383b44';
    g.fillRect(-r * 0.9, -r * 0.85, r * 1.4, 5); g.strokeRect(-r * 0.9, -r * 0.85, r * 1.4, 5);
    g.fillRect(-r * 0.9, r * 0.85 - 5, r * 1.4, 5); g.strokeRect(-r * 0.9, r * 0.85 - 5, r * 1.4, 5);
    // Pinces avant
    g.fillStyle = '#ffc531';
    g.fillRect(r * 0.3, -r * 0.68, 8, 4); g.strokeRect(r * 0.3, -r * 0.68, 8, 4);
    g.fillRect(r * 0.3, r * 0.68 - 4, 8, 4); g.strokeRect(r * 0.3, r * 0.68 - 4, 8, 4);
    // Ressource transportée entre les pinces !
    if (!isIcon && u.carryAmt > 0) {
      g.fillStyle = u.carryType === 'gas' ? '#2fbf71' : u.carryType === 'gold' ? '#ffc531' : '#1fc7c1';
      g.beginPath(); g.arc(r + 3, 0, 5.5, 0, TAU); g.fill(); g.stroke();
    }
    // Cabine blindée
    g.fillStyle = color;
    g.beginPath(); g.roundRect(-r * 0.78, -r * 0.68, r * 1.45, r * 1.36, 4); g.fill(); g.stroke();
    g.fillStyle = '#ffc531';
    g.fillRect(-r * 0.55, -r * 0.45, 5, r * 0.9);
    g.fillStyle = '#a9d8ff';
    g.beginPath(); g.roundRect(0, -r * 0.42, r * 0.48, r * 0.84, 2); g.fill(); g.stroke();

  } else if (u.kind === 'tank' || u.kind === 'siege') {
    const L = r * 1.25, Wd = r * 0.95;
    // Stabilisateurs hydrauliques déployés si Mode Siège actif !
    if (u.sieged) {
      g.fillStyle = '#ffc531';
      for (const [sx, sy] of [[-L * 0.85, -Wd * 1.15], [L * 0.85, -Wd * 1.15], [-L * 0.85, Wd * 1.15], [L * 0.85, Wd * 1.15]]) {
        g.beginPath(); g.arc(sx, sy, 5.5, 0, TAU); g.fill(); g.stroke();
      }
    }
    g.fillStyle = '#26282e';
    for (const sy of [-Wd, Wd - 6]) {
      g.beginPath(); g.roundRect(-L, sy, L * 2, 6, 2); g.fill(); g.stroke();
    }
    g.fillStyle = darkCol;
    g.beginPath(); g.roundRect(-L * 0.9, -Wd * 0.78, L * 1.8, Wd * 1.56, 5); g.fill(); g.stroke();
    g.fillStyle = color;
    g.beginPath(); g.roundRect(-L * 0.75, -Wd * 0.65, L * 1.5, Wd * 1.3, 4); g.fill(); g.stroke();
    g.fillStyle = '#16181d';
    if (u.kind === 'siege') {
      const ext = u.sieged ? 20 : 13;
      g.fillRect(0, -5, r + ext, 10);
      g.fillStyle = '#1fc7c1';
      g.fillRect(4, -2, r + ext - 5, 4);
    } else {
      g.fillRect(2, -3.5, r + 10, 7);
    }
    g.fillStyle = '#fff8ea';
    g.beginPath(); g.arc(-2, 0, r * 0.48, 0, TAU); g.fill(); g.stroke();
    g.fillStyle = color;
    g.beginPath(); g.arc(-2, 0, r * 0.24, 0, TAU); g.fill();

  } else if (u.kind === 'titan') {
    const walk = isIcon ? 0 : Math.sin(now * 0.012 + (u.id || 0)) * 3;
    g.fillStyle = '#383b44';
    g.beginPath(); g.roundRect(-8 + walk, -r * 0.85, 14, 8, 3); g.fill(); g.stroke();
    g.beginPath(); g.roundRect(-8 - walk, r * 0.85 - 8, 14, 8, 3); g.fill(); g.stroke();
    g.fillStyle = '#16181d';
    g.fillRect(2, -r * 0.88, r * 0.95, 7);
    g.fillRect(2, r * 0.88 - 7, r * 0.95, 7);
    g.fillStyle = '#1fc7c1';
    g.fillRect(r * 0.65, -r * 0.82, 6, 4);
    g.fillRect(r * 0.65, r * 0.82 - 4, 6, 4);
    g.fillStyle = color;
    g.beginPath(); g.roundRect(-r * 0.78, -r * 0.78, r * 1.56, r * 1.56, 8); g.fill(); g.stroke();
    g.fillStyle = '#fff8ea';
    g.beginPath(); g.roundRect(-r * 0.45, -r * 0.72, r * 0.9, r * 1.44, 5); g.fill(); g.stroke();
    g.fillStyle = '#ffc531';
    g.beginPath(); g.arc(0, 0, r * 0.34, 0, TAU); g.fill(); g.stroke();

  } else {
    const bob = isIcon ? 0 : Math.sin(now * 0.018 + (u.id || 0)) * 1.5;
    g.fillStyle = u.kind === 'sapper' ? '#ffc531' : darkCol;
    g.beginPath(); g.roundRect(-r * 0.95, -r * 0.55, r * 0.7, r * 1.1, 3); g.fill(); g.stroke();
    if (u.kind === 'rocket') {
      g.fillStyle = '#383b44';
      g.fillRect(-4, 3, r + 9, 6); g.strokeRect(-4, 3, r + 9, 6);
      g.fillStyle = '#ff4b2b';
      g.fillRect(r + 3, 4, 4, 4);
    } else if (u.kind === 'sapper') {
      g.fillStyle = '#ff4b2b';
      g.beginPath(); g.arc(r * 0.75, 0, 5, 0, TAU); g.fill(); g.stroke();
    } else {
      g.fillStyle = '#16181d';
      g.fillRect(2, 2, r + 6, 4.5);
    }
    g.fillStyle = color;
    g.beginPath(); g.arc(bob * 0.3, 0, r * 0.88, 0, TAU); g.fill(); g.stroke();
    g.fillStyle = '#a9d8ff';
    g.beginPath(); g.roundRect(r * 0.15, -r * 0.48, r * 0.52, r * 0.96, 3); g.fill(); g.stroke();
    g.fillStyle = lightCol;
    g.beginPath(); g.arc(-r * 0.25, -r * 0.25, r * 0.28, 0, TAU); g.fill();
  }
  g.restore();

  if (!isIcon && (u.hp < u.maxHp || selected)) {
    const bw = r * 2.1, pct = clamp(u.hp / u.maxHp, 0, 1);
    g.fillStyle = '#16181d';
    g.fillRect(-bw / 2 - 1, -r - 10, bw + 2, 5);
    g.fillStyle = pct > 0.45 ? '#2fbf71' : '#ff4b2b';
    g.fillRect(-bw / 2, -r - 9, bw * pct, 3);
  }
  g.restore();
}

function drawThumbIcon(canvasEl, kind, playerColor) {
  if (!canvasEl) return;
  const g = canvasEl.getContext('2d');
  const w = canvasEl.width, h = canvasEl.height;
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.clearRect(0, 0, w, h);
  g.save();
  g.translate(w / 2, h / 2 + 2);
  if (BUILDINGS[kind]) {
    const def = BUILDINGS[kind];
    const sc = Math.min(0.85, 22 / def.radius);
    g.scale(sc, sc);
    drawBuilding(g, { kind, x: 0, y: 0, radius: def.radius, hp: def.hp, maxHp: def.hp, aimA: -0.4 }, playerColor, false, 0, true);
  } else if (UNITS[kind]) {
    const def = UNITS[kind];
    const sc = Math.min(1.4, 18 / def.radius);
    g.scale(sc, sc);
    drawUnit(g, { kind, x: 0, y: 0, radius: def.radius, a: -0.35, hp: def.hp, maxHp: def.hp }, playerColor, false, 0, true);
  }
  g.restore();
}

function screenToWorld(sx, sy) {
  return {
    x: cam.x + (sx - W / 2) / cam.z,
    y: cam.y + (sy - H / 2) / cam.z,
  };
}

function centerOnMyHq() {
  if (!state) return;
  const hq = state.buildings.find((b) => b.owner === myId && b.kind === 'hq');
  if (hq) { cam.x = hq.x; cam.y = hq.y; }
}

let toastTimer = 0;
function toast(msg, ms = 2400) {
  const el = $('#uiToast');
  el.textContent = msg;
  el.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.hidden = true; }, ms);
}

function handleFxEvents(list) {
  if (!Array.isArray(list)) return;
  for (const e of list) {
    if (e.k === 'SHOT' || e.k === 'ROCKET' || e.k === 'PLASMA') {
      const isPlasma = e.k === 'PLASMA', isRocket = e.k === 'ROCKET';
      projectiles.push({
        x: e.x1, y: e.y1, tx: e.x2, ty: e.y2,
        prog: 0, speed: isPlasma ? 4.8 : isRocket ? 5.5 : 9.0,
        color: isPlasma ? '#1fc7c1' : isRocket ? '#ff4b2b' : (e.color || '#ffc531'),
        r: isPlasma ? 6 : isRocket ? 5 : 3.2,
      });
      if (hypot(e.x1, e.y1, cam.x, cam.y) < 700) {
        if (isPlasma) Sfx.plasma(); else Sfx.shoot();
      }
    } else if (e.k === 'TESLA') {
      beams.push({ x1: e.x1, y1: e.y1, x2: e.x2, y2: e.y2, color: '#1fc7c1', w: 4.5, life: 0.22, maxLife: 0.22, tesla: true });
      shockwaves.push({ x: e.x2, y: e.y2, r: 8, maxR: 48, color: '#1fc7c1', life: 0.22, maxLife: 0.22 });
      if (hypot(e.x2, e.y2, cam.x, cam.y) < 750) Sfx.plasma();
    } else if (e.k === 'MINE' || e.k === 'SPARK') {
      const a = Math.random() * TAU;
      particles.push({
        x: e.x, y: e.y, vx: Math.cos(a) * 35, vy: Math.sin(a) * 35,
        r: 2.8, color: e.color || '#1fc7c1', life: 0.18,
      });
    } else if (e.k === 'STIM') {
      shockwaves.push({ x: e.x, y: e.y, r: 4, maxR: 26, color: '#ff4b2b', life: 0.22, maxLife: 0.22 });
    } else if (e.k === 'SIEGE') {
      shockwaves.push({ x: e.x, y: e.y, r: 6, maxR: 32, color: '#ffc531', life: 0.25, maxLife: 0.25 });
      if (hypot(e.x, e.y, cam.x, cam.y) < 800) Sfx.siege();
    } else if (e.k === 'SCAN') {
      shockwaves.push({ x: e.x, y: e.y, r: 20, maxR: 380, color: '#1fc7c1', life: 0.55, maxLife: 0.55 });
      Sfx.scan();
    } else if (e.k === 'BOOM' || e.k === 'BOOM_BIG') {
      const big = e.k === 'BOOM_BIG';
      const cnt = big ? 24 : 10;
      shockwaves.push({ x: e.x, y: e.y, r: 10, maxR: big ? 95 : 42, color: big ? '#ffc531' : '#ff4b2b', life: big ? 0.38 : 0.22, maxLife: big ? 0.38 : 0.22 });
      if (big) {
        craters.push({ x: e.x, y: e.y, r: e.r * 0.78 });
        if (craters.length > 45) craters.shift();
        if (hypot(e.x, e.y, cam.x, cam.y) < 900) { cam.shake = Math.max(cam.shake, 10); Sfx.boom(); }
      }
      for (let k = 0; k < cnt; k++) {
        const a = Math.random() * TAU, sp = (big ? 55 : 28) + Math.random() * (big ? 165 : 80);
        particles.push({
          x: e.x, y: e.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
          r: (big ? 6 : 3.5) + Math.random() * 4,
          color: k % 3 === 0 ? '#fff8ea' : k % 2 === 0 ? '#ff4b2b' : '#ffc531',
          life: (big ? 0.45 : 0.26) + Math.random() * 0.15,
        });
      }
    } else if (e.k === 'BUILD' || e.k === 'SPAWN' || e.k === 'COMPLETE') {
      shockwaves.push({ x: e.x, y: e.y, r: 10, maxR: 52, color: e.color || '#ffc531', life: 0.28, maxLife: 0.28 });
    } else if (e.k === 'ELIM') {
      toast(`💥 Le Centre de Commandement de ${e.name} a été détruit !`, 3500);
    } else if (e.k === 'PHASE') {
      const labels = {
        2: '💎 Phase 2 : Intensification des combats',
        3: '🤖 Phase 3 : Guerre Totale (Dégâts +20 %)',
        4: '🔥 MORT SUBITE : Tempête Magnétique & Dégâts ×1.85 !',
      };
      if (labels[e.phase]) toast(labels[e.phase], 3800);
    }
  }
}

function sendCommand(cmd) {
  if (!state || state.over) return;
  if (role === 'guest') {
    HubBridge.send('host', { t: 'cmd', cmd });
    return;
  }
  const fx = [];
  const res = executeCommand(state, myId, cmd, fx);
  if (!res.ok && res.reason) {
    toast(res.reason, 2000);
    Sfx.error();
  } else if (res.ok) {
    if (cmd.op === 'BUILD') Sfx.build();
    else if (cmd.op === 'TRAIN') Sfx.spawn();
    else if (cmd.op === 'STIM') Sfx.stim();
    else if (cmd.op === 'UNIT_ORDER') {
      if (cmd.mode === 'amove' || cmd.mode === 'focus') Sfx.attack();
      else Sfx.order();
    }
    handleFxEvents(fx);
  }
}

/* ============================================================================
   CONTRÔLES RTS STARCRAFT (CLAVIER, GROUPES DE CONTRÔLE, SOURIS)
   ============================================================================ */
function cleanSelection() {
  if (!state) return;
  const validU = new Set(state.units.filter((u) => u.owner === myId && u.hp > 0).map((u) => u.id));
  const validB = new Set(state.buildings.filter((b) => b.owner === myId && b.hp > 0).map((b) => b.id));
  for (const id of [...selectedUnits]) if (!validU.has(id)) selectedUnits.delete(id);
  for (const id of [...selectedBlds]) if (!validB.has(id)) selectedBlds.delete(id);
}

function selectIdleWorker() {
  if (!state) return;
  const idle = state.units.find((u) => u.owner === myId && u.kind === 'scv' && u.mode === 'idle')
    || state.units.find((u) => u.owner === myId && u.kind === 'scv');
  if (idle) {
    selectedUnits.clear(); selectedBlds.clear();
    selectedUnits.add(idle.id);
    cam.x = idle.x; cam.y = idle.y;
    Sfx.order();
  }
}

function selectAllArmy() {
  if (!state) return;
  selectedUnits.clear(); selectedBlds.clear();
  for (const u of state.units) {
    if (u.owner === myId && u.kind !== 'scv' && u.hp > 0) selectedUnits.add(u.id);
  }
  if (selectedUnits.size > 0) Sfx.order();
  else toast('Aucune unité de combat déployée.');
}

function selectBuildingsByKind(kind) {
  if (!state) return;
  selectedUnits.clear(); selectedBlds.clear();
  for (const b of state.buildings) {
    if (b.owner === myId && b.kind === kind && b.hp > 0) selectedBlds.add(b.id);
  }
  if (selectedBlds.size > 0) { cmdTab = 'auto'; Sfx.order(); }
  else toast(`Aucun bâtiment de type ${BUILDINGS[kind]?.name || kind}.`);
}

window.addEventListener('keydown', (e) => {
  if (e.target && e.target.tagName === 'INPUT') return;
  const k = e.key.toLowerCase();
  keys[k] = true;

  if (e.key === 'F1') { e.preventDefault(); selectIdleWorker(); return; }
  if (e.key === 'F2') { e.preventDefault(); selectAllArmy(); return; }
  if (e.key === 'F3') { e.preventDefault(); selectBuildingsByKind('barracks'); return; }
  if (e.key === 'F4') { e.preventDefault(); selectBuildingsByKind('factory'); return; }

  if (k === 'escape') {
    buildMode = null; orderCursor = null; cmdTab = 'auto';
    updateCursorClass(); renderConsoleUI(true);
    return;
  }
  if (k === ' ') { e.preventDefault(); centerOnMyHq(); return; }

  // Si menu Construire actif (ou uniquement des Ouvriers VCS sélectionnés sans Ctrl) : 1..8 choisit un bâtiment
  const selUList = state ? state.units.filter((u) => selectedUnits.has(u.id)) : [];
  const onlyScvSelected = selUList.length > 0 && selUList.every((u) => u.kind === 'scv');
  if ((cmdTab === 'build' || onlyScvSelected) && !e.ctrlKey && !e.metaKey && /^[1-8]$/.test(k)) {
    const bMap = { '1': 'pylon', '2': 'extractor', '3': 'barracks', '4': 'factory', '5': 'turret', '6': 'tesla', '7': 'wall', '8': 'hq' };
    orderCursor = null;
    buildMode = buildMode === bMap[k] ? null : bMap[k];
    updateCursorClass();
    renderConsoleUI(true);
    return;
  }

  // Groupes de contrôle 1..9 (Ctrl+Num pour assigner, Num pour sélectionner / double-tap centrer)
  if (/^[1-9]$/.test(k)) {
    const g = Number(k);
    if (e.ctrlKey || e.metaKey) {
      e.preventDefault();
      controlGroups[g] = { units: [...selectedUnits], blds: [...selectedBlds] };
      toast(`Groupe de contrôle #${g} assigné`);
      return;
    }
    const grp = controlGroups[g];
    if (grp && ((grp.units && grp.units.length) || (grp.blds && grp.blds.length))) {
      selectedUnits = new Set(grp.units || []);
      selectedBlds = new Set(grp.blds || []);
      cleanSelection();
      const now = performance.now();
      if (lastGroupTap.g === g && now - lastGroupTap.t < 350) {
        const firstU = state.units.find((u) => selectedUnits.has(u.id));
        const firstB = state.buildings.find((b) => selectedBlds.has(b.id));
        const ent = firstU || firstB;
        if (ent) { cam.x = ent.x; cam.y = ent.y; }
      }
      lastGroupTap = { g, t: now };
      renderConsoleUI(true);
    }
    return;
  }

  // Raccourcis RTS : A = Attack-Move, S = Stop, H = Hold, T = Stimpack, E = Siege/3e unité, B = Construire, X = Scan Radar
  if (k === 'b') { cmdTab = cmdTab === 'build' ? 'auto' : 'build'; renderConsoleUI(true); return; }
  if (k === 'x') { buildMode = null; orderCursor = orderCursor === 'scan' ? null : 'scan'; updateCursorClass(); renderConsoleUI(true); return; }

  if (selectedUnits.size > 0 && cmdTab !== 'build') {
    if (k === 'a') { buildMode = null; orderCursor = 'amove'; updateCursorClass(); renderConsoleUI(true); return; }
    if (k === 's') { sendCommand({ op: 'UNIT_ORDER', mode: 'stop', unitIds: [...selectedUnits] }); return; }
    if (k === 'h') { sendCommand({ op: 'UNIT_ORDER', mode: 'hold', unitIds: [...selectedUnits] }); return; }
    if (k === 'r' && onlyScvSelected) { sendCommand({ op: 'UNIT_ORDER', mode: 'harvest_min', x: cam.x, y: cam.y, unitIds: [...selectedUnits] }); return; }
    if (k === 't') { sendCommand({ op: 'STIM', unitIds: [...selectedUnits] }); return; }
    if (k === 'e') { sendCommand({ op: 'SIEGE', unitIds: [...selectedUnits] }); return; }
  }

  // Si un bâtiment de production est sélectionné : Q / W / E entraînent les unités !
  if (selectedBlds.size > 0 && cmdTab !== 'build') {
    const firstB = state?.buildings.find((b) => selectedBlds.has(b.id));
    if (firstB) {
      const trains = BUILDINGS[firstB.kind]?.trains || [];
      const keyIdx = { q: 0, w: 1, e: 2 }[k];
      if (keyIdx !== undefined && trains[keyIdx]) {
        for (const bId of selectedBlds) {
          sendCommand({ op: 'TRAIN', unit: trains[keyIdx], bldId: bId });
        }
        return;
      }
    }
  }

  // Si aucune sélection (Mode Global Macro) : C/Q/W/E/R/T/Y produisent directement et A lance A-Move
  if (selectedUnits.size === 0 && selectedBlds.size === 0 && cmdTab !== 'build') {
    if (k === 'a') { buildMode = null; orderCursor = 'amove'; updateCursorClass(); renderConsoleUI(true); return; }
    const macroMap = { c: 'scv', q: 'marine', w: 'rocket', e: 'sapper', r: 'tank', t: 'siege', y: 'titan' };
    if (macroMap[k]) {
      sendCommand({ op: 'TRAIN', unit: macroMap[k] });
      return;
    }
  }
});

function updateCursorClass() {
  cvs.classList.toggle('cur-attack', orderCursor === 'amove' || orderCursor === 'scan');
