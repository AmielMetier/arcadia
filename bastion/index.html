    return count > 0 ? { ok: true } : { ok: false, reason: 'Sélectionne un Char de Siège.' };
  }

  // 7. CAPACITÉ COMSAT DU QG : SCAN RADAR (C - 50 Minéraux)
  if (cmd.op === 'SCAN') {
    if (p.minerals < 50) return { ok: false, reason: '50💎 requis pour lancer un Scan Radar.' };
    p.minerals -= 50;
    const x = clamp(Math.round(Number(cmd.x) || HALF_W), 60, WORLD_SIZE - 60);
    const y = clamp(Math.round(Number(cmd.y) || HALF_W), 60, WORLD_SIZE - 60);
    const mapDef = MAP_DEFS[state.map] || MAP_DEFS.vallee;
    const scanR = Math.round(380 * (mapDef.scanRadiusMult || 1.0));
    state.scans.push({ x, y, team: p.team, r: scanR, timer: 10.0 });
    fxEvents.push({ k: 'SCAN', x, y, color: '#1fc7c1', r: scanR });
    return { ok: true };
  }

  // 8. CAPACITÉ TACTIQUE : EMBARQUER DANS UNE NAVETTE DE TRANSPORT
  if (cmd.op === 'BOARD') {
    const dropship = state.units.find((x) => x.id === cmd.targetId && x.kind === 'dropship' && Number(x.owner) === Number(p.id) && x.hp > 0);
    if (!dropship) return { ok: false, reason: 'Navette de transport introuvable.' };
    const ids = new Set(Array.isArray(cmd.unitIds) ? cmd.unitIds : []);
    let count = 0;
    for (const u of state.units) {
      if (u.owner === p.id && ids.has(u.id) && !u.flying && !u.boardedIn && u.hp > 0) {
        u.mode = 'board';
        u.targetEntId = dropship.id;
        u.orderX = dropship.x;
        u.orderY = dropship.y;
        count++;
      }
    }
    return count > 0 ? { ok: true } : { ok: false, reason: 'Aucune troupe terrestre valide à embarquer.' };
  }

  // 9. CAPACITÉ TACTIQUE : DÉBARQUER TOUTES LES TROUPES (V)
  if (cmd.op === 'UNLOAD') {
    const dropship = state.units.find((x) => x.id === cmd.dropshipId && x.kind === 'dropship' && Number(x.owner) === Number(p.id) && x.hp > 0);
    if (!dropship) return { ok: false };
    if (!Array.isArray(dropship.cargo) || dropship.cargo.length === 0) {
      return { ok: false, reason: 'La navette est vide.' };
    }
    const passengers = dropship.cargo.slice();
    dropship.cargo = [];
    const n = passengers.length;
    for (let i = 0; i < n; i++) {
      const pId = passengers[i];
      const pass = state.units.find((x) => x.id === pId);
      if (pass) {
        pass.boardedIn = null;
        pass.mode = 'idle';
        const ang = (i / n) * TAU;
        const dist = dropship.radius + pass.radius + 14;
        let dropX = clamp(dropship.x + Math.cos(ang) * dist, 30, WORLD_SIZE - 30);
        let dropY = clamp(dropship.y + Math.sin(ang) * dist, 30, WORLD_SIZE - 30);
        if (waterActive && isWaterAt(dropX, dropY)) {
          const l = nearestLand(dropX, dropY);
          dropX = l.x; dropY = l.y;
        }
        pass.x = dropX;
        pass.y = dropY;
        pass.vx = 0; pass.vy = 0;
        pass.orderX = null; pass.orderY = null;
        fxEvents.push({ k: 'UNLOAD', x: dropX, y: dropY, kind: pass.kind });
      }
    }
    return { ok: true };
  }

  return { ok: false };
}

/* ============================================================================
   SIMULATION DU MONDE TEMPS RÉEL (20 HZ)
   ============================================================================ */
function finishBuildingConstruction(state, b, owner, fxEvents) {
  b.constructing = false;
  b.buildStarted = true;
  b.buildProg = 1;
  b.hp = b.maxHp;
  fxEvents.push({ k: 'COMPLETE', x: b.x, y: b.y, color: owner ? owner.color : '#ffc531', kind: b.kind });
  for (const u of state.units) {
    if (u.kind === 'scv' && u.buildTargetId === b.id) {
      // Le VCS sort proprement du périmètre du bâtiment achevé
      const ang = Math.atan2(u.y - b.y, u.x - b.x) || 0.6;
      const outDist = b.radius + u.radius + 6;
      u.x = clamp(b.x + Math.cos(ang) * outDist, 26, WORLD_SIZE - 26);
      u.y = clamp(b.y + Math.sin(ang) * outDist, 26, WORLD_SIZE - 26);
      u.onSite = false;
      u.buildTargetId = null;
      if (b.kind === 'extractor') {
        u.mode = 'harvest_gas';
        u.harvestId = b.id;
      } else {
        u.mode = 'harvest_min';
        u.harvestId = nearestMineral(u.x, u.y, 500)?.id ?? null;
      }
    }
  }
}

function applyUpgrade(state, owner, upgId, fxEvents) {
  const upgDef = UPGRADES[upgId];
  if (!upgDef) return;
  owner.upgrades = owner.upgrades || {};
  owner.upgrades[upgId] = true;
  fxEvents.push({ k: 'UPGRADE_DONE', ownerId: owner.id, upgId, name: upgDef.name });

  if (upgDef.hpMult) {
    const mult = upgDef.hpMult;
    for (const u of state.units) {
      if (u.owner === owner.id && upgDef.appliesTo.includes(u.kind)) {
        const baseDef = UNITS[u.kind];
        if (baseDef) {
          u.maxHp = Math.round(baseDef.hp * mult);
          u.hp = Math.min(u.maxHp, Math.round(u.hp * mult));
        }
      }
    }
  }
}

function stepWorld(state, dt, fxEvents) {
  if (state.over) return;
  state.time += dt;

  const t = state.time;
  const p2At = state.blitz ? 120 : 210;
  const p3At = state.blitz ? 360 : 720;
  const sdAt = state.blitz ? 600 : 1350;
  const newPhase = t >= sdAt ? 4 : t >= p3At ? 3 : t >= p2At ? 2 : 1;
  if (newPhase !== state.phase) {
    state.phase = newPhase;
    fxEvents.push({ k: 'PHASE', phase: newPhase });
  }
  state.dmgMult = state.phase === 4 ? 1.85 : state.phase === 3 ? 1.2 : 1.0;

  if (state.phase === 4) {
    state.stormRadius = Math.max(380, state.stormRadius - (state.blitz ? 16 : 9) * dt);
  }

  for (let i = state.scans.length - 1; i >= 0; i--) {
    state.scans[i].timer -= dt;
    if (state.scans[i].timer <= 0) state.scans.splice(i, 1);
  }

  for (const p of state.players) {
    if (p.dead) continue;
    p.minerals = Math.min(9999, p.minerals + 1.25 * dt); // Réduit de 50% (auparavant 2.5)
    const myRefs = state.buildings.filter((b) => b.owner === p.id && b.kind === 'extractor' && b.hp > 0 && !b.constructing).length;
    if (myRefs > 0) p.gas = Math.min(9999, p.gas + myRefs * 1.1 * dt); // Réduit de 50% (auparavant 2.2)
  }

  for (const b of state.buildings) {
    if (b.hp <= 0) continue;
    const owner = state.players.find((p) => p.id === b.owner);
    if (!owner || owner.dead) { b.hp = 0; continue; }
    const def = BUILDINGS[b.kind];

    if (state.phase === 4 && hypot(b.x, b.y, HALF_W, HALF_W) > state.stormRadius) {
      b.hp -= 35 * dt;
    }

    // Important : Un chantier en construction NE PROGRESSE PAS tout seul !
    // Il exige qu'un Ouvrier VCS soit physiquement SUR l'emplacement de construction.
    if (b.constructing) {
      if (b.buildProg >= 1) {
        finishBuildingConstruction(state, b, owner, fxEvents);
      }
      continue;
    }

    if (def.heal) {
      const r2 = def.range * def.range;
      for (const u of state.units) {
        if (u.team === b.team && u.hp < u.maxHp && dist2(b.x, b.y, u.x, u.y) <= r2) {
          u.hp = Math.min(u.maxHp, u.hp + def.heal * dt);
        }
      }
    }

    if (Array.isArray(b.queue) && b.queue.length > 0) {
      b.qTimer -= dt;
      if (b.qTimer <= 0) {
        const item = b.queue.shift();
        if (UPGRADES[item]) {
          applyUpgrade(state, owner, item, fxEvents);
        } else {
          spawnTrainedUnit(state, owner, b, item, fxEvents);
        }
        if (b.queue.length > 0) {
          const nextDef = UNITS[b.queue[0]] || UPGRADES[b.queue[0]];
          const nextTime = nextDef.trainTime ?? nextDef.time ?? 8;
          b.qTotal = state.blitz ? nextTime * 0.65 : nextTime;
          b.qTimer = b.qTotal;
        } else {
          b.qTimer = 0;
          b.qTotal = 0;
        }
      }
    }

    if (def.range > 0 && def.dmg > 0) {
      b.cd = Math.max(0, (b.cd || 0) - dt);
      if (b.cd <= 0) {
        let target = null, bestD2 = def.range * def.range;
        for (const u of state.units) {
          if (u.team !== b.team && u.hp > 0) {
            const d2 = dist2(b.x, b.y, u.x, u.y);
            if (d2 <= bestD2) { bestD2 = d2; target = u; }
          }
        }
        if (target) {
          b.cd = def.rate;
          b.aimA = Math.atan2(target.y - b.y, target.x - b.x);
          const dmg = def.dmg * state.dmgMult;
          target.hp -= dmg;
          if (def.splash) {
            const mapDef = MAP_DEFS[state.map] || MAP_DEFS.vallee;
            const splashR = def.splash * (mapDef.splashMult || 1.0);
            const s2 = splashR * splashR;
            for (const u2 of state.units) {
              if (u2 !== target && u2.team !== b.team && dist2(target.x, target.y, u2.x, u2.y) <= s2) {
                u2.hp -= dmg * 0.6;
              }
            }
          }
          fxEvents.push({
            k: b.kind === 'tesla' ? 'TESLA' : 'SHOT',
            x1: b.x, y1: b.y - 16, x2: target.x, y2: target.y, color: owner.color,
          });
        }
      }
    }
  }

  for (const u of state.units) {
    if (u.hp <= 0) continue;
    const def = UNITS[u.kind];
    const owner = state.players.find((p) => p.id === u.owner);
    if (!owner || owner.dead) { u.hp = 0; continue; }

    // Unités embarquées dans une navette de transport : suivent la navette et sont inactives
    if (u.boardedIn) {
      const dShip = state.units.find((d) => d.id === u.boardedIn && d.hp > 0);
      if (dShip) {
        u.x = dShip.x;
        u.y = dShip.y;
        u.vx = 0;
        u.vy = 0;
        continue;
      } else {
        u.boardedIn = null;
        u.mode = 'idle';
      }
    }

    // Troupes en train de rejoindre une navette pour embarquer
    if (u.mode === 'board' && u.targetEntId) {
      const dropship = state.units.find((x) => x.id === u.targetEntId && x.kind === 'dropship' && x.hp > 0);
      if (!dropship) {
        u.mode = 'idle';
        u.targetEntId = null;
      } else {
        dropship.cargo = dropship.cargo || [];
        const d = hypot(u.x, u.y, dropship.x, dropship.y);
        if (d <= dropship.radius + u.radius + 24) {
          if (dropship.cargo.length < (dropship.maxCargo || 4)) {
            dropship.cargo.push(u.id);
            u.boardedIn = dropship.id;
            u.mode = 'boarded';
            u.targetEntId = null;
            u.orderX = null;
            u.orderY = null;
            fxEvents.push({ k: 'BOARD', x: dropship.x, y: dropship.y, kind: u.kind });
            continue;
          } else {
            u.mode = 'idle';
            u.targetEntId = null;
          }
        } else {
          u.orderX = dropship.x;
          u.orderY = dropship.y;
        }
      }
    }

    // Navette Médicale : soin nanite automatique en continu des unités alliées au sol
    if (u.kind === 'medivac' && u.hp > 0) {
      let bestWounded = null, bestWoundDist = 190 * 190;
      for (const ally of state.units) {
        if (ally.team === u.team && ally.hp > 0 && ally.hp < ally.maxHp && !ally.flying && !ally.boardedIn) {
          const d2 = dist2(u.x, u.y, ally.x, ally.y);
          if (d2 <= bestWoundDist) {
            bestWoundDist = d2;
            bestWounded = ally;
          }
        }
      }
      if (bestWounded) {
        u.healingTargetId = bestWounded.id;
        bestWounded.hp = Math.min(bestWounded.maxHp, bestWounded.hp + (def.healRate || 24) * dt);
        u.a = Math.atan2(bestWounded.y - u.y, bestWounded.x - u.x);
        if (Math.random() < 0.28) {
          fxEvents.push({ k: 'HEAL_RAY', x1: u.x, y1: u.y, x2: bestWounded.x, y2: bestWounded.y });
        }
      } else {
        u.healingTargetId = null;
      }
    }

    if (u.stimT > 0) u.stimT = Math.max(0, u.stimT - dt);
    const stimMult = u.stimT > 0 ? 1.48 : 1.0;
    u.cd = Math.max(0, u.cd - dt * stimMult);

    if (u.kind === 'scv') {
      if (u.mode === 'build' && u.buildTargetId) {
        const bld = state.buildings.find((b) => b.id === u.buildTargetId && b.hp > 0);
        if (!bld) {
          u.mode = 'harvest_min';
          u.buildTargetId = null;
          u.onSite = false;
          const m = nearestMineral(u.x, u.y, 400);
          u.harvestId = m ? m.id : null;
        } else if (bld.constructing) {
          // CONSTRUCTION FAÇON STARCRAFT : Le VCS doit être PHYSIQUEMENT SUR l'endroit de construction !
          const distCenter = hypot(u.x, u.y, bld.x, bld.y);
          const siteRadius = Math.max(16, bld.radius * 0.72);
          if (distCenter <= siteRadius || u.onSite) {
            u.onSite = true;
            bld.buildStarted = true;

            // Le VCS se déplace d'un point de soudure à l'autre SUR la dalle du chantier
            u.weldTimer = (u.weldTimer || 0) - dt;
            if (u.weldTimer <= 0 || u.weldX == null || u.weldY == null) {
              u.weldTimer = 1.0 + Math.random() * 0.75;
              const wAng = Math.random() * TAU;
              const wR = bld.radius * (0.16 + Math.random() * 0.36);
              u.weldX = bld.x + Math.cos(wAng) * wR;
              u.weldY = bld.y + Math.sin(wAng) * wR;
            }
            const wx = u.weldX - u.x, wy = u.weldY - u.y;
            const wd = Math.hypot(wx, wy);
            if (wd > 3) {
              const mapDef = MAP_DEFS[state.map] || MAP_DEFS.vallee;
              const moveMult = mapDef.moveSpeedMult || 1.0;
              const stepSpd = Math.min(wd, def.speed * moveMult * 0.55 * dt);
              u.vx = (wx / wd) * (def.speed * moveMult * 0.55);
              u.vy = (wy / wd) * (def.speed * moveMult * 0.55);
              u.x += (wx / wd) * stepSpd;
              u.y += (wy / wd) * stepSpd;
            } else {
              u.vx = 0; u.vy = 0;
            }
            // Oriente le chalumeau du VCS vers le cœur de la structure sur le chantier
            u.a = Math.atan2(bld.y - u.y, bld.x - u.x);

            const step = (1.0 / (bld.buildTime || 8)) * dt;
            bld.buildProg += step;
            bld.hp = Math.min(bld.maxHp, bld.hp + bld.maxHp * 0.85 * step);
            if (Math.random() < 0.48) {
              fxEvents.push({ k: 'SPARK', x: u.x + Math.cos(u.a) * 14, y: u.y + Math.sin(u.a) * 14, color: '#ffc531' });
            }
            if (bld.buildProg >= 1) {
              finishBuildingConstruction(state, bld, owner, fxEvents);
            }
            continue;
          } else {
            // En route vers le centre du chantier de construction
            u.orderX = bld.x;
            u.orderY = bld.y;
          }
        } else {
          // Réparation d'un bâtiment déjà construit
          u.onSite = false;
          const d = hypot(u.x, u.y, bld.x, bld.y) - bld.radius - u.radius;
          if (d <= 18) {
            u.a = Math.atan2(bld.y - u.y, bld.x - u.x);
            u.vx = 0; u.vy = 0;
            if (bld.hp < bld.maxHp && owner.minerals >= 1) {
              bld.hp = Math.min(bld.maxHp, bld.hp + 45 * dt);
              owner.minerals = Math.max(0, owner.minerals - 3 * dt);
              if (Math.random() < 0.35) fxEvents.push({ k: 'SPARK', x: u.x + Math.cos(u.a) * 14, y: u.y + Math.sin(u.a) * 14, color: '#ffc531' });
            } else {
              u.mode = bld.kind === 'extractor' ? 'harvest_gas' : 'harvest_min';
              u.harvestId = bld.kind === 'extractor' ? bld.id : (nearestMineral(u.x, u.y, 500)?.id ?? null);
              u.buildTargetId = null;
            }
            continue;
          } else {
            u.orderX = bld.x;
            u.orderY = bld.y;
          }
        }
      }

      if (u.mode === 'harvest_min' || u.mode === 'harvest_gas') {
        u.onSite = false;
        const hq = nearestMyHq(state, u.owner, u.x, u.y);
        if (u.carryAmt > 0 && hq) {
          const dHq = hypot(u.x, u.y, hq.x, hq.y) - hq.radius - u.radius;
          if (dHq <= 18) {
            if (u.carryType === 'gas') owner.gas = Math.min(9999, owner.gas + u.carryAmt);
            else owner.minerals = Math.min(9999, owner.minerals + u.carryAmt);
            owner.score += 2;
            u.carryAmt = 0;
            u.carryType = null;
            continue;
          } else {
            u.orderX = hq.x;
            u.orderY = hq.y;
          }
        } else if (u.mode === 'harvest_min') {
          let mNode = MINERAL_NODES.find((m) => m.id === u.harvestId) || nearestMineral(u.x, u.y);
          if (mNode) {
            u.harvestId = mNode.id;
            const dM = hypot(u.x, u.y, mNode.x, mNode.y) - 22 - u.radius;
            if (dM <= 16) {
              u.a = Math.atan2(mNode.y - u.y, mNode.x - u.x);
              u.vx = 0; u.vy = 0;
              u.gatherT = (u.gatherT || 0) + dt;
              if (Math.random() < 0.25) fxEvents.push({ k: 'MINE', x: mNode.x, y: mNode.y, color: mNode.rich ? '#ffc531' : '#1fc7c1' });
              const mapDef = MAP_DEFS[state.map] || MAP_DEFS.vallee;
              if (u.gatherT >= (mapDef.mineHarvestTime || 1.55)) {
                u.gatherT = 0;
                u.carryType = mNode.rich ? 'gold' : 'min';
                u.carryAmt = mNode.rich ? 6 : 4; // Réduit de 50% (auparavant 12 / 8)
              }
              continue;
            } else {
              u.orderX = mNode.x;
              u.orderY = mNode.y;
            }
          }
        } else if (u.mode === 'harvest_gas') {
          const ref = state.buildings.find((b) => b.id === u.harvestId && b.owner === u.owner && b.kind === 'extractor' && b.hp > 0 && !b.constructing)
            || state.buildings.find((b) => b.owner === u.owner && b.kind === 'extractor' && b.hp > 0 && !b.constructing);
          if (ref) {
            u.harvestId = ref.id;
            const dR = hypot(u.x, u.y, ref.x, ref.y) - ref.radius - u.radius;
            if (dR <= 16) {
              u.a = Math.atan2(ref.y - u.y, ref.x - u.x);
              u.vx = 0; u.vy = 0;
              u.gatherT = (u.gatherT || 0) + dt;
              const mapDef = MAP_DEFS[state.map] || MAP_DEFS.vallee;
              if (u.gatherT >= 1.7) {
                u.gatherT = 0;
                u.carryType = 'gas';
                u.carryAmt = Math.max(1, Math.round(3 * (mapDef.gasHarvestMult || 1.0))); // Réduit de 50% (auparavant 6)
              }
              continue;
            } else {
              u.orderX = ref.x;
              u.orderY = ref.y;
            }
          } else {
            u.mode = 'harvest_min';
          }
        }
      }
    }

    const effRange = u.sieged && def.siegeRange ? def.siegeRange : def.range;
    const effDmg = u.sieged && def.siegeDmg ? def.siegeDmg : def.dmg;
    const effRate = u.sieged && def.siegeRate ? def.siegeRate : def.rate;

    let bestTarget = null, bestScore = Infinity;
    if (u.mode !== 'move' && u.mode !== 'harvest_min' && u.mode !== 'harvest_gas' && u.mode !== 'build') {
      const aggroR = u.sieged || u.mode === 'hold' ? effRange : Math.max(255, effRange + 65);

      if (u.mode === 'focus' && u.targetEntId) {
        const fUnit = state.units.find((e) => e.id === u.targetEntId && e.hp > 0);
        const fBld = fUnit ? null : state.buildings.find((b) => b.id === u.targetEntId && b.hp > 0);
        const ent = fUnit || fBld;
        if (ent && ent.team !== u.team) {
          const d = hypot(u.x, u.y, ent.x, ent.y) - ent.radius;
          bestTarget = { ent, isBld: !!fBld, dist: d };
        } else {
          u.mode = 'amove';
          u.targetEntId = null;
        }
      }

      if (!bestTarget && def.dmg > 0) {
        for (const e of state.units) {
          if (e.team === u.team || e.hp <= 0 || e.boardedIn) continue;
          if (e.flying && (u.kind === 'scv' || u.kind === 'siege' || u.kind === 'sapper')) continue;
          const d = hypot(u.x, u.y, e.x, e.y) - e.radius;
          if (d <= aggroR) {
            const prio = e.kind === 'scv' ? 35 : 0;
            if (d + prio < bestScore) { bestScore = d + prio; bestTarget = { ent: e, isBld: false, dist: d }; }
          }
        }
        for (const b of state.buildings) {
          if (b.team === u.team || b.hp <= 0) continue;
          const d = hypot(u.x, u.y, b.x, b.y) - b.radius;
          if (d <= aggroR + 30) {
            const prio = b.kind === 'wall' ? (u.kind === 'sapper' ? -20 : 60) : (u.kind === 'sapper' ? -45 : 20);
            if (d + prio < bestScore) { bestScore = d + prio; bestTarget = { ent: b, isBld: true, dist: d }; }
          }
        }
      }
    }

    if (bestTarget && bestTarget.dist <= effRange) {
      const tgt = bestTarget.ent;
      u.a = Math.atan2(tgt.y - u.y, tgt.x - u.x);
      u.vx *= 0.4;
      u.vy *= 0.4;
      if (u.cd <= 0) {
        u.cd = effRate;
        let dmg = effDmg * state.dmgMult;
        if (owner?.upgrades) {
          if (['marine', 'rocket', 'sapper'].includes(u.kind) && owner.upgrades.infantry_weapons) dmg *= 1.25;
          if (['tank', 'siege', 'titan'].includes(u.kind) && owner.upgrades.vehicle_weapons) dmg *= 1.25;
        }
        if (bestTarget.isBld) dmg *= def.bldMult || 1;
        else if (u.kind === 'rocket' && UNITS[tgt.kind]?.mech) dmg *= 1.5;
        tgt.hp -= dmg;
        if (def.splash || u.sieged) {
          const mapDef = MAP_DEFS[state.map] || MAP_DEFS.vallee;
          const splashR = (def.splash || 58) * (mapDef.splashMult || 1.0);
          const s2 = splashR * splashR;
          for (const e2 of state.units) {
            if (e2 !== tgt && e2.team !== u.team && dist2(tgt.x, tgt.y, e2.x, e2.y) <= s2) e2.hp -= dmg * 0.55;
          }
        }
        owner.score += Math.round(dmg * 0.12);
        fxEvents.push({
          k: u.sieged || u.kind === 'siege' || u.kind === 'titan' ? 'PLASMA' : u.kind === 'rocket' ? 'ROCKET' : 'SHOT',
          x1: u.x, y1: u.y, x2: tgt.x, y2: tgt.y, color: owner.color,
        });
      }
      continue;
    }

    if (u.sieged || u.mode === 'hold') {
      u.vx = 0; u.vy = 0;
      continue;
    }

    let goalX = u.orderX, goalY = u.orderY;
    if (bestTarget && u.mode !== 'move') {
      goalX = bestTarget.ent.x;
      goalY = bestTarget.ent.y;
    }
    if (goalX == null || goalY == null) continue;
    if (u.mode !== 'build' && dist2(u.x, u.y, goalX, goalY) <= 18 * 18) {
      if (u.mode === 'move' || u.mode === 'amove') {
        u.orderX = null;
        u.orderY = null;
        u.mode = 'idle';
      }
      u.vx = 0; u.vy = 0;
      continue;
    }

    // Déplacement des unités aériennes (Navette de Transport, Navette Médicale) : vol direct sans collisions terrestres
    if (u.flying) {
      const dx = goalX - u.x, dy = goalY - u.y;
      const distGoal = Math.hypot(dx, dy) || 1;
      let steerX = dx / distGoal, steerY = dy / distGoal;
      for (const o of state.units) {
        if (o === u || o.hp <= 0 || !o.flying || o.boardedIn) continue;
        const sx = u.x - o.x, sy = u.y - o.y;
        const minSep = u.radius + o.radius + 6;
        const d2 = sx * sx + sy * sy;
        if (d2 > 0 && d2 < minSep * minSep) {
          const d = Math.sqrt(d2);
          const f = (minSep - d) / minSep;
          steerX += (sx / d) * f * 1.35;
          steerY += (sy / d) * f * 1.35;
        }
      }
      const sLen = Math.hypot(steerX, steerY) || 1;
      const mapDef = MAP_DEFS[state.map] || MAP_DEFS.vallee;
      let upgSpdMult = 1.0;
      if (owner?.upgrades?.advanced_thrusters) upgSpdMult = 1.18;
      const spd = def.speed * (mapDef.moveSpeedMult || 1.0) * upgSpdMult;
      u.vx = (steerX / sLen) * spd;
      u.vy = (steerY / sLen) * spd;
      u.x = clamp(u.x + u.vx * dt, 24, WORLD_SIZE - 24);
      u.y = clamp(u.y + u.vy * dt, 24, WORLD_SIZE - 24);
      u.a = Math.atan2(u.vy || dy, u.vx || dx);
      continue;
    }

    const wp = routeWaypoint(u, goalX, goalY);
    const steerTargetX = wp ? wp.x : goalX;
    const steerTargetY = wp ? wp.y : goalY;

    const dx = steerTargetX - u.x, dy = steerTargetY - u.y;
    const distGoal = Math.hypot(dx, dy) || 1;
    let steerX = dx / distGoal, steerY = dy / distGoal;

    const isScv = u.kind === 'scv';
    const lookAhead = isScv ? 14 : (u.radius + 32);
    const sideSign = (u.id % 2 === 0) ? 1 : -1;
    for (const b of state.buildings) {
      if (b.hp <= 0 || b.id === u.buildTargetId || b.id === u.harvestId) continue;
      if (b.constructing && !b.buildStarted) continue;
      if (isScv && u.carryAmt > 0 && b.owner === u.owner && b.kind === 'hq') continue;
      const ox = b.x - u.x, oy = b.y - u.y;
      const d = Math.hypot(ox, oy) || 1;
      const minClear = u.radius + b.radius + (isScv ? 2 : 10);
      if (d < minClear + lookAhead) {
        const dot = (ox / d) * steerX + (oy / d) * steerY;
        if (dot > -0.2) {
          const tx = -oy / d * sideSign, ty = ox / d * sideSign;
          const push = ((minClear + lookAhead - d) / lookAhead) * (isScv ? 1.2 : 1.8);
          steerX += (tx - ox / d * (isScv ? 0.2 : 0.5)) * push;
          steerY += (ty - oy / d * (isScv ? 0.2 : 0.5)) * push;
        }
      }
    }
    for (const rk of ROCKS) {
      const ox = rk.x - u.x, oy = rk.y - u.y;
      const d = Math.hypot(ox, oy) || 1;
      const minClear = u.radius + rk.r + (isScv ? 2 : 10);
      if (d < minClear + lookAhead) {
        const tx = -oy / d * sideSign, ty = ox / d * sideSign;
        const push = ((minClear + lookAhead - d) / lookAhead) * 1.9;
        steerX += (tx - ox / d * 0.5) * push;
        steerY += (ty - oy / d * 0.5) * push;
      }
    }
    for (const o of state.units) {
      if (o === u || o.hp <= 0) continue;
      if (u.kind === 'scv' && o.kind === 'scv') continue;
      const sx = u.x - o.x, sy = u.y - o.y;
      const minSep = u.radius + o.radius + 4;
      const d2 = sx * sx + sy * sy;
      if (d2 > 0 && d2 < minSep * minSep) {
        const d = Math.sqrt(d2);
        const f = (minSep - d) / minSep;
        steerX += (sx / d) * f * 1.35;
        steerY += (sy / d) * f * 1.35;
      }
    }

    const sLen = Math.hypot(steerX, steerY) || 1;
    const mapDef = MAP_DEFS[state.map] || MAP_DEFS.vallee;
    let upgSpdMult = 1.0;
    if (owner?.upgrades?.advanced_thrusters && u.kind !== 'scv') upgSpdMult = 1.18;
    const spd = def.speed * stimMult * (mapDef.moveSpeedMult || 1.0) * upgSpdMult;
    u.vx = (steerX / sLen) * spd;
    u.vy = (steerY / sLen) * spd;

    const nextX = clamp(u.x + u.vx * dt, 24, WORLD_SIZE - 24);
    const nextY = clamp(u.y + u.vy * dt, 24, WORLD_SIZE - 24);

    if (waterActive) {
      if (isWaterAt(nextX, nextY)) {
        if (!isWaterAt(nextX, u.y)) {
          u.x = nextX;
          u.vy = 0;
        } else if (!isWaterAt(u.x, nextY)) {
          u.y = nextY;
          u.vx = 0;
        } else {
          u.vx = 0;
          u.vy = 0;
        }
      } else {
        u.x = nextX;
        u.y = nextY;
      }
      if (isWaterAt(u.x, u.y)) {
        const l = nearestLand(u.x, u.y);
        const ldx = l.x - u.x, ldy = l.y - u.y;
        const ld = Math.hypot(ldx, ldy) || 1;
        u.x += (ldx / ld) * Math.min(ld, 160 * dt);
        u.y += (ldy / ld) * Math.min(ld, 160 * dt);
      }
    } else {
      u.x = nextX;
      u.y = nextY;
    }
    u.a = Math.atan2(u.vy || (steerTargetY - u.y), u.vx || (steerTargetX - u.x));

    for (const b of state.buildings) {
      if (b.hp <= 0) continue;
      // Le VCS qui construit ce chantier a le droit d'entrer SUR l'emplacement de construction !
      if (b.constructing && u.kind === 'scv' && u.buildTargetId === b.id) continue;
      if (b.constructing && !b.buildStarted) continue;
      const cx = u.x - b.x, cy = u.y - b.y;
      const minD = u.radius + (isScv ? b.radius * 0.94 : b.radius) + (isScv ? 0.5 : 2);
      const d2 = cx * cx + cy * cy;
      if (d2 < minD * minD) {
        const d = Math.sqrt(d2) || 1;
        const nx = cx / d, ny = cy / d;
        u.x = b.x + nx * minD;
        u.y = b.y + ny * minD;
        // Glissement tangentiel le long de la façade
        const vDot = u.vx * nx + u.vy * ny;
        if (vDot < 0) {
          u.vx -= vDot * nx;
          u.vy -= vDot * ny;
        }
      }
    }

    // Système d'expulsion anti-coincement si un VCS est pris en étau entre 2+ bâtiments
    if (isScv) {
      let stuckCount = 0, escX = 0, escY = 0;
      for (const b of state.buildings) {
        if (b.hp <= 0 || (b.constructing && u.buildTargetId === b.id)) continue;
        const cx = u.x - b.x, cy = u.y - b.y;
        const minD = u.radius + b.radius * 0.95;
        if (cx * cx + cy * cy < minD * minD) {
          stuckCount++;
          const d = Math.hypot(cx, cy) || 1;
          escX += cx / d;
          escY += cy / d;
        }
      }
      if (stuckCount >= 2) {
        const escLen = Math.hypot(escX, escY) || 1;
        u.x += (escX / escLen) * 3.5;
        u.y += (escY / escLen) * 3.5;
      }
    }
  }

  for (let i = state.units.length - 1; i >= 0; i--) {
    const u = state.units[i];
    if (u.hp <= 0) {
      if (u.kind === 'dropship' && Array.isArray(u.cargo) && u.cargo.length > 0) {
        for (const cId of u.cargo) {
          const pass = state.units.find((x) => x.id === cId);
          if (pass) {
            pass.boardedIn = null;
            pass.mode = 'idle';
            pass.x = clamp(u.x + (Math.random() - 0.5) * 44, 30, WORLD_SIZE - 30);
            pass.y = clamp(u.y + (Math.random() - 0.5) * 44, 30, WORLD_SIZE - 30);
            pass.hp = Math.max(1, Math.round(pass.hp * 0.5));
            fxEvents.push({ k: 'SPARK', x: pass.x, y: pass.y, color: '#ff4b2b' });
          }
        }
        u.cargo = [];
      }
      fxEvents.push({ k: 'BOOM', x: u.x, y: u.y, r: u.radius * 1.5 });
      state.units.splice(i, 1);
    }
  }
  for (let i = state.buildings.length - 1; i >= 0; i--) {
    const b = state.buildings[i];
    if (b.hp <= 0) {
      fxEvents.push({ k: 'BOOM_BIG', x: b.x, y: b.y, r: b.radius * 1.8 });
      const ownerId = b.owner;
      state.buildings.splice(i, 1);
      const hasAnyHq = state.buildings.some((ob) => ob.owner === ownerId && ob.kind === 'hq' && ob.hp > 0);
      if (!hasAnyHq) {
        const p = state.players.find((q) => q.id === ownerId);
        if (p && !p.dead) {
          p.dead = true;
          state.ranking.unshift(p.id);
          for (const ob of state.buildings) if (ob.owner === ownerId) ob.hp = 0;
          for (const ou of state.units) if (ou.owner === ownerId) ou.hp = 0;
          fxEvents.push({ k: 'ELIM', name: p.name, color: p.color });
        }
      }
    }
  }

  const aliveTeams = new Set(state.players.filter((p) => !p.dead).map((p) => p.team));
  if (aliveTeams.size <= 1) {
    state.over = true;
    state.winnerTeam = [...aliveTeams][0] ?? 0;
    const winners = state.players.filter((p) => !p.dead).sort((a, b) => b.score - a.score);
    for (const w of winners) {
      w.score += 500;
      if (!state.ranking.includes(w.id)) state.ranking.unshift(w.id);
    }
    for (const p of state.players) {
      if (!state.ranking.includes(p.id)) state.ranking.push(p.id);
    }
  }
}

/* ============================================================================
   INTELLIGENCE ARTIFICIELLE DES BOTS (MACRO & MICRO STARCRAFT)
   ============================================================================ */
function runBots(state, fxEvents) {
  if (state.over) return;
  for (const p of state.players) {
    if (!p.bot || p.dead) continue;
    const myBlds = state.buildings.filter((b) => b.owner === p.id && b.hp > 0);
    const hq = myBlds.find((b) => b.kind === 'hq');
    if (!hq) continue;

    const myUnits = state.units.filter((u) => u.owner === p.id && u.hp > 0);
    const scvs = myUnits.filter((u) => u.kind === 'scv');
    const army = myUnits.filter((u) => u.kind !== 'scv');
    const sup = computeSupply(state, p.id);

    const refs = myBlds.filter((b) => b.kind === 'extractor').length;
    const rax = myBlds.filter((b) => b.kind === 'barracks').length;
    const fac = myBlds.filter((b) => b.kind === 'factory').length;
    const tur = myBlds.filter((b) => b.kind === 'turret' || b.kind === 'tesla').length;

    const dirX = Math.sign(HALF_W - hq.x) || 1;
    const dirY = Math.sign(HALF_W - hq.y) || 1;

    const tryBuildNear = (kind, ax, ay, minR = 75, maxR = 230) => {
      for (let k = 0; k < 16; k++) {
        const ang = Math.random() * TAU;
        const r = minR + Math.random() * (maxR - minR);
        const x = ax + Math.cos(ang) * r, y = ay + Math.sin(ang) * r;
        if (canPlaceBuilding(state, p.id, kind, x, y).ok) {
          return executeCommand(state, p.id, { op: 'BUILD', kind, x, y }, fxEvents).ok;
        }
      }
      return false;
    };

    // Si un chantier du bot n'a plus de VCS attitré, y envoyer un VCS libre
    for (const cb of myBlds) {
      if (cb.constructing && !scvs.some((u) => u.mode === 'build' && u.buildTargetId === cb.id)) {
        const freeBuilder = scvs.find((u) => u.mode !== 'build');
        if (freeBuilder) {
          freeBuilder.mode = 'build';
          freeBuilder.buildTargetId = cb.id;
          freeBuilder.onSite = false;
          freeBuilder.orderX = cb.x;
          freeBuilder.orderY = cb.y;
        }
      }
    }

    if (sup.max - sup.used <= 3 && sup.max < MAX_SUPPLY && p.minerals >= 75) {
      if (tryBuildNear('pylon', hq.x + dirX * 90, hq.y + dirY * 90, 65, 195)) return;
    }
    if (scvs.length < 11 && hq.queue.length < 2 && p.minerals >= 50) {
      executeCommand(state, p.id, { op: 'TRAIN', unit: 'scv', bldId: hq.id }, fxEvents);
    }
    const maxRefs = (state.map === 'magma') ? 2 : 1;
    if (refs < maxRefs && scvs.length >= (refs === 0 ? 7 : 10) && p.minerals >= 75) {
      const nearbyGeysers = GAS_GEYSERS.filter((g) => hypot(g.x, g.y, hq.x, hq.y) < 260);
      for (const gey of nearbyGeysers) {
        const taken = state.buildings.some((b) => b.hp > 0 && dist2(b.x, b.y, gey.x, gey.y) < 35 * 35);
        if (!taken) {
          executeCommand(state, p.id, { op: 'BUILD', kind: 'extractor', x: gey.x, y: gey.y }, fxEvents);
          break;
        }
      }
    }
    const readyRefs = myBlds.filter((b) => b.kind === 'extractor' && !b.constructing);
    for (const readyRef of readyRefs) {
      const gasScvs = scvs.filter((u) => u.mode === 'harvest_gas' && u.harvestId === readyRef.id);
      if (gasScvs.length < 2) {
        const freeScv = scvs.find((u) => u.mode === 'harvest_min');
        if (freeScv) { freeScv.mode = 'harvest_gas'; freeScv.harvestId = readyRef.id; }
      }
    }

    if (rax < 1 && p.minerals >= 125) {
      if (tryBuildNear('barracks', hq.x + dirX * 135, hq.y + dirY * 45, 50, 140)) return;
    }
    if (rax >= 1 && fac < 1 && p.minerals >= 150 && p.gas >= 75) {
      if (tryBuildNear('factory', hq.x + dirX * 60, hq.y + dirY * 140, 55, 150)) return;
    }
    if (tur < 2 && rax >= 1 && p.minerals >= 125) {
      const tKind = (state.map === 'magma' || (p.gas >= 50 && Math.random() < 0.5)) ? 'tesla' : 'turret';
      if (tryBuildNear(tKind, hq.x + dirX * 165, hq.y + dirY * 165, 35, 110)) return;
    }
    const arm = myBlds.filter((b) => b.kind === 'armory').length;
    if (rax >= 1 && arm < 1 && p.minerals >= 125 && p.gas >= 50) {
      if (tryBuildNear('armory', hq.x - dirX * 50, hq.y + dirY * 130, 45, 140)) return;
    }
    const spPort = myBlds.filter((b) => b.kind === 'starport').length;
    if (fac >= 1 && spPort < 1 && p.minerals >= 150 && p.gas >= 100) {
      if (tryBuildNear('starport', hq.x - dirX * 110, hq.y - dirY * 90, 50, 160)) return;
    }
    const readyArm = myBlds.find((b) => b.kind === 'armory' && !b.constructing && (!b.queue || b.queue.length === 0));
    if (readyArm) {
      p.upgrades = p.upgrades || {};
      const upgOrder = ['infantry_weapons', 'infantry_armor', 'vehicle_weapons', 'vehicle_armor', 'advanced_thrusters'];
      for (const uid of upgOrder) {
        if (!p.upgrades[uid]) {
          const uDef = UPGRADES[uid];
          if (p.minerals >= uDef.min && p.gas >= uDef.gas) {
            executeCommand(state, p.id, { op: 'RESEARCH', upgId: uid, bldId: readyArm.id }, fxEvents);
            break;
          }
        }
      }
    }
    if (spPort >= 1) {
      const spBld = myBlds.find((b) => b.kind === 'starport' && !b.constructing && (!b.queue || b.queue.length < 2));
      if (spBld) {
        const medCount = myUnits.filter((u) => u.kind === 'medivac').length;
        if (medCount < 2 && p.minerals >= 75 && p.gas >= 75) {
          executeCommand(state, p.id, { op: 'TRAIN', unit: 'medivac', bldId: spBld.id }, fxEvents);
        } else if (p.minerals >= 100 && p.gas >= 50 && Math.random() < 0.35) {
          executeCommand(state, p.id, { op: 'TRAIN', unit: 'dropship', bldId: spBld.id }, fxEvents);
        }
      }
    }
    if (rax < 2 && fac >= 1 && p.minerals >= 180) {
      if (tryBuildNear('barracks', hq.x + dirX * 140, hq.y - dirY * 50, 55, 160)) return;
    }

    if (state.map === 'magma') {
      // Magma : surabondance de gaz -> priorité absolue aux Titans, Chars de Siège et Faucheurs
      if (fac >= 1 && p.minerals >= 250 && p.gas >= 150) {
        executeCommand(state, p.id, { op: 'TRAIN', unit: 'titan' }, fxEvents);
      } else if (fac >= 1 && p.minerals >= 150 && p.gas >= 100) {
        executeCommand(state, p.id, { op: 'TRAIN', unit: 'siege' }, fxEvents);
      } else if (fac >= 1 && p.minerals >= 125 && p.gas >= 50 && Math.random() < 0.6) {
        executeCommand(state, p.id, { op: 'TRAIN', unit: 'tank' }, fxEvents);
      } else if (rax >= 1 && p.minerals >= 75 && p.gas >= 50 && Math.random() < 0.7) {
        executeCommand(state, p.id, { op: 'TRAIN', unit: 'sapper' }, fxEvents);
      } else if (rax >= 1 && p.minerals >= 75 && p.gas >= 25) {
        executeCommand(state, p.id, { op: 'TRAIN', unit: 'rocket' }, fxEvents);
      } else if (rax >= 1 && p.minerals >= 50) {
        executeCommand(state, p.id, { op: 'TRAIN', unit: 'marine' }, fxEvents);
      }
    } else {
      if (fac >= 1 && p.minerals >= 250 && p.gas >= 150) {
        executeCommand(state, p.id, { op: 'TRAIN', unit: 'titan' }, fxEvents);
      } else if (fac >= 1 && p.minerals >= 150 && p.gas >= 100 && Math.random() < 0.55) {
        executeCommand(state, p.id, { op: 'TRAIN', unit: 'siege' }, fxEvents);
      } else if (fac >= 1 && p.minerals >= 125 && p.gas >= 50) {
        executeCommand(state, p.id, { op: 'TRAIN', unit: 'tank' }, fxEvents);
      }
      if (rax >= 1 && p.minerals >= 75 && p.gas >= 25 && Math.random() < 0.6) {
        executeCommand(state, p.id, { op: 'TRAIN', unit: Math.random() < 0.65 ? 'rocket' : 'sapper' }, fxEvents);
      } else if (rax >= 1 && p.minerals >= 50) {
        executeCommand(state, p.id, { op: 'TRAIN', unit: 'marine' }, fxEvents);
      }
    }

    const waveSize = state.level === 'expert' ? 6 : state.level === 'facile' ? 10 : 8;
    const idleArmy = army.filter((u) => u.mode === 'idle' || hypot(u.x, u.y, hq.x, hq.y) < 260);
    if (idleArmy.length >= waveSize) {
      const enemyBld = state.buildings.find((b) => b.team !== p.team && b.kind === 'hq' && b.hp > 0)
        || state.buildings.find((b) => b.team !== p.team && b.hp > 0);
      if (enemyBld) {
        executeCommand(state, p.id, {
          op: 'UNIT_ORDER',
          mode: 'amove',
          x: enemyBld.x,
          y: enemyBld.y,
          unitIds: idleArmy.map((u) => u.id),
        }, fxEvents);
      }
    }
  }
}

/* ============================================================================
   MOTEUR 3D VUE DU DESSUS (TOP-DOWN 3D PERSPECTIVE & EXTRUSION VOLUMÉTRIQUE)
   ============================================================================ */
const webglCvs = $('#webgl3d');
const cvs = $('#world'), ctx = cvs.getContext('2d');
const miniCvs = $('#minimap'), miniCtx = miniCvs.getContext('2d');
let W = 0, H = 0, DPR = 1;
var threeReady = false, threeRenderer = null, threeScene = null, threeCam = null, sunLight3D = null;
var threeRaycaster = null, threeGroundPlane = null, threeNdc = null, threeHitPt = null, threeProjVec = null;
var fogTexture3D = null;

function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = window.innerWidth;
  H = window.innerHeight;
  cvs.width = Math.round(W * DPR);
  cvs.height = Math.round(H * DPR);
  if (threeRenderer && threeCam) {
    threeRenderer.setPixelRatio(Math.min(1.75, DPR));
    threeRenderer.setSize(W, H, false);
    threeCam.aspect = W / Math.max(1, H);
    threeCam.updateProjectionMatrix();
  }
}
window.addEventListener('resize', resize);
resize();

const cam = { x: HALF_W, y: HALF_W, z: 0.88, pitch: 70, shake: 0 };
const keys = {};
const mouse = { x: W / 2, y: H / 2, clientX: -999, clientY: -999, inside: false, wx: HALF_W, wy: HALF_W, down: false, dragStart: null, panning: false, panStart: null };

let myId = 0;
let role = 'solo';
let state = null;
let buildMode = null;
let orderCursor = null; // 'amove' | 'scan' | null
let selectedUnits = new Set();
let selectedBlds = new Set();
const controlGroups = { 1: [], 2: [], 3: [], 4: [], 5: [], 6: [], 7: [], 8: [], 9: [] };
let lastGroupTap = { g: 0, t: 0 };
let lastClickUnit = { id: 0, kind: '', t: 0 };

let particles = [];
let shockwaves = [];
let projectiles = [];
let beams = [];
let craters = [];
let orderMarkers = [];
let reportedResult = false;

const FOG_RES = 200;
const fogCanvas = document.createElement('canvas');
fogCanvas.width = FOG_RES;
fogCanvas.height = FOG_RES;
const fogCtx = fogCanvas.getContext('2d');
const exploredCanvas = document.createElement('canvas');
exploredCanvas.width = FOG_RES;
exploredCanvas.height = FOG_RES;
const exploredCtx = exploredCanvas.getContext('2d');
const exploredGrid = new Uint8Array(FOG_RES * FOG_RES);

function isExplored(wx, wy) {
  if (!state) return true;
  const me = state.players.find((p) => p.id === myId);
  if (!me || me.dead) return true;
  const gx = Math.floor(clamp(wx, 0, WORLD_SIZE - 1) * (FOG_RES / WORLD_SIZE));
  const gy = Math.floor(clamp(wy, 0, WORLD_SIZE - 1) * (FOG_RES / WORLD_SIZE));
  if (exploredGrid[gy * FOG_RES + gx] === 1) return true;
  const myHq = state.buildings.find((b) => b.owner === myId && b.kind === 'hq');
  if (myHq && dist2(wx, wy, myHq.x, myHq.y) <= 280 * 280) return true;
  return false;
}

function isVisibleToMe(wx, wy) {
  if (!state) return true;
  const me = state.players.find((p) => p.id === myId);
  if (!me || me.dead) return true;
  for (const b of state.buildings) {
    if (b.team === me.team && b.hp > 0) {
      const s = BUILDINGS[b.kind]?.sight || 300;
      if (dist2(wx, wy, b.x, b.y) <= s * s) return true;
    }
  }
  for (const u of state.units) {
    if (u.team === me.team && u.hp > 0) {
      const s = UNITS[u.kind]?.sight || 260;
      if (dist2(wx, wy, u.x, u.y) <= s * s) return true;
    }
  }
  for (const sc of state.scans) {
    if (sc.team === me.team && dist2(wx, wy, sc.x, sc.y) <= sc.r * sc.r) return true;
  }
  return false;
}

let lastFogUpdate = 0;
function updateFogCanvas(now = performance.now()) {
  if (!state) return;
  if (now - lastFogUpdate < 80) return;
  lastFogUpdate = now;
  const me = state.players.find((p) => p.id === myId);
  if (!me || me.dead) {
    fogCtx.clearRect(0, 0, FOG_RES, FOG_RES);
    if (fogTexture3D) fogTexture3D.needsUpdate = true;
    return;
  }
  const scale = FOG_RES / WORLD_SIZE;

  const markCircle = (wx, wy, r) => {
    const cx = Math.floor(wx * scale), cy = Math.floor(wy * scale);
    const cr = Math.ceil(r * scale);
    const cr2 = cr * cr;
    for (let y = Math.max(0, cy - cr); y <= Math.min(FOG_RES - 1, cy + cr); y++) {
      for (let x = Math.max(0, cx - cr); x <= Math.min(FOG_RES - 1, cx + cr); x++) {
        if ((x - cx) ** 2 + (y - cy) ** 2 <= cr2) exploredGrid[y * FOG_RES + x] = 1;
      }
    }
    exploredCtx.fillStyle = '#ffffff';
    exploredCtx.beginPath();
    exploredCtx.arc(cx, cy, cr, 0, TAU);
    exploredCtx.fill();
  };

  // 1. Fond noir profond pour les zones non explorées
  fogCtx.globalCompositeOperation = 'source-over';
  fogCtx.globalAlpha = 1.0;
  fogCtx.fillStyle = '#060d0a';
  fogCtx.fillRect(0, 0, FOG_RES, FOG_RES);

  // 2. Éclaircissement partiel des zones déjà explorées (brouillard de guerre semi-transparent)
  fogCtx.globalCompositeOperation = 'destination-out';
  fogCtx.globalAlpha = 0.44;
  fogCtx.drawImage(exploredCanvas, 0, 0);

  // 3. Découpage complet à 100% de transparence pour la vision en direct de nos unités/bâtiments
  fogCtx.globalAlpha = 1.0;
  for (const b of state.buildings) {
    if (b.team === me.team && b.hp > 0) {
      const s = BUILDINGS[b.kind]?.sight || 300;
      markCircle(b.x, b.y, s);
      fogCtx.beginPath();
      fogCtx.arc(b.x * scale, b.y * scale, s * scale, 0, TAU);
      fogCtx.fill();
    }
  }
  for (const u of state.units) {
    if (u.team === me.team && u.hp > 0) {
      const s = UNITS[u.kind]?.sight || 260;
      markCircle(u.x, u.y, s);
      fogCtx.beginPath();
      fogCtx.arc(u.x * scale, u.y * scale, s * scale, 0, TAU);
      fogCtx.fill();
    }
  }
  for (const sc of state.scans) {
    if (sc.team === me.team) {
      markCircle(sc.x, sc.y, sc.r);
      fogCtx.beginPath();
      fogCtx.arc(sc.x * scale, sc.y * scale, sc.r * scale, 0, TAU);
      fogCtx.fill();
    }
  }
  if (fogTexture3D) fogTexture3D.needsUpdate = true;
}

/* ============================================================================
   PRIMITIVES DE PROJECTION 3D VUE DU DESSUS (PERSPECTIVE CAMÉRA + FACES OMBRÉES)
   ============================================================================ */
// Projette un point local (lx, ly, z) situé autour de l'ancre monde (wx, wy) en coordonnées 2D avec point de fuite caméra
function project3DOffset(wx, wy, z, isIcon = false) {
  if (isIcon) {
    return { ox: -z * 0.14, oy: -z * 0.48 };
  }
  // Point de fuite radial depuis le centre de la caméra + inclinaison isométrique à 50° vers le sud
  const perspX = clamp((wx - cam.x) * 0.00085, -0.34, 0.34) * z;
  const perspY = clamp((wy - cam.y) * 0.00085, -0.34, 0.34) * z - z * 0.77;
  return { ox: perspX - z * 0.08, oy: perspY };
}

// Génère un polygone régulier ou boîte biseautée
function makeRectPoly(hw, hh, bevel = 5) {
  const b = Math.min(bevel, hw * 0.4, hh * 0.4);
  if (b <= 0.5) {
    return [
      { x: -hw, y: -hh }, { x: hw, y: -hh },
      { x: hw, y: hh },   { x: -hw, y: hh },
    ];
  }
  return [
    { x: -hw + b, y: -hh }, { x: hw - b, y: -hh },
    { x: hw, y: -hh + b },  { x: hw, y: hh - b },
    { x: hw - b, y: hh },   { x: -hw + b, y: hh },
    { x: -hw, y: hh - b },  { x: -hw, y: -hh + b },
  ];
}

function makeNGon(r, n = 8, rot = Math.PI / 8) {
  const pts = [];
  for (let i = 0; i < n; i++) {
    const a = rot + (i / n) * TAU;
    pts.push({ x: Math.cos(a) * r, y: Math.sin(a) * r });
  }
  return pts;
}

// Extrude un prisme 3D entre la hauteur z0 et la hauteur z1 avec calcul d'illumination par face latérale
function drawPrism3D(g, wx, wy, pts, z0, z1, baseColor, topColor, isIcon = false, topScale = 1.0) {
  const o0 = project3DOffset(wx, wy, z0, isIcon);
  const o1 = project3DOffset(wx, wy, z1, isIcon);
  const p0 = pts.map((p) => ({ x: p.x + o0.ox, y: p.y + o0.oy }));
  const p1 = pts.map((p) => ({ x: p.x * topScale + o1.ox, y: p.y * topScale + o1.oy }));

  const n = pts.length;
  const faces = [];
  for (let i = 0; i < n; i++) {
    const j = (i + 1) % n;
    const a0 = p0[i], b0 = p0[j], b1 = p1[j], a1 = p1[i];
    // Produit vectoriel 2D (Back-face culling : ne dessine que les faces orientées vers la caméra)
    const cross = (b0.x - a0.x) * (a1.y - a0.y) - (b0.y - a0.y) * (a1.x - a0.x);
    if (cross < 0) {
      const edgeDx = pts[j].x - pts[i].x, edgeDy = pts[j].y - pts[i].y;
      const len = Math.hypot(edgeDx, edgeDy) || 1;
      const nx = edgeDy / len, ny = -edgeDx / len;
      // Soleil venant du haut-gauche (-0.6, -0.8) + rebond sur la face avant (sud)
      const light = clamp(nx * -0.35 + ny * 0.25, -0.45, 0.25);
      const depthY = (a0.y + b0.y + a1.y + b1.y) * 0.25;
      faces.push({ a0, b0, b1, a1, col: shade(baseColor, light - 0.12), depthY });
    }
  }

  faces.sort((a, b) => a.depthY - b.depthY);
  g.strokeStyle = '#16181d';
  g.lineWidth = 2.6;
  g.lineJoin = 'round';

  for (const f of faces) {
    g.fillStyle = f.col;
    g.beginPath();
    g.moveTo(f.a0.x, f.a0.y);
    g.lineTo(f.b0.x, f.b0.y);
    g.lineTo(f.b1.x, f.b1.y);
    g.lineTo(f.a1.x, f.a1.y);
    g.closePath();
    g.fill();
    g.stroke();
  }

  // Face supérieure (Toit 3D)
  g.fillStyle = topColor || shade(baseColor, 0.12);
  g.lineWidth = 3;
  g.beginPath();
  for (let i = 0; i < n; i++) {
    if (i === 0) g.moveTo(p1[i].x, p1[i].y);
    else g.lineTo(p1[i].x, p1[i].y);
  }
  g.closePath();
  g.fill();
  g.stroke();

  return o1;
}

// Dessine une Pyramide / Cristal 3D pointu avec facettes triangulaires ombrées
function drawPyramid3D(g, wx, wy, pts, zBase, zApex, baseColor, isIcon = false) {
  const o0 = project3DOffset(wx, wy, zBase, isIcon);
  const oTop = project3DOffset(wx, wy, zApex, isIcon);
  const p0 = pts.map((p) => ({ x: p.x + o0.ox, y: p.y + o0.oy }));
  const apex = { x: oTop.ox, y: oTop.oy };

  const n = pts.length;
  const faces = [];
  for (let i = 0; i < n; i++) {
    const j = (i + 1) % n;
    const a = p0[i], b = p0[j];
    const edgeDx = pts[j].x - pts[i].x, edgeDy = pts[j].y - pts[i].y;
    const len = Math.hypot(edgeDx, edgeDy) || 1;
    const nx = edgeDy / len, ny = -edgeDx / len;
    const light = clamp(nx * -0.45 + ny * -0.25, -0.38, 0.38);
    const depthY = (a.y + b.y + apex.y) / 3;
    faces.push({ a, b, col: shade(baseColor, light), depthY });
  }
  faces.sort((f1, f2) => f1.depthY - f2.depthY);

  g.strokeStyle = '#16181d';
  g.lineWidth = 2.4;
  g.lineJoin = 'round';
  for (const f of faces) {
    g.fillStyle = f.col;
    g.beginPath();
    g.moveTo(f.a.x, f.a.y);
    g.lineTo(f.b.x, f.b.y);
    g.lineTo(apex.x, apex.y);
    g.closePath();
    g.fill();
    g.stroke();
  }
}

/* ============================================================================
   RENDU 3D VOLUMÉTRIQUE DES BÂTIMENTS (MULTI-ÉTAGES & ÉCHAFAUDAGES 3D)
   ============================================================================ */
function drawBuilding(g, b, color, selected, now, isIcon = false) {
  const r = b.radius;
  const def = BUILDINGS[b.kind] || BUILDINGS.hq;
  const wx = b.x || 0, wy = b.y || 0;
  const waitingScv = !isIcon && b.constructing && !b.buildStarted && (b.buildProg || 0) <= 0.01;
  const prog = b.constructing && !isIcon ? clamp(b.buildProg || 0.08, 0.12, 1) : 1;
  const H3D = (def.height || 36) * prog;
  const darkCol = shade(color, -0.28);
  const lightCol = shade(color, 0.22);

  g.save();
  g.translate(wx, wy);

  if (selected) {
    g.strokeStyle = '#2fbf71';
    g.lineWidth = 3.5;
    g.beginPath(); g.arc(0, 0, r + 9, 0, TAU); g.stroke();
  }

  // Tant que le VCS n'est pas arrivé sur l'emplacement, on affiche le plan holographique au sol !
  if (waitingScv) {
    g.fillStyle = 'rgba(31, 199, 193, 0.16)';
    g.beginPath(); g.arc(0, 0, r, 0, TAU); g.fill();
    g.strokeStyle = '#ffc531';
    g.lineWidth = 2.8;
    g.setLineDash([7, 5]);
    g.beginPath(); g.arc(0, 0, r, 0, TAU); g.stroke();
    g.setLineDash([]);
    // Balise centrale "VCS en approche"
    const pulse = 5 + Math.sin(now * 0.01) * 2.5;
    g.fillStyle = '#ffc531';
    g.strokeStyle = '#16181d';
    g.lineWidth = 2;
    g.beginPath(); g.arc(0, 0, pulse, 0, TAU); g.fill(); g.stroke();
    g.restore();
    return;
  }

  // Ombre portée 3D au sol
  g.fillStyle = 'rgba(12, 16, 20, 0.42)';
  g.beginPath(); g.ellipse(9, 11, r * 1.08, r * 0.95, 0, 0, TAU); g.fill();

  if (b.kind === 'hq') {
    // 4 Tourelles de bastion d'angle en 3D
    const cOff = r * 0.68;
    for (const [sx, sy] of [[-1, -1], [1, -1], [1, 1], [-1, 1]]) {
      g.save();
      g.translate(sx * cOff, sy * cOff);
      drawPrism3D(g, wx + sx * cOff, wy + sy * cOff, makeNGon(r * 0.34, 6), 0, H3D * 0.62, '#3d414b', '#565b68', isIcon, 0.9);
      g.restore();
    }
    // Étage 1 : Forteresse blindée octogonale biseautée
    drawPrism3D(g, wx, wy, makeRectPoly(r * 0.88, r * 0.88, 12), 0, H3D * 0.56, darkCol, color, isIcon, 0.92);
    // Étage 2 : Pont de commandement en acier crème
    const top2 = drawPrism3D(g, wx, wy, makeRectPoly(r * 0.62, r * 0.62, 7), H3D * 0.56, H3D * 0.86, '#cfc4ad', '#fff8ea', isIcon, 0.92);
    // Étage 3 : Tourelle réacteur & double canon rotatif
    const top3 = drawPrism3D(g, wx, wy, makeNGon(r * 0.34, 8), H3D * 0.86, H3D * 1.04, '#2a2d35', '#484c58', isIcon, 0.9);

    g.save();
    g.translate(top3.ox, top3.oy);
    g.save();
    g.rotate(b.aimA || 0);
    g.fillStyle = '#383b44'; g.strokeStyle = '#16181d'; g.lineWidth = 2.4;
    g.fillRect(4, -8, r * 0.56, 5); g.strokeRect(4, -8, r * 0.56, 5);
    g.fillRect(4, 3, r * 0.56, 5);  g.strokeRect(4, 3, r * 0.56, 5);
    g.restore();
    g.fillStyle = '#ffc531'; g.strokeStyle = '#16181d'; g.lineWidth = 2.5;
    g.beginPath(); g.arc(0, 0, 9.5, 0, TAU); g.fill(); g.stroke();
    g.restore();

    // Antenne radar Comsat rotative sur le toit 2
    g.save();
    g.translate(top2.ox - r * 0.38, top2.oy - r * 0.38);
    g.rotate(now * 0.0038);
    g.strokeStyle = '#16181d'; g.lineWidth = 3;
    g.beginPath(); g.moveTo(-9, 0); g.lineTo(9, 0); g.stroke();
    g.fillStyle = '#1fc7c1';
    g.beginPath(); g.arc(0, 0, 4, 0, TAU); g.fill(); g.stroke();
    g.restore();

  } else if (b.kind === 'extractor') {
    // Raffinerie 3D avec cuves de Gaz Vespène
    drawPrism3D(g, wx, wy, makeNGon(r, 8), 0, H3D * 0.65, '#3b4a40', '#d5f2df', isIcon, 0.9);
    const top = drawPrism3D(g, wx, wy, makeNGon(r * 0.62, 8), H3D * 0.65, H3D, '#1f8a4f', '#2fbf71', isIcon, 0.88);
    g.save();
    g.translate(top.ox, top.oy);
    g.rotate(now * 0.005);
    g.fillStyle = '#ffc531'; g.strokeStyle = '#16181d'; g.lineWidth = 2;
    for (let k = 0; k < 3; k++) {
      g.rotate(TAU / 3);
      g.fillRect(-3, -r * 0.48, 6, r * 0.38);
      g.strokeRect(-3, -r * 0.48, 6, r * 0.38);
    }
    g.restore();

  } else if (b.kind === 'pylon') {
    // Socle 3D hexagonal + Cristal Pyramidal 3D en lévitation rotative !
    drawPrism3D(g, wx, wy, makeNGon(r * 0.92, 6, 0), 0, H3D * 0.42, darkCol, color, isIcon, 0.86);
    const rot = now * 0.0025;
    const crysPts = makeNGon(r * 0.56, 4, rot);
    const bobZ = Math.sin(now * 0.006) * 4;
    drawPrism3D(g, wx, wy, crysPts, H3D * 0.5 + bobZ, H3D * 0.78 + bobZ, '#129691', '#1fc7c1', isIcon, 1.0);
    drawPyramid3D(g, wx, wy, crysPts, H3D * 0.78 + bobZ, H3D * 1.15 + bobZ, '#64f5ef', isIcon);

  } else if (b.kind === 'barracks') {
    // Bunker Caserne 3D à 2 niveaux + rampe blindée 3D
    drawPrism3D(g, wx, wy, makeRectPoly(r * 0.95, r * 0.78, 8), 0, H3D * 0.68, '#665e52', '#f3e9d2', isIcon, 0.94);
    const top2 = drawPrism3D(g, wx, wy, makeRectPoly(r * 0.68, r * 0.48, 5), H3D * 0.68, H3D, darkCol, color, isIcon, 0.92);
    g.save();
    g.translate(top2.ox, top2.oy);
    g.fillStyle = '#ffc531'; g.strokeStyle = '#16181d'; g.lineWidth = 2.2;
    g.beginPath(); g.arc(0, 0, 6.5, 0, TAU); g.fill(); g.stroke();
    g.restore();

  } else if (b.kind === 'factory') {
    // Usine lourde 3D avec 2 cheminées cylindriques 3D hautes
    drawPrism3D(g, wx, wy, makeRectPoly(r * 0.96, r * 0.84, 9), 0, H3D * 0.65, '#353942', '#525766', isIcon, 0.94);
    drawPrism3D(g, wx, wy, makeRectPoly(r * 0.72, r * 0.54, 6), H3D * 0.65, H3D * 0.9, darkCol, color, isIcon, 0.92);
    for (const sx of [-r * 0.54, r * 0.54]) {
      g.save();
      g.translate(sx, r * 0.35);
      drawPrism3D(g, wx + sx, wy + r * 0.35, makeNGon(8.5, 6), H3D * 0.4, H3D * 1.22, '#22252b', '#ff4b2b', isIcon, 0.85);
      g.restore();
    }

  } else if (b.kind === 'turret') {
    // Socle Bunker octogonal 3D + Tourelle rotative 3D
    drawPrism3D(g, wx, wy, makeNGon(r, 8), 0, H3D * 0.58, '#6d675c', '#f3e9d2', isIcon, 0.88);
    const top2 = drawPrism3D(g, wx, wy, makeNGon(r * 0.62, 8), H3D * 0.58, H3D, darkCol, color, isIcon, 0.88);
    g.save();
    g.translate(top2.ox, top2.oy);
    g.rotate(b.aimA || 0);
    const rec = b.cd > 0.2 ? -4 : 0;
    g.fillStyle = '#16181d'; g.strokeStyle = '#16181d'; g.lineWidth = 2.4;
    g.fillRect(4 + rec, -7, r * 0.85, 5);
    g.fillRect(4 + rec, 2, r * 0.85, 5);
    g.fillStyle = lightCol;
    g.beginPath(); g.arc(0, 0, r * 0.28, 0, TAU); g.fill(); g.stroke();
    g.restore();

  } else if (b.kind === 'tesla') {
    // Bobine Tesla 3D : socle + pylône pyramidal + 2 anneaux 3D + sphère de plasma au sommet
    drawPrism3D(g, wx, wy, makeNGon(r, 8), 0, H3D * 0.38, '#2b303c', '#484e5e', isIcon, 0.88);
    drawPrism3D(g, wx, wy, makeNGon(r * 0.48, 6), H3D * 0.38, H3D * 0.92, '#1c6b68', '#1fc7c1', isIcon, 0.55);
    const topOrb = project3DOffset(wx, wy, H3D * 1.05, isIcon);
    g.save();
    g.translate(topOrb.ox, topOrb.oy);
    const pR = r * 0.42 + Math.sin(now * 0.012) * 2.5;
    g.fillStyle = '#1fc7c1'; g.strokeStyle = '#16181d'; g.lineWidth = 3;
    g.beginPath(); g.arc(0, 0, pR, 0, TAU); g.fill(); g.stroke();
    g.fillStyle = '#fff8ea';
    g.beginPath(); g.arc(-3, -3, pR * 0.4, 0, TAU); g.fill();
    g.restore();

  } else if (b.kind === 'wall') {
    drawPrism3D(g, wx, wy, makeRectPoly(r * 0.9, r * 0.9, 5), 0, H3D, '#756e61', '#d6c8aa', isIcon, 0.9);
    const topW = project3DOffset(wx, wy, H3D, isIcon);
    g.save();
    g.translate(topW.ox, topW.oy);
    g.fillStyle = color; g.strokeStyle = '#16181d'; g.lineWidth = 2;
    g.fillRect(-r * 0.55, -4, r * 1.1, 8);
    g.strokeRect(-r * 0.55, -4, r * 1.1, 8);
    g.restore();

  } else if (b.kind === 'armory') {
    // Armurerie Tech 2D : dôme hexagonal avec capteur holo rotatif
    drawPrism3D(g, wx, wy, makeNGon(r * 0.95, 6, 0), 0, H3D * 0.58, '#323742', '#586072', isIcon, 0.92);
    const topLab = drawPrism3D(g, wx, wy, makeNGon(r * 0.62, 6, 0), H3D * 0.58, H3D * 0.88, darkCol, color, isIcon, 0.9);
    g.save();
    g.translate(topLab.ox, topLab.oy);
    g.rotate(now * 0.0035);
    g.fillStyle = '#1fc7c1'; g.strokeStyle = '#16181d'; g.lineWidth = 2.4;
    g.beginPath(); g.arc(0, 0, 7.5, 0, TAU); g.fill(); g.stroke();
    g.strokeStyle = '#ffc531'; g.lineWidth = 1.8;
    g.beginPath(); g.moveTo(-11, 0); g.lineTo(11, 0); g.moveTo(0, -11); g.lineTo(0, 11); g.stroke();
    g.restore();

  } else if (b.kind === 'starport') {
    // Spatioport Spatial 2D : grande plateforme octogonale, chevrons au sol, tour radar
    drawPrism3D(g, wx, wy, makeNGon(r * 1.05, 8, Math.PI / 8), 0, H3D * 0.38, '#2b303c', '#485060', isIcon, 0.95);
    const deck = drawPrism3D(g, wx, wy, makeNGon(r * 0.82, 8, Math.PI / 8), H3D * 0.38, H3D * 0.48, darkCol, color, isIcon, 0.9);
    g.save();
    g.translate(deck.ox, deck.oy);
    g.strokeStyle = '#ffc531'; g.lineWidth = 2.8; g.lineCap = 'round';
    for (let dy = -r * 0.32; dy <= r * 0.32; dy += r * 0.32) {
      g.beginPath();
      g.moveTo(-r * 0.26, dy + 3);
      g.lineTo(0, dy - 3);
      g.lineTo(r * 0.26, dy + 3);
      g.stroke();
    }
    g.fillStyle = '#1fc7c1';
    g.beginPath(); g.arc(r * 0.48, -r * 0.36, 5, 0, TAU); g.fill();
    g.restore();
  }

  // Cage d'échafaudage holographique 3D pendant la construction
  if (!isIcon && b.constructing) {
    const fullH = def.height || 36;
    const oTop = project3DOffset(wx, wy, fullH, false);
    g.strokeStyle = '#ffc531';
    g.lineWidth = 2;
    g.setLineDash([5, 5]);
    g.strokeRect(oTop.ox - r * 0.85, oTop.oy - r * 0.85, r * 1.7, r * 1.7);
    g.setLineDash([]);
    const bw = r * 1.9;
    g.fillStyle = '#16181d';
    g.fillRect(oTop.ox - bw / 2 - 1, oTop.oy - r - 20, bw + 2, 7);
    g.fillStyle = '#ffc531';
    g.fillRect(oTop.ox - bw / 2, oTop.oy - r - 19, bw * clamp(b.buildProg || 0, 0, 1), 5);
  }

  // Anneau de progression de la file d'attente de production
  const roofOff = project3DOffset(wx, wy, H3D, isIcon);
  if (!isIcon && !b.constructing && Array.isArray(b.queue) && b.queue.length > 0 && b.qTotal > 0) {
    const qProg = clamp(1 - b.qTimer / b.qTotal, 0, 1);
    g.strokeStyle = '#ffc531';
    g.lineWidth = 4;
    g.beginPath();
    g.arc(roofOff.ox, roofOff.oy, r + 5, -Math.PI / 2, -Math.PI / 2 + qProg * TAU);
    g.stroke();
  }

  // Barre de PV flottant au-dessus du toit 3D
  if (!isIcon && (b.hp < b.maxHp || b.kind === 'hq' || selected)) {
    const bw = r * 1.9, bh = 6;
    const pct = clamp(b.hp / b.maxHp, 0, 1);
    g.fillStyle = '#16181d';
    g.beginPath(); g.roundRect(roofOff.ox - bw / 2 - 1.5, roofOff.oy - r - 14, bw + 3, bh + 3, 3); g.fill();
    g.fillStyle = pct > 0.45 ? '#2fbf71' : '#ff4b2b';
    g.fillRect(roofOff.ox - bw / 2, roofOff.oy - r - 12.5, bw * pct, bh);
  }
  if (!isIcon && b.kind === 'hq' && state) {
    const ownerP = state.players.find((q) => Number(q.id) === Number(b.owner));
    if (ownerP) {
      const pingVal = ownerP.bot ? '🤖 IA' : `${getPlayerPing(ownerP)} ms`;
      const lbl = `${ownerP.name} · ${pingVal}`;
      g.font = '700 11px "Chakra Petch", sans-serif';
      const tw = g.measureText(lbl).width + 16;
      const bx = roofOff.ox - tw / 2, by = roofOff.oy - r - 34;
      g.fillStyle = 'rgba(22, 24, 29, 0.88)';
      g.strokeStyle = color;
      g.lineWidth = 2;
      g.beginPath(); g.roundRect(bx, by, tw, 18, 6); g.fill(); g.stroke();
      g.fillStyle = '#fff8ea';
      g.textAlign = 'center';
      g.textBaseline = 'middle';
      g.fillText(lbl, roofOff.ox, by + 9);
    }
  }
  g.restore();
}

/* ============================================================================
   RENDU 3D VOLUMÉTRIQUE DES UNITÉS, ARBRES, ROCHERS & CRISTAUX
   ============================================================================ */
function drawTree3D(g, tr) {
  g.save();
  g.translate(tr.x, tr.y);

  if (tr.type === 'volcano') {
    // Ombre au sol
    g.fillStyle = 'rgba(12, 8, 10, 0.42)';
    g.beginPath(); g.ellipse(6, 8, tr.r * 1.1, tr.r * 0.9, 0, 0, TAU); g.fill();
    const oTop = project3DOffset(tr.x, tr.y, tr.h, false);
    // Cône volcanique basaltique
    g.fillStyle = tr.col || '#2a1e20';
    g.strokeStyle = '#100a0d';
    g.lineWidth = 3;
    g.beginPath();
    g.moveTo(-tr.r * 0.9, 0);
    g.lineTo(oTop.ox - tr.r * 0.45, oTop.oy);
    g.lineTo(oTop.ox + tr.r * 0.45, oTop.oy);
    g.lineTo(tr.r * 0.9, 0);
    g.closePath();
    g.fill(); g.stroke();
    // Cratère et magma incandescent au sommet
    g.fillStyle = '#ff4500';
    g.beginPath(); g.ellipse(oTop.ox, oTop.oy, tr.r * 0.42, tr.r * 0.28, 0, 0, TAU); g.fill();
    g.fillStyle = '#ffd000';
    g.beginPath(); g.ellipse(oTop.ox, oTop.oy, tr.r * 0.22, tr.r * 0.15, 0, 0, TAU); g.fill();

  } else if (tr.type === 'crystal') {
    // Ombre au sol
    g.fillStyle = 'rgba(6, 16, 24, 0.38)';
    g.beginPath(); g.ellipse(5, 7, tr.r * 0.95, tr.r * 0.8, 0, 0, TAU); g.fill();
    const oTop = project3DOffset(tr.x, tr.y, tr.h * 1.15, false);
    // Spire cristalline à 2 facettes réfléchissantes
    g.fillStyle = '#104b66';
    g.beginPath();
    g.moveTo(0, 0);
    g.lineTo(-tr.r * 0.6, 0);
    g.lineTo(oTop.ox, oTop.oy);
    g.closePath();
    g.fill();

    g.fillStyle = tr.col || '#1fc7c1';
    g.beginPath();
    g.moveTo(0, 0);
    g.lineTo(tr.r * 0.6, 0);
    g.lineTo(oTop.ox, oTop.oy);
    g.closePath();
    g.fill();

    g.strokeStyle = '#d6f0ff';
    g.lineWidth = 2.2;
    g.beginPath(); g.moveTo(0, 0); g.lineTo(oTop.ox, oTop.oy); g.stroke();

  } else {
    // Arbre standard (Vallée)
    g.fillStyle = 'rgba(12, 16, 20, 0.34)';
    g.beginPath(); g.ellipse(8, 10, tr.r * 1.05, tr.r * 0.9, 0, 0, TAU); g.fill();

    const oTrunk = project3DOffset(tr.x, tr.y, tr.h * 0.32, false);
    g.strokeStyle = '#16181d'; g.lineWidth = 9; g.lineCap = 'round';
    g.beginPath(); g.moveTo(0, 0); g.lineTo(oTrunk.ox, oTrunk.oy); g.stroke();
    g.strokeStyle = '#5c4028'; g.lineWidth = 5;
    g.beginPath(); g.moveTo(0, 0); g.lineTo(oTrunk.ox, oTrunk.oy); g.stroke();

    const tiers = [
      { z: tr.h * 0.38, r: tr.r * 1.0, col: shade(tr.col, -0.16) },
      { z: tr.h * 0.68, r: tr.r * 0.82, col: tr.col },
      { z: tr.h * 0.98, r: tr.r * 0.56, col: shade(tr.col, 0.2) },
    ];
    g.strokeStyle = '#16181d';
    g.lineWidth = 2.8;
    for (const t of tiers) {
      const o = project3DOffset(tr.x, tr.y, t.z, false);
      g.fillStyle = t.col;
      g.beginPath(); g.arc(o.ox, o.oy, t.r, 0, TAU); g.fill(); g.stroke();
    }
  }
  g.restore();
}

function drawUnit(g, u, color, selected, now, isIcon = false) {
  const r = u.kind === 'scv' ? 10.0 : u.radius;
  const wx = u.x || 0, wy = u.y || 0;
  const darkCol = shade(color, -0.35);
  const lightCol = shade(color, 0.25);

  g.save();
  g.translate(wx, wy);

  // Si c'est un VCS posé SUR un chantier en cours de construction, on l'élève sur la dalle 3D du chantier !
  let siteZ = 0;
  if (!isIcon && u.kind === 'scv' && u.onSite && u.buildTargetId && state) {
    const tb = state.buildings.find((b) => b.id === u.buildTargetId && b.constructing);
    if (tb) {
      const defB = BUILDINGS[tb.kind] || BUILDINGS.hq;
      siteZ = (defB.height || 36) * clamp(tb.buildProg || 0.12, 0.12, 1) * 0.72;
    }
  }
  const siteOff = siteZ > 0 ? project3DOffset(wx, wy, siteZ, false) : { ox: 0, oy: 0 };
  g.translate(siteOff.ox, siteOff.oy);

  if (!isIcon && u.stimT > 0) {
    g.strokeStyle = '#ff4b2b';
    g.lineWidth = 2.5;
    g.beginPath(); g.arc(0, 0, r + 4 + Math.sin(now * 0.03) * 2, 0, TAU); g.stroke();
  }

  if (selected) {
    g.strokeStyle = '#2fbf71';
    g.lineWidth = 2.8;
    g.beginPath(); g.arc(0, 0, r + 6, 0, TAU); g.stroke();
  }

  g.fillStyle = 'rgba(12, 16, 20, 0.38)';
  g.beginPath(); g.ellipse(4.5, 5.5, r * 1.08, r * 0.92, 0, 0, TAU); g.fill();

  // Décalage 3D du châssis et de la tourelle/tête selon l'élévation Z
  const bodyOff = project3DOffset(wx, wy, u.kind === 'titan' ? 22 : u.kind === 'tank' || u.kind === 'siege' ? 12 : 9, isIcon);
  const topOff = project3DOffset(wx, wy, u.kind === 'titan' ? 38 : u.kind === 'tank' || u.kind === 'siege' ? 22 : 16, isIcon);

  g.strokeStyle = '#16181d';
  g.lineWidth = 2.5;

  if (u.kind === 'scv') {
    // Base chenilles au sol
    g.save();
    g.rotate(u.a || 0);
    g.fillStyle = '#383b44';
    g.fillRect(-r * 0.9, -r * 0.85, r * 1.4, 5); g.strokeRect(-r * 0.9, -r * 0.85, r * 1.4, 5);
    g.fillRect(-r * 0.9, r * 0.85 - 5, r * 1.4, 5); g.strokeRect(-r * 0.9, r * 0.85 - 5, r * 1.4, 5);
    g.fillStyle = '#ffc531';
    g.fillRect(r * 0.3, -r * 0.68, 8, 4); g.strokeRect(r * 0.3, -r * 0.68, 8, 4);
    g.fillRect(r * 0.3, r * 0.68 - 4, 8, 4); g.strokeRect(r * 0.3, r * 0.68 - 4, 8, 4);
    if (!isIcon && u.carryAmt > 0) {
      g.fillStyle = u.carryType === 'gas' ? '#2fbf71' : u.carryType === 'gold' ? '#ffc531' : '#1fc7c1';
      g.beginPath(); g.arc(r + 3, 0, 5.5, 0, TAU); g.fill(); g.stroke();
    }
    // Arc de soudure plasma actif quand le VCS construit sur le chantier
    if (!isIcon && u.onSite && u.mode === 'build') {
      const fR = 4.5 + Math.sin(now * 0.045) * 2.5;
      g.strokeStyle = '#1fc7c1';
      g.lineWidth = 3;
      g.beginPath(); g.moveTo(r * 0.7, -3); g.lineTo(r + 12, 0); g.lineTo(r * 0.7, 3); g.stroke();
      g.fillStyle = '#fff8ea';
      g.beginPath(); g.arc(r + 12, 0, fR, 0, TAU); g.fill();
    }
    g.restore();
    // Cabine 3D surélevée
    g.save();
    g.translate(bodyOff.ox, bodyOff.oy);
    g.rotate(u.a || 0);
    g.fillStyle = color;
    g.beginPath(); g.roundRect(-r * 0.78, -r * 0.68, r * 1.45, r * 1.36, 4); g.fill(); g.stroke();
    g.fillStyle = '#a9d8ff';
    g.beginPath(); g.roundRect(0, -r * 0.42, r * 0.48, r * 0.84, 2); g.fill(); g.stroke();
    g.restore();

  } else if (u.kind === 'tank' || u.kind === 'siege') {
    const L = r * 1.25, Wd = r * 0.95;
    // Niveau 0 : Chenilles et vérins de siège au sol
    g.save();
    g.rotate(u.a || 0);
    if (u.sieged) {
      g.fillStyle = '#ffc531';
      for (const [sx, sy] of [[-L * 0.85, -Wd * 1.15], [L * 0.85, -Wd * 1.15], [-L * 0.85, Wd * 1.15], [L * 0.85, Wd * 1.15]]) {
        g.beginPath(); g.arc(sx, sy, 5.5, 0, TAU); g.fill(); g.stroke();
      }
    }
    g.fillStyle = '#26282e';
    for (const sy of [-Wd, Wd - 6]) {
      g.beginPath(); g.roundRect(-L, sy, L * 2, 6, 2); g.fill(); g.stroke();
    }
    g.fillStyle = darkCol;
    g.beginPath(); g.roundRect(-L * 0.9, -Wd * 0.78, L * 1.8, Wd * 1.56, 5); g.fill(); g.stroke();
    g.restore();

    // Niveau 1 (Z=12) : Châssis blindé 3D
    g.save();
    g.translate(bodyOff.ox, bodyOff.oy);
    g.rotate(u.a || 0);
    g.fillStyle = color;
    g.beginPath(); g.roundRect(-L * 0.78, -Wd * 0.68, L * 1.56, Wd * 1.36, 4); g.fill(); g.stroke();
    g.restore();

    // Niveau 2 (Z=22) : Tourelle 3D et canon
    g.save();
    g.translate(topOff.ox, topOff.oy);
    g.rotate(u.a || 0);
    g.fillStyle = '#16181d';
    if (u.kind === 'siege') {
      const ext = u.sieged ? 21 : 14;
      g.fillRect(0, -5, r + ext, 10);
      g.fillStyle = '#1fc7c1';
      g.fillRect(4, -2, r + ext - 5, 4);
    } else {
      g.fillRect(2, -3.5, r + 11, 7);
    }
    g.fillStyle = '#fff8ea';
    g.beginPath(); g.arc(-2, 0, r * 0.5, 0, TAU); g.fill(); g.stroke();
    g.fillStyle = color;
    g.beginPath(); g.arc(-2, 0, r * 0.25, 0, TAU); g.fill();
    g.restore();

  } else if (u.kind === 'titan') {
    const walk = isIcon ? 0 : Math.sin(now * 0.012 + (u.id || 0)) * 3;
    // Niveau 0 : Pieds mécaniques au sol
    g.save();
    g.rotate(u.a || 0);
    g.fillStyle = '#383b44';
    g.beginPath(); g.roundRect(-8 + walk, -r * 0.85, 14, 8, 3); g.fill(); g.stroke();
    g.beginPath(); g.roundRect(-8 - walk, r * 0.85 - 8, 14, 8, 3); g.fill(); g.stroke();
    g.restore();

    // Niveau 1 (Z=22) : Torse & Canons plasma aux bras
    g.save();
    g.translate(bodyOff.ox, bodyOff.oy);
    g.rotate(u.a || 0);
    g.fillStyle = '#16181d';
    g.fillRect(2, -r * 0.88, r * 0.98, 7);
    g.fillRect(2, r * 0.88 - 7, r * 0.98, 7);
    g.fillStyle = '#1fc7c1';
    g.fillRect(r * 0.65, -r * 0.82, 6, 4);
    g.fillRect(r * 0.65, r * 0.82 - 4, 6, 4);
    g.fillStyle = color;
    g.beginPath(); g.roundRect(-r * 0.78, -r * 0.78, r * 1.56, r * 1.56, 8); g.fill(); g.stroke();
    g.restore();

    // Niveau 2 (Z=38) : Épaulières lourdes & Tête réacteur 3D
    g.save();
    g.translate(topOff.ox, topOff.oy);
    g.rotate(u.a || 0);
    g.fillStyle = '#fff8ea';
    g.beginPath(); g.roundRect(-r * 0.48, -r * 0.72, r * 0.96, r * 1.44, 5); g.fill(); g.stroke();
    g.fillStyle = '#ffc531';
    g.beginPath(); g.arc(0, 0, r * 0.36, 0, TAU); g.fill(); g.stroke();
    g.restore();

  } else if (u.kind === 'dropship') {
    // Navette de Transport 2D : coque lourde avec ailes à double turbine, baie de largage
    const hoverH = isIcon ? 0 : 20 + Math.sin(now * 0.003 + (u.id || 0)) * 2;
    if (!isIcon) {
      g.fillStyle = 'rgba(10, 16, 24, 0.35)';
      g.beginPath(); g.ellipse(0, 0, r * 1.1, r * 0.75, 0, 0, TAU); g.fill();
    }
    g.save();
    g.translate(0, -hoverH);
    g.rotate(u.a || 0);
    // Réacteurs latéraux
    g.fillStyle = '#232730'; g.strokeStyle = '#121418'; g.lineWidth = 2;
    g.fillRect(-r * 0.6, -r * 0.85, r * 1.2, r * 0.35); g.strokeRect(-r * 0.6, -r * 0.85, r * 1.2, r * 0.35);
    g.fillRect(-r * 0.6, r * 0.5, r * 1.2, r * 0.35); g.strokeRect(-r * 0.6, r * 0.5, r * 1.2, r * 0.35);
    // Flammes réacteurs
    g.fillStyle = '#1fc7c1';
    g.fillRect(-r * 0.85, -r * 0.8, r * 0.25, r * 0.25);
    g.fillRect(-r * 0.85, r * 0.55, r * 0.25, r * 0.25);
    // Fuselage principal
    g.fillStyle = color;
    g.beginPath();
    g.moveTo(r * 1.1, 0);
    g.lineTo(r * 0.3, -r * 0.65);
    g.lineTo(-r * 0.8, -r * 0.6);
    g.lineTo(-r * 0.8, r * 0.6);
    g.lineTo(r * 0.3, r * 0.65);
    g.closePath();
    g.fill(); g.stroke();
    // Verrière cockpit
    g.fillStyle = '#3ecbff';
    g.beginPath(); g.ellipse(r * 0.45, 0, r * 0.35, r * 0.25, 0, 0, TAU); g.fill();
    // Indicateur de passagers
    const passCount = u.cargo?.length || 0;
    if (passCount > 0) {
      g.fillStyle = '#ffc531';
      for (let i = 0; i < passCount; i++) g.fillRect(-r * 0.4 + i * 6, -2, 4, 4);
    }
    g.restore();

  } else if (u.kind === 'medivac') {
    // Navette Médicale 2D : cellule aérodynamique, croix de secours, propulseurs
    const hoverH = isIcon ? 0 : 20 + Math.sin(now * 0.003 + (u.id || 0)) * 2;
    if (!isIcon) {
      g.fillStyle = 'rgba(10, 16, 24, 0.35)';
      g.beginPath(); g.ellipse(0, 0, r * 1.05, r * 0.7, 0, 0, TAU); g.fill();
    }
    g.save();
    g.translate(0, -hoverH);
    g.rotate(u.a || 0);
    // Turbines
    g.fillStyle = '#2b303c'; g.strokeStyle = '#121418'; g.lineWidth = 1.8;
    g.fillRect(-r * 0.5, -r * 0.78, r * 1.0, r * 0.3); g.strokeRect(-r * 0.5, -r * 0.78, r * 1.0, r * 0.3);
    g.fillRect(-r * 0.5, r * 0.48, r * 1.0, r * 0.3); g.strokeRect(-r * 0.5, r * 0.48, r * 1.0, r * 0.3);
    // Lueur verte de propulsion
    g.fillStyle = '#2fbf71';
    g.fillRect(-r * 0.75, -r * 0.74, r * 0.25, r * 0.22);
    g.fillRect(-r * 0.75, r * 0.52, r * 0.25, r * 0.22);
    // Fuselage blanc/équipe
    g.fillStyle = '#e8edf5';
    g.beginPath();
    g.moveTo(r * 1.0, 0);
    g.lineTo(r * 0.2, -r * 0.55);
    g.lineTo(-r * 0.75, -r * 0.45);
    g.lineTo(-r * 0.75, r * 0.45);
    g.lineTo(r * 0.2, r * 0.55);
    g.closePath();
    g.fill(); g.stroke();
    // Croix médicale verte
    g.fillStyle = '#2fbf71';
    g.fillRect(-r * 0.15, -r * 0.32, r * 0.3, r * 0.64);
    g.fillRect(-r * 0.32, -r * 0.15, r * 0.64, r * 0.3);
    // Verrière
    g.fillStyle = '#3ecbff';
    g.beginPath(); g.arc(r * 0.45, 0, r * 0.22, 0, TAU); g.fill();
    g.restore();

  } else {
    // Infanterie 3D : corps à Z=9, casque et arme à Z=16
    g.save();
    g.translate(bodyOff.ox * 0.6, bodyOff.oy * 0.6);
    g.rotate(u.a || 0);
    g.fillStyle = u.kind === 'sapper' ? '#ffc531' : darkCol;
    g.beginPath(); g.roundRect(-r * 0.95, -r * 0.55, r * 0.7, r * 1.1, 3); g.fill(); g.stroke();
    g.fillStyle = darkCol;
    g.beginPath(); g.arc(0, 0, r * 0.9, 0, TAU); g.fill(); g.stroke();
    g.restore();

    g.save();
    g.translate(topOff.ox * 0.75, topOff.oy * 0.75);
    g.rotate(u.a || 0);
    if (u.kind === 'rocket') {
      g.fillStyle = '#383b44';
      g.fillRect(-4, 3, r + 9, 6); g.strokeRect(-4, 3, r + 9, 6);
      g.fillStyle = '#ff4b2b';
      g.fillRect(r + 3, 4, 4, 4);
    } else if (u.kind === 'sapper') {
      g.fillStyle = '#ff4b2b';
      g.beginPath(); g.arc(r * 0.75, 0, 5, 0, TAU); g.fill(); g.stroke();
    } else {
      g.fillStyle = '#16181d';
      g.fillRect(2, 2, r + 6, 4.5);
    }
    g.fillStyle = color;
    g.beginPath(); g.arc(0, 0, r * 0.82, 0, TAU); g.fill(); g.stroke();
    g.fillStyle = '#a9d8ff';
    g.beginPath(); g.roundRect(r * 0.12, -r * 0.45, r * 0.5, r * 0.9, 3); g.fill(); g.stroke();
    g.fillStyle = lightCol;
    g.beginPath(); g.arc(-r * 0.22, -r * 0.22, r * 0.25, 0, TAU); g.fill();
    g.restore();
  }

  if (!isIcon && (u.hp < u.maxHp || selected)) {
    const bw = r * 2.1, pct = clamp(u.hp / u.maxHp, 0, 1);
    g.fillStyle = '#16181d';
    g.fillRect(topOff.ox - bw / 2 - 1, topOff.oy - r - 10, bw + 2, 5);
    g.fillStyle = pct > 0.45 ? '#2fbf71' : '#ff4b2b';
    g.fillRect(topOff.ox - bw / 2, topOff.oy - r - 9, bw * pct, 3);
  }
  g.restore();
}

function drawThumbIcon(canvasEl, kind, playerColor) {
  if (!canvasEl) return;
  const g = canvasEl.getContext('2d');
  const w = canvasEl.width, h = canvasEl.height;
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.clearRect(0, 0, w, h);
  g.save();
  if (BUILDINGS[kind]) {
    const def = BUILDINGS[kind];
    const r = def.radius;
    const zMax = (def.height || 36) * 1.1;
    const spanY = 2.05 * r + zMax * 0.48;
    const spanX = 2.25 * r + zMax * 0.14;
    const sc = Math.min((w * 0.76) / spanX, (h * 0.76) / spanY);
    const midY = -zMax * 0.24;
    g.translate(w / 2 + zMax * 0.06 * sc, h / 2 - midY * sc);
    g.scale(sc, sc);
    drawBuilding(g, { kind, x: 0, y: 0, radius: r, hp: def.hp, maxHp: def.hp, aimA: -0.4 }, playerColor, false, 0, true);
  } else if (UNITS[kind]) {
    const def = UNITS[kind];
    const r = def.radius;
    const zMax = kind === 'titan' ? 40 : (kind === 'tank' || kind === 'siege') ? 24 : 18;
    const spanY = 2.2 * r + zMax * 0.48;
    const spanX = 2.5 * r + zMax * 0.14;
    const sc = Math.min((w * 0.74) / spanX, (h * 0.74) / spanY);
    const midY = -zMax * 0.24;
    g.translate(w / 2 + zMax * 0.06 * sc, h / 2 - midY * sc);
    g.scale(sc, sc);
    drawUnit(g, { kind, x: 0, y: 0, radius: r, a: -0.35, hp: def.hp, maxHp: def.hp }, playerColor, false, 0, true);
  }
  g.restore();
}

function screenToWorld(sx, sy) {
  if (threeReady && threeCam && threeRaycaster && threeGroundPlane) {
    threeNdc.set((sx / Math.max(1, W)) * 2 - 1, -(sy / Math.max(1, H)) * 2 + 1);
    threeRaycaster.setFromCamera(threeNdc, threeCam);
    if (threeRaycaster.ray.intersectPlane(threeGroundPlane, threeHitPt)) {
      return { x: threeHitPt.x, y: threeHitPt.z };
    }
  }
  return {
    x: cam.x + (sx - W / 2) / cam.z,
    y: cam.y + (sy - H / 2) / (cam.z * 0.77),
  };
}

function worldToScreen3D(wx, wy, h = 0) {
  if (threeReady && threeCam && threeProjVec) {
    threeProjVec.set(wx, h, wy).project(threeCam);
    return {
      x: (threeProjVec.x * 0.5 + 0.5) * W,
      y: (-threeProjVec.y * 0.5 + 0.5) * H,
    };
  }
  return {
    x: W / 2 + (wx - cam.x) * cam.z,
    y: H / 2 + (wy - cam.y - h * 0.77) * (cam.z * 0.77),
  };
}

function centerOnMyHq() {
  if (!state) return;
  const hq = state.buildings.find((b) => b.owner === myId && b.kind === 'hq');
  if (hq) { cam.x = hq.x; cam.y = hq.y; }
}

let toastTimer = 0;
function toast(msg, ms = 2400) {
  const el = $('#uiToast');
  el.textContent = msg;
  el.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.hidden = true; }, ms);
}

function handleFxEvents(list) {
  if (!Array.isArray(list)) return;
  for (const e of list) {
    if (e.k === 'SHOT' || e.k === 'ROCKET' || e.k === 'PLASMA') {
      const isPlasma = e.k === 'PLASMA', isRocket = e.k === 'ROCKET';
      projectiles.push({
        x: e.x1, y: e.y1, tx: e.x2, ty: e.y2,
        prog: 0, speed: isPlasma ? 4.8 : isRocket ? 5.5 : 9.0,
        color: isPlasma ? '#1fc7c1' : isRocket ? '#ff4b2b' : (e.color || '#ffc531'),
        r: isPlasma ? 6 : isRocket ? 5 : 3.2,
      });
      if (hypot(e.x1, e.y1, cam.x, cam.y) < 700) {
        if (isPlasma) Sfx.plasma(); else Sfx.shoot();
      }
    } else if (e.k === 'TESLA') {
      beams.push({ x1: e.x1, y1: e.y1, x2: e.x2, y2: e.y2, color: '#1fc7c1', w: 4.5, life: 0.22, maxLife: 0.22, tesla: true });
      shockwaves.push({ x: e.x2, y: e.y2, r: 8, maxR: 48, color: '#1fc7c1', life: 0.22, maxLife: 0.22 });
      if (hypot(e.x2, e.y2, cam.x, cam.y) < 750) Sfx.plasma();
    } else if (e.k === 'MINE' || e.k === 'SPARK') {
      const a = Math.random() * TAU;
      particles.push({
        x: e.x, y: e.y, vx: Math.cos(a) * 35, vy: Math.sin(a) * 35,
        r: 2.8, color: e.color || '#1fc7c1', life: 0.18,
      });
      if (hypot(e.x, e.y, cam.x, cam.y) < 700) Sfx.mine();
    } else if (e.k === 'STIM') {
      shockwaves.push({ x: e.x, y: e.y, r: 4, maxR: 26, color: '#ff4b2b', life: 0.22, maxLife: 0.22 });
      if (hypot(e.x, e.y, cam.x, cam.y) < 750) Sfx.stim();
    } else if (e.k === 'SIEGE') {
      shockwaves.push({ x: e.x, y: e.y, r: 6, maxR: 32, color: '#ffc531', life: 0.25, maxLife: 0.25 });
      if (hypot(e.x, e.y, cam.x, cam.y) < 800) Sfx.siege();
    } else if (e.k === 'SCAN') {
      shockwaves.push({ x: e.x, y: e.y, r: 20, maxR: e.r || 380, color: '#1fc7c1', life: 0.55, maxLife: 0.55 });
      Sfx.scan();
    } else if (e.k === 'BOOM' || e.k === 'BOOM_BIG') {
      const big = e.k === 'BOOM_BIG';
      const cnt = big ? 24 : 10;
      shockwaves.push({ x: e.x, y: e.y, r: 10, maxR: big ? 95 : 42, color: big ? '#ffc531' : '#ff4b2b', life: big ? 0.38 : 0.22, maxLife: big ? 0.38 : 0.22 });
      if (big) {
        craters.push({ x: e.x, y: e.y, r: e.r * 0.78 });
        if (craters.length > 45) craters.shift();
      }
      if (hypot(e.x, e.y, cam.x, cam.y) < 1100) {
        if (big) cam.shake = Math.max(cam.shake, 12);
        Sfx.boom(big);
      }
      for (let k = 0; k < cnt; k++) {
        const a = Math.random() * TAU, sp = (big ? 55 : 28) + Math.random() * (big ? 165 : 80);
        particles.push({
          x: e.x, y: e.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
          r: (big ? 6 : 3.5) + Math.random() * 4,
          color: k % 3 === 0 ? '#fff8ea' : k % 2 === 0 ? '#ff4b2b' : '#ffc531',
          life: (big ? 0.45 : 0.26) + Math.random() * 0.15,
        });
      }
    } else if (e.k === 'BUILD' || e.k === 'SPAWN' || e.k === 'COMPLETE') {
