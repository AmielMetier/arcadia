/* ============================================================================
   RÈGLES DE PLACEMENT & RAVITAILLEMENT STARCRAFT
   ============================================================================ */
function computeSupply(state, ownerId) {
  let used = 0, max = 0;
  for (const b of state.buildings) {
    if (b.owner === ownerId && b.hp > 0 && !b.constructing) {
      max += BUILDINGS[b.kind]?.supply || 0;
    }
  }
  for (const u of state.units) {
    if (u.owner === ownerId && u.hp > 0) {
      used += UNITS[u.kind]?.supply || 1;
    }
  }
  for (const b of state.buildings) {
    if (b.owner === ownerId && b.hp > 0 && Array.isArray(b.queue)) {
      for (const qKind of b.queue) used += UNITS[qKind]?.supply || 1;
    }
  }
  return { used, max: Math.min(MAX_SUPPLY, max) };
}

function findGeyserAt(x, y, maxDist = 56) {
  let best = null, bestD2 = maxDist * maxDist;
  for (const g of GAS_GEYSERS) {
    const d2 = dist2(x, y, g.x, g.y);
    if (d2 <= bestD2) { bestD2 = d2; best = g; }
  }
  return best;
}

function hasCompletedBuilding(state, ownerId, kind) {
  return state.buildings.some((b) => b.owner === ownerId && b.kind === kind && b.hp > 0 && !b.constructing);
}

function canPlaceBuilding(state, ownerId, kind, x, y) {
  const def = BUILDINGS[kind];
  if (!def) return { ok: false, reason: 'Bâtiment inconnu.' };
  const player = state.players.find((p) => p.id === ownerId);
  if (!player || player.dead) return { ok: false, reason: 'Joueur éliminé.' };
  if (def.req && !hasCompletedBuilding(state, ownerId, def.req)) {
    return { ok: false, reason: `Requiert d’abord : ${BUILDINGS[def.req].name}.` };
  }
  if (player.minerals < def.min) return { ok: false, reason: `Pas assez de Minéraux (${def.min}💎 requis).` };
  if (player.gas < def.gas) return { ok: false, reason: `Pas assez de Gaz Plasma (${def.gas}🧪 requis).` };

  if (def.onGeyser) {
    const gey = findGeyserAt(x, y, 64);
    if (!gey) return { ok: false, reason: 'La Raffinerie doit être placée sur un Geyser de Gaz Plasma 🧪.' };
    const taken = state.buildings.some((b) => b.hp > 0 && dist2(b.x, b.y, gey.x, gey.y) < 35 * 35);
    if (taken) return { ok: false, reason: 'Ce Geyser de Gaz est déjà exploité.' };
    return { ok: true, snapX: gey.x, snapY: gey.y, geyserId: gey.id };
  }

  const margin = def.radius + 32;
  if (x < margin || y < margin || x > WORLD_SIZE - margin || y > WORLD_SIZE - margin) {
    return { ok: false, reason: 'Trop près du bord de la carte.' };
  }

  {
    const types = areaTypes(x, y, def.radius + (kind === 'wall' ? 2 : 8));
    if (types.has(T_LIQUID)) return { ok: false, reason: `Impossible de construire sur ${LIQUID_LABEL[activeMapId] || "l'eau"}.` };
    if (types.has(T_MOUNT)) return { ok: false, reason: 'Impossible de construire sur la montagne.' };
    if (types.has(T_CLIFF)) return { ok: false, reason: 'Trop près du bord de la falaise.' };
    if (types.has(T_RAMP) && kind !== 'wall') return { ok: false, reason: 'Les rampes doivent rester libres (seuls les Murs y sont permis).' };
  }

  const pad = kind === 'wall' ? 2 : 14;
  for (const b of state.buildings) {
    if (b.hp <= 0) continue;
    const minDist = def.radius + b.radius + pad;
    if (dist2(x, y, b.x, b.y) < minDist * minDist) {
      return { ok: false, reason: 'Emplacement occupé par un bâtiment.' };
    }
  }
  for (const rk of ROCKS) {
    if (dist2(x, y, rk.x, rk.y) < (def.radius + rk.r + 6) ** 2) {
      return { ok: false, reason: 'Obstacle rocheux.' };
    }
  }
  for (const m of MINERAL_NODES) {
    const minD = kind === 'hq' ? def.radius + 45 : def.radius + 22;
    if (dist2(x, y, m.x, m.y) < minD * minD) {
      return { ok: false, reason: 'Trop près des gisements de minéraux.' };
    }
  }
  for (const gey of GAS_GEYSERS) {
    if (dist2(x, y, gey.x, gey.y) < (def.radius + 28) ** 2) {
      return { ok: false, reason: 'Réservé aux Raffineries de Gaz.' };
    }
  }
  return { ok: true, snapX: Math.round(x), snapY: Math.round(y) };
}

function nearestMineral(x, y, maxDist = 2000) {
  let best = null, bestD2 = maxDist * maxDist;
  for (const m of MINERAL_NODES) {
    const d2 = dist2(x, y, m.x, m.y);
    if (d2 < bestD2) { bestD2 = d2; best = m; }
  }
  return best;
}

function nearestMyHq(state, ownerId, x, y) {
  let best = null, bestD2 = Infinity;
  for (const b of state.buildings) {
    if (b.owner === ownerId && b.kind === 'hq' && b.hp > 0 && !b.constructing) {
      const d2 = dist2(x, y, b.x, b.y);
      if (d2 < bestD2) { bestD2 = d2; best = b; }
    }
  }
  return best;
}

/* ============================================================================
   CRÉATION DE L'ÉTAT INITIAL RTS (QG + 6 OUVRIERS VCS EN RÉCOLTE)
   ============================================================================ */
function createInitialState(roster, settings = {}) {
  const mapId = MAP_DEFS[settings.map] ? settings.map : (activeMapId || 'vallee');
  const modeStr = String(settings.mode || '');
  const is2v2 = modeStr.startsWith('2v2') && roster.length >= 2;
  const layout = is2v2 ? '2v2' : 'ffa';
  if (mapId !== activeMapId || layout !== activeLayout || MINERAL_NODES.length === 0) {
    initMap(mapId, layout);
  }
  const blitz = settings.pace === 'blitz';

  const humans = roster.filter((p) => !p.bot);
  const bots = roster.filter((p) => p.bot);

  const players = roster.map((p, idx) => {
    let team = p.id;
    if (is2v2) {
      if (modeStr === '2v2_duel') {
        // Duel : Humain 1 + Bot 1 (Équipe A) vs Humain 2 + Bot 2 (Équipe B)
        if (humans.length >= 2 && bots.length >= 2) {
          team = (p.id === humans[0].id || p.id === bots[0].id) ? 0 : 1;
        } else {
          team = idx % 2;
        }
      } else if (modeStr === '2v2_pvp') {
        // 2v2 Joueurs 1 & 2 vs Joueurs 3 & 4
        team = idx < 2 ? 0 : 1;
      } else {
        // Mode 2v2 Coopératif (par défaut : 2v2_coop ou 2v2) : HUMAINS ENSEMBLE VS BOTS !
        // Seul avec 3 bots : un bot vient compléter ton équipe pour faire un vrai 2 contre 2.
        if (humans.length > 0 && bots.length > 0) {
          // Bots alliés = places libres de l'équipe humaine, en gardant 2 bots adverses
          const allyBots = Math.min(Math.max(0, 2 - humans.length), Math.max(0, bots.length - 2));
          const botIdx = bots.findIndex((bt) => bt.id === p.id);
          team = !p.bot ? 0 : (botIdx < allyBots ? 0 : 1);
        } else {
          team = idx < 2 ? 0 : 1;
        }
      }
    }
    return {
      id: p.id,
      name: p.name,
      color: p.color || PALETTE[idx % PALETTE.length],
      bot: !!p.bot,
      team,
      upgrades: {},
      minerals: blitz ? 300 : 200,
      gas: blitz ? 100 : 50,
      dead: false,
      score: 0,
      nextUnitSeq: 20,
      ping: p.bot ? 0 : 16,
    };
  });

  let nextId = 1;
  const buildings = [];
  const units = [];

  // Emplacements de départ : en 2v2, les alliés sont côte à côte sur le même flanc
  const spawnOf = new Map();
  if (is2v2 && TEAM_SPAWNS) {
    const used = new Set();
    for (const t of [0, 1]) {
      const slots = TEAM_SPAWNS[t].slice();
      for (const p of players.filter((q) => q.team === t)) {
        const sp = slots.shift() || SPAWN_CORNERS.find((c) => !used.has(c));
        if (sp) { used.add(sp); spawnOf.set(p.id, sp); }
      }
    }
  }
  players.forEach((p, idx) => {
    const sp = spawnOf.get(p.id) || SPAWN_CORNERS[idx % SPAWN_CORNERS.length];
    p.spawnX = sp.x; p.spawnY = sp.y;
    const dirX = Math.sign(HALF_W - sp.x) || 1, dirY = Math.sign(HALF_W - sp.y) || 1;
    const mainDef = (MAP_FEATURES?.mains || []).find((m) => m.x === sp.x && m.y === sp.y);
    const rampA = mainDef ? mainDef.ramps[0] : Math.atan2(dirY, dirX);
    const hq = {
      id: nextId++, kind: 'hq', owner: p.id, team: p.team,
      x: sp.x, y: sp.y, hp: BUILDINGS.hq.hp, maxHp: BUILDINGS.hq.hp,
      radius: BUILDINGS.hq.radius, cd: 0, aimA: rampA,
      constructing: false, buildProg: 1, queue: [], qTimer: 0, qTotal: 0,
      rallyX: Math.round(sp.x + Math.cos(rampA) * 150), rallyY: Math.round(sp.y + Math.sin(rampA) * 150),
    };
    buildings.push(hq);

    const baseMinerals = MINERAL_NODES.filter((m) => hypot(m.x, m.y, sp.x, sp.y) < 220);
    for (let k = 0; k < 6; k++) {
      const mNode = baseMinerals[k % baseMinerals.length];
      const ang = Math.atan2((mNode ? mNode.y : sp.y) - sp.y, (mNode ? mNode.x : sp.x) - sp.x);
      units.push({
        id: nextId++, kind: 'scv', owner: p.id, team: p.team,
        x: Math.round(sp.x + Math.cos(ang) * 66 + (k - 2.5) * 14),
        y: Math.round(sp.y + Math.sin(ang) * 66 + (k - 2.5) * 14),
        vx: 0, vy: 0, a: ang,
        hp: UNITS.scv.hp, maxHp: UNITS.scv.hp, radius: UNITS.scv.radius,
        cd: 0, mode: 'harvest_min',
        harvestId: mNode ? mNode.id : null,
        gatherT: 0, carryType: null, carryAmt: 0,
        buildTargetId: null, orderX: null, orderY: null, targetEntId: null,
        stimT: 0, sieged: false,
        flying: false, cargo: [], boardedIn: null, healingTargetId: null,
      });
    }

    for (let k = 0; k < 2; k++) {
      units.push({
        id: nextId++, kind: 'marine', owner: p.id, team: p.team,
        x: sp.x + dirX * (95 + k * 22), y: sp.y + dirY * (75 - k * 20),
        vx: 0, vy: 0, a: Math.atan2(dirY, dirX),
        hp: UNITS.marine.hp, maxHp: UNITS.marine.hp, radius: UNITS.marine.radius,
        cd: 0, mode: 'idle', orderX: null, orderY: null, targetEntId: null,
        stimT: 0, sieged: false,
        flying: false, cargo: [], boardedIn: null, healingTargetId: null,
      });
    }
  });

  return {
    time: 0,
    blitz,
    map: mapId,
    mode: is2v2 ? '2v2' : 'ffa',
    is2v2,
    level: settings.level || 'normal',
    phase: 1,
    stormRadius: HALF_W * 1.45,
    dmgMult: 1.0,
    nextId,
    players,
    buildings,
    units,
    scans: [],
    over: false,
    winnerTeam: null,
    ranking: [],
  };
}

/* ============================================================================
   EXÉCUTION DES COMMANDES RTS (SERVEUR AUTORITAIRE / HÔTE)
   ============================================================================ */
function spawnTrainedUnit(state, owner, bld, kind, fxEvents) {
  const def = UNITS[kind];
  if (!def) return;
  let rx = bld.rallyX ?? (bld.x + Math.sign(HALF_W - bld.x) * 110);
  let ry = bld.rallyY ?? (bld.y + Math.sign(HALF_W - bld.y) * 110);
  // Point de ralliement tombé sur un bâtiment : on le décale sur la case libre la plus proche
  const rCell = pathCellOf(rx, ry);
  if (pathBlocked[rCell]) {
    const free = nearestFreeCell(rCell);
    rx = ((free % PATH_N) + 0.5) * PATH_CELL;
    ry = (((free / PATH_N) | 0) + 0.5) * PATH_CELL;
  }
  const angle = Math.atan2(ry - bld.y, rx - bld.x);
  const seq = (owner.nextUnitSeq = (owner.nextUnitSeq || 20) + 1);
  const jitter = (((seq * 37) % 100) / 100 - 0.5) * 32;
  const ux = clamp(bld.x + Math.cos(angle) * (bld.radius + def.radius + 10) - Math.sin(angle) * jitter, 30, WORLD_SIZE - 30);
  const uy = clamp(bld.y + Math.sin(angle) * (bld.radius + def.radius + 10) + Math.cos(angle) * jitter, 30, WORLD_SIZE - 30);
  const detId = (Number(owner.id) + 1) * 10000 + seq;
  let hpMult = 1.0;
  if (owner.upgrades) {
    if (['marine', 'rocket', 'sapper'].includes(kind) && owner.upgrades.infantry_armor) hpMult *= 1.25;
    if (['tank', 'siege', 'titan'].includes(kind) && owner.upgrades.vehicle_armor) hpMult *= 1.25;
  }
  const finalHp = Math.round(def.hp * hpMult);

  const u = {
    id: detId,
    kind,
    owner: owner.id,
    team: owner.team,
    x: ux,
    y: uy,
    vx: 0,
    vy: 0,
    a: angle,
    hp: finalHp,
    maxHp: finalHp,
    radius: def.radius,
    cd: 0,
    mode: 'amove',
    orderX: rx + (((seq * 53) % 100) / 100 - 0.5) * 28,
    orderY: ry + (((seq * 71) % 100) / 100 - 0.5) * 28,
    pathX: Math.round(rx),
    pathY: Math.round(ry),
    targetEntId: null,
    harvestId: null,
    gatherT: 0,
    carryType: null,
    carryAmt: 0,
    buildTargetId: null,
    stimT: 0,
    sieged: false,
    flying: !!def.flying,
    cargo: [],
    boardedIn: null,
    healingTargetId: null,
  };

  if (kind === 'scv') {
    const m = nearestMineral(rx, ry, 260) || nearestMineral(bld.x, bld.y, 350);
    if (m) {
      u.mode = 'harvest_min';
      u.harvestId = m.id;
      u.orderX = null;
      u.orderY = null;
    }
  }
  state.units.push(u);
  fxEvents.push({ k: 'SPAWN', x: ux, y: uy, color: owner.color });
}

/* ---------- Changement d'équipe en 2v2 : déplacer une base vers un autre emplacement ----------
   Les emplacements sont symétriques (miroir horizontal et/ou vertical), on reflète donc
   toutes les positions du joueur pour qu'il retrouve la même base de l'autre côté. */
function mirrorFnBetween(from, to) {
  const mx = Math.abs(from.x - to.x) > 1, my = Math.abs(from.y - to.y) > 1;
  return {
    x: (x) => (x == null ? x : mx ? WORLD_SIZE - x : x),
    y: (y) => (y == null ? y : my ? WORLD_SIZE - y : y),
    a: (a) => { let r = a || 0; if (mx) r = Math.PI - r; if (my) r = -r; return r; },
  };
}
function moveEntitiesBetweenSpawns(st, pl, to, ents = null) {
  const from = { x: pl.spawnX, y: pl.spawnY };
  const M = mirrorFnBetween(from, to);
  const mine = ents || {
    blds: st.buildings.filter((b) => b.owner === pl.id),
    units: st.units.filter((u) => u.owner === pl.id),
  };
  for (const b of mine.blds) {
    b.x = M.x(b.x); b.y = M.y(b.y);
    b.rallyX = M.x(b.rallyX); b.rallyY = M.y(b.rallyY);
    if (b.aimA != null) b.aimA = M.a(b.aimA);
  }
  for (const u of mine.units) {
    u.x = M.x(u.x); u.y = M.y(u.y);
    u.orderX = M.x(u.orderX); u.orderY = M.y(u.orderY);
    u.a = M.a(u.a); u.vx = 0; u.vy = 0;
    if (u.mode === 'harvest_min' && u.harvestId) {
      const old = MINERAL_NODES.find((m) => m.id === u.harvestId);
      if (old) {
        const tx = M.x(old.x), ty = M.y(old.y);
        const twin = MINERAL_NODES.reduce((best, m) => (dist2(m.x, m.y, tx, ty) < dist2(best.x, best.y, tx, ty) ? m : best), MINERAL_NODES[0]);
        u.harvestId = twin ? twin.id : null;
      }
    }
  }
  pl.spawnX = to.x; pl.spawnY = to.y;
}
function swapPlayerBases(st, a, b) {
  const entsA = { blds: st.buildings.filter((x) => x.owner === a.id), units: st.units.filter((x) => x.owner === a.id) };
  const entsB = { blds: st.buildings.filter((x) => x.owner === b.id), units: st.units.filter((x) => x.owner === b.id) };
  const spA = { x: a.spawnX, y: a.spawnY }, spB = { x: b.spawnX, y: b.spawnY };
  moveEntitiesBetweenSpawns(st, a, spB, entsA);
  moveEntitiesBetweenSpawns(st, b, spA, entsB);
}

function executeCommand(state, playerId, cmd, fxEvents) {
  if (state.over || !cmd || typeof cmd !== 'object') return { ok: false };
  const p = state.players.find((q) => Number(q.id) === Number(playerId));
  if (!p || p.dead) return { ok: false };

  // 1. POSER UN CHANTIER DE CONSTRUCTION (exige un Ouvrier VCS qui se déplace sur place !)
  if (cmd.op === 'BUILD') {
    if (cmd.bldId && state.buildings.some((b) => b.id === cmd.bldId)) {
      return { ok: true, bldId: cmd.bldId };
    }
    const kind = String(cmd.kind || '');
    const check = canPlaceBuilding(state, p.id, kind, Number(cmd.x) || 0, Number(cmd.y) || 0);
    if (!check.ok) return check;

    const bx = check.snapX, by = check.snapY;
    let builder = null;
    if (Array.isArray(cmd.unitIds) && cmd.unitIds.length) {
      const candidates = state.units.filter((u) => Number(u.owner) === Number(p.id) && u.kind === 'scv' && u.hp > 0 && cmd.unitIds.includes(u.id));
      if (candidates.length) {
        candidates.sort((a, b) => {
          const pa = a.mode === 'build' ? 1e7 : 0;
          const pb = b.mode === 'build' ? 1e7 : 0;
          return (dist2(a.x, a.y, bx, by) + pa) - (dist2(b.x, b.y, bx, by) + pb);
        });
        builder = candidates[0];
      }
    }
    if (!builder) {
      // Fallback sur le VCS libre le plus proche du joueur si l'ID de sélection a glissé
      let bestD2 = Infinity;
      for (const u of state.units) {
        if (Number(u.owner) === Number(p.id) && u.kind === 'scv' && u.hp > 0 && u.mode !== 'build') {
          const d2 = dist2(u.x, u.y, bx, by);
          if (d2 < bestD2) { bestD2 = d2; builder = u; }
        }
      }
    }
    if (!builder) {
      return { ok: false, reason: 'Sélectionne d’abord un Ouvrier VCS pour construire !' };
    }

    const def = BUILDINGS[kind];
    p.minerals -= def.min;
    p.gas -= def.gas;
    const bld = {
      id: Number(cmd.bldId) || state.nextId++,
      kind,
      owner: p.id,
      team: p.team,
      x: bx,
      y: by,
      hp: Math.round(def.hp * 0.15),
      maxHp: def.hp,
      radius: def.radius,
      cd: 0,
      aimA: Math.atan2(HALF_W - by, HALF_W - bx),
      constructing: true,
      buildStarted: false,
      buildProg: 0,
      buildTime: state.blitz ? def.buildTime * 0.65 : def.buildTime,
      queue: [],
      qTimer: 0,
      qTotal: 0,
      rallyX: bx + Math.sign(HALF_W - bx) * 115,
      rallyY: by + Math.sign(HALF_W - by) * 115,
      geyserId: check.geyserId || null,
    };
    state.buildings.push(bld);
    p.score += Math.round((def.min + def.gas) * 0.35);

    builder.mode = 'build';
    builder.buildTargetId = bld.id;
    builder.onSite = false;
    builder.weldTimer = 0;
    builder.weldX = bx;
    builder.weldY = by;
    builder.orderX = bx;
    builder.orderY = by;
    fxEvents.push({ k: 'BUILD', x: bx, y: by, color: p.color, radius: def.radius });
    return { ok: true, bldId: bld.id };
  }

  // 2. ENTRAÎNER UNE UNITÉ DANS UN BÂTIMENT SÉLECTIONNÉ
  if (cmd.op === 'TRAIN') {
    const uKind = String(cmd.unit || '');
    const uDef = UNITS[uKind];
    if (!uDef) return { ok: false, reason: 'Unité inconnue.' };
    const sup = computeSupply(state, p.id);
    if (sup.used + uDef.supply > sup.max) {
      return { ok: false, reason: 'Ravitaillement insuffisant 📦 ! Clique sur un VCS et construis un Dépôt Relais.' };
    }
    if (p.minerals < uDef.min) return { ok: false, reason: `Minéraux insuffisants (${uDef.min}💎).` };
    if (p.gas < uDef.gas) return { ok: false, reason: `Gaz Plasma insuffisant (${uDef.gas}🧪).` };

    let producer = null;
    if (cmd.bldId) {
      const b = state.buildings.find((x) => x.id === cmd.bldId && Number(x.owner) === Number(p.id) && x.hp > 0 && !x.constructing);
      if (b && (BUILDINGS[b.kind]?.trains || []).includes(uKind) && b.queue.length < 5) {
        producer = b;
      }
    }
    if (!producer) {
      const candidates = state.buildings.filter((b) =>
        Number(b.owner) === Number(p.id) && b.hp > 0 && !b.constructing && (BUILDINGS[b.kind]?.trains || []).includes(uKind) && b.queue.length < 5
      );
      candidates.sort((a, b) => a.queue.length - b.queue.length);
      producer = candidates[0] || null;
    }

    if (!producer) {
      return { ok: false, reason: 'Clique sur le bâtiment de production correspondant (ou file pleine 5/5).' };
    }
    p.minerals -= uDef.min;
    p.gas -= uDef.gas;
    producer.queue.push(uKind);
    if (producer.queue.length === 1) {
      producer.qTotal = state.blitz ? uDef.trainTime * 0.65 : uDef.trainTime;
      producer.qTimer = producer.qTotal;
    }
    p.score += Math.round((uDef.min + uDef.gas) * 0.25);
    return { ok: true };
  }

  // 3. RECHERCHER UNE AMÉLIORATION DANS L'ARMURERIE TECH
  if (cmd.op === 'RESEARCH') {
    const upgId = String(cmd.upgId || '');
    const upgDef = UPGRADES[upgId];
    if (!upgDef) return { ok: false, reason: 'Amélioration inconnue.' };
    p.upgrades = p.upgrades || {};
    if (p.upgrades[upgId]) return { ok: false, reason: 'Amélioration déjà acquise !' };
    if (p.minerals < upgDef.min) return { ok: false, reason: `Minéraux insuffisants (${upgDef.min}💎 requis).` };
    if (p.gas < upgDef.gas) return { ok: false, reason: `Gaz Plasma insuffisant (${upgDef.gas}🧪 requis).` };

    let lab = null;
    if (cmd.bldId) {
      const b = state.buildings.find((x) => x.id === cmd.bldId && Number(x.owner) === Number(p.id) && x.hp > 0 && !x.constructing && x.kind === 'armory');
      if (b && Array.isArray(b.queue) && b.queue.length < 5 && !b.queue.includes(upgId)) lab = b;
    }
    if (!lab) {
      const labs = state.buildings.filter((b) => Number(b.owner) === Number(p.id) && b.hp > 0 && !b.constructing && b.kind === 'armory' && Array.isArray(b.queue) && b.queue.length < 5 && !b.queue.includes(upgId));
      lab = labs[0] || null;
    }
    if (!lab) return { ok: false, reason: 'Construis d’abord une Armurerie Tech pour lancer cette amélioration.' };

    p.minerals -= upgDef.min;
    p.gas -= upgDef.gas;
    lab.queue = lab.queue || [];
    lab.queue.push(upgId);
    if (lab.queue.length === 1) {
      lab.qTotal = state.blitz ? upgDef.time * 0.65 : upgDef.time;
      lab.qTimer = lab.qTotal;
    }
    p.score += Math.round((upgDef.min + upgDef.gas) * 0.35);
    fxEvents.push({ k: 'RESEARCH_START', bldId: lab.id, x: lab.x, y: lab.y, color: p.color });
    return { ok: true };
  }

  // 4. CHANGER D'ÉQUIPE (2v2)
  if (cmd.op === 'TOGGLE_TEAM') {
    if (state.time > 45) return { ok: false, reason: 'Changement d’équipe verrouillé après le début de la partie.' };
    const target = state.players.find((q) => Number(q.id) === Number(cmd.targetId));
    if (!target) return { ok: false };
    if (role !== 'solo' && Number(p.id) !== Number(target.id) && role !== 'host') return { ok: false };
    const fromTeam = target.team, toTeam = fromTeam === 0 ? 1 : 0;
    const setTeam = (pl, t) => {
      pl.team = t;
      for (const b of state.buildings) { if (b.owner === pl.id) b.team = t; }
      for (const u of state.units) { if (u.owner === pl.id) u.team = t; }
    };
    // En 2v2, les alliés gardent leurs bases côte à côte : on échange la base avec un joueur
    // de l'autre équipe (un bot de préférence), ou on s'installe sur une place libre de ce flanc.
    const others = state.players.filter((q) => q.team === toTeam && !q.dead && q.id !== target.id);
    let partner = null;
    if (state.is2v2 && others.length >= 2) {
      partner = others.find((q) => q.bot) || others[0];
    }
    if (state.is2v2 && TEAM_SPAWNS) {
      if (partner) {
        swapPlayerBases(state, target, partner);
        setTeam(partner, fromTeam);
      } else {
        const taken = state.players.filter((q) => q.id !== target.id).map((q) => `${q.spawnX},${q.spawnY}`);
        const free = TEAM_SPAWNS[toTeam].find((sp) => !taken.includes(`${sp.x},${sp.y}`));
        if (free) moveEntitiesBetweenSpawns(state, target, free);
      }
    }
    setTeam(target, toTeam);
    fxEvents.push({ k: 'TEAM_CHANGE', playerId: target.id, team: target.team, name: target.name, partnerId: partner ? partner.id : null });
    if (partner) fxEvents.push({ k: 'TEAM_CHANGE', playerId: partner.id, team: partner.team, name: partner.name, silent: true });
    return { ok: true };
  }

  // 5. ANNULER UNE UNITÉ OU AMÉLIORATION DE LA FILE DE PRODUCTION
  if (cmd.op === 'CANCEL_QUEUE') {
    const bld = state.buildings.find((b) => b.owner === p.id && b.id === cmd.bldId);
    if (!bld || !Array.isArray(bld.queue) || !bld.queue.length) return { ok: false };
    const idx = clamp(Number(cmd.slot) || 0, 0, bld.queue.length - 1);
    const itemKey = bld.queue.splice(idx, 1)[0];
    const itemDef = UNITS[itemKey] || UPGRADES[itemKey];
    if (itemDef) {
      p.minerals += itemDef.min;
      p.gas += itemDef.gas;
    }
    if (idx === 0) {
      if (bld.queue.length > 0) {
        const nextDef = UNITS[bld.queue[0]] || UPGRADES[bld.queue[0]];
        const nextTime = nextDef.trainTime ?? nextDef.time ?? 8;
        bld.qTotal = state.blitz ? nextTime * 0.65 : nextTime;
        bld.qTimer = bld.qTotal;
      } else {
        bld.qTimer = 0;
        bld.qTotal = 0;
      }
    }
    return { ok: true };
  }

  // 4. ORDRES D'UNITÉS : MOVE, AMOVE, STOP, HOLD, HARVEST, REPAIR, RALLY
  if (cmd.op === 'UNIT_ORDER') {
    const mode = String(cmd.mode || 'amove');
    const x = clamp(Math.round(Number(cmd.x) || HALF_W), 35, WORLD_SIZE - 35);
    const y = clamp(Math.round(Number(cmd.y) || HALF_W), 35, WORLD_SIZE - 35);
    const ids = Array.isArray(cmd.unitIds) ? new Set(cmd.unitIds) : new Set();

    if (Array.isArray(cmd.bldIds) && cmd.bldIds.length) {
      for (const b of state.buildings) {
        if (b.owner === p.id && cmd.bldIds.includes(b.id)) {
          b.rallyX = x;
          b.rallyY = y;
        }
      }
    }

    const mySelected = state.units.filter((u) => u.owner === p.id && ids.has(u.id) && !u.boardedIn);
    const count = mySelected.length;
    const cols = Math.max(1, Math.ceil(Math.sqrt(count)));

    mySelected.forEach((u, idx) => {
      if (mode === 'stop') {
        u.mode = 'idle'; u.orderX = null; u.orderY = null; u.targetEntId = null; u.buildTargetId = null; u.onSite = false;
        return;
      }
      if (mode === 'hold') {
        u.mode = 'hold'; u.orderX = null; u.orderY = null; u.targetEntId = null; u.buildTargetId = null; u.onSite = false;
        return;
      }
      if (mode === 'harvest_min' && u.kind === 'scv') {
        u.mode = 'harvest_min';
        u.harvestId = cmd.resId || (nearestMineral(x, y)?.id ?? null);
        u.buildTargetId = null;
        u.onSite = false;
        return;
      }
      if (mode === 'harvest_gas' && u.kind === 'scv') {
        u.mode = 'harvest_gas';
        u.harvestId = cmd.resId || null;
        u.buildTargetId = null;
        u.onSite = false;
        return;
      }
      if (mode === 'build' && u.kind === 'scv' && cmd.targetId) {
        u.mode = 'build';
        u.buildTargetId = cmd.targetId;
        u.onSite = false;
        u.weldTimer = 0;
        const tb = state.buildings.find((b) => b.id === cmd.targetId);
        if (tb) { u.orderX = tb.x; u.orderY = tb.y; u.weldX = tb.x; u.weldY = tb.y; }
        return;
      }

      const row = Math.floor(idx / cols), col = idx % cols;
      const spacing = u.radius * 2.5 + 6;
      const fx = clamp(x + (col - (cols - 1) / 2) * spacing, 30, WORLD_SIZE - 30);
      const fy = clamp(y + (row - (Math.ceil(count / cols) - 1) / 2) * spacing, 30, WORLD_SIZE - 30);

      u.buildTargetId = null;
      u.onSite = false;
      if (mode === 'focus' && cmd.targetId) {
        u.mode = 'focus'; u.targetEntId = cmd.targetId; u.orderX = x; u.orderY = y;
      } else if (mode === 'move') {
        u.mode = 'move'; u.targetEntId = null; u.orderX = fx; u.orderY = fy; u.pathX = x; u.pathY = y;
      } else {
        u.mode = 'amove'; u.targetEntId = null; u.orderX = fx; u.orderY = fy; u.pathX = x; u.pathY = y;
      }
    });
    return { ok: true };
  }

  // 5. CAPACITÉ MICRO : STIMPACK (T)
  if (cmd.op === 'STIM') {
    const ids = new Set(Array.isArray(cmd.unitIds) ? cmd.unitIds : []);
    let count = 0;
    for (const u of state.units) {
      if (u.owner === p.id && ids.has(u.id) && UNITS[u.kind]?.canStim && u.hp > 20) {
        u.hp = Math.max(10, u.hp - 18);
        u.stimT = 8.0;
        count++;
        fxEvents.push({ k: 'STIM', x: u.x, y: u.y, color: '#ff4b2b' });
      }
    }
    return count > 0 ? { ok: true } : { ok: false, reason: 'Aucun Marine ou Maraudeur en état d’utiliser Stimpack.' };
  }

  // 6. CAPACITÉ MICRO : MODE SIÈGE (E)
  if (cmd.op === 'SIEGE') {
    const ids = new Set(Array.isArray(cmd.unitIds) ? cmd.unitIds : []);
    let count = 0;
    for (const u of state.units) {
      if (u.owner === p.id && ids.has(u.id) && UNITS[u.kind]?.canSiege) {
        u.sieged = !u.sieged;
        u.cd = Math.max(u.cd, 1.0);
        count++;
        fxEvents.push({ k: 'SIEGE', x: u.x, y: u.y, sieged: u.sieged });
      }
    }
    return count > 0 ? { ok: true } : { ok: false, reason: 'Sélectionne un Char de Siège.' };
  }

  // 7. CAPACITÉ COMSAT DU QG : SCAN RADAR (C - 50 Minéraux)
  if (cmd.op === 'SCAN') {
    if (p.minerals < 50) return { ok: false, reason: '50💎 requis pour lancer un Scan Radar.' };
    p.minerals -= 50;
    const x = clamp(Math.round(Number(cmd.x) || HALF_W), 60, WORLD_SIZE - 60);
    const y = clamp(Math.round(Number(cmd.y) || HALF_W), 60, WORLD_SIZE - 60);
    const mapDef = MAP_DEFS[state.map] || MAP_DEFS.vallee;
    const scanR = Math.round(380 * (mapDef.scanRadiusMult || 1.0));
    state.scans.push({ x, y, team: p.team, r: scanR, timer: 10.0 });
    fxEvents.push({ k: 'SCAN', x, y, color: '#1fc7c1', r: scanR });
    return { ok: true };
  }

  // 8. CAPACITÉ TACTIQUE : EMBARQUER DANS UNE NAVETTE DE TRANSPORT
  if (cmd.op === 'BOARD') {
    const dropship = state.units.find((x) => x.id === cmd.targetId && x.kind === 'dropship' && Number(x.owner) === Number(p.id) && x.hp > 0);
    if (!dropship) return { ok: false, reason: 'Navette de transport introuvable.' };
    const ids = new Set(Array.isArray(cmd.unitIds) ? cmd.unitIds : []);
    let count = 0;
    for (const u of state.units) {
      if (u.owner === p.id && ids.has(u.id) && !u.flying && !u.boardedIn && u.hp > 0) {
        u.mode = 'board';
        u.targetEntId = dropship.id;
        u.orderX = dropship.x;
        u.orderY = dropship.y;
        count++;
      }
    }
    return count > 0 ? { ok: true } : { ok: false, reason: 'Aucune troupe terrestre valide à embarquer.' };
  }

  // 9. CAPACITÉ TACTIQUE : DÉBARQUER TOUTES LES TROUPES (V)
  if (cmd.op === 'UNLOAD') {
    const dropship = state.units.find((x) => x.id === cmd.dropshipId && x.kind === 'dropship' && Number(x.owner) === Number(p.id) && x.hp > 0);
    if (!dropship) return { ok: false };
    if (!Array.isArray(dropship.cargo) || dropship.cargo.length === 0) {
      return { ok: false, reason: 'La navette est vide.' };
    }
    const passengers = dropship.cargo.slice();
    dropship.cargo = [];
    const n = passengers.length;
    for (let i = 0; i < n; i++) {
      const pId = passengers[i];
      const pass = state.units.find((x) => x.id === pId);
      if (pass) {
        pass.boardedIn = null;
        pass.mode = 'idle';
        const ang = (i / n) * TAU;
        const dist = dropship.radius + pass.radius + 14;
        let dropX = clamp(dropship.x + Math.cos(ang) * dist, 30, WORLD_SIZE - 30);
        let dropY = clamp(dropship.y + Math.sin(ang) * dist, 30, WORLD_SIZE - 30);
        if (isBlockedAt(dropX, dropY)) {
          const l = nearestLand(dropX, dropY);
          dropX = l.x; dropY = l.y;
        }
        pass.x = dropX;
        pass.y = dropY;
        pass.vx = 0; pass.vy = 0;
        pass.orderX = null; pass.orderY = null;
        fxEvents.push({ k: 'UNLOAD', x: dropX, y: dropY, kind: pass.kind });
      }
    }
    return { ok: true };
  }

  return { ok: false };
}

/* ============================================================================
   SIMULATION DU MONDE TEMPS RÉEL (20 HZ)
   ============================================================================ */
function finishBuildingConstruction(state, b, owner, fxEvents) {
  b.constructing = false;
  b.buildStarted = true;
  b.buildProg = 1;
  b.hp = b.maxHp;
  fxEvents.push({ k: 'COMPLETE', x: b.x, y: b.y, color: owner ? owner.color : '#ffc531', kind: b.kind, owner: b.owner });
  for (const u of state.units) {
    if (u.kind === 'scv' && u.buildTargetId === b.id) {
      // Le VCS sort proprement du périmètre du bâtiment achevé
      const ang = Math.atan2(u.y - b.y, u.x - b.x) || 0.6;
      const outDist = b.radius + u.radius + 6;
      u.x = clamp(b.x + Math.cos(ang) * outDist, 26, WORLD_SIZE - 26);
      u.y = clamp(b.y + Math.sin(ang) * outDist, 26, WORLD_SIZE - 26);
      u.onSite = false;
      u.buildTargetId = null;
      if (b.kind === 'extractor') {
        u.mode = 'harvest_gas';
        u.harvestId = b.id;
      } else {
        u.mode = 'harvest_min';
        u.harvestId = nearestMineral(u.x, u.y, 500)?.id ?? null;
      }
    }
  }
}

function applyUpgrade(state, owner, upgId, fxEvents) {
  const upgDef = UPGRADES[upgId];
  if (!upgDef) return;
  owner.upgrades = owner.upgrades || {};
  owner.upgrades[upgId] = true;
  fxEvents.push({ k: 'UPGRADE_DONE', ownerId: owner.id, upgId, name: upgDef.name });

  if (upgDef.hpMult) {
    const mult = upgDef.hpMult;
    for (const u of state.units) {
      if (u.owner === owner.id && upgDef.appliesTo.includes(u.kind)) {
        const baseDef = UNITS[u.kind];
        if (baseDef) {
          u.maxHp = Math.round(baseDef.hp * mult);
          u.hp = Math.min(u.maxHp, Math.round(u.hp * mult));
        }
      }
    }
  }
}

/* ---------- Limite de VCS par gisement (2 par cristal, 3 par Raffinerie) ---------- */
const MAX_SCV_PER_MINERAL = 2;
const MAX_SCV_PER_GAS = 3;

function nearestFreeMineral(owner, x, y, counts, maxDist = 560) {
  let best = null, bestD2 = maxDist * maxDist;
  for (const m of MINERAL_NODES) {
    if ((counts.get(owner + ':' + m.id) || 0) >= MAX_SCV_PER_MINERAL) continue;
    const d2 = dist2(x, y, m.x, m.y);
    if (d2 < bestD2) { bestD2 = d2; best = m; }
  }
  return best;
}

function enforceHarvestCaps(st, fxEvents) {
  const counts = new Map();
  const overflow = [];
  for (const u of st.units) {
    if (u.kind !== 'scv' || u.hp <= 0 || u.boardedIn) continue;
    let key = null, cap = 0;
    if (u.mode === 'harvest_min' && u.harvestId) { key = u.owner + ':' + u.harvestId; cap = MAX_SCV_PER_MINERAL; }
    else if (u.mode === 'harvest_gas' && u.harvestId) { key = u.owner + ':' + u.harvestId; cap = MAX_SCV_PER_GAS; }
    else if (u.mode === 'harvest_min') { overflow.push(u); continue; }
    if (!key) continue;
    const c = counts.get(key) || 0;
    if (c >= cap) overflow.push(u);
    else counts.set(key, c + 1);
  }
  for (const u of overflow) {
    const from = u.mode === 'harvest_gas'
      ? st.buildings.find((b) => b.id === u.harvestId) || u
      : MINERAL_NODES.find((m) => m.id === u.harvestId) || u;
    const m = nearestFreeMineral(u.owner, from.x, from.y, counts);
    if (m) {
      u.mode = 'harvest_min';
      u.harvestId = m.id;
      const key = u.owner + ':' + m.id;
      counts.set(key, (counts.get(key) || 0) + 1);
    } else {
      // Tous les gisements proches sont saturés : le VCS attend près de son QG
      u.mode = 'idle';
      u.harvestId = null;
      u.orderX = null;
      u.orderY = null;
      if (u.carryAmt > 0) {
        const owner = st.players.find((p) => p.id === u.owner);
        if (owner) {
          if (u.carryType === 'gas') owner.gas = Math.min(9999, owner.gas + u.carryAmt);
          else owner.minerals = Math.min(9999, owner.minerals + u.carryAmt);
        }
        u.carryAmt = 0; u.carryType = null;
      }
      fxEvents.push({ k: 'SATURATED', owner: u.owner, x: u.x, y: u.y });
    }
  }
  st.harvestCounts = counts;
}

function stepWorld(state, dt, fxEvents) {
  if (state.over) return;
  state.time += dt;
  flowBuildsLeft = FLOW_BUILDS_PER_TICK;
  syncPathBuildings(state);
  refreshSimVision(state);
  enforceHarvestCaps(state, fxEvents);

  const t = state.time;
  const p2At = state.blitz ? 120 : 210;
  const p3At = state.blitz ? 360 : 720;
  const sdAt = state.blitz ? 600 : 1350;
  const newPhase = t >= sdAt ? 4 : t >= p3At ? 3 : t >= p2At ? 2 : 1;
  if (newPhase !== state.phase) {
    state.phase = newPhase;
    fxEvents.push({ k: 'PHASE', phase: newPhase });
  }
  state.dmgMult = state.phase === 4 ? 1.85 : state.phase === 3 ? 1.2 : 1.0;

  if (state.phase === 4) {
    state.stormRadius = Math.max(380, state.stormRadius - (state.blitz ? 16 : 9) * dt);
  }

  for (let i = state.scans.length - 1; i >= 0; i--) {
    state.scans[i].timer -= dt;
    if (state.scans[i].timer <= 0) state.scans.splice(i, 1);
  }

  for (const p of state.players) {
    if (p.dead) continue;
    p.minerals = Math.min(9999, p.minerals + 1.25 * dt); // Réduit de 50% (auparavant 2.5)
    const myRefs = state.buildings.filter((b) => b.owner === p.id && b.kind === 'extractor' && b.hp > 0 && !b.constructing).length;
    if (myRefs > 0) p.gas = Math.min(9999, p.gas + myRefs * 1.1 * dt); // Réduit de 50% (auparavant 2.2)
  }

  for (const b of state.buildings) {
    if (b.hp <= 0) continue;
    const owner = state.players.find((p) => p.id === b.owner);
    if (!owner || owner.dead) { b.hp = 0; continue; }
    const def = BUILDINGS[b.kind];

    if (state.phase === 4 && hypot(b.x, b.y, HALF_W, HALF_W) > state.stormRadius) {
      b.hp -= 35 * dt;
    }

    // Important : Un chantier en construction NE PROGRESSE PAS tout seul !
    // Il exige qu'un Ouvrier VCS soit physiquement SUR l'emplacement de construction.
    if (b.constructing) {
      if (b.buildProg >= 1) {
        finishBuildingConstruction(state, b, owner, fxEvents);
      }
      continue;
    }

    if (def.heal) {
      const r2 = def.range * def.range;
      for (const u of state.units) {
        if (u.team === b.team && u.hp < u.maxHp && dist2(b.x, b.y, u.x, u.y) <= r2) {
          u.hp = Math.min(u.maxHp, u.hp + def.heal * dt);
        }
      }
    }

    if (Array.isArray(b.queue) && b.queue.length > 0) {
      b.qTimer -= dt;
      if (b.qTimer <= 0) {
        const item = b.queue.shift();
        if (UPGRADES[item]) {
          applyUpgrade(state, owner, item, fxEvents);
        } else {
          spawnTrainedUnit(state, owner, b, item, fxEvents);
        }
        if (b.queue.length > 0) {
          const nextDef = UNITS[b.queue[0]] || UPGRADES[b.queue[0]];
          const nextTime = nextDef.trainTime ?? nextDef.time ?? 8;
          b.qTotal = state.blitz ? nextTime * 0.65 : nextTime;
          b.qTimer = b.qTotal;
        } else {
          b.qTimer = 0;
          b.qTotal = 0;
        }
      }
    }

    if (def.range > 0 && def.dmg > 0) {
      b.cd = Math.max(0, (b.cd || 0) - dt);
      if (b.cd <= 0) {
        let target = null, bestD2 = def.range * def.range;
        for (const u of state.units) {
          if (u.team !== b.team && u.hp > 0 && !u.boardedIn && canStrike(b, u)) {
            const d2 = dist2(b.x, b.y, u.x, u.y);
            if (d2 <= bestD2) { bestD2 = d2; target = u; }
          }
        }
        if (target) {
          b.cd = def.rate;
          b.aimA = Math.atan2(target.y - b.y, target.x - b.x);
          const dmg = def.dmg * state.dmgMult;
          target.hp -= dmg;
          if (def.splash) {
            const mapDef = MAP_DEFS[state.map] || MAP_DEFS.vallee;
            const splashR = def.splash * (mapDef.splashMult || 1.0);
            const s2 = splashR * splashR;
            for (const u2 of state.units) {
              if (u2 !== target && u2.team !== b.team && dist2(target.x, target.y, u2.x, u2.y) <= s2) {
                u2.hp -= dmg * 0.6;
              }
            }
          }
          fxEvents.push({
            k: b.kind === 'tesla' ? 'TESLA' : 'SHOT',
            x1: b.x, y1: b.y - 16, x2: target.x, y2: target.y, color: owner.color,
          });
        }
      }
    }
  }

  for (const u of state.units) {
    if (u.hp <= 0) continue;
    const def = UNITS[u.kind];
    const owner = state.players.find((p) => p.id === u.owner);
    if (!owner || owner.dead) { u.hp = 0; continue; }

    // Unités embarquées dans une navette de transport : suivent la navette et sont inactives
    if (u.boardedIn) {
      const dShip = state.units.find((d) => d.id === u.boardedIn && d.hp > 0);
      if (dShip) {
        u.x = dShip.x;
        u.y = dShip.y;
        u.vx = 0;
        u.vy = 0;
        continue;
      } else {
        u.boardedIn = null;
        u.mode = 'idle';
      }
    }

    // Troupes en train de rejoindre une navette pour embarquer
    if (u.mode === 'board' && u.targetEntId) {
      const dropship = state.units.find((x) => x.id === u.targetEntId && x.kind === 'dropship' && x.hp > 0);
      if (!dropship) {
        u.mode = 'idle';
        u.targetEntId = null;
      } else {
        dropship.cargo = dropship.cargo || [];
        const d = hypot(u.x, u.y, dropship.x, dropship.y);
        if (d <= dropship.radius + u.radius + 24) {
          if (dropship.cargo.length < (dropship.maxCargo || 4)) {
            dropship.cargo.push(u.id);
            u.boardedIn = dropship.id;
            u.mode = 'boarded';
            u.targetEntId = null;
            u.orderX = null;
            u.orderY = null;
            fxEvents.push({ k: 'BOARD', x: dropship.x, y: dropship.y, kind: u.kind });
            continue;
          } else {
            u.mode = 'idle';
            u.targetEntId = null;
          }
        } else {
          u.orderX = dropship.x;
          u.orderY = dropship.y;
        }
      }
    }

    // Navette Médicale : soin nanite automatique en continu des unités alliées au sol
    if (u.kind === 'medivac' && u.hp > 0) {
      let bestWounded = null, bestWoundDist = 190 * 190;
      for (const ally of state.units) {
        if (ally.team === u.team && ally.hp > 0 && ally.hp < ally.maxHp && !ally.flying && !ally.boardedIn) {
          const d2 = dist2(u.x, u.y, ally.x, ally.y);
          if (d2 <= bestWoundDist) {
            bestWoundDist = d2;
            bestWounded = ally;
          }
        }
      }
      if (bestWounded) {
        u.healingTargetId = bestWounded.id;
        bestWounded.hp = Math.min(bestWounded.maxHp, bestWounded.hp + (def.healRate || 24) * dt);
        u.a = Math.atan2(bestWounded.y - u.y, bestWounded.x - u.x);
        if (Math.random() < 0.28) {
          fxEvents.push({ k: 'HEAL_RAY', x1: u.x, y1: u.y, x2: bestWounded.x, y2: bestWounded.y });
        }
      } else {
        u.healingTargetId = null;
      }
    }

    if (u.stimT > 0) u.stimT = Math.max(0, u.stimT - dt);
    const stimMult = u.stimT > 0 ? 1.48 : 1.0;
    u.cd = Math.max(0, u.cd - dt * stimMult);

    if (u.kind === 'scv') {
      if (u.mode === 'build' && u.buildTargetId) {
        const bld = state.buildings.find((b) => b.id === u.buildTargetId && b.hp > 0);
        if (!bld) {
          u.mode = 'harvest_min';
          u.buildTargetId = null;
          u.onSite = false;
          const m = nearestMineral(u.x, u.y, 400);
          u.harvestId = m ? m.id : null;
        } else if (bld.constructing) {
          // CONSTRUCTION FAÇON STARCRAFT : Le VCS doit être PHYSIQUEMENT SUR l'endroit de construction !
          const distCenter = hypot(u.x, u.y, bld.x, bld.y);
          const siteRadius = Math.max(16, bld.radius * 0.72);
          if (distCenter <= siteRadius || u.onSite) {
            u.onSite = true;
            bld.buildStarted = true;

            // Le VCS se déplace d'un point de soudure à l'autre SUR la dalle du chantier
            u.weldTimer = (u.weldTimer || 0) - dt;
            if (u.weldTimer <= 0 || u.weldX == null || u.weldY == null) {
              u.weldTimer = 1.0 + Math.random() * 0.75;
              const wAng = Math.random() * TAU;
              const wR = bld.radius * (0.16 + Math.random() * 0.36);
              u.weldX = bld.x + Math.cos(wAng) * wR;
              u.weldY = bld.y + Math.sin(wAng) * wR;
            }
            const wx = u.weldX - u.x, wy = u.weldY - u.y;
            const wd = Math.hypot(wx, wy);
            if (wd > 3) {
              const mapDef = MAP_DEFS[state.map] || MAP_DEFS.vallee;
              const moveMult = mapDef.moveSpeedMult || 1.0;
              const stepSpd = Math.min(wd, def.speed * moveMult * 0.55 * dt);
              u.vx = (wx / wd) * (def.speed * moveMult * 0.55);
              u.vy = (wy / wd) * (def.speed * moveMult * 0.55);
              u.x += (wx / wd) * stepSpd;
              u.y += (wy / wd) * stepSpd;
            } else {
              u.vx = 0; u.vy = 0;
            }
            // Oriente le chalumeau du VCS vers le cœur de la structure sur le chantier
            u.a = Math.atan2(bld.y - u.y, bld.x - u.x);

            const step = (1.0 / (bld.buildTime || 8)) * dt;
            bld.buildProg += step;
            bld.hp = Math.min(bld.maxHp, bld.hp + bld.maxHp * 0.85 * step);
            if (Math.random() < 0.48) {
              fxEvents.push({ k: 'SPARK', x: u.x + Math.cos(u.a) * 14, y: u.y + Math.sin(u.a) * 14, color: '#ffc531' });
            }
            if (bld.buildProg >= 1) {
              finishBuildingConstruction(state, bld, owner, fxEvents);
            }
            continue;
          } else {
            // En route vers le centre du chantier de construction
            u.orderX = bld.x;
            u.orderY = bld.y;
          }
        } else {
          // Réparation d'un bâtiment déjà construit
          u.onSite = false;
          const d = hypot(u.x, u.y, bld.x, bld.y) - bld.radius - u.radius;
          if (d <= 18) {
            u.a = Math.atan2(bld.y - u.y, bld.x - u.x);
            u.vx = 0; u.vy = 0;
            if (bld.hp < bld.maxHp && owner.minerals >= 1) {
              bld.hp = Math.min(bld.maxHp, bld.hp + 45 * dt);
              owner.minerals = Math.max(0, owner.minerals - 3 * dt);
              if (Math.random() < 0.35) fxEvents.push({ k: 'SPARK', x: u.x + Math.cos(u.a) * 14, y: u.y + Math.sin(u.a) * 14, color: '#ffc531' });
            } else {
              u.mode = bld.kind === 'extractor' ? 'harvest_gas' : 'harvest_min';
              u.harvestId = bld.kind === 'extractor' ? bld.id : (nearestMineral(u.x, u.y, 500)?.id ?? null);
              u.buildTargetId = null;
            }
            continue;
          } else {
            u.orderX = bld.x;
            u.orderY = bld.y;
          }
        }
      }

      if (u.mode === 'harvest_min' || u.mode === 'harvest_gas') {
        u.onSite = false;
        const hq = nearestMyHq(state, u.owner, u.x, u.y);
        if (u.carryAmt > 0 && hq) {
          const dHq = hypot(u.x, u.y, hq.x, hq.y) - hq.radius - u.radius;
          if (dHq <= 18) {
            if (u.carryType === 'gas') owner.gas = Math.min(9999, owner.gas + u.carryAmt);
            else owner.minerals = Math.min(9999, owner.minerals + u.carryAmt);
            owner.score += 2;
            u.carryAmt = 0;
            u.carryType = null;
            continue;
          } else {
            u.orderX = hq.x;
            u.orderY = hq.y;
          }
        } else if (u.mode === 'harvest_min') {
          let mNode = MINERAL_NODES.find((m) => m.id === u.harvestId) || nearestMineral(u.x, u.y);
          if (mNode) {
            u.harvestId = mNode.id;
            const dM = hypot(u.x, u.y, mNode.x, mNode.y) - 22 - u.radius;
            if (dM <= 16) {
              u.a = Math.atan2(mNode.y - u.y, mNode.x - u.x);
              u.vx = 0; u.vy = 0;
              u.gatherT = (u.gatherT || 0) + dt;
              if (Math.random() < 0.25) fxEvents.push({ k: 'MINE', x: mNode.x, y: mNode.y, color: mNode.rich ? '#ffc531' : '#1fc7c1' });
              const mapDef = MAP_DEFS[state.map] || MAP_DEFS.vallee;
              if (u.gatherT >= (mapDef.mineHarvestTime || 1.55)) {
                u.gatherT = 0;
                u.carryType = mNode.rich ? 'gold' : 'min';
                u.carryAmt = mNode.rich ? 6 : 4; // Réduit de 50% (auparavant 12 / 8)
              }
              continue;
            } else {
              u.orderX = mNode.x;
              u.orderY = mNode.y;
            }
          }
        } else if (u.mode === 'harvest_gas') {
          const ref = state.buildings.find((b) => b.id === u.harvestId && b.owner === u.owner && b.kind === 'extractor' && b.hp > 0 && !b.constructing)
            || state.buildings.find((b) => b.owner === u.owner && b.kind === 'extractor' && b.hp > 0 && !b.constructing);
          if (ref) {
            u.harvestId = ref.id;
            const dR = hypot(u.x, u.y, ref.x, ref.y) - ref.radius - u.radius;
            if (dR <= 16) {
              u.a = Math.atan2(ref.y - u.y, ref.x - u.x);
              u.vx = 0; u.vy = 0;
              u.gatherT = (u.gatherT || 0) + dt;
              const mapDef = MAP_DEFS[state.map] || MAP_DEFS.vallee;
              if (u.gatherT >= 1.7) {
                u.gatherT = 0;
                u.carryType = 'gas';
                u.carryAmt = Math.max(1, Math.round(3 * (mapDef.gasHarvestMult || 1.0))); // Réduit de 50% (auparavant 6)
              }
              continue;
            } else {
              u.orderX = ref.x;
              u.orderY = ref.y;
            }
          } else {
            u.mode = 'harvest_min';
          }
        }
      }
    }

    const effRange = u.sieged && def.siegeRange ? def.siegeRange : def.range;
    const effDmg = u.sieged && def.siegeDmg ? def.siegeDmg : def.dmg;
    const effRate = u.sieged && def.siegeRate ? def.siegeRate : def.rate;

    let bestTarget = null, bestScore = Infinity;
    if (u.mode !== 'move' && u.mode !== 'harvest_min' && u.mode !== 'harvest_gas' && u.mode !== 'build') {
      const aggroR = u.sieged || u.mode === 'hold' ? effRange : Math.max(255, effRange + 65);

      if (u.mode === 'focus' && u.targetEntId) {
        const fUnit = state.units.find((e) => e.id === u.targetEntId && e.hp > 0);
        const fBld = fUnit ? null : state.buildings.find((b) => b.id === u.targetEntId && b.hp > 0);
        const ent = fUnit || fBld;
        if (ent && ent.team !== u.team) {
          const d = hypot(u.x, u.y, ent.x, ent.y) - ent.radius;
          bestTarget = { ent, isBld: !!fBld, dist: d, blind: !canStrike(u, ent) };
        } else {
          u.mode = 'amove';
          u.targetEntId = null;
        }
      }

      if (!bestTarget && def.dmg > 0) {
        for (const e of state.units) {
          if (e.team === u.team || e.hp <= 0 || e.boardedIn) continue;
          if (e.flying && (u.kind === 'scv' || u.kind === 'siege' || u.kind === 'sapper')) continue;
          const d = hypot(u.x, u.y, e.x, e.y) - e.radius;
          if (d <= aggroR && canStrike(u, e)) {
            const prio = e.kind === 'scv' ? 35 : 0;
            if (d + prio < bestScore) { bestScore = d + prio; bestTarget = { ent: e, isBld: false, dist: d }; }
          }
        }
        for (const b of state.buildings) {
          if (b.team === u.team || b.hp <= 0) continue;
          const d = hypot(u.x, u.y, b.x, b.y) - b.radius;
          if (d <= aggroR + 30 && canStrike(u, b)) {
            const prio = b.kind === 'wall' ? (u.kind === 'sapper' ? -20 : 60) : (u.kind === 'sapper' ? -45 : 20);
            if (d + prio < bestScore) { bestScore = d + prio; bestTarget = { ent: b, isBld: true, dist: d }; }
          }
        }
      }
    }

    if (bestTarget && bestTarget.dist <= effRange && !bestTarget.blind) {
      const tgt = bestTarget.ent;
      u.a = Math.atan2(tgt.y - u.y, tgt.x - u.x);
      u.vx *= 0.4;
      u.vy *= 0.4;
      if (u.cd <= 0) {
        u.cd = effRate;
        let dmg = effDmg * state.dmgMult;
        if (owner?.upgrades) {
          if (['marine', 'rocket', 'sapper'].includes(u.kind) && owner.upgrades.infantry_weapons) dmg *= 1.25;
          if (['tank', 'siege', 'titan'].includes(u.kind) && owner.upgrades.vehicle_weapons) dmg *= 1.25;
        }
        if (bestTarget.isBld) dmg *= def.bldMult || 1;
        else if (u.kind === 'rocket' && UNITS[tgt.kind]?.mech) dmg *= 1.5;
        tgt.hp -= dmg;
        if (def.splash || u.sieged) {
          const mapDef = MAP_DEFS[state.map] || MAP_DEFS.vallee;
          const splashR = (def.splash || 58) * (mapDef.splashMult || 1.0);
          const s2 = splashR * splashR;
          for (const e2 of state.units) {
            if (e2 !== tgt && e2.team !== u.team && dist2(tgt.x, tgt.y, e2.x, e2.y) <= s2) e2.hp -= dmg * 0.55;
          }
        }
        owner.score += Math.round(dmg * 0.12);
        fxEvents.push({
          k: u.sieged || u.kind === 'siege' || u.kind === 'titan' ? 'PLASMA' : u.kind === 'rocket' ? 'ROCKET' : 'SHOT',
          x1: u.x, y1: u.y, x2: tgt.x, y2: tgt.y, color: owner.color,
        });
      }
      continue;
    }

    if (u.sieged || u.mode === 'hold') {
      u.vx = 0; u.vy = 0;
      continue;
    }

    let goalX = u.orderX, goalY = u.orderY;
    if (bestTarget && u.mode !== 'move') {
      goalX = bestTarget.ent.x;
      goalY = bestTarget.ent.y;
    }
    if (goalX == null || goalY == null) continue;
    // Point d'arrivée sur un bâtiment (ralliement mal placé) : arrivé dès qu'on le touche, sinon l'unité pousse indéfiniment
    const arriveR = pathBlocked[pathCellOf(goalX, goalY)] ? 18 + u.radius + 40 : 18;
    if (u.mode !== 'build' && dist2(u.x, u.y, goalX, goalY) <= arriveR * arriveR) {
      if (u.mode === 'move' || u.mode === 'amove') {
        u.orderX = null;
        u.orderY = null;
        u.mode = 'idle';
      }
      u.vx = 0; u.vy = 0;
      continue;
    }

    // Déplacement des unités aériennes (Navette de Transport, Navette Médicale) : vol direct sans collisions terrestres
    if (u.flying) {
      const dx = goalX - u.x, dy = goalY - u.y;
      const distGoal = Math.hypot(dx, dy) || 1;
      let steerX = dx / distGoal, steerY = dy / distGoal;
      for (const o of state.units) {
        if (o === u || o.hp <= 0 || !o.flying || o.boardedIn) continue;
        const sx = u.x - o.x, sy = u.y - o.y;
        const minSep = u.radius + o.radius + 6;
        const d2 = sx * sx + sy * sy;
        if (d2 > 0 && d2 < minSep * minSep) {
          const d = Math.sqrt(d2);
          const f = (minSep - d) / minSep;
          steerX += (sx / d) * f * 1.35;
          steerY += (sy / d) * f * 1.35;
        }
      }
      const sLen = Math.hypot(steerX, steerY) || 1;
      const mapDef = MAP_DEFS[state.map] || MAP_DEFS.vallee;
      let upgSpdMult = 1.0;
      if (owner?.upgrades?.advanced_thrusters) upgSpdMult = 1.18;
      const spd = def.speed * (mapDef.moveSpeedMult || 1.0) * upgSpdMult;
      u.vx = (steerX / sLen) * spd;
      u.vy = (steerY / sLen) * spd;
      u.x = clamp(u.x + u.vx * dt, 24, WORLD_SIZE - 24);
      u.y = clamp(u.y + u.vy * dt, 24, WORLD_SIZE - 24);
      u.a = Math.atan2(u.vy || dy, u.vx || dx);
      continue;
    }

    // Le champ de flux vise le point cliqué commun à tout l'ordre, pas la place de chaque unité dans la formation
    const shared = !bestTarget && (u.mode === 'move' || u.mode === 'amove') && u.pathX != null;
    const wp = routeWaypoint(u, goalX, goalY, shared ? u.pathX : goalX, shared ? u.pathY : goalY, state.time);
    const steerTargetX = wp ? wp.x : goalX;
    const steerTargetY = wp ? wp.y : goalY;

    const dx = steerTargetX - u.x, dy = steerTargetY - u.y;
    const distGoal = Math.hypot(dx, dy) || 1;
    let steerX = dx / distGoal, steerY = dy / distGoal;

    const isScv = u.kind === 'scv';
    const lookAhead = isScv ? 14 : (u.radius + 32);
    const sideSign = (u.id % 2 === 0) ? 1 : -1;
    for (const b of state.buildings) {
      if (b.hp <= 0 || b.id === u.buildTargetId || b.id === u.harvestId) continue;
      if (b.constructing && !b.buildStarted) continue;
      if (isScv && u.carryAmt > 0 && b.owner === u.owner && b.kind === 'hq') continue;
      const ox = b.x - u.x, oy = b.y - u.y;
      const d = Math.hypot(ox, oy) || 1;
      const minClear = u.radius + b.radius + (isScv ? 2 : 10);
      if (d < minClear + lookAhead) {
        const dot = (ox / d) * steerX + (oy / d) * steerY;
        if (dot > -0.2) {
          // Contourne par le côté qui mène à l'objectif (un côté fixe faisait tourner l'unité en rond)
          const side = Math.sign(ox * steerY - oy * steerX) || sideSign;
          const tx = -oy / d * side, ty = ox / d * side;
          const push = ((minClear + lookAhead - d) / lookAhead) * (isScv ? 1.2 : 1.8);
          steerX += (tx - ox / d * (isScv ? 0.2 : 0.5)) * push;
          steerY += (ty - oy / d * (isScv ? 0.2 : 0.5)) * push;
        }
      }
    }
    for (const rk of ROCKS) {
      const ox = rk.x - u.x, oy = rk.y - u.y;
      const d = Math.hypot(ox, oy) || 1;
      const minClear = u.radius + rk.r + (isScv ? 2 : 10);
      if (d < minClear + lookAhead) {
        const side = Math.sign(ox * steerY - oy * steerX) || sideSign;
        const tx = -oy / d * side, ty = ox / d * side;
        const push = ((minClear + lookAhead - d) / lookAhead) * 1.9;
        steerX += (tx - ox / d * 0.5) * push;
        steerY += (ty - oy / d * 0.5) * push;
      }
    }
    for (const o of state.units) {
      if (o === u || o.hp <= 0) continue;
      if (u.kind === 'scv' && o.kind === 'scv') continue;
      const sx = u.x - o.x, sy = u.y - o.y;
      const minSep = u.radius + o.radius + 4;
      const d2 = sx * sx + sy * sy;
      if (d2 > 0 && d2 < minSep * minSep) {
        const d = Math.sqrt(d2);
        const f = (minSep - d) / minSep;
        steerX += (sx / d) * f * 1.35;
        steerY += (sy / d) * f * 1.35;
      }
    }

    const sLen = Math.hypot(steerX, steerY) || 1;
    const mapDef = MAP_DEFS[state.map] || MAP_DEFS.vallee;
    let upgSpdMult = 1.0;
    if (owner?.upgrades?.advanced_thrusters && u.kind !== 'scv') upgSpdMult = 1.18;
    const spd = def.speed * stimMult * (mapDef.moveSpeedMult || 1.0) * upgSpdMult;
    u.vx = (steerX / sLen) * spd;
    u.vy = (steerY / sLen) * spd;

    const nextX = clamp(u.x + u.vx * dt, 24, WORLD_SIZE - 24);
    const nextY = clamp(u.y + u.vy * dt, 24, WORLD_SIZE - 24);

    if (terrainActive) {
      if (isBlockedAt(nextX, nextY)) {
        if (!isBlockedAt(nextX, u.y)) {
          u.x = nextX;
          u.vy = 0;
        } else if (!isBlockedAt(u.x, nextY)) {
          u.y = nextY;
          u.vx = 0;
        } else {
          u.vx = 0;
          u.vy = 0;
        }
      } else {
        u.x = nextX;
        u.y = nextY;
      }
      if (isBlockedAt(u.x, u.y)) {
        const l = nearestLand(u.x, u.y);
        const ldx = l.x - u.x, ldy = l.y - u.y;
        const ld = Math.hypot(ldx, ldy) || 1;
        u.x += (ldx / ld) * Math.min(ld, 160 * dt);
        u.y += (ldy / ld) * Math.min(ld, 160 * dt);
      }
    } else {
      u.x = nextX;
      u.y = nextY;
    }
    u.a = Math.atan2(u.vy || (steerTargetY - u.y), u.vx || (steerTargetX - u.x));

    for (const b of state.buildings) {
      if (b.hp <= 0) continue;
      // Le VCS qui construit ce chantier a le droit d'entrer SUR l'emplacement de construction !
      if (b.constructing && u.kind === 'scv' && u.buildTargetId === b.id) continue;
      if (b.constructing && !b.buildStarted) continue;
      const cx = u.x - b.x, cy = u.y - b.y;
      const minD = u.radius + (isScv ? b.radius * 0.94 : b.radius) + (isScv ? 0.5 : 2);
      const d2 = cx * cx + cy * cy;
      if (d2 < minD * minD) {
        const d = Math.sqrt(d2) || 1;
        const nx = cx / d, ny = cy / d;
        u.x = b.x + nx * minD;
        u.y = b.y + ny * minD;
        // Glissement tangentiel le long de la façade
        const vDot = u.vx * nx + u.vy * ny;
        if (vDot < 0) {
          u.vx -= vDot * nx;
          u.vy -= vDot * ny;
        }
      }
    }

    // Système d'expulsion anti-coincement si un VCS est pris en étau entre 2+ bâtiments
    if (isScv) {
      let stuckCount = 0, escX = 0, escY = 0;
      for (const b of state.buildings) {
        if (b.hp <= 0 || (b.constructing && u.buildTargetId === b.id)) continue;
        const cx = u.x - b.x, cy = u.y - b.y;
        const minD = u.radius + b.radius * 0.95;
        if (cx * cx + cy * cy < minD * minD) {
          stuckCount++;
          const d = Math.hypot(cx, cy) || 1;
          escX += cx / d;
          escY += cy / d;
        }
      }
      if (stuckCount >= 2) {
        const escLen = Math.hypot(escX, escY) || 1;
        u.x += (escX / escLen) * 3.5;
        u.y += (escY / escLen) * 3.5;
      }
    }
  }

  for (let i = state.units.length - 1; i >= 0; i--) {
    const u = state.units[i];
    if (u.hp <= 0) {
      if (u.kind === 'dropship' && Array.isArray(u.cargo) && u.cargo.length > 0) {
        for (const cId of u.cargo) {
          const pass = state.units.find((x) => x.id === cId);
          if (pass) {
            pass.boardedIn = null;
            pass.mode = 'idle';
            pass.x = clamp(u.x + (Math.random() - 0.5) * 44, 30, WORLD_SIZE - 30);
            pass.y = clamp(u.y + (Math.random() - 0.5) * 44, 30, WORLD_SIZE - 30);
            pass.hp = Math.max(1, Math.round(pass.hp * 0.5));
            fxEvents.push({ k: 'SPARK', x: pass.x, y: pass.y, color: '#ff4b2b' });
          }
        }
        u.cargo = [];
      }
      fxEvents.push({ k: 'BOOM', x: u.x, y: u.y, r: u.radius * 1.5 });
      state.units.splice(i, 1);
    }
  }
  for (let i = state.buildings.length - 1; i >= 0; i--) {
    const b = state.buildings[i];
    if (b.hp <= 0) {
      fxEvents.push({ k: 'BOOM_BIG', x: b.x, y: b.y, r: b.radius * 1.8 });
      const ownerId = b.owner;
      state.buildings.splice(i, 1);
      const hasAnyHq = state.buildings.some((ob) => ob.owner === ownerId && ob.kind === 'hq' && ob.hp > 0);
      if (!hasAnyHq) {
        const p = state.players.find((q) => q.id === ownerId);
        if (p && !p.dead) {
          p.dead = true;
          state.ranking.unshift(p.id);
          for (const ob of state.buildings) if (ob.owner === ownerId) ob.hp = 0;
          for (const ou of state.units) if (ou.owner === ownerId) ou.hp = 0;
          fxEvents.push({ k: 'ELIM', name: p.name, color: p.color });
        }
      }
    }
  }

  const aliveTeams = new Set(state.players.filter((p) => !p.dead).map((p) => p.team));
  if (aliveTeams.size <= 1) {
    state.over = true;
    state.winnerTeam = [...aliveTeams][0] ?? 0;
    const winners = state.players.filter((p) => !p.dead).sort((a, b) => b.score - a.score);
    for (const w of winners) {
      w.score += 500;
      if (!state.ranking.includes(w.id)) state.ranking.unshift(w.id);
    }
    for (const p of state.players) {
      if (!state.ranking.includes(p.id)) state.ranking.push(p.id);
    }
  }
}

/* ============================================================================
   INTELLIGENCE ARTIFICIELLE DES BOTS (MACRO & MICRO STARCRAFT)
   ============================================================================ */
// Cible d'un bot : il garde le même QG ennemi tant qu'il tient debout. Sinon il choisit le plus proche,
// en évitant ceux que les autres bots attaquent déjà (avant, tous les bots visaient le premier QG de la liste :
// celui de l'hôte).
function pickBotTarget(state, p, hq) {
  const hqs = state.buildings.filter((b) => b.team !== p.team && b.kind === 'hq' && b.hp > 0);
  const kept = hqs.find((b) => b.id === p.botTargetId);
  if (kept) return kept;
  const takenBy = (owner) => state.players.filter((q) => q.bot && q.id !== p.id && !q.dead
    && state.buildings.some((b) => b.id === q.botTargetId && b.owner === owner && b.hp > 0)).length;
  let best = null, bestScore = Infinity;
  for (const b of hqs) {
    // Petit écart propre à chaque paire attaquant/cible pour départager les distances égales des cartes symétriques
    const tie = ((p.id * 7919 + b.owner * 104729) % 97) * 3;
    const score = hypot(hq.x, hq.y, b.x, b.y) + takenBy(b.owner) * 1600 + tie;
    if (score < bestScore) { bestScore = score; best = b; }
  }
  p.botTargetId = best ? best.id : null;
  return best || state.buildings.find((b) => b.team !== p.team && b.hp > 0) || null;
}

function runBots(state, fxEvents) {
  if (state.over) return;
  for (const p of state.players) {
    if (!p.bot || p.dead) continue;
    const myBlds = state.buildings.filter((b) => b.owner === p.id && b.hp > 0);
    const hq = myBlds.find((b) => b.kind === 'hq');
    if (!hq) continue;

    const myUnits = state.units.filter((u) => u.owner === p.id && u.hp > 0);
    const scvs = myUnits.filter((u) => u.kind === 'scv');
    const army = myUnits.filter((u) => u.kind !== 'scv');
    const sup = computeSupply(state, p.id);

    const refs = myBlds.filter((b) => b.kind === 'extractor').length;
    const rax = myBlds.filter((b) => b.kind === 'barracks').length;
    const fac = myBlds.filter((b) => b.kind === 'factory').length;
    const tur = myBlds.filter((b) => b.kind === 'turret' || b.kind === 'tesla').length;

    const dirX = Math.sign(HALF_W - hq.x) || 1;
    const dirY = Math.sign(HALF_W - hq.y) || 1;

    // Couloirs à garder libres : du QG vers chaque rampe de son plateau (sinon le bot s'emmure et son armée ne sort plus)
    const main = (MAP_FEATURES?.mains || []).find((m) => hypot(m.x, m.y, hq.x, hq.y) < 60);
    const lanes = main ? main.ramps.map((a) => [hq.x, hq.y, main.x + Math.cos(a) * (main.r + RAMP_LEN * 0.6), main.y + Math.sin(a) * (main.r + RAMP_LEN * 0.6)]) : [];
    const leavesRoom = (kind, x, y) => {
      const r = BUILDINGS[kind].radius;
      if (kind !== 'extractor' && lanes.some((l) => segDist(x, y, l[0], l[1], l[2], l[3]) < r + 70)) return false;
      // Un vrai passage entre deux bâtiments, assez large pour un Thor
      return !myBlds.some((b) => b.kind !== 'extractor' && hypot(x, y, b.x, b.y) < r + b.radius + 56);
    };
    const tryBuildNear = (kind, ax, ay, minR = 75, maxR = 230) => {
      for (let k = 0; k < 30; k++) {
        const ang = Math.random() * TAU;
        const r = minR + Math.random() * (maxR - minR);
        const x = ax + Math.cos(ang) * r, y = ay + Math.sin(ang) * r;
        if (leavesRoom(kind, x, y) && canPlaceBuilding(state, p.id, kind, x, y).ok) {
          return executeCommand(state, p.id, { op: 'BUILD', kind, x, y }, fxEvents).ok;
        }
      }
      return false;
    };

    // Si un chantier du bot n'a plus de VCS attitré, y envoyer un VCS libre
    for (const cb of myBlds) {
      if (cb.constructing && !scvs.some((u) => u.mode === 'build' && u.buildTargetId === cb.id)) {
        const freeBuilder = scvs.find((u) => u.mode !== 'build');
        if (freeBuilder) {
          freeBuilder.mode = 'build';
          freeBuilder.buildTargetId = cb.id;
          freeBuilder.onSite = false;
          freeBuilder.orderX = cb.x;
          freeBuilder.orderY = cb.y;
        }
      }
    }

    if (sup.max - sup.used <= 3 && sup.max < MAX_SUPPLY && p.minerals >= 75) {
      if (tryBuildNear('pylon', hq.x + dirX * 90, hq.y + dirY * 90, 65, 195)) continue;
    }
    if (scvs.length < 11 && hq.queue.length < 2 && p.minerals >= 50) {
      executeCommand(state, p.id, { op: 'TRAIN', unit: 'scv', bldId: hq.id }, fxEvents);
    }
    const maxRefs = (state.map === 'magma') ? 2 : 1;
    if (refs < maxRefs && scvs.length >= (refs === 0 ? 7 : 10) && p.minerals >= 75) {
      const nearbyGeysers = GAS_GEYSERS.filter((g) => hypot(g.x, g.y, hq.x, hq.y) < 260);
      for (const gey of nearbyGeysers) {
        const taken = state.buildings.some((b) => b.hp > 0 && dist2(b.x, b.y, gey.x, gey.y) < 35 * 35);
        if (!taken) {
          executeCommand(state, p.id, { op: 'BUILD', kind: 'extractor', x: gey.x, y: gey.y }, fxEvents);
          break;
        }
      }
    }
    const readyRefs = myBlds.filter((b) => b.kind === 'extractor' && !b.constructing);
    for (const readyRef of readyRefs) {
      const gasScvs = scvs.filter((u) => u.mode === 'harvest_gas' && u.harvestId === readyRef.id);
      if (gasScvs.length < 2) {
        const freeScv = scvs.find((u) => u.mode === 'harvest_min');
        if (freeScv) { freeScv.mode = 'harvest_gas'; freeScv.harvestId = readyRef.id; }
      }
    }

    if (rax < 1 && p.minerals >= 125) {
      if (tryBuildNear('barracks', hq.x + dirX * 135, hq.y + dirY * 45, 50, 140)) continue;
    }
    if (rax >= 1 && fac < 1 && p.minerals >= 150 && p.gas >= 75) {
      if (tryBuildNear('factory', hq.x + dirX * 60, hq.y + dirY * 140, 55, 150)) continue;
    }
    if (tur < 2 && rax >= 1 && p.minerals >= 125) {
      const tKind = (state.map === 'magma' || (p.gas >= 50 && Math.random() < 0.5)) ? 'tesla' : 'turret';
      if (tryBuildNear(tKind, hq.x + dirX * 165, hq.y + dirY * 165, 35, 110)) continue;
    }
    const arm = myBlds.filter((b) => b.kind === 'armory').length;
    if (rax >= 1 && arm < 1 && p.minerals >= 125 && p.gas >= 50) {
      if (tryBuildNear('armory', hq.x - dirX * 50, hq.y + dirY * 130, 45, 140)) continue;
    }
    const rad = myBlds.filter((b) => b.kind === 'radar').length;
    if (rax >= 1 && rad < 1 && state.time > 150 && p.minerals >= 140 && p.gas >= 25) {
      if (tryBuildNear('radar', hq.x + dirX * 170, hq.y + dirY * 170, 20, 120)) continue;
    }
    const spPort = myBlds.filter((b) => b.kind === 'starport').length;
    if (fac >= 1 && spPort < 1 && p.minerals >= 150 && p.gas >= 100) {
      if (tryBuildNear('starport', hq.x - dirX * 110, hq.y - dirY * 90, 50, 160)) continue;
    }
    const readyArm = myBlds.find((b) => b.kind === 'armory' && !b.constructing && (!b.queue || b.queue.length === 0));
    if (readyArm) {
      p.upgrades = p.upgrades || {};
      const upgOrder = ['infantry_weapons', 'infantry_armor', 'vehicle_weapons', 'vehicle_armor', 'advanced_thrusters'];
      for (const uid of upgOrder) {
        if (!p.upgrades[uid]) {
          const uDef = UPGRADES[uid];
          if (p.minerals >= uDef.min && p.gas >= uDef.gas) {
            executeCommand(state, p.id, { op: 'RESEARCH', upgId: uid, bldId: readyArm.id }, fxEvents);
            break;
          }
        }
      }
    }
    if (spPort >= 1) {
      const spBld = myBlds.find((b) => b.kind === 'starport' && !b.constructing && (!b.queue || b.queue.length < 2));
      if (spBld) {
        const medCount = myUnits.filter((u) => u.kind === 'medivac').length;
        if (medCount < 2 && p.minerals >= 75 && p.gas >= 75) {
          executeCommand(state, p.id, { op: 'TRAIN', unit: 'medivac', bldId: spBld.id }, fxEvents);
        } else if (p.minerals >= 100 && p.gas >= 50 && Math.random() < 0.35) {
          executeCommand(state, p.id, { op: 'TRAIN', unit: 'dropship', bldId: spBld.id }, fxEvents);
        }
      }
    }
    if (rax < 2 && fac >= 1 && p.minerals >= 180) {
      if (tryBuildNear('barracks', hq.x + dirX * 140, hq.y - dirY * 50, 55, 160)) continue;
    }

    if (state.map === 'magma') {
      // Magma : surabondance de gaz -> priorité absolue aux Titans, Chars de Siège et Faucheurs
      if (fac >= 1 && p.minerals >= 250 && p.gas >= 150) {
        executeCommand(state, p.id, { op: 'TRAIN', unit: 'titan' }, fxEvents);
      } else if (fac >= 1 && p.minerals >= 150 && p.gas >= 100) {
        executeCommand(state, p.id, { op: 'TRAIN', unit: 'siege' }, fxEvents);
      } else if (fac >= 1 && p.minerals >= 125 && p.gas >= 50 && Math.random() < 0.6) {
        executeCommand(state, p.id, { op: 'TRAIN', unit: 'tank' }, fxEvents);
      } else if (rax >= 1 && p.minerals >= 75 && p.gas >= 50 && Math.random() < 0.7) {
        executeCommand(state, p.id, { op: 'TRAIN', unit: 'sapper' }, fxEvents);
      } else if (rax >= 1 && p.minerals >= 75 && p.gas >= 25) {
        executeCommand(state, p.id, { op: 'TRAIN', unit: 'rocket' }, fxEvents);
      } else if (rax >= 1 && p.minerals >= 50) {
        executeCommand(state, p.id, { op: 'TRAIN', unit: 'marine' }, fxEvents);
      }
    } else {
      if (fac >= 1 && p.minerals >= 250 && p.gas >= 150) {
        executeCommand(state, p.id, { op: 'TRAIN', unit: 'titan' }, fxEvents);
      } else if (fac >= 1 && p.minerals >= 150 && p.gas >= 100 && Math.random() < 0.55) {
        executeCommand(state, p.id, { op: 'TRAIN', unit: 'siege' }, fxEvents);
      } else if (fac >= 1 && p.minerals >= 125 && p.gas >= 50) {
        executeCommand(state, p.id, { op: 'TRAIN', unit: 'tank' }, fxEvents);
      }
      if (rax >= 1 && p.minerals >= 75 && p.gas >= 25 && Math.random() < 0.6) {
        executeCommand(state, p.id, { op: 'TRAIN', unit: Math.random() < 0.65 ? 'rocket' : 'sapper' }, fxEvents);
      } else if (rax >= 1 && p.minerals >= 50) {
        executeCommand(state, p.id, { op: 'TRAIN', unit: 'marine' }, fxEvents);
      }
    }

    const waveSize = state.level === 'expert' ? 6 : state.level === 'facile' ? 10 : 8;
    // Armée disponible : au repos, ou encore sur le plateau de sa base (ralliement compris)
    const idleArmy = army.filter((u) => !u.boardedIn && (u.mode === 'idle' || hypot(u.x, u.y, hq.x, hq.y) < MAIN_R + 140));
    if (idleArmy.length >= waveSize) {
      const enemyBld = pickBotTarget(state, p, hq);
      if (enemyBld) {
        executeCommand(state, p.id, {
          op: 'UNIT_ORDER',
          mode: 'amove',
          x: enemyBld.x,
          y: enemyBld.y,
          unitIds: idleArmy.map((u) => u.id),
        }, fxEvents);
      }
    }
  }
}

   - Une unité au sol en contrebas ne voit pas ce qui se passe sur un plateau.
   - Les unités volantes, les Scans et la Tour de Détection voient partout.

var FOG_RES = 220;
var fogCanvas = document.createElement('canvas');
fogCanvas.width = FOG_RES;
fogCanvas.height = FOG_RES;
var fogCtx = fogCanvas.getContext('2d');
var fogImg = fogCtx.createImageData(FOG_RES, FOG_RES);
var exploredGrid = new Uint8Array(FOG_RES * FOG_RES);
// Version lissée (plus grande + flou) : bords de vision doux au lieu de marches d'escalier
var fogSmooth = document.createElement('canvas');
fogSmooth.width = 768;
fogSmooth.height = 768;
var fogSmoothCtx = fogSmooth.getContext('2d');
var myVisGrid = new Uint8Array(FOG_RES * FOG_RES);
var fogHigh = new Uint8Array(FOG_RES * FOG_RES);
const exploredCanvas = null, exploredCtx = null; // conservés pour compatibilité

function buildFogHigh() {
  if (!fogHigh) return;
  const cs = WORLD_SIZE / FOG_RES;
  for (let gy = 0; gy < FOG_RES; gy++) {
    for (let gx = 0; gx < FOG_RES; gx++) {
      const t = terTypeAt((gx + 0.5) * cs, (gy + 0.5) * cs);
      fogHigh[gy * FOG_RES + gx] = (t === T_HIGH || t === T_CLIFF) ? 1 : 0;
    }
  }
}

function fogCellOf(wx, wy) {
  const gx = clamp(Math.floor((wx / WORLD_SIZE) * FOG_RES), 0, FOG_RES - 1);
  const gy = clamp(Math.floor((wy / WORLD_SIZE) * FOG_RES), 0, FOG_RES - 1);
  return gy * FOG_RES + gx;
}

function stampVision(grid, wx, wy, r, ignoreHeight, explored) {
  const sc = FOG_RES / WORLD_SIZE;
  const cx = wx * sc, cy = wy * sc, cr = r * sc, cr2 = cr * cr;
  const seeHigh = ignoreHeight || terTypeAt(wx, wy) === T_HIGH;
  const y0 = Math.max(0, Math.floor(cy - cr)), y1 = Math.min(FOG_RES - 1, Math.ceil(cy + cr));
  const x0 = Math.max(0, Math.floor(cx - cr)), x1 = Math.min(FOG_RES - 1, Math.ceil(cx + cr));
  for (let y = y0; y <= y1; y++) {
    const dy = y + 0.5 - cy;
    for (let x = x0; x <= x1; x++) {
      const dx = x + 0.5 - cx;
      if (dx * dx + dy * dy > cr2) continue;
      const i = y * FOG_RES + x;
      if (!seeHigh && fogHigh[i]) continue;
      grid[i] = 1;
      if (explored) explored[i] = 1;
    }
  }
}

function computeTeamVision(st, team, grid, explored = null) {
  grid.fill(0);
  for (const b of st.buildings) {
    if (b.team !== team || b.hp <= 0) continue;
    const def = BUILDINGS[b.kind] || {};
    stampVision(grid, b.x, b.y, def.sight || 300, !!def.detector && !b.constructing, explored);
  }
  for (const u of st.units) {
    if (u.team !== team || u.hp <= 0 || u.boardedIn) continue;
    stampVision(grid, u.x, u.y, UNITS[u.kind]?.sight || 260, !!u.flying, explored);
  }
  for (const sc of st.scans || []) {
    if (sc.team === team) stampVision(grid, sc.x, sc.y, sc.r, true, explored);
  }
}

// Vision par équipe utilisée par la simulation : on ne tire pas sur un plateau qu'on ne voit pas
const simVision = { t: -1, st: null, grids: new Map() };
function refreshSimVision(st) {
  if (simVision.st === st && st.time - simVision.t < 0.25 && st.time >= simVision.t) return;
  simVision.st = st;
  simVision.t = st.time;
  const teams = new Set(st.players.filter((p) => !p.dead).map((p) => p.team));
  for (const t of teams) {
    let g = simVision.grids.get(t);
    if (!g || g.length !== FOG_RES * FOG_RES) { g = new Uint8Array(FOG_RES * FOG_RES); simVision.grids.set(t, g); }
    computeTeamVision(st, t, g);
  }
}
function teamSees(team, wx, wy) {
  const g = simVision.grids.get(team);
  return !g || g[fogCellOf(wx, wy)] === 1;
}
// Un attaquant au sol en contrebas ne peut viser une cible sur un plateau que si son équipe la voit
function canStrike(attacker, target) {
  if (attacker.flying) return true;
  if (!isHighAt(target.x, target.y)) return true;
  if (isHighAt(attacker.x, attacker.y)) return true;
  return teamSees(attacker.team, target.x, target.y);
}

function isExplored(wx, wy) {
  if (!state) return true;
  const me = state.players.find((p) => p.id === myId);
  if (!me || me.dead) return true;
  if (exploredGrid[fogCellOf(wx, wy)] === 1) return true;
  return false;
}

function isVisibleToMe(wx, wy) {
  if (!state) return true;
  const me = state.players.find((p) => p.id === myId);
  if (!me || me.dead) return true;
  return myVisGrid[fogCellOf(wx, wy)] === 1;
}

let lastFogUpdate = 0;
function updateFogCanvas(now = performance.now()) {
  if (!state) return;
  if (now - lastFogUpdate < 90) return;
  lastFogUpdate = now;
  const me = state.players.find((p) => p.id === myId);
  const d = fogImg.data;
  if (!me || me.dead) {
    myVisGrid.fill(1);
    fogCtx.clearRect(0, 0, FOG_RES, FOG_RES);
    fogSmoothCtx.clearRect(0, 0, fogSmooth.width, fogSmooth.height);
    if (fogTexture3D) fogTexture3D.needsUpdate = true;
    return;
  }
  computeTeamVision(state, me.team, myVisGrid, exploredGrid);
  for (let i = 0, n = FOG_RES * FOG_RES; i < n; i++) {
    const o = i * 4;
    d[o] = 4; d[o + 1] = 8; d[o + 2] = 10;
    d[o + 3] = myVisGrid[i] ? 0 : exploredGrid[i] ? 138 : 246;
  }
  fogCtx.putImageData(fogImg, 0, 0);
  smoothFog();
  if (fogTexture3D) fogTexture3D.needsUpdate = true;
}
function smoothFog() {
  const S = fogSmooth.width;
  fogSmoothCtx.clearRect(0, 0, S, S);
  fogSmoothCtx.imageSmoothingEnabled = true;
  fogSmoothCtx.filter = `blur(${Math.round(S / FOG_RES * 1.1)}px)`;
  fogSmoothCtx.drawImage(fogCanvas, 0, 0, S, S);
  fogSmoothCtx.filter = 'none';
}
