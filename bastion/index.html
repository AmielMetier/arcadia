      shPod.castShadow = true;
      turretGrp.add(shPod);

      const armCannon = new THREE.Mesh(new THREE.CylinderGeometry(3.8, 4.5, r * 1.7, 10), darkSteelMat);
      armCannon.rotation.z = -Math.PI / 2;
      armCannon.position.set(r * 0.85, -1, oz * 1.05);
      armCannon.castShadow = true;
      turretGrp.add(armCannon);

      const muzzle = new THREE.Mesh(new THREE.CylinderGeometry(4.2, 4.2, 4, 10), cyanMat);
      muzzle.rotation.z = -Math.PI / 2;
      muzzle.position.set(r * 1.68, -1, oz * 1.05);
      turretGrp.add(muzzle);
    }

    grp.add(turretGrp);
    grp.userData.turret = turretGrp;

  } else if (kind === 'dropship') {
    // Navette de Transport 3D : coque lourde, réacteurs jumeaux, cockpit, soute
    const hull = new THREE.Mesh(new THREE.BoxGeometry(r * 1.9, 10, r * 1.25), teamMat);
    hull.position.y = 5;
    hull.castShadow = true;
    grp.add(hull);

    const cockpit = new THREE.Mesh(new THREE.ConeGeometry(r * 0.55, 12, 6), visorMat);
    cockpit.rotation.z = -Math.PI / 2;
    cockpit.position.set(r * 0.95, 5, 0);
    grp.add(cockpit);

    for (const oz of [-r * 0.78, r * 0.78]) {
      const eng = new THREE.Mesh(new THREE.CylinderGeometry(4.5, 4.5, r * 1.5, 8), darkSteelMat);
      eng.rotation.z = Math.PI / 2;
      eng.position.set(-2, 5, oz);
      eng.castShadow = true;
      grp.add(eng);

      const glow = new THREE.Mesh(new THREE.CylinderGeometry(3.2, 3.2, 2, 8), cyanMat);
      glow.rotation.z = Math.PI / 2;
      glow.position.set(-r * 0.78, 5, oz);
      grp.add(glow);
    }

    const shadowMat = new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.38 });
    const shadowDisc = new THREE.Mesh(new THREE.CircleGeometry(r * 1.2, 16), shadowMat);
    shadowDisc.rotation.x = -Math.PI / 2;
    shadowDisc.position.y = 0.5;
    grp.add(shadowDisc);
    grp.userData.shadowDisc = shadowDisc;

  } else if (kind === 'medivac') {
    // Navette Médicale 3D : cellule aérodynamique, croix médicale, propulseurs
    const hull = new THREE.Mesh(new THREE.ConeGeometry(r * 0.8, r * 2.2, 6), lightSteelMat);
    hull.rotation.z = -Math.PI / 2;
    hull.position.y = 5;
    hull.castShadow = true;
    grp.add(hull);

    const canopy = new THREE.Mesh(new THREE.SphereGeometry(r * 0.45, 8, 8), visorMat);
    canopy.position.set(r * 0.35, 7, 0);
    grp.add(canopy);

    for (const oz of [-r * 0.85, r * 0.85]) {
      const wing = new THREE.Mesh(new THREE.BoxGeometry(r * 0.9, 2.5, r * 0.8), greenMat);
      wing.position.set(-2, 5, oz);
      wing.castShadow = true;
      grp.add(wing);

      const thruster = new THREE.Mesh(new THREE.CylinderGeometry(3.5, 3.5, 8, 8), darkSteelMat);
      thruster.rotation.z = Math.PI / 2;
      thruster.position.set(-r * 0.4, 5, oz);
      grp.add(thruster);

      const tGlow = new THREE.Mesh(new THREE.CylinderGeometry(2.5, 2.5, 2, 8), greenMat);
      tGlow.rotation.z = Math.PI / 2;
      tGlow.position.set(-r * 0.82, 5, oz);
      grp.add(tGlow);
    }

    const shadowMat = new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.38 });
    const shadowDisc = new THREE.Mesh(new THREE.CircleGeometry(r * 1.1, 16), shadowMat);
    shadowDisc.rotation.x = -Math.PI / 2;
    shadowDisc.position.y = 0.5;
    grp.add(shadowDisc);
    grp.userData.shadowDisc = shadowDisc;

  } else {
    // Infanterie 3D (Marine, Maraudeur, Démolisseur) : armure CMC, épaulières, casque à visière et arme 3D
    const bodyGrp = new THREE.Group();
    const torsoH = kind === 'rocket' ? 15 : 13;
    const torso = new THREE.Mesh(new THREE.CylinderGeometry(r * 0.62, r * 0.52, torsoH, 10), teamMat);
    torso.position.y = torsoH * 0.5 + 2;
    torso.castShadow = true;
    bodyGrp.add(torso);

    // Épaulières blindées
    for (const oz of [-r * 0.68, r * 0.68]) {
      const pad = new THREE.Mesh(new THREE.SphereGeometry(r * (kind === 'rocket' ? 0.52 : 0.42), 8, 8), darkTeamMat);
      pad.position.set(0, torsoH + 1, oz);
      pad.castShadow = true;
      bodyGrp.add(pad);
    }

    // Casque + visière lumineuse
    const helm = new THREE.Mesh(new THREE.SphereGeometry(r * 0.52, 10, 10), teamMat);
    helm.position.set(0, torsoH + 5, 0);
    helm.castShadow = true;
    bodyGrp.add(helm);

    const visor = new THREE.Mesh(new THREE.BoxGeometry(r * 0.45, 3.8, r * 0.68), kind === 'sapper' ? yellowMat : visorMat);
    visor.position.set(r * 0.35, torsoH + 5, 0);
    bodyGrp.add(visor);

    if (kind === 'rocket') {
      for (const oz of [-r * 0.78, r * 0.78]) {
        const launcher = new THREE.Mesh(new THREE.CylinderGeometry(3.2, 3.6, r * 1.45, 8), darkSteelMat);
        launcher.rotation.z = -Math.PI / 2;
        launcher.position.set(r * 0.55, torsoH - 1, oz);
        bodyGrp.add(launcher);
      }
    } else if (kind === 'sapper') {
      const bomb = new THREE.Mesh(new THREE.CylinderGeometry(5.5, 5.5, 12, 10), redMat);
      bomb.position.set(-r * 0.5, torsoH * 0.7, 0);
      bodyGrp.add(bomb);
    } else {
      const rifle = new THREE.Mesh(new THREE.BoxGeometry(r * 1.45, 3.2, 2.8), darkSteelMat);
      rifle.position.set(r * 0.65, torsoH * 0.72, r * 0.45);
      bodyGrp.add(rifle);
    }

    const stimRing = new THREE.Mesh(new THREE.RingGeometry(r * 0.95, r * 1.3, 18), redMat);
    stimRing.rotation.x = -Math.PI / 2;
    stimRing.position.y = 1.5;
    stimRing.visible = false;
    grp.add(stimRing);
    grp.userData.stimRing = stimRing;

    grp.add(bodyGrp);
    grp.userData.walkBody = bodyGrp;
  }

  grp.userData.color = color;
  grp.userData.kind = kind;
  return grp;
}

function syncAndRenderThree3D(dt, now, shX, shY) {
  if (!threeReady && !initThree3D()) return false;
  try {
    // Caméra 3D vue tactique à ~70° au-dessus du sol (inclinaison douce de 20° depuis le dessus)
    const pitchDeg = clamp(cam.pitch || 70, 25, 82);
    const pitchRad = (pitchDeg * Math.PI) / 180;
    const fovRad = (36 * Math.PI) / 180;
    const dist = (H / 2) / (cam.z * Math.tan(fovRad / 2));
    const camH = dist * Math.sin(pitchRad);
    const camZOffset = dist * Math.cos(pitchRad);

    threeCam.position.set(cam.x + shX, camH, cam.y + camZOffset + shY);
    threeCam.up.set(0, 1, 0);
    threeCam.lookAt(cam.x + shX, 0, cam.y + shY);
    threeCam.updateMatrixWorld();

    // Éclairage solaire dynamique aligné sur le centre de vision pour des ombres portées prononcées
    if (sunLight3D) {
      sunLight3D.position.set(cam.x - 650, 1800, cam.y + 800);
      sunLight3D.target.position.set(cam.x, 0, cam.y);
      sunLight3D.target.updateMatrixWorld();
    }

    // Brouillard atmosphérique au loin adaptatif selon la distance caméra
    if (threeScene.fog) {
      threeScene.fog.near = Math.max(650, dist * 0.9);
      threeScene.fog.far = Math.max(1800, dist * 2.85);
    }

    // Masquage tactique des arbres, rochers, monuments et ressources non encore explorés
    if (centerMonumentGroup3D) {
      centerMonumentGroup3D.visible = isExplored(HALF_W, HALF_W) ||
        isExplored(HALF_W - 180, HALF_W) || isExplored(HALF_W + 180, HALF_W) ||
        isExplored(HALF_W, HALF_W - 180) || isExplored(HALF_W, HALF_W + 180);
    }
    for (const t of treeMeshes3D) {
      t.grp.visible = isExplored(t.x, t.y);
    }
    for (const r of rockMeshes3D) {
      r.mesh.visible = isExplored(r.x, r.y);
    }
    for (const m of mineralMeshes3D) {
      m.grp.visible = isExplored(m.x, m.y);
    }
    for (const g of geyserMeshes3D) {
      g.grp.visible = isExplored(g.x, g.y);
    }

    // Animation des cristaux de minéraux et geysers de gaz plasma
    for (const m of mineralMeshes3D) {
      if (m.grp.visible) {
        m.grp.position.y = (m.baseY || 4) + Math.sin(now * 0.0035 + m.seed) * 1.8;
      }
    }
    for (const g of geyserMeshes3D) {
      if (g.grp.visible) {
        const s = 0.88 + Math.sin(now * 0.006 + g.seed) * 0.18;
        g.core.scale.set(s, s * 0.7, s);
      }
    }

    // Synchronisation des Bâtiments 3D
    const activeBldIds = new Set();
    for (const b of state.buildings) {
      if (b.hp <= 0) continue;
      const vis = b.owner === myId || isVisibleToMe(b.x, b.y);
      activeBldIds.add(b.id);
      const owner = state.players.find((p) => p.id === b.owner);
      const col = owner ? owner.color : '#888888';

      let mesh = bldMeshes3D.get(b.id);
      if (!mesh || mesh.userData.kind !== b.kind || mesh.userData.color !== col) {
        if (mesh) threeScene.remove(mesh);
        mesh = createBuildingMesh3D(b.kind, col, false);
        threeScene.add(mesh);
        bldMeshes3D.set(b.id, mesh);
      }

      mesh.visible = vis;
      if (!vis) continue;
      mesh.position.set(b.x, 0, b.y);

      const prog = b.constructing ? clamp(b.buildProg || 0.06, 0.06, 1) : 1;
      if (mesh.userData.bodyGroup) {
        mesh.userData.bodyGroup.scale.set(1, b.constructing ? 0.15 + 0.85 * prog : 1, 1);
      }
      if (mesh.userData.scaffold) {
        mesh.userData.scaffold.visible = !!b.constructing;
        if (b.constructing) mesh.userData.scaffold.rotation.y = now * 0.0012;
      }
      if (mesh.userData.rotPart && !b.constructing) {
        mesh.userData.rotPart.rotation.y = now * 0.0022;
      }
      if (mesh.userData.piston && !b.constructing) {
        mesh.userData.piston.position.y = 26 + Math.sin(now * 0.006 + b.id) * 4;
      }
      if (mesh.userData.turret) {
        mesh.userData.turret.rotation.y = -(b.aimA || 0);
      }
    }
    for (const [id, mesh] of bldMeshes3D.entries()) {
      if (!activeBldIds.has(id)) {
        threeScene.remove(mesh);
        bldMeshes3D.delete(id);
      }
    }

    // Connexions 3D entre Murs voisins
    while (wallBeamsGroup3D.children.length > 0) {
      wallBeamsGroup3D.remove(wallBeamsGroup3D.children[0]);
    }
    const walls = state.buildings.filter((b) => b.kind === 'wall' && b.hp > 0 && (b.owner === myId || isVisibleToMe(b.x, b.y)));
    if (walls.length > 1) {
      if (!geoCache3D.wallBox) geoCache3D.wallBox = new THREE.BoxGeometry(1, 16, 10);
      const wallBeamMat = getMat3D('#929aa8', 0.4, 0.5);
      for (let i = 0; i < walls.length; i++) {
        for (let j = i + 1; j < walls.length; j++) {
          const w1 = walls[i], w2 = walls[j];
          if (w1.team === w2.team) {
            const d = hypot(w1.x, w1.y, w2.x, w2.y);
            if (d > 8 && d <= 58) {
              const beam = new THREE.Mesh(geoCache3D.wallBox, wallBeamMat);
              beam.scale.set(d, 1, 1);
              beam.position.set((w1.x + w2.x) * 0.5, 11, (w1.y + w2.y) * 0.5);
              beam.rotation.y = -Math.atan2(w2.y - w1.y, w2.x - w1.x);
              beam.castShadow = true;
              wallBeamsGroup3D.add(beam);
            }
          }
        }
      }
    }

    // Synchronisation des Unités 3D
    const activeUnitIds = new Set();
    for (const u of state.units) {
      if (u.hp <= 0 || u.boardedIn) continue;
      const vis = u.owner === myId || isVisibleToMe(u.x, u.y);
      activeUnitIds.add(u.id);
      const owner = state.players.find((p) => p.id === u.owner);
      const col = owner ? owner.color : '#888888';

      let mesh = unitMeshes3D.get(u.id);
      if (!mesh || mesh.userData.kind !== u.kind || mesh.userData.color !== col) {
        if (mesh) threeScene.remove(mesh);
        mesh = createUnitMesh3D(u.kind, col);
        threeScene.add(mesh);
        unitMeshes3D.set(u.id, mesh);
      }

      mesh.visible = vis;
      if (!vis) continue;

      const isFly = !!u.flying;
      const hoverY = isFly ? (42 + Math.sin(now * 0.003 + u.id) * 3) : 0;
      mesh.position.set(u.x, hoverY, u.y);
      if (mesh.userData.shadowDisc) {
        mesh.userData.shadowDisc.position.y = -hoverY + 0.5;
      }

      if (u.kind === 'medivac' && u.healingTargetId) {
        const ally = state.units.find((a) => a.id === u.healingTargetId && a.hp > 0 && !a.boardedIn);
        if (ally) {
          const bGeo = new THREE.BufferGeometry().setFromPoints([
            new THREE.Vector3(u.x, hoverY + 2, u.y),
            new THREE.Vector3(ally.x, ally.kind === 'titan' ? 24 : 10, ally.y),
          ]);
          const bMat = new THREE.LineBasicMaterial({ color: 0x2fbf71, linewidth: 3 });
          const bLine = new THREE.Line(bGeo, bMat);
          fxGroup3D.add(bLine);
        }
      }

      if (u.kind === 'tank' || u.kind === 'siege' || u.kind === 'titan') {
        const moveA = (Math.abs(u.vx || 0) + Math.abs(u.vy || 0) > 2) ? Math.atan2(u.vy, u.vx) : (u.a || 0);
        mesh.rotation.y = -moveA;
        if (mesh.userData.turret) {
          mesh.userData.turret.rotation.y = -(u.a || 0) + moveA;
        }
        if (mesh.userData.stabilizers) {
          mesh.userData.stabilizers.visible = !!u.sieged;
        }
      } else {
        mesh.rotation.y = -(u.a || 0);
        if (mesh.userData.walkBody) {
          const moving = (Math.abs(u.vx || 0) + Math.abs(u.vy || 0)) > 4;
          mesh.userData.walkBody.position.y = moving ? Math.abs(Math.sin(now * 0.015 + u.id)) * 2.2 : 0;
        }
        if (mesh.userData.stimRing) {
          mesh.userData.stimRing.visible = (u.stimT || 0) > 0;
        }
        if (u.kind === 'scv') {
          if (mesh.userData.cargoMin) mesh.userData.cargoMin.visible = u.carryAmt > 0 && u.carryType === 'min';
          if (mesh.userData.cargoGas) mesh.userData.cargoGas.visible = u.carryAmt > 0 && u.carryType === 'gas';
          if (mesh.userData.weldGlow) {
            const welding = !!(u.onSite && u.buildTargetId);
            mesh.userData.weldGlow.visible = welding && ((Math.floor(now / 50) + u.id) % 2 === 0);
          }
        }
      }
    }
    for (const [id, mesh] of unitMeshes3D.entries()) {
      if (!activeUnitIds.has(id)) {
        threeScene.remove(mesh);
        unitMeshes3D.delete(id);
      }
    }

    // Aperçu fantôme 3D du bâtiment à poser (uniquement quand un VCS est sélectionné)
    if (buildMode) {
      const def = BUILDINGS[buildMode];
      const check = canPlaceBuilding(state, myId, buildMode, mouse.wx, mouse.wy);
      const gx = check.snapX ?? mouse.wx, gy = check.snapY ?? mouse.wy;
      const ghostCol = check.ok ? '#2fbf71' : '#ff4b2b';
      const ghostKey = `${buildMode}|${ghostCol}`;
      if (!ghostGroup3D || ghostKind3D !== ghostKey) {
        if (ghostGroup3D) threeScene.remove(ghostGroup3D);
        ghostGroup3D = createBuildingMesh3D(buildMode, ghostCol, true);
        threeScene.add(ghostGroup3D);
        ghostKind3D = ghostKey;
      }
      ghostGroup3D.visible = true;
      ghostGroup3D.position.set(gx, 0, gy);
    } else if (ghostGroup3D) {
      ghostGroup3D.visible = false;
    }

    // Projectiles, Rayons Tesla/Laser, Ondes de choc et Particules en 3D
    while (fxGroup3D.children.length > 0) {
      fxGroup3D.remove(fxGroup3D.children[0]);
    }
    if (!geoCache3D.proj) {
      geoCache3D.proj = new THREE.SphereGeometry(1, 8, 8);
      geoCache3D.ring = new THREE.RingGeometry(0.86, 1.0, 24);
      geoCache3D.beamCyl = new THREE.CylinderGeometry(1, 1, 1, 6);
    }
    for (let i = projectiles.length - 1; i >= 0; i--) {
      const pr = projectiles[i];
      pr.prog += pr.speed * dt;
      if (pr.prog >= 1) { projectiles.splice(i, 1); continue; }
      const px = lerp(pr.x, pr.tx, pr.prog), py = lerp(pr.y, pr.ty, pr.prog);
      const arcH = 14 + Math.sin(pr.prog * Math.PI) * 16;
      const pm = new THREE.Mesh(geoCache3D.proj, getMat3D(pr.color, 0.1, 0.1, pr.color, 0.95));
      pm.position.set(px, arcH, py);
      pm.scale.setScalar(pr.r * 1.15);
      fxGroup3D.add(pm);
    }
    for (let i = shockwaves.length - 1; i >= 0; i--) {
      const sw = shockwaves[i];
      sw.life -= dt;
      if (sw.life <= 0) { shockwaves.splice(i, 1); continue; }
      const u = 1 - sw.life / sw.maxLife;
      const rad = lerp(sw.r, sw.maxR, u);
      const rm = new THREE.Mesh(geoCache3D.ring, getMat3D(sw.color, 0.2, 0.1, sw.color, 0.85, 1 - u));
      rm.rotation.x = -Math.PI / 2;
      rm.position.set(sw.x, 3.5, sw.y);
      rm.scale.setScalar(rad);
      fxGroup3D.add(rm);
    }
    for (let i = beams.length - 1; i >= 0; i--) {
      const bm = beams[i];
      bm.life -= dt;
      if (bm.life <= 0) { beams.splice(i, 1); continue; }
      const d = hypot(bm.x1, bm.y1, bm.x2, bm.y2);
      const beamMesh = new THREE.Mesh(
        geoCache3D.beamCyl,
        getMat3D(bm.color, 0.1, 0.1, bm.color, 0.95, clamp(bm.life / bm.maxLife, 0, 1))
      );
      beamMesh.scale.set(bm.w * 0.35, d, bm.w * 0.35);
      beamMesh.position.set((bm.x1 + bm.x2) * 0.5, 22, (bm.y1 + bm.y2) * 0.5);
      beamMesh.rotation.z = Math.PI / 2;
      beamMesh.rotation.y = -Math.atan2(bm.y2 - bm.y1, bm.x2 - bm.x1);
      fxGroup3D.add(beamMesh);
    }
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.life -= dt;
      if (p.life <= 0) { particles.splice(i, 1); continue; }
      p.x += p.vx * dt; p.y += p.vy * dt;
      const pm = new THREE.Mesh(geoCache3D.proj, getMat3D(p.color, 0.2, 0.1, p.color, 0.8));
      pm.position.set(p.x, 10 + p.life * 28, p.y);
      pm.scale.setScalar(p.r * 0.85);
      fxGroup3D.add(pm);
    }

    threeRenderer.render(threeScene, threeCam);
    return true;
  } catch (err) {
    console.error('3D render error, fallback to 2D:', err);
    threeReady = false;
    if (c3d) c3d.style.display = 'none';
    return false;
  }
}

/* ============================================================================
   RENDU PRINCIPAL DU MONDE 3D VUE DU DESSUS & MINIMAP (60 FPS)
   ============================================================================ */
function renderWorld(dt, now) {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (!state) {
    ctx.fillStyle = '#142818';
    ctx.fillRect(0, 0, W, H);
    return;
  }

  const panSpd = 720 / cam.z;
  let panX = 0, panY = 0;
  if (keys['arrowup'] || keys['z'] || keys['w']) panY -= 1;
  if (keys['arrowdown'] || keys['s']) panY += 1;
  if (keys['arrowleft'] || keys['q'] || keys['a']) panX -= 1;
  if (keys['arrowright'] || keys['d']) panX += 1;

  // Déplacement au bord / coins de l'écran avec la souris (Edge Scrolling)
  if (mouse.inside && !mouse.panning) {
    const edgeMargin = 26;
    const winW = window.innerWidth, winH = window.innerHeight;
    if (mouse.clientX <= edgeMargin) panX -= 1;
    if (mouse.clientX >= winW - edgeMargin) panX += 1;
    if (mouse.clientY <= edgeMargin) panY -= 1;
    if (mouse.clientY >= winH - edgeMargin) panY += 1;
  }

  if (panX !== 0 || panY !== 0) {
    const pLen = Math.hypot(panX, panY) || 1;
    cam.x += (panX / pLen) * panSpd * dt;
    cam.y += (panY / pLen) * panSpd * dt;
  }
  if (keys['pageup']) cam.pitch = clamp((cam.pitch || 70) + 38 * dt, 25, 82);
  if (keys['pagedown']) cam.pitch = clamp((cam.pitch || 70) - 38 * dt, 25, 82);
  cam.x = clamp(cam.x, 0, WORLD_SIZE);
  cam.y = clamp(cam.y, 0, WORLD_SIZE);

  let shX = 0, shY = 0;
  if (cam.shake > 0.2) {
    shX = (Math.random() - 0.5) * cam.shake * 2;
    shY = (Math.random() - 0.5) * cam.shake * 2;
    cam.shake *= Math.pow(0.04, dt);
  } else cam.shake = 0;

  updateFogCanvas(now);

  // 1. Rendu WebGL 3D (Three.js) vue isométrique + Surcouche tactique 2D projetée
  if (syncAndRenderThree3D(dt, now, shX, shY)) {
    ctx.clearRect(0, 0, W, H);
    const isoSin = Math.sin(((cam.pitch || 70) * Math.PI) / 180);

    // Points de Ralliement des bâtiments sélectionnés
    for (const b of state.buildings) {
      if (selectedBlds.has(b.id) && b.rallyX != null && b.rallyY != null && (BUILDINGS[b.kind]?.trains || []).length > 0) {
        const p1 = worldToScreen3D(b.x, b.y, 6);
        const p2 = worldToScreen3D(b.rallyX, b.rallyY, 4);
        ctx.save();
        ctx.strokeStyle = '#ffc531';
        ctx.lineWidth = 2.5;
        ctx.setLineDash([8, 6]);
        ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y); ctx.stroke();
        ctx.setLineDash([]);
        ctx.fillStyle = '#ffc531';
        ctx.strokeStyle = '#16181d';
        ctx.beginPath(); ctx.arc(p2.x, p2.y, 6, 0, TAU); ctx.fill(); ctx.stroke();
        ctx.restore();
      }
    }

    // Surcouche tactique des Bâtiments 3D (Cercles de sélection, Barres de PV, % Chantier, Nom + Ping sur QG)
    for (const b of state.buildings) {
      if (b.hp <= 0) continue;
      if (b.owner !== myId && !isVisibleToMe(b.x, b.y)) continue;
      const def = BUILDINGS[b.kind] || BUILDINGS.pylon;
      const selected = selectedBlds.has(b.id);
      const basePt = worldToScreen3D(b.x, b.y, 2);
      const topPt = worldToScreen3D(b.x, b.y, (def.height || 36) + 12);
      const radPx = b.radius * cam.z;

      if (selected) {
        ctx.save();
        ctx.strokeStyle = '#2fbf71';
        ctx.lineWidth = 3;
        ctx.setLineDash([10, 6]);
        ctx.beginPath();
        ctx.ellipse(basePt.x, basePt.y, radPx * 1.08, radPx * 1.08 * isoSin, 0, 0, TAU);
        ctx.stroke();
        ctx.restore();
      }

      if (b.constructing) {
        const pct = Math.floor((b.buildProg || 0) * 100);
        const hasBuilder = state.units.some((u) => u.kind === 'scv' && u.buildTargetId === b.id && u.onSite && u.hp > 0);
        ctx.save();
        ctx.font = '700 11px Bungee, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillStyle = '#16181d';
        ctx.fillRect(topPt.x - 36, topPt.y - 10, 72, 17);
        ctx.fillStyle = hasBuilder ? '#ffc531' : '#ff4b2b';
        ctx.fillText(hasBuilder ? `🔧 ${pct}%` : `⏸ ${pct}%`, topPt.x, topPt.y + 2);
        ctx.restore();
      }

      if (b.hp < b.maxHp || selected || b.constructing) {
        const bw = Math.max(40, radPx * 1.55);
        const pct = clamp(b.hp / b.maxHp, 0, 1);
        ctx.fillStyle = '#16181d';
        ctx.fillRect(topPt.x - bw / 2 - 1, topPt.y - 22, bw + 2, 7);
        ctx.fillStyle = pct > 0.45 ? '#2fbf71' : '#ff4b2b';
        ctx.fillRect(topPt.x - bw / 2, topPt.y - 21, bw * pct, 5);
      }

      if (b.kind === 'hq' && !b.constructing) {
        const ownerPlayer = state.players.find((p) => Number(p.id) === Number(b.owner));
        if (ownerPlayer) {
          const pingTxt = ownerPlayer.bot ? 'IA' : `${getPlayerPing(ownerPlayer)}ms`;
          const tag = `${ownerPlayer.name} · ${pingTxt}`;
          ctx.save();
          ctx.font = '700 11px "Chakra Petch", sans-serif';
          const tw = ctx.measureText(tag).width + 14;
          const bx = topPt.x - tw / 2, by = topPt.y - 42;
          ctx.fillStyle = 'rgba(22, 24, 29, 0.88)';
          ctx.strokeStyle = ownerPlayer.color || '#ffc531';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.roundRect(bx, by, tw, 18, 6);
          ctx.fill();
          ctx.stroke();
          ctx.fillStyle = '#fff8ea';
          ctx.textAlign = 'center';
          ctx.fillText(tag, topPt.x, by + 13);
          ctx.restore();
        }
      }
    }

    // Surcouche tactique des Unités 3D (Cercles de sélection & Barres de PV)
    for (const u of state.units) {
      if (u.hp <= 0 || u.boardedIn) continue;
      if (u.owner !== myId && !isVisibleToMe(u.x, u.y)) continue;
      const selected = selectedUnits.has(u.id);
      const isFly = !!u.flying;
      const baseAlt = isFly ? 42 : 2;
      const basePt = worldToScreen3D(u.x, u.y, baseAlt);
      const hUnit = isFly ? 58 : (u.kind === 'titan' ? 42 : (u.kind === 'tank' || u.kind === 'siege') ? 26 : 20);
      const topPt = worldToScreen3D(u.x, u.y, hUnit);
      const radPx = u.radius * cam.z;

      if (selected) {
        ctx.save();
        ctx.strokeStyle = '#2fbf71';
        ctx.lineWidth = 2.4;
        ctx.beginPath();
        ctx.ellipse(basePt.x, basePt.y, radPx + 4, (radPx + 4) * isoSin, 0, 0, TAU);
        ctx.stroke();
        ctx.restore();
      }

      if (u.hp < u.maxHp || selected) {
        const bw = Math.max(24, radPx * 2.1);
        const pct = clamp(u.hp / u.maxHp, 0, 1);
        ctx.fillStyle = '#16181d';
        ctx.fillRect(topPt.x - bw / 2 - 1, topPt.y - 10, bw + 2, 5);
        ctx.fillStyle = pct > 0.45 ? '#2fbf71' : '#ff4b2b';
        ctx.fillRect(topPt.x - bw / 2, topPt.y - 9, bw * pct, 3);
      }
    }

    // Marqueurs d'ordres au sol projetés en 3D
    for (let i = orderMarkers.length - 1; i >= 0; i--) {
      const om = orderMarkers[i];
      om.life -= dt;
      if (om.life <= 0) { orderMarkers.splice(i, 1); continue; }
      const f = clamp(om.life / om.maxLife, 0, 1);
      const r = (5 + f * 20) * cam.z;
      const pt = worldToScreen3D(om.x, om.y, 3);
      ctx.save();
      ctx.translate(pt.x, pt.y);
      ctx.strokeStyle = om.color;
      ctx.lineWidth = 2.8;
      ctx.beginPath(); ctx.ellipse(0, 0, r, r * isoSin, 0, 0, TAU); ctx.stroke();
      ctx.restore();
    }

    // Cercles de portée de construction / Scan Radar
    if (buildMode) {
      const def = BUILDINGS[buildMode];
      const check = canPlaceBuilding(state, myId, buildMode, mouse.wx, mouse.wy);
      const gx = check.snapX ?? mouse.wx, gy = check.snapY ?? mouse.wy;
      const pt = worldToScreen3D(gx, gy, 3);
      ctx.save();
      ctx.strokeStyle = check.ok ? '#2fbf71' : '#ff4b2b';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.ellipse(pt.x, pt.y, (def.radius + 4) * cam.z, (def.radius + 4) * cam.z * isoSin, 0, 0, TAU);
      ctx.stroke();
      if (def.range) {
        ctx.lineWidth = 2;
        ctx.setLineDash([8, 6]);
        ctx.beginPath();
        ctx.ellipse(pt.x, pt.y, def.range * cam.z, def.range * cam.z * isoSin, 0, 0, TAU);
        ctx.stroke();
      }
      ctx.restore();
    } else if (orderCursor === 'scan') {
      const pt = worldToScreen3D(mouse.wx, mouse.wy, 4);
      const scanR = Math.round(380 * ((MAP_DEFS[activeMapId] || MAP_DEFS.vallee).scanRadiusMult || 1.0));
      ctx.save();
      ctx.strokeStyle = '#1fc7c1';
      ctx.fillStyle = 'rgba(31, 199, 193, 0.14)';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.ellipse(pt.x, pt.y, scanR * cam.z, scanR * cam.z * isoSin, 0, 0, TAU);
      ctx.fill();
      ctx.stroke();
      ctx.restore();
    }

    // Rectangle de sélection (Box Selection StarCraft)
    if (mouse.down && mouse.dragStart) {
      ctx.save();
      ctx.strokeStyle = '#2fbf71';
      ctx.fillStyle = 'rgba(47, 191, 113, 0.16)';
      ctx.lineWidth = 2;
      const rx = Math.min(mouse.dragStart.sx, mouse.x);
      const ry = Math.min(mouse.dragStart.sy, mouse.y);
      const rw = Math.abs(mouse.x - mouse.dragStart.sx);
      const rh = Math.abs(mouse.y - mouse.dragStart.sy);
      ctx.fillRect(rx, ry, rw, rh);
      ctx.strokeRect(rx, ry, rw, rh);
      ctx.restore();
    }

    renderMinimap();
    return;
  }

  ctx.fillStyle = '#142818';
  ctx.fillRect(0, 0, W, H);

  ctx.save();
  ctx.translate(W / 2 + shX, H / 2 + shY);
  ctx.scale(cam.z, cam.z);
  ctx.translate(-cam.x, -cam.y);

  if (terrainCanvas) ctx.drawImage(terrainCanvas, 0, 0);

  for (const c of craters) {
    ctx.fillStyle = 'rgba(18, 20, 26, 0.34)';
    ctx.beginPath(); ctx.arc(c.x, c.y, c.r, 0, TAU); ctx.fill();
  }

  const curMapDef = MAP_DEFS[activeMapId] || MAP_DEFS.vallee;

  // Geysers de Gaz Plasma 3D
  for (const gey of GAS_GEYSERS) {
    ctx.save();
    ctx.translate(gey.x, gey.y);
    const rimCol = curMapDef.theme === 'volcanique' ? '#332428' : curMapDef.theme === 'cryo' ? '#26485e' : '#38463d';
    const topCol = curMapDef.theme === 'volcanique' ? '#4d2d34' : curMapDef.theme === 'cryo' ? '#376885' : '#4d5e52';
    drawPrism3D(ctx, gey.x, gey.y, makeNGon(26, 8), 0, 14, rimCol, topCol, false, 0.78);
    const oTop = project3DOffset(gey.x, gey.y, 14, false);
    ctx.fillStyle = '#101518';
    ctx.beginPath(); ctx.arc(oTop.ox, oTop.oy, 13, 0, TAU); ctx.fill();
    const pulse = 9 + Math.sin(now * 0.006 + gey.x) * 3;
    let plasmaGlow = 'rgba(47, 191, 113, 0.75)';
    if (curMapDef.theme === 'volcanique') plasmaGlow = 'rgba(255, 85, 0, 0.85)';
    else if (curMapDef.theme === 'cryo') plasmaGlow = 'rgba(0, 240, 255, 0.85)';
    ctx.fillStyle = plasmaGlow;
    ctx.beginPath(); ctx.arc(oTop.ox, oTop.oy, pulse, 0, TAU); ctx.fill();
    ctx.restore();
  }

  // Gisements de Minéraux 3D (Pyramides cristallines à facettes)
  for (const m of MINERAL_NODES) {
    const r = m.rich ? 21 : 17;
    let col = m.rich ? '#ffc531' : '#1fc7c1';
    if (curMapDef.theme === 'volcanique') col = m.rich ? '#ffd700' : '#ff4b2b';
    else if (curMapDef.theme === 'cryo') col = m.rich ? '#c084fc' : '#38bdf8';
    ctx.save();
    ctx.translate(m.x, m.y);
    ctx.fillStyle = m.rich ? 'rgba(255, 197, 49, 0.22)' : 'rgba(31, 199, 193, 0.22)';
    ctx.beginPath(); ctx.arc(0, 0, r * 1.4, 0, TAU); ctx.fill();
    drawPyramid3D(ctx, m.x, m.y, makeNGon(r, 6, 0.2), 0, m.rich ? 34 : 28, col, false);
    ctx.restore();
  }

  // Rochers 3D
  for (const rk of ROCKS) {
    ctx.save();
    ctx.translate(rk.x, rk.y);
    const rkCol = rk.col || (curMapDef.theme === 'volcanique' ? '#251c20' : curMapDef.theme === 'cryo' ? '#2b506b' : '#59544b');
    drawPrism3D(ctx, rk.x, rk.y, makeNGon(rk.r, 7, rk.seed), 0, 26, rkCol, shade(rkCol, 0.35), false, 0.72);
    ctx.restore();
  }

  // Connexions 3D des Murs voisins
  const walls = state.buildings.filter((b) => b.kind === 'wall' && b.hp > 0 && isVisibleToMe(b.x, b.y));
  ctx.strokeStyle = '#16181d'; ctx.lineWidth = 22;
  for (let i = 0; i < walls.length; i++) {
    for (let j = i + 1; j < walls.length; j++) {
      if (walls[i].team === walls[j].team && dist2(walls[i].x, walls[i].y, walls[j].x, walls[j].y) <= 58 * 58) {
        const o1 = project3DOffset(walls[i].x, walls[i].y, 16, false);
        const o2 = project3DOffset(walls[j].x, walls[j].y, 16, false);
        ctx.beginPath(); ctx.moveTo(walls[i].x + o1.ox, walls[i].y + o1.oy); ctx.lineTo(walls[j].x + o2.ox, walls[j].y + o2.oy); ctx.stroke();
      }
    }
  }
  ctx.strokeStyle = '#c8ba9b'; ctx.lineWidth = 14;
  for (let i = 0; i < walls.length; i++) {
    for (let j = i + 1; j < walls.length; j++) {
      if (walls[i].team === walls[j].team && dist2(walls[i].x, walls[i].y, walls[j].x, walls[j].y) <= 58 * 58) {
        const o1 = project3DOffset(walls[i].x, walls[i].y, 16, false);
        const o2 = project3DOffset(walls[j].x, walls[j].y, 16, false);
        ctx.beginPath(); ctx.moveTo(walls[i].x + o1.ox, walls[i].y + o1.oy); ctx.lineTo(walls[j].x + o2.ox, walls[j].y + o2.oy); ctx.stroke();
      }
    }
  }

  // Points de Ralliement des bâtiments sélectionnés
  for (const b of state.buildings) {
    if (selectedBlds.has(b.id) && b.rallyX != null && b.rallyY != null && (BUILDINGS[b.kind]?.trains || []).length > 0) {
      ctx.save();
      ctx.strokeStyle = '#ffc531';
      ctx.lineWidth = 2.5;
      ctx.setLineDash([8, 6]);
      ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(b.rallyX, b.rallyY); ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = '#ffc531';
      ctx.strokeStyle = '#16181d';
      ctx.beginPath(); ctx.arc(b.rallyX, b.rallyY, 7, 0, TAU); ctx.fill(); ctx.stroke();
      ctx.restore();
    }
  }

  // Tri de profondeur 3D (Painter's Algorithm : Arbres 3D, Unités 3D et Bâtiments 3D triés par Y et distance au centre caméra)
  const renderList = [];
  const viewW = (W / cam.z) * 0.65, viewH = (H / cam.z) * 0.65;
  for (const tr of TREES_3D) {
    if (Math.abs(tr.x - cam.x) <= viewW && Math.abs(tr.y - cam.y) <= viewH) {
      renderList.push({ k: 'tree', y: tr.y, obj: tr });
    }
  }
  for (const u of state.units) {
    if (u.hp <= 0 || u.boardedIn) continue;
    if (u.owner !== myId && !isVisibleToMe(u.x, u.y)) continue;
    let sortY = u.y;
    if (u.kind === 'scv' && u.onSite && u.buildTargetId) {
      const tb = state.buildings.find((b) => b.id === u.buildTargetId && b.constructing);
      if (tb) sortY = Math.max(u.y, tb.y + 1);
    }
    renderList.push({ k: 'unit', y: sortY, obj: u });
  }
  for (const b of state.buildings) {
    if (b.hp <= 0) continue;
    if (b.owner !== myId && !isVisibleToMe(b.x, b.y)) continue;
    renderList.push({ k: 'bld', y: b.y, obj: b });
  }
  renderList.sort((a, b) => a.y - b.y);

  for (const item of renderList) {
    if (item.k === 'tree') {
      drawTree3D(ctx, item.obj);
    } else if (item.k === 'unit') {
      const u = item.obj;
      const owner = state.players.find((p) => p.id === u.owner);
      drawUnit(ctx, u, owner ? owner.color : '#888', selectedUnits.has(u.id), now, false);
    } else {
      const b = item.obj;
      const owner = state.players.find((p) => p.id === b.owner);
      drawBuilding(ctx, b, owner ? owner.color : '#888', selectedBlds.has(b.id), now, false);
    }
  }

  // Projectiles, Ondes de choc & Éclairs
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (let i = projectiles.length - 1; i >= 0; i--) {
    const pr = projectiles[i];
    pr.prog += pr.speed * dt;
    if (pr.prog >= 1) { projectiles.splice(i, 1); continue; }
    const px = lerp(pr.x, pr.tx, pr.prog), py = lerp(pr.y, pr.ty, pr.prog);
    const bx = lerp(pr.x, pr.tx, Math.max(0, pr.prog - 0.18)), by = lerp(pr.y, pr.ty, Math.max(0, pr.prog - 0.18));
    ctx.strokeStyle = pr.color; ctx.lineWidth = pr.r * 1.6; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(px, py); ctx.stroke();
    ctx.fillStyle = '#fff8ea';
    ctx.beginPath(); ctx.arc(px, py, pr.r * 0.7, 0, TAU); ctx.fill();
  }
  for (let i = shockwaves.length - 1; i >= 0; i--) {
    const sw = shockwaves[i];
    sw.life -= dt;
    if (sw.life <= 0) { shockwaves.splice(i, 1); continue; }
    const u = 1 - sw.life / sw.maxLife;
    ctx.globalAlpha = 1 - u;
    ctx.strokeStyle = sw.color; ctx.lineWidth = 4 * (1 - u) + 1;
    ctx.beginPath(); ctx.arc(sw.x, sw.y, lerp(sw.r, sw.maxR, u), 0, TAU); ctx.stroke();
  }
  for (let i = beams.length - 1; i >= 0; i--) {
    const bm = beams[i];
    bm.life -= dt;
    if (bm.life <= 0) { beams.splice(i, 1); continue; }
    ctx.globalAlpha = clamp(bm.life / bm.maxLife, 0, 1);
    ctx.strokeStyle = bm.color; ctx.lineWidth = bm.w; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(bm.x1, bm.y1);
    if (bm.tesla) {
      for (let s = 1; s <= 3; s++) {
        const f = s / 4;
        ctx.lineTo(lerp(bm.x1, bm.x2, f) + (Math.random() - 0.5) * 32, lerp(bm.y1, bm.y2, f) + (Math.random() - 0.5) * 32);
      }
    }
    ctx.lineTo(bm.x2, bm.y2); ctx.stroke();
  }
  ctx.restore();

  // Marqueurs d'ordres au sol façon StarCraft (anneau + 4 flèches convergentes)
  for (let i = orderMarkers.length - 1; i >= 0; i--) {
    const om = orderMarkers[i];
    om.life -= dt;
    if (om.life <= 0) { orderMarkers.splice(i, 1); continue; }
    const f = clamp(om.life / om.maxLife, 0, 1);
    const r = 5 + f * 20;
    ctx.save();
    ctx.translate(om.x, om.y);
    ctx.strokeStyle = om.color;
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.stroke();
    for (let k = 0; k < 4; k++) {
      ctx.rotate(Math.PI / 2);
      ctx.beginPath();
      ctx.moveTo(r + 8, -4);
      ctx.lineTo(r + 2, 0);
      ctx.lineTo(r + 8, 4);
      ctx.stroke();
    }
    ctx.restore();
  }

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= dt;
    if (p.life <= 0) { particles.splice(i, 1); continue; }
    p.x += p.vx * dt; p.y += p.vy * dt;
    ctx.fillStyle = p.color; ctx.strokeStyle = '#16181d'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, TAU); ctx.fill(); ctx.stroke();
  }

  // Brouillard de Guerre (Fog of War)
  ctx.drawImage(fogCanvas, 0, 0, WORLD_SIZE, WORLD_SIZE);

  for (const sc of state.scans) {
    ctx.save();
    ctx.strokeStyle = '#1fc7c1'; ctx.lineWidth = 3; ctx.setLineDash([12, 8]);
    ctx.beginPath(); ctx.arc(sc.x, sc.y, sc.r, 0, TAU); ctx.stroke();
    ctx.restore();
  }

  if (state.phase === 4) {
    ctx.save();
    ctx.strokeStyle = '#ff4b2b'; ctx.lineWidth = 10; ctx.setLineDash([24, 14]);
    ctx.beginPath(); ctx.arc(HALF_W, HALF_W, state.stormRadius, 0, TAU); ctx.stroke();
    ctx.restore();
  }

  // Aperçu fantôme 3D du bâtiment à poser (uniquement quand un VCS est sélectionné)
  if (buildMode) {
    const def = BUILDINGS[buildMode];
    const check = canPlaceBuilding(state, myId, buildMode, mouse.wx, mouse.wy);
    const me = state.players.find((p) => p.id === myId);
    const gx = check.snapX ?? mouse.wx, gy = check.snapY ?? mouse.wy;
    ctx.save();
    if (def.range) {
      ctx.strokeStyle = check.ok ? '#2fbf71' : '#ff4b2b';
      ctx.lineWidth = 2.5; ctx.setLineDash([8, 6]);
      ctx.beginPath(); ctx.arc(gx, gy, def.range, 0, TAU); ctx.stroke();
      ctx.setLineDash([]);
    }
    ctx.globalAlpha = 0.74;
    drawBuilding(ctx, { kind: buildMode, x: gx, y: gy, radius: def.radius, hp: def.hp, maxHp: def.hp, aimA: 0 }, check.ok ? (me ? me.color : '#2fbf71') : '#ff4b2b', false, now, false);
    ctx.globalAlpha = 1;
    ctx.strokeStyle = check.ok ? '#2fbf71' : '#ff4b2b';
    ctx.lineWidth = 3.5;
    ctx.beginPath(); ctx.arc(gx, gy, def.radius + 4, 0, TAU); ctx.stroke();
    ctx.restore();
  } else if (orderCursor === 'scan') {
    const scanR = Math.round(380 * ((MAP_DEFS[activeMapId] || MAP_DEFS.vallee).scanRadiusMult || 1.0));
    ctx.save();
    ctx.strokeStyle = '#1fc7c1'; ctx.fillStyle = 'rgba(31, 199, 193, 0.15)'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(mouse.wx, mouse.wy, scanR, 0, TAU); ctx.fill(); ctx.stroke();
    ctx.restore();
  }

  if (mouse.down && mouse.dragStart) {
    ctx.save();
    ctx.strokeStyle = '#2fbf71';
    ctx.fillStyle = 'rgba(47, 191, 113, 0.16)';
    ctx.lineWidth = 2 / cam.z;
    const rx = Math.min(mouse.dragStart.wx, mouse.wx);
    const ry = Math.min(mouse.dragStart.wy, mouse.wy);
    const rw = Math.abs(mouse.wx - mouse.dragStart.wx);
    const rh = Math.abs(mouse.wy - mouse.dragStart.wy);
    ctx.fillRect(rx, ry, rw, rh);
    ctx.strokeRect(rx, ry, rw, rh);
    ctx.restore();
  }

  ctx.restore();
  renderMinimap();
}

function renderMinimap() {
  if (!state) return;
  const mw = miniCvs.width, mh = miniCvs.height;
  const sx = mw / WORLD_SIZE, sy = mh / WORLD_SIZE;
  if (terrainCanvas) miniCtx.drawImage(terrainCanvas, 0, 0, mw, mh);

  const curMapDef = MAP_DEFS[activeMapId] || MAP_DEFS.vallee;
  for (const m of MINERAL_NODES) {
    let col = m.rich ? '#ffc531' : '#1fc7c1';
    if (curMapDef.theme === 'volcanique') col = m.rich ? '#ffd700' : '#ff5522';
    else if (curMapDef.theme === 'cryo') col = m.rich ? '#c084fc' : '#38bdf8';
    miniCtx.fillStyle = col;
    miniCtx.fillRect(m.x * sx - 1.5, m.y * sy - 1.5, 3, 3);
  }
  for (const b of state.buildings) {
    if (b.hp <= 0) continue;
    if (b.owner !== myId && !isVisibleToMe(b.x, b.y)) continue;
    const owner = state.players.find((p) => p.id === b.owner);
    miniCtx.fillStyle = owner ? owner.color : '#fff';
    const sz = b.kind === 'hq' ? 6 : 4;
    miniCtx.fillRect(b.x * sx - sz / 2, b.y * sy - sz / 2, sz, sz);
  }
  for (const u of state.units) {
    if (u.hp <= 0 || u.boardedIn) continue;
    if (u.owner !== myId && !isVisibleToMe(u.x, u.y)) continue;
    const owner = state.players.find((p) => p.id === u.owner);
    miniCtx.fillStyle = owner ? owner.color : '#fff';
    miniCtx.fillRect(u.x * sx - 1.5, u.y * sy - 1.5, 2.5, 2.5);
  }
  miniCtx.drawImage(fogCanvas, 0, 0, mw, mh);

  const isoSin = Math.sin(((cam.pitch || 70) * Math.PI) / 180);
  const vw = (W / cam.z) * sx, vh = ((H / cam.z) / isoSin) * sy;
  miniCtx.strokeStyle = '#fff8ea';
  miniCtx.lineWidth = 1.6;
  miniCtx.strokeRect(cam.x * sx - vw / 2, cam.y * sy - vh / 2, vw, vh);
}

/* ============================================================================
   DÉMARRAGE DE PARTIE & SYNCHRONISATION RÉSEAU (HUB BRIDGE)
   ============================================================================ */
let lastBootInfo = null;
let tickInterval = null;
let botInterval = null;
let netSyncTick = 0;
let pendingNetFx = [];

buildTerrainCanvas();

function packState(s) {
  const r1 = (v) => Math.round((Number(v) || 0) * 10) / 10;
  const r2 = (v) => Math.round((Number(v) || 0) * 100) / 100;
  return {
    time: r2(s.time),
    blitz: s.blitz,
    map: s.map || activeMapId || 'vallee',
    mode: s.mode,
    is2v2: s.is2v2,
    level: s.level,
    phase: s.phase,
    stormRadius: Math.round(s.stormRadius),
    dmgMult: s.dmgMult,
    nextId: s.nextId,
    over: s.over,
    winnerTeam: s.winnerTeam,
    ranking: s.ranking,
    ack: { ...clientAckSeq },
    players: s.players.map((p) => ({
      id: p.id,
      name: p.name,
      color: p.color,
      bot: p.bot,
      team: p.team,
      minerals: r1(p.minerals),
      gas: r1(p.gas),
      score: Math.round(p.score),
      dead: p.dead,
      spawnX: p.spawnX,
      spawnY: p.spawnY,
      nextUnitSeq: p.nextUnitSeq || 20,
      ping: p.bot ? 0 : getPlayerPing(p),
      upgrades: p.upgrades ? { ...p.upgrades } : {},
    })),
    buildings: s.buildings.map((b) => ({
      id: b.id,
      kind: b.kind,
      owner: b.owner,
      team: b.team,
      x: Math.round(b.x),
      y: Math.round(b.y),
      hp: Math.round(b.hp),
      maxHp: b.maxHp,
      radius: b.radius,
      cd: r2(b.cd),
      aimA: r2(b.aimA),
      constructing: b.constructing,
      buildStarted: b.buildStarted,
      buildProg: r2(b.buildProg),
      buildTime: b.buildTime,
      queue: b.queue,
      qTimer: r2(b.qTimer),
      qTotal: r2(b.qTotal),
      rallyX: Math.round(b.rallyX ?? b.x),
      rallyY: Math.round(b.rallyY ?? b.y),
      geyserId: b.geyserId,
    })),
    units: s.units.map((u) => ({
      id: u.id,
      kind: u.kind,
      owner: u.owner,
      team: u.team,
      x: r1(u.x),
      y: r1(u.y),
      vx: r1(u.vx),
      vy: r1(u.vy),
      a: r2(u.a),
      hp: Math.round(u.hp),
      maxHp: u.maxHp,
      radius: u.radius,
      cd: r2(u.cd),
      mode: u.mode,
      orderX: u.orderX != null ? Math.round(u.orderX) : null,
      orderY: u.orderY != null ? Math.round(u.orderY) : null,
      targetEntId: u.targetEntId,
      harvestId: u.harvestId,
      gatherT: r2(u.gatherT),
      carryType: u.carryType,
      carryAmt: u.carryAmt,
      buildTargetId: u.buildTargetId,
      onSite: !!u.onSite,
      weldTimer: r2(u.weldTimer),
      weldX: u.weldX != null ? r1(u.weldX) : null,
      weldY: u.weldY != null ? r1(u.weldY) : null,
      stimT: r2(u.stimT),
      sieged: !!u.sieged,
      flying: !!u.flying,
      cargo: Array.isArray(u.cargo) ? [...u.cargo] : [],
      boardedIn: u.boardedIn || null,
      healingTargetId: u.healingTargetId || null,
    })),
    scans: s.scans.map((sc) => ({
      x: Math.round(sc.x),
      y: Math.round(sc.y),
      team: sc.team,
      r: sc.r,
      timer: r2(sc.timer),
    })),
  };
}

function reconcileGuestState(prev, incoming) {
  if (!incoming) return prev;
  if (incoming.map && incoming.map !== activeMapId) {
    initMap(incoming.map);
  }
  if (!prev) return incoming;
  const oldPos = new Map();
  for (const u of prev.units) {
    oldPos.set(u.id, { x: u.x, y: u.y });
  }

  const acked = (incoming.ack && incoming.ack[myId]) || 0;
  const nowP = performance.now();
  while (pendingCmds.length && (pendingCmds[0].seq <= acked || nowP - pendingCmds[0].ts > 1500)) {
    pendingCmds.shift();
  }

  if (pendingCmds.length > 0) {
    const dummyFx = [];
    for (const pc of pendingCmds) {
      executeCommand(incoming, myId, pc.cmd, dummyFx);
    }
  }

  for (const u of incoming.units) {
    const o = oldPos.get(u.id);
    if (o) {
      const err = hypot(o.x, o.y, u.x, u.y);
      if (err > 0.3 && err < 95) {
        u.x = lerp(o.x, u.x, 0.45);
        u.y = lerp(o.y, u.y, 0.45);
      }
    }
  }
  return incoming;
}

function startTickLoop() {
  clearInterval(tickInterval);
  const H = window.HubBridge;
  tickInterval = setInterval(() => {
    if (!state || state.over) return;
    const fx = [];
    stepWorld(state, TICK_DT, fx);
    handleFxEvents(fx);
    if (role === 'host' && H && H.embedded) {
      for (const e of fx) {
        if (e.k === 'ELIM' || e.k === 'PHASE') pendingNetFx.push(e);
      }
      netSyncTick++;
      if (netSyncTick % 5 === 0 || state.over) {
        H.send('all', { t: 'st', s: packState(state), fx: pendingNetFx.splice(0) });
      }
    }
  }, 1000 / TICK_RATE);
}

function startMatch(info) {
  lastBootInfo = info;
  reportedResult = false;
  selectedUnits.clear();
  selectedBlds.clear();
  buildMode = null;
  orderCursor = null;
  exploredGrid.fill(0);
  if (exploredCtx) exploredCtx.clearRect(0, 0, FOG_RES, FOG_RES);
  lastFogUpdate = 0;
  pendingCmds.length = 0;
  netSyncTick = 0;
  pendingNetFx = [];
  craters = [];
  particles = [];
  shockwaves = [];
  projectiles = [];
  beams = [];
  orderMarkers = [];

  clearInterval(tickInterval);
  clearInterval(botInterval);
  Sfx.wake();

  const H = window.HubBridge;
  role = H && H.embedded ? info.role : 'solo';
  myId = H && H.embedded ? info.myId : 0;

  if (role === 'guest') {
    startTickLoop();
    H.send('host', { t: 'sync' });
    return;
  }

  const settings = (info && info.settings) || { mode: 'ffa', pace: 'standard', bots: 1, level: 'normal' };
  const humans = H && H.embedded && Array.isArray(H.players) && H.players.length
    ? H.players.map((p) => ({ id: p.id, name: p.name, color: p.color, bot: false }))
    : [{ id: 0, name: 'Commandant', color: PALETTE[0], bot: false }];

  const roster = [...humans];
  const wantBots = role === 'solo'
    ? Math.max(1, Math.min(3, Number(settings.bots ?? 1)))
    : Math.max(0, Math.min(Number(settings.bots ?? 1), 4 - roster.length));
  const finalBots = roster.length + wantBots < 2 ? 2 - roster.length : wantBots;
  const usedColors = new Set(roster.map((p) => p.color));

  for (let k = 0; k < finalBots && roster.length < 4; k++) {
    const col = PALETTE.find((c) => !usedColors.has(c)) || PALETTE[roster.length % PALETTE.length];
    usedColors.add(col);
    roster.push({ id: 100 + k, name: BOT_NAMES[k], color: col, bot: true });
  }

  state = createInitialState(roster, settings);
  if (typeof setupThreeMapScenery === 'function' && threeScene) {
    setupThreeMapScenery(state.map || activeMapId);
  }
  updateFogCanvas(performance.now() + 100);
  centerOnMyHq();
  renderConsoleUI(true);
  updateHudUI();

  if (role === 'host' && H && H.embedded) {
    H.send('all', { t: 'st', s: packState(state), fx: [] });
  }

  startTickLoop();

  const botEvery = settings.level === 'expert' ? 850 : settings.level === 'facile' ? 2000 : 1250;
  botInterval = setInterval(() => {
    if (!state || state.over) return;
    const fx = [];
    runBots(state, fx);
    handleFxEvents(fx);
  }, botEvery);
}

if (window.HubBridge && HubBridge.embedded) {
  let centeredOnce = false;
  let lastStateAt = performance.now();

  HubBridge.on('init', (info) => {
    centeredOnce = false;
    lastStateAt = performance.now();
    if (info && info.pings) Object.assign(playerPings, info.pings);
    startMatch(info);
    HubBridge.signalReady();
  });

  HubBridge.on('pings', (pMap) => {
    if (pMap) Object.assign(playerPings, pMap);
  });

  setInterval(() => {
    if (!window.HubBridge || !HubBridge.embedded) return;
    if (HubBridge.pings) Object.assign(playerPings, HubBridge.pings);
    if (role === 'guest') {
      const now = performance.now();
      HubBridge.send('host', { t: 'gping', ts: now, myPing: playerPings[myId] });
      if (now - lastStateAt > 2500) {
        HubBridge.send('host', { t: 'sync' });
      }
    }
  }, 1800);

  HubBridge.on('msg', (from, m) => {
    if (!m || typeof m !== 'object') return;
    if (role === 'host') {
      if (m.t === 'sync' && state) {
        HubBridge.send(from, { t: 'st', s: packState(state), fx: [] });
      } else if (m.t === 'gping') {
        if (Number.isFinite(m.myPing)) playerPings[from] = Math.max(1, Math.round(m.myPing));
        HubBridge.send(from, { t: 'gpong', ts: m.ts, pings: playerPings });
      } else if (m.t === 'cmd' && m.cmd && state) {
        if (m.seq) clientAckSeq[from] = Math.max(clientAckSeq[from] || 0, m.seq);
        const fx = [];
        const res = executeCommand(state, from, m.cmd, fx);
        if (res.ok) {
          handleFxEvents(fx);
          HubBridge.send('all', { t: 'rcmd', p: from, cmd: m.cmd, seq: m.seq });
        } else if (m.seq) {
          HubBridge.send(from, { t: 'rcmd', p: from, cmd: null, seq: m.seq });
        }
      }
    } else if (role === 'guest') {
      if (m.t === 'gpong') {
        if (m.pings) Object.assign(playerPings, m.pings);
        if (m.ts) playerPings[myId] = Math.max(1, Math.round(performance.now() - m.ts));
      } else if (m.t === 'st' && m.s) {
        lastStateAt = performance.now();
        for (const p of m.s.players || []) {
          if (!p.bot && p.ping && Number(p.id) !== Number(myId)) playerPings[p.id] = p.ping;
        }
        state = reconcileGuestState(state, m.s);
        if (!centeredOnce) {
          centeredOnce = true;
          centerOnMyHq();
          renderConsoleUI(true);
        }
        if (m.fx && m.fx.length) handleFxEvents(m.fx);
      } else if (m.t === 'rcmd' && state) {
        lastStateAt = performance.now();
        if (Number(m.p) === Number(myId) && m.seq) {
          clientAckSeq[myId] = Math.max(clientAckSeq[myId] || 0, m.seq);
          while (pendingCmds.length && pendingCmds[0].seq <= m.seq) pendingCmds.shift();
        } else if (Number(m.p) !== Number(myId) && m.cmd) {
          const fx = [];
          executeCommand(state, m.p, m.cmd, fx);
          handleFxEvents(fx);
        }
      }
    }
  });
} else {
  startMatch({ role: 'solo', myId: 0, settings: { mode: 'ffa', pace: 'standard', bots: 1, level: 'normal' } });
}

let lastFrame = performance.now();
function loop(now) {
  requestAnimationFrame(loop);
  const dt = Math.min(0.05, Math.max(0.001, (now - lastFrame) / 1000));
  lastFrame = now;
  try {
    renderWorld(dt, now);
    updateHudUI();
  } catch (err) {
    console.error('Frame error:', err);
  }
}
requestAnimationFrame(loop);
</script>
