window.addEventListener('keydown', (e) => {
  if (e.target && e.target.tagName === 'INPUT') return;
  const k = e.key.toLowerCase();
  keys[k] = true;
  if (k === 'escape') { buildMode = null; strikeMode = false; selectedUnits.clear(); updateDockUI(); }
  if (k === ' ') { e.preventDefault(); centerOnMyHq(); }
  const buildMap = { '1': 'extractor', '2': 'pylon', '3': 'barracks', '4': 'factory', '5': 'turret', '6': 'tesla', '7': 'wall' };
  if (buildMap[k]) {
    strikeMode = false;
    buildMode = buildMode === buildMap[k] ? null : buildMap[k];
    updateDockUI();
  }
  const squadMap = { 'q': 'commando', 'w': 'sappers', 'e': 'tanks', 'r': 'titan' };
  if (squadMap[k]) sendCommand({ op: 'SQUAD', squad: squadMap[k] });
  if (k === 'f') { buildMode = null; strikeMode = !strikeMode; updateDockUI(); }
});

window.addEventListener('keyup', (e) => {
  keys[e.key.toLowerCase()] = false;
});

cvs.addEventListener('contextmenu', (e) => e.preventDefault());

cvs.addEventListener('wheel', (e) => {
  e.preventDefault();
  const factor = e.deltaY < 0 ? 1.1 : 0.9;
  cam.z = clamp(cam.z * factor, 0.42, 1.35);
}, { passive: false });

cvs.addEventListener('pointerdown', (e) => {
  const rect = cvs.getBoundingClientRect();
  mouse.x = e.clientX - rect.left;
  mouse.y = e.clientY - rect.top;
  const w = screenToWorld(mouse.x, mouse.y);
  mouse.wx = w.x; mouse.wy = w.y;

  if (e.button === 1 || (e.button === 0 && e.altKey)) {
    mouse.panning = true;
    mouse.panStart = { x: e.clientX, y: e.clientY, cx: cam.x, cy: cam.y };
    return;
  }

  if (e.button === 2) {
    if (buildMode || strikeMode) {
      buildMode = null; strikeMode = false; updateDockUI();
      return;
    }
    sendCommand({ op: 'ORDER', x: w.x, y: w.y, unitIds: [...selectedUnits] });
    shockwaves.push({ x: w.x, y: w.y, r: 6, maxR: 36, color: '#ffc531', life: 0.28, maxLife: 0.28 });
    return;
  }

  if (e.button === 0) {
    if (strikeMode) {
      sendCommand({ op: 'STRIKE', x: w.x, y: w.y });
      strikeMode = false;
      updateDockUI();
      return;
    }
    if (buildMode) {
      sendCommand({ op: 'BUILD', kind: buildMode, x: w.x, y: w.y });
      if (buildMode !== 'wall' && !e.shiftKey) {
        buildMode = null;
        updateDockUI();
      }
      return;
    }
    mouse.down = true;
    mouse.dragStart = { sx: mouse.x, sy: mouse.y, wx: w.x, wy: w.y };
  }
});

window.addEventListener('pointermove', (e) => {
  const rect = cvs.getBoundingClientRect();
  mouse.x = e.clientX - rect.left;
  mouse.y = e.clientY - rect.top;
  const w = screenToWorld(mouse.x, mouse.y);
  mouse.wx = w.x; mouse.wy = w.y;

  if (mouse.panning && mouse.panStart) {
    cam.x = clamp(mouse.panStart.cx - (e.clientX - mouse.panStart.x) / cam.z, 0, WORLD_SIZE);
    cam.y = clamp(mouse.panStart.cy - (e.clientY - mouse.panStart.y) / cam.z, 0, WORLD_SIZE);
  }
});

window.addEventListener('pointerup', () => {
  if (mouse.panning) { mouse.panning = false; mouse.panStart = null; return; }
  if (!mouse.down) return;
  mouse.down = false;
  if (!state || !mouse.dragStart) return;

  const dx = Math.abs(mouse.x - mouse.dragStart.sx);
  const dy = Math.abs(mouse.y - mouse.dragStart.sy);
  selectedUnits.clear();

  if (dx > 12 || dy > 12) {
    const x1 = Math.min(mouse.dragStart.wx, mouse.wx), x2 = Math.max(mouse.dragStart.wx, mouse.wx);
    const y1 = Math.min(mouse.dragStart.wy, mouse.wy), y2 = Math.max(mouse.dragStart.wy, mouse.wy);
    for (const u of state.units) {
      if (u.owner === myId && u.x >= x1 && u.x <= x2 && u.y >= y1 && u.y <= y2) {
        selectedUnits.add(u.id);
      }
    }
  } else {
    for (const u of state.units) {
      if (u.owner === myId && dist2(u.x, u.y, mouse.wx, mouse.wy) <= (u.radius + 14) ** 2) {
        selectedUnits.add(u.id);
        break;
      }
    }
  }
  mouse.dragStart = null;
});

miniCvs.addEventListener('pointerdown', (e) => {
  const r = miniCvs.getBoundingClientRect();
  const wx = ((e.clientX - r.left) / r.width) * WORLD_SIZE;
  const wy = ((e.clientY - r.top) / r.height) * WORLD_SIZE;
  if (e.button === 2) {
    sendCommand({ op: 'ORDER', x: wx, y: wy, unitIds: [...selectedUnits] });
  } else {
    cam.x = clamp(wx, 0, WORLD_SIZE);
    cam.y = clamp(wy, 0, WORLD_SIZE);
  }
});

function updateDockUI() {
  if (!state) return;
  const me = state.players.find((p) => p.id === myId);
  if (!me) return;

  for (const btn of $$('[data-build]')) {
    const k = btn.dataset.build;
    const def = BUILDINGS[k];
    btn.classList.toggle('sel', buildMode === k);
    btn.disabled = me.tier < (def.tier || 1);
    btn.classList.toggle('cant', me.energy < def.cost);
  }
  for (const btn of $$('[data-squad]')) {
    const k = btn.dataset.squad;
    const sq = SQUADS[k];
    btn.disabled = me.tier < sq.tier;
    btn.classList.toggle('cant', me.energy < sq.cost);
  }
  const stBtn = $('#btnStrike');
  stBtn.classList.toggle('sel', strikeMode);
  stBtn.classList.toggle('cant', me.energy < STRIKE_COST || me.strikeCd > 0);
  const cdOv = $('#uiStrikeCd');
  if (me.strikeCd > 0) {
    cdOv.hidden = false;
    cdOv.textContent = Math.ceil(me.strikeCd) + 's';
  } else {
    cdOv.hidden = true;
  }
}

function updateHudUI() {
  if (!state) return;
  const me = state.players.find((p) => p.id === myId);
  if (me) {
    $('#uiEnergy').textContent = Math.floor(me.energy);
    $('#uiRate').textContent = `+${me.income}/s`;
    $('#uiTierLbl').textContent = `QG Niv. ${me.tier}`;
    const upBtn = $('#btnUpHq');
    if (me.tier >= 3) {
      upBtn.textContent = 'QG Niv. Max';
      upBtn.disabled = true;
    } else {
      const next = me.tier + 1, cost = UPGRADE_COSTS[next];
      upBtn.textContent = `Passer Niv. ${next} (${cost}⚡)`;
      upBtn.disabled = me.energy < cost;
    }
  }

  const sec = Math.floor(state.time);
  const mm = String(Math.floor(sec / 60)).padStart(2, '0');
  const ss = String(sec % 60).padStart(2, '0');
  $('#uiClock').textContent = `${mm}:${ss}`;
  const phaseNames = {
    1: 'Phase 1 · Ouverture agressive',
    2: 'Phase 2 · Cristaux surchargés',
    3: 'Phase 3 · Assauts lourds',
    4: 'MORT SUBITE · Dégâts ×2',
  };
  $('#uiPhaseName').textContent = phaseNames[state.phase] || '';
  $('#uiPhase').classList.toggle('sd', state.phase === 4);

  if (me) {
    const box = $('#targetBtns');
    const enemies = state.players.filter((p) => p.team !== me.team && !p.dead);
    const items = [
      { id: -1, label: 'Auto', color: null },
      { id: -2, label: '💎 Centre', color: null },
      ...enemies.map((e) => ({ id: e.id, label: e.name, color: e.color })),
    ];
    const sig = items.map((i) => `${i.id}:${me.targetId === i.id}`).join('|');
    if (box.dataset.sig !== sig) {
      box.dataset.sig = sig;
      box.innerHTML = items.map((it) => `<button class="tbtn ${me.targetId === it.id ? 'sel' : ''}" data-t="${it.id}">
        ${it.color ? `<i class="dot" style="background:${it.color}"></i>` : ''}${it.label}</button>`).join('');
      for (const b of box.querySelectorAll('button')) {
        b.onclick = () => sendCommand({ op: 'TARGET', targetId: Number(b.dataset.t) });
      }
    }
  }

  const rosterHtml = state.players.map((p) => {
    const hq = state.buildings.find((b) => b.owner === p.id && b.kind === 'hq');
    const pct = hq ? Math.max(0, Math.round((hq.hp / hq.maxHp) * 100)) : 0;
    return `<div class="p-row ${p.dead ? 'dead' : ''}">
      <span class="dot" style="background:${p.color}"></span>
      <span class="nm">${p.name}${p.id === myId ? ' (toi)' : ''}</span>
      <span class="hpbar"><i style="width:${pct}%;background:${pct > 45 ? '#2fbf71' : '#ff4b2b'}"></i></span>
    </div>`;
  }).join('');
  $('#uiRoster').innerHTML = rosterHtml;

  const myUnitsCount = state.units.filter((u) => u.owner === myId).length;
  $('#uiPop').textContent = `${myUnitsCount}/42 unités`;

  updateDockUI();

  const modal = $('#endModal');
  if (state.over && modal.hidden) {
    modal.hidden = false;
    const won = me && !me.dead && me.team === state.winnerTeam;
    $('#endTitle').textContent = won ? '🏆 Victoire !' : '💥 Défaite';
    $('#endSub').textContent = won
      ? 'Ton bastion règne en maître sur l’arène !'
      : 'Ton QG a été détruit dans la bataille.';
    const ordered = state.ranking.map((id) => state.players.find((p) => p.id === id)).filter(Boolean);
    $('#endRanks').innerHTML = ordered.map((p, idx) => `<li>
      <span class="rk">${idx < 3 ? ['🥇', '🥈', '🥉'][idx] : idx + 1}</span>
      <span class="dot" style="background:${p.color}"></span>
      <span>${p.name}${p.bot ? ' 🤖' : ''}</span>
      <span class="sc">${p.score} pts</span>
    </li>`).join('');

    if (!reportedResult && (role === 'host' || role === 'solo') && window.HubBridge && HubBridge.embedded) {
      reportedResult = true;
      HubBridge.report({
        id: `bastion-${Date.now()}`,
        mode: state.mode === '2v2' ? '2v2' : 'Arène',
        players: ordered.map((p, idx) => ({
          id: p.bot ? null : p.id,
          name: p.name,
          color: p.color,
          bot: !!p.bot,
          rank: idx + 1,
          score: p.score,
        })),
      });
    }
  } else if (!state.over && !modal.hidden) {
    modal.hidden = true;
  }
}

/* ============================================================================
   BOUCLE DE RENDU DU MONDE 2.5D (60 FPS)
   ============================================================================ */
function renderWorld(dt, now) {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = '#1e3f24';
  ctx.fillRect(0, 0, W, H);
  if (!state) return;

  const panSpd = 640 / cam.z;
  if (keys['z'] || keys['w'] || keys['arrowup']) cam.y -= panSpd * dt;
  if (keys['s'] || keys['arrowdown']) cam.y += panSpd * dt;
  if (keys['q'] || keys['a'] || keys['arrowleft']) cam.x -= panSpd * dt;
  if (keys['d'] || keys['arrowright']) cam.x += panSpd * dt;
  cam.x = clamp(cam.x, 0, WORLD_SIZE);
  cam.y = clamp(cam.y, 0, WORLD_SIZE);

  let shX = 0, shY = 0;
  if (cam.shake > 0.2) {
    shX = (Math.random() - 0.5) * cam.shake * 2;
    shY = (Math.random() - 0.5) * cam.shake * 2;
    cam.shake *= Math.pow(0.04, dt);
  } else cam.shake = 0;

  ctx.save();
  ctx.translate(W / 2 + shX, H / 2 + shY);
  ctx.scale(cam.z, cam.z);
  ctx.translate(-cam.x, -cam.y);

  // 1. Carte pré-rendue haute résolution
  if (terrainCanvas) {
    ctx.drawImage(terrainCanvas, 0, 0);
  }

  // Cratères de combat
  for (const c of craters) {
    ctx.fillStyle = 'rgba(18, 20, 26, 0.34)';
    ctx.beginPath(); ctx.arc(c.x, c.y, c.r, 0, TAU); ctx.fill();
    ctx.strokeStyle = 'rgba(255, 197, 49, 0.14)';
    ctx.lineWidth = 2;
    ctx.stroke();
  }

  // 2. Zones d'influence
  for (const b of state.buildings) {
    if (b.hp <= 0) continue;
    const def = BUILDINGS[b.kind];
    if (!def || !def.influence) continue;
    const isMine = b.owner === myId;
    if (!isMine && !buildMode) continue;
    const owner = state.players.find((p) => p.id === b.owner);
    const col = owner ? owner.color : '#fff';
    ctx.save();
    ctx.strokeStyle = col;
    ctx.lineWidth = buildMode && isMine ? 3.5 : 1.5;
    ctx.globalAlpha = buildMode && isMine ? 0.62 : 0.16;
    ctx.setLineDash([14, 9]);
    ctx.lineDashOffset = -now * 0.025;
    ctx.beginPath();
    ctx.arc(b.x, b.y, def.influence, 0, TAU);
    ctx.stroke();
    ctx.restore();
  }

  // 3. Faisceaux de récolte énergétique entre Cristaux et Extracteurs
  for (const b of state.buildings) {
    if (b.kind === 'extractor' && b.boost && b.crysId) {
      const cn = CRYSTAL_NODES.find((c) => c.id === b.crysId);
      if (cn) {
        ctx.save();
        ctx.strokeStyle = 'rgba(31, 199, 193, 0.35)';
        ctx.lineWidth = 9;
        ctx.beginPath(); ctx.moveTo(cn.x, cn.y); ctx.lineTo(b.x, b.y); ctx.stroke();
        ctx.strokeStyle = '#1fc7c1';
        ctx.lineWidth = 3.5;
        ctx.setLineDash([8, 6]);
        ctx.lineDashOffset = -now * 0.05;
        ctx.beginPath(); ctx.moveTo(cn.x, cn.y); ctx.lineTo(b.x, b.y); ctx.stroke();
        ctx.restore();
      }
    }
  }

  // 4. Gisements de Cristal 2.5D à facettes
  for (const cn of CRYSTAL_NODES) {
    const r = cn.rich ? 25 : 19;
    const pulse = 1 + Math.sin(now * 0.004 + cn.x) * 0.07;
    const { ox, oy } = roofOffset(cn.x, cn.y, 28);
    ctx.save();
    ctx.translate(cn.x, cn.y);
    ctx.scale(pulse, pulse);
    // Halo lumineux
    ctx.fillStyle = cn.rich ? 'rgba(255, 197, 49, 0.22)' : 'rgba(31, 199, 193, 0.22)';
    ctx.beginPath(); ctx.arc(0, 0, r * 1.45, 0, TAU); ctx.fill();
    // Corps du cristal à 6 facettes
    ctx.fillStyle = cn.rich ? '#d99b16' : '#128c88';
    ctx.strokeStyle = '#16181d';
    ctx.lineWidth = 3.5;
    ctx.beginPath();
    for (let i = 0; i < 6; i++) {
      const a = (i / 6) * TAU - Math.PI / 2;
      const px = Math.cos(a) * r, py = Math.sin(a) * r;
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.fill(); ctx.stroke();
    // Sommet extrudé du cristal
    ctx.fillStyle = cn.rich ? '#ffc531' : '#1fc7c1';
    ctx.beginPath();
    for (let i = 0; i < 6; i++) {
      const a = (i / 6) * TAU - Math.PI / 2;
      const px = ox * 0.55 + Math.cos(a) * r * 0.65, py = oy * 0.55 + Math.sin(a) * r * 0.65;
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#fff8ea';
    ctx.beginPath(); ctx.arc(ox * 0.6 - 3, oy * 0.6 - 3, r * 0.22, 0, TAU); ctx.fill();
    ctx.restore();
  }

  // 5. Rochers 2.5D à facettes
  for (const rk of ROCKS) {
    const { ox, oy } = roofOffset(rk.x, rk.y, 26);
    drawCylinder25D(ctx, rk.r, ox * 0.55, oy * 0.55, '#59544b', '#7d776b');
    ctx.fillStyle = '#999284';
    ctx.beginPath();
    ctx.arc(rk.x + ox * 0.6 - rk.r * 0.2, rk.y + oy * 0.6 - rk.r * 0.2, rk.r * 0.42, 0, TAU);
    ctx.fill();
  }

  // 6. Connexions entre Murs blindés voisins (barrières continues)
  const walls = state.buildings.filter((b) => b.kind === 'wall' && b.hp > 0);
  ctx.strokeStyle = '#16181d';
  ctx.lineWidth = 22;
  for (let i = 0; i < walls.length; i++) {
    for (let j = i + 1; j < walls.length; j++) {
      if (walls[i].team === walls[j].team && dist2(walls[i].x, walls[i].y, walls[j].x, walls[j].y) <= 58 * 58) {
        ctx.beginPath(); ctx.moveTo(walls[i].x, walls[i].y); ctx.lineTo(walls[j].x, walls[j].y); ctx.stroke();
      }
    }
  }
  ctx.strokeStyle = '#c8ba9b';
  ctx.lineWidth = 14;
  for (let i = 0; i < walls.length; i++) {
    for (let j = i + 1; j < walls.length; j++) {
      if (walls[i].team === walls[j].team && dist2(walls[i].x, walls[i].y, walls[j].x, walls[j].y) <= 58 * 58) {
        ctx.beginPath(); ctx.moveTo(walls[i].x, walls[i].y); ctx.lineTo(walls[j].x, walls[j].y); ctx.stroke();
      }
    }
  }

  // 7. Unités (triées par Y pour la profondeur)
  const sortedUnits = [...state.units].sort((a, b) => a.y - b.y);
  for (const u of sortedUnits) {
    if (u.hp <= 0) continue;
    const owner = state.players.find((p) => p.id === u.owner);
    drawUnit(ctx, u, owner ? owner.color : '#888', selectedUnits.has(u.id), now, false);
  }

  // 8. Bâtiments 2.5D (triés par Y pour un recouvrement 2.5D naturel)
  const sortedBlds = [...state.buildings].sort((a, b) => a.y - b.y);
  for (const b of sortedBlds) {
    if (b.hp <= 0) continue;
    const owner = state.players.find((p) => p.id === b.owner);
    drawBuilding(ctx, b, owner ? owner.color : '#888', owner ? owner.tier : 1, now, false);
  }

  // 9. Projectiles animés, Ondes de choc & Éclairs Tesla (avec halo lumineux additif)
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';

  for (let i = projectiles.length - 1; i >= 0; i--) {
    const pr = projectiles[i];
    pr.prog += pr.speed * dt;
    if (pr.prog >= 1) { projectiles.splice(i, 1); continue; }
    const px = lerp(pr.x, pr.tx, pr.prog);
    const py = lerp(pr.y, pr.ty, pr.prog);
    const bx = lerp(pr.x, pr.tx, Math.max(0, pr.prog - 0.18));
    const by = lerp(pr.y, pr.ty, Math.max(0, pr.prog - 0.18));
    ctx.strokeStyle = pr.color;
    ctx.lineWidth = pr.r * 1.6;
    ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(px, py); ctx.stroke();
    ctx.fillStyle = '#fff8ea';
    ctx.beginPath(); ctx.arc(px, py, pr.r * 0.7, 0, TAU); ctx.fill();
  }

  for (let i = shockwaves.length - 1; i >= 0; i--) {
    const sw = shockwaves[i];
    sw.life -= dt;
    if (sw.life <= 0) { shockwaves.splice(i, 1); continue; }
    const u = 1 - sw.life / sw.maxLife;
    ctx.globalAlpha = 1 - u;
    ctx.strokeStyle = sw.color;
    ctx.lineWidth = 4 * (1 - u) + 1;
    ctx.beginPath();
    ctx.arc(sw.x, sw.y, lerp(sw.r, sw.maxR, u), 0, TAU);
    ctx.stroke();
  }

  for (let i = beams.length - 1; i >= 0; i--) {
    const bm = beams[i];
    bm.life -= dt;
    if (bm.life <= 0) { beams.splice(i, 1); continue; }
    ctx.globalAlpha = clamp(bm.life / bm.maxLife, 0, 1);
    ctx.strokeStyle = bm.color;
    ctx.lineWidth = bm.w;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(bm.x1, bm.y1);
    if (bm.tesla) {
      for (let s = 1; s <= 3; s++) {
        const f = s / 4;
        ctx.lineTo(lerp(bm.x1, bm.x2, f) + (Math.random() - 0.5) * 32, lerp(bm.y1, bm.y2, f) + (Math.random() - 0.5) * 32);
      }
    }
    ctx.lineTo(bm.x2, bm.y2);
    ctx.stroke();
  }
  ctx.restore();

  // 10. Alertes de Frappes Orbitales
  for (const s of state.strikes) {
    ctx.save();
    ctx.strokeStyle = '#ff4b2b';
    ctx.fillStyle = 'rgba(255, 75, 43, 0.2)';
    ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(s.x, s.y, 165, 0, TAU); ctx.fill(); ctx.stroke();
    const prog = clamp(1 - s.timer / 2.1, 0, 1);
    ctx.beginPath(); ctx.arc(s.x, s.y, 165 * (1 - prog), 0, TAU); ctx.stroke();
    ctx.restore();
  }

  // 11. Particules d'explosion
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= dt;
    if (p.life <= 0) { particles.splice(i, 1); continue; }
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    ctx.fillStyle = p.color;
    ctx.strokeStyle = '#16181d';
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, TAU); ctx.fill(); ctx.stroke();
  }

  // 12. Anneau de Tempête Magnétique (Mort Subite)
  if (state.phase === 4) {
    ctx.save();
    ctx.strokeStyle = '#ff4b2b';
    ctx.lineWidth = 10;
    ctx.setLineDash([24, 14]);
    ctx.beginPath(); ctx.arc(HALF_W, HALF_W, state.stormRadius, 0, TAU); ctx.stroke();
    ctx.restore();
  }

  // 13. Aperçu fantôme 2.5D du bâtiment sous le curseur
  if (buildMode) {
    const def = BUILDINGS[buildMode];
    const check = canPlaceBuilding(state, myId, buildMode, mouse.wx, mouse.wy);
    const me = state.players.find((p) => p.id === myId);
    ctx.save();
    const showR = def.range || def.influence;
    if (showR) {
      ctx.strokeStyle = check.ok ? '#2fbf71' : '#ff4b2b';
      ctx.lineWidth = 2.5;
      ctx.setLineDash([8, 6]);
      ctx.beginPath(); ctx.arc(mouse.wx, mouse.wy, showR, 0, TAU); ctx.stroke();
      ctx.setLineDash([]);
    }
    if (buildMode === 'extractor') {
      const cn = nearestCrystal(mouse.wx, mouse.wy);
      if (cn) {
        ctx.strokeStyle = '#ffc531';
        ctx.lineWidth = 4;
        ctx.beginPath(); ctx.moveTo(cn.x, cn.y); ctx.lineTo(mouse.wx, mouse.wy); ctx.stroke();
      }
    }
    ctx.globalAlpha = 0.72;
    drawBuilding(ctx, { kind: buildMode, x: mouse.wx, y: mouse.wy, radius: def.radius, hp: def.hp, maxHp: def.hp, boost: true, aimA: 0 }, check.ok ? (me ? me.color : '#2fbf71') : '#ff4b2b', me ? me.tier : 1, now, true);
    ctx.globalAlpha = 1;
    ctx.strokeStyle = check.ok ? '#2fbf71' : '#ff4b2b';
    ctx.lineWidth = 3.5;
    ctx.beginPath(); ctx.arc(mouse.wx, mouse.wy, def.radius + 4, 0, TAU); ctx.stroke();
    ctx.restore();
  } else if (strikeMode) {
    ctx.save();
    ctx.strokeStyle = '#ff4b2b';
    ctx.fillStyle = 'rgba(255, 75, 43, 0.22)';
    ctx.lineWidth = 3.5;
    ctx.beginPath(); ctx.arc(mouse.wx, mouse.wy, 165, 0, TAU); ctx.fill(); ctx.stroke();
    ctx.restore();
  }

  // 14. Rectangle de sélection
  if (mouse.down && mouse.dragStart) {
    ctx.save();
    ctx.strokeStyle = '#ffc531';
    ctx.fillStyle = 'rgba(255, 197, 49, 0.15)';
    ctx.lineWidth = 2.5 / cam.z;
    const rx = Math.min(mouse.dragStart.wx, mouse.wx);
    const ry = Math.min(mouse.dragStart.wy, mouse.wy);
    const rw = Math.abs(mouse.wx - mouse.dragStart.wx);
    const rh = Math.abs(mouse.wy - mouse.dragStart.wy);
    ctx.fillRect(rx, ry, rw, rh);
    ctx.strokeRect(rx, ry, rw, rh);
    ctx.restore();
  }

  ctx.restore();
  renderMinimap();
}

function renderMinimap() {
  if (!state) return;
  const mw = miniCvs.width, mh = miniCvs.height;
  const sc = mw / WORLD_SIZE;
  if (terrainCanvas) {
    miniCtx.drawImage(terrainCanvas, 0, 0, mw, mh);
  } else {
    miniCtx.fillStyle = '#23442a';
    miniCtx.fillRect(0, 0, mw, mh);
  }

  for (const cn of CRYSTAL_NODES) {
    miniCtx.fillStyle = cn.rich ? '#ffc531' : '#1fc7c1';
    miniCtx.fillRect(cn.x * sc - 2.5, cn.y * sc - 2.5, 5, 5);
  }
  for (const b of state.buildings) {
    const owner = state.players.find((p) => p.id === b.owner);
    miniCtx.fillStyle = owner ? owner.color : '#fff';
    const sz = b.kind === 'hq' ? 7 : 4;
    miniCtx.fillRect(b.x * sc - sz / 2, b.y * sc - sz / 2, sz, sz);
  }
  for (const u of state.units) {
    const owner = state.players.find((p) => p.id === u.owner);
    miniCtx.fillStyle = owner ? owner.color : '#fff';
    miniCtx.fillRect(u.x * sc - 1.5, u.y * sc - 1.5, 3, 3);
  }
  const vw = (W / cam.z) * sc, vh = (H / cam.z) * sc;
  miniCtx.strokeStyle = '#fff8ea';
  miniCtx.lineWidth = 1.8;
  miniCtx.strokeRect(cam.x * sc - vw / 2, cam.y * sc - vh / 2, vw, vh);
}

/* ============================================================================
   DÉMARRAGE DE PARTIE & SYNCHRONISATION RÉSEAU (HUB BRIDGE)
   ============================================================================ */
let lastBootInfo = null;
let tickInterval = null;
let botInterval = null;

buildTerrainCanvas();
renderDockIcons('#ff4b2b');

function startMatch(info) {
  lastBootInfo = info;
  reportedResult = false;
  selectedUnits.clear();
  buildMode = null;
  strikeMode = false;
  craters = [];
  particles = [];
  shockwaves = [];
  projectiles = [];
  beams = [];

  clearInterval(tickInterval);
  clearInterval(botInterval);

  const H = window.HubBridge;
  role = H && H.embedded ? info.role : 'solo';
  myId = H && H.embedded ? info.myId : 0;

  if (role === 'guest') {
    H.send('host', { t: 'sync' });
    return;
  }

  const settings = (info && info.settings) || { mode: 'ffa', pace: 'standard', bots: 1, level: 'normal' };
  const humans = H && H.embedded && Array.isArray(H.players) && H.players.length
    ? H.players.map((p) => ({ id: p.id, name: p.name, color: p.color, bot: false }))
    : [{ id: 0, name: 'Commandant', color: PALETTE[0], bot: false }];

  const roster = [...humans];
  const wantBots = role === 'solo'
    ? Math.max(1, Math.min(3, Number(settings.bots ?? 1)))
    : Math.max(0, Math.min(Number(settings.bots ?? 1), 4 - roster.length));
  const finalBots = roster.length + wantBots < 2 ? 2 - roster.length : wantBots;
  const usedColors = new Set(roster.map((p) => p.color));

  for (let k = 0; k < finalBots && roster.length < 4; k++) {
    const col = PALETTE.find((c) => !usedColors.has(c)) || PALETTE[roster.length % PALETTE.length];
    usedColors.add(col);
    roster.push({ id: 100 + k, name: BOT_NAMES[k], color: col, bot: true });
  }

  state = createInitialState(roster, settings);
  const me = state.players.find((p) => p.id === myId);
  if (me) renderDockIcons(me.color);
  centerOnMyHq();
  updateHudUI();

  if (role === 'host' && H && H.embedded) {
    H.send('all', { t: 'st', s: state, fx: [] });
  }

  tickInterval = setInterval(() => {
    if (!state || state.over) return;
    const fx = [];
    stepWorld(state, TICK_DT, fx);
    handleFxEvents(fx);
    if (role === 'host' && H && H.embedded) {
      H.send('all', { t: 'st', s: state, fx });
    }
  }, 1000 / TICK_RATE);

  const botEvery = settings.level === 'expert' ? 950 : settings.level === 'facile' ? 2200 : 1400;
  botInterval = setInterval(() => {
    if (!state || state.over) return;
    const fx = [];
    runBots(state, fx);
    handleFxEvents(fx);
  }, botEvery);
}

if (window.HubBridge && HubBridge.embedded) {
  let centeredOnce = false;
  HubBridge.on('init', (info) => {
    startMatch(info);
    HubBridge.signalReady();
  });
  HubBridge.on('msg', (from, m) => {
    if (!m || typeof m !== 'object') return;
    if (role === 'host') {
      if (m.t === 'sync' && state) {
        HubBridge.send(from, { t: 'st', s: state, fx: [] });
      } else if (m.t === 'cmd' && m.cmd) {
        const fx = [];
        executeCommand(state, from, m.cmd, fx);
        handleFxEvents(fx);
      }
    } else if (role === 'guest' && from === HubBridge.info.hostId) {
      if (m.t === 'st' && m.s) {
        state = m.s;
        if (!centeredOnce) {
          centeredOnce = true;
          const me = state.players.find((p) => p.id === myId);
          if (me) renderDockIcons(me.color);
          centerOnMyHq();
        }
        if (m.fx) handleFxEvents(m.fx);
      }
    }
  });
} else {
  startMatch({ role: 'solo', myId: 0, settings: { mode: 'ffa', pace: 'standard', bots: 1, level: 'normal' } });
}

let lastFrame = performance.now();
function loop(now) {
  const dt = Math.min(0.05, Math.max(0.001, (now - lastFrame) / 1000));
  lastFrame = now;
  renderWorld(dt, now);
  updateHudUI();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
