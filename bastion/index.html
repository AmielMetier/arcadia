/* ============================================================================
   CONSOLE RTS INFÉRIEURE STRICTE (AUCUNE ACTION SANS SÉLECTION D'UNITÉ/BÂTIMENT)
   ============================================================================ */
let lastCmdSig = '';

function renderConsoleUI(force = false) {
  if (!state) return;
  cleanSelection();
  const me = state.players.find((p) => p.id === myId);
  if (!me) return;

  const myUnits = state.units.filter((u) => u.owner === myId && u.hp > 0);
  const scvs = myUnits.filter((u) => u.kind === 'scv');
  const armyCnt = myUnits.filter((u) => u.kind !== 'scv').length;
  $('#uiIdleCnt').textContent = scvs.length;
  $('#uiArmyCnt').textContent = armyCnt;

  const cgHtml = [];
  for (let g = 1; g <= 5; g++) {
    const grp = controlGroups[g];
    const cnt = (grp?.units?.length || 0) + (grp?.blds?.length || 0);
    if (cnt > 0) {
      cgHtml.push(`<button class="cg-pill" data-cg="${g}"><b>${g}</b><span>(${cnt})</span></button>`);
    }
  }
  const cgBar = $('#uiCgBar');
  if (cgBar.innerHTML !== cgHtml.join('')) {
    cgBar.innerHTML = cgHtml.join('');
    for (const btn of cgBar.querySelectorAll('[data-cg]')) {
      btn.onclick = () => {
        const g = Number(btn.dataset.cg);
        const grp = controlGroups[g];
        selectedUnits = new Set(grp.units || []);
        selectedBlds = new Set(grp.blds || []);
        cleanSelection();
        renderConsoleUI(true);
      };
    }
  }

  const selBody = $('#uiSelBody');
  const selU = state.units.filter((u) => selectedUnits.has(u.id));
  const selB = state.buildings.filter((b) => selectedBlds.has(b.id));

  // PANNEAU CENTRAL / GAUCHE : SÉLECTION AÉRÉE AVEC NOM ET APERÇU 3D CLAIR
  if (selB.length >= 1 && selU.length === 0) {
    const b = selB[0];
    const def = BUILDINGS[b.kind];
    $('#uiSelHeader').textContent = selB.length > 1 ? `${selB.length} × ${def.name}` : def.name;
    $('#uiSelSubHint').textContent = b.constructing ? 'Chantier 3D en construction...' : 'Clic Droit sur la carte = Point de Ralliement';
    const pct = Math.round((b.hp / b.maxHp) * 100);
    const qSlotsHtml = [0, 1, 2, 3, 4].map((idx) => {
      const qKind = b.queue?.[idx];
      const uDef = qKind ? UNITS[qKind] : null;
      return `<div class="q-slot ${uDef ? 'filled' : ''}" data-cancel-bld="${b.id}" data-cancel-slot="${idx}" title="${uDef ? `Annuler ${uDef.name}` : 'Slot libre'}">
        <span class="num">#${idx + 1}</span>
        ${uDef ? `<span class="q-nm">${uDef.short}</span>` : '<span style="color:#b7ac95">—</span>'}
      </div>`;
    }).join('');
    const qProg = b.qTotal > 0 ? Math.round((1 - b.qTimer / b.qTotal) * 100) : 0;

    selBody.innerHTML = `
      <div class="portrait-box">
        <div class="portrait-name">${def.short}</div>
        <canvas width="98" height="86" id="portCvs"></canvas>
        <div class="portrait-hp"><i style="width:${pct}%;background:${pct > 45 ? '#2fbf71' : '#ff4b2b'}"></i></div>
      </div>
      <div class="sel-info">
        <div class="sel-title">${def.name}</div>
        <div class="sel-sub">PV : ${Math.ceil(b.hp)} / ${b.maxHp} ${b.constructing ? `· Construction ${Math.round((b.buildProg || 0) * 100)}%` : ''}</div>
        <div class="sel-stats">
          ${def.dmg ? `<span class="st-chip">⚔️ Dégâts : ${def.dmg}</span>` : ''}
          ${def.supply ? `<span class="st-chip">📦 Ravitaillement : +${def.supply}</span>` : ''}
          <span class="st-chip">${def.desc}</span>
        </div>
        ${(def.trains && def.trains.length && !b.constructing) ? `
          <div class="prod-queue">
            <div style="display:flex;justify-content:space-between;font-size:11px;font-weight:700">
              <span>File de production (${b.queue.length}/5)</span>
              <span>${b.queue[0] ? `En cours : ${UNITS[b.queue[0]].name} (${qProg}%)` : 'Prêt à produire'}</span>
            </div>
            <div class="q-bar-wrap"><i style="width:${qProg}%"></i></div>
            <div class="q-slots">${qSlotsHtml}</div>
          </div>
        ` : ''}
      </div>
    `;
    drawThumbIcon($('#portCvs'), b.kind, me.color);
    for (const sl of selBody.querySelectorAll('.q-slot.filled')) {
      sl.onclick = () => sendCommand({ op: 'CANCEL_QUEUE', bldId: Number(sl.dataset.cancelBld), slot: Number(sl.dataset.cancelSlot) });
    }
  } else if (selU.length === 1) {
    const u = selU[0];
    const def = UNITS[u.kind];
    $('#uiSelHeader').textContent = def.name;
    $('#uiSelSubHint').textContent = u.kind === 'scv'
      ? 'Ouvrier VCS : choisis un bâtiment à droite [1-8] ou Clic Droit sur un cristal'
      : 'A + Clic = Attaque-Déplacement · Clic Droit = Ordre';
    const pct = Math.round((u.hp / u.maxHp) * 100);
    selBody.innerHTML = `
      <div class="portrait-box">
        <div class="portrait-name">${def.short}</div>
        <canvas width="98" height="86" id="portCvs"></canvas>
        <div class="portrait-hp"><i style="width:${pct}%;background:${pct > 45 ? '#2fbf71' : '#ff4b2b'}"></i></div>
      </div>
      <div class="sel-info">
        <div class="sel-title">${def.name} ${u.sieged ? '· [MODE SIÈGE]' : ''} ${u.stimT > 0 ? '· [STIMPACK ⚡]' : ''}</div>
        <div class="sel-sub">PV : ${Math.ceil(u.hp)} / ${u.maxHp} · ${def.desc}</div>
        <div class="sel-stats">
          <span class="st-chip">⚔️ Dégâts : ${u.sieged ? def.siegeDmg : def.dmg}</span>
          <span class="st-chip">🎯 Portée : ${u.sieged ? def.siegeRange : def.range}</span>
          <span class="st-chip">💨 Vitesse : ${u.sieged ? 0 : def.speed}</span>
        </div>
      </div>
    `;
    drawThumbIcon($('#portCvs'), u.kind, me.color);
  } else if (selU.length > 1) {
    $('#uiSelHeader').textContent = `Escouade sélectionnée (${selU.length} unités)`;
    $('#uiSelSubHint').textContent = 'Clic = Isoler · Ctrl+Clic = Même type · A + Clic = Attaque · T = Stimpack · E = Siège';
    selBody.innerHTML = `<div class="multi-grid">${selU.slice(0, 24).map((u) => {
      const def = UNITS[u.kind];
      const pct = Math.round((u.hp / u.maxHp) * 100);
      return `<div class="u-card ${u.stimT > 0 ? 'stim' : ''} ${u.sieged ? 'siege' : ''}" data-pick-u="${u.id}" title="${def.name} (${Math.ceil(u.hp)}/${u.maxHp} PV)">
        <canvas class="u-thumb" width="68" height="38" data-u-thumb="${u.kind}"></canvas>
        <span class="u-nm">${def.short}</span>
        <div class="u-hp"><i style="width:${pct}%;background:${pct > 45 ? '#2fbf71' : '#ff4b2b'}"></i></div>
      </div>`;
    }).join('')}</div>`;
    for (const c of selBody.querySelectorAll('canvas[data-u-thumb]')) {
      drawThumbIcon(c, c.dataset.uThumb, me.color);
    }
    for (const card of selBody.querySelectorAll('[data-pick-u]')) {
      card.onclick = (ev) => {
        const id = Number(card.dataset.pickU);
        const targetU = state.units.find((x) => x.id === id);
        if (ev.ctrlKey && targetU) {
          selectedUnits = new Set(selU.filter((x) => x.kind === targetU.kind).map((x) => x.id));
        } else {
          selectedUnits = new Set([id]);
        }
        renderConsoleUI(true);
      };
    }
  } else {
    $('#uiSelHeader').textContent = 'Aucune sélection';
    $('#uiSelSubHint').textContent = 'Clique sur un VCS ou un bâtiment sur la carte';
    selBody.innerHTML = `
      <div class="sel-info">
        <div class="sel-title">Sélectionne une unité ou un bâtiment</div>
        <div class="sel-sub">Fonctionnement StarCraft :</div>
        <div class="sel-stats">
          <span class="st-chip">👷 Clique sur un <b>Ouvrier VCS</b> pour construire un bâtiment</span>
          <span class="st-chip">🏰 Clique sur le <b>QG</b> pour créer un Ouvrier VCS</span>
          <span class="st-chip">🏭 Clique sur la <b>Caserne / Usine</b> pour créer des troupes</span>
        </div>
      </div>
    `;
  }

  // PANNEAU DE DROITE : COMMAND CARD 4x3 STRICTE (basée uniquement sur ce qui est sélectionné !)
  const hasScv = selU.some((u) => u.kind === 'scv');
  const firstB = selB[0] || null;
  let modeKey = 'NONE';
  if (selU.length > 0) {
    modeKey = hasScv ? 'SCV' : 'ARMY';
  } else if (firstB) {
    modeKey = firstB.constructing ? 'BLD_CONSTRUCT' : `BLD_${firstB.kind}`;
  }

  const sig = `${modeKey}|${buildMode}|${orderCursor}|${Math.floor(me.minerals / 5)}|${Math.floor(me.gas / 5)}|${me.color}`;
  if (!force && sig === lastCmdSig) return;
  lastCmdSig = sig;

  const grid = $('#uiCmdGrid');
  const cards = [];

  if (modeKey === 'SCV') {
    $('#uiCmdTitle').textContent = 'Ouvrier VCS · Construction';
    $('#uiCmdHint').textContent = 'Touches 1-8';
    const bList = [
      ['pylon', '1'], ['extractor', '2'], ['barracks', '3'], ['factory', '4'],
      ['turret', '5'], ['tesla', '6'], ['wall', '7'], ['hq', '8'],
    ];
    for (const [k, key] of bList) {
      const def = BUILDINGS[k];
      const cant = me.minerals < def.min || me.gas < def.gas || (def.req && !hasCompletedBuilding(state, myId, def.req));
      cards.push(`<button class="cbtn ${buildMode === k ? 'sel' : ''} ${cant ? 'cant' : ''}" data-cmd-build="${k}" title="${def.name} — ${def.desc}">
        <div class="cbtn-top">
          <span class="key">${key}</span>
          <span class="cost-tag">${def.min}💎${def.gas ? ` ${def.gas}🧪` : ''}</span>
        </div>
        <div class="cbtn-mid">
          <canvas class="thumb" width="76" height="40" data-thumb="${k}"></canvas>
        </div>
        <span class="lbl-b">${def.short}</span>
      </button>`);
    }
    cards.push(`<button class="cbtn" data-cmd-act="harvest" title="Envoyer récolter les minéraux les plus proches (R)">
      <div class="cbtn-top"><span class="key">R</span></div>
      <div class="cbtn-mid"><span class="ico-txt">💎</span></div>
      <span class="lbl-b">Récolter</span>
    </button>`);
    cards.push(`<button class="cbtn ${orderCursor === 'amove' ? 'sel' : ''}" data-cmd-act="amove" title="Attaquer (A)">
      <div class="cbtn-top"><span class="key">A</span></div>
      <div class="cbtn-mid"><span class="ico-txt">🎯</span></div>
      <span class="lbl-b">Attaquer</span>
    </button>`);
    cards.push(`<button class="cbtn" data-cmd-act="stop" title="Stopper (S)">
      <div class="cbtn-top"><span class="key">S</span></div>
      <div class="cbtn-mid"><span class="ico-txt">✋</span></div>
      <span class="lbl-b">Stop</span>
    </button>`);

  } else if (modeKey.startsWith('BLD_') && modeKey !== 'BLD_CONSTRUCT') {
    const bDef = BUILDINGS[firstB.kind];
    $('#uiCmdTitle').textContent = `${bDef.name}`;
    $('#uiCmdHint').textContent = bDef.trains.length ? 'Touches Q / W / E' : 'Structure active';
    const keysMap = ['Q', 'W', 'E', 'R'];
    (bDef.trains || []).forEach((uKind, idx) => {
      const uDef = UNITS[uKind];
      const cant = me.minerals < uDef.min || me.gas < uDef.gas;
      cards.push(`<button class="cbtn ${cant ? 'cant' : ''}" data-cmd-train="${uKind}" title="Entraîner ${uDef.name} — ${uDef.desc}">
        <div class="cbtn-top">
          <span class="key">${keysMap[idx]}</span>
          <span class="cost-tag">${uDef.min}💎${uDef.gas ? ` ${uDef.gas}🧪` : ''}</span>
        </div>
        <div class="cbtn-mid">
          <canvas class="thumb" width="76" height="40" data-thumb="${uKind}"></canvas>
        </div>
        <span class="lbl-b">${uDef.short}</span>
      </button>`);
    });
    if (firstB.kind === 'hq') {
      cards.push(`<button class="cbtn ${orderCursor === 'scan' ? 'sel' : ''}" data-cmd-act="scan" title="Scan Radar Comsat (50💎) : révèle le brouillard de guerre">
        <div class="cbtn-top"><span class="key">X</span><span class="cost-tag">50💎</span></div>
        <div class="cbtn-mid"><span class="ico-txt">📡</span></div>
        <span class="lbl-b">Scan Radar</span>
      </button>`);
    }
    if (!cards.length) {
      grid.innerHTML = `<div class="cmd-empty"><b>${bDef.name}</b><span>Ce bâtiment fonctionne automatiquement (${bDef.desc})</span></div>`;
      return;
    }

  } else if (modeKey === 'BLD_CONSTRUCT') {
    $('#uiCmdTitle').textContent = 'Chantier en cours';
    $('#uiCmdHint').textContent = 'En construction';
    grid.innerHTML = `<div class="cmd-empty"><b>Chantier en cours de soudure</b><span>Ton Ouvrier VCS est sur l'emplacement en train de souder la structure.</span></div>`;
    return;

  } else if (modeKey === 'ARMY') {
    $('#uiCmdTitle').textContent = 'Ordres de Combat';
    $('#uiCmdHint').textContent = 'Micro-gestion';
    const canStim = selU.some((u) => UNITS[u.kind]?.canStim);
    const canSiege = selU.some((u) => UNITS[u.kind]?.canSiege);
    cards.push(`<button class="cbtn ${orderCursor === 'amove' ? 'sel' : ''}" data-cmd-act="amove" title="Attaque-Déplacement (A + Clic gauche)">
      <div class="cbtn-top"><span class="key">A</span></div>
      <div class="cbtn-mid"><span class="ico-txt">⚔️</span></div>
      <span class="lbl-b">A-Move</span>
    </button>`);
    cards.push(`<button class="cbtn" data-cmd-act="stop" title="Stopper les unités (S)">
      <div class="cbtn-top"><span class="key">S</span></div>
      <div class="cbtn-mid"><span class="ico-txt">✋</span></div>
      <span class="lbl-b">Stop</span>
    </button>`);
    cards.push(`<button class="cbtn" data-cmd-act="hold" title="Tenir Position (H)">
      <div class="cbtn-top"><span class="key">H</span></div>
      <div class="cbtn-mid"><span class="ico-txt">🛡️</span></div>
      <span class="lbl-b">Tenir Pos.</span>
    </button>`);
    if (canStim) {
      cards.push(`<button class="cbtn" data-cmd-act="stim" title="Stimpack (T) : +50% vitesse d'attaque et de déplacement pendant 8s (-18 PV)">
        <div class="cbtn-top"><span class="key">T</span></div>
        <div class="cbtn-mid"><span class="ico-txt">💉</span></div>
        <span class="lbl-b">Stimpack</span>
      </button>`);
    }
    if (canSiege) {
      cards.push(`<button class="cbtn" data-cmd-act="siege" title="Mode Siège / Mode Char (E) pour les Chars de Siège">
        <div class="cbtn-top"><span class="key">E</span></div>
        <div class="cbtn-mid"><span class="ico-txt">💥</span></div>
        <span class="lbl-b">Mode Siège</span>
      </button>`);
    }

  } else {
    // RIEN N'EST SÉLECTIONNÉ : Panneau de droite vide (aucun bouton de construction/production global)
    $('#uiCmdTitle').textContent = 'Aucune sélection';
    $('#uiCmdHint').textContent = 'Sélection requise';
    grid.innerHTML = `<div class="cmd-empty">
      <b>Aucune unité ou structure sélectionnée</b>
      <span>Clique sur un <b>Ouvrier VCS</b> (ou <kbd>F1</kbd>) pour construire, ou clique sur un <b>Bâtiment</b> (QG, Caserne, Usine) pour produire des troupes.</span>
    </div>`;
    return;
  }

  grid.innerHTML = cards.join('');
  for (const c of grid.querySelectorAll('canvas[data-thumb]')) {
    drawThumbIcon(c, c.dataset.thumb, me.color);
  }
  for (const b of grid.querySelectorAll('[data-cmd-build]')) {
    b.onclick = () => {
      const k = b.dataset.cmdBuild;
      orderCursor = null;
      buildMode = buildMode === k ? null : k;
      updateCursorClass();
      renderConsoleUI(true);
    };
  }
  for (const b of grid.querySelectorAll('[data-cmd-train]')) {
    b.onclick = () => {
      const uKind = b.dataset.cmdTrain;
      for (const bId of selectedBlds) {
        sendCommand({ op: 'TRAIN', unit: uKind, bldId: bId });
      }
    };
  }
  for (const b of grid.querySelectorAll('[data-cmd-act]')) {
    b.onclick = () => {
      const act = b.dataset.cmdAct;
      if (act === 'amove') { buildMode = null; orderCursor = orderCursor === 'amove' ? null : 'amove'; updateCursorClass(); renderConsoleUI(true); }
      else if (act === 'scan') { buildMode = null; orderCursor = orderCursor === 'scan' ? null : 'scan'; updateCursorClass(); renderConsoleUI(true); }
      else if (act === 'stop') sendCommand({ op: 'UNIT_ORDER', mode: 'stop', unitIds: [...selectedUnits] });
      else if (act === 'hold') sendCommand({ op: 'UNIT_ORDER', mode: 'hold', unitIds: [...selectedUnits] });
      else if (act === 'harvest') sendCommand({ op: 'UNIT_ORDER', mode: 'harvest_min', x: cam.x, y: cam.y, unitIds: [...selectedUnits] });
      else if (act === 'stim') sendCommand({ op: 'STIM', unitIds: [...selectedUnits] });
      else if (act === 'siege') sendCommand({ op: 'SIEGE', unitIds: [...selectedUnits] });
    };
  }
}

function updateHudUI() {
  if (!state) return;
  const me = state.players.find((p) => p.id === myId);
  if (me) {
    $('#uiMin').textContent = Math.floor(me.minerals);
    $('#uiGas').textContent = Math.floor(me.gas);
    const scvCnt = state.units.filter((u) => u.owner === myId && u.kind === 'scv' && u.hp > 0).length;
    const refCnt = state.buildings.filter((b) => b.owner === myId && b.kind === 'extractor' && b.hp > 0 && !b.constructing).length;
    $('#uiWorkers').textContent = `${scvCnt} VCS`;
    $('#uiRefineries').textContent = `${refCnt} Raff.`;
    const sup = computeSupply(state, myId);
    const supEl = $('#uiSupply');
    supEl.textContent = `${sup.used}/${sup.max}`;
    supEl.classList.toggle('blocked', sup.used >= sup.max);
  }

  const sec = Math.floor(state.time);
  const mm = String(Math.floor(sec / 60)).padStart(2, '0');
  const ss = String(sec % 60).padStart(2, '0');
  $('#uiClock').textContent = `${mm}:${ss}`;
  const phaseNames = {
    1: 'Phase 1 · Expansion & Scouting',
    2: 'Phase 2 · Escarmouches Tactiques',
    3: 'Phase 3 · Guerre Mécanisée (+20% Dégâts)',
    4: 'MORT SUBITE · Tempête & Dégâts ×1.85',
  };
  $('#uiPhaseName').textContent = phaseNames[state.phase] || '';
  $('#uiPhase').classList.toggle('sd', state.phase === 4);

  $('#uiRoster').innerHTML = state.players.map((p) => `<div class="p-chip ${p.dead ? 'dead' : ''}">
    <span class="dot" style="background:${p.color}"></span>
    <span>${p.name}</span>
  </div>`).join('');

  renderConsoleUI(false);

  const modal = $('#endModal');
  if (state.over && modal.hidden) {
    modal.hidden = false;
    const won = me && !me.dead && me.team === state.winnerTeam;
    $('#endTitle').textContent = won ? '🏆 Victoire !' : '💥 Défaite';
    $('#endSub').textContent = won
      ? 'Tes forces ont conquis le secteur !'
      : 'Tous tes Centres de Commandement ont été détruits.';
    const ordered = state.ranking.map((id) => state.players.find((p) => p.id === id)).filter(Boolean);
    $('#endRanks').innerHTML = ordered.map((p, idx) => `<li>
      <span class="rk">${idx < 3 ? ['🥇', '🥈', '🥉'][idx] : idx + 1}</span>
      <span class="dot" style="background:${p.color}"></span>
      <span>${p.name}${p.bot ? ' 🤖' : ''}</span>
      <span class="sc">${p.score} pts</span>
    </li>`).join('');

    if (!reportedResult && (role === 'host' || role === 'solo') && window.HubBridge && HubBridge.embedded) {
      reportedResult = true;
      HubBridge.report({
        id: `bastion-${Date.now()}`,
        mode: state.mode === '2v2' ? '2v2' : 'RTS',
        players: ordered.map((p, idx) => ({
          id: p.bot ? null : p.id,
          name: p.name,
          color: p.color,
          bot: !!p.bot,
          rank: idx + 1,
          score: p.score,
        })),
      });
    }
  } else if (!state.over && !modal.hidden) {
    modal.hidden = true;
  }
}

/* ============================================================================
   RENDU PRINCIPAL DU MONDE 3D VUE DU DESSUS & MINIMAP (60 FPS)
   ============================================================================ */
function renderWorld(dt, now) {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = '#142818';
  ctx.fillRect(0, 0, W, H);
  if (!state) return;

  const panSpd = 680 / cam.z;
  if (keys['arrowup']) cam.y -= panSpd * dt;
  if (keys['arrowdown']) cam.y += panSpd * dt;
  if (keys['arrowleft']) cam.x -= panSpd * dt;
  if (keys['arrowright']) cam.x += panSpd * dt;
  cam.x = clamp(cam.x, 0, WORLD_SIZE);
  cam.y = clamp(cam.y, 0, WORLD_SIZE);

  let shX = 0, shY = 0;
  if (cam.shake > 0.2) {
    shX = (Math.random() - 0.5) * cam.shake * 2;
    shY = (Math.random() - 0.5) * cam.shake * 2;
    cam.shake *= Math.pow(0.04, dt);
  } else cam.shake = 0;

  updateFogCanvas();

  ctx.save();
  ctx.translate(W / 2 + shX, H / 2 + shY);
  ctx.scale(cam.z, cam.z);
  ctx.translate(-cam.x, -cam.y);

  if (terrainCanvas) ctx.drawImage(terrainCanvas, 0, 0);

  for (const c of craters) {
    ctx.fillStyle = 'rgba(18, 20, 26, 0.34)';
    ctx.beginPath(); ctx.arc(c.x, c.y, c.r, 0, TAU); ctx.fill();
  }

  // Geysers de Gaz Plasma 3D
  for (const gey of GAS_GEYSERS) {
    ctx.save();
    ctx.translate(gey.x, gey.y);
    drawPrism3D(ctx, gey.x, gey.y, makeNGon(26, 8), 0, 14, '#38463d', '#4d5e52', false, 0.78);
    const oTop = project3DOffset(gey.x, gey.y, 14, false);
    ctx.fillStyle = '#162b1d';
    ctx.beginPath(); ctx.arc(oTop.ox, oTop.oy, 13, 0, TAU); ctx.fill();
    const pulse = 9 + Math.sin(now * 0.006 + gey.x) * 3;
    ctx.fillStyle = 'rgba(47, 191, 113, 0.65)';
    ctx.beginPath(); ctx.arc(oTop.ox, oTop.oy, pulse, 0, TAU); ctx.fill();
    ctx.restore();
  }

  // Gisements de Minéraux 3D (Pyramides cristallines à facettes)
  for (const m of MINERAL_NODES) {
    const r = m.rich ? 21 : 17;
    ctx.save();
    ctx.translate(m.x, m.y);
    ctx.fillStyle = m.rich ? 'rgba(255, 197, 49, 0.22)' : 'rgba(31, 199, 193, 0.22)';
    ctx.beginPath(); ctx.arc(0, 0, r * 1.4, 0, TAU); ctx.fill();
    drawPyramid3D(ctx, m.x, m.y, makeNGon(r, 6, 0.2), 0, m.rich ? 34 : 28, m.rich ? '#ffc531' : '#1fc7c1', false);
    ctx.restore();
  }

  // Rochers 3D
  for (const rk of ROCKS) {
    ctx.save();
    ctx.translate(rk.x, rk.y);
    drawPrism3D(ctx, rk.x, rk.y, makeNGon(rk.r, 7, rk.seed), 0, 26, '#59544b', '#878073', false, 0.72);
    ctx.restore();
  }

  // Connexions 3D des Murs voisins
  const walls = state.buildings.filter((b) => b.kind === 'wall' && b.hp > 0 && isVisibleToMe(b.x, b.y));
  ctx.strokeStyle = '#16181d'; ctx.lineWidth = 22;
  for (let i = 0; i < walls.length; i++) {
    for (let j = i + 1; j < walls.length; j++) {
      if (walls[i].team === walls[j].team && dist2(walls[i].x, walls[i].y, walls[j].x, walls[j].y) <= 58 * 58) {
        const o1 = project3DOffset(walls[i].x, walls[i].y, 16, false);
        const o2 = project3DOffset(walls[j].x, walls[j].y, 16, false);
        ctx.beginPath(); ctx.moveTo(walls[i].x + o1.ox, walls[i].y + o1.oy); ctx.lineTo(walls[j].x + o2.ox, walls[j].y + o2.oy); ctx.stroke();
      }
    }
  }
  ctx.strokeStyle = '#c8ba9b'; ctx.lineWidth = 14;
  for (let i = 0; i < walls.length; i++) {
    for (let j = i + 1; j < walls.length; j++) {
      if (walls[i].team === walls[j].team && dist2(walls[i].x, walls[i].y, walls[j].x, walls[j].y) <= 58 * 58) {
        const o1 = project3DOffset(walls[i].x, walls[i].y, 16, false);
        const o2 = project3DOffset(walls[j].x, walls[j].y, 16, false);
        ctx.beginPath(); ctx.moveTo(walls[i].x + o1.ox, walls[i].y + o1.oy); ctx.lineTo(walls[j].x + o2.ox, walls[j].y + o2.oy); ctx.stroke();
      }
    }
  }

  // Points de Ralliement des bâtiments sélectionnés
  for (const b of state.buildings) {
    if (selectedBlds.has(b.id) && b.rallyX != null && b.rallyY != null && (BUILDINGS[b.kind]?.trains || []).length > 0) {
      ctx.save();
      ctx.strokeStyle = '#ffc531';
      ctx.lineWidth = 2.5;
      ctx.setLineDash([8, 6]);
      ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(b.rallyX, b.rallyY); ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = '#ffc531';
      ctx.strokeStyle = '#16181d';
      ctx.beginPath(); ctx.arc(b.rallyX, b.rallyY, 7, 0, TAU); ctx.fill(); ctx.stroke();
      ctx.restore();
    }
  }

  // Tri de profondeur 3D (Painter's Algorithm : Arbres 3D, Unités 3D et Bâtiments 3D triés par Y et distance au centre caméra)
  const renderList = [];
  const viewW = (W / cam.z) * 0.65, viewH = (H / cam.z) * 0.65;
  for (const tr of TREES_3D) {
    if (Math.abs(tr.x - cam.x) <= viewW && Math.abs(tr.y - cam.y) <= viewH) {
      renderList.push({ k: 'tree', y: tr.y, obj: tr });
    }
  }
  for (const u of state.units) {
    if (u.hp <= 0) continue;
    if (u.owner !== myId && !isVisibleToMe(u.x, u.y)) continue;
    let sortY = u.y;
    if (u.kind === 'scv' && u.onSite && u.buildTargetId) {
      const tb = state.buildings.find((b) => b.id === u.buildTargetId && b.constructing);
      if (tb) sortY = Math.max(u.y, tb.y + 1);
    }
    renderList.push({ k: 'unit', y: sortY, obj: u });
  }
  for (const b of state.buildings) {
    if (b.hp <= 0) continue;
    if (b.owner !== myId && !isVisibleToMe(b.x, b.y)) continue;
    renderList.push({ k: 'bld', y: b.y, obj: b });
  }
  renderList.sort((a, b) => a.y - b.y);

  for (const item of renderList) {
    if (item.k === 'tree') {
      drawTree3D(ctx, item.obj);
    } else if (item.k === 'unit') {
      const u = item.obj;
      const owner = state.players.find((p) => p.id === u.owner);
      drawUnit(ctx, u, owner ? owner.color : '#888', selectedUnits.has(u.id), now, false);
    } else {
      const b = item.obj;
      const owner = state.players.find((p) => p.id === b.owner);
      drawBuilding(ctx, b, owner ? owner.color : '#888', selectedBlds.has(b.id), now, false);
    }
  }

  // Projectiles, Ondes de choc & Éclairs
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (let i = projectiles.length - 1; i >= 0; i--) {
    const pr = projectiles[i];
    pr.prog += pr.speed * dt;
    if (pr.prog >= 1) { projectiles.splice(i, 1); continue; }
    const px = lerp(pr.x, pr.tx, pr.prog), py = lerp(pr.y, pr.ty, pr.prog);
    const bx = lerp(pr.x, pr.tx, Math.max(0, pr.prog - 0.18)), by = lerp(pr.y, pr.ty, Math.max(0, pr.prog - 0.18));
    ctx.strokeStyle = pr.color; ctx.lineWidth = pr.r * 1.6; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(px, py); ctx.stroke();
    ctx.fillStyle = '#fff8ea';
    ctx.beginPath(); ctx.arc(px, py, pr.r * 0.7, 0, TAU); ctx.fill();
  }
  for (let i = shockwaves.length - 1; i >= 0; i--) {
    const sw = shockwaves[i];
    sw.life -= dt;
    if (sw.life <= 0) { shockwaves.splice(i, 1); continue; }
    const u = 1 - sw.life / sw.maxLife;
    ctx.globalAlpha = 1 - u;
    ctx.strokeStyle = sw.color; ctx.lineWidth = 4 * (1 - u) + 1;
    ctx.beginPath(); ctx.arc(sw.x, sw.y, lerp(sw.r, sw.maxR, u), 0, TAU); ctx.stroke();
  }
  for (let i = beams.length - 1; i >= 0; i--) {
    const bm = beams[i];
    bm.life -= dt;
    if (bm.life <= 0) { beams.splice(i, 1); continue; }
    ctx.globalAlpha = clamp(bm.life / bm.maxLife, 0, 1);
    ctx.strokeStyle = bm.color; ctx.lineWidth = bm.w; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(bm.x1, bm.y1);
    if (bm.tesla) {
      for (let s = 1; s <= 3; s++) {
        const f = s / 4;
        ctx.lineTo(lerp(bm.x1, bm.x2, f) + (Math.random() - 0.5) * 32, lerp(bm.y1, bm.y2, f) + (Math.random() - 0.5) * 32);
      }
    }
    ctx.lineTo(bm.x2, bm.y2); ctx.stroke();
  }
  ctx.restore();

  // Marqueurs d'ordres au sol façon StarCraft (anneau + 4 flèches convergentes)
  for (let i = orderMarkers.length - 1; i >= 0; i--) {
    const om = orderMarkers[i];
    om.life -= dt;
    if (om.life <= 0) { orderMarkers.splice(i, 1); continue; }
    const f = clamp(om.life / om.maxLife, 0, 1);
    const r = 5 + f * 20;
    ctx.save();
    ctx.translate(om.x, om.y);
    ctx.strokeStyle = om.color;
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.stroke();
    for (let k = 0; k < 4; k++) {
      ctx.rotate(Math.PI / 2);
      ctx.beginPath();
      ctx.moveTo(r + 8, -4);
      ctx.lineTo(r + 2, 0);
      ctx.lineTo(r + 8, 4);
      ctx.stroke();
    }
    ctx.restore();
  }

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= dt;
    if (p.life <= 0) { particles.splice(i, 1); continue; }
    p.x += p.vx * dt; p.y += p.vy * dt;
    ctx.fillStyle = p.color; ctx.strokeStyle = '#16181d'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, TAU); ctx.fill(); ctx.stroke();
  }

  // Brouillard de Guerre (Fog of War)
  ctx.drawImage(fogCanvas, 0, 0, WORLD_SIZE, WORLD_SIZE);

  for (const sc of state.scans) {
    ctx.save();
    ctx.strokeStyle = '#1fc7c1'; ctx.lineWidth = 3; ctx.setLineDash([12, 8]);
    ctx.beginPath(); ctx.arc(sc.x, sc.y, sc.r, 0, TAU); ctx.stroke();
    ctx.restore();
  }

  if (state.phase === 4) {
    ctx.save();
    ctx.strokeStyle = '#ff4b2b'; ctx.lineWidth = 10; ctx.setLineDash([24, 14]);
    ctx.beginPath(); ctx.arc(HALF_W, HALF_W, state.stormRadius, 0, TAU); ctx.stroke();
    ctx.restore();
  }

  // Aperçu fantôme 3D du bâtiment à poser (uniquement quand un VCS est sélectionné)
  if (buildMode) {
    const def = BUILDINGS[buildMode];
    const check = canPlaceBuilding(state, myId, buildMode, mouse.wx, mouse.wy);
    const me = state.players.find((p) => p.id === myId);
    const gx = check.snapX ?? mouse.wx, gy = check.snapY ?? mouse.wy;
    ctx.save();
    if (def.range) {
      ctx.strokeStyle = check.ok ? '#2fbf71' : '#ff4b2b';
      ctx.lineWidth = 2.5; ctx.setLineDash([8, 6]);
      ctx.beginPath(); ctx.arc(gx, gy, def.range, 0, TAU); ctx.stroke();
      ctx.setLineDash([]);
    }
    ctx.globalAlpha = 0.74;
    drawBuilding(ctx, { kind: buildMode, x: gx, y: gy, radius: def.radius, hp: def.hp, maxHp: def.hp, aimA: 0 }, check.ok ? (me ? me.color : '#2fbf71') : '#ff4b2b', false, now, false);
    ctx.globalAlpha = 1;
    ctx.strokeStyle = check.ok ? '#2fbf71' : '#ff4b2b';
    ctx.lineWidth = 3.5;
    ctx.beginPath(); ctx.arc(gx, gy, def.radius + 4, 0, TAU); ctx.stroke();
    ctx.restore();
  } else if (orderCursor === 'scan') {
    ctx.save();
    ctx.strokeStyle = '#1fc7c1'; ctx.fillStyle = 'rgba(31, 199, 193, 0.15)'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(mouse.wx, mouse.wy, 380, 0, TAU); ctx.fill(); ctx.stroke();
    ctx.restore();
  }

  if (mouse.down && mouse.dragStart) {
    ctx.save();
    ctx.strokeStyle = '#2fbf71';
    ctx.fillStyle = 'rgba(47, 191, 113, 0.16)';
    ctx.lineWidth = 2 / cam.z;
    const rx = Math.min(mouse.dragStart.wx, mouse.wx);
    const ry = Math.min(mouse.dragStart.wy, mouse.wy);
    const rw = Math.abs(mouse.wx - mouse.dragStart.wx);
    const rh = Math.abs(mouse.wy - mouse.dragStart.wy);
    ctx.fillRect(rx, ry, rw, rh);
    ctx.strokeRect(rx, ry, rw, rh);
    ctx.restore();
  }

  ctx.restore();
  renderMinimap();
}

function renderMinimap() {
  if (!state) return;
  const mw = miniCvs.width, mh = miniCvs.height;
  const sx = mw / WORLD_SIZE, sy = mh / WORLD_SIZE;
  if (terrainCanvas) miniCtx.drawImage(terrainCanvas, 0, 0, mw, mh);

  for (const m of MINERAL_NODES) {
    miniCtx.fillStyle = m.rich ? '#ffc531' : '#1fc7c1';
    miniCtx.fillRect(m.x * sx - 1.5, m.y * sy - 1.5, 3, 3);
  }
  for (const b of state.buildings) {
    if (b.hp <= 0) continue;
    if (b.owner !== myId && !isVisibleToMe(b.x, b.y)) continue;
    const owner = state.players.find((p) => p.id === b.owner);
    miniCtx.fillStyle = owner ? owner.color : '#fff';
    const sz = b.kind === 'hq' ? 6 : 4;
    miniCtx.fillRect(b.x * sx - sz / 2, b.y * sy - sz / 2, sz, sz);
  }
  for (const u of state.units) {
    if (u.hp <= 0) continue;
    if (u.owner !== myId && !isVisibleToMe(u.x, u.y)) continue;
    const owner = state.players.find((p) => p.id === u.owner);
    miniCtx.fillStyle = owner ? owner.color : '#fff';
    miniCtx.fillRect(u.x * sx - 1.5, u.y * sy - 1.5, 2.5, 2.5);
  }
  miniCtx.drawImage(fogCanvas, 0, 0, mw, mh);

  const vw = (W / cam.z) * sx, vh = (H / cam.z) * sy;
  miniCtx.strokeStyle = '#fff8ea';
  miniCtx.lineWidth = 1.6;
  miniCtx.strokeRect(cam.x * sx - vw / 2, cam.y * sy - vh / 2, vw, vh);
}

/* ============================================================================
   DÉMARRAGE DE PARTIE & SYNCHRONISATION RÉSEAU (HUB BRIDGE)
   ============================================================================ */
let lastBootInfo = null;
let tickInterval = null;
let botInterval = null;

buildTerrainCanvas();

function startMatch(info) {
  lastBootInfo = info;
  reportedResult = false;
  selectedUnits.clear();
  selectedBlds.clear();
  buildMode = null;
  orderCursor = null;
  exploredGrid.fill(0);
  craters = [];
  particles = [];
  shockwaves = [];
  projectiles = [];
  beams = [];
  orderMarkers = [];

  clearInterval(tickInterval);
  clearInterval(botInterval);
  Sfx.wake();

  const H = window.HubBridge;
  role = H && H.embedded ? info.role : 'solo';
  myId = H && H.embedded ? info.myId : 0;

  if (role === 'guest') {
    H.send('host', { t: 'sync' });
    return;
  }

  const settings = (info && info.settings) || { mode: 'ffa', pace: 'standard', bots: 1, level: 'normal' };
  const humans = H && H.embedded && Array.isArray(H.players) && H.players.length
    ? H.players.map((p) => ({ id: p.id, name: p.name, color: p.color, bot: false }))
    : [{ id: 0, name: 'Commandant', color: PALETTE[0], bot: false }];

  const roster = [...humans];
  const wantBots = role === 'solo'
    ? Math.max(1, Math.min(3, Number(settings.bots ?? 1)))
    : Math.max(0, Math.min(Number(settings.bots ?? 1), 4 - roster.length));
  const finalBots = roster.length + wantBots < 2 ? 2 - roster.length : wantBots;
  const usedColors = new Set(roster.map((p) => p.color));

  for (let k = 0; k < finalBots && roster.length < 4; k++) {
    const col = PALETTE.find((c) => !usedColors.has(c)) || PALETTE[roster.length % PALETTE.length];
    usedColors.add(col);
    roster.push({ id: 100 + k, name: BOT_NAMES[k], color: col, bot: true });
  }

  state = createInitialState(roster, settings);
  centerOnMyHq();
  renderConsoleUI(true);
  updateHudUI();

  if (role === 'host' && H && H.embedded) {
    H.send('all', { t: 'st', s: state, fx: [] });
  }

  tickInterval = setInterval(() => {
    if (!state || state.over) return;
    const fx = [];
    stepWorld(state, TICK_DT, fx);
    handleFxEvents(fx);
    if (role === 'host' && H && H.embedded) {
      H.send('all', { t: 'st', s: state, fx });
    }
  }, 1000 / TICK_RATE);

  const botEvery = settings.level === 'expert' ? 850 : settings.level === 'facile' ? 2000 : 1250;
  botInterval = setInterval(() => {
    if (!state || state.over) return;
    const fx = [];
    runBots(state, fx);
    handleFxEvents(fx);
  }, botEvery);
}

if (window.HubBridge && HubBridge.embedded) {
  let centeredOnce = false;
  HubBridge.on('init', (info) => {
    startMatch(info);
    HubBridge.signalReady();
  });
  HubBridge.on('msg', (from, m) => {
    if (!m || typeof m !== 'object') return;
    if (role === 'host') {
      if (m.t === 'sync' && state) {
        HubBridge.send(from, { t: 'st', s: state, fx: [] });
      } else if (m.t === 'cmd' && m.cmd) {
        const fx = [];
        executeCommand(state, from, m.cmd, fx);
        handleFxEvents(fx);
      }
    } else if (role === 'guest' && from === HubBridge.info.hostId) {
      if (m.t === 'st' && m.s) {
        state = m.s;
        if (!centeredOnce) {
          centeredOnce = true;
          centerOnMyHq();
          renderConsoleUI(true);
        }
        if (m.fx) handleFxEvents(m.fx);
      }
    }
  });
} else {
  startMatch({ role: 'solo', myId: 0, settings: { mode: 'ffa', pace: 'standard', bots: 1, level: 'normal' } });
}

let lastFrame = performance.now();
function loop(now) {
  const dt = Math.min(0.05, Math.max(0.001, (now - lastFrame) / 1000));
  lastFrame = now;
  renderWorld(dt, now);
  updateHudUI();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
