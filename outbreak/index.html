<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Outbreak : Secteur Zéro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Chakra+Petch:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="game"></canvas>

<div id="hud" hidden>
  <div class="hud-tl">
    <div class="room card"><small id="roomN">SALLE 1/7</small><b id="roomName">Sas</b></div>
    <div class="status card" id="status"></div>
  </div>
  <div class="hud-tr">
    <div class="card stats"><span title="Score de l'escouade">★ <b id="score">0</b></span><span title="Zombies éliminés">☠ <b id="kills">0</b></span><span title="Temps">⏱ <b id="clock">0:00</b></span></div>
    <button class="icon card" id="btnMute" title="Son (M)">🔊</button>
    <button class="icon card" id="btnMenu" title="Menu (Échap)">☰</button>
  </div>
  <div class="boss" id="boss" hidden><span>☣ SPÉCIMEN ZÉRO</span><div class="bar"><i id="bossBar"></i></div></div>
  <div class="team" id="team"></div>
  <div class="me card" id="mePanel">
    <div class="row"><b id="meName">Moi</b><span class="dash" id="dash"></span><span class="nades" id="nades"></span></div>
    <div class="bar hp"><i id="hpBar"></i><span id="hpTxt">100</span></div>
    <div class="bar ar"><i id="arBar"></i><span id="arTxt">25</span></div>
    <div class="abil" id="abil"></div>
    <div class="perks" id="perks"></div>
  </div>
  <div class="weapons" id="weapons"></div>
  <div class="prompt" id="prompt" hidden></div>
  <div class="toast" id="toast"></div>
  <div class="offers" id="offers" hidden></div>
  <div class="tbtns" id="tbtns"><button data-a="use" title="Relever / prendre">✋</button><button data-a="sw" title="Changer d'arme">🔫</button><button data-a="reload" title="Recharger">🔄</button><button data-a="nade" title="Grenade">💣</button><button data-a="dash" title="Roulade">🌀</button><button data-a="ab" title="Capacité">⭐</button></div>
</div>

<div id="screen" class="screen"></div>

<script src="../shared/bridge.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
