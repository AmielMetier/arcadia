<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Site Noir</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="sitenoir.css">
</head>
<body>
<div id="stage"></div>

<div id="hud" hidden>
  <div class="vig"></div>
  <div class="locker" id="locker" hidden></div>
  <div class="hurt" id="hurt"></div>
  <div class="flash" id="flash"></div>

  <div class="cctv" id="cctv" hidden><div class="scan"></div><b id="cctvLabel"></b><span class="rec">● REC</span><span class="how"><kbd>←</kbd><kbd>→</kbd> caméra · <kbd>E</kbd> quitter</span></div>

  <div class="cross" aria-hidden="true"></div>
  <div class="ring" id="ring"></div>
  <div class="pings" id="pings"></div>
  <div class="scanbar" id="scan" hidden><i></i><span>Relevé en cours</span></div>

  <div class="team" id="team"></div>
  <div class="top"><div class="clock" id="clock"></div><div class="goal" id="goal"></div><div class="goal2" id="goal2" hidden></div><div class="guide" id="guide" hidden><i id="gArrow"></i><span id="gDist"></span></div><div class="steps" id="steps"></div></div>
  <div class="feed" id="feed"></div>
  <div class="banner" id="banner" hidden></div>
  <div class="prompt" id="prompt" hidden><span id="ptxt"></span></div>
  <div class="toast" id="toast" hidden></div>
  <div class="spec" id="spec" hidden></div>
  <div class="lockhint" id="lockHint" hidden>Clique pour prendre le contrôle de la vue</div>
  <div class="card" id="card" hidden></div>

  <div class="hint" id="hint" hidden></div>
  <div class="bars" id="bars"></div>
  <div class="slots" id="slots"></div>
  <canvas class="map" id="map" hidden></canvas>
  <div class="stick" id="stick" hidden><i></i></div>

  <div class="tr"><button class="icon" id="btnSet" title="Réglages" aria-label="Réglages"></button><button class="icon" id="btnMenu" title="Menu (Échap)" aria-label="Menu">☰</button></div>
  <div class="tbtns" id="tbtns">
    <div class="col"><button data-a="crouch" aria-label="S'accroupir">🧎<small>Bas</small></button><button data-a="run" aria-label="Courir">🏃<small>Courir</small></button><button data-a="torch" class="s" aria-label="Lampe">🔦<small>Lampe</small></button></div>
    <div class="col s"><button data-a="next" aria-label="Case suivante">🔁<small>Case</small></button><button data-a="reload" aria-label="Pile">🔋<small>Pile</small></button></div>
    <div class="col m"><button data-a="a1" aria-label="Coupure">💡</button><button data-a="a2" aria-label="Blocage">🔒</button><button data-a="a3" aria-label="Casser la caméra">📵</button><button data-a="reload" aria-label="Hurlement">😱</button></div>
    <div class="col"><button data-a="use" aria-label="Utiliser">✋<small>Utiliser</small></button><button data-a="fire" class="big" aria-label="Objet ou griffes">🎯<small>Action</small></button></div>
  </div>
</div>

<div id="screen" class="screen"></div>

<script src="../shared/bridge.js"></script>
<script src="../shared/volume.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
