<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Battle royale</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,700;0,800;0,900;1,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="royale.css">
</head>
<body>
<div id="stage"></div>

<div id="hud" hidden>
  <div class="cross" aria-hidden="true"></div>
  <div class="mapframe">
    <canvas id="mini" aria-label="Minicarte"></canvas>
    <div class="place" id="place"></div>
  </div>
  <div class="phase"><b>Exploration</b><span>Phase 1 · l'île, sans combat</span></div>
  <div class="hints" id="hints"><kbd>ZQSD</kbd> bouger · <kbd>Espace</kbd> sauter · <kbd>Maj</kbd> sprint · <kbd>Ctrl</kbd> accroupi · <kbd>M</kbd> carte · <kbd>H</kbd> masquer</div>
  <div class="fps" id="fps" hidden></div>
</div>

<div id="bigmap" hidden>
  <canvas aria-label="Carte de l'île"></canvas>
  <div class="maphint">Clique sur la carte pour t'y rendre · <kbd>M</kbd> pour fermer</div>
</div>

<div id="screen" class="screen">
  <div class="panel">
    <div id="load">
      <p class="eyebrow">Battle royale</p>
      <h1>L'île se prépare…</h1>
      <div class="bar"><i id="loadBar"></i></div>
      <p class="lede" id="loadTxt">Chargement</p>
    </div>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script src="../shared/bridge.js"></script>
<script src="../shared/profile.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
