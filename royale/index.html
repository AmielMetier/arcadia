<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Island Rush</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,700;0,800;0,900;1,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="royale.css">
</head>
<body>
<div id="stage"></div>

<div id="hud" hidden>
  <div class="cross" id="cross" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
  <div class="hitm" id="hitm" aria-hidden="true"></div>
  <div class="prompt" id="prompt" hidden></div>
  <div class="gauge" id="gauge" hidden><span></span><b><i></i></b></div>
  <div class="structhp" id="structhp" hidden><b><i></i></b><span></span></div>
  <div class="gain" id="gain"></div>
  <div class="buildbar" id="buildbar" hidden></div>
  <div class="mapframe">
    <canvas id="mini" aria-label="Minicarte"></canvas>
    <div class="place" id="place"></div>
    <div class="stats" id="stats"></div>
    <div class="storm" id="storm" hidden></div>
    <div class="feed" id="feed"></div>
  </div>
  <div class="phase" id="phase"><b>Island Rush</b><span id="phaseTxt"></span></div>
  <div class="bottom">
    <div class="bars" id="bars">
      <div class="sh"><i></i><b>0</b></div>
      <div class="hp"><i></i><b>100</b></div>
    </div>
    <div class="invwrap"><div class="heldname" id="heldname"></div><div class="inv" id="inv"></div></div>
    <div class="ammo" id="ammo" hidden></div>
  </div>
  <div class="res" id="res"></div>
  <div class="hints" id="hints"><kbd>ZQSD</kbd> bouger · <kbd>Espace</kbd> sauter · <kbd>Clic</kbd> tirer · <kbd>Clic droit</kbd> viser · <kbd>1-5</kbd> objets · <kbd>R</kbd> recharger · <kbd>E</kbd> ouvrir, ramasser · <kbd>X</kbd> pioche · <kbd>F</kbd><kbd>V</kbd><kbd>C</kbd> construire · <kbd>M</kbd> carte · <kbd>H</kbd> masquer</div>
  <div class="fps" id="fps" hidden></div>
  <div id="dmgnums"></div>
  <div id="dmgdir"></div>
  <div class="center" id="center"></div>
  <div class="spect" id="spect" hidden></div>
  <div class="scope" id="scope" hidden></div>
  <div class="stormtint" id="stormtint"></div>
</div>

<div id="bigmap" hidden>
  <canvas aria-label="Carte de l'île"></canvas>
  <div class="maphint">Clique sur la carte pour t'y rendre · <kbd>M</kbd> pour fermer</div>
</div>

<div id="screen" class="screen">
  <div class="panel">
    <div id="load">
      <p class="eyebrow">Battle royale</p>
      <h1>L'île se prépare…</h1>
      <div class="bar"><i id="loadBar"></i></div>
      <p class="lede" id="loadTxt">Chargement</p>
    </div>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script src="../shared/bridge.js"></script>
<script src="../shared/profile.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
