<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Game Hub — Duo Drift et DavidSimulator</title>
<meta name="description" content="Jeux en ligne entre potes, directement dans le navigateur : Duo Drift et DavidSimulator.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Chakra+Petch:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="hub/hub.css">
</head>
<body>

<!-- ACCUEIL -->
<section class="screen on" id="home">
  <div class="home">
    <div>
      <h1 class="logo">GAME<br><span>HUB</span></h1>
      <p class="tag">Un salon, tes potes, et le jeu de ton choix. Rien à installer.</p>
      <div class="shelf" id="shelf"></div>
    </div>
    <div class="card">
      <div class="badge">P2P · jusqu'à 6</div>
      <label class="lbl" for="name">Ton pseudo</label>
      <input type="text" id="name" maxlength="12" autocomplete="off" spellcheck="false" placeholder="Pilote">
      <div class="lbl">Ta couleur</div>
      <div class="swatches" id="swatches"></div>
      <div style="height:18px"></div>
      <button class="btn block big" id="btnHost">Créer un salon</button>
      <div class="row" style="margin-top:12px">
        <input type="text" id="joinCode" maxlength="4" autocomplete="off" spellcheck="false" placeholder="CODE"
          style="text-transform:uppercase;letter-spacing:4px;text-align:center;font-family:Bungee,Impact,sans-serif">
        <button class="btn yellow" id="btnJoin">Rejoindre</button>
      </div>
      <div class="err" id="homeErr"></div>
      <button class="btn ghost block" id="btnSolo">Jouer seul</button>
    </div>
  </div>
  <div class="credit">by <b>Amiel</b> and <b>Claude</b> · <span id="ver"></span></div>
</section>

<!-- SALON -->
<section class="screen" id="room">
  <div class="topbar">
    <div class="logo">GAME <span>HUB</span></div>
    <div class="code" id="codeBox"><div><small>Code du salon</small><br><b id="code">----</b></div>
      <button class="btn small yellow" id="btnCopy">Copier le lien</button></div>
    <div class="spacer"></div>
    <button class="btn small ghost" id="btnLeave">Quitter</button>
  </div>
  <div class="room">
    <div class="card">
      <h2>Joueurs</h2>
      <div class="players" id="players"></div>
      <div class="chat" id="chatBox">
        <div class="log" id="chatLog" aria-live="polite"></div>
        <form id="chatForm"><input type="text" id="chatIn" maxlength="140" placeholder="Message…" autocomplete="off"><button class="btn small">OK</button></form>
      </div>
    </div>
    <div>
      <div class="banner" id="runBanner" hidden><span id="runText"></span><button class="btn small yellow" id="btnRejoin">Revenir dans la partie</button></div>
      <div class="games" id="games"></div>
      <div class="card launch" id="launchBox"></div>
    </div>
  </div>
</section>

<!-- JEU -->
<section class="screen" id="play"></section>

<script src="shared/vendor/peerjs.min.js"></script>
<script src="shared/net.js"></script>
<script src="shared/room.js"></script>
<script src="shared/profile.js"></script>
<script src="hub/games.js"></script>
<script src="hub/hub.js"></script>
</body>
</html>
