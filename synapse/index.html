<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Synapse · Réflexes et rythme</title>
<link rel="stylesheet" href="synapse.css">
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<header class="bar">
  <span class="brand">Synapse</span>
  <div id="hud" class="hud" hidden>
    <span class="hud-mode" id="hMode"></span>
    <span class="hud-i" id="hLevelBox">Niveau <b id="hLevel">1</b></span>
    <span class="hud-i">Score <b id="hScore">0</b></span>
    <span class="hud-i">Série <b id="hStreak">0</b></span>
    <span class="hud-i">Temps <b id="hTime">0 s</b></span>
  </div>
  <div class="tools">
    <button type="button" id="tquit" class="tool" hidden title="Retour au salon">Quitter</button>
    <button type="button" id="tpause" class="tool" hidden>Pause</button>
    <button type="button" id="tset" class="tool" title="Réglages" aria-label="Réglages"><span aria-hidden="true">⚙️</span> Réglages</button>
  </div>
</header>
<main id="screen"></main>
<script src="../shared/logger.js"></script>
<script src="../shared/bridge.js"></script>
<script src="../shared/volume.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
